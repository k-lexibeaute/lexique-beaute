","note":"Référence culturelle humoristique et péjorative.","mean":"너무 진하고 두껍게 그려진 눈썹","ex":"심이 연해서 짱구눈썹이 될 걱정이 없다.","exfr":"La mine est douce, pas de risque d'avoir des sourcils épais façon « Shin-chan ».","fr":"sourcils « Shin-chan »","frpos":"n.m.pl.","frdef":"Sourcils trop épais et foncés, comme ceux du personnage Crayon Shin-chan (짱구)."},{"id":"BT1580","k":"h","cat":"eye","w":"파우더 처리","rom":"paudeo cheori","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"파우더(powder)+처리","memofr":"Locution : 파우더 (angl. powder) + 처리 (traitement)","note":"Geste technique de fixation.","mean":"지워지지 않게 파우더로 덧발라 고정함","ex":"이 펜슬은 잘 지워져서 파우더 처리를 꼭 해 줘야 한다.","exfr":"Ce crayon s'efface facilement, il faut absolument le fixer à la poudre.","fr":"fixer à la poudre","frpos":"loc.v.","frdef":"Poser de la poudre sur un produit pour le fixer."},{"id":"BT1540","k":"h","cat":"eye","w":"펄땡이","rom":"peolttaengi","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"펄(pearl)+-땡이(비하·친근 접미사)","memofr":"Dérivé : 펄 (angl. pearl) + -땡이 (suffixe familier, péjoratif ou affectueux)","note":"Registre très familier.","mean":"굵거나 거슬리는 펄 입자","ex":"거슬리는 펄땡이 없이 고운 펄만 들어 있다.","exfr":"Il ne contient que des nacres fines, sans grosses paillettes gênantes.","fr":"grosse paillette gênante","frpos":"n.f.","frdef":"Argot pour les grosses particules nacrées.","par":"펄이 날리다","rel":"관련어(참고)"},{"id":"BT1469","k":"h","cat":"lip","w":"물빛광","rom":"mulbitgwang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"물빛+광","memofr":"Composé : 물빛 (couleur de l'eau) + 광 (éclat)","note":"Formule publicitaire poétique.","mean":"물에 젖은 듯한 투명한 광택","ex":"가벼운 물빛광에 착색이 약하게 남는 틴트다.","exfr":"Un tint à la légère brillance aqueuse, qui laisse une faible coloration.","fr":"brillance aqueuse","frpos":"n.f.","frdef":"Brillance transparente comme de l'eau.","par":"물광","rel":"관련어(참고)"},{"id":"BT1470","k":"h","cat":"lip","w":"물틴트","rom":"multinteu","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"물+틴트(tint)","memofr":"Composé : 물 (eau) + 틴트 (angl. tint)","note":"Synonyme de 워터틴트.","mean":"묽은 물 제형 틴트","ex":"물틴트인데 바르면 매트하게 마무리된다.","exfr":"C'est un tint aqueux, mais il sèche en fini mat.","fr":"tint aqueux","frpos":"n.m.","frdef":"Tint très liquide à base d'eau.","par":"틴트","rel":"하위어(참고)"},{"id":"BT1471","k":"h","cat":"lip","w":"블러틴트","rom":"beulleotinteu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"blur+tint","memofr":"Locution : 블러 (angl. blur) + 틴트 (angl. tint)","note":"Produit associé au style 블러립.","mean":"경계를 흐리게 펴 바르는 매트 계열 틴트","ex":"제일 좋아하는 블러틴트라 여러 개를 쟁여 두었다.","exfr":"C'est mon tint flouté préféré, j'en ai fait des réserves.","fr":"tint flouté","frpos":"n.m.","frdef":"Tint mat qui donne un effet flou aux lèvres.","par":"틴트","rel":"하위어(참고)"},{"id":"BT1565","k":"h","cat":"hair","w":"두피 쿨링","rom":"dupi kulling","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"두피+쿨링(cooling)","memofr":"Locution : 두피 (cuir chevelu) + 쿨링 (angl. cooling)","note":"Souvent obtenu avec du menthol.","mean":"샴푸 시 두피가 시원해지는 효과","ex":"민트 샴푸라 감을 때 두피 쿨링 효과가 확실하다.","exfr":"C'est un shampoing à la menthe : la fraîcheur du cuir chevelu se sent nettement au lavage.","fr":"fraîcheur du cuir chevelu","frpos":"n.f.","frdef":"Sensation de fraîcheur sur le crâne au shampoing.","par":"쿨링","rel":"관련어(참고)"},{"id":"BT1572","k":"h","cat":"hair","w":"멘톨","rom":"mentol","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"menthol 차용","memofr":"Emprunt à l'anglais menthol","note":"Nom INCI : Menthol.","mean":"청량감을 주는 박하 유래 성분","ex":"멘톨이 들어 있어 바르면 화하게 시원하다.","exfr":"Il contient du menthol, alors il procure une fraîcheur mentholée à l'application.","fr":"menthol","frpos":"n.m.","frdef":"Composé rafraîchissant issu de la menthe.","ing":"Composé procurant une sensation de fraîcheur sur la peau ou le cuir chevelu.","inci":"Menthol"},{"id":"BT1514","k":"h","cat":"hair","w":"물미역 머리","rom":"mulmiyeok meori","pos":"명사","unit":"구","eo":"고유어","form":"구","memo":"물미역+머리","memofr":"Locution : 물미역 (algue fraîche) + 머리 (cheveux)","note":"Image culinaire coréenne, ici valorisante.","mean":"트리트먼트 후 미역처럼 매끄럽고 부드러운 머릿결","ex":"트리트먼트를 십 분 올려 두었더니 물미역 머리가 되었다.","exfr":"J'ai laissé le soin dix minutes, et mes cheveux sont devenus lisses et luisants comme une « algue mouillée ».","fr":"cheveux « algue mouillée »","frpos":"n.m.pl.","frdef":"Cheveux très lisses et glissants après un soin, comparés à une algue mouillée.","par":"손상모","rel":"관련어(참고)"},{"id":"BT1519","k":"h","cat":"hair","w":"발향","rom":"balhyang","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"발+향","memofr":"Composé : 발 (émettre) + 향 (parfum)","note":"Critère d'évaluation des parfums et des soins parfumés.","mean":"향이 퍼지고 느껴지는 정도","ex":"이 향수는 발향이 은은해서 사무실에서 뿌리기 좋다.","exfr":"Ce parfum a une diffusion discrète, idéal à porter au bureau.","fr":"diffusion du parfum","frpos":"n.f.","frdef":"Façon dont le parfum se diffuse et se sent."},{"id":"BT1567","k":"h","cat":"hair","w":"캡슐트리트먼트","rom":"kaepsyulteuriteumeonteu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"capsule+treatment","memofr":"Composé : 캡슐 (angl. capsule) + 트리트먼트 (angl. treatment)","note":"En coréen, 트리트먼트 désigne un soin capillaire.","mean":"캡슐 형태 영양 성분이 든 트리트먼트","ex":"캡슐트리트먼트는 캡슐이 터지면서 영양이 퍼진다.","exfr":"Avec le soin capillaire à capsules, les capsules éclatent et libèrent leurs actifs.","fr":"soin capillaire à capsules","frpos":"n.m.","frdef":"Soin capillaire contenant des capsules d'actifs."},{"id":"BT1564","k":"h","cat":"hair","w":"퐁신하다","rom":"pongsinhada","pos":"형용사","unit":"단어","eo":"고유어","form":"파생어","memo":"퐁신(어근)+-하다 / 신조어(표준국어대사전 미등재)","memofr":"Dérivé : 퐁신 (racine expressive « moelleux ») + -하다 (suffixe adjectival)","note":"Néologisme absent du dictionnaire de référence ; sonorité ludique.","mean":"머리카락이 가볍고 볼륨 있게 부푼 느낌","ex":"드라이를 하고 나니 머리가 퐁신하게 살아났다.","exfr":"Après le brushing, mes cheveux ont retrouvé du gonflant et de la légèreté.","fr":"gonflant et léger (cheveux)","frpos":"loc.adj.","frdef":"Cheveux aériens et pleins de volume."},{"id":"BT1222","k":"h","cat":"mask","w":"눈 밑 꺼짐 케어","rom":"nun mit kkeojim keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"눈밑+꺼짐(꺼지다+-ㅁ)+케어(care)","memofr":"Locution : 눈 밑 (sous l'œil) + 꺼짐 (affaissement) + 케어 (angl. care)","note":"Préoccupation fréquente du marketing anti-âge.","mean":"눈 밑이 꺼져 보이는 것을 관리함.","ex":"눈 밑이 꺼져 보여서 눈 밑 꺼짐 케어 패치를 붙이고 잔다.","exfr":"Mes cernes paraissaient creusés, alors je dors avec un patch de soin du creux sous les yeux.","fr":"soin du creux sous les yeux","frpos":"n.m.","frdef":"Soin ciblant le creux ou l'affaissement sous l'œil."},{"id":"BT1220","k":"h","cat":"mask","w":"대왕 패치","rom":"daewang paechi","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"대왕(접두사적: 매우 큰)+패치(patch)","memofr":"Locution : 대왕 (« grand roi », préfixe d'intensité) + 패치 (angl. patch)","note":"대왕- signifie « géant » dans la langue familière.","mean":"넓은 부위를 덮는 큰 패치.","ex":"이마와 볼을 한 번에 덮는 대왕 패치를 붙였다.","exfr":"J'ai posé un patch géant qui couvre en une fois le front et les joues.","fr":"patch géant","frpos":"n.m.","frdef":"Patch de grande taille couvrant une large zone.","par":"트러블 패치","rel":"관련어(참고)"},{"id":"BT1191","k":"h","cat":"mask","w":"돼지코 팩","rom":"dwaejiko paek","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"돼지코+팩(pack)","memofr":"Locution : 돼지코 (groin) + 팩 (angl. pack)","note":"Image humoristique.","mean":"코에 붙여 블랙헤드를 떼어내는 팩(모양을 돼지코에 빗댐).","ex":"돼지코 팩을 떼어 내니 블랙헤드가 묻어 나왔다.","exfr":"En retirant le patch nez « groin », les points noirs sont venus avec.","fr":"patch nez « groin »","frpos":"n.m.","frdef":"Patch anti-points noirs pour le nez (évoque un groin de cochon).","par":"코 팩","rel":"하위어(참고)"},{"id":"BT1180","k":"h","cat":"mask","w":"랩핑필름","rom":"raeppingpilleum","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"wrapping+film","memofr":"Composé : 랩핑 (angl. wrapping) + 필름 (angl. film)","note":"Format récent de masque.","mean":"피부를 랩으로 감싸듯 덮는 필름 마스크.","ex":"랩핑필름을 턱선에 붙이고 자면 아침에 탄탄한 느낌이 든다.","exfr":"Si je dors avec un film « wrapping » sur la mâchoire, la peau paraît plus ferme le matin.","fr":"film « wrapping »","frpos":"n.m.","frdef":"Masque film qui enveloppe la peau comme du film plastique.","par":"마스크 팩","rel":"하위어(참고)"},{"id":"BT1163","k":"h","cat":"mask","w":"마이크로니들","rom":"maikeuronideul","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"micro+needle","memofr":"Composé : 마이크로 (angl. micro) + 니들 (angl. needle)","note":"En Corée, la publicité ne peut pas présenter ces produits comme des médicaments.","mean":"유효 성분을 각질층 아래로 전달한다는 기술. 의약품처럼 광고하면 위법이라고 기사가 설명.","ex":"마이크로니들 패치는 붙일 때 살짝 따끔거린다.","exfr":"Le patch à micro-aiguilles picote légèrement à la pose.","fr":"micro-aiguilles","frpos":"n.f.pl.","frdef":"Technologie de patch à micro-aiguilles qui délivrent des actifs.","ing":"피부에 붙이면 녹거나 박히는 미세 바늘 구조. 패치 형태로 유효 성분을 전달하는 기술.","inci":"Microneedle — 기술명","par":"스피큘","rel":"관련어(참고)"},{"id":"BT1190","k":"h","cat":"mask","w":"매끈결","rom":"maekkeungyeol","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"매끈(어근)+결","memofr":"Composé : 매끈 (racine « lisse ») + 결 (grain)","note":"Formule publicitaire.","mean":"매끈한 피부결.","ex":"버블팩을 하고 나니 매끈결이 살아났다.","exfr":"Après le masque bulles, j'ai retrouvé un grain de peau lisse.","fr":"grain de peau lisse","frpos":"n.m.","frdef":"Formule marketing: texture de peau lissée."},{"id":"BT1227","k":"h","cat":"mask","w":"멜팅 패치","rom":"melting paechi","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"melting+patch","memofr":"Locution : 멜팅 (angl. melting) + 패치 (angl. patch)","note":"Technologie de micro-aiguilles solubles.","mean":"미세 바늘이 피부에서 녹는 패치.","ex":"멜팅 패치를 자기 전에 붙이고 아침에 뗐다.","exfr":"J'ai posé un patch fondant avant de dormir et je l'ai retiré le matin.","fr":"patch fondant","frpos":"n.m.","frdef":"Patch dont les micro-aiguilles fondent dans la peau.","par":"스피큘","rel":"관련어(참고)"},{"id":"BT1548","k":"h","cat":"mask","w":"모공 패드","rom":"mogong paedeu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"모공+패드(pad)","memofr":"Locution : 모공 (pores) + 패드 (angl. pad)","note":"Format très populaire en Corée.","mean":"모공·피지 관리용 토너패드","ex":"아침마다 모공 패드로 코와 이마를 닦아 낸다.","exfr":"Chaque matin, j'essuie le nez et le front avec un disque pour les pores.","fr":"disques pour les pores","frpos":"n.m.pl.","frdef":"Disques imbibés ciblant pores et sébum.","par":"토너 패드","rel":"하위어(참고)"},{"id":"BT1154","k":"h","cat":"mask","w":"모델링 팩","rom":"modelling paek","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"modeling+pack","memofr":"Locution : 모델링 (angl. modeling) + 팩 (angl. pack)","note":"Masque d'institut ; en France, on parle de « masque peel-off à l'alginate ».","mean":"가루에 물을 섞어 고무처럼 굳히는 팩.","ex":"모델링 팩은 가루에 물을 넣고 빠르게 저어 굳기 전에 바른다.","exfr":"Pour le masque modelant, on mélange vite la poudre avec de l'eau et on l'applique avant qu'il ne durcisse.","fr":"masque modelant (alginate)","frpos":"n.m.","frdef":"Masque en poudre qui se mélange à l'eau et durcit en caoutchouc.","par":"마스크 팩","rel":"하위어(참고)"},{"id":"BT1194","k":"h","cat":"mask","w":"바이오셀룰로오스 코 팩","rom":"baiosellullooseu ko paek","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"biocellulose+코팩","memofr":"Locution : 바이오셀룰로오스 (angl. biocellulose) + 코 팩 (patch nez)","note":"Matériau de masque haut de gamme.","mean":"미생물 발효 셀룰로오스 소재의 코팩.","ex":"바이오셀룰로오스 코 팩은 코에 착 달라붙는다.","exfr":"Le patch nez en bio-cellulose adhère parfaitement au nez.","fr":"patch nez en bio-cellulose","frpos":"n.m.","frdef":"Patch nez en cellulose produite par fermentation bactérienne.","par":"코 팩","rel":"하위어(참고)"},{"id":"BT1203","k":"h","cat":"mask","w":"반갈패드","rom":"bangalpaedeu","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"반갈(「반으로 갈라」의 줄임)+패드(pad)","memofr":"Composé : 반갈 (de 반으로 갈라, « couper en deux ») + 패드 (angl. pad)","note":"Argot récent des fiches produit.","mean":"반으로 갈라 쓸 수 있는 패드.","ex":"반갈패드라서 한 장을 갈라 양쪽 볼에 올려 둔다.","exfr":"C'est un disque à couper en deux : je pose une moitié sur chaque joue.","fr":"disque à couper en deux","frpos":"n.m.","frdef":"Disque prédécoupé qu'on sépare en deux (« 반갈 » = moitié-couper).","par":"토너 패드","rel":"하위어(참고)"},{"id":"BT1225","k":"h","cat":"mask","w":"붙이는 아이크림","rom":"butineun aikeurim","pos":"명사","unit":"구","eo":"고유어","form":"구","memo":"붙이다(관형형)+아이크림(eye cream)","memofr":"Locution : 붙이는 (qu'on colle) + 아이크림 (angl. eye cream)","note":"Formule publicitaire.","mean":"아이크림처럼 눈가에 붙이는 패치.","ex":"붙이는 아이크림을 눈 밑에 붙이고 십오 분 뒤에 뗐다.","exfr":"J'ai posé une « crème contour des yeux à coller » sous les yeux et je l'ai retirée quinze minutes plus tard.","fr":"« crème contour des yeux à coller »","frpos":"n.f.","frdef":"Patchs yeux présentés comme une crème qu'on colle."},{"id":"BT1195","k":"h","cat":"mask","w":"블랙헤드 멜팅","rom":"beullaekhedeu melting","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"blackhead+melting","memofr":"Locution : 블랙헤드 (angl. blackhead) + 멜팅 (angl. melting)","note":"Formule publicitaire.","mean":"블랙헤드를 녹여낸다는 홍보 표현.","ex":"블랙헤드 멜팅 코팩을 붙이니 피지가 부드러워졌다.","exfr":"Avec un patch nez pour la dissolution des points noirs, le sébum s'est ramolli.","fr":"dissolution des points noirs","frpos":"n.f.","frdef":"Formule marketing: faire fondre les points noirs.","par":"피지 연화","rel":"관련어(참고)"},{"id":"BT1199","k":"h","cat":"mask","w":"세럼 패드","rom":"sereom paedeu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"serum+pad","memofr":"Locution : 세럼 (angl. serum) + 패드 (angl. pad)","note":"Format de soin en disque.","mean":"세럼을 적신 패드.","ex":"세럼 패드를 양 볼에 올려 두고 십 분 뒤 떼었다.","exfr":"J'ai posé des disques au sérum sur les joues et je les ai retirés dix minutes plus tard.","fr":"disques au sérum","frpos":"n.m.pl.","frdef":"Disques imbibés de sérum plutôt que de toner.","par":"토너 패드","rel":"하위어(참고)"},{"id":"BT1152","k":"h","cat":"mask","w":"수면 팩","rom":"sumyeon paek","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"수면+팩(pack)","memofr":"Locution : 수면 (sommeil) + 팩 (angl. pack)","note":"Synonyme coréen de 슬리핑 팩.","mean":"슬리핑 팩과 같은 말로 쓰임.","ex":"건조한 날에는 크림 대신 수면 팩을 바르고 잔다.","exfr":"Les jours secs, j'applique un masque de nuit à la place de la crème avant de dormir.","fr":"masque de nuit","frpos":"n.m.","frdef":"Synonyme de 슬리핑 팩: masque à garder toute la nuit."},{"id":"BT1560","k":"h","cat":"mask","w":"아젤라익산","rom":"ajellaiksan","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"아젤라익(azelaic)+산","memofr":"Composé : 아젤라익 (angl. azelaic) + 산 (acide)","note":"Actif utilisé aussi en dermatologie.","mean":"트러블·색소 관리에 쓰이는 산 성분","ex":"아젤라익산이 든 크림을 붉은 자국에 바른다.","exfr":"J'applique une crème à l'acide azélaïque sur les marques rouges.","fr":"acide azélaïque","frpos":"n.m.","frdef":"Acide utilisé contre l'acné et les rougeurs ; médicament à forte dose.","ing":"Acide azélaïque utilisé dans les soins pour ses propriétés kératorégulatrices.","inci":"Azelaic Acid / Potassium Azeloyl Diglycinate"},{"id":"BT1431","k":"h","cat":"mask","w":"앰플 팩","rom":"aempeul paek","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"ampoule+pack","memofr":"Locution : 앰플 (angl. ampoule) + 팩 (angl. pack)","note":"Masque en tissu imprégné d'un soin concentré.","mean":"앰플 성분을 담은 마스크팩","ex":"콜라겐 앰플 팩을 하고 나니 피부결이 정돈됐다.","exfr":"Après un masque à l'ampoule au collagène, mon grain de peau est plus net.","fr":"masque à l'ampoule","frpos":"n.m.","frdef":"Masque imbibé d'une ampoule concentrée.","par":"마스크 팩","rel":"하위어(참고)"},{"id":"BT1551","k":"h","cat":"mask","w":"엠보싱면","rom":"embosingmyeon","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"엠보싱(embossing)+면","memofr":"Composé : 엠보싱 (angl. embossing) + 면 (face, surface)","note":"Voir 엠보 패드.","mean":"각질 제거용으로 오돌토돌한 패드 면","ex":"패드의 엠보싱면으로 턱의 각질을 닦아 낸다.","exfr":"J'essuie les peaux mortes du menton avec la face gaufrée du disque.","fr":"face gaufrée (disque)","frpos":"n.f.","frdef":"Côté texturé d'un disque, pour exfolier.","par":"토너 패드","rel":"관련어(참고)"},{"id":"BT1205","k":"h","cat":"mask","w":"열감진정","rom":"yeolgamjinjeong","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"열감+진정","memofr":"Composé : 열감 (sensation de chaleur) + 진정 (apaisement)","note":"Formule publicitaire.","mean":"피부 열감을 가라앉힘.","ex":"운동 후 달아오른 얼굴에 열감진정 패드를 올렸다.","exfr":"Après le sport, j'ai posé des disques apaisants sur mon visage échauffé.","fr":"apaisement de l'échauffement","frpos":"n.m.","frdef":"Formule marketing: calmer une peau échauffée."},{"id":"BT1162","k":"h","cat":"mask","w":"이지컷","rom":"ijikeot","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"easy+cut","memofr":"Composé : 이지 (angl. easy) + 컷 (angl. cut)","note":"Jargon d'emballage.","mean":"포장을 손으로 쉽게 뜯을 수 있게 만든 절개 구조.","ex":"이지컷 포장이라 손에 물이 묻어도 쉽게 뜯긴다.","exfr":"L'emballage à découpe facile s'ouvre aisément, même avec les mains mouillées.","fr":"découpe facile (easy cut)","frpos":"n.f.","frdef":"Emballage ou masque prédécoupé facile à ouvrir."},{"id":"BT1229","k":"h","cat":"mask","w":"주름 패치","rom":"jureum paechi","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"주름+패치(patch)","memofr":"Locution : 주름 (rides) + 패치 (angl. patch)","note":"Format de soin ciblé.","mean":"주름 부위에 붙이는 패치.","ex":"웃을 때 생기는 눈가에 주름 패치를 붙이고 잤다.","exfr":"J'ai dormi avec des patchs anti-rides au coin des yeux, là où se forment les rides d'expression.","fr":"patch anti-rides","frpos":"n.m.","frdef":"Patch posé sur les rides (front, contour des yeux).","par":"트러블 패치","rel":"관련어(참고)"},{"id":"BT1424","k":"h","cat":"mask","w":"초밀착","rom":"chomilchak","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"초-(접두사)+밀착","memofr":"Dérivé : 초- (préfixe « super ») + 밀착 (adhérence)","note":"Le préfixe 초- est très productif dans la publicité.","mean":"피부에 매우 강하게 밀착됨","ex":"이 쿠션은 피부에 초밀착되어 오후에도 들뜨지 않는다.","exfr":"Ce cushion offre une adhérence extrême : même l'après-midi, il ne se soulève pas.","fr":"adhérence extrême","frpos":"n.f.","frdef":"Produit qui colle parfaitement à la peau.","par":"밀착력","rel":"관련어(참고)"},{"id":"BT1153","k":"h","cat":"mask","w":"코 팩","rom":"ko paek","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"코+팩(pack)","memofr":"Locution : 코 (nez) + 팩 (angl. pack)","note":"Voir 돼지코 팩.","mean":"코에 붙여 블랙헤드를 제거하는 팩.","ex":"코 팩을 떼어 내니 블랙헤드가 줄줄이 붙어 나왔다.","exfr":"En retirant le patch nez, les points noirs sont venus en masse.","fr":"patch nez","frpos":"n.m.","frdef":"Bande adhésive qui retire les points noirs du nez."},{"id":"BT1181","k":"h","cat":"mask","w":"크림 랩핑 마스크","rom":"keurim raepping maseukeu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"cream+wrapping+mask","memofr":"Locution : 크림 (angl. cream) + 랩핑 (angl. wrapping) + 마스크 (angl. mask)","note":"Format récent.","mean":"크림이 막을 씌우듯 감싸는 마스크.","ex":"크림 랩핑 마스크를 바르고 이십 분 뒤 닦아 냈다.","exfr":"J'ai appliqué un masque crème enveloppant et je l'ai essuyé vingt minutes plus tard.","fr":"masque crème enveloppant","frpos":"n.m.","frdef":"Masque-crème qui forme un film occlusif sur la peau.","par":"마스크 팩","rel":"하위어(참고)"},{"id":"BT1196","k":"h","cat":"mask","w":"토너 패드","rom":"toneo paedeu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"toner+pad","memofr":"Locution : 토너 (angl. toner) + 패드 (angl. pad)","note":"Format phare du marché coréen.","mean":"토너를 적신 패드.","ex":"아침에는 토너 패드로 얼굴을 한 번 닦아 낸다.","exfr":"Le matin, je m'essuie le visage une fois avec des disques imbibés de toner.","fr":"disques imbibés de toner","frpos":"n.m.pl.","frdef":"Disques pré-imbibés de toner, produit phare coréen (essuyer ou poser en masque)."},{"id":"BT1550","k":"h","cat":"mask","w":"팩토","rom":"paekto","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두음절어)","memo":"팩(pack)+토(너) 축약","memofr":"Abréviation syllabique : 팩 (angl. pack) + 토(너) (angl. toner)","note":"Argot des avis ; voir 토너 팩.","mean":"토너를 적신 패드·솜을 팩처럼 올려 두는 방법","ex":"일주일에 두세 번 토너를 적신 솜으로 팩토를 한다.","exfr":"Deux ou trois fois par semaine, je fais un masque au toner avec des cotons imbibés.","fr":"masque au toner (abrév.)","frpos":"n.m.","frdef":"Abréviation de « 팩처럼 쓰는 토너 »: cotons imbibés posés en masque.","par":"닦토","rel":"관련어(참고)"},{"id":"BT1179","k":"h","cat":"mask","w":"필름 마스크","rom":"pilleum maseukeu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"film+mask","memofr":"Locution : 필름 (angl. film) + 마스크 (angl. mask)","note":"Format de masque.","mean":"얇은 필름막을 형성하는 마스크.","ex":"필름 마스크를 바르고 마른 뒤 한 번에 떼어 냈다.","exfr":"J'ai appliqué un masque film et je l'ai retiré d'un coup une fois sec.","fr":"masque film","frpos":"n.m.","frdef":"Masque fin qui forme un film adhérent sur la peau.","par":"마스크 팩","rel":"하위어(참고)"},{"id":"BT1159","k":"h","cat":"mask","w":"하이드로겔 패치","rom":"haideurogel paechi","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"hydrogel+patch","memofr":"Locution : 하이드로겔 (angl. hydrogel) + 패치 (angl. patch)","note":"Format très courant pour le contour des yeux.","mean":"수분을 머금은 젤 소재 패치.","ex":"하이드로겔 패치는 붙이면 시원해서 눈 붓기에 좋다.","exfr":"Le patch hydrogel est rafraîchissant à la pose, parfait pour les yeux gonflés.","fr":"patch hydrogel","frpos":"n.m.","frdef":"Patch en gel gorgé d'eau et d'actifs (yeux, nez).","par":"트러블 패치","rel":"관련어(참고)"},{"id":"BT1422","k":"s","cat":"mask","w":"화장이 잘 먹다","rom":"hwajangi jal meokda","pos":"동사","unit":"구","eo":"혼종어","form":"구","memo":"화장이+잘+먹다(관용)","memofr":"Locution : 화장이 (le maquillage) + 잘 (bien) + 먹다 (« prendre »)","note":"Origine de l'abréviation 화잘먹 ; ici 먹다 ne signifie pas « manger ».","mean":"메이크업이 들뜨지 않고 피부에 잘 밀착되다","ex":"마스크팩을 하고 나니 확실히 화장이 잘 먹는다.","exfr":"Après le masque en tissu, le maquillage « prend » bien mieux.","fr":"le maquillage « prend » bien","frpos":"expr.","frdef":"Le maquillage adhère et se fond parfaitement à la peau (forme pleine de 화잘먹).","par":"화잘먹","rel":"원말"},{"id":"BT1301","k":"h","cat":"body","w":"Y존 케어","rom":"Yjon keeo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"Y존(Y zone)+케어(care)","memofr":"Locution : Y존 (zone Y) + 케어 (angl. care)","note":"Euphémisme publicitaire.","mean":"여성 외음부(Y존) 관리.","ex":"약산성 Y존 케어 제품으로 순하게 관리한다.","exfr":"J'utilise un soin intime au pH légèrement acide, en douceur.","fr":"soin intime","frpos":"n.m.","frdef":"Soin de la zone intime (« zone Y »)."},{"id":"BT1241","k":"h","cat":"body","w":"가드름","rom":"gadeureum","pos":"명사","unit":"단어","eo":"고유어","form":"축약어(혼성어)","memo":"가(슴)+(여)드름 혼성","memofr":"Mot-valise : 가(슴) (poitrine) + (여)드름 (acné)","note":"Même modèle que 등드름.","mean":"「가슴+여드름」의 혼성어. 가슴에 나는 여드름.","ex":"등드름과 가드름 관리용 바디워시를 쓰고 있다.","exfr":"J'utilise un gel douche pour l'acné du dos et du décolleté.","fr":"acné du décolleté","frpos":"n.f.","frdef":"Mot-valise: acné du décolleté (가슴 + 여드름).","par":"등드름","rel":"관련어(참고)"},{"id":"BT1307","k":"h","cat":"body","w":"데오 팩트","rom":"deo paekteu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"deo(dorant)+pact","memofr":"Locution : 데오 (angl. deo) + 팩트 (de l'angl. compact)","note":"Format typiquement coréen.","mean":"고체 파우더 형태의 데오드란트.","ex":"데오 팩트를 겨드랑이에 톡톡 두드려 땀 냄새를 막는다.","exfr":"Je tapote le déodorant poudre compacte sous les bras pour éviter les odeurs de transpiration.","fr":"déodorant poudre compacte","frpos":"n.m.","frdef":"Poudre déodorante pressée en boîtier."},{"id":"BT1308","k":"h","cat":"body","w":"데오티슈","rom":"deotisyu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"deo+tissue","memofr":"Composé : 데오 (angl. deo) + 티슈 (angl. tissue)","note":"Produit courant en Corée l'été.","mean":"땀 냄새 제거용 물티슈.","ex":"외출할 때 데오티슈로 땀을 닦으면 상쾌하다.","exfr":"En sortie, s'essuyer avec une lingette déodorante procure une sensation de fraîcheur.","fr":"lingettes déodorantes","frpos":"n.f.pl.","frdef":"Lingettes rafraîchissantes anti-odeur.","par":"데오 팩트","rel":"관련어(참고)"},{"id":"BT1240","k":"h","cat":"body","w":"등드름","rom":"deungdeureum","pos":"명사","unit":"단어","eo":"고유어","form":"축약어(혼성어)","memo":"등+(여)드름 혼성","memofr":"Mot-valise : 등 (dos) + (여)드름 (acné)","note":"Même modèle que 가드름.","mean":"「등+여드름」의 혼성어. 등에 나는 여드름.","ex":"여름만 되면 등드름이 올라와서 등 파인 옷을 못 입는다.","exfr":"Chaque été, j'ai de l'acné du dos et je ne peux pas porter de vêtements dos nu.","fr":"acné du dos (« bacne »)","frpos":"n.f.","frdef":"Mot-valise: acné du dos (등 + 여드름)."},{"id":"BT1346","k":"h","cat":"body","w":"바디미백","rom":"badimibaek","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"바디(body)+미백","memofr":"Composé : 바디 (angl. body) + 미백 (éclaircissement)","note":"Allégation sensible ; en France, on parlerait d'« éclat ».","mean":"몸 피부 톤을 밝게 관리함.","ex":"바디미백 크림을 팔꿈치와 무릎에 꾸준히 바른다.","exfr":"Pour l'éclaircissement corporel, j'applique régulièrement une crème sur les coudes et les genoux.","fr":"éclaircissement corporel","frpos":"n.m.","frdef":"Soin qui unifie et éclaircit la peau du corps."},{"id":"BT1331","k":"h","cat":"body","w":"발 허물 팩","rom":"bal heomul paek","pos":"명사","unit":"구","eo":"고유어","form":"구","memo":"발+허물+팩(pack)","memofr":"Locution : 발 (pied) + 허물 (mue) + 팩 (angl. pack)","note":"Image de la mue du serpent.","mean":"발 각질이 허물 벗듯 벗겨지게 하는 양말형 팩.","ex":"발 허물 팩을 하고 일주일이 지나니 발바닥 각질이 벗겨졌다.","exfr":"Une semaine après les chaussettes exfoliantes, les peaux mortes de la plante des pieds ont pelé.","fr":"chaussettes exfoliantes","frpos":"n.f.pl.","frdef":"Chaussettes imprégnées d’acides qui font peler la peau des pieds en quelques jours (« mue »)."},{"id":"BT1243","k":"h","cat":"body","w":"살냄새","rom":"sallaemsae","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"살+냄새","memofr":"Composé : 살 (peau, chair) + 냄새 (odeur)","note":"Tendance olfactive ; voir 스킨센트.","mean":"깨끗한 피부 냄새를 떠올리게 하는 은은한 향.","ex":"은은한 살냄새 향수라 가까이 가야 향이 난다.","exfr":"C'est un parfum « odeur de peau » discret : on ne le sent qu'en s'approchant.","fr":"odeur de peau (skin scent)","frpos":"n.f.","frdef":"Parfum doux et intime évoquant l'odeur naturelle de la peau propre."},{"id":"BT1256","k":"h","cat":"body","w":"아토 로션","rom":"ato rosyeon","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"아토(피) 축약+로션(lotion)","memofr":"Locution : 아토 (troncation de 아토피, atopie) + 로션 (angl. lotion)","note":"로션 désigne ici une émulsion (faux ami).","mean":"아토피·건조 피부용 로션.","ex":"아토 로션이라 건조한 피부에도 순하게 쓸 수 있다.","exfr":"C'est un lait pour peau atopique, doux même pour les peaux sèches.","fr":"lait pour peau atopique","frpos":"n.m.","frdef":"Abréviation: émulsion pour peau sèche à tendance atopique."},{"id":"BT1330","k":"h","cat":"body","w":"악어발 팩","rom":"ageobal paek","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"악어+발+팩(pack)","memofr":"Locution : 악어 (crocodile) + 발 (pied) + 팩 (angl. pack)","note":"Image humoristique.","mean":"악어 피부처럼 거친 발뒤꿈치용 각질 팩.","ex":"악어발 팩을 하고 나니 거칠던 발뒤꿈치가 매끈해졌다.","exfr":"Après un masque « pied de crocodile », mes talons rugueux sont devenus lisses.","fr":"masque « pied de crocodile »","frpos":"n.m.","frdef":"Masque exfoliant pour talons très rêches (comparés à une peau de crocodile)."},{"id":"BT1618","k":"h","cat":"body","w":"원물 향","rom":"wonmul hyang","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"원물+향","memofr":"Locution : 원물 (matière première) + 향 (parfum)","note":"Critère d'avis pour les parfums et les produits parfumés.","mean":"원재료(꽃·과일)를 그대로 재현한 향","ex":"이 핸드크림은 무화과 원물 향을 그대로 살려서 인공적인 느낌이 없다.","exfr":"Cette crème pour les mains a un parfum fidèle à la matière première, la figue, sans effet artificiel.","fr":"parfum fidèle à la matière première","frpos":"n.m.","frdef":"Parfum qui reproduit fidèlement la fleur ou le fruit."},{"id":"BT1239","k":"h","cat":"body","w":"캐스틸 솝","rom":"kaeseutil sop","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"castile+soap","memofr":"Locution : 캐스틸 (angl. castile) + 솝 (angl. soap)","note":"Le nom vient de la Castille (Espagne).","mean":"식물성 오일로 만든 액상 비누.","ex":"캐스틸 솝 하나로 세안과 샤워를 함께 한다.","exfr":"Je me lave le visage et le corps avec un seul savon de Castille.","fr":"savon de Castille","frpos":"n.m.","frdef":"Savon (souvent liquide) à base d’huiles végétales, à l’origine d’huile d’olive."},{"id":"BT1251","k":"h","cat":"body","w":"탑투토워시","rom":"taptutowosi","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"top-to-toe+wash","memofr":"Composé : 탑투토 (angl. top-to-toe) + 워시 (angl. wash)","note":"Catégorie des produits pour bébés.","mean":"아기 머리부터 발끝까지 쓰는 세정제.","ex":"아기 목욕은 탑투토워시 하나로 머리부터 발끝까지 씻긴다.","exfr":"Pour le bain du bébé, je le lave de la tête aux pieds avec un seul nettoyant tête-aux-pieds.","fr":"nettoyant tête-aux-pieds (bébé)","frpos":"n.m.","frdef":"Nettoyant cheveux et corps pour bébé (top-to-toe)."},{"id":"BT1326","k":"h","cat":"body","w":"풋샴푸","rom":"putsyampu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"foot+shampoo","memofr":"Composé : 풋 (angl. foot) + 샴푸 (angl. shampoo)","note":"Ici, « shampoing » prend un sens élargi.","mean":"발 전용 세정제.","ex":"풋샴푸를 발에 뿌리고 문지르면 냄새가 사라진다.","exfr":"En vaporisant le shampoing pour les pieds et en frottant, l'odeur disparaît.","fr":"shampoing pour les pieds","frpos":"n.m.","frdef":"Nettoyant moussant spécial pieds (catégorie coréenne)."},{"id":"BT1258","k":"h","cat":"body","w":"EDP","rom":"EDP","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두문자어)","memo":"Eau De Parfum 두문자어","memofr":"Sigle du français Eau de Parfum","note":"Sigle d'origine française, emprunté tel quel par le coréen.","mean":"오 드 퍼퓸(Eau de Parfum)의 약자.","ex":"EDP라서 오드 투알렛보다 향이 오래간다.","exfr":"C'est une EDP (eau de parfum), alors le parfum tient plus longtemps qu'une eau de toilette.","fr":"EDP (eau de parfum)","frpos":"n.f.","frdef":"Abréviation d'« eau de parfum »."},{"id":"BT1361","k":"h","cat":"body","w":"스킨센트","rom":"seukinsenteu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"skin+scent","memofr":"Composé : 스킨 (angl. skin) + 센트 (angl. scent)","note":"Tendance olfactive récente.","mean":"살결에서 나는 듯한 은은한 향수.","ex":"스킨센트 향수는 가까이 다가가야 은은하게 느껴진다.","exfr":"Un parfum skin scent ne se sent, discrètement, que quand on s'approche.","fr":"skin scent (parfum « peau »)","frpos":"n.m.","frdef":"Parfum léger qui sent la peau propre."},{"id":"BT1357","k":"h","cat":"body","w":"퍼퓸밤","rom":"peopyumbam","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"perfume+balm","memofr":"Composé : 퍼퓸 (angl. perfume) + 밤 (angl. balm)","note":"Format solide et nomade.","mean":"밤(고체) 형태의 향수.","ex":"퍼퓸밤은 손목에 문질러 바르기 편하다.","exfr":"Le baume parfumé est pratique à appliquer en frottant sur le poignet.","fr":"baume parfumé","frpos":"n.m.","frdef":"Parfum solide en baume."},{"id":"BT1387","k":"h","cat":"tool","w":"기름종이","rom":"gireumjongi","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"기름+종이","memofr":"Composé : 기름 (gras) + 종이 (papier)","note":"Objet très courant en Corée ; voir aussi 기름종이 선스틱.","mean":"얼굴 피지를 흡수하는 종이.","ex":"오후가 되면 기름종이로 T존 유분을 눌러 준다.","exfr":"L'après-midi, je tamponne la zone T avec du papier matifiant.","fr":"papier matifiant","frpos":"n.m.","frdef":"Feuilles qui absorbent le sébum du visage."},{"id":"BT1375","k":"h","cat":"tool","w":"노글루 속눈썹","rom":"nogeullu songnunsseop","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"no glue+속눈썹","memofr":"Locution : 노글루 (angl. no glue) + 속눈썹 (cils)","note":"Souvent des cils magnétiques ou autocollants.","mean":"접착제 없이 붙이는 인조 속눈썹.","ex":"노글루 속눈썹이라 접착제 없이 붙일 수 있다.","exfr":"Ce sont des faux cils sans colle : ils se posent sans adhésif.","fr":"faux cils sans colle","frpos":"n.m.pl.","frdef":"Faux cils autocollants."},{"id":"BT1380","k":"h","cat":"tool","w":"쌍꺼풀 테이프","rom":"ssangkkeopul teipeu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"쌍꺼풀+테이프(tape)","memofr":"Locution : 쌍꺼풀 (double paupière) + 테이프 (angl. tape)","note":"Accessoire répandu en Asie de l'Est, peu connu en France.","mean":"쌍꺼풀 라인을 만드는 테이프.","ex":"쌍꺼풀 테이프로 짝짝이 쌍꺼풀을 맞췄다.","exfr":"J'ai égalisé mes plis de paupière asymétriques avec un adhésif pour double paupière.","fr":"adhésif pour double paupière","frpos":"n.m.","frdef":"Ruban qui crée un pli palpébral artificiel.","par":"쌍꺼풀 라인","rel":"관련어(참고)"},{"id":"BT1399","k":"h","cat":"tool","w":"윤곽 케어","rom":"yungwak keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"윤곽+케어(care)","memofr":"Locution : 윤곽 (contour) + 케어 (angl. care)","note":"Lié à l'idéal du visage en V (V라인).","mean":"얼굴 윤곽을 갸름하게 관리함.","ex":"괄사로 윤곽 케어를 하니 붓기가 빠진다.","exfr":"En faisant un soin des contours du visage au gua sha, le gonflement diminue.","fr":"soin des contours du visage","frpos":"n.m.","frdef":"Soin ou massage pour affiner l'ovale du visage."},{"id":"BT1376","k":"h","cat":"tool","w":"컬링스틱","rom":"keollingseutik","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"curling+stick","memofr":"Composé : 컬링 (angl. curling) + 스틱 (angl. stick)","note":"Appareil de maquillage.","mean":"열로 속눈썹을 올리는 스틱형 기기.","ex":"컬링스틱으로 속눈썹을 데워 올리니 컬이 오래간다.","exfr":"En chauffant les cils avec un recourbe-cils chauffant en stick, la courbure tient longtemps.","fr":"recourbe-cils chauffant en stick","frpos":"n.m.","frdef":"Appareil chauffant en forme de stylo pour recourber les cils.","par":"컬링","rel":"관련어(참고)"},{"id":"BT1378","k":"h","cat":"tool","w":"콤 뷰러","rom":"kom byureo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"comb+뷰러","memofr":"Locution : 콤 (angl. comb) + 뷰러 (recourbe-cils)","note":"Voir 뷰러.","mean":"빗이 달린 뷰러.","ex":"콤 뷰러라 속눈썹이 뭉치지 않고 빗기듯 올라간다.","exfr":"Avec un recourbe-cils peigne, les cils remontent comme peignés, sans paquets.","fr":"recourbe-cils peigne","frpos":"n.m.","frdef":"Recourbe-cils avec peigne intégré.","par":"컬링","rel":"관련어(참고)"},{"id":"BT1381","k":"h","cat":"tool","w":"포인트가닥","rom":"pointeugadak","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"포인트(point)+가닥","memofr":"Composé : 포인트 (angl. point) + 가닥 (mèche)","note":"Voir 가닥 속눈썹.","mean":"눈꼬리 등에 포인트로 붙이는 가닥 속눈썹.","ex":"포인트가닥 속눈썹을 눈꼬리에만 붙였다.","exfr":"J'ai posé des faux cils en touffes d'accent seulement au coin externe.","fr":"faux cils en touffes d'accent","frpos":"n.m.pl.","frdef":"Petites touffes de faux cils posées au coin externe."},{"id":"BT1264","k":"h","cat":"tool","w":"EMS","rom":"EMS","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두문자어)","memo":"Electrical Muscle Stimulation 두문자어","memofr":"Sigle de l'anglais Electrical Muscle Stimulation","note":"Technologie des appareils de beauté à domicile.","mean":"근육을 전기 자극하는 미용기기 기술.","ex":"EMS 미세전류가 근육에 전기 자극을 전달하는 기술입니다.","exfr":"L'EMS est une technologie qui transmet aux muscles une stimulation électrique par microcourant.","fr":"EMS (électrostimulation musculaire)","frpos":"n.f.","frdef":"Technologie d'appareils de beauté qui stimule les muscles par courant."},{"id":"BT1411","k":"h","cat":"tool","w":"미세전류 클렌징 디바이스","rom":"misejeollyu keullenjing dibaiseu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"미세전류+클렌징+디바이스","memofr":"Locution : 미세전류 (microcourant) + 클렌징 (angl. cleansing) + 디바이스 (angl. device)","note":"Appareil de beauté à domicile.","mean":"미세전류를 흘려 세안을 돕는 기기.","ex":"미세전류 클렌징 디바이스를 사용하여 딥클렌징과 피부 케어를 동시에 합니다.","exfr":"J'utilise une brosse nettoyante à microcourant pour nettoyer en profondeur et soigner ma peau en même temps.","fr":"brosse nettoyante à microcourant","frpos":"n.f.","frdef":"Appareil nettoyant utilisant un faible courant électrique."},{"id":"BT1266","k":"h","cat":"tool","w":"스킨부스팅","rom":"seukinbuseuting","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"skin+boosting","memofr":"Composé : 스킨 (angl. skin) + 부스팅 (angl. boosting)","note":"Désigne aussi des injections en clinique ; terme ambigu.","mean":"피부를 끌어올린다는 기기·관리 효과.","ex":"유효 성분의 흡수를 돕는 스킨부스팅 디바이스입니다.","exfr":"Un appareil de stimulation cutanée conçu pour favoriser la pénétration des actifs.","fr":"stimulation cutanée","frpos":"n.f.","frdef":"Effet de « boost » de la peau promis par un appareil ou un soin."},{"id":"BT1416","k":"h","cat":"tool","w":"워터 필링기","rom":"woteo pillinggi","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"워터 필링(water peeling)+-기","memofr":"Locution : 워터 필링 (angl. water peeling) + -기 (suffixe « machine »)","note":"Le suffixe -기 sert à nommer les appareils.","mean":"물과 초음파로 모공을 세정하는 기기.","ex":"아쿠아 워터 필링기를 사용해 피부 묵은 각질과 피지를 말끔히 제거합니다.","exfr":"J'utilise un appareil de peeling à l'eau pour éliminer peaux mortes et sébum.","fr":"appareil de peeling à l'eau","frpos":"n.m.","frdef":"Appareil à ultrasons qui nettoie les pores avec de l'eau."},{"id":"BT1409","k":"h","cat":"tool","w":"진동클렌저","rom":"jindongkeullenjeo","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"진동+클렌저(cleanser)","memofr":"Composé : 진동 (vibration) + 클렌저 (angl. cleanser)","note":"Appareil de nettoyage.","mean":"진동으로 세안을 돕는 기기.","ex":"음파 진동 클렌저를 이용해 손 세안보다 구석구석 깨끗하게 클렌징합니다.","exfr":"Une brosse nettoyante vibrante à technologie sonique nettoie plus en profondeur qu'à la main.","fr":"brosse nettoyante vibrante","frpos":"n.f.","frdef":"Appareil nettoyant à vibrations soniques."},{"id":"BT1261","k":"h","cat":"tool","w":"홈케어 디바이스","rom":"homkeeo dibaiseu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"home care+device","memofr":"Locution : 홈케어 (angl. home care) + 디바이스 (angl. device)","note":"Marché en forte croissance en Corée.","mean":"집에서 쓰는 피부 관리 기기.","ex":"집에서도 에스테틱 관리를 받은 듯 케어해 주는 홈케어 디바이스입니다.","exfr":"Un appareil de soin à domicile qui donne l'impression d'un soin en institut.","fr":"appareil de soin à domicile","frpos":"n.m.","frdef":"Appareil de beauté (LED, RF…) pour usage personnel."},{"id":"BT1625","k":"h","cat":"gen","w":"강아지상","rom":"gangajisang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"강아지+상","memofr":"Composé : 강아지 (chiot) + 상 (type de visage)","note":"Typologie coréenne des visages par animal ; très populaire dans la culture K-pop.","mean":"처진 눈꼬리·둥근 이목구비로 순한 인상을 주는 얼굴형.","ex":"눈꼬리가 처진 강아지상이라 아이라인을 아래로 빼서 그린다.","exfr":"J'ai un visage « chiot » aux coins des yeux tombants, alors j'étire l'eye-liner vers le bas.","fr":"visage « chiot »","frpos":"n.m.","frdef":"Type de visage doux: yeux ronds et tombants, traits arrondis.","par":"-상","rel":"관련어(참고)"},{"id":"BT1629","k":"h","cat":"gen","w":"고양이상","rom":"goyangisang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"고양이+상","memofr":"Composé : 고양이 (chat) + 상 (type de visage)","note":"Voir 강아지상 ; les deux types s'opposent souvent.","mean":"올라간 눈꼬리·날렵한 눈매로 도도한 인상을 주는 얼굴형.","ex":"고양이상 눈매를 살리려고 아이라인 꼬리를 위로 올려 그렸다.","exfr":"Pour souligner mon regard de visage « chat », j'ai relevé la queue de l'eye-liner.","fr":"visage « chat »","frpos":"n.m.","frdef":"Type de visage aux yeux étirés et relevés, air distant et élégant.","par":"-상","rel":"관련어(참고)"},{"id":"BT1630","k":"h","cat":"gen","w":"과즙상","rom":"gwajeupsang","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"과즙+상","memofr":"Composé : 과즙 (jus de fruit) + 상 (type de visage)","note":"Variante récente de la typologie des visages.","mean":"과즙처럼 상큼하고 싱그러운 인상의 얼굴.","ex":"과즙상 메이크업을 하려고 코랄 블러셔를 볼 가운데에 톡톡 올렸다.","exfr":"Pour un maquillage de visage « jus de fruit », j'ai tapoté du blush corail au centre des joues.","fr":"visage « jus de fruit »","frpos":"n.m.","frdef":"Visage frais et pétillant, plein de vitalité.","par":"-상","rel":"관련어(참고)"},{"id":"BT1631","k":"h","cat":"gen","w":"꾸꾸꾸","rom":"kkukkukku","pos":"명사","unit":"단어","eo":"고유어","form":"축약어(두음절어)","memo":"꾸(며도) 꾸(질)꾸(질) 축약","memofr":"Abréviation syllabique : 꾸(며도) (même en se pomponnant) + 꾸(질)꾸(질) (négligé)","note":"Argot de mode ; jeu de mots avec 꾸안꾸.","mean":"「꾸며도 꾸질꾸질」의 줄임말. 편안하고 내추럴한 스타일을 가리키기도 함.","ex":"아무리 꾸며도 꾸꾸꾸라서 이번에는 스타일링 영상을 보며 따라 해 보기로 했다.","exfr":"Quoi que je fasse, j'ai un look raté malgré les efforts, alors cette fois j'ai décidé de suivre une vidéo de stylisme.","fr":"look raté malgré les efforts (fam.)","frpos":"n.m.","frdef":"Abréviation de « 꾸며도 꾸며도 꾸질꾸질 » : on a beau s'apprêter, le résultat reste négligé ou démodé. Contraire de 꾸안꾸.","par":"꾸안꾸","rel":"관련어(참고)"},{"id":"BT1632","k":"h","cat":"gen","w":"꾸안꾸","rom":"kkuankku","pos":"명사","unit":"단어","eo":"고유어","form":"축약어(두음절어)","memo":"꾸(민 듯) 안 꾸(민 듯) 축약","memofr":"Abréviation syllabique : 꾸(민 듯) (comme apprêté) + 안 꾸(민 듯) (comme non apprêté)","note":"Idéal stylistique très en vogue en Corée.","mean":"「꾸민 듯 안 꾸민 듯」의 줄임말. 자연스러워 보이는 스타일.","ex":"꾸안꾸 메이크업은 피부 표현을 얇게 하고 립만 살짝 물들이는 것이 핵심이다.","exfr":"Pour un look faussement négligé, l'essentiel est un teint léger et une simple touche de couleur sur les lèvres.","fr":"look faussement négligé (effortless)","frpos":"n.m.","frdef":"Abréviation de « 꾸민 듯 안 꾸민 듯 »: look naturel savamment travaillé."},{"id":"BT1634","k":"h","cat":"gen","w":"두부상","rom":"dubusang","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"두부+상","memofr":"Composé : 두부 (tofu) + 상 (type de visage)","note":"Variante de la typologie des visages.","mean":"각이 없고 하얗고 부드러운, 순한 인상의 얼굴형.","ex":"두부상이라 진한 화장보다 맑은 피부 표현이 잘 어울린다.","exfr":"J'ai un visage « tofu » : un teint frais me va mieux qu'un maquillage chargé.","fr":"visage « tofu »","frpos":"n.m.","frdef":"Visage pâle, doux et sans angles, comme du tofu.","par":"-상","rel":"관련어(참고)"},{"id":"BT1635","k":"h","cat":"gen","w":"딥톤","rom":"dipton","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"deep+tone","memofr":"Composé : 딥 (angl. deep) + 톤 (angl. tone)","note":"Terme de colorimétrie personnelle.","mean":"명도가 낮고 채도가 중간인, 어둡고 무게감 있는 색이 어울리는 퍼스널컬러 유형.","ex":"딥톤이라 밝은 파스텔보다 진한 컬러에서 얼굴이 살아난다.","exfr":"J'ai un teint aux tons profonds : les couleurs intenses me mettent plus en valeur que les pastels clairs.","fr":"tons profonds","frpos":"n.m.pl.","frdef":"Profil colorimétrique auquel vont les couleurs sombres et denses.","par":"퍼스널컬러","rel":"관련어(참고)"},{"id":"BT1636","k":"h","cat":"gen","w":"멍뭉미","rom":"meongmungmi","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"멍뭉(이)+미","memofr":"Composé : 멍뭉(이) (toutou, mot enfantin) + 미 (beauté, charme)","note":"Le suffixe -미 (« charme ») est très productif : 귀염미, 청순미.","mean":"강아지를 떠올리게 하는 귀엽고 순한 매력.","ex":"강아지상 메이크업은 처진 아이라인으로 멍뭉미를 살리는 것이 포인트다.","exfr":"Pour un maquillage « chiot », l'astuce est de faire ressortir son charme de chiot avec un eye-liner tombant.","fr":"charme de chiot","frpos":"n.m.","frdef":"Charme mignon et doux évoquant un chiot (멍뭉이 = chiot, familier).","par":"강아지상","rel":"관련어(참고)"},{"id":"BT1637","k":"h","cat":"gen","w":"메완얼","rom":"mewaneol","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"메(이크업의) 완(성은) 얼(굴) 축약","memofr":"Abréviation syllabique : 메(이크업의) (du maquillage) + 완(성은) (l'achèvement) + 얼(굴) (le visage)","note":"Formule humoristique et désabusée des forums.","mean":"「메이크업의 완성은 얼굴」의 줄임말. 같은 화장도 얼굴에 따라 다르다는 뜻.","ex":"똑같이 따라 했는데 느낌이 달라서 역시 메완얼이라는 말이 나왔다.","exfr":"J'ai copié le même maquillage mais le rendu était différent : comme on dit, « c'est le visage qui achève le maquillage ».","fr":"« le visage achève le maquillage »","frpos":"expr.","frdef":"Abréviation ironique: le même maquillage rend différemment selon le visage."},{"id":"BT1638","k":"h","cat":"gen","w":"미묘상","rom":"mimyosang","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"미묘+상","memofr":"Composé : 미묘 (beau chat) + 상 (type de visage)","note":"Jeu de mots : 미묘 signifie aussi « subtil » en coréen.","mean":"고양이상 중에서도 고양이 같은 분위기가 특히 강한 얼굴.","ex":"미묘상은 눈매를 강조하는 날렵한 아이라인이 잘 어울린다.","exfr":"Un visage « chat raffiné » est mis en valeur par un eye-liner fin qui accentue le regard.","fr":"visage « chat raffiné »","frpos":"n.m.","frdef":"Visage au charme félin très marqué.","par":"-상","rel":"관련어(참고)"},{"id":"BT1641","k":"h","cat":"gen","w":"뽐뿌","rom":"ppomppu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"pump의 일본식 발음 차용 → 구매욕 자극","memofr":"Emprunt de l'anglais pump, par la prononciation japonaise","note":"Argot du commerce en ligne ; on dit 뽐뿌가 온다 (« ça me donne envie d'acheter »).","mean":"누군가 구매 욕구를 부추기는 것.","ex":"언니가 바르는 걸 보고 뽐뿌가 와서 결국 같은 립을 샀다.","exfr":"En voyant ma sœur le porter, j'ai eu une tentation d'achat et j'ai fini par acheter le même rouge à lèvres.","fr":"tentation d’achat","frpos":"n.f.","frdef":"Le fait d'être poussé à acheter (de l'anglais « pump », passé par le japonais : « pomper » l'envie d'acheter).","par":"코덕","rel":"관련어(참고)"},{"id":"BT1642","k":"h","cat":"gen","w":"소공녀","rom":"sogongnyeo","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"소공+녀 말장난","memofr":"Composé : 소공 (petit pore) + 녀 (femme)","note":"Jeu de mots avec le titre coréen du roman « Petite Princesse ».","mean":"「모공이 작은 여자」라는 말장난. 피부결이 좋은 사람.","ex":"모공이 거의 보이지 않아 친구들 사이에서 소공녀로 불린다.","exfr":"Ses pores sont presque invisibles, ses amies l'appellent « la petite princesse aux pores fins ».","fr":"« petite princesse aux pores fins »","frpos":"n.f.","frdef":"Jeu de mots: femme aux pores invisibles (titre « La Petite Princesse »).","par":"꿀피부","rel":"관련어(참고)"},{"id":"BT1648","k":"h","cat":"gen","w":"장미단추","rom":"jangmidanchu","pos":"명사","unit":"단어","eo":"한자어","form":"축약어(두음절어)","memo":"장(거리) 미(녀) 단(거리) 추(녀) 축약","memofr":"Abréviation syllabique : 장(거리) (de loin) + 미(녀) (belle) + 단(거리) (de près) + 추(녀) (laide)","note":"Expression moqueuse ; registre très familier.","mean":"「장거리 미녀, 단거리 추녀」의 줄임말. 가까이서 보면 피부 상태가 드러난다는 뜻.","ex":"멀리서는 예뻐 보이지만 가까이 보면 모공이 다 보이는 장미단추 피부다.","exfr":"Une peau « rose de loin, bouton de près » : jolie à distance, mais tous les pores se voient de près.","fr":"« rose de loin, bouton de près »","frpos":"expr.","frdef":"Abréviation de « 장거리 미녀, 단거리 추녀 »: belle de loin, mais la peau trahit de près."},{"id":"BT1649","k":"h","cat":"gen","w":"첫사랑상","rom":"cheotsarangsang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"첫사랑+상","memofr":"Composé : 첫사랑 (premier amour) + 상 (type de visage)","note":"Variante de la typologie des visages.","mean":"순수하고 무해한 인상을 주는 얼굴형.","ex":"첫사랑상 메이크업은 피부를 맑게 표현하고 볼에 혈색만 살짝 더한다.","exfr":"Pour un maquillage de visage « premier amour », on garde un teint frais et on ajoute juste un peu de couleur aux joues.","fr":"visage « premier amour »","frpos":"n.m.","frdef":"Visage pur et innocent qui évoque un premier amour.","par":"-상","rel":"관련어(참고)"},{"id":"BT1651","k":"h","cat":"gen","w":"톤팡질팡","rom":"tonpangjilpang","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(혼성어)","memo":"톤(tone)+갈팡질팡 혼성","memofr":"Mot-valise : 톤 (angl. tone) + 갈팡질팡 (errer, hésiter)","note":"Jeu de mots humoristique.","mean":"자신의 퍼스널컬러 톤을 정하지 못하고 헤매는 상황.","ex":"진단을 받을 때마다 결과가 달라서 톤팡질팡하고 있다.","exfr":"Mes diagnostics donnent chaque fois un résultat différent, je suis perdue dans mes sous-tons.","fr":"perdu dans ses sous-tons","frpos":"loc.adj.","frdef":"Jeu de mots sur « 갈팡질팡 »: hésiter sur sa colorimétrie.","par":"퍼스널컬러","rel":"관련어(참고)"},{"id":"BT1652","k":"s","cat":"gen","w":"퍼컬","rom":"peokeol","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두음절어)","memo":"퍼(스널)+컬(러) 축약","memofr":"Abréviation syllabique : 퍼(스널) (angl. personal) + 컬(러) (angl. color)","note":"Abréviation courante de 퍼스널컬러.","mean":"퍼스널컬러의 줄임말.","ex":"퍼컬 진단에서 여름쿨톤이 나왔다.","exfr":"Mon analyse colorimétrique m'a classée « été froid ».","fr":"colorimétrie (abrév.)","frpos":"n.f.","frdef":"Abréviation de 퍼스널컬러.","par":"퍼스널컬러","rel":"준말"},{"id":"BT1653","k":"h","cat":"gen","w":"하늘 아래 같은 색조는 없다","rom":"haneul arae gateun saekjoneun eopda","unit":"문장","eo":"혼종어","form":"구","memo":"관용 문장","memofr":"Phrase figée","note":"Phrase culte des amateurs de maquillage, souvent citée pour justifier un achat.","mean":"비슷해 보이는 색조 제품도 모두 다르다며 구매를 정당화하는 관용 표현.","ex":"비슷한 색이 많아도 하늘 아래 같은 색조는 없다며 또 립을 샀다.","exfr":"« Il n'existe pas deux teintes identiques sous le ciel », me suis-je dit en rachetant un rouge à lèvres alors que j'en ai plein de semblables.","fr":"« il n'existe pas deux teintes identiques sous le ciel »","frpos":"expr.","frdef":"Dicton de passionnés justifiant l'achat de teintes très proches.","par":"코덕","rel":"관련어(참고)"},{"id":"BT1656","k":"h","cat":"base","w":"애플존","rom":"aepeuljon","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"apple+zone","memofr":"Composé : 애플 (angl. apple) + 존 (angl. zone)","note":"Repère pour l'application du blush.","mean":"웃을 때 볼 가운데 사과처럼 볼록 올라오는 부위. 블러셔를 올리는 기준점.","ex":"볼 중앙의 애플존 부위에 볼륨감과 광채를 살려 연출합니다.","exfr":"On met en valeur volume et éclat sur la zone pomme, au centre des joues.","fr":"zone pomme (des joues)","frpos":"n.f.","frdef":"Partie bombée des joues quand on sourit, où l'on pose le blush."},{"id":"BT1658","k":"h","cat":"lip","w":"립덕","rom":"ripdeok","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"립(lip)+덕(후) 축약","memofr":"Abréviation syllabique : 립 (angl. lip) + 덕(후) (fan, otaku)","note":"Voir 코덕.","mean":"립 제품을 바르기보다 모으는 것을 좋아하는 사람.","ex":"립덕이라 같은 색도 브랜드별로 다 모은다.","exfr":"En vraie collectionneuse de rouges à lèvres, je prends la même couleur dans toutes les marques.","fr":"collectionneur de rouges à lèvres","frpos":"n.m.","frdef":"Personne qui collectionne les produits pour les lèvres.","par":"코덕","rel":"관련어(참고)"},{"id":"BT1660","k":"h","cat":"tool","w":"감초주사","rom":"gamchojusa","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"감초+주사","memofr":"Composé : 감초 (réglisse) + 주사 (injection)","note":"Acte médical, non cosmétique ; surnom populaire.","mean":"글리시리진을 주성분으로 하는 주사의 별칭.","ex":"피곤할 때 병원에서 감초주사를 맞는 사람이 많다고 한다.","exfr":"On dit que beaucoup de gens se font faire une injection de réglisse à l'hôpital quand ils sont fatigués.","fr":"injection de réglisse (glycyrrhizine)","frpos":"n.f.","frdef":"Injection « beauté » à base de glycyrrhizine.","par":"백옥주사","rel":"관련어(참고)"},{"id":"BT1661","k":"h","cat":"tool","w":"다한증 보톡스","rom":"dahanjeung botokseu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"다한증+보톡스(Botox)","memofr":"Locution : 다한증 (hyperhidrose) + 보톡스 (de la marque Botox)","note":"보톡스 est un nom de marque devenu générique en coréen.","mean":"땀이 많이 나는 부위에 보톡스를 놓아 땀 분비를 줄이는 시술.","ex":"손에 땀이 많아 여름마다 다한증 보톡스를 맞는다.","exfr":"J'ai les mains moites, alors je me fais faire du botox contre l'hyperhidrose chaque été.","fr":"botox contre l'hyperhidrose","frpos":"n.m.","frdef":"Injection de toxine botulique pour réduire la transpiration.","par":"사각턱 보톡스","rel":"관련어(참고)"},{"id":"BT1662","k":"h","cat":"tool","w":"두피문신","rom":"dupimunsin","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"두피+문신","memofr":"Composé : 두피 (cuir chevelu) + 문신 (tatouage)","note":"Acte réalisé en clinique.","mean":"두피에 색소를 넣어 머리숱이 많아 보이게 하는 시술.","ex":"가르마가 넓어 보여 두피문신 상담을 받았다.","exfr":"Ma raie paraissait large, alors je me suis renseignée sur le tatouage du cuir chevelu.","fr":"tatouage du cuir chevelu (micropigmentation)","frpos":"n.m.","frdef":"Pigmentation du crâne pour simuler une chevelure plus dense."},{"id":"BT1663","k":"h","cat":"tool","w":"레이저 리프팅","rom":"reijeo ripeuting","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"laser+lifting","memofr":"Locution : 레이저 (angl. laser) + 리프팅 (angl. lifting)","note":"Acte médical esthétique.","mean":"레이저 에너지로 탄력 개선을 노리는 리프팅 시술.","ex":"턱선이 처져서 레이저 리프팅을 알아보고 있다.","exfr":"Mon ovale s'affaisse, je me renseigne sur le lifting laser.","fr":"lifting laser","frpos":"n.m.","frdef":"Acte de raffermissement par énergie laser.","par":"초음파 리프팅","rel":"관련어(참고)"},{"id":"BT1664","k":"h","cat":"tool","w":"레이저제모","rom":"reijeojemo","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"레이저(laser)+제모","memofr":"Composé : 레이저 (angl. laser) + 제모 (épilation)","note":"Acte médical ; très répandu en Corée.","mean":"레이저로 모낭을 파괴해 털을 줄이는 시술.","ex":"겨울에 레이저제모를 시작해야 여름에 편하다.","exfr":"Il faut commencer l'épilation laser en hiver pour être tranquille en été.","fr":"épilation laser","frpos":"n.f.","frdef":"Destruction des follicules pileux au laser."},{"id":"BT1665","k":"h","cat":"tool","w":"레이저토닝","rom":"reijeotoning","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"laser+toning","memofr":"Composé : 레이저 (angl. laser) + 토닝 (angl. toning)","note":"Acte médical esthétique très courant en Corée.","mean":"저출력 레이저를 여러 번 조사해 색소·톤을 개선하는 시술.","ex":"기미 때문에 레이저토닝을 열 번 끊었다.","exfr":"À cause de mon mélasma, j'ai pris un forfait de dix séances de laser toning.","fr":"laser toning","frpos":"n.m.","frdef":"Séances de laser à faible énergie pour unifier le teint et les taches, très populaires en Corée."},{"id":"BT1666","k":"h","cat":"tool","w":"마늘주사","rom":"maneuljusa","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"마늘+주사","memofr":"Composé : 마늘 (ail) + 주사 (injection)","note":"Surnom populaire, dû à l'odeur d'ail de la molécule ; acte médical.","mean":"푸르설티아민(비타민 B1 유도체)을 주성분으로 하는 피로 회복용 주사의 별칭.","ex":"야근이 이어진 주에 마늘주사를 맞았다.","exfr":"La semaine où j'ai enchaîné les heures supplémentaires, je me suis fait faire une injection « ail ».","fr":"injection « ail » (fursultiamine)","frpos":"n.f.","frdef":"Perfusion anti-fatigue de dérivé de vitamine B1, à l'odeur d'ail.","par":"백옥주사","rel":"관련어(참고)"},{"id":"BT1667","k":"h","cat":"tool","w":"물광주사","rom":"mulgwangjusa","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"물광+주사","memofr":"Composé : 물광 (éclat mouillé) + 주사 (injection)","note":"Acte médical ; le nom reprend l'idéal 물광.","mean":"히알루론산 등을 피부에 주입해 「물광」 피부를 노리는 주사 시술.","ex":"결혼식 전에 물광주사를 맞아 피부에 윤기가 돌았다.","exfr":"Avant le mariage, des injections de skinbooster pour un effet peau lumineuse ont donné de l'éclat à ma peau.","fr":"injections de skinbooster pour un effet peau lumineuse","frpos":"n.f.pl.","frdef":"Micro-injections d'acide hyaluronique pour un teint ultra-lumineux.","par":"스킨부스터","rel":"하위어(참고)"},{"id":"BT1669","k":"h","cat":"tool","w":"백옥주사","rom":"baegokjusa","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"백옥+주사","memofr":"Composé : 백옥 (jade blanc) + 주사 (injection)","note":"Surnom marketing ; l'efficacité éclaircissante est discutée.","mean":"글루타티온을 주성분으로 하는 미용주사의 별칭(피부톤 개선 홍보).","ex":"피부과에서 백옥주사와 비타민주사를 함께 권했다.","exfr":"Le dermatologue m'a conseillé une injection « jade blanc » en même temps qu'une injection de vitamines.","fr":"injection « jade blanc » (glutathion)","frpos":"n.f.","frdef":"Injection de glutathion vantée pour éclaircir le teint."},{"id":"BT1670","k":"h","cat":"tool","w":"비타민주사","rom":"bitaminjusa","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"비타민(vitamin)+주사","memofr":"Composé : 비타민 (angl. vitamin) + 주사 (injection)","note":"Surnom populaire ; acte médical.","mean":"비타민 C(아스코르빈산)를 고용량으로 주입하는 주사의 별칭.","ex":"감기 기운이 있어 비타민주사를 맞고 왔다.","exfr":"Je me sentais enrhumée, je suis allée me faire faire une injection de vitamine C.","fr":"injection de vitamine C","frpos":"n.f.","frdef":"Perfusion à forte dose de vitamine C.","par":"백옥주사","rel":"관련어(참고)"},{"id":"BT1671","k":"h","cat":"tool","w":"사각턱 보톡스","rom":"sagakteok botokseu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"사각턱+보톡스(Botox)","memofr":"Locution : 사각턱 (mâchoire carrée) + 보톡스 (de la marque Botox)","note":"Acte très courant en Corée, lié à l'idéal du visage en V.","mean":"턱 근육(교근)에 보툴리눔 톡신을 주입해 턱선을 갸름하게 하는 시술.","ex":"이를 악무는 버릇이 있어 사각턱 보톡스를 맞았다.","exfr":"Comme je serre les dents, je me suis fait faire du botox pour affiner la mâchoire carrée.","fr":"botox de la mâchoire carrée","frpos":"n.m.","frdef":"Injection dans le masséter pour affiner la mâchoire."},{"id":"BT1672","k":"h","cat":"tool","w":"스킨부스터","rom":"seukinbuseuteo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"skin+booster","memofr":"Composé : 스킨 (angl. skin) + 부스터 (angl. booster)","note":"Terme générique pour plusieurs types d'injections.","mean":"피부 속에 보습·재생 성분을 주입해 피부 바탕을 개선한다는 주사 시술의 총칭.","ex":"피부가 푸석해서 스킨부스터 시술을 예약했다.","exfr":"Ma peau était terne, alors j'ai pris rendez-vous pour un skin booster.","fr":"skin booster (injections)","frpos":"n.m.","frdef":"Famille d'injections d'actifs hydratants ou régénérants dans la peau."},{"id":"BT1673","k":"h","cat":"tool","w":"신데렐라주사","rom":"sinderellajusa","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"신데렐라(Cinderella)+주사","memofr":"Composé : 신데렐라 (Cendrillon) + 주사 (injection)","note":"Surnom marketing ; acte médical.","mean":"티옥트산(알파리포산)을 주성분으로 하는 미용주사의 별칭.","ex":"신데렐라주사는 항산화 주사로 알려져 있다.","exfr":"L'injection « Cendrillon » est connue comme une injection antioxydante.","fr":"injection « Cendrillon » (acide thioctique)","frpos":"n.f.","frdef":"Injection d'acide alpha-lipoïque présentée comme amincissante et antioxydante.","par":"백옥주사","rel":"관련어(참고)"},{"id":"BT1674","k":"h","cat":"tool","w":"실리프팅","rom":"sillipeuting","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"실+리프팅(lifting)","memofr":"Composé : 실 (fil) + 리프팅 (angl. lifting)","note":"Acte médical esthétique.","mean":"녹는 실을 피부 아래에 넣어 처진 피부를 당겨 올리는 시술.","ex":"볼 처짐이 고민이라 실리프팅 상담을 받았다.","exfr":"Mes joues s'affaissent, alors j'ai pris un rendez-vous de consultation pour un lifting aux fils.","fr":"lifting aux fils","frpos":"n.m.","frdef":"Fils résorbables insérés sous la peau pour la retendre.","par":"초음파 리프팅","rel":"관련어(참고)"},{"id":"BT1675","k":"h","cat":"tool","w":"아쿠아필","rom":"akuapil","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"aqua+peel","memofr":"Composé : 아쿠아 (angl. aqua) + 필 (angl. peel)","note":"Nom de marque devenu générique dans les cliniques coréennes.","mean":"물과 약물을 흡입·분사하며 모공 속 피지를 빼내는 피부 관리 시술.","ex":"한 달에 한 번 피부과에서 아쿠아필로 모공 관리를 받는다.","exfr":"Une fois par mois, je fais entretenir mes pores par un aquapeel chez le dermatologue.","fr":"aquapeel","frpos":"n.m.","frdef":"Soin qui aspire le sébum des pores avec de l'eau et des solutions."},{"id":"BT1676","k":"h","cat":"tool","w":"아트 메이크업","rom":"ateu meikeueop","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"art+make-up(한국식 조어)","memofr":"Locution : 아트 (angl. art) + 메이크업 (angl. make-up), formation coréenne","note":"Faux anglicisme ; on dit aussi 반영구 (« semi-permanent »).","mean":"반영구화장을 달리 부르는 말.","ex":"매일 눈썹을 그리기 번거로워 아트 메이크업을 받았다.","exfr":"Dessiner mes sourcils tous les jours était fastidieux, alors j'ai opté pour un maquillage permanent.","fr":"maquillage permanent (art make-up)","frpos":"n.m.","frdef":"Autre nom du maquillage semi-permanent."},{"id":"BT1677","k":"h","cat":"tool","w":"애교살 필러","rom":"aegyosal pilleo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"애교살+필러(filler)","memofr":"Locution : 애교살 (« aegyo sal ») + 필러 (angl. filler)","note":"Acte propre à l'esthétique coréenne.","mean":"눈 밑 애교살을 도톰하게 만드는 필러 시술.","ex":"애교살 필러를 맞고 나니 웃을 때 눈 밑이 도톰해 보인다.","exfr":"Depuis l'injection d'acide hyaluronique sous les yeux, mon « aegyo sal » paraît plus rebondi quand je souris.","fr":"injection d'acide hyaluronique sous les yeux (effet aegyo-sal)","frpos":"n.f.","frdef":"Injection d'acide hyaluronique sous l'œil pour créer l'애교살.","par":"애교살","rel":"관련어(참고)"},{"id":"BT1678","k":"h","cat":"tool","w":"엑소좀","rom":"eksojom","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"exosome 차용","memofr":"Emprunt à l'anglais exosome","note":"Ingrédient à la mode ; son statut réglementaire est encore discuté.","mean":"세포가 분비하는 미세 소포. 스킨부스터 시술·화장품 원료로 홍보됨.","ex":"시술 후 재생 관리로 엑소좀 앰플을 발라 주었다.","exfr":"Après le soin, j'ai appliqué une ampoule aux exosomes pour la récupération.","fr":"exosomes","frpos":"n.m.pl.","frdef":"Vésicules sécrétées par les cellules, ingrédient phare des injections et soins récents.","ing":"Vésicules extracellulaires impliquées dans la communication entre cellules; la composition dépend de leur origine.","inci":"exosomes","par":"스킨부스터","rel":"하위어(참고)"},{"id":"BT1679","k":"h","cat":"tool","w":"연어주사","rom":"yeoneojusa","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"연어+주사","memofr":"Composé : 연어 (saumon) + 주사 (injection)","note":"Surnom populaire du PDRN (voir PDRN).","mean":"연어 DNA 유래 PDRN 성분을 주입하는 미용주사의 별칭.","ex":"연어주사는 맞을 때 꽤 아프다는 후기가 많다.","exfr":"Beaucoup d'avis disent que l'injection « saumon » est assez douloureuse.","fr":"injection « saumon » (PDRN)","frpos":"n.f.","frdef":"Injection de PDRN issu d'ADN de saumon.","par":"PDRN","rel":"관련어(참고)"},{"id":"BT1680","k":"h","cat":"tool","w":"윤곽주사","rom":"yungwakjusa","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"윤곽+주사","memofr":"Composé : 윤곽 (contour) + 주사 (injection)","note":"Surnom marketing ; acte médical.","mean":"얼굴 윤곽을 갸름하게 한다고 홍보되는 주사(히알루로니다제 등).","ex":"턱 밑 살이 고민이라 윤곽주사를 세 번 맞았다.","exfr":"La graisse sous le menton me gênait, j'ai fait trois injections « contour ».","fr":"injection « contour » (lipolyse)","frpos":"n.f.","frdef":"Injection censée affiner l'ovale du visage."},{"id":"BT1681","k":"h","cat":"tool","w":"입꼬리 보톡스","rom":"ipkkori botokseu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"입꼬리+보톡스(Botox)","memofr":"Locution : 입꼬리 (coin de la bouche) + 보톡스 (de la marque Botox)","note":"Acte médical esthétique.","mean":"입꼬리를 끌어내리는 근육에 보톡스를 놓아 입꼬리를 올리는 시술.","ex":"입꼬리가 처져 보여서 입꼬리 보톡스를 맞았다.","exfr":"Les coins de ma bouche paraissaient tombants, alors j'ai fait du botox des commissures.","fr":"botox des coins de la bouche","frpos":"n.m.","frdef":"Injection qui relève les coins de la bouche.","par":"사각턱 보톡스","rel":"관련어(참고)"},{"id":"BT1682","k":"h","cat":"tool","w":"조각주사","rom":"jogakjusa","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"조각+주사","memofr":"Composé : 조각 (sculpture) + 주사 (injection)","note":"Surnom marketing.","mean":"얼굴 특정 부위의 지방을 줄여 윤곽을 다듬는다는 주사 시술.","ex":"조각주사로 볼살을 줄였다는 후기를 읽었다.","exfr":"J'ai lu un avis disant que les injections « sculptantes » avaient affiné les joues.","fr":"injection « sculptante »","frpos":"n.f.","frdef":"Injection lipolytique pour sculpter une zone du visage.","par":"윤곽주사","rel":"관련어(참고)"},{"id":"BT1683","k":"h","cat":"tool","w":"지방분해주사","rom":"jibangbunhaejusa","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"지방+분해+주사","memofr":"Composé : 지방 (graisse) + 분해 (décomposition) + 주사 (injection)","note":"Acte médical ; l'efficacité reste discutée.","mean":"국소 부위 지방을 분해한다고 홍보되는 주사 시술.","ex":"팔뚝에 지방분해주사를 맞고 며칠 동안 멍이 들었다.","exfr":"Après une injection lipolytique dans le haut des bras, j'ai eu des bleus pendant plusieurs jours.","fr":"injection lipolytique","frpos":"n.f.","frdef":"Injection censée dissoudre la graisse localisée.","par":"윤곽주사","rel":"관련어(참고)"},{"id":"BT1684","k":"h","cat":"tool","w":"초음파 리프팅","rom":"choeumpa ripeuting","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"초음파+리프팅(lifting)","memofr":"Locution : 초음파 (ultrasons) + 리프팅 (angl. lifting)","note":"Souvent désigné par des noms de marque d'appareils.","mean":"고강도 집속 초음파(HIFU)로 피부 깊은 층을 자극해 탄력을 주는 시술.","ex":"초음파 리프팅은 일 년에 한 번 정도 받는다.","exfr":"Je fais un lifting par ultrasons environ une fois par an.","fr":"lifting par ultrasons (HIFU)","frpos":"n.m.","frdef":"Ultrasons focalisés qui raffermissent les couches profondes."},{"id":"BT1685","k":"h","cat":"tool","w":"침샘 보톡스","rom":"chimsaem botokseu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"침샘+보톡스(Botox)","memofr":"Locution : 침샘 (glande salivaire) + 보톡스 (de la marque Botox)","note":"Acte médical esthétique.","mean":"침샘에 보톡스를 놓아 턱선 아래를 갸름하게 하는 시술.","ex":"턱 아래가 불룩해서 침샘 보톡스 상담을 받았다.","exfr":"Le dessous de ma mâchoire était bombé, j'ai consulté pour du botox des glandes salivaires.","fr":"botox des glandes salivaires","frpos":"n.m.","frdef":"Injection dans les glandes salivaires pour affiner le dessous de la mâchoire.","par":"사각턱 보톡스","rel":"관련어(참고)"},{"id":"BT1686","k":"h","cat":"tool","w":"콜라겐부스터","rom":"kollagenbuseuteo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"collagen+booster","memofr":"Composé : 콜라겐 (angl. collagen) + 부스터 (angl. booster)","note":"Terme générique pour des injections stimulantes.","mean":"콜라겐 생성을 돕는다고 홍보되는 주사 시술 계열.","ex":"콜라겐부스터는 효과가 석 달쯤 뒤에 나타난다고 들었다.","exfr":"On m'a dit que l'effet du booster de collagène apparaît au bout d'environ trois mois.","fr":"booster de collagène (injection)","frpos":"n.m.","frdef":"Injection censée stimuler la production de collagène.","par":"스킨부스터","rel":"하위어(참고)"},{"id":"BT1687","k":"h","cat":"tool","w":"태반주사","rom":"taebanjusa","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"태반+주사","memofr":"Composé : 태반 (placenta) + 주사 (injection)","note":"Acte médical ; peu connu en France.","mean":"자하거(태반) 추출물을 주성분으로 하는 주사의 별칭.","ex":"갱년기 피로 때문에 태반주사를 맞는 분이 많다.","exfr":"Beaucoup de femmes se font faire des injections de placenta contre la fatigue de la ménopause.","fr":"injection de placenta","frpos":"n.f.","frdef":"Injection d'extrait placentaire.","par":"백옥주사","rel":"관련어(참고)"},{"id":"BT1688","k":"h","cat":"tool","w":"풀페이스 보톡스","rom":"pulpeiseu botokseu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"full face+Botox","memofr":"Locution : 풀페이스 (angl. full face) + 보톡스 (de la marque Botox)","note":"Acte médical esthétique.","mean":"얼굴 전체에 소량씩 보톡스를 놓는 시술.","ex":"잔주름이 고민이라 풀페이스 보톡스를 맞았다.","exfr":"Les ridules me préoccupaient, alors j'ai fait du botox du visage entier.","fr":"botox du visage entier","frpos":"n.m.","frdef":"Micro-doses de botox sur tout le visage.","par":"사각턱 보톡스","rel":"관련어(참고)"},{"id":"BT1689","k":"h","cat":"tool","w":"피코토닝","rom":"pikotoning","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"pico+toning","memofr":"Composé : 피코 (angl. pico) + 토닝 (angl. toning)","note":"Variante du laser toning.","mean":"피코초 단위 레이저로 하는 토닝 시술.","ex":"잡티가 올라와서 피코토닝을 다시 시작했다.","exfr":"Mes taches sont réapparues, j'ai recommencé le pico toning.","fr":"pico toning","frpos":"n.m.","frdef":"Toning au laser picoseconde contre taches et teint terne.","par":"레이저토닝","rel":"관련어(참고)"},{"id":"BT1690","k":"h","cat":"gen","w":"가성비","rom":"gaseongbi","pos":"명사","unit":"단어","eo":"한자어","form":"축약어(두음절어)","memo":"줄임말: 가격 대비 성능; 「가성비가 좋다/뛰어나다」로 씀","memofr":"Abréviation : 가(격) (prix) + 성(능) (performance) + 비 (rapport)","note":"Mot du quotidien, bien au-delà de la beauté ; voir aussi 갓성비.","mean":"가격에 비해 품질·성능이 좋은 정도.","ex":"용량이 넉넉하고 값도 싸서 가성비가 좋은 토너다.","exfr":"Grand format et petit prix : c'est une lotion tonique au bon rapport qualité-prix.","fr":"rapport qualité-prix","frpos":"n.m.","frdef":"Abréviation de « 가격 대비 성능 » (performance par rapport au prix) : rapport qualité-prix d’un produit."},{"id":"BT1691","k":"h","cat":"skin","w":"쑥","rom":"ssuk","pos":"명사","unit":"단어","eo":"고유어","form":"단일어","memofr":"Mot simple","note":"Ingrédient emblématique de la cosmétique coréenne (masques et toners à l'armoise).","mean":"쑥잎에서 얻는 진정 성분. 한국 진정 제품에서 병풀·어성초와 함께 대표 원료로 쓰임.","ex":"쑥 성분이 들어 있어 예민해진 피부를 진정하는 데 좋다.","exfr":"Grâce à l'armoise, il apaise bien la peau sensibilisée.","fr":"armoise (mugwort)","frpos":"n.f.","frdef":"Extrait d'armoise, plante médicinale coréenne utilisée pour apaiser les peaux sensibles.","ing":"한국어: 쑥잎에서 얻는 진정 성분. 한국 진정 제품에서 병풀·어성초와 함께 대표 원료로 쓰임.\nFrançais : Extrait d'armoise, plante médicinale coréenne utilisée pour apaiser les peaux sensibles.","inci":"Artemisia Princeps Leaf Extract"},{"id":"BT1692","k":"h","cat":"skin","w":"어린쑥","rom":"eorinssuk","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"어린+쑥","memofr":"Composé : 어린 (jeune) + 쑥 (armoise)","note":"Argument de douceur des marques coréennes.","mean":"다 자라기 전에 딴 쑥 잎. 자극이 적다는 점을 내세워 진정 제품 원료로 쓰임.","ex":"어린쑥 토너를 화장솜에 적셔 붉은 부위에 올려 두었다.","exfr":"J'ai posé sur les zones rouges un coton imbibé de lotion à la jeune armoise.","fr":"jeune armoise","frpos":"n.f.","frdef":"Jeunes pousses d'armoise, présentées comme plus douces ; ingrédient apaisant.","ing":"한국어: 다 자라기 전에 딴 쑥 잎. 자극이 적다는 점을 내세워 진정 제품 원료로 쓰임.\nFrançais : Jeunes pousses d'armoise, présentées comme plus douces ; ingrédient apaisant.","inci":"Artemisia Princeps Leaf Water"},{"id":"BT1693","k":"h","cat":"skin","w":"녹두","rom":"nokdu","pos":"명사","unit":"단어","eo":"한자어","form":"단일어","memo":"녹두","memofr":"Mot simple","note":"Ingrédient traditionnel des soins du visage coréens.","mean":"녹두 씨앗 추출물이나 가루. 피지·노폐물 흡착과 진정 목적의 세안제·팩에 쓰임.","ex":"녹두 팩을 바르면 모공 속 피지가 정리되는 느낌이다.","exfr":"Avec un masque au haricot mungo, j'ai l'impression que le sébum des pores est nettoyé.","fr":"haricot mungo","frpos":"n.m.","frdef":"Extrait ou poudre de haricot mungo, employé dans les nettoyants et masques purifiants.","ing":"한국어: 녹두 씨앗 추출물이나 가루. 피지·노폐물 흡착과 진정 목적의 세안제·팩에 쓰임.\nFrançais : Extrait ou poudre de haricot mungo, employé dans les nettoyants et masques purifiants.","inci":"Phaseolus Radiatus Seed Extract"},{"id":"BT1694","k":"h","cat":"skin","w":"율무","rom":"yulmu","pos":"명사","unit":"단어","eo":"고유어","form":"단일어","memofr":"Mot simple","note":"Ingrédient traditionnel ; toners très populaires en Corée.","mean":"율무 씨앗 추출물. 피부결·톤 정돈을 내세운 토너와 팩에 쓰임.","ex":"율무 팩을 꾸준히 쓰니 요철이 덜 도드라져 보인다.","exfr":"En utilisant régulièrement un masque aux larmes de Job, les irrégularités se voient moins.","fr":"larmes de Job (coix)","frpos":"n.f.pl.","frdef":"Extrait de graines de coix, utilisé pour lisser le grain de peau et unifier le teint.","ing":"한국어: 율무 씨앗 추출물. 피부결·톤 정돈을 내세운 토너와 팩에 쓰임.\nFrançais : Extrait de graines de coix, utilisé pour lisser le grain de peau et unifier le teint.","inci":"Coix Lacryma-Jobi Ma-yuen Seed Extract"},{"id":"BT1695","k":"h","cat":"skin","w":"자작나무 수액","rom":"jajangnamu suaek","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"자작나무+수액","memofr":"Locution : 자작나무 (bouleau) + 수액 (sève)","note":"Utilisée à la place de l'eau dans la formule.","mean":"자작나무 줄기에서 받은 수액. 정제수 대신 넣어 수분 공급을 내세우는 원료.","ex":"정제수 대신 자작나무 수액을 넣은 수분 크림이다.","exfr":"Une crème hydratante formulée avec de la sève de bouleau à la place de l'eau purifiée.","fr":"sève de bouleau","frpos":"n.f.","frdef":"Sève de bouleau utilisée à la place de l'eau dans les soins hydratants.","ing":"한국어: 자작나무 줄기에서 받은 수액. 정제수 대신 넣어 수분 공급을 내세우는 원료.\nFrançais : Sève de bouleau utilisée à la place de l'eau dans les soins hydratants.","inci":"Betula Platyphylla Japonica Juice"},{"id":"BT1696","k":"h","cat":"skin","w":"티트리","rom":"titeuri","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"tea tree","memofr":"Emprunt à l'anglais tea tree","note":"Voir aussi 티트리잎오일.","mean":"티트리 잎에서 얻는 오일·추출물. 트러블 피부 진정 제품의 대표 원료.","ex":"티트리 성분 패드로 트러블 부위를 닦아 냈다.","exfr":"J'ai essuyé les zones à imperfections avec un disque à l'arbre à thé.","fr":"arbre à thé (tea tree)","frpos":"n.m.","frdef":"Huile ou extrait de tea tree, ingrédient classique des soins pour peaux à imperfections.","ing":"한국어: 티트리 잎에서 얻는 오일·추출물. 트러블 피부 진정 제품의 대표 원료.\nFrançais : Huile ou extrait de tea tree, ingrédient classique des soins pour peaux à imperfections.","inci":"Melaleuca Alternifolia Leaf Extract"},{"id":"BT1697","k":"h","cat":"skin","w":"프로폴리스","rom":"peuropolliseu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memofr":"Emprunt (angl. propolis)","note":"Ingrédient vedette de certaines marques coréennes.","mean":"꿀벌이 만든 수지성 물질의 추출물. 윤기·영양·진정을 내세운 앰플과 크림에 쓰임.","ex":"프로폴리스 앰플을 바르면 피부에 윤기가 돈다.","exfr":"Avec une ampoule à la propolis, la peau devient lumineuse.","fr":"propolis","frpos":"n.f.","frdef":"Extrait de propolis, apprécié pour son effet nourrissant et l'éclat qu'il donne.","ing":"한국어: 꿀벌이 만든 수지성 물질의 추출물. 윤기·영양·진정을 내세운 앰플과 크림에 쓰임.\nFrançais : Extrait de propolis, apprécié pour son effet nourrissant et l'éclat qu'il donne.","inci":"Propolis Extract"},{"id":"BT1698","k":"h","cat":"skin","w":"달팽이 점액 여과물","rom":"dalpaengi jeomaek yeogwamul","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"달팽이+점액+여과물; =달팽이 뮤신","memofr":"Locution : 달팽이 (escargot) + 점액 (mucus) + 여과물 (filtrat)","note":"Ingrédient emblématique de la K-beauty ; nom INCI : Snail Secretion Filtrate.","mean":"달팽이 점액을 걸러 정제한 원료. 흔히 「달팽이 뮤신」이라 부르며 재생·보습 크림에 쓰임.","ex":"달팽이 점액 여과물이 든 크림은 쫀득하게 늘어난다.","exfr":"La crème au filtrat de bave d'escargot s'étire en filant, avec une texture élastique.","fr":"filtrat de bave d'escargot","frpos":"n.m.","frdef":"Mucine d'escargot filtrée, ingrédient emblématique de la K-beauty pour réparer et hydrater.","ing":"한국어: 달팽이 점액을 걸러 정제한 원료. 흔히 「달팽이 뮤신」이라 부르며 재생·보습 크림에 쓰임.\nFrançais : Mucine d'escargot filtrée, ingrédient emblématique de la K-beauty pour réparer et hydrater.","inci":"Snail Secretion Filtrate"},{"id":"BT1699","k":"h","cat":"skin","w":"소듐하이알루로네이트","rom":"sodyumhaialluroneiteu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"sodium hyaluronate의 한글 전성분 표기","memofr":"Emprunt à l'anglais sodium hyaluronate, graphie de l'étiquetage coréen","note":"Nom INCI : Sodium Hyaluronate.","mean":"히알루론산의 나트륨염. 전성분표에서 히알루론산을 가리키는 표기.","ex":"전성분을 보니 소듐하이알루로네이트가 앞쪽에 적혀 있다.","exfr":"En lisant la liste INCI, le hyaluronate de sodium figure parmi les premiers ingrédients.","fr":"hyaluronate de sodium","frpos":"n.m.","frdef":"Sel de sodium de l'acide hyaluronique ; nom figurant sur la liste INCI.","ing":"한국어: 히알루론산의 나트륨염. 전성분표에서 히알루론산을 가리키는 표기.\nFrançais : Sel de sodium de l'acide hyaluronique ; nom figurant sur la liste INCI.","inci":"Sodium Hyaluronate"},{"id":"BT1700","k":"h","cat":"skin","w":"콜라겐","rom":"kollagen","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memofr":"Emprunt (angl. collagen)","note":"Ingrédient très connu ; à distinguer du collagène produit par la peau elle-même.","mean":"피부 탄력을 이루는 단백질, 또는 이를 가수분해한 화장품 원료.","ex":"콜라겐 겔 마스크를 붙이고 잤더니 피부가 탄탄해 보인다.","exfr":"J'ai dormi avec un masque gel au collagène et ma peau paraît plus ferme.","fr":"collagène","frpos":"n.m.","frdef":"Protéine de soutien de la peau ; en cosmétique, collagène hydrolysé à visée raffermissante.","ing":"한국어: 피부 탄력을 이루는 단백질, 또는 이를 가수분해한 화장품 원료.\nFrançais : Protéine de soutien de la peau ; en cosmétique, collagène hydrolysé à visée raffermissante.","inci":"Hydrolyzed Collagen"},{"id":"BT1701","k":"h","cat":"skin","w":"저분자 콜라겐","rom":"jeobunja kollagen","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"저분자+콜라겐","memofr":"Locution : 저분자 (bas poids moléculaire) + 콜라겐 (angl. collagen)","note":"Argument technique de la publicité.","mean":"분자 크기를 작게 쪼갠 콜라겐. 흡수가 잘된다는 점을 내세움.","ex":"저분자 콜라겐 크림이라 흡수가 빠른 편이다.","exfr":"C'est une crème au collagène de bas poids moléculaire, elle pénètre assez vite.","fr":"collagène de bas poids moléculaire","frpos":"n.m.","frdef":"Collagène hydrolysé en petites molécules, présenté comme mieux absorbé.","ing":"한국어: 분자 크기를 작게 쪼갠 콜라겐. 흡수가 잘된다는 점을 내세움.\nFrançais : Collagène hydrolysé en petites molécules, présenté comme mieux absorbé.","inci":"Hydrolyzed Collagen"},{"id":"BT1702","k":"h","cat":"skin","w":"엘라스틴","rom":"ellaseutin","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memofr":"Emprunt (angl. elastin)","note":"Ingrédient anti-âge.","mean":"피부 탄력 섬유 단백질, 또는 그 가수분해 원료.","ex":"엘라스틴 성분 크림으로 탄력 관리를 한다.","exfr":"J'entretiens la fermeté de ma peau avec une crème à l'élastine.","fr":"élastine","frpos":"n.f.","frdef":"Protéine élastique de la peau ; ingrédient des soins fermeté.","ing":"한국어: 피부 탄력 섬유 단백질, 또는 그 가수분해 원료.\nFrançais : Protéine élastique de la peau ; ingrédient des soins fermeté.","inci":"Hydrolyzed Elastin"},{"id":"BT1703","k":"h","cat":"skin","w":"카퍼 펩타이드","rom":"kapeo peptaideu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"copper+peptide","memofr":"Locution : 카퍼 (angl. copper) + 펩타이드 (angl. peptide)","note":"Donne aux sérums une couleur bleue caractéristique.","mean":"구리와 결합한 펩타이드. 푸른색을 띠며 탄력·재생 제품에 쓰임.","ex":"카퍼 펩타이드 세럼은 내용물이 파란색이다.","exfr":"Le sérum au peptide de cuivre a une couleur bleue.","fr":"peptide de cuivre","frpos":"n.m.","frdef":"Peptide lié au cuivre, de couleur bleue, utilisé dans les soins anti-âge.","ing":"한국어: 구리와 결합한 펩타이드. 푸른색을 띠며 탄력·재생 제품에 쓰임.\nFrançais : Peptide lié au cuivre, de couleur bleue, utilisé dans les soins anti-âge.","inci":"Copper Tripeptide-1"},{"id":"BT1704","k":"h","cat":"skin","w":"아스코빅애씨드","rom":"aseukobigaessideu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"ascorbic acid의 한글 전성분 표기","memofr":"Emprunt à l'anglais ascorbic acid, graphie de l'étiquetage coréen","note":"Nom INCI : Ascorbic Acid ; voir 순수 비타민C.","mean":"순수 비타민C의 전성분 표기.","ex":"아스코빅애씨드 함량이 높아 처음에는 따끔했다.","exfr":"Très concentré en acide ascorbique, il picotait au début.","fr":"acide ascorbique","frpos":"n.m.","frdef":"Vitamine C pure, telle qu'elle figure sur la liste INCI.","ing":"한국어: 순수 비타민C의 전성분 표기.\nFrançais : Vitamine C pure, telle qu'elle figure sur la liste INCI.","inci":"Ascorbic Acid"},{"id":"BT1705","k":"s","cat":"skin","w":"순수 비타민C","rom":"sunsu bitaminC","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"순수+비타민C","memofr":"Locution : 순수 (pur) + 비타민C (angl. vitamin C)","note":"Allégation marketing courante ; à conserver à l'abri de la lumière.","mean":"유도체가 아닌 비타민C 그 자체(아스코빅애씨드). 효과가 빠르지만 쉽게 산화함.","ex":"순수 비타민C 세럼은 개봉 후 냉장 보관한다.","exfr":"Une fois ouvert, je garde le sérum à la vitamine C pure au réfrigérateur.","fr":"vitamine C pure","frpos":"n.f.","frdef":"Acide ascorbique non dérivé, efficace mais instable.","ing":"한국어: 유도체가 아닌 비타민C 그 자체(아스코빅애씨드). 효과가 빠르지만 쉽게 산화함.\nFrançais : Acide ascorbique non dérivé, efficace mais instable.","inci":"Ascorbic Acid","par":"아스코빅애씨드","rel":"동의어"},{"id":"BT1706","k":"h","cat":"skin","w":"레티노이드","rom":"retinoideu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memofr":"Emprunt (angl. retinoid)","note":"Terme générique ; voir 레티놀 et 레티날.","mean":"레티놀·레티날 등 비타민 A 계열 성분을 통틀어 이르는 말.","ex":"레티노이드를 처음 쓸 때는 사흘에 한 번만 바른다.","exfr":"Quand on commence les rétinoïdes, on n'en applique qu'un jour sur trois.","fr":"rétinoïdes","frpos":"n.m.pl.","frdef":"Famille des dérivés de la vitamine A (rétinol, rétinal, etc.).","ing":"한국어: 레티놀·레티날 등 비타민 A 계열 성분을 통틀어 이
