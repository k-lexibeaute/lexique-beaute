비슷해 가볍게 쓰는 오일.","ex":"호호바오일로 블랙헤드 부위를 롤링했다.","exfr":"J'ai massé les zones à points noirs avec de l'huile de jojoba.","fr":"huile de jojoba","frpos":"n.f.","frdef":"Huile légère proche du sébum.","ing":"한국어: 호호바 씨앗 오일. 피지와 구조가 비슷해 가볍게 쓰는 오일.\nFrançais : Huile légère proche du sébum.","inci":"Simmondsia Chinensis (Jojoba) Seed Oil"},{"id":"BT1729","k":"h","cat":"skin","w":"동백오일","rom":"dongbaegoil","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"동백+오일","memofr":"Composé : 동백 (camélia) + 오일 (angl. oil)","note":"Ingrédient traditionnel coréen, surtout de l'île de Jeju.","mean":"동백나무 씨앗 오일. 한국 전통 미용 재료로 모발·피부 보습에 씀.","ex":"동백오일을 크림에 한 방울 섞어 바른다.","exfr":"Je mélange une goutte d'huile de camélia à ma crème.","fr":"huile de camélia","frpos":"n.f.","frdef":"Huile de graines de camélia, soin traditionnel coréen pour peau et cheveux.","ing":"한국어: 동백나무 씨앗 오일. 한국 전통 미용 재료로 모발·피부 보습에 씀.\nFrançais : Huile de graines de camélia, soin traditionnel coréen pour peau et cheveux.","inci":"Camellia Japonica Seed Oil"},{"id":"BT1730","k":"h","cat":"skin","w":"마유","rom":"mayu","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"마+유","memofr":"Composé : 마 (cheval) + 유 (huile)","note":"Ingrédient populaire en Asie de l'Est, presque inconnu en France.","mean":"말의 지방에서 얻은 기름. 고보습·재생 크림 원료.","ex":"마유 크림은 겨울철 악건성 피부에 인기가 있다.","exfr":"La crème à l'huile de cheval est populaire en hiver auprès des peaux très sèches.","fr":"huile de cheval","frpos":"n.f.","frdef":"Graisse de cheval raffinée, utilisée dans des crèmes très nourrissantes.","ing":"한국어: 말의 지방에서 얻은 기름. 고보습·재생 크림 원료.\nFrançais : Graisse de cheval raffinée, utilisée dans des crèmes très nourrissantes.","inci":"Horse Fat"},{"id":"BT1731","k":"h","cat":"skin","w":"아르간오일","rom":"areuganoil","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"argan+oil","memofr":"Composé : 아르간 (angl. argan) + 오일 (angl. oil)","note":"Ingrédient bien connu en France.","mean":"아르간 나무 열매 씨앗 오일. 모발·피부 영양 오일.","ex":"아르간오일을 머리끝에 발랐다.","exfr":"J'ai appliqué de l'huile d'argan sur les pointes.","fr":"huile d'argan","frpos":"n.f.","frdef":"Huile nourrissante pour la peau et les cheveux.","ing":"한국어: 아르간 나무 열매 씨앗 오일. 모발·피부 영양 오일.\nFrançais : Huile nourrissante pour la peau et les cheveux.","inci":"Argania Spinosa Kernel Oil"},{"id":"BT1732","k":"h","cat":"skin","w":"로즈힙오일","rom":"rojeuhiboil","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"rosehip+oil","memofr":"Composé : 로즈힙 (angl. rosehip) + 오일 (angl. oil)","note":"Ingrédient bien connu en France.","mean":"들장미 열매 씨앗 오일. 흔적·건조 관리용 페이스 오일.","ex":"로즈힙오일을 자기 전에 두 방울 바른다.","exfr":"J'applique deux gouttes d'huile de rose musquée avant de dormir.","fr":"huile de rose musquée","frpos":"n.f.","frdef":"Huile de cynorrhodon, employée contre les marques et la sécheresse.","ing":"한국어: 들장미 열매 씨앗 오일. 흔적·건조 관리용 페이스 오일.\nFrançais : Huile de cynorrhodon, employée contre les marques et la sécheresse.","inci":"Rosa Canina Fruit Oil"},{"id":"BT1733","k":"h","cat":"skin","w":"미네랄오일","rom":"mineraroil","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"mineral+oil","memofr":"Composé : 미네랄 (angl. mineral) + 오일 (angl. oil)","note":"Souvent évitée par les consommateurs coréens ; elle est pourtant considérée comme sûre.","mean":"석유에서 정제한 광물성 오일. 클렌징 오일과 보습제의 기제.","ex":"미네랄오일 베이스 클렌징 오일은 세정력이 좋다.","exfr":"Les huiles démaquillantes à base d'huile minérale nettoient bien.","fr":"huile minérale","frpos":"n.f.","frdef":"Huile d'origine pétrolière purifiée (paraffine liquide).","ing":"한국어: 석유에서 정제한 광물성 오일. 클렌징 오일과 보습제의 기제.\nFrançais : Huile d'origine pétrolière purifiée (paraffine liquide).","inci":"Mineral Oil"},{"id":"BT1734","k":"h","cat":"skin","w":"디메치콘","rom":"dimechikon","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"dimethicone의 한글 전성분 표기","memofr":"Emprunt à l'anglais dimethicone, graphie de l'étiquetage coréen","note":"Silicone très courante ; certains consommateurs l'évitent.","mean":"대표적인 실리콘 오일. 발림성과 매끈한 마무리를 줌.","ex":"디메치콘이 들어 있어 바르면 매끈하게 마무리된다.","exfr":"Il contient de la diméthicone, ce qui donne un fini lisse.","fr":"diméthicone","frpos":"n.f.","frdef":"Silicone donnant glisse et fini lisse.","ing":"한국어: 대표적인 실리콘 오일. 발림성과 매끈한 마무리를 줌.\nFrançais : Silicone donnant glisse et fini lisse.","inci":"Dimethicone"},{"id":"BT1735","k":"h","cat":"skin","w":"페녹시에탄올","rom":"penoksietanol","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memofr":"Emprunt (angl. phenoxyethanol)","note":"Conservateur autorisé à 1 % maximum dans l'UE.","mean":"화장품에 널리 쓰는 보존제.","ex":"페녹시에탄올 대신 다른 보존제를 썼다고 한다.","exfr":"La marque dit avoir remplacé le phénoxyéthanol par un autre conservateur.","fr":"phénoxyéthanol","frpos":"n.m.","frdef":"Conservateur courant.","ing":"한국어: 화장품에 널리 쓰는 보존제.\nFrançais : Conservateur courant.","inci":"Phenoxyethanol"},{"id":"BT1736","k":"h","cat":"skin","w":"파라벤","rom":"paraben","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memofr":"Emprunt (angl. paraben)","note":"Les mentions « sans parabènes » (무파라벤) sont fréquentes.","mean":"파라옥시안식향산에스테르 계열 보존제. 「무파라벤」 표시의 대상.","ex":"파라벤이 없는 제품만 골라 쓴다.","exfr":"Je ne choisis que des produits sans parabènes.","fr":"parabènes","frpos":"n.m.pl.","frdef":"Famille de conservateurs, souvent mentionnée dans « sans parabènes ».","ing":"한국어: 파라옥시안식향산에스테르 계열 보존제. 「무파라벤」 표시의 대상.\nFrançais : Famille de conservateurs, souvent mentionnée dans « sans parabènes ».","inci":"Methylparaben"},{"id":"BT1737","k":"h","cat":"skin","w":"인공향료","rom":"ingonghyangnyo","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"인공+향료","memofr":"Composé : 인공 (artificiel) + 향료 (parfum)","note":"Ingrédient évité dans les produits pour peaux sensibles ; on voit souvent la mention « 무향 ».","mean":"합성한 향 성분. 전성분에는 「향료」로 적히며 민감 피부의 기피 성분.","ex":"인공향료가 없어 향에 예민한 사람도 쓸 수 있다.","exfr":"Sans parfum de synthèse, il convient même aux personnes sensibles aux odeurs.","fr":"parfum de synthèse","frpos":"n.m.","frdef":"Composés parfumants synthétiques, notés « parfum » sur la liste INCI.","ing":"한국어: 합성한 향 성분. 전성분에는 「향료」로 적히며 민감 피부의 기피 성분.\nFrançais : Composés parfumants synthétiques, notés « parfum » sur la liste INCI.","inci":"Fragrance (Parfum)"},{"id":"BT1738","k":"h","cat":"skin","w":"계면활성제","rom":"gyemyeonhwalseongje","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"계면+활성+-제","memofr":"Dérivé : 계면 (interface) + 활성 (activité) + -제 (suffixe « agent »)","note":"Terme technique, devenu courant chez les consommateurs.","mean":"물과 기름을 섞이게 하는 성분. 세정제의 거품·세정력을 만듦.","ex":"계면활성제가 순한 약산성 클렌저를 골랐다.","exfr":"J'ai choisi un nettoyant au pH légèrement acide, aux tensioactifs doux.","fr":"tensioactif","frpos":"n.m.","frdef":"Agent permettant de mélanger eau et huile ; base des nettoyants.","ing":"한국어: 물과 기름을 섞이게 하는 성분. 세정제의 거품·세정력을 만듦.\nFrançais : Agent permettant de mélanger eau et huile ; base des nettoyants.","inci":"Sodium Cocoyl Isethionate"},{"id":"BT1739","k":"h","cat":"skin","w":"설페이트","rom":"seolpeiteu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memofr":"Emprunt (angl. sulfate)","note":"Les mentions « sans sulfates » (무설페이트) sont fréquentes.","mean":"SLS·SLES 등 황산염계 계면활성제. 세정력이 강해 「무설페이트」 표시의 대상.","ex":"설페이트가 없는 샴푸라 거품이 적다.","exfr":"C'est un shampoing sans sulfates, il mousse peu.","fr":"sulfates (SLS, SLES)","frpos":"n.m.pl.","frdef":"Tensioactifs sulfatés puissants, visés par la mention « sans sulfates ».","ing":"한국어: SLS·SLES 등 황산염계 계면활성제. 세정력이 강해 「무설페이트」 표시의 대상.\nFrançais : Tensioactifs sulfatés puissants, visés par la mention « sans sulfates ».","inci":"Sodium Laureth Sulfate"},{"id":"BT1740","k":"h","cat":"skin","w":"글리콜릭애씨드","rom":"geullikolligaessideu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"glycolic acid의 한글 전성분 표기","memofr":"Emprunt à l'anglais glycolic acid, graphie de l'étiquetage coréen","note":"AHA le plus connu ; voir 아하.","mean":"대표적인 AHA. 분자가 작아 각질 제거 효과가 강함.","ex":"글리콜릭애씨드 토너는 밤에만 쓴다.","exfr":"Je n'utilise la lotion à l'acide glycolique que le soir.","fr":"acide glycolique","frpos":"n.m.","frdef":"AHA de petite taille, exfoliant puissant.","ing":"한국어: 대표적인 AHA. 분자가 작아 각질 제거 효과가 강함.\nFrançais : AHA de petite taille, exfoliant puissant.","inci":"Glycolic Acid"},{"id":"BT1741","k":"h","cat":"skin","w":"락틱애씨드","rom":"raktigaessideu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"lactic acid의 한글 전성분 표기","memofr":"Emprunt à l'anglais lactic acid, graphie de l'étiquetage coréen","note":"AHA ; voir 아하.","mean":"젖산. 순한 편의 AHA로 각질 제거와 보습에 쓰임.","ex":"락틱애씨드 세럼으로 묵은 각질을 정리했다.","exfr":"J'ai éliminé les vieilles peaux mortes avec un sérum à l'acide lactique.","fr":"acide lactique","frpos":"n.m.","frdef":"AHA doux, exfoliant et hydratant.","ing":"한국어: 젖산. 순한 편의 AHA로 각질 제거와 보습에 쓰임.\nFrançais : AHA doux, exfoliant et hydratant.","inci":"Lactic Acid"},{"id":"BT1742","k":"h","cat":"skin","w":"만델릭애씨드","rom":"mandelligaessideu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"mandelic acid의 한글 전성분 표기","memofr":"Emprunt à l'anglais mandelic acid, graphie de l'étiquetage coréen","note":"AHA doux ; voir 아하.","mean":"아몬드에서 유래한 AHA. 분자가 커 자극이 적은 편.","ex":"만델릭애씨드는 민감한 피부도 쓰기 쉬운 편이다.","exfr":"L'acide mandélique est assez facile à utiliser, même pour les peaux sensibles.","fr":"acide mandélique","frpos":"n.m.","frdef":"AHA de grande taille, mieux toléré.","ing":"한국어: 아몬드에서 유래한 AHA. 분자가 커 자극이 적은 편.\nFrançais : AHA de grande taille, mieux toléré.","inci":"Mandelic Acid"},{"id":"BT1743","k":"s","cat":"skin","w":"아젤라익애씨드","rom":"ajellaigaessideu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"azelaic acid의 한글 전성분 표기","memofr":"Emprunt à l'anglais azelaic acid, graphie de l'étiquetage coréen","note":"Doublon de 아젤라익산, sous la graphie de l'étiquetage.","mean":"곡물에서 유래한 산. 트러블·붉은기·색소 관리 성분.","ex":"아젤라익애씨드 크림을 붉은 흔적에 발랐다.","exfr":"J'ai appliqué une crème à l'acide azélaïque sur les marques rouges.","fr":"acide azélaïque","frpos":"n.m.","frdef":"Acide utilisé contre les imperfections, rougeurs et taches.","ing":"한국어: 곡물에서 유래한 산. 트러블·붉은기·색소 관리 성분.\nFrançais : Acide utilisé contre les imperfections, rougeurs et taches.","inci":"Azelaic Acid" 세 전달체. 유효 성분을 감싸 전달하는 기술.\nFrançais : Vésicule de tensioactifs non ioniques servant à véhiculer les actifs."},{"id":"BT1764","k":"h","cat":"skin","w":"폴리뉴클레오타이드","rom":"pollinyukeulleotaideu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"약칭 PN","memofr":"Emprunt (angl. polynucleotide)","note":"Abrégé en PN ; voir PDRN.","mean":"연어 등에서 얻은 DNA 사슬(PN). PDRN보다 긴 사슬로, 스킨부스터 시술과 화장품에 쓰임.","ex":"폴리뉴클레오타이드 성분 앰플을 시술 후 관리에 썼다.","exfr":"J'ai utilisé une ampoule aux polynucléotides pour les soins après un acte esthétique.","fr":"polynucléotides (PN)","frpos":"n.m.pl.","frdef":"Chaînes d'ADN de saumon, plus longues que le PDRN.","ing":"한국어: 연어 등에서 얻은 DNA 사슬(PN). PDRN보다 긴 사슬로, 스킨부스터 시술과 화장품에 쓰임.\nFrançais : Chaînes d'ADN de saumon, plus longues que le PDRN.","inci":"Sodium DNA"},{"id":"BT1765","k":"h","cat":"skin","w":"알로에","rom":"alloe","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memofr":"Emprunt (angl. aloe)","note":"Gels d'aloe très populaires en Corée.","mean":"알로에 잎 겔·추출물. 수분 진정 젤의 대표 원료.","ex":"햇볕에 탄 팔에 알로에 젤을 듬뿍 발랐다.","exfr":"J'ai appliqué généreusement du gel d'aloe vera sur mes bras brûlés par le soleil.","fr":"aloe vera","frpos":"n.m.","frdef":"Gel de feuille d'aloès, apaisant après-soleil.","ing":"한국어: 알로에 잎 겔·추출물. 수분 진정 젤의 대표 원료.\nFrançais : Gel de feuille d'aloès, apaisant après-soleil.","inci":"Aloe Barbadensis Leaf Extract"},{"id":"BT1766","k":"h","cat":"skin","w":"솔잎","rom":"sorip","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"솔+잎","memofr":"Composé : 솔 (pin) + 잎 (feuille)","note":"Ingrédient traditionnel.","mean":"소나무 잎 추출물. 피지·모공 관리 제품 원료.","ex":"솔잎 성분 패드로 모공 부위를 닦았다.","exfr":"J'ai essuyé la zone des pores avec un disque aux aiguilles de pin.","fr":"aiguilles de pin","frpos":"n.f.pl.","frdef":"Extrait d'aiguilles de pin, utilisé dans les soins pores et sébum.","ing":"한국어: 소나무 잎 추출물. 피지·모공 관리 제품 원료.\nFrançais : Extrait d'aiguilles de pin, utilisé dans les soins pores et sébum.","inci":"Pinus Densiflora Leaf Extract"},{"id":"BT1767","k":"h","cat":"skin","w":"콤부차","rom":"kombucha","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memofr":"Emprunt (angl. kombucha)","note":"Tendance du « fermenté » dans la K-beauty.","mean":"홍차를 발효한 원료. 발효 에센스에 쓰임.","ex":"콤부차 에센스로 피부결을 정돈한다.","exfr":"J'affine mon grain de peau avec une essence au kombucha.","fr":"kombucha","frpos":"n.m.","frdef":"Thé noir fermenté utilisé dans les essences.","ing":"한국어: 홍차를 발효한 원료. 발효 에센스에 쓰임.\nFrançais : Thé noir fermenté utilisé dans les essences.","inci":"Saccharomyces/Xylinum/Black Tea Ferment"},{"id":"BT1768","k":"h","cat":"skin","w":"진주 가루","rom":"jinju garu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"진주+가루","memofr":"Locution : 진주 (perle) + 가루 (poudre)","note":"Ingrédient de beauté traditionnel en Asie.","mean":"진주를 곱게 간 가루. 맑은 톤·광을 내세우는 원료.","ex":"진주 가루가 들어 있어 은은하게 빛난다.","exfr":"Il contient de la poudre de perle qui donne un léger éclat.","fr":"poudre de perle","frpos":"n.f.","frdef":"Perle broyée donnant éclat et luminosité.","ing":"한국어: 진주를 곱게 간 가루. 맑은 톤·광을 내세우는 원료.\nFrançais : Perle broyée donnant éclat et luminosité.","inci":"Pearl Powder"},{"id":"BT1769","k":"h","cat":"skin","w":"줄기세포 배양액","rom":"julgisepo baeyangaek","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"줄기+세포+배양액","memofr":"Locution : 줄기세포 (cellule souche) + 배양액 (milieu de culture)","note":"Il s'agit du milieu de culture, pas de cellules vivantes.","mean":"줄기세포를 배양한 뒤 얻은 액. 재생·탄력을 내세우는 고가 원료.","ex":"줄기세포 배양액 앰플은 시술 후 관리용으로 많이 쓴다.","exfr":"Les ampoules au milieu conditionné de cellules souches sont très utilisées après les actes esthétiques.","fr":"milieu conditionné de cellules souches","frpos":"n.m.","frdef":"Milieu de culture de cellules souches, ingrédient régénérant haut de gamme.","ing":"한국어: 줄기세포를 배양한 뒤 얻은 액. 재생·탄력을 내세우는 고가 원료.\nFrançais : Milieu de culture de cellules souches, ingrédient régénérant haut de gamme.","inci":"Human Adipocyte Conditioned Media Extract"},{"id":"BT1770","k":"h","cat":"mask","w":"팩","rom":"paek","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"pack; 영어·프랑스어의 pack과 뜻이 다름","memofr":"Emprunt à l'anglais pack, avec glissement de sens","note":"Faux ami : en coréen, 팩 désigne tout type de masque, et non un emballage ou un lot.","mean":"얼굴에 바르거나 붙여 두었다가 떼거나 씻어 내는 미용 제품을 통틀어 이르는 말.","ex":"일주일에 두 번은 자기 전에 팩을 한다.","exfr":"Deux fois par semaine, je pose un masque avant de dormir.","fr":"masque (de soin)","frpos":"n.m.","frdef":"Tout soin que l'on pose ou étale sur le visage puis retire ; ne signifie pas « pack ».","faux":1},{"id":"BT1773","k":"h","cat":"mask","w":"시트 팩","rom":"siteu paek","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"sheet+pack","memofr":"Locution : 시트 (angl. sheet) + 팩 (angl. pack)","note":"Produit emblématique de la K-beauty à l'international.","mean":"에센스를 적신 얼굴 모양 시트를 붙이는 팩.","ex":"세안 후 시트 팩을 이십 분 붙였다.","exfr":"Après le nettoyage, j'ai gardé un masque en tissu vingt minutes.","fr":"masque en tissu","frpos":"n.m.","frdef":"Masque imbibé d'essence, en forme de visage."},{"id":"BT1774","k":"h","cat":"mask","w":"겔마스크","rom":"gelmaseukeu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"gel+mask","memofr":"Composé : 겔 (angl. gel) + 마스크 (angl. mask)","note":"Voir aussi 하이드로겔 패치.","mean":"에센스를 굳혀 만든 투명한 젤 형태의 시트 마스크. 붙이고 있으면 점점 투명해짐.","ex":"겔마스크를 붙이고 자면 아침에 투명해져 있다.","exfr":"Quand je dors avec un masque hydrogel, il est devenu transparent au matin.","fr":"masque hydrogel","frpos":"n.m.","frdef":"Masque en gel translucide qui libère son sérum au contact de la peau."},{"id":"BT1775","k":"h","cat":"mask","w":"랩핑 마스크","rom":"raepping maseukeu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"wrapping+mask","memofr":"Locution : 랩핑 (angl. wrapping) + 마스크 (angl. mask)","note":"Voir 크림 랩핑 마스크.","mean":"바르면 얇은 막으로 굳어 랩을 씌운 듯 밀착되고, 다음 날 떼어 내는 팩.","ex":"랩핑 마스크를 바르고 자고 아침에 한 번에 떼어 냈다.","exfr":"J'ai appliqué le masque filmogène de nuit avant de dormir et je l'ai retiré d'un seul coup le matin.","fr":"masque filmogène de nuit (wrapping mask)","frpos":"n.m.","frdef":"Masque qui sèche en film fin, se garde la nuit et se décolle le matin."},{"id":"BT1777","k":"s","cat":"mask","w":"슬리핑 팩","rom":"seulliping paek","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"sleeping+pack","memofr":"Locution : 슬리핑 (angl. sleeping) + 팩 (angl. pack)","note":"Synonyme de 수면 팩.","mean":"자기 전에 마지막 단계로 바르고 씻어 내지 않는 팩.","ex":"건조한 날에는 크림 대신 슬리핑 팩을 바르고 잔다.","exfr":"Les jours secs, j'applique un masque de nuit sans rinçage à la place de la crème.","fr":"masque de nuit sans rinçage","frpos":"n.m.","frdef":"Masque appliqué en dernière étape du soir et gardé toute la nuit.","par":"수면 팩","rel":"동의어"},{"id":"BT1778","k":"h","cat":"mask","w":"워시오프 팩","rom":"wosiopeu paek","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"wash-off+pack","memofr":"Locution : 워시오프 (angl. wash-off) + 팩 (angl. pack)","note":"Opposé à 필오프 팩.","mean":"바르고 일정 시간 뒤에 물로 씻어 내는 팩.","ex":"워시오프 팩은 십 분 뒤에 미온수로 씻어 낸다.","exfr":"Le masque à rincer s'élimine à l'eau tiède au bout de dix minutes.","fr":"masque à rincer","frpos":"n.m.","frdef":"Masque que l'on rince à l'eau après la pose."},{"id":"BT1779","k":"h","cat":"mask","w":"필오프 팩","rom":"piropeu paek","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"peel-off+pack","memofr":"Locution : 필오프 (angl. peel-off) + 팩 (angl. pack)","note":"Opposé à 워시오프 팩.","mean":"바른 뒤 마르면 막처럼 떼어 내는 팩.","ex":"필오프 팩을 떼어 낼 때 솜털까지 같이 뽑혔다.","exfr":"En retirant le masque peel-off, il a aussi arraché le duvet.","fr":"masque peel-off","frpos":"n.m.","frdef":"Masque qui sèche en film et se décolle d'une pièce."},{"id":"BT1780","k":"s","cat":"mask","w":"고무 팩","rom":"gomu paek","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"고무+팩; =모델링팩","memofr":"Locution : 고무 (caoutchouc) + 팩 (angl. pack)","note":"Synonyme de 모델링 팩.","mean":"가루를 물에 개어 바르면 고무처럼 굳고, 한 번에 떼어 내는 팩. 「모델링팩」의 다른 이름.","ex":"피부과에서 관리 마지막에 고무 팩을 올려 주었다.","exfr":"À la fin du soin, la dermatologue m'a posé un masque alginate.","fr":"masque alginate (« masque caoutchouc »)","frpos":"n.m.","frdef":"Masque en poudre qui gélifie comme du caoutchouc ; autre nom du modeling mask.","par":"모델링 팩","rel":"동의어"},{"id":"BT1781","k":"h","cat":"mask","w":"컵 팩","rom":"keop paek","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"cup+pack","memofr":"Locution : 컵 (angl. cup) + 팩 (angl. pack)","note":"Format individuel pratique.","mean":"컵에 든 가루에 물을 부어 바로 개어 쓰는 1회용 모델링팩.","ex":"컵 팩이라 집에서도 모델링팩을 쉽게 할 수 있다.","exfr":"Avec un masque alginate en gobelet, on peut facilement faire un masque modelant chez soi.","fr":"masque alginate en gobelet","frpos":"n.m.","frdef":"Modeling mask en dose unique à préparer dans son gobelet."},{"id":"BT1782","k":"h","cat":"mask","w":"버블 팩","rom":"beobeul paek","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"bubble+pack","memofr":"Locution : 버블 (angl. bubble) + 팩 (angl. pack)","note":"Produit ludique, populaire sur les réseaux sociaux.","mean":"바르면 거품이 올라오는 팩. 짧은 시간 뒤 씻어 내며 모공·각질 관리를 내세움.","ex":"버블 팩을 바르자 얼굴에 거품이 보글보글 올라왔다.","exfr":"Dès que j'ai appliqué le masque moussant, des bulles se sont formées sur mon visage.","fr":"masque moussant (bubble mask)","frpos":"n.m.","frdef":"Masque qui mousse sur la peau avant rinçage."},{"id":"BT1783","k":"h","cat":"mask","w":"클레이 팩","rom":"keullei paek","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"clay+pack","memofr":"Locution : 클레이 (angl. clay) + 팩 (angl. pack)","note":"En français : « masque à l'argile ».","mean":"점토 성분으로 피지를 흡착하는 워시오프팩.","ex":"클레이 팩은 완전히 마르기 전에 씻어 낸다.","exfr":"On rince le masque à l'argile avant qu'il ne sèche complètement.","fr":"masque à l'argile","frpos":"n.m.","frdef":"Masque à rincer à base d'argile absorbante."},{"id":"BT1784","k":"h","cat":"mask","w":"스킨 팩","rom":"seukin paek","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"skin+pack","memofr":"Locution : 스킨 (« toner » en coréen) + 팩 (angl. pack)","note":"Ici, 스킨 signifie « toner » (faux ami).","mean":"토너를 적신 화장솜이나 패드를 얼굴에 올려 두는 관리법.","ex":"아침에는 세안 대신 스킨 팩을 오 분 한다.","exfr":"Le matin, au lieu de me nettoyer le visage, je fais un masque express au toner pendant cinq minutes.","fr":"masque express au toner","frpos":"n.m.","frdef":"Cotons imbibés de toner posés quelques minutes sur le visage."},{"id":"BT1785","k":"h","cat":"mask","w":"패드","rom":"paedeu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"pad","memofr":"Emprunt à l'anglais pad","note":"En Corée, il désigne surtout des disques déjà imbibés et vendus en pot.","mean":"토너나 에센스를 적셔 통에 담아 파는 둥근 솜. 닦아 내거나 얼굴에 올려 둠.","ex":"세안 후 패드로 피부결을 닦아 낸다.","exfr":"Après le nettoyage, j'essuie mon visage avec un disque imbibé pour affiner le grain.","fr":"disque imbibé (pad)","frpos":"n.m.","frdef":"Disque de coton pré-imbibé de toner, vendu en pot.","faux":1},{"id":"BT1788","k":"s","cat":"mask","w":"여드름 패치","rom":"yeodeureum paechi","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"여드름+패치","memofr":"Locution : 여드름 (acné) + 패치 (angl. patch)","note":"Synonyme de 트러블 패치.","mean":"트러블 부위에 붙여 진물을 흡수하고 손이 닿지 않게 하는 작은 스티커.","ex":"여드름 패치를 붙이고 자면 아침에 가라앉아 있다.","exfr":"Quand je dors avec un patch anti-boutons, le bouton a dégonflé au matin.","fr":"patch anti-boutons","frpos":"n.m.","frdef":"Petit pansement posé sur un bouton pour l'absorber et le protéger.","par":"트러블 패치","rel":"동의어"},{"id":"BT1789","k":"h","cat":"mask","w":"니들 패치","rom":"nideul paechi","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"needle+patch","memofr":"Locution : 니들 (angl. needle) + 패치 (angl. patch)","note":"Voir 마이크로니들.","mean":"유효 성분을 굳혀 만든 미세한 바늘이 달린 패치. 붙이면 바늘이 녹아 스며듦.","ex":"니들 패치는 붙일 때 살짝 따끔하다.","exfr":"Le patch à micro-aiguilles picote légèrement à la pose.","fr":"patch à micro-aiguilles","frpos":"n.m.","frdef":"Patch garni de micro-aiguilles solubles d'actifs."},{"id":"BT1792","k":"s","cat":"skin","w":"스킨","rom":"seukin","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"skin; 영어 skin과 뜻이 다름. =토너, 화장수","memofr":"Emprunt à l'anglais skin, avec glissement de sens","note":"Faux ami : en coréen, 스킨 désigne le toner, pas la peau.","mean":"세안 뒤 처음 바르는 물 같은 기초 화장품. 「토너」「화장수」와 같은 말.","ex":"세안하고 스킨부터 바른다.","exfr":"Après m'être lavé le visage, je commence par le toner.","fr":"toner (lotion tonique)","frpos":"n.m.","frdef":"En coréen, premier soin liquide après le nettoyage ; ne signifie pas « peau ».","par":"토너","rel":"동의어"},{"id":"BT1793","k":"s","cat":"skin","w":"화장수","rom":"hwajangsu","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"화장+수","memofr":"Composé : 화장 (maquillage, soin) + 수 (eau)","note":"Terme plus ancien que 스킨 et 토너.","mean":"세안 뒤 피부결을 정돈하려고 바르는 물 같은 화장품. 「스킨」「토너」의 한자어.","ex":"화장수를 손바닥에 덜어 얼굴에 두드려 바른다.","exfr":"Je verse la lotion tonique dans la paume et je l'applique en tapotant.","fr":"lotion tonique","frpos":"n.f.","frdef":"Terme sino-coréen pour le toner.","par":"토너","rel":"동의어"},{"id":"BT1794","k":"h","cat":"skin","w":"스킨로션","rom":"seukillosyeon","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"skin+lotion","memofr":"Composé : 스킨 (toner) + 로션 (émulsion)","note":"Duo de base des routines coréennes traditionnelles.","mean":"스킨(토너)과 로션(유액)을 묶어 이르는 말. 기초 화장의 기본 두 단계.","ex":"아빠는 스킨로션만 바른다.","exfr":"Mon père n'applique que le duo toner et émulsion.","fr":"toner et émulsion (duo de base)","frpos":"n.m. / n.f.","frdef":"Désigne le duo toner + lait, base de la routine coréenne."},{"id":"BT1795","k":"s","cat":"skin","w":"유액","rom":"yuaek","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"유+액","memofr":"Composé : 유 (lait) + 액 (liquide)","note":"Terme plus ancien que 로션.","mean":"물과 기름이 섞인 묽은 보습 화장품. 「로션」「에멀전」의 한자어.","ex":"스킨 다음에 유액을 발라 수분을 잡아 준다.","exfr":"Après le toner, j'applique une émulsion pour retenir l'hydratation.","fr":"émulsion (lait de soin)","frpos":"n.f.","frdef":"Terme sino-coréen pour le lait hydratant.","par":"로션","rel":"동의어"},{"id":"BT1799","k":"h","cat":"skin","w":"퍼스트 에센스","rom":"peoseuteu esenseu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"first+essence","memofr":"Locution : 퍼스트 (angl. first) + 에센스 (angl. essence)","note":"Étape propre à la routine asiatique.","mean":"세안 직후 가장 먼저 바르는 물 같은 에센스. 다음 단계 흡수를 돕는다고 내세움.","ex":"세안 후 퍼스트 에센스를 손으로 눌러 흡수시킨다.","exfr":"Après le nettoyage, je fais pénétrer la première essence en pressant avec les mains.","fr":"première essence","frpos":"n.f.","frdef":"Essence liquide appliquée juste après le nettoyage pour préparer la peau."},{"id":"BT1800","k":"h","cat":"skin","w":"미스트","rom":"miseuteu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"mist","memofr":"Emprunt à l'anglais mist","note":"En français : « brume ».","mean":"안개처럼 뿌려 수분을 공급하는 화장품.","ex":"사무실이 건조해서 미스트를 수시로 뿌린다.","exfr":"Le bureau est sec, alors je vaporise de la brume régulièrement.","fr":"brume","frpos":"n.f.","frdef":"Soin hydratant en vaporisateur."},{"id":"BT1803","k":"h","cat":"skin","w":"멀티밤","rom":"meoltibam","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"multi+balm","memofr":"Composé : 멀티 (angl. multi) + 밤 (angl. balm)","note":"Produit coréen très populaire (stick multi-usages).","mean":"스틱 형태의 고체 보습제. 눈가·입가·목 등 여러 부위에 덧바름.","ex":"건조한 눈가에 멀티밤을 수시로 바른다.","exfr":"J'applique souvent un baume multi-usages en stick sur le contour des yeux sec.","fr":"baume multi-usages en stick","frpos":"n.m.","frdef":"Baume solide en stick à appliquer sur toutes les zones sèches."},{"id":"BT1808","k":"h","cat":"skin","w":"시카 크림","rom":"sika keurim","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"cica+cream","memofr":"Locution : 시카 (cica) + 크림 (angl. cream)","note":"Catégorie phare du soin apaisant coréen.","mean":"병풀 성분을 내세운 진정·재생 크림.","ex":"마스크 때문에 뒤집어진 턱에 시카 크림을 발랐다.","exfr":"J'ai appliqué une crème cica sur mon menton irrité par le masque.","fr":"crème cica","frpos":"n.f.","frdef":"Crème réparatrice à la Centella asiatica."},{"id":"BT1817","k":"h","cat":"body","w":"풋 필링","rom":"put pilling","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"foot+peeling","memofr":"Locution : 풋 (angl. foot) + 필링 (angl. peeling)","note":"Synonyme de 발 허물 팩.","mean":"양말처럼 신어 두면 며칠 뒤 발 각질이 벗겨지는 각질 제거 팩.","ex":"풋 필링을 하고 나흘째부터 발바닥 각질이 벗겨졌다.","exfr":"Quatre jours après le peeling pour les pieds, les peaux mortes ont commencé à peler.","fr":"peeling pour les pieds (chaussettes exfoliantes)","frpos":"n.m.","frdef":"Chaussettes exfoliantes qui font peler la peau des pieds."},{"id":"BT1818","k":"h","cat":"body","w":"입욕제","rom":"ibyokje","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"입욕+-제","memofr":"Dérivé : 입욕 (bain) + -제 (suffixe « agent »)","note":"Terme générique (sels, bombes de bain…).","mean":"목욕물에 풀어 쓰는 제품.","ex":"반신욕을 할 때 입욕제를 한 알 넣는다.","exfr":"Pendant mon bain de siège, je mets une boule de produit pour le bain.","fr":"produit pour le bain","frpos":"n.m.","frdef":"Sels, bombes ou poudres à dissoudre dans le bain."},{"id":"BT1819","k":"h","cat":"body","w":"때","rom":"ttae","pos":"명사","unit":"단어","eo":"고유어","form":"단일어","memo":"「때를 밀다」로 씀","memofr":"Mot simple","note":"S'emploie surtout dans l'expression 때를 밀다 (« frotter la crasse »), au cœur de la culture des bains publics coréens.","mean":"몸의 묵은 각질과 노폐물이 뭉친 것. 불려서 밀어 내는 한국 목욕 문화의 대상.","ex":"오랜만에 목욕탕에 가서 때를 밀었다.","exfr":"Je suis allée au bain public pour la première fois depuis longtemps et j'ai frotté les peaux mortes du corps.","fr":"peaux mortes du corps (« ttae »)","frpos":"n.f.pl.","frdef":"Peaux mortes que l'on fait rouler en frottant après le bain, dans la culture coréenne."},{"id":"BT1820","k":"h","cat":"body","w":"때수건","rom":"ttaesugeon","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"때+수건; =이태리타월","memofr":"Composé : 때 (crasse, peaux mortes) + 수건 (serviette)","note":"Aussi appelé 이태리타월 (« serviette italienne »), d'après le tissu d'origine.","mean":"때를 밀 때 쓰는 까슬한 장갑 모양 수건. 흔히 「이태리타월」이라 부름.","ex":"초록색 때수건으로 등을 밀었다.","exfr":"Je me suis frotté le dos avec un gant de gommage coréen vert.","fr":"gant de gommage coréen","frpos":"n.m.","frdef":"Gant rêche servant au gommage du corps ; appelé aussi « serviette italienne »."},{"id":"BT1821","k":"h","cat":"body","w":"때밀이","rom":"ttaemiri","pos":"명사","unit":"단어","eo":"고유어","form":"파생어","memo":"때+밀-+-이","memofr":"Dérivé : 때 (peaux mortes) + 밀- (frotter) + -이 (suffixe nominal)","note":"Désigne aussi la personne qui pratique le gommage dans les bains.","mean":"때수건으로 몸의 때를 미는 일.","ex":"때밀이를 하고 나면 바디로션이 잘 스민다.","exfr":"Après un gommage coréen du corps, le lait corporel pénètre bien.","fr":"gommage coréen du corps","frpos":"n.m.","frdef":"Gommage vigoureux du corps au gant, pratiqué au bain public."},{"id":"BT1822","k":"h","cat":"body","w":"세신","rom":"sesin","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"세신","memofr":"Composé : 세 (laver) + 신 (corps)","note":"Prestation typique des bains publics coréens (목욕탕, 찜질방).","mean":"목욕탕에서 전문 관리사가 때를 밀어 주는 서비스.","ex":"찜질방에서 세신을 받았다.","exfr":"Je me suis fait faire un gommage au bain public, au jjimjilbang.","fr":"gommage au bain public (seshin)","frpos":"n.m.","frdef":"Gommage intégral réalisé par un professionnel au bain public coréen."},{"id":"BT1823","k":"h","cat":"body","w":"닭살","rom":"daksal","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"닭+살","memofr":"Composé : 닭 (poule) + 살 (peau)","note":"Polysémie : également « chair de poule » (frissons), comme en français.","mean":"팔·허벅지에 오돌토돌하게 돋는 모공각화증을 이르는 말.","ex":"팔뚝 닭살 때문에 각질 제거 바디로션을 쓴다.","exfr":"À cause de la kératose pilaire sur le haut des bras, j'utilise un lait corporel exfoliant.","fr":"kératose pilaire (« chair de poule »)","frpos":"n.f.","frdef":"Petits grains rugueux sur les bras ou les cuisses."},{"id":"BT1824","k":"h","cat":"body","w":"튼살","rom":"teunsal","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"트-+-ㄴ+살","memofr":"Composé : 트- (se fendre) + -ㄴ (déterminant) + 살 (peau)","note":"Mot courant.","mean":"살이 갑자기 늘어나며 피부에 생긴 줄무늬 자국.","ex":"임신 중에는 튼살이 생기지 않게 오일을 바른다.","exfr":"Pendant la grossesse, j'applique une huile pour éviter les vergetures.","fr":"vergetures","frpos":"n.f.pl.","frdef":"Stries apparaissant quand la peau s'étire trop vite."},{"id":"BT1826","k":"h","cat":"body","w":"발각질","rom":"balgakjil","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"발+각질","memofr":"Composé : 발 (pied) + 각질 (peaux mortes)","note":"Mot courant ; voir 풋 필링.","mean":"발뒤꿈치와 발바닥에 두껍게 쌓인 각질.","ex":"겨울만 되면 발각질이 하얗게 일어난다.","exfr":"Chaque hiver, les callosités de mes pieds blanchissent et se soulèvent.","fr":"callosités des pieds","frpos":"n.f.pl.","frdef":"Peau épaisse et sèche des talons."},{"id":"BT1827","k":"h","cat":"skin","w":"턱드름","rom":"teokdeureum","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(혼성어)","memo":"턱+(여)드름","memofr":"Mot-valise : 턱 (menton) + (여)드름 (acné)","note":"Même modèle que 등드름 et 가드름 (voir -드름).","mean":"턱에 나는 여드름을 줄여 이르는 말.","ex":"마스크를 오래 썼더니 턱드름이 올라왔다.","exfr":"À force de porter le masque, j'ai eu des boutons sur le menton.","fr":"boutons du menton","frpos":"n.m.pl.","frdef":"Acné localisée sur le menton (mot-valise)."},{"id":"BT1828","k":"h","cat":"body","w":"엉드름","rom":"eongdeureum","pos":"명사","unit":"단어","eo":"고유어","form":"축약어(혼성어)","memo":"엉(덩이)+(여)드름","memofr":"Mot-valise : 엉(덩이) (fesses) + (여)드름 (acné)","note":"Même modèle que 턱드름.","mean":"엉덩이에 나는 여드름을 줄여 이르는 말.","ex":"오래 앉아 있으면 엉드름이 생긴다.","exfr":"Quand je reste longtemps assise, j'ai des boutons sur les fesses.","fr":"boutons des fesses","frpos":"n.m.pl.","frdef":"Acné localisée sur les fesses (mot-valise)."},{"id":"BT1831","k":"h","cat":"tool","w":"압출","rom":"apchul","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"압출","memofr":"Composé : 압 (pression) + 출 (sortir)","note":"Acte de soin en institut ; il est déconseillé de le faire chez soi.","mean":"모공 속 피지나 여드름 내용물을 도구로 눌러 빼내는 일.","ex":"피부과에서 압출을 받고 진정 관리를 했다.","exfr":"Chez la dermatologue, j'ai eu une extraction suivie d'un soin apaisant.","fr":"extraction (des comédons)","frpos":"n.f.","frdef":"Fait d'extraire le sébum ou le contenu d'un bouton avec un outil."},{"id":"BT1832","k":"h","cat":"skin","w":"면포","rom":"myeonpo","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"면포","memofr":"Composé : 면 (visage) + 포 (bouton)","note":"Terme médical ; dans la langue courante, on dit plutôt 좁쌀 여드름.","mean":"모공에 피지와 각질이 뭉쳐 막힌 초기 여드름. 화이트헤드와 블랙헤드를 아우름.","ex":"면포는 염증이 되기 전에 관리해야 한다.","exfr":"Il faut traiter les comédons avant qu'ils ne s'enflamment.","fr":"comédon","frpos":"n.m.","frdef":"Pore obstrué par le sébum (point blanc ou point noir)."},{"id":"BT1833","k":"h","cat":"skin","w":"블랙헤드","rom":"beullaekhedeu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"blackhead / 원어에서 통째로 들어온 외래어라 단일어로 봄","memofr":"Emprunt à l'anglais blackhead ; traité comme mot simple","note":"Mot courant ; voir 블랙헤드 멜팅.","mean":"모공에 찬 피지가 산화해 검게 보이는 것.","ex":"코에 블랙헤드가 많아 오일로 녹여 낸다.","exfr":"J'ai beaucoup de points noirs sur le nez, je les dissous à l'huile.","fr":"points noirs","frpos":"n.m.pl.","frdef":"Comédons ouverts oxydés."},{"id":"BT1834","k":"h","cat":"skin","w":"화이트헤드","rom":"hwaiteuhedeu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"whitehead / 원어에서 통째로 들어온 외래어라 단일어로 봄","memofr":"Emprunt à l'anglais whitehead ; traité comme mot simple","note":"Mot courant ; voir 면포.","mean":"모공이 닫힌 채 피지가 하얗게 찬 것.","ex":"세안 후 화이트헤드가 하얗게 올라와 보인다.","exfr":"Après le nettoyage, des points blancs apparaissent.","fr":"points blancs","frpos":"n.m.pl.","frdef":"Comédons fermés."},{"id":"BT1835","k":"h","cat":"skin","w":"열감","rom":"yeolgam","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"열+-감","memofr":"Dérivé : 열 (chaleur) + -감 (suffixe « sensation »)","note":"Notion récurrente du marketing coréen.","mean":"피부가 달아올라 뜨겁게 느껴지는 것. 진정·쿨링 제품의 관리 대상.","ex":"햇볕을 쬔 뒤 얼굴 열감을 쿨링 패드로 내렸다.","exfr":"Après l'exposition au soleil, j'ai fait baisser la sensation de chaleur du visage avec des disques rafraîchissants.","fr":"sensation de chaleur (échauffement)","frpos":"n.f.","frdef":"Chaleur ressentie sur la peau, que les soins rafraîchissants visent à calmer."},{"id":"BT1836","k":"h","cat":"gen","w":"붓기","rom":"butgi","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"붓-+-기; 표준어는 부기","memofr":"Dérivé : 붓- (gonfler) + -기 (suffixe nominal)","note":"Graphie courante 붓기 ; la forme standard est 부기.","mean":"얼굴이나 몸이 부어오른 상태. 표준어는 「부기」.","ex":"아침 붓기를 괄사로 풀어 준다.","exfr":"Je fais disparaître le gonflement du visage le matin avec un gua sha.","fr":"gonflement (bouffissure)","frpos":"n.m.","frdef":"Visage ou corps gonflé, surtout au réveil."},{"id":"BT1837","k":"h","cat":"gen","w":"경락","rom":"gyeongnak","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"경락","memofr":"Composé : 경 (méridien) + 락 (vaisseau)","note":"Notion de médecine traditionnelle ; massage d'institut souvent appuyé.","mean":"얼굴과 몸의 혈 자리를 강하게 눌러 붓기와 윤곽을 관리하는 마사지.","ex":"결혼식 전에 경락을 열 번 받았다.","exfr":"Avant le mariage, j'ai suivi dix séances de massage méridien coréen.","fr":"massage méridien coréen (gyeongrak)","frpos":"n.m.","frdef":"Massage appuyé le long des méridiens pour dégonfler et sculpter le visage."},{"id":"BT1839","k":"h","cat":"skin","w":"팔자주름","rom":"paljajureum","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"팔자+주름","memofr":"Composé : 팔자 (le caractère « huit ») + 주름 (ride)","note":"Le nom vient de la forme du caractère chinois signifiant « huit », qui ressemble à un V inversé.","mean":"코 양옆에서 입가로 여덟 팔 자 모양으로 내려오는 주름.","ex":"웃을 때 팔자주름이 깊어져서 탄력 크림을 바른다.","exfr":"Mes sillons nasogéniens se creusent quand je souris, alors j'applique une crème raffermissante.","fr":"sillons nasogéniens","frpos":"n.m.pl.","frdef":"Rides allant des ailes du nez aux coins de la bouche, en V inversé (forme du caractère chinois signifiant « huit »)."},{"id":"BT1840","k":"h","cat":"gen","w":"앞볼","rom":"apbol","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"앞+볼","memofr":"Composé : 앞 (avant) + 볼 (joue)","note":"Zone cible des injections de comblement.","mean":"눈 밑부터 광대 앞쪽까지의 볼 부위. 꺼지면 나이 들어 보인다고 함.","ex":"앞볼에 하이라이터를 올리면 얼굴이 어려 보인다.","exfr":"Un enlumineur sur l'avant des pommettes rajeunit le visage.","fr":"pommettes (avant des joues)","frpos":"n.f.pl.","frdef":"Partie avant de la joue, sous l'œil."},{"id":"BT1841","k":"h","cat":"skin","w":"각질층","rom":"gakjilcheung","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"각질+층","memofr":"Composé : 각질 (kératine) + 층 (couche)","note":"Terme scientifique devenu courant.","mean":"피부 가장 바깥쪽의 죽은 세포층. 수분을 지키는 장벽 역할을 함.","ex":"각질층이 얇아지면 피부가 쉽게 예민해진다.","exfr":"Quand la couche cornée s'amincit, la peau se sensibilise facilement.","fr":"couche cornée","frpos":"n.f.","frdef":"Couche la plus externe de l'épiderme."},{"id":"BT1842","k":"h","cat":"skin","w":"턴오버","rom":"teonobeo","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"turnover","memofr":"Emprunt à l'anglais turnover","note":"Notion scientifique reprise par la publicité.","mean":"각질 세포가 새로 만들어져 떨어져 나가기까지의 주기.","ex":"피부 턴오버가 느려지면 각질이 쌓인다.","exfr":"Quand le renouvellement cellulaire ralentit, les peaux mortes s'accumulent.","fr":"renouvellement cellulaire","frpos":"n.m.","frdef":"Cycle de renouvellement des cellules de la peau."},{"id":"BT1849","k":"h","cat":"skin","w":"트러블성 피부","rom":"teureobeulseong pibu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"트러블+-성+피부","memofr":"Locution : 트러블 (angl. trouble, « boutons ») + -성 (suffixe « tendance ») + 피부 (peau)","note":"Voir 트러블 (faux ami).","mean":"여드름이나 뾰루지가 자주 나는 피부.","ex":"트러블성 피부라 오일이 많은 크림은 피한다.","exfr":"J'ai une peau à imperfections, j'évite les crèmes riches en huile.","fr":"peau à imperfections","frpos":"n.f.","frdef":"Peau sujette aux boutons."},{"id":"BT1850","k":"h","cat":"gen","w":"꿀광","rom":"kkulgwang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"꿀+광","memofr":"Composé : 꿀 (miel) + 광 (éclat)","note":"Voir 꿀피부.","mean":"꿀을 바른 듯 촉촉하고 깊은 윤기.","ex":"프로폴리스 앰플을 바르니 꿀광이 돈다.","exfr":"Avec une ampoule à la propolis, ma peau prend un éclat « miel ».","fr":"éclat « miel »","frpos":"n.m.","frdef":"Brillance dense et hydratée, comme enduite de miel."},{"id":"BT1852","k":"h","cat":"gen","w":"광채","rom":"gwangchae","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"광채","memofr":"Composé : 광 (lumière) + 채 (couleur)","note":"Mot clé des fiches produit coréennes ; il a donné la série des mots en -광.","mean":"피부에서 환하게 나는 빛. 한국 제품에서 '광' 표현의 대표어.","ex":"수면팩을 한 다음 날은 피부에 광채가 난다.","exfr":"Le lendemain d'un masque de nuit, ma peau a de l'éclat.","fr":"éclat","frpos":"n.m.","frdef":"Luminosité du teint."},{"id":"BT1854","k":"h","cat":"gen","w":"찹쌀떡 피부","rom":"chapssaltteok pibu","pos":"명사","unit":"구","eo":"고유어","form":"구","memo":"찹쌀떡+피부","memofr":"Locution : 찹쌀떡 (gâteau de riz gluant) + 피부 (peau)","note":"Image culinaire propre à la culture coréenne.","mean":"찹쌀떡처럼 하얗고 말랑하며 쫀득한 피부.","ex":"아이돌처럼 찹쌀떡 피부가 되고 싶다.","exfr":"Je voudrais avoir une peau « mochi » comme les idoles.","fr":"peau « mochi »","frpos":"n.f.","frdef":"Peau blanche, souple et rebondie comme un gâteau de riz gluant."},{"id":"BT1856","k":"h","cat":"gen","w":"백옥 피부","rom":"baegok pibu","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"백옥+피부","memofr":"Locution : 백옥 (jade blanc) + 피부 (peau)","note":"Image traditionnelle de la beauté est-asiatique.","mean":"흰 옥처럼 희고 맑은 피부.","ex":"백옥 피부로 유명한 배우가 광고한다.","exfr":"C'est une actrice célèbre pour son teint de jade blanc qui fait la publicité.","fr":"teint de jade blanc","frpos":"n.m.","frdef":"Peau claire et pure comme le jade blanc."},{"id":"BT1858","k":"h","cat":"gen","w":"아기 피부","rom":"agi pibu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"아기+피부","memofr":"Locution : 아기 (bébé) + 피부 (peau)","note":"Image commune au français.","mean":"아기처럼 보드랍고 잡티 없는 피부.","ex":"필링 후에 아기 피부처럼 보들보들해졌다.","exfr":"Après le peeling, ma peau est devenue douce comme une peau de bébé.","fr":"peau de bébé","frpos":"n.f.","frdef":"Peau douce et sans défaut."},{"id":"BT1859","k":"h","cat":"gen","w":"기초","rom":"gicho","pos":"명사","unit":"단어","eo":"한자어","form":"단일어","memo":"기초; 「기초 화장품」의 줄임","memofr":"Mot simple (troncation de 기초 화장품)","note":"S'oppose à 색조 (maquillage).","mean":"세안 뒤 색조 전에 바르는 스킨케어 단계, 또는 그 제품들.","ex":"기초를 탄탄하게 해야 화장이 잘 먹는다.","exfr":"Il faut de bons soins de base pour que le maquillage prenne bien.","fr":"soins de base (skincare)","frpos":"n.m.pl.","frdef":"Étapes de soin précédant le maquillage, et les produits correspondants.","faux":1},{"id":"BT1862","k":"h","cat":"gen","w":"한방 화장품","rom":"hanbang hwajangpum","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"한방+화장품","memofr":"Locution : 한방 (médecine traditionnelle coréenne) + 화장품 (cosmétique)","note":"Segment haut de gamme emblématique du marché coréen.","mean":"인삼 등 한약재 성분과 한의학 개념을 내세운 화장품.","ex":"부모님 선물로 한방 화장품 세트를 샀다.","exfr":"J'ai acheté un coffret de cosmétiques « hanbang » pour offrir à mes parents.","fr":"cosmétiques « hanbang »","frpos":"n.m.pl.","frdef":"Cosmétiques inspirés de la médecine traditionnelle coréenne."},{"id":"BT1864","k":"h","cat":"gen","w":"더모 코스메틱","rom":"deomo koseumetik","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"dermo+cosmetic; =더마 화장품","memofr":"Locution : 더모 (angl. dermo) + 코스메틱 (angl. cosmetic)","note":"Notion d'origine française (marques de pharmacie).","mean":"피부과학에 바탕을 두고 민감 피부용으로 만든 화장품. 「더마 화장품」이라고도 함.","ex":"피부가 예민해져서 더모 코스메틱으로 바꿨다.","exfr":"Ma peau est devenue sensible, alors je suis passée à la dermo-cosmétique.","fr":"dermo-cosmétique","frpos":"n.f.","frdef":"Cosmétiques d'inspiration dermatologique."},{"id":"BT1871","k":"h","cat":"gen","w":"의약외품","rom":"uiyagoepum","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"의약+외+품","memofr":"Composé : 의약 (médicament) + 외 (hors) + 품 (produit)","note":"Catégorie réglementaire coréenne sans équivalent exact dans l'UE.","mean":"의약품과 화장품 사이의 법정 분류. 탈모 완화 샴푸, 여드름 세정제 등이 해당함.","ex":"이 샴푸는 화장품이 아니라 의약외품이다.","exfr":"Ce shampoing n'est pas un cosmétique mais un quasi-médicament.","fr":"quasi-médicament (catégorie coréenne)","frpos":"n.m.","frdef":"Catégorie réglementaire coréenne entre médicament et cosmétique."},{"id":"BT1872","k":"h","cat":"gen","w":"미백 기능성","rom":"mibaek gineungseong","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"미백+기능성","memofr":"Locution : 미백 (éclaircissement) + 기능성 (fonction réglementée)","note":"Voir 기능성 화장품.","mean":"식약처에서 미백 효능을 인정받은 기능성 화장품이라는 표시.","ex":"미백 기능성 인증을 받은 세럼이다.","exfr":"C'est un sérum certifié pour sa fonction éclaircissante.","fr":"fonction éclaircissante certifiée","frpos":"n.f.","frdef":"Mention officielle coréenne pour un cosmétique éclaircissant."},{"id":"BT1873","k":"h","cat":"gen","w":"이중 기능성","rom":"ijung gineungseong","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"이중+기능성","memofr":"Locution : 이중 (double) + 기능성 (fonction réglementée)","note":"Voir 3중 기능성.","mean":"미백·주름 개선·자외선 차단 가운데 두 가지 기능성을 함께 인정받았다는 표시.","ex":"이중 기능성 크림이라 미백과 주름 개선을 함께 관리한다.","exfr":"C'est une crème à double fonction certifiée : elle traite à la fois l'éclat et les rides.","fr":"double fonction certifiée","frpos":"n.f.","frdef":"Mention coréenne : produit certifié pour deux fonctions à la fois (parmi éclaircissant, antirides, protection UV)."},{"id":"BT1874","k":"h","cat":"gen","w":"브라이트닝","rom":"beuraiteuning","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"brightening","memofr":"Emprunt à l'anglais brightening","note":"Terme préféré à « whitening » dans le marketing international actuel.","mean":"칙칙한 피부 톤을 맑고 환하게 하는 관리.","ex":"브라이트닝 세럼으로 칙칙한 톤을 관리한다.","exfr":"Je traite mon teint terne avec un sérum de soin éclat.","fr":"soin éclat (brightening)","frpos":"n.m.","frdef":"Soin visant à illuminer le teint."},{"id":"BT1875","k":"s","cat":"gen","w":"화이트닝","rom":"hwaiteuning","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"whitening","memofr":"Emprunt à l'anglais whitening","note":"Terme de plus en plus évité à l'international ; en Corée, on dit plutôt 미백 ou 브라이트닝.","mean":"「미백」을 이르는 외래어. 잡티를 옅게 하고 톤을 밝히는 관리.","ex":"화이트닝 크림을 밤마다 바른다.","exfr":"J'applique une crème d'éclaircissement du teint tous les soirs.","fr":"éclaircissement du teint (« whitening »)","frpos":"n.m.","frdef":"Synonyme de 미백 ; ne désigne pas un blanchiment au sens propre.","par":"미백","rel":"동의어"},{"id":"BT1876","k":"h","cat":"skin","w":"속수분","rom":"soksubun","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"속+수분","memofr":"Composé : 속 (intérieur) + 수분 (hydratation)","note":"Voir 속건조 et 속보습.","mean":"피부 안쪽에 채워진 수분을 이르는 말.","ex":"속수분을 채우는 앰플부터 바른다.","exfr":"Je commence par une ampoule qui comble l'hydratation interne.","fr":"hydratation interne","frpos":"n.f.","frdef":"Eau contenue en profondeur dans la peau."},{"id":"BT1877","k":"h","cat":"skin","w":"속탄력","rom":"soktallyeok","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"속+탄력","memofr":"Composé : 속 (intérieur) + 탄력 (fermeté)","note":"Formule publicitaire.","mean":"피부 안쪽에서부터 차오르는 탄력을 이르는 말.","ex":"속탄력이 떨어져 볼이 처져 보인다.","exfr":"Ma peau a perdu en fermeté profonde, mes joues paraissent affaissées.","fr":"fermeté profonde","frpos":"n.f.","frdef":"Fermeté venant de l'intérieur de la peau."},{"id":"BT1878","k":"h","cat":"skin","w":"진정","rom":"jinjeong","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"진정","memofr":"Composé : 진 (calmer) + 정 (tranquille)","note":"Mot très fréquent ; il a donné 진정 케어, 진정 크림, etc.","mean":"자극받아 붉거나 달아오른 피부를 가라앉히는 것.","ex":"트러블이 올라온 날은 진정 위주로 관리한다.","exfr":"Les jours où les boutons apparaissent, je privilégie les soins d'apaisement.","fr":"apaisement","frpos":"n.m.","frdef":"Fait de calmer une peau irritée ou rouge."},{"id":"BT1880","k":"s","cat":"skin","w":"장벽","rom":"jangbyeok","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"장벽; 피부장벽의 줄임","memofr":"Composé : 장 (barrière) + 벽 (mur)","note":"Abréviation courante de 피부장벽.","mean":"「피부장벽」을 줄여 이르는 말.","ex":"장벽이 무너져서 뭘 발라도 따갑다.","exfr":"Ma barrière cutanée est abîmée, tout ce que j'applique pique.","fr":"barrière (cutanée)","frpos":"n.f.","frdef":"Abréviation de « barrière cutanée ».","par":"피부장벽","rel":"준말"},{"id":"BT1881","k":"h","cat":"tool","w":"다운타임","rom":"dauntaim","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"downtime","memofr":"Emprunt à l'anglais downtime","note":"Jargon des cliniques esthétiques.","mean":"시술 뒤 붉은기·붓기·딱지가 가라앉을 때까지의 회복 기간.","ex":"이 레이저는 다운타임이 일주일쯤 된다.","exfr":"Ce laser a un temps de récupération d'environ une semaine.","fr":"temps de récupération (éviction sociale)","frpos":"n.m.","frdef":"Période de récupération après un acte esthétique."},{"id":"BT1882","k":"h","cat":"tool","w":"스킨 보톡스","rom":"seukin botokseu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"skin+botox","memofr":"Locution : 스킨 (angl. skin) + 보톡스 (de la marque Botox)","note":"Acte médical esthétique.","mean":"보툴리눔 톡신을 피부 얕은 층에 넓게 주사해 모공·잔주름을 관리하는 시술.","ex":"스킨 보톡스를 맞고 모공이 작아 보인다.","exfr":"Après un « skin botox », mes pores paraissent plus petits.","fr":"« skin botox » (micro-injections de toxine botulique)","frpos":"n.m.","frdef":"Injections superficielles de toxine botulique pour affiner pores et ridules."},{"id":"BT1883","k":"h","cat":"tool","w":"MTS","rom":"MTS","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두문자어)","memo":"Microneedle Therapy System","memofr":"Sigle de l'anglais Microneedle Therapy System","note":"Acte de clinique ou kit maison.","mean":"미세한 바늘로 피부에 작은 구멍을 내 유효 성분 흡수와 재생을 돕는 시술·도구.","ex":"집에서 MTS를 할 때는 소독을 꼭 해야 한다.","exfr":"Quand on fait du microneedling à la maison, il faut absolument désinfecter.","fr":"microneedling (MTS)","frpos":"n.m.","frdef":"Technique de micro-perforation de la peau."},{"id":"BT1884","k":"h","cat":"tool","w":"필링","rom":"pilling","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"peeling","memofr":"Emprunt à l'anglais peeling","note":"Mot identique en français.","mean":"산이나 효소로 묵은 각질을 녹여 벗겨 내는 관리.","ex":"환절기에는 필링을 줄인다.","exfr":"À l'entre-saison, je réduis les peelings.","fr":"peeling (exfoliation chimique)","frpos":"n.m.","frdef":"Exfoliation par acides ou enzymes."},{"id":"BT1885","k":"h","cat":"gen","w":"홈 케어","rom":"hom keeo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"home+care","memofr":"Locution : 홈 (angl. home) + 케어 (angl. care)","note":"Voir 홈케어 디바이스.","mean":"피부과나 관리실에 가지 않고 집에서 하는 피부 관리.","ex":"시술 대신 홈 케어로 관리한다.","exfr":"Plutôt que des actes esthétiques, je fais des soins à domicile.","fr":"soins à domicile","frpos":"n.m.pl.","frdef":"Soins de la peau faits "혼종어","form":"합성어","memo":"안개+분사","memofr":"Composé : 안개 (brouillard) + 분사 (pulvérisation)","note":"Argument des brumes.","mean":"미스트가 물방울 없이 안개처럼 곱게 뿌려지는 것.","ex":"안개분사라 화장 위에 뿌려도 얼룩지지 않는다.","exfr":"Grâce à la vaporisation ultra-fine, on peut l'appliquer sur le maquillage sans faire de traces.","fr":"vaporisation ultra-fine","frpos":"n.f.","frdef":"Brumisation très fine, sans gouttes."},{"id":"BT1899","k":"h","cat":"tool","w":"갈바닉","rom":"galbanik","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"galvanic","memofr":"Emprunt à l'anglais galvanic","note":"Appareil de beauté à domicile.","mean":"약한 전류로 화장품 흡수를 돕는다고 하는 미용 기기.","ex":"갈바닉으로 앰플을 흡수시킨다.","exfr":"Je fais pénétrer l'ampoule avec un appareil à courant galvanique.","fr":"appareil à courant galvanique","frpos":"n.m.","frdef":"Appareil utilisant un courant faible pour faire pénétrer les soins."},{"id":"BT1901","k":"h","cat":"tool","w":"고주파","rom":"gojupa","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"고주파","memofr":"Composé : 고 (haut) + 주파 (fréquence)","note":"Technologie des cliniques et des appareils à domicile.","mean":"고주파 열로 탄력을 관리하는 시술·기기를 이르는 말.","ex":"집에서 쓰는 고주파 기기를 샀다.","exfr":"J'ai acheté un appareil de radiofréquence à utiliser chez moi.","fr":"radiofréquence","frpos":"n.f.","frdef":"Technologie chauffant le derme pour raffermir."},{"id":"BT1904","k":"h","cat":"gen","w":"사용감","rom":"sayonggam","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"사용+-감","memofr":"Dérivé : 사용 (utilisation) + -감 (suffixe « sensation »)","note":"Critère central des avis coréens.","mean":"제품을 바를 때와 바른 뒤에 느껴지는 감촉.","ex":"사용감이 가벼워서 여름에 쓰기 좋다.","exfr":"Sa sensation à l'application est légère, idéale en été.","fr":"sensation à l'application","frpos":"n.f.","frdef":"Sensation ressentie à l'application et après."},{"id":"BT1905","k":"h","cat":"gen","w":"흡수력","rom":"heupsuryeok","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"흡수+-력","memofr":"Dérivé : 흡수 (absorption) + -력 (suffixe « capacité »)","note":"Critère d'avis.","mean":"제품이 피부에 스며드는 정도와 속도.","ex":"흡수력이 좋아서 바로 다음 단계를 바를 수 있다.","exfr":"Sa capacité d'absorption est si bonne qu'on peut appliquer l'étape suivante tout de suite.","fr":"capacité d'absorption (pénétration)","frpos":"n.f.","frdef":"Rapidité avec laquelle le produit pénètre."},{"id":"BT1907","k":"h","cat":"gen","w":"지속력","rom":"jisongnyeok","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"지속+-력","memofr":"Dérivé : 지속 (durée) + -력 (suffixe « capacité »)","note":"Critère d'avis pour le maquillage et les parfums.","mean":"효과나 화장이 오래 유지되는 정도.","ex":"보습 지속력이 좋아 오후까지 당기지 않는다.","exfr":"La tenue de l'hydratation est bonne, la peau ne tiraille pas jusqu'à l'après-midi.","fr":"tenue (durée)","frpos":"n.f.","frdef":"Durée pendant laquelle l'effet se maintient."},{"id":"BT1914","k":"h","cat":"gen","w":"셔벗 제형","rom":"syeobeot jehyeong","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"셔벗+제형","memofr":"Locution : 셔벗 (angl. sherbet) + 제형 (texture)","note":"Voir 셔벗 밤.","mean":"셔벗처럼 사각거리다가 체온에 녹는 내용물.","ex":"셔벗 제형 클렌징 밤이 피부에서 사르르 녹는다.","exfr":"Le baume démaquillant à texture sorbet fond doucement sur la peau.","fr":"texture sorbet","frpos":"n.f.","frdef":"Formule granitée qui fond sur la peau."},{"id":"BT1918","k":"h","cat":"gen","w":"주의 성분","rom":"juui seongbun","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"주의+성분","memofr":"Locution : 주의 (attention) + 성분 (ingrédient)","note":"Notion popularisée par les applications d'analyse d'ingrédients.","mean":"성분 분석 앱 등에서 피부 자극 가능성이 있다고 표시하는 성분. 흔히 「20가지 주의 성분」이라 함.","ex":"주의 성분이 하나도 없는 크림이다.","exfr":"Une crème qui ne contient aucun ingrédient à surveiller.","fr":"ingrédients à surveiller","frpos":"n.m.pl.","frdef":"Ingrédients signalés comme potentiellement irritants par les applications coréennes."},{"id":"BT1921","k":"h","cat":"gen","w":"무향","rom":"muhyang","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"무-+향","memofr":"Dérivé : 무- (préfixe « sans ») + 향 (parfum)","note":"Mention d'emballage.","mean":"향료를 넣지 않았거나 향이 나지 않는다는 표시.","ex":"향에 예민해서 무향 핸드크림을 쓴다.","exfr":"Je suis sensible aux odeurs, j'utilise une crème pour les mains sans parfum.","fr":"sans parfum","frpos":"loc.adj.","frdef":"Sans parfum ajouté."},{"id":"BT1923","k":"h","cat":"gen","w":"저자극","rom":"jeojageuk","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"저-+자극","memofr":"Dérivé : 저- (préfixe « bas ») + 자극 (irritation)","note":"Mention d'emballage fréquente.","mean":"피부 자극을 줄이도록 만들었다는 표시.","ex":"아이와 함께 쓰는 저자극 로션이다.","exfr":"Un lait hypoallergénique que j'utilise avec mon enfant.","fr":"hypoallergénique (peu irritant)","frpos":"adj.","frdef":"Formulé pour limiter l'irritation."},{"id":"BT1924","k":"h","cat":"gen","w":"꿀템","rom":"kkultem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"꿀+템(아이템)","memofr":"Composé : 꿀 (« super », sens figuré) + 템 (de l'angl. item)","note":"Voir 꿀조합.","mean":"값이나 기대에 비해 아주 만족스러운 제품.","ex":"올리브영에서 찾은 꿀템을 친구에게 알려 줬다.","exfr":"J'ai fait découvrir à une amie la pépite que j'ai trouvée chez Olive Young.","fr":"pépite (super produit)","frpos":"n.f.","frdef":"Produit qui dépasse les attentes."},{"id":"BT1926","k":"h","cat":"gen","w":"쟁여템","rom":"jaengyeotem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"쟁이-+-어+템(아이템)","memofr":"Composé : 쟁이- (entasser) + -어 (terminaison) + 템 (de l'angl. item)","note":"Argot des avis.","mean":"떨어지지 않게 여러 개 사 두는 제품.","ex":"세일 때마다 사 두는 쟁여템이다.","exfr":"C'est un produit à stocker, que j'achète à chaque promotion.","fr":"produit à stocker","frpos":"n.m.","frdef":"Produit que l'on achète en plusieurs exemplaires d'avance."},{"id":"BT1927","k":"h","cat":"gen","w":"입문템","rom":"immuntem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"입문+템(아이템)","memofr":"Composé : 입문 (initiation) + 템 (de l'angl. item)","note":"Souvent pour les actifs forts (rétinol, acides).","mean":"어떤 성분이나 제품군을 처음 써 볼 때 고르는 순한 제품.","ex":"레티놀 입문템으로 저함량 세럼을 골랐다.","exfr":"Comme produit pour débuter le rétinol, j'ai choisi un sérum peu dosé.","fr":"produit pour débuter","frpos":"n.m.","frdef":"Produit doux choisi pour s'initier à un actif."},{"id":"BT1928","k":"h","cat":"gen","w":"대란템","rom":"daerantem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"대란+템(아이템)","memofr":"Composé : 대란 (grand chaos) + 템 (de l'angl. item)","note":"Voir 품절대란.","mean":"한꺼번에 사람이 몰려 구하기 어려울 만큼 인기 있는 제품.","ex":"품절이 반복된 대란템을 드디어 샀다.","exfr":"J'ai enfin acheté ce produit phénomène, sans cesse en rupture.","fr":"produit phénomène","frpos":"n.m.","frdef":"Produit si demandé qu'il est sans cesse en rupture."},{"id":"BT1929","k":"h","cat":"gen","w":"품절대란","rom":"pumjeoldaeran","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"품절+대란","memofr":"Composé : 품절 (rupture de stock) + 대란 (grand chaos)","note":"Hyperbole médiatique.","mean":"인기 제품이 연이어 동나는 일.","ex":"출시하자마자 품절대란이 일었다.","exfr":"Dès sa sortie, la ruée a provoqué une rupture de stock.","fr":"ruée provoquant la rupture de stock","frpos":"n.f.","frdef":"Ruptures de stock en chaîne dues à l'engouement."},{"id":"BT1930","k":"h","cat":"gen","w":"국민템","rom":"gungmintem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"국민+템(아이템)","memofr":"Composé : 국민 (nation) + 템 (de l'angl. item)","note":"Le préfixe 국민- (« national ») est très productif.","mean":"누구나 한 번쯤 써 봤을 만큼 널리 쓰는 제품.","ex":"이 수분 크림은 국민템이라 불린다.","exfr":"Cette crème hydratante est surnommée le produit culte national.","fr":"produit culte national","frpos":"n.m.","frdef":"Produit que tout le monde a essayé."},{"id":"BT1931","k":"h","cat":"gen","w":"체험단","rom":"cheheomdan","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"체험+-단","memofr":"Dérivé : 체험 (expérience) + -단 (suffixe « groupe »)","note":"Les avis de 체험단 sont souvent jugés moins fiables (voir 내돈내산).","mean":"제품을 무료로 받아 써 보고 후기를 쓰는 사람들의 모임.","ex":"체험단으로 받은 제품이라고 후기에 밝혔다.","exfr":"Dans son avis, elle a précisé avoir reçu le produit dans le cadre d'un panel de testeurs.","fr":"panel de testeurs (avis sponsorisés)","frpos":"n.m.","frdef":"Groupe recevant des produits gratuits en échange d'un avis."},{"id":"BT1933","k":"h","cat":"gen","w":"발색샷","rom":"balsaeksyat","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"발색+샷(shot)","memofr":"Composé : 발색 (rendu couleur) + 샷 (angl. shot)","note":"Format d'image incontournable des avis.","mean":"색조 제품을 손등이나 입술에 발라 색을 보여 주는 사진.","ex":"후기에 발색샷을 같이 올렸다.","exfr":"Elle a publié une photo de swatch avec son avis.","fr":"photo de swatch","frpos":"n.f.","frdef":"Photo montrant le rendu de la couleur."},{"id":"BT1934","k":"h","cat":"gen","w":"제형샷","rom":"jehyeongsyat","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"제형+샷(shot)","memofr":"Composé : 제형 (texture) + 샷 (angl. shot)","note":"Format d'image incontournable des avis.","mean":"내용물을 덜어 질감을 보여 주는 사진.","ex":"제형샷을 보니 생각보다 묽다.","exfr":"D'après la photo de texture, il est plus fluide que prévu.","fr":"photo de texture","frpos":"n.f.","frdef":"Photo montrant la texture du produit."},{"id":"BT1935","k":"h","cat":"gen","w":"복숭아 피부","rom":"boksunga pibu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"복숭아+피부","memofr":"Locution : 복숭아 (pêche) + 피부 (peau)","note":"Image commune au français.","mean":"복숭아처럼 뽀얗고 보송하며 은은하게 혈색이 도는 피부.","ex":"블러셔를 볼에 얇게 펴 발라 복숭아 피부를 연출했다.","exfr":"En étalant finement le blush sur les joues, j'ai créé un effet peau de pêche.","fr":"peau de pêche","frpos":"n.f.","frdef":"Peau douce, veloutée et légèrement rosée comme une pêche.","par":"꿀피부","rel":"관련어(참고)"},{"id":"BT1937","k":"h","cat":"gen","w":"물오른 피부","rom":"muroreun pibu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"물+오르-+-ㄴ+피부; 「물이 오르다」에서 옴","memofr":"Locution : 물오른 (gorgé de sève) + 피부 (peau)","note":"Vient de l'expression 물이 오르다 (« être en pleine forme »).","mean":"물이 오른 나무처럼 생기와 윤기가 가득한 피부.","ex":"요즘 관리를 받아서 물오른 피부라는 말을 듣는다.","exfr":"Depuis que je fais des soins, on me dit que ma peau est en pleine forme.","fr":"peau en pleine forme (« gorgée de sève »)","frpos":"n.f.","frdef":"Peau éclatante et pleine de vitalité, comme un arbre gorgé de sève au printemps."},{"id":"BT1938","k":"h","cat":"skin","w":"귤껍질 피부","rom":"gyulkkeopjil pibu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"귤+껍질+피부","memofr":"Locution : 귤 (mandarine) + 껍질 (peau, écorce) + 피부 (peau)","note":"En français, « peau d'orange » désigne surtout la cellulite.","mean":"모공이 넓고 오돌토돌해 귤껍질처럼 보이는 피부.","ex":"귤껍질 피부라 모공 프라이머를 꼭 바른다.","exfr":"J'ai une peau d'orange, alors je mets toujours un primer pour les pores.","fr":"peau d'orange","frpos":"n.f.","frdef":"Peau aux pores dilatés et irréguliers ; le français compare à l'orange, le coréen à la mandarine."},{"id":"BT1939","k":"h","cat":"skin","w":"딸기코","rom":"ttalgiko","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"딸기+코","memofr":"Composé : 딸기 (fraise) + 코 (nez)","note":"Image partagée avec d'autres langues.","mean":"코에 블랙헤드와 넓은 모공이 촘촘해 딸기 씨처럼 보이는 상태. 붉은 코를 가리키기도 함.","ex":"딸기코가 고민이라 코팩을 자주 한다.","exfr":"Mon nez « fraise » me complexe, alors je fais souvent des patchs pour le nez.","fr":"nez « fraise » (points noirs sur le nez)","frpos":"n.m.","frdef":"Nez couvert de points noirs et de pores visibles, comme les graines d'une fraise.","par":"블랙헤드","rel":"관련어(참고)"},{"id":"BT1940","k":"h","cat":"skin","w":"기름 공장","rom":"gireum gongjang","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"기름+공장","memofr":"Locution : 기름 (graisse) + 공장 (usine)","note":"Hyperbole humoristique ; voir 산유국.","mean":"피지가 공장처럼 끝없이 나오는 지성 피부를 이르는 말.","ex":"오후만 되면 내 얼굴은 기름 공장이 된다.","exfr":"Dès l'après-midi, mon visage devient une « usine à sébum ».","fr":"« usine à sébum »","frpos":"n.f.","frdef":"Métaphore pour une peau très grasse qui produit du sébum sans arrêt."},{"id":"BT1941","k":"h","cat":"gen","w":"피부 깡패","rom":"pibu kkangpae","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"피부+깡패(gang+패)","memofr":"Locution : 피부 (peau) + 깡패 (voyou)","note":"Argot : -깡패 marque une supériorité écrasante (얼굴 깡패).","mean":"누구도 못 따라올 만큼 피부가 아주 좋은 사람.","ex":"그 배우는 민낯도 피부 깡패다.","exfr":"Cette actrice est une personne à la peau parfaite, même sans maquillage.","fr":"personne à la peau parfaite (« voyou de la peau »)","frpos":"n.f.","frdef":"Argot : personne dont la peau est si belle qu'elle « écrase » les autres."},{"id":"BT1946","k":"h","cat":"skin","w":"모공 실종","rom":"mogong siljong","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"모공+실종","memofr":"Locution : 모공 (pores) + 실종 (disparition)","note":"Hyperbole publicitaire.","mean":"모공이 사라진 듯 보이지 않는 상태를 과장한 말.","ex":"프라이머를 바르니 모공 실종이다.","exfr":"Avec ce primer, mes pores ont « disparu ».","fr":"pores « disparus »","frpos":"n.m.pl.","frdef":"Exagération : les pores semblent avoir disparu."},{"id":"BT1947","k":"h","cat":"base","w":"모공 지우개","rom":"mogong jiugae","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"모공+지우개","memofr":"Locution : 모공 (pores) + 지우개 (gomme)","note":"Surnom de produit.","mean":"모공을 지운 듯 가려 준다는 프라이머·파우더의 별명.","ex":"이 프라이머는 모공 지우개라고 불린다.","exfr":"Ce primer est surnommé la « gomme à pores ».","fr":"« gomme à pores »","frpos":"n.f.","frdef":"Surnom des primers qui floutent les pores."},{"id":"BT1948","k":"h","cat":"skin","w":"화장독","rom":"hwajangdok","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"화장+독","memofr":"Composé : 화장 (maquillage) + 독 (poison)","note":"Expression populaire, non médicale.","mean":"화장품이나 짙은 화장 때문에 피부가 상하거나 트러블이 생긴 상태.","ex":"화장독이 올라서 한동안 화장을 쉬었다.","exfr":"Ma peau a été intoxiquée par le « poison du maquillage », alors j'ai arrêté de me maquiller pendant un temps.","fr":"« poison du maquillage » (peau intoxiquée par le maquillage)","frpos":"n.m.","frdef":"Littéralement « poison (독) du maquillage » : peau abîmée, comme empoisonnée par l'excès de maquillage (boutons, irritations)."},{"id":"BT1949","k":"h","cat":"gen","w":"화장발","rom":"hwajangbal","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"화장+-발; =화장빨","memofr":"Dérivé : 화장 (maquillage) + -발 (suffixe « effet, avantage »)","note":"Familier ; prononcé 화장빨 avec emphase.","mean":"화장 덕분에 실제보다 예뻐 보이는 효과. 「화장빨」이라고도 함.","ex":"오늘 사진은 순전히 화장발이다.","exfr":"Sur la photo d'aujourd'hui, c'est uniquement l'effet du maquillage.","fr":"effet du maquillage (embellissement)","frpos":"n.m.","frdef":"Embellissement dû au maquillage plutôt qu'au visage réel."},{"id":"BT1950","k":"h","cat":"gen","w":"풀메","rom":"pulme","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(절단어)","memo":"풀(full)+메(이크업)","memofr":"Troncation : 풀 (angl. full) + 메(이크업) (angl. make-up)","note":"Argot courant.","mean":"「풀메이크업」의 줄임말. 베이스부터 색조까지 다 갖춘 화장.","ex":"결혼식이라 오랜만에 풀메를 했다.","exfr":"Pour le mariage, je me suis fait un maquillage complet, pour la première fois depuis longtemps.","fr":"maquillage complet","frpos":"n.m.","frdef":"Abréviation de « full make-up ».","par":"생얼 메이크업","rel":"관련어(참고)"},{"id":"BT1951","k":"h","cat":"gen","w":"화떡","rom":"hwatteok","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"화(장)+떡(칠)","memofr":"Abréviation syllabique : 화(장) (maquillage) + 떡(칠) (couche épaisse)","note":"Familier, péjoratif.","mean":"「화장 떡칠」의 줄임말. 화장을 지나치게 두껍게 한 상태.","ex":"파운데이션을 너무 많이 발라서 화떡이 됐다.","exfr":"J'ai mis trop de fond de teint, le maquillage est plâtré.","fr":"maquillage plâtré","frpos":"n.m.","frdef":"Abréviation : maquillage beaucoup trop épais."},{"id":"BT1952","k":"h","cat":"gen","w":"떡칠","rom":"tteokchil","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"떡+칠","memofr":"Composé : 떡 (gâteau de riz) + 칠 (enduit, laque)","note":"Familier, péjoratif.","mean":"화장품을 떡처럼 두껍게 바르는 것.","ex":"컨실러 떡칠을 하면 오후에 다 갈라진다.","exfr":"Avec une couche trop épaisse de correcteur, tout craquelle l'après-midi.","fr":"couche trop épaisse (fam.)","frpos":"n.f.","frdef":"Application beaucoup trop épaisse d'un produit.","par":"화떡","rel":"관련어(참고)"},{"id":"BT1954","k":"h","cat":"gen","w":"노메이크업 메이크업","rom":"nomeikeueop meikeueop","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"no makeup+makeup","memofr":"Locution : 노메이크업 (angl. no make-up) + 메이크업 (angl. make-up)","note":"Tendance internationale.","mean":"화장을 안 한 것처럼 보이게 하는 자연스러운 화장.","ex":"면접에는 노메이크업 메이크업으로 갔다.","exfr":"Pour l'entretien d'embauche, j'ai opté pour un maquillage « no make-up ».","fr":"maquillage « no make-up »","frpos":"n.m.","frdef":"Maquillage qui donne l'illusion d'un visage non maquillé."},{"id":"BT1960","k":"h","cat":"gen","w":"숙취 메이크업","rom":"sukchwi meikeueop","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"숙취+메이크업","memofr":"Locution : 숙취 (gueule de bois) + 메이크업 (angl. make-up)","note":"Tendance née au Japon et reprise en Corée.","mean":"술 마신 다음 날처럼 눈가와 볼을 발그레하게 물들이는 화장.","ex":"숙취 메이크업은 눈 밑에 블러셔를 넣는 게 핵심이다.","exfr":"Le secret du maquillage « lendemain de soirée » : mettre du blush sous les yeux.","fr":"maquillage « lendemain de soirée »","frpos":"n.m.","frdef":"Maquillage rosissant le dessous des yeux et les joues comme après une soirée arrosée."},{"id":"BT1961","k":"h","cat":"gen","w":"홍조 메이크업","rom":"hongjo meikeueop","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"홍조+메이크업","memofr":"Locution : 홍조 (rougeur) + 메이크업 (angl. make-up)","note":"Tendance de maquillage.","mean":"볼에 일부러 홍조를 넓게 표현해 생기 있어 보이게 하는 화장.","ex":"홍조 메이크업은 블러셔를 코 위까지 이어 바른다.","exfr":"Pour le maquillage « joues rougies », on prolonge le blush jusque sur l'arête du nez.","fr":"maquillage « joues rougies »","frpos":"n.m.","frdef":"Maquillage imitant des rougeurs naturelles sur les joues et le nez."},{"id":"BT1962","k":"h","cat":"gen","w":"도화살 메이크업","rom":"dohwasal meikeueop","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"도화살+메이크업","memofr":"Locution : 도화살 (notion astrologique de « charme fatal ») + 메이크업 (angl. make-up)","note":"Référence au saju, l'astrologie traditionnelle coréenne.","mean":"눈가에 은은한 분홍빛을 넣어 매혹적인 인상을 주는 화장. 사주의 「도화살」에서 옴.","ex":"도화살 메이크업은 눈꼬리에 핑크 섀도를 쓴다.","exfr":"Pour le maquillage « charme fatal », on utilise un fard rose au coin externe de l'œil.","fr":"maquillage « charme fatal »","frpos":"n.m.","frdef":"Maquillage rosé autour des yeux, nommé d'après un concept d'astrologie coréenne lié à la séduction."},{"id":"BT1965","k":"h","cat":"gen","w":"수능 메이크업","rom":"suneung meikeueop","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"수능+메이크업","memofr":"Locution : 수능 (examen national d'entrée à l'université) + 메이크업 (angl. make-up)","note":"Phénomène social : les marques multiplient les offres après l'examen, en novembre.","mean":"대학수학능력시험이 끝난 수험생이 처음 배우는 화장. 수능 뒤 화장 수업·할인 행사가 많음.","ex":"수능 끝나고 친구들과 수능 메이크업을 받으러 갔다.","exfr":"Une fois l'examen terminé, je suis allée avec mes amies me faire faire mon premier maquillage après le bac coréen.","fr":"premier maquillage après le bac coréen","frpos":"n.m.","frdef":"Maquillage que les lycéens apprennent juste après le suneung (examen d'entrée à l'université)."},{"id":"BT1966","k":"h","cat":"eye","w":"일자 눈썹","rom":"ilja nunsseop","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"일자+눈썹","memofr":"Locution : 일자 (en forme du caractère « un », droit) + 눈썹 (sourcils)","note":"Tendance emblématique du maquillage coréen des années 2010.","mean":"눈썹산 없이 수평으로 곧게 그린 눈썹. 어려 보이는 한국식 눈썹.","ex":"일자 눈썹으로 그리면 인상이 순해 보인다.","exfr":"Des sourcils droits donnent un air doux.","fr":"sourcils droits","frpos":"n.m.pl.","frdef":"Sourcils dessinés à l'horizontale, sans arche, typiques du look coréen."},{"id":"BT1971","k":"h","cat":"base","w":"생얼 크림","rom":"saengeol keurim","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"생얼+크림; =톤업크림","memofr":"Locution : 생얼 (visage nu) + 크림 (angl. cream)","note":"Surnom ; synonyme de 톤업 크림.","mean":"화장하지 않은 듯 피부를 밝혀 준다는 톤업크림의 별명. 「민낯 크림」이라고도 함.","ex":"생얼 크림을 바르니 화장을 안 한 듯 피부가 환해 보였다.","exfr":"Avec la crème « visage nu », ma peau paraissait lumineuse, comme si je n'étais pas maquillée.","fr":"crème « visage nu »","frpos":"n.f.","frdef":"Surnom de la crème tone-up qui donne l'air d'un visage naturellement clair."},{"id":"BT1975","k":"h","cat":"gen","w":"효자템","rom":"hyojatem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"효자+템(아이템)","memofr":"Composé : 효자 (fils dévoué) + 템 (de l'angl. item)","note":"Métaphore familiale propre au coréen.","mean":"브랜드 매출을 가장 많이 올리는 효자 같은 제품.","ex":"이 쿠션은 브랜드의 효자템이다.","exfr":"Ce cushion est le produit phare de la marque.","fr":"produit phare (best-seller de la marque)","frpos":"n.m.","frdef":"Produit qui rapporte le plus à une marque, « fils dévoué »."},{"id":"BT1976","k":"h","cat":"gen","w":"품절템","rom":"pumjeoltem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"품절+템(아이템)","memofr":"Composé : 품절 (rupture de stock) + 템 (de l'angl. item)","note":"Argot du commerce.","mean":"인기가 많아 자주 품절되는 제품.","ex":"재입고 알림을 걸어 둔 품절템이다.","exfr":"C'est un produit toujours en rupture, pour lequel j'ai activé l'alerte de réassort.","fr":"produit toujours en rupture","frpos":"n.m.","frdef":"Produit si demandé qu'il est souvent épuisé.","par":"품절대란","rel":"관련어(참고)"},{"id":"BT1977","k":"h","cat":"gen","w":"역주행템","rom":"yeokjuhaengtem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"역주행+템(아이템)","memofr":"Composé : 역주행 (circulation à contresens) + 템 (de l'angl. item)","note":"Terme venu des classements musicaux.","mean":"출시 때는 주목받지 못하다가 나중에 입소문으로 인기가 오른 제품.","ex":"이 세럼은 후기로 뜬 역주행템이다.","exfr":"Ce sérum est un produit au succès tardif, devenu célèbre grâce aux avis.","fr":"produit au succès tardif","frpos":"n.m.","frdef":"Produit devenu populaire bien après sa sortie, grâce au bouche-à-oreille."},{"id":"BT1978","k":"h","cat":"gen","w":"단종템","rom":"danjongtem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"단종+템(아이템)","memofr":"Composé : 단종 (arrêt de production) + 템 (de l'angl. item)","note":"Argot du commerce.","mean":"생산이 중단되어 더는 살 수 없는 제품.","ex":"아끼던 립이 단종템이 되어 쟁여 두었다.","exfr":"Mon rouge à lèvres préféré est devenu un produit arrêté, alors j'en ai fait des réserves.","fr":"produit arrêté","frpos":"n.m.","frdef":"Produit qui n'est plus fabriqué."},{"id":"BT1980","k":"h","cat":"gen","w":"꾸밈비","rom":"kkumimbi","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"꾸밈+비","memofr":"Composé : 꾸밈 (apprêt) + 비 (frais)","note":"Mot courant chez les jeunes.","mean":"옷·화장·미용 등 외모를 꾸미는 데 드는 돈.","ex":"이번 달 꾸밈비가 생활비보다 많다.","
