*{box-sizing:border-box}

.brand .lang{margin-left:auto;display:flex;gap:4px}

.lang button[aria-pressed="true"]{background:var(--lime);color:#151515;border-color:var(--lime);font-weight:600}
nav.tabs{display:flex;flex-wrap:wrap;gap:2px 18px;padding:6px 0 0}

[hidden]{display:none!important}
@media (max-width:820px){
  .brand h1{gap:10px;padding-left:8px}

  #list{max-height:none}
  dl.more{grid-template-columns:1fr;gap:2px 0}
  dl.more dd{margin-bottom:10px}

<script id="data" type="application/json">{"meta":{"total":1428,"excluded":379,"head":1000,"sub":27,"aff":11,"date":"2026-11-23"},"e":[{"id":"BT0002","k":"h","cat":"gen","w":"개기름","rom":"gaegireum","pos":"명사","unit":"단어","eo":"고유어","form":"파생어","memo":"개-(접두사: 질이 낮은·지나친)+기름(고유어)","memofr":"Dérivé : 개- (préfixe péjoratif « de piètre qualité, excessif ») + 기름 (graisse, huile)","note":"Mot familier, plutôt péjoratif ; on le lit surtout dans les avis de consommateurs, pas dans les fiches produit.","mean":"번들거리는 기름을 부정적이고 거칠게 부르는 소비자 표현.","ex":"오후만 되면 이마에 개기름이 올라와서 기름종이가 필수다.","exfr":"Dès l'après-midi, j'ai un sébum excessif qui remonte sur le front : impossible de sortir sans papier matifiant.","fr":"sébum excessif (fam.)","frpos":"n.m.","frdef":"Mot familier et péjoratif pour l'excès de sébum qui fait briller la peau."},{"id":"BT0006","k":"h","cat":"gen","w":"끼이다","rom":"kkiida","pos":"동사","unit":"단어","eo":"고유어","form":"파생어","memo":"끼다+-이-(피동 접미사)","memofr":"Dérivé : 끼다 (se coincer) + -이- (suffixe passif)","note":"S'emploie surtout pour les crèmes solaires et fonds de teint qui marquent les rides fines.","mean":"차단제 제형이 주름이나 모공 요철 사이에 패여 하얗게 뭉쳐 박히다.","ex":"선크림을 두껍게 발랐더니 눈가 주름 사이에 하얗게 끼였다.","exfr":"J'ai mis une couche épaisse de crème solaire et elle est venue se loger dans les ridules du contour des yeux, en blanc.","fr":"se loger dans (les ridules, les pores)","frpos":"loc.v.","frdef":"Se dit d'un produit qui s'accumule dans les ridules ou les pores et les souligne."},{"id":"BT0007","k":"h","cat":"gen","w":"나비존","rom":"nabijon","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"나비(고유어)+존(zone, 외래어)","memofr":"Composé : 나비 (papillon) + 존 (angl. zone)","note":"Calque d'image propre au coréen ; à rapprocher de la « zone T » et de la « zone U ».","mean":"코 양옆의 볼 주변을 나비가 날개를 편 모양에 빗대어 부르는 얼굴 부위 표현.","ex":"세수할 때 나비존에 오돌토돌한 것이 느껴진다.","exfr":"En me lavant le visage, je sens de petites aspérités sur la zone papillon.","fr":"zone papillon","frpos":"n.f.","frdef":"Zone des joues de part et d'autre du nez, dont la forme évoque des ailes de papillon."},{"id":"BT0008","k":"h","cat":"gen","w":"노세범","rom":"nosebeom","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"no+sebum(영어 차용 결합)","memofr":"Composé : 노 (angl. no) + 세범 (angl. sebum)","note":"Faux anglicisme coréen : la formule « no sebum » est inconnue des anglophones ; nom de gamme fréquent pour les poudres matifiantes.","mean":"피지(Sebum) 분비를 제어하거나 흡수하여 피지를 없애는 성질","ex":"노세범 파우더를 T존에 덧바르니 오후까지 번들거리지 않았다.","exfr":"Après une touche de poudre matifiante sur la zone T, je n'ai pas brillé jusqu'en fin d'après-midi.","fr":"matifiant (« no sebum »)","frpos":"adj.","frdef":"Mention marketing d'un produit qui absorbe ou limite le sébum pour un fini mat."},{"id":"BT0011","k":"h","cat":"gen","w":"다크닝","rom":"dakeuning","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"영어 darkening 차용","memofr":"Emprunt à l'anglais darkening","note":"Défaut souvent cité dans les avis sur les fonds de teint et les cushions ; en français on dit plutôt que le teint « s'oxyde ».","mean":"베이스 제품이 시간이 지나며 피지와 섞여 처음보다 어둡게 변하는 현상.","ex":"시간이 지나도 다크닝 없이 처음 색이 유지되는 쿠션이다.","exfr":"C'est un cushion sans oxydation : il garde sa teinte d'origine au fil des heures.","fr":"oxydation (du fond de teint)","frpos":"n.f.","frdef":"Assombrissement d'un fond de teint ou d'un solaire teinté quelques heures après l'application."},{"id":"BT0016","k":"h","cat":"gen","w":"뜨다","rom":"tteuda","pos":"동사","unit":"단어","eo":"고유어","form":"단일어","memo":"다의어 '뜨다'의 뷰티 특수 의미","memofr":"Mot simple : 뜨다 (se soulever, flotter), sens spécialisé en beauté","note":"Verbe polysémique : en dehors de la beauté, il signifie aussi « flotter », « se lever (soleil) » ou « partir ».","mean":"제형이 피부 표면에 붙지 못하고 각질이나 모공 틈새로 하얗게 일어나는 상태","ex":"건조한 날에도 각질 사이로 선크림이 뜨지 않았다.","exfr":"Même par temps sec, la crème solaire ne s'est pas soulevée sur les peaux mortes.","fr":"se soulever (ne pas adhérer)","frpos":"v.","frdef":"Se dit du maquillage ou d'un soin qui se décolle de la peau et laisse voir les peaux mortes."},{"id":"BT0017","k":"h","cat":"gen","w":"레이어링하다","rom":"reieoringhada","pos":"동사","unit":"단어","eo":"혼종어","form":"파생어","memo":"레이어링(layering)+-하다(동사 파생 접미사)","memofr":"Dérivé : 레이어링 (angl. layering) + -하다 (suffixe verbal)","note":"Technique typique de la routine coréenne en plusieurs couches fines (toner, essence, sérum…).","mean":"얇게 여러 번 겹쳐 바르는 사용법.","ex":"토너를 여러 번 레이어링해서 속건조를 채운다.","exfr":"Je superpose plusieurs couches de lotion tonique pour combler la déshydratation profonde.","fr":"superposer (les soins)","frpos":"v.","frdef":"Appliquer plusieurs couches fines de produits les unes sur les autres."},{"id":"BT0018","k":"h","cat":"gen","w":"롤링하다","rom":"rollinghada","pos":"동사","unit":"단어","eo":"혼종어","form":"파생어","memo":"롤링(rolling)+-하다","memofr":"Dérivé : 롤링 (angl. rolling) + -하다 (suffixe verbal)","note":"Geste conseillé surtout pour les huiles et baumes démaquillants.","mean":"손가락을 둥글게 움직이며 제품을 펴 바르는 동작.","ex":"얼굴 안쪽에서 바깥쪽으로 롤링하며 흡수시킨다.","exfr":"Faites pénétrer en massant en mouvements circulaires, de l'intérieur vers l'extérieur du visage.","fr":"masser en mouvements circulaires","frpos":"loc.v.","frdef":"Faire rouler les doigts en petits cercles pour étaler ou faire pénétrer un produit."},{"id":"BT0020","k":"h","cat":"gen","w":"모공 커버","rom":"mogong keobeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"모공(한자어)+커버(cover)","memofr":"Locution : 모공 (pores) + 커버 (angl. cover)","note":"Allégation fréquente des primers et des fonds de teint ; il s'agit d'un effet optique, non d'une réduction réelle des pores.","mean":"피부 모공 구멍이나 굴곡을 채워 시각적으로 매끈하게 가려주는 효과","ex":"모공 커버가 잘 되는 프라이머라 파운데이션이 매끈하게 올라간다.","exfr":"Ce primer camoufle bien les pores, le fond de teint s'applique en douceur sur une peau lisse.","fr":"camouflage des pores","frpos":"n.m.","frdef":"Effet d'un produit qui comble et floute visuellement les pores dilatés.","par":"커버력","rel":"하위어(참고)"},{"id":"BT0021","k":"h","cat":"gen","w":"모공 타이트닝","rom":"mogong taiteuning","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"모공(한자어)+타이트닝(tightening)","memofr":"Locution : 모공 (pores) + 타이트닝 (angl. tightening)","note":"Formule marketing ; l'effet annoncé est temporaire.","mean":"넓어지거나 늘어진 모공 부위를 일시적으로 조여주는 기능","ex":"늘어진 모공에 모공 타이트닝 세럼을 꾸준히 바르고 있다.","exfr":"J'applique régulièrement un sérum resserreur de pores sur mes pores dilatés.","fr":"resserrement des pores","frpos":"n.m.","frdef":"Effet annoncé de resserrer temporairement les pores relâchés."},{"id":"BT0024","k":"h","cat":"gen","w":"무너지다","rom":"muneojida","pos":"동사","unit":"단어","eo":"고유어","form":"단일어","memo":"활용: 무너져, 무너졌다 / 명사형: 무너짐","memofr":"Mot simple : 무너지다 (s'effondrer), sens spécialisé en maquillage","note":"Formes courantes : 무너져, 무너졌다 ; nom : 무너짐. Voir aussi l'expression « 무너짐이 예쁘다 ».","mean":"시간이 지나며 피지·유분 때문에 베이스 화장이 지워지거나 흐트러지다.","ex":"점심때가 지나자 코 옆부터 화장이 무너지기 시작했다.","exfr":"Passé midi, mon maquillage a commencé à se dégrader à partir des ailes du nez.","fr":"se dégrader (maquillage)","frpos":"v.","frdef":"Se dit du maquillage ou d'un solaire qui se défait et s'estompe par plaques sous l'effet du sébum."},{"id":"BT0025","k":"h","cat":"gen","w":"묻어나다","rom":"mudeonada","pos":"동사","unit":"단어","eo":"고유어","form":"파생어","memo":"활용: 묻어나, 묻어났다 / 명사형: 묻어남","memofr":"Dérivé : 묻다 (se tacher) + 나다 (sortir)","note":"Défaut très commenté depuis le port généralisé du masque ; formes : 묻어나, 묻어났다 ; nom : 묻어남.","mean":"바른 제품이 손이나 마스크처럼 닿는 면에 옮겨 묻다.","ex":"이 틴트는 마스크에 거의 묻어나지 않는다.","exfr":"Ce tint ne transfère presque pas sur le masque.","fr":"transférer (laisser des traces)","frpos":"v.","frdef":"Fait qu'un produit se dépose sur les mains, un masque, une tasse, etc."},{"id":"BT0026","k":"h","cat":"gen","w":"밀리다","rom":"millida","pos":"동사","unit":"단어","eo":"고유어","form":"파생어","memo":"활용: 밀려, 밀렸다 / 명사형: 밀림","memofr":"Dérivé : 밀다 (pousser) + -리- (suffixe passif)","note":"Se dit quand on superpose des soins incompatibles ou trop vite ; nom : 밀림.","mean":"덧바른 제품이 흡수되지 않고 때처럼 뭉쳐 일어나다.","ex":"톤업 선크림 위에 쿠션을 발라도 밀리지 않는다.","exfr":"Même appliqué sur une crème solaire tone-up, le cushion ne peluche pas.","fr":"pelucher","frpos":"v.","frdef":"Se dit d'un produit qui forme des petites peluches ou se décolle quand on applique une autre couche."},{"id":"BT0027","k":"h","cat":"gen","w":"밀착력","rom":"milchangnyeok","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"밀착+-력(한자 접미사)","memofr":"Dérivé : 밀착 (adhérence) + -력 (suffixe « force, capacité »)","note":"Critère majeur dans les avis sur les fonds de teint et les solaires.","mean":"차단제 제형이 피부 표면에 들뜸 없이 얇게 감겨 붙어있는 힘","ex":"밀착력이 좋아서 오후가 돼도 화장이 밀리지 않았다.","exfr":"L'adhérence est si bonne que le maquillage n'avait pas peluché même l'après-midi.","fr":"adhérence","frpos":"n.f.","frdef":"Capacité d'un produit à adhérer à la peau de manière fine et uniforme."},{"id":"BT0028","k":"h","cat":"gen","w":"발림성","rom":"ballimseong","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"바르다(발리-, 피동)+-ㅁ+-성(한자 접미사)","memofr":"Dérivé : 바르다 (appliquer, forme passive 발리-) + -ㅁ (nominalisateur) + -성 (suffixe « qualité »)","note":"Critère d'évaluation omniprésent dans les avis ; on dit 발림성이 좋다 (« s'étale bien »).","mean":"제품을 피부에 펴 바를 때 잘 퍼지는 정도에 대한 평가.","ex":"끈적임 없이 발림성이 좋고 보습도 오래간다.","exfr":"Il a un bon étalement, sans coller, et l'hydratation dure longtemps.","fr":"étalement, glisse","frpos":"n.m.","frdef":"Facilité avec laquelle un produit s'étale sur la peau."},{"id":"BT0030","k":"h","cat":"gen","w":"보송하다","rom":"bosonghada","pos":"형용사","unit":"단어","eo":"고유어","form":"파생어","memo":"보송(어근)+-하다","memofr":"Dérivé : 보송 (racine onomatopéique « sec et doux ») + -하다 (suffixe adjectival)","note":"Terme valorisant, opposé à « collant » ; forme redoublée : 보송보송.","mean":"피부 표면이 축축하거나 끈적이지 않고 산뜻하게 마른 듯한 감각.","ex":"겉은 보송하고 속은 촉촉한 마무리가 마음에 든다.","exfr":"J'aime ce fini sec et velouté en surface, hydraté en profondeur.","fr":"sec et velouté (au toucher)","frpos":"loc.adj.","frdef":"Fini sec, non collant et doux au toucher, sans brillance."},{"id":"BT0032","k":"h","cat":"gen","w":"붉은기","rom":"bulgeungi","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"붉다(고유어)+기(한자어)","memofr":"Composé : 붉다 (rouge) + 기 (« trace, teinte »)","note":"Terme courant ; s'emploie avec les verbes « apaiser » ou « couvrir ».","mean":"세안 자극에 의해 혈관이 확장되어 겉으로 붉게 홍조가 띠는 상태.","ex":"세안할 때 마찰 자극으로 생긴 붉은기를 가라앉혀 준다.","exfr":"Il apaise les rougeurs causées par le frottement lors du nettoyage.","fr":"rougeurs","frpos":"n.f.pl.","frdef":"Teinte rouge de la peau due à une irritation ou à des vaisseaux dilatés."},{"id":"BT0033","k":"h","cat":"gen","w":"블러링","rom":"beulleoring","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"영어 blurring 차용","memofr":"Emprunt à l'anglais blurring","note":"Désigne un effet optique ; produits associés : primers, poudres et teintes « blur ».","mean":"피부 결점을 포커스 아웃한 것처럼 흐릿하고 매끈하게 만드는 연출","ex":"포토샵으로 보정한 듯 모공과 요철을 지워 주는 블러링 효과가 있다.","exfr":"Il a un effet flouteur qui efface pores et irrégularités, comme une retouche Photoshop.","fr":"effet flouteur (blurring)","frpos":"n.m.","frdef":"Effet optique qui estompe les imperfections comme un flou photographique.","par":"피부표현","rel":"관련어(참고)"},{"id":"BT0036","k":"h","cat":"gen","w":"속건조","rom":"sokgeonjo","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"속(고유어)+건조(한자어)","memofr":"Composé : 속 (intérieur) + 건조 (sécheresse)","note":"Notion clé du discours coréen : une peau peut briller en surface et être déshydratée en profondeur.","mean":"겉의 유분감과 별개로 피부 안쪽이 건조하다고 느끼는 상태.","ex":"이 크림은 속건조를 잡아 주지 못하는 것 같아 아쉽다.","exfr":"Dommage, cette crème ne semble pas venir à bout de la déshydratation profonde.","fr":"déshydratation profonde","frpos":"n.f.","frdef":"Sensation de peau déshydratée en profondeur alors que la surface paraît grasse ou normale.","par":"수부지","rel":"관련어(참고)"},{"id":"BT0037","k":"h","cat":"gen","w":"속광","rom":"sokgwang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"속(고유어)+광(한자어)","memofr":"Composé : 속 (intérieur) + 광 (éclat)","note":"Idéal de teint coréen : un éclat discret, opposé à la brillance grasse ; voir aussi 물광.","mean":"피부 속에서 은은하게 배어나오는 듯해 보이는 윤기를 뜻한다.","ex":"톤업 선크림을 바르니 은은하게 속광이 생긴다.","exfr":"Avec la crème solaire tone-up, un léger éclat « de l'intérieur » apparaît.","fr":"éclat de l'intérieur","frpos":"n.m.","frdef":"Lumière douce qui semble venir de l'intérieur de la peau, sans brillance grasse."},{"id":"BT0038","k":"h","cat":"gen","w":"수부지","rom":"subuji","pos":"명사","unit":"단어","eo":"한자어","form":"축약어(두음절어)","memo":"수(분) 부(족형) 지(성)의 첫 음절 축약","memofr":"Abréviation syllabique : 수(분) (eau) + 부(족형) (manque) + 지(성) (peau grasse)","note":"Diagnostic très répandu chez les consommateurs coréens ; utile pour orienter le choix d'un soin.","mean":"수분 부족형 지성 피부를 뜻한다.","ex":"수부지에게는 여름에 쓰기에 살짝 무거운 느낌이 있다.","exfr":"Pour une peau grasse déshydratée, il paraît un peu lourd en été.","fr":"peau grasse déshydratée","frpos":"n.f.","frdef":"Abréviation de « 수분 부족형 지성 »: peau qui produit du sébum mais manque d'eau."},{"id":"BT0039","k":"h","cat":"gen","w":"수분감","rom":"subungam","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"수분+-감(한자 접미사)","memofr":"Dérivé : 수분 (hydratation) + -감 (suffixe « sensation »)","note":"Mot d'avis client plus que terme technique.","mean":"피부가 물기를 머금는 듯 느껴지는 정도.","ex":"수분감이 좋아서 건성 피부나 겨울철에 쓰기 좋다.","exfr":"Sa sensation d'hydratation est agréable : il convient bien aux peaux sèches ou à l'hiver.","fr":"sensation d'hydratation","frpos":"n.f.","frdef":"Sensation de fraîcheur aqueuse et d'hydratation que procure un produit."},{"id":"BT0042","k":"h","cat":"gen","w":"약산성","rom":"yaksanseong","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"약-(한자 접두사)+산성","memofr":"Dérivé : 약- (préfixe « faible ») + 산성 (acidité)","note":"Argument de vente très fréquent pour les nettoyants (pH 5 à 6).","mean":"강하지 않은 산성 범위의 성질을 뜻하는 제형 설명.","ex":"pH4 약산성 크림이라 민감한 피부에도 순하게 쓸 수 있다.","exfr":"C'est une crème au pH légèrement acide (pH 4), assez douce pour les peaux sensibles.","fr":"pH légèrement acide","frpos":"n.m.","frdef":"Caractère faiblement acide (pH proche de celui de la peau) d'un produit."},{"id":"BT0047","k":"h","cat":"gen","w":"유분 폭발","rom":"yubun pokbal","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"유분+폭발","memofr":"Locution : 유분 (sébum, gras) + 폭발 (explosion)","note":"Hyperbole familière des avis, surtout en été.","mean":"고온다습한 날씨로 피지나 유분이 극도로 많이 분비되는 상태","ex":"여름철 유분 폭발 피부에도 보송하게 유지된다.","exfr":"La peau reste sèche au toucher même en été, en pleine explosion de sébum.","fr":"explosion de sébum","frpos":"n.f.","frdef":"Production de sébum très importante (chaleur, humidité) rendant la peau très luisante."},{"id":"BT0048","k":"h","cat":"gen","w":"유분기","rom":"yubungi","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"유분+-기(한자 접미사)","memofr":"Dérivé : 유분 (gras) + -기 (suffixe « trace, nuance »)","note":"Souvent dans les tournures 유분기 없이 (« sans fini gras ») ou 유분기 제거.","mean":"피부 표면에 과도하게 분비되는 기름 성분 및 번들거림","ex":"번들거리는 유분기를 싹 잡아 주는 매트 선스틱이다.","exfr":"Ce stick solaire mat absorbe complètement la brillance grasse.","fr":"traces de gras, brillance","frpos":"n.f.pl.","frdef":"Présence de sébum ou de corps gras visible sur la peau."},{"id":"BT0049","k":"h","cat":"gen","w":"유수분 밸런스","rom":"yusubun baelleonseu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"유수분+밸런스(balance)","memofr":"Locution : 유수분 (eau et sébum) + 밸런스 (angl. balance)","note":"Formule marketing récurrente des toners et des émulsions.","mean":"피부 유분과 수분의 균형 상태를 뜻한다.","ex":"요즘 유수분 밸런스가 안 맞는지 겉은 번들거리고 속은 당긴다.","exfr":"Mon équilibre eau-sébum doit être perturbé : ma peau brille en surface mais tiraille en profondeur.","fr":"équilibre eau-sébum","frpos":"n.m.","frdef":"Équilibre entre l'hydratation (eau) et les lipides (sébum) de la peau."},{"id":"BT0050","k":"h","cat":"gen","w":"자극감","rom":"jageukgam","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"자극+-감","memofr":"Dérivé : 자극 (irritation) + -감 (suffixe « sensation »)","note":"S'emploie surtout à la forme négative : 자극감 없이 (« sans sensation d'irritation »).","mean":"제품 사용 시 피부가 불편하게 자극받는 느낌.","ex":"레티놀 세럼을 처음 바르는 날에는 자극감이 꽤 있었다.","exfr":"Le premier jour où j'ai appliqué le sérum au rétinol, j'ai eu une sensation d'irritation assez nette.","fr":"sensation d'irritation","frpos":"n.f.","frdef":"Sensation d'inconfort, de picotement ou de brûlure après l'application."},{"id":"BT0051","k":"h","cat":"gen","w":"잔여감","rom":"janyeogam","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"잔여+-감","memofr":"Dérivé : 잔여 (reste) + -감 (suffixe « sensation »)","note":"Souvent employé pour les nettoyants et les crèmes solaires.","mean":"사용한 제품이 피부 표면에 남아 있다고 느껴지는 감각.","ex":"끈적이거나 겉도는 잔여감 없이 깔끔하게 흡수된다.","exfr":"Il pénètre proprement, sans sensation de résidu collant ni rester en surface.","fr":"sensation de résidu","frpos":"n.f.","frdef":"Impression qu'un film de produit reste sur la peau après application ou rinçage."},{"id":"BT0053","k":"h","cat":"gen","w":"잡티","rom":"japti","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"잡-(한자 접두사)+티(고유어)","memofr":"Dérivé : 잡- (préfixe « divers, mêlé ») + 티 (petite tache)","note":"Terme général : regroupe taches, marques post-acné et rougeurs.","mean":"피부에 작게 보이는 얼룩이나 색 자국 등을 넓게 가리킨다.","ex":"잠을 못 잤더니 기미와 잡티가 더 도드라져 보인다.","exfr":"Faute de sommeil, mes taches et imperfections pigmentaires ressortent davantage.","fr":"imperfections pigmentaires (taches, marques)","frpos":"n.f.pl.","frdef":"Terme générique coréen pour les petites taches, marques et irrégularités de teint."},{"id":"BT0055","k":"h","cat":"gen","w":"정착템","rom":"jeongchaktem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"정착(한자어)+-템(item 축약, 접미사처럼 쓰임)","memofr":"Composé : 정착 (s'installer) + -템 (de l'angl. item)","note":"Argot des avis ; s'oppose à 유목민 (« nomade »), qui change sans cesse de produit.","mean":"여러 제품을 비교하거나 바꿔 본 뒤 꾸준히 선택해 쓰는 제품.","ex":"스무 통 넘게 쓴 진짜 정착템이다.","exfr":"C'est un vrai produit adopté pour de bon : j'en ai utilisé plus de vingt flacons.","fr":"produit adopté pour de bon","frpos":"n.m.","frdef":"Produit qu'on finit par adopter durablement après en avoir essayé beaucoup.","par":"인생템","rel":"관련어(참고)"},{"id":"BT0059","k":"h","cat":"gen","w":"톤업","rom":"toneop","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"tone+up(영어 결합 차용, 한국식 조어) / 원어에서 통째로 들어온 외래어라 단일어로 봄","memofr":"Emprunt à l'anglais tone up, formé en coréen ; traité comme mot simple","note":"Les crèmes « tone-up » éclaircissent le teint par un effet optique, souvent avec un léger fini blanc.","mean":"피부색이 더 밝아 보이는 변화. 또는 그런 효과를 내는 제품.","ex":"피부 톤업이 확 되는 건 아니지만 자연스럽게 밝아진다.","exfr":"L'effet éclaircissant du teint n'est pas radical, mais le teint s'illumine naturellement.","fr":"effet éclaircissant du teint (tone-up)","frpos":"n.m.","frdef":"Éclaircissement immédiat et visuel du teint par un produit teinté ou nacré."},{"id":"BT0061","k":"h","cat":"gen","w":"피부 요철","rom":"pibu yocheol","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"피부+요철","memofr":"Locution : 피부 (peau) + 요철 (creux et bosses)","note":"Terme plutôt technique ; dans les avis on dit aussi 울퉁불퉁 (« bosselé »).","mean":"피부 표면에 높낮이나 작은 돌기가 있어 고르지 않게 보이는 상태.","ex":"꾸준히 바르니 피부 요철이 조금 매끄러워졌다.","exfr":"Avec une application régulière, les irrégularités de texture se sont un peu lissées.","fr":"irrégularités de texture","frpos":"n.f.pl.","frdef":"Reliefs de la peau (pores, cicatrices) rendant la surface inégale."},{"id":"BT0063","k":"h","cat":"gen","w":"피부결","rom":"pibugyeol","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"피부(한자어)+결(고유어)","memofr":"Composé : 피부 (peau) + 결 (grain, texture)","note":"Notion centrale des soins coréens ; s'emploie avec 정돈하다 (« affiner le grain de peau »).","mean":"피부 표면의 고르기와 질감을 뜻한다.","ex":"피부결 개선을 기대하고 샀는데 한 달 쓰니 확실히 매끄러워졌다.","exfr":"Je l'ai acheté pour affiner le grain de peau, et après un mois il est nettement plus lisse.","fr":"grain de peau","frpos":"n.m.","frdef":"Texture et régularité de la surface de la peau."},{"id":"BT0065","k":"h","cat":"gen","w":"화잘먹","rom":"hwajalmeok","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"화(장이) 잘 먹(다)의 음절 축약","memofr":"Abréviation syllabique : 화(장이) (le maquillage) + 잘 (bien) + 먹(다) (« prendre », adhérer)","note":"Néologisme très fréquent dans la publicité et les avis ; présenté comme le but des soins préparatoires.","mean":"기초 사용 뒤 화장이 피부에 잘 밀착되고 곱게 표현된다는 뜻의 홍보 표현.","ex":"화잘먹 피부를 만들려고 전날 밤 수분팩을 붙였다.","exfr":"La veille au soir, j'ai posé un masque hydratant pour que le maquillage accroche bien.","fr":"« le maquillage accroche bien »","frpos":"expr.","frdef":"Abréviation de « 화장이 잘 먹다 »: peau ou produit qui permet un maquillage bien fondu et durable."},{"id":"BT0074","k":"h","cat":"skin","w":"겉돌다","rom":"geotdolda","pos":"동사","unit":"단어","eo":"고유어","form":"파생어","memo":"겉-(접두사)+돌다","memofr":"Dérivé : 겉- (préfixe « surface ») + 돌다 (tourner)","note":"Se dit surtout des crèmes et des huiles qui ne pénètrent pas.","mean":"제품이 스며들지 않고 피부 표면에 남아 도는 느낌을 뜻한다.","ex":"크림을 너무 많이 발랐는지 흡수되지 않고 피부 위에서 겉돈다.","exfr":"J'ai dû mettre trop de crème : elle ne pénètre pas et reste en surface.","fr":"ne pas pénétrer, rester en surface","frpos":"loc.v.","frdef":"Se dit d'un produit qui ne s'absorbe pas et glisse à la surface de la peau."},{"id":"BT0075","k":"h","cat":"skin","w":"겉보습","rom":"geotboseup","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"겉-(접두사)+보습","memofr":"Dérivé : 겉- (préfixe « surface ») + 보습 (hydratation)","note":"S'emploie en opposition à 속보습 (« hydratation en profondeur »).","mean":"피부 표면에서 느껴지거나 나타나는 보습을 강조한 광고 표현.","ex":"이 크림은 겉보습은 좋은데 속건조까지 잡아 주지는 못한다.","exfr":"Cette crème hydrate bien en surface, mais elle ne règle pas la déshydratation profonde.","fr":"hydratation de surface","frpos":"n.f.","frdef":"Hydratation ressentie seulement en surface (opposée à 속보습).","par":"수부지","rel":"관련어(참고)"},{"id":"BT0078","k":"h","cat":"skin","w":"고민 부위","rom":"gomin buwi","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"고민+부위","memofr":"Locution : 고민 (souci) + 부위 (zone)","note":"Formule courante des fiches produit, souvent pour les soins ciblés.","mean":"탄력 저하나 주름 등 사용자가 관리하고 싶은 문제가 있는 피부 부분.","ex":"탄력 세럼을 고민 부위인 팔자주름에 한 번 더 덧발랐다.","exfr":"J'ai remis une couche de sérum raffermissant sur ma zone à problème, les plis nasogéniens.","fr":"zone à problème","frpos":"n.f.","frdef":"Partie du visage qu'on souhaite traiter (rides, pores, taches…)."},{"id":"BT0082","k":"h","cat":"skin","w":"공병템","rom":"gongbyeongtem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"공병+-템(item 축약)","memofr":"Composé : 공병 (flacon vide) + -템 (de l'angl. item)","note":"Les vidéos de « 공병 리뷰 » (produits terminés) sont un format populaire en Corée.","mean":"끝까지 사용해 용기를 비웠거나 반복해서 비우는 제품을 뜻한다.","ex":"이 토너는 벌써 세 통을 비운 공병템이다.","exfr":"Cette lotion tonique est un produit que l'on rachète après l'avoir terminé : j'en ai déjà vidé trois flacons.","fr":"produit que l'on rachète après l'avoir terminé","frpos":"n.m.","frdef":"Produit utilisé jusqu'à la dernière goutte, signe qu'on l'a aimé.","par":"인생템","rel":"관련어(참고)"},{"id":"BT0083","k":"h","cat":"skin","w":"괄사","rom":"gwalsa","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"괄+사, 중국어 guasha의 한자음","memofr":"Composé : 괄 (gratter) + 사 (désigne la pratique du gua sha), d'après le chinois guasha","note":"Terme d'origine chinoise ; en France, on garde « gua sha ».","mean":"피부를 문지르며 마사지하는 데 쓰는 도구.","ex":"앰플을 바른 뒤 괄사로 턱선을 따라 쓸어내린다.","exfr":"Après l'ampoule, je passe le gua sha le long de la mâchoire.","fr":"gua sha","frpos":"n.m.","frdef":"Outil en pierre ou en métal utilisé pour masser et drainer le visage."},{"id":"BT0084","k":"h","cat":"skin","w":"구원템","rom":"guwontem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"구원+-템(item 축약)","memofr":"Composé : 구원 (salut) + -템 (de l'angl. item)","note":"Argot des avis ; l'image est religieuse (« produit qui sauve »).","mean":"피부 상태가 나빠졌을 때 도움이 된다고 느끼는 제품을 구원자에 비유함.","ex":"환절기에 피부가 뒤집어졌을 때 이 크림이 구원템이었다.","exfr":"Quand ma peau a viré à l'entre-saison, cette crème a été mon produit sauveur.","fr":"produit sauveur","frpos":"n.m.","frdef":"Produit qui « sauve » la peau en période de crise (irritation, sécheresse).","par":"인생템","rel":"관련어(참고)"},{"id":"BT0086","k":"h","cat":"skin","w":"국소 부위 사전 테스트","rom":"gukso buwi sajeon teseuteu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"국소 부위+사전+테스트(test)","memofr":"Locution : 국소 부위 (zone limitée) + 사전 (préalable) + 테스트 (angl. test)","note":"Recommandation courante des notices coréennes ; on dit aussi « patch test ».","mean":"제품을 본격적으로 바르기 전에 피부의 작은 부위에 먼저 사용해 반응을 확인하는 절차.","ex":"민감한 피부라 새 크림은 귀 뒤에 국소 부위 사전 테스트를 먼저 한다.","exfr":"Ma peau est sensible, alors je fais d'abord un test de tolérance localisé derrière l'oreille avec chaque nouvelle crème.","fr":"test de tolérance localisé","frpos":"n.m.","frdef":"Essai du produit sur une petite zone de peau avant utilisation complète."},{"id":"BT0088","k":"h","cat":"skin","w":"글루타티온","rom":"geullutation","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"영어 glutathione 차용","memofr":"Emprunt à l'anglais glutathione","note":"Très associé à l'éclaircissement du teint dans le marketing asiatique.","mean":"항산화 작용이 있고 피부 톤을 밝히는 데 쓰는 화장품 성분.","ex":"이 세럼은 글루타티온이 들어 있어 칙칙한 피부 톤을 밝히는 데 쓴다.","exfr":"Ce sérum contient du glutathion, je l'utilise pour illuminer un teint terne.","fr":"glutathion","frpos":"n.m.","frdef":"Tripeptide antioxydant mis en avant pour un teint plus lumineux.","ing":"한국어: 글루탐산·시스테인·글라이신 세 아미노산으로 된 트리펩타이드. 항산화 성분으로, 한국 제품에서는 주로 「맑은 피부톤」 문구와 함께 쓰임.\nFrançais : Le glutathion est un tripeptide composé de glutamate, de cystéine et de glycine. Il est utilisé en cosmétique pour ses propriétés antioxydantes.","inci":"Glutathione"},{"id":"BT0089","k":"h","cat":"skin","w":"글리세린","rom":"geulliserin","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"glycerin 차용","memofr":"Emprunt à l'anglais glycerin","note":"Nom INCI : Glycerin ; humectant parmi les plus répandus.","mean":"전성분 목록에 표시된 화장품 배합 성분명.","ex":"글리세린이 들어 있어 바른 뒤에도 촉촉함이 오래 남는다.","exfr":"Grâce à la glycérine, la sensation d'hydratation persiste longtemps après l'application.","fr":"glycérine","frpos":"n.f.","frdef":"Humectant classique qui retient l'eau dans la couche cornée.","ing":"한국어: 대표적인 보습제(휴멕턴트). 물을 끌어당겨 각질층 수분을 유지하는 다가 알코올.\nFrançais : La glycérine est un alcool polyhydrique humectant qui attire l'eau et aide à maintenir l'hydratation de la couche cornée.","inci":"Glycerin"},{"id":"BT0090","k":"h","cat":"skin","w":"기능성 화장품","rom":"gineungseong hwajangpum","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"기능성+화장품","memofr":"Locution : 기능성 (fonctionnel) + 화장품 (cosmétique)","note":"Catégorie réglementaire propre à la Corée (éclaircissement, anti-rides, protection solaire…), sans équivalent exact dans l'UE.","mean":"기능성에 관한 심사 또는 보고를 거친 제품이라고 표시하는 안내 문구의 화장품 분류.","ex":"주름 개선 기능성 화장품이라 상자에 기능성 문구가 적혀 있다.","exfr":"C'est un cosmétique fonctionnel anti-rides, la mention figure sur la boîte.","fr":"cosmétique fonctionnel (catégorie réglementaire coréenne)","frpos":"n.m.","frdef":"Cosmétique dont l'efficacité (éclaircissement, anti-rides, UV…) est évaluée ou déclarée auprès du MFDS."},{"id":"BT0093","k":"h","cat":"skin","w":"기초유목민","rom":"gichoyumongmin","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"기초+유목민","memofr":"Composé : 기초 (soins de base) + 유목민 (nomade)","note":"Argot des forums beauté ; s'oppose à 정착템.","mean":"마음에 드는 기초 제품을 정하지 못해 여러 제품을 바꾸어 쓰는 사람.","ex":"맞는 크림을 못 찾아서 삼 년째 기초유목민으로 지내고 있다.","exfr":"Faute de trouver la bonne crème, je suis « nomade » des soins de base depuis trois ans.","fr":"« nomade » des soins de base","frpos":"n.m.","frdef":"Personne qui change sans cesse de produits de soin faute d'en trouver un qui lui convient."},{"id":"BT0094","k":"h","cat":"skin","w":"깐달걀","rom":"kkandalgyal","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"까다(관형형 깐)+달걀 통사적 합성","memofr":"Composé : 깐 (écalé, de 까다) + 달걀 (œuf)","note":"Image très courante pour une peau lisse et nette ; voir aussi 깐달걀 피부.","mean":"껍질을 깐 삶은 달걀처럼 매끈해 보이는 피부를 비유하는 광고 표현.","ex":"세럼을 꾸준히 바르니 깐달걀처럼 매끈한 피부가 됐다.","exfr":"À force d'appliquer ce sérum, j'ai une peau « œuf écalé », toute lisse.","fr":"peau « œuf écalé »","frpos":"n.f.","frdef":"Métaphore d'une peau lisse et nette comme un œuf dur écalé.","par":"꿀피부","rel":"관련어(참고)"},{"id":"BT0095","k":"h","cat":"skin","w":"꾸덕하다","rom":"kkudeokhada","pos":"형용사","unit":"단어","eo":"고유어","form":"파생어","memo":"꾸덕(어근)+-하다 / 신조어(표준국어대사전 미등재)","memofr":"Dérivé : 꾸덕 (racine expressive « pâteux ») + -하다 (suffixe adjectival)","note":"Néologisme absent du dictionnaire de référence ; très fréquent dans les avis.","mean":"내용물이 되거나 밀도 있게 달라붙는 듯한 사용감. 작성자는 그런 느낌이 적은 것을 선호함.","ex":"이 크림은 꾸덕해서 겨울밤에 듬뿍 올려 두기 좋다.","exfr":"Cette crème a une texture dense et onctueuse : idéale à appliquer généreusement les soirs d'hiver.","fr":"texture dense et onctueuse","frpos":"loc.adj.","frdef":"Se dit d'une texture épaisse, compacte et collante (crème, baume)."},{"id":"BT0096","k":"h","cat":"skin","w":"꿀 제형","rom":"kkul jehyeong","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"꿀(고유어)+제형","memofr":"Locution : 꿀 (miel) + 제형 (texture)","note":"Image courante dans les avis pour une texture collante ou filante.","mean":"꿀처럼 점성이 있어 보이는 내용물의 질감을 비유한 표현.","ex":"꿀 제형이라 스포이드에서 천천히 늘어지며 떨어진다.","exfr":"Avec sa texture miel, elle s'étire lentement en coulant de la pipette.","fr":"texture miel","frpos":"n.f.","frdef":"Texture visqueuse et filante, comparée au miel.","par":"제형","rel":"하위어(참고)"},{"id":"BT0097","k":"h","cat":"skin","w":"꿀피부","rom":"kkulpibu","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"꿀(고유어)+피부","memofr":"Composé : 꿀 (miel) + 피부 (peau)","note":"Compliment familier ; on dit aussi 꿀광 (« éclat de miel »).","mean":"매끈하고 윤기가 좋아 보이는 피부를 꿀에 빗대어 높게 평가하는 말.","ex":"광고 속 모델은 파리도 미끄러질 듯한 꿀피부를 자랑한다.","exfr":"Le mannequin de la publicité affiche une peau « de miel » si lisse qu'une mouche y glisserait.","fr":"peau « de miel »","frpos":"n.f.","frdef":"Peau lisse, lumineuse et éclatante, comparée au miel."},{"id":"BT0098","k":"h","cat":"skin","w":"나이아신아마이드","rom":"naiasinamaideu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"niacinamide 차용","memofr":"Emprunt à l'anglais niacinamide","note":"Ingrédient vedette des soins éclaircissants coréens ; nom INCI : Niacinamide.","mean":"피부 톤 개선과 피지 조절에 쓰는 비타민 B3 계열 화장품 성분.","ex":"나이아신아마이드 세럼을 바른 뒤로 잡티가 조금 옅어졌다.","exfr":"Depuis que j'utilise un sérum à la niacinamide, mes taches se sont un peu estompées.","fr":"niacinamide","frpos":"n.m.","frdef":"Forme de vitamine B3, actif éclaircissant reconnu en Corée, utilisé aussi pour le sébum et la barrière.","ing":"한국어: 비타민 B3의 한 형태. 한국에서는 식약처 고시 미백 기능성 원료이며, 피지·장벽 관리 제품에도 널리 쓰임.\nFrançais : La niacinamide est une forme de vitamine B3 utilisée dans les soins pour améliorer l'apparence des taches pigmentaires et soutenir la barrière cutanée.","inci":"Niacinamide"},{"id":"BT0101","k":"h","cat":"skin","w":"노니추출물","rom":"nonichuchulmul","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"노니(noni)+추출물","memofr":"Composé : 노니 (angl. noni) + 추출물 (extrait)","note":"Nom d'ingrédient tel qu'il figure dans la liste INCI coréenne.","mean":"노니 열매에서 얻은 화장품 원료.","ex":"노니추출물이 든 토너를 쓰니 피부가 한결 촉촉해졌다.","exfr":"Avec une lotion tonique à l'extrait de noni, ma peau est nettement plus hydratée.","fr":"extrait de noni","frpos":"n.m.","frdef":"Extrait du fruit de noni (Morinda citrifolia), utilisé comme antioxydant.","ing":"한국어: 남태평양 원산 노니(모린다 시트리폴리아) 열매에서 얻은 추출물. 항산화·컨디셔닝 목적으로 배합.\nFrançais : Extrait du fruit de Morinda citrifolia (noni), utilisé comme ingrédient de soin pour ses composés antioxydants et ses propriétés conditionnantes.","inci":"Morinda Citrifolia Fruit Extract"},{"id":"BT0102","k":"h","cat":"skin","w":"녹차추출물","rom":"nokchachuchulmul","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"녹차+추출물","memofr":"Composé : 녹차 (thé vert) + 추출물 (extrait)","note":"Ingrédient emblématique de la cosmétique coréenne (thé de l'île de Jeju).","mean":"녹차에서 얻는 추출 원료를 가리키는 배합 성분명.","ex":"녹차추출물이 들어간 토너라 피지가 많은 여름에 쓰기 좋다.","exfr":"Cette lotion contient de l'extrait de thé vert : parfaite l'été, quand on produit beaucoup de sébum.","fr":"extrait de thé vert","frpos":"n.m.","frdef":"Extrait de feuilles de thé, riche en polyphénols antioxydants.","ing":"한국어: 차나무 잎 추출물. 카테킨 등 폴리페놀이 들어 있어 항산화·진정·피지 관리 문구에 쓰임.\nFrançais : Extrait de feuilles de thé vert (Camellia sinensis), riche en polyphénols, notamment en catéchines, employé dans les soins antioxydants.","inci":"Camellia Sinensis Leaf Extract"},{"id":"BT0108","k":"h","cat":"skin","w":"당기다","rom":"danggida","pos":"동사","unit":"단어","eo":"고유어","form":"단일어","memo":"다의어 '당기다'의 피부 감각 의미","memofr":"Mot simple : 당기다 (tirer), sens spécialisé de sensation cutanée","note":"Verbe polysémique : sens courant « tirer » ; ici, surtout après le nettoyage.","mean":"세안 뒤 피부가 건조해 팽팽하게 조이는 느낌을 말한다.","ex":"세안하고 아무것도 바르지 않으면 볼이 심하게 당긴다.","exfr":"Si je n'applique rien après m'être lavé le visage, mes joues tiraillent énormément.","fr":"tirailler","frpos":"v.","frdef":"Sensation de peau tendue et sèche, surtout après le nettoyage."},{"id":"BT0111","k":"h","cat":"skin","w":"데일리템","rom":"deillitem","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"데일리(daily)+-템(item 축약)","memofr":"Composé : 데일리 (angl. daily) + -템 (de l'angl. item)","note":"Argot des avis et des réseaux sociaux.","mean":"매일 사용하기 좋다고 표현한 제품.","ex":"순하고 가벼워서 아침저녁으로 쓰는 데일리템이 되었다.","exfr":"Doux et léger, il est devenu mon produit du quotidien, matin et soir.","fr":"produit du quotidien","frpos":"n.m.","frdef":"Produit qu'on utilise tous les jours.","par":"인생템","rel":"관련어(참고)"},{"id":"BT0113","k":"h","cat":"skin","w":"되직한 제형","rom":"doejikhan jehyeong","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"되직하다(관형형)+제형","memofr":"Locution : 되직하다 (épais) + 제형 (texture)","note":"Mot du registre culinaire, appliqué aux cosmétiques.","mean":"액체가 진하고 잘 흐르지 않는 제형.","ex":"되직한 제형이라 손바닥에서 녹인 뒤 눌러 바른다.","exfr":"Comme la texture est épaisse, je la fais fondre dans la paume avant de l'appliquer en pressant.","fr":"texture épaisse","frpos":"n.f.","frdef":"Texture consistante qui ne coule pas.","par":"제형","rel":"하위어(참고)"},{"id":"BT0116","k":"h","cat":"skin","w":"레티날","rom":"retinal","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"retinal 차용","memofr":"Emprunt à l'anglais retinal","note":"Dérivé de la vitamine A ; considéré comme plus actif que le rétinol.","mean":"레티놀보다 작용이 빠른 비타민 A 계열 화장품 성분.","ex":"레티날은 레티놀보다 작용이 빨라 처음에는 이틀에 한 번만 바른다.","exfr":"Le rétinal agit plus vite que le rétinol, alors au début je ne l'applique qu'un jour sur deux.","fr":"rétinal","frpos":"n.m.","frdef":"Dérivé de la vitamine A plus proche de l'acide rétinoïque que le rétinol.","ing":"한국어: 레티날데하이드. 비타민 A 유도체로, 레티놀보다 한 단계 더 레티노산에 가까운 형태라 더 강한 레티노이드로 소개됨.\nFrançais : Le rétinal, ou rétinaldéhyde, est un dérivé de la vitamine A qui peut être transformé en acide rétinoïque dans la peau.","inci":"Retinal","par":"레티놀","rel":"관련어(참고)"},{"id":"BT0117","k":"h","cat":"skin","w":"레티놀","rom":"retinol","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"retinol 차용","memofr":"Emprunt à l'anglais retinol","note":"Ingrédient anti-âge de référence ; les notices recommandent de l'utiliser le soir.","mean":"주름 개선에 쓰는 비타민 A 계열 화장품 성분.","ex":"레티놀 앰플은 자극이 있을 수 있어 저녁에만 바른다.","exfr":"L'ampoule au rétinol peut irriter, alors je ne l'applique que le soir.","fr":"rétinol","frpos":"n.m.","frdef":"Vitamine A, actif anti-rides officiellement reconnu en Corée.","ing":"한국어: 비타민 A. 한국에서는 식약처 고시 주름 개선 기능성 원료. 초기 사용 시 건조·자극(이른바 레티놀 반응)이 생길 수 있음.\nFrançais : Le rétinol est une forme de vitamine A utilisée dans les soins anti-âge. Il peut provoquer sécheresse et irritation, surtout au début de son utilisation.","inci":"Retinol"},{"id":"BT0119","k":"h","cat":"skin","w":"리포좀","rom":"ripojom","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"liposome 차용","memofr":"Emprunt à l'anglais liposome","note":"Terme technique de formulation, repris dans les arguments de vente.","mean":"유효 성분을 감싸 피부 흡수를 돕는다고 알려진 작은 지질 주머니 구조.","ex":"리포좀에 성분을 담아 피부 깊숙이 전달한다고 광고한다.","exfr":"La publicité affirme que les actifs, encapsulés dans des liposomes, pénètrent en profondeur.","fr":"liposome","frpos":"n.m.","frdef":"Vésicule lipidique servant à encapsuler et transporter des actifs.","ing":"한국어: 인지질 이중막으로 된 미세한 주머니(소포). 성분 자체가 아니라 유효 성분을 감싸 전달하는 제형 기술.\nFrançais : Un liposome est une vésicule microscopique formée d'une ou plusieurs bicouches lipidiques, utilisée pour encapsuler certains ingrédients; ce n'est pas un actif unique.","inci":"Liposome(s) — 제형 기술명"},{"id":"BT0121","k":"h","cat":"skin","w":"마데카소사이드","rom":"madekasosaideu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"madecassoside 차용","memofr":"Emprunt à l'anglais madecassoside","note":"Actif apaisant issu de la centella ; très présent dans les produits « cica ».","mean":"전성분 목록에서 함량과 함께 표시한 배합 성분명.","ex":"마데카소사이드가 든 크림이라 붉어진 피부를 가라앉혀 준다.","exfr":"Cette crème contient du madécassoside, elle calme la peau rougie.","fr":"madécassoside","frpos":"n.m.","frdef":"Molécule apaisante extraite de la centella asiatica, emblème des soins « cica ».","ing":"한국어: 병풀(센텔라 아시아티카)에서 얻는 트리테르펜 배당체. 한국 「시카」 제품의 대표 진정 성분.\nFrançais : Le madécassoside est un glycoside triterpénique présent dans la Centella asiatica, employé dans les soins apaisants.","inci":"Madecassoside","par":"시카","rel":"관련어(참고)"},{"id":"BT0123","k":"h","cat":"skin","w":"마무리감","rom":"mamurigam","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"마무리(고유어)+-감","memofr":"Dérivé : 마무리 (finition) + -감 (suffixe « sensation »)","note":"S'emploie avec 산뜻한 (« frais, léger ») ou 촉촉한 (« humide ») pour décrire le fini.","mean":"제품을 바르고 흡수시킨 뒤 피부에 남는 최종적인 사용 느낌.","ex":"끈적임 없이 보송한 마무리감이라 바로 화장을 해도 된다.","exfr":"Le fini est sec et non collant, on peut se maquiller tout de suite après.","fr":"fini (sensation finale)","frpos":"n.m.","frdef":"Sensation laissée sur la peau une fois le produit absorbé."},{"id":"BT0124","k":"h","cat":"skin","w":"마스크 팩","rom":"maseukeu paek","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"mask+pack(한국식 외래어 결합)","memofr":"Locution : 마스크 (angl. mask) + 팩 (angl. pack)","note":"Pléonasme coréen ; en français, on dit simplement « masque ».","mean":"얼굴에 붙여 사용하는 팩 제품을 가리킨다.","ex":"여행 갈 때는 하루에 한 장씩 쓸 마스크 팩을 챙긴다.","exfr":"En voyage, j'emporte un masque en tissu par jour.","fr":"masque","frpos":"n.m.","frdef":"Terme coréen courant pour les masques visage, surtout les masques en tissu."},{"id":"BT0127","k":"h","cat":"skin","w":"메이크업 지속력","rom":"meikeueop jisongnyeok","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"메이크업(make-up)+지속력","memofr":"Locution : 메이크업 (angl. make-up) + 지속력 (durée de tenue)","note":"Critère central des fonds de teint ; souvent mesuré « en heures » dans la publicité.","mean":"화장이 피부에 표현된 상태로 얼마나 오래 유지되는지를 가리키는 광고 표현.","ex":"프라이머를 먼저 바르면 메이크업 지속력이 확실히 좋아진다.","exfr":"Appliquer d'abord un primer améliore nettement la tenue du maquillage.","fr":"tenue du maquillage","frpos":"n.f.","frdef":"Capacité d'un produit à faire durer le maquillage."},{"id":"BT0131","k":"h","cat":"skin","w":"모공 축소","rom":"mogong chukso","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"모공+축소","memofr":"Locution : 모공 (pores) + 축소 (réduction)","note":"Allégation marketing ; la taille réelle des pores varie peu.","mean":"눈에 띄는 모공이 작아 보이도록 하는 관리 효과를 가리킴.","ex":"모공 축소 효과를 기대하고 차가운 패드를 코 옆에 올려 두었다.","exfr":"Pour la réduction des pores, j'ai posé un disque froid à côté du nez.","fr":"réduction des pores","frpos":"n.f.","frdef":"Effet visant à rendre les pores moins visibles."},{"id":"BT0132","k":"h","cat":"skin","w":"모공 탄력","rom":"mogong tallyeok","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"모공+탄력","memofr":"Locution : 모공 (pores) + 탄력 (fermeté)","note":"Formule marketing récente, propre au marché coréen.","mean":"모공 주변 피부의 탄탄함을 관리한다는 홍보 표현.","ex":"나이가 들수록 볼 쪽 모공 탄력이 떨어지는 것이 느껴진다.","exfr":"Avec l'âge, je sens que les pores des joues perdent en fermeté.","fr":"fermeté des pores","frpos":"n.f.","frdef":"Formule marketing: raffermir la peau autour des pores pour qu'ils paraissent moins relâchés."},{"id":"BT0133","k":"h","cat":"skin","w":"모공부자","rom":"mogongbuja","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"모공+부자","memofr":"Composé : 모공 (pores) + 부자 (riche)","note":"Autodérision des avis : « riche en pores ».","mean":"모공이 많거나 도드라져 보인다고 자신을 묘사하는 표현.","ex":"코 주변이 모공부자라 프라이머를 꼭 바른다.","exfr":"J'ai une peau aux pores très visibles autour du nez, alors je mets toujours un primer.","fr":"peau aux pores très visibles","frpos":"n.f.","frdef":"Expression humoristique pour une personne aux pores très visibles."},{"id":"BT0134","k":"h","cat":"skin","w":"모공이 늘어지다","rom":"mogongi neureojida","pos":"동사","unit":"구","eo":"혼종어","form":"구","memo":"모공이+늘어지다(늘다+-어+지다)","memofr":"Locution : 모공이 (les pores) + 늘어지다 (s'affaisser)","note":"Associé au relâchement cutané lié à l'âge ; se dit des pores en forme de goutte.","mean":"모공이 길어지거나 처져 보인다고 느끼는 상태.","ex":"볼 모공이 세로로 늘어져서 탄력 관리를 시작했다.","exfr":"J'ai des pores qui s'affaissent en s'allongeant sur les joues, alors j'ai commencé des soins fermeté.","fr":"pores qui s'affaissent","frpos":"expr.","frdef":"Pores qui deviennent ovales et plus visibles avec la perte de fermeté."},{"id":"BT0140","k":"h","cat":"skin","w":"무난템","rom":"munantem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"무난+-템(item 축약)","memofr":"Composé : 무난 (sans difficulté) + -템 (de l'angl. item)","note":"Jugement neutre, ni positif ni négatif.","mean":"두드러진 장점보다는 일상적으로 큰 부담 없이 쓰는 제품이라는 평가.","ex":"그냥 데일리로 쓰는 무난템입니다.","exfr":"C'est un produit sans surprise que j'utilise simplement au quotidien.","fr":"produit sans surprise","frpos":"n.m.","frdef":"Produit correct, sans défaut ni qualité marquante.","par":"인생템","rel":"관련어(참고)"},{"id":"BT0146","k":"h","cat":"skin","w":"묽은 제형","rom":"mulgeun jehyeong","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"묽다(관형형)+제형","memofr":"Locution : 묽다 (liquide, dilué) + 제형 (texture)","note":"Contraire de 되직한 제형 (« texture épaisse »).","mean":"진하지 않고 물처럼 쉽게 흐르는 제형.","ex":"묽은 제형이라 화장솜에 적셔 닦아 내기 편하다.","exfr":"La texture fluide permet d'imbiber facilement un coton pour essuyer le visage.","fr":"texture fluide","frpos":"n.f.","frdef":"Texture liquide et légère qui coule facilement.","par":"제형","rel":"하위어(참고)"},{"id":"BT0149","k":"h","cat":"skin","w":"미백","rom":"mibaek","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"미+백","memofr":"Composé : 미 (beauté) + 백 (blanc)","note":"Catégorie réglementaire coréenne (soins éclaircissants) ; en Europe, on préfère parler d'« éclat » ou d'« uniformité du teint ».","mean":"피부색이나 잡티를 더 밝고 균일하게 관리하는 효과를 기대하는 표현.","ex":"요즘은 미백에 좋은 성분이 든 세럼을 찾고 있다.","exfr":"En ce moment, je cherche un sérum aux actifs bons pour l'éclaircissement du teint.","fr":"éclaircissement (blanchiment) du teint","frpos":"n.m.","frdef":"Catégorie fonctionnelle coréenne: atténuer les taches et unifier le teint (pas « blanchir » la peau).","par":"기능성 화장품","rel":"관련어(참고)","faux":1},{"id":"BT0152","k":"h","cat":"skin","w":"바쿠치올","rom":"bakuchiol","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"bakuchiol 차용","memofr":"Emprunt à l'anglais bakuchiol","note":"Souvent présenté comme une alternative végétale au rétinol.","mean":"전성분 목록에서 배합 원료로 표시한 성분명.","ex":"레티놀이 자극적이어서 바쿠치올 세럼으로 바꿨다.","exfr":"Le rétinol m'irritait, alors je suis passée à un sérum au bakuchiol.","fr":"bakuchiol","frpos":"n.m.","frdef":"Actif d'origine végétale présenté comme alternative douce au rétinol.","ing":"한국어: 보골지(Psoralea corylifolia) 씨앗에서 얻는 성분. 「식물성 레티놀 대체 성분」으로 홍보됨.\nFrançais : Le bakuchiol est un composé d'origine végétale notamment extrait de Psoralea corylifolia, commercialisé comme alternative cosmétique au rétinol, sans être un rétinoïde.","inci":"Bakuchiol","par":"레티놀","rel":"관련어(참고)"},{"id":"BT0153","k":"h","cat":"skin","w":"바하","rom":"baha","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두문자어)","memo":"B·H·A의 한국식 음절 읽기(두문자어)","memofr":"Sigle : lecture syllabique coréenne de B.H.A.","note":"Même procédé que 아하 (AHA) et 파하 (PHA).","mean":"각질과 피지를 녹이는 성분군 BHA를 한글로 읽은 말.","ex":"바하 토너로 일주일에 두 번 블랙헤드를 관리한다.","exfr":"J'entretiens mes points noirs deux fois par semaine avec une lotion à l'acide bêta-hydroxylé (BHA).","fr":"acide bêta-hydroxylé (B.H.A.)","frpos":"n.m.","frdef":"Lecture coréenne de « BHA », surtout l'acide salicylique, exfoliant liposoluble.","ing":"한국어: BHA(베타하이드록시산)의 한국식 읽기. 주로 살리실산을 가리키며, 지용성이라 모공 속 피지·각질 관리에 쓰임.\nFrançais : Le BHA désigne les bêta-hydroxyacides; en cosmétique, ce terme renvoie surtout à l'acide salicylique, utilisé pour exfolier la peau.","inci":"BHA — 대표: Salicylic Acid","par":"아하","rel":"관련어(참고)"},{"id":"BT0154","k":"h","cat":"skin","w":"배양액","rom":"baeyangaek","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"배양+액","memofr":"Composé : 배양 (culture) + 액 (liquide)","note":"Terme d'ingrédient (cellules souches, ferments) des produits haut de gamme.","mean":"미생물이나 세포를 길러 얻은 액체를 화장품 원료로 쓴 것.","ex":"이 앰플은 효모 배양액을 많이 함유하고 있다.","exfr":"Cette ampoule contient une forte proportion de milieu de culture de levure.","fr":"milieu de culture (filtrat)","frpos":"n.m.","frdef":"Liquide issu de la culture de cellules ou de micro-organismes, utilisé comme ingrédient.","ing":"한국어: 미생물·식물 세포·줄기세포 등을 배양한 뒤 얻은 액체를 넓게 이르는 말. 실제 원료는 제품마다 다르므로 전성분 확인 필요.\nFrançais : Un milieu de culture est un liquide utilisé pour cultiver des cellules ou des micro-organismes. La composition exacte de l'ingrédient cosmétique dépend de son origine et de son procédé de fabrication.","inci":"… Culture Conditioned Media / … Ferment Filtrate 등(제품별)"},{"id":"BT0155","k":"h","cat":"skin","w":"베타인","rom":"betain","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"betaine 차용","memofr":"Emprunt à l'anglais betaine","note":"Humectant doux ; nom INCI : Betaine.","mean":"전성분 목록에서 배합 원료로 표시한 성분명.","ex":"베타인이 들어 있어 세안 후에도 피부가 덜 당긴다.","exfr":"Grâce à la bétaïne, la peau tiraille moins après le nettoyage.","fr":"bétaïne","frpos":"n.f.","frdef":"Dérivé d'acide aminé hydratant et apaisant.","ing":"한국어: 사탕무 등에서 얻는 아미노산 유도체(트라이메틸글라이신). 보습·자극 완화 목적으로 배합.\nFrançais : La bétaïne, ou triméthylglycine, est un composé naturellement présent notamment dans la betterave, utilisé comme humectant et agent de conditionnement.","inci":"Betaine"},{"id":"BT0157","k":"h","cat":"skin","w":"변성알코올","rom":"byeonseongalkool","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"변성+알코올(alcohol)","memofr":"Composé : 변성 (dénaturation) + 알코올 (angl. alcohol)","note":"Ingrédient que de nombreux consommateurs coréens évitent ; il est mentionné dans les listes « sans… ».","mean":"전성분 목록에 표시된 가공 알코올 원료 명칭.","ex":"변성알코올이 앞쪽에 적혀 있으면 민감한 날에는 피한다.","exfr":"Quand l'alcool dénaturé figure en tête de liste, je l'évite les jours où ma peau est sensible.","fr":"alcool dénaturé","frpos":"n.m.","frdef":"Éthanol rendu impropre à la consommation; solvant pouvant dessécher.","ing":"한국어: 마시지 못하게 변성제를 넣은 에탄올. 용매·산뜻한 사용감·빠른 건조에 쓰이며, 민감 피부에서는 건조·자극 요인으로 꼽힘.\nFrançais : L'alcool dénaturé est de l'éthanol auquel on a ajouté des substances le rendant impropre à la consommation. Il sert notamment de solvant et peut être desséchant.","inci":"Alcohol Denat."},{"id":"BT0158","k":"h","cat":"skin","w":"병풀추출물","rom":"byeongpulchuchulmul","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"병풀(고유어)+추출물","memofr":"Composé : 병풀 (centella, mot natif) + 추출물 (extrait)","note":"Base des gammes « cica » ; nom INCI : Centella Asiatica Extract.","mean":"병풀에서 얻은 추출 원료로, 진정 성분으로 널리 쓰임.","ex":"병풀추출물이 든 크림을 바르니 피부가 빨리 진정됐다.","exfr":"Avec une crème à l'extrait de centella asiatica, ma peau s'est vite apaisée.","fr":"extrait de centella asiatica","frpos":"n.m.","frdef":"Extrait de la plante centella, base des soins apaisants « cica ».","ing":"한국어: 병풀(센텔라 아시아티카) 추출물. 마데카소사이드·아시아티코사이드 등을 포함하며 한국 「시카」 진정 제품의 핵심 원료.\nFrançais : Extrait de Centella asiatica, plante utilisée dans les soins cosmétiques apaisants; sa composition varie selon l'extraction.","inci":"Centella Asiatica Extract","par":"시카","rel":"관련어(참고)"},{"id":"BT0160","k":"h","cat":"skin","w":"보습 잠금","rom":"boseup jamgeum","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"보습+잠금(잠그다+-ㅁ)","memofr":"Locution : 보습 (hydratation) + 잠금 (verrouillage, de 잠그다)","note":"Métaphore publicitaire ; produits associés : crèmes, baumes, sleeping masks.","mean":"피부 수분이 쉽게 빠져나가지 않도록 유지한다는 비유적 광고 표현.","ex":"마지막에 크림을 덧발라 보습 잠금을 해 준다.","exfr":"Je termine par une couche de crème pour verrouiller l'hydratation.","fr":"verrouillage de l'hydratation","frpos":"n.m.","frdef":"Formule publicitaire: empêcher l'eau de s'évaporer de la peau."},{"id":"BT0161","k":"h","cat":"skin","w":"보습 지속력","rom":"boseup jisongnyeok","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"보습+지속력","memofr":"Locution : 보습 (hydratation) + 지속력 (durée de tenue)","note":"Souvent chiffré dans la publicité (« 72 heures d'hydratation »).","mean":"바른 뒤 보습 상태가 얼마나 오래 이어지는지를 뜻하는 광고 표현.","ex":"보습 지속력이 좋아서 저녁까지 얼굴이 당기지 않았다.","exfr":"La durée de l'hydratation est si bonne que mon visage ne tiraillait pas jusqu'au soir.","fr":"durée de l'hydratation","frpos":"n.f.","frdef":"Durée pendant laquelle l'effet hydratant persiste."},{"id":"BT0162","k":"h","cat":"skin","w":"보습감","rom":"boseupgam","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"보습+-감","memofr":"Dérivé : 보습 (hydratation) + -감 (suffixe « sensation »)","note":"Décrit une impression ressentie, pas une mesure.","mean":"피부가 건조해지지 않도록 감싸 주는 듯한 느낌.","ex":"가볍게 발리는데도 보습감이 오래 남는 로션이다.","exfr":"Ce lait s'applique légèrement, mais la sensation d'hydratation dure longtemps.","fr":"sensation d'hydratation","frpos":"n.f.","frdef":"Sensation de peau enveloppée et non desséchée."},{"id":"BT0163","k":"h","cat":"skin","w":"보습력","rom":"boseumnyeok","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"보습+-력","memofr":"Dérivé : 보습 (hydratation) + -력 (suffixe « force, capacité »)","note":"Critère d'évaluation des crèmes dans les avis.","mean":"피부가 건조해지지 않게 유지해 주는 정도에 대한 평가.","ex":"끈적임은 거의 없는데 보습력은 약한 편이다.","exfr":"Il ne colle presque pas, mais son pouvoir hydratant est plutôt faible.","fr":"pouvoir hydratant","frpos":"n.m.","frdef":"Capacité d'un produit à maintenir la peau hydratée."},{"id":"BT0164","k":"h","cat":"skin","w":"보습막","rom":"boseummak","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"보습+막","memofr":"Composé : 보습 (hydratation) + 막 (film, membrane)","note":"Image publicitaire ; l'idée est proche du principe occlusif.","mean":"수분이 쉽게 사라지지 않게 피부 표면을 감싸는 층 같은 느낌을 비유함.","ex":"크림을 바르면 피부에 얇은 보습막이 씌워지는 느낌이 든다.","exfr":"Quand j'applique la crème, j'ai l'impression qu'un fin film hydratant recouvre ma peau.","fr":"film hydratant","frpos":"n.m.","frdef":"Fine couche protectrice qui retient l'humidité à la surface."},{"id":"BT0166","k":"h","cat":"skin","w":"볼륨감","rom":"bollyumgam","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"볼륨(volume)+-감","memofr":"Dérivé : 볼륨 (angl. volume) + -감 (suffixe « sensation »)","note":"Deux sens selon le contexte : visage repulpé ou cils fournis.","mean":"① 얼굴 피부가 도톰하고 차 있어 보이는 인상.\n② 속눈썹이 풍성해 보이는 정도.","ex":"쿠션을 얇게 두드려 바르니 광과 함께 피부에 볼륨감이 살아났다.","exfr":"En tapotant une fine couche de cushion, la peau a retrouvé éclat et volume.","fr":"volume, aspect repulpé ; volume (cils)","frpos":"n.m.","frdef":"1. Aspect rebondi et plein du visage ou des lèvres. 2. Effet épaississant sur les cils."},{"id":"BT0167","k":"h","cat":"skin","w":"볼륨광채","rom":"bollyumgwangchae","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"볼륨(volume)+광채","memofr":"Composé : 볼륨 (angl. volume) + 광채 (éclat)","note":"Formule publicitaire associant deux tendances : peau repulpée et lumineuse.","mean":"피부가 도톰하게 차오르면서 빛나 보이는 모습을 내세운 홍보 표현.","ex":"앰플을 두 번 겹쳐 바르니 볼에 볼륨광채가 올라왔다.","exfr":"Après deux couches d'ampoule, un éclat repulpé est apparu sur mes joues.","fr":"éclat repulpé","frpos":"n.m.","frdef":"Formule marketing: peau à la fois repulpée et lumineuse."},{"id":"BT0169","k":"h","cat":"skin","w":"부스팅하다","rom":"buseutinghada","pos":"동사","unit":"단어","eo":"혼종어","form":"파생어","memo":"부스팅(boosting)+-하다","memofr":"Dérivé : 부스팅 (angl. boosting) + -하다 (suffixe verbal)","note":"Lié aux « boosters » appliqués avant les autres soins.","mean":"제품을 함께 활용하여 관리 효과를 높인다는 뜻으로 사용한 홍보 표현.","ex":"세안 직후에 발라 다음 단계의 흡수를 부스팅한다.","exfr":"Appliqué juste après le nettoyage, il booste l'absorption des étapes suivantes.","fr":"booster (l'effet)","frpos":"v.","frdef":"Renforcer l'efficacité d'un soin, souvent par une étape préalable."},{"id":"BT0178","k":"h","cat":"skin","w":"사바사","rom":"sabasa","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"사(람) 바(이) 사(람) 축약","memofr":"Abréviation syllabique : 사(람) (personne) + 바(이) (par) + 사(람) (personne)","note":"Argot internet très courant dans les avis pour relativiser un résultat.","mean":"사람에 따라 제품 반응과 평가가 다를 수 있다는 뜻.","ex":"향은 사바사라서 직접 맡아 보고 사는 것이 좋다.","exfr":"Le parfum, ça dépend des personnes : mieux vaut le sentir avant d'acheter.","fr":"ça dépend des personnes","frpos":"expr.","frdef":"Abréviation de « 사람 바이 사람 » (personne par personne): l'effet varie selon chacun."},{"id":"BT0180","k":"h","cat":"skin","w":"산유국","rom":"sanyuguk","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"산유+국","memofr":"Composé : 산유 (production de pétrole) + 국 (pays)","note":"Métaphore humoristique pour une peau très grasse ; voir aussi 기름 공장.","mean":"피지가 많이 나오는 피부를 석유를 생산하는 나라에 빗댄 말.","ex":"여름만 되면 이마가 산유국이 되어 기름종이를 달고 산다.","exfr":"Chaque été, mon front devient un « pays producteur de pétrole » et je ne quitte plus mes papiers matifiants.","fr":"« pays producteur de pétrole »","frpos":"n.m.","frdef":"Métaphore humoristique pour une peau très grasse.","par":"악지성","rel":"관련어(참고)"},{"id":"BT0182","k":"h","cat":"skin","w":"살리실릭애씨드","rom":"sallisilligaessideu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"salicylic acid 차용(한국 전성분 표기)","memofr":"Emprunt à l'anglais salicylic acid, graphie de l'étiquetage coréen","note":"Nom INCI : Salicylic Acid ; c'est un BHA (voir 바하).","mean":"전성분 목록에 표시된 화장품 배합 성분명.","ex":"살리실릭애씨드가 들어간 클렌저로 코 주변을 꼼꼼히 씻는다.","exfr":"Je nettoie soigneusement le contour du nez avec un nettoyant à l'acide salicylique.","fr":"acide salicylique","frpos":"n.m.","frdef":"Nom INCI coréen de l'acide salicylique, exfoliant BHA.","ing":"한국어: 살리실산의 화장품 성분명 표기(한국 전성분식). 지용성 각질 관리 산(BHA). 「살리실산」과 같은 물질.\nFrançais : L'acide salicylique est un acide aromatique utilisé notamment comme exfoliant dans les soins pour les peaux à imperfections.","inci":"Salicylic Acid"},{"id":"BT0189","k":"h","cat":"skin","w":"성분이 착하다","rom":"seongbuni chakhada","pos":"형용사","unit":"구","eo":"혼종어","form":"구","memo":"성분이+착하다(의인화)","memofr":"Locution : 성분이 (les ingrédients) + 착하다 (être gentil)","note":"Personnification familière ; proche de l'esprit « clean beauty ».","mean":"배합 성분이 피부에 부담이 적고 좋다고 느끼는 평가를 사람의 성품에 비유함.","ex":"성분이 착해서 아이와 같이 써도 걱정이 없다.","exfr":"C'est une formule « clean », je peux l'utiliser avec mon enfant sans inquiétude.","fr":"formule « clean » (ingrédients doux)","frpos":"loc.adj.","frdef":"Se dit d'un produit dont la composition est jugée douce et sans ingrédients controversés."},{"id":"BT0190","k":"h","cat":"skin","w":"세라마이드","rom":"seramaideu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"ceramide 차용","memofr":"Emprunt à l'anglais ceramide","note":"Actif emblématique des soins de la barrière cutanée.","mean":"제품에서 강조하는 지질 성분 이름.","ex":"세라마이드가 든 토너를 쓰니 세안 후 당김이 줄었다.","exfr":"Avec une lotion tonique aux céramides, ma peau tiraille moins après le nettoyage.","fr":"céramide","frpos":"n.m.","frdef":"Lipide de la couche cornée qui renforce la barrière cutanée.","ing":"한국어: 각질층 세포 사이 지질의 주성분인 스핑고지질. 피부 장벽 강화·보습 성분.\nFrançais : Les céramides sont des lipides de la couche cornée qui contribuent à la fonction barrière de la peau et à la limitation de la perte en eau.","inci":"Ceramide NP / AP / EOP 등"},{"id":"BT0192","k":"h","cat":"skin","w":"속보습","rom":"sokboseup","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"속(고유어)+보습","memofr":"Composé : 속 (intérieur) + 보습 (hydratation)","note":"S'oppose à 겉보습 (« hydratation de surface »).","mean":"겉만 촉촉한 느낌을 넘어 피부 안쪽 건조함까지 보완한다는 홍보 표현.","ex":"겉은 번들거려도 속이 당겨서 속보습에 좋은 앰플을 찾았다.","exfr":"Ma peau brille en surface mais tiraille en profondeur, alors j'ai cherché une ampoule qui hydrate en profondeur.","fr":"hydratation en profondeur","frpos":"n.f.","frdef":"Hydratation qui agit sur la sécheresse interne, au-delà de la surface.","par":"수부지","rel":"관련어(참고)"},{"id":"BT0193","k":"h","cat":"skin","w":"속촉촉 겉보송","rom":"sokchokchok geotbosong","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"속+촉촉(어근), 겉+보송(어근)의 대구형 조어","memofr":"Locution parallèle : 속 (intérieur) + 촉촉 (humide) / 겉 (surface) + 보송 (sec et doux)","note":"Formule publicitaire rythmée ; abrégée en 겉보속촉.","mean":"피부 속은 촉촉하게 느껴지면서 표면은 축축하거나 끈적이지 않는 마무리를 함께 묘사함.","ex":"이 쿠션은 속촉촉 겉보송의 정석이다.","exfr":"Ce cushion est l'exemple parfait du « hydraté dedans, sec dehors ».","fr":"hydraté dedans, sec dehors","frpos":"expr.","frdef":"Fini idéal coréen: peau hydratée en profondeur mais mate et non collante en surface.","par":"수부지","rel":"관련어(참고)"},{"id":"BT0195","k":"h","cat":"skin","w":"수분 케어","rom":"subun keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"수분+케어(care)","memofr":"Locution : 수분 (eau, hydratation) + 케어 (angl. care)","note":"Formule générique des fiches produit.","mean":"피부에 수분을 보충하고 건조함을 관리하는 것.","ex":"겨울에는 수분 케어를 중심으로 스킨케어 단계를 짠다.","exfr":"En hiver, j'organise ma routine autour du soin hydratant.","fr":"soin hydratant","frpos":"n.m.","frdef":"Ensemble des gestes visant à réhydrater la peau."},{"id":"BT0196","k":"h","cat":"skin","w":"수분 폭탄","rom":"subun poktan","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"수분+폭탄","memofr":"Locution : 수분 (hydratation) + 폭탄 (bombe)","note":"Hyperbole publicitaire ; aussi un nom de produit fréquent.","mean":"수분을 많이 공급하는 듯한 인상을 폭탄에 빗대어 강조한 홍보 표현.","ex":"바르자마자 물방울이 맺히는 수분 폭탄 크림이다.","exfr":"Une crème « bombe d'hydratation » : des gouttelettes perlent dès l'application.","fr":"« bombe d'hydratation »","frpos":"n.f.","frdef":"Formule marketing pour un produit très hydratant."},{"id":"BT0197","k":"h","cat":"skin","w":"수분광","rom":"subungwang","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"수분+광","memofr":"Composé : 수분 (hydratation) + 광 (éclat)","note":"Proche de 물광 ; l'éclat vient de l'hydratation, pas du sébum.","mean":"피부가 수분을 머금은 듯 촉촉하게 빛나 보이는 마무리를 표현함.","ex":"쿠션을 얇게 두드렸더니 은은한 수분광이 돌았다.","exfr":"En tapotant une fine couche de cushion, un léger éclat hydraté est apparu.","fr":"éclat hydraté (dewy)","frpos":"n.m.","frdef":"Fini lumineux et humide, comme une peau gorgée d'eau.","par":"물광","rel":"관련어(참고)"},{"id":"BT0200","k":"h","cat":"skin","w":"스쿠알란","rom":"seukuallan","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"squalane 차용","memofr":"Emprunt à l'anglais squalane","note":"Huile émolliente légère ; nom INCI : Squalane.","mean":"전성분 목록에 기재된 화장품 배합 성분명.","ex":"스쿠알란 오일을 한 방울 섞어 바르면 덜 건조하다.","exfr":"Une goutte d'huile de squalane mélangée à la crème, et la peau est moins sèche.","fr":"squalane","frpos":"n.m.","frdef":"Huile émolliente légère et stable (forme hydrogénée du squalène).","ing":"한국어: 스쿠알렌에 수소를 첨가해 안정화한 오일. 가볍고 산화가 덜한 유연·보습 성분(올리브·사탕수수 유래 등).\nFrançais : Le squalane est un hydrocarbure saturé obtenu par hydrogénation du squalène; il est utilisé comme émollient stable dans les soins.","inci":"Squalane"},{"id":"BT0204","k":"h","cat":"skin","w":"스킵 케어","rom":"seukip keeo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"skip+care(한국식 조어)","memofr":"Locution : 스킵 (angl. skip) + 케어 (angl. care), formation coréenne","note":"Tendance qui réagit contre la routine coréenne en dix étapes.","mean":"여러 피부 관리 단계를 간소화하여 사용하는 방식.","ex":"피부가 예민해져서 토너와 크림만 바르는 스킵 케어를 하고 있다.","exfr":"Ma peau étant devenue sensible, je fais du skip-care avec seulement une lotion tonique et une crème.","fr":"skip-care (routine simplifiée)","frpos":"n.f.","frdef":"Tendance coréenne consistant à réduire le nombre d'étapes de soin."},{"id":"BT0206","k":"h","cat":"skin","w":"스피큘","rom":"seupikyul","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"spicule 차용","memofr":"Emprunt à l'anglais spicule","note":"Les produits à spicules picotent volontairement ; à éviter sur peau sensible.","mean":"해면 등에서 얻은 바늘 모양의 미세 입자로, 바를 때 따끔한 자극을 주며 흡수를 돕는다고 알려진 성분.","ex":"스피큘이 든 앰플이라 바를 때 따끔한 느낌이 있다.","exfr":"Cette ampoule contient des spicules, elle picote un peu à l'application.","fr":"spicules","frpos":"n.m.pl.","frdef":"Micro-aiguilles de silice d'éponge marine qui picotent et favorisent la pénétration.","ing":"한국어: 민물 해면에서 얻는 미세한 바늘 모양 실리카 조각. 피부에 따끔한 자극을 주며 흡수를 돕는다고 홍보되는 성분·기술.\nFrançais : Les spicules cosmétiques sont de fines structures en forme d'aiguilles, souvent issues d'éponges, incorporées à certains soins exfoliants; elles peuvent provoquer des picotements.","inci":"Hydrolyzed Sponge 등(제품마다 표기 다름)"},{"id":"BT0209","k":"h","cat":"skin","w":"시카","rom":"sika","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(절단어)","memo":"cicatrice/Centella asiatica에서 온 축약 차용","memofr":"Troncation : de l'anglais cicatrice ou de Centella asiatica","note":"Désigne toute une catégorie de produits apaisants à la centella.","mean":"병풀 계열 성분을 내세운 진정 관리 문맥의 화장품 표현.","ex":"마스크 때문에 붉어진 턱에 시카 크림을 발랐다.","exfr":"J'ai appliqué une crème cica sur mon menton rougi par le masque.","fr":"cica (centella)","frpos":"n.f.","frdef":"Terme coréen désignant la centella asiatica et la gamme de soins apaisants qui en contient.","ing":"한국어: 병풀(Centella asiatica)을 가리키는 한국 화장품 업계 통칭. 병풀 추출물·마데카소사이드 등을 넣은 진정 제품군 전체를 부르는 말로도 쓰임.\nFrançais : « Cica » est un terme commercial désignant généralement des soins à base de Centella asiatica ou de ses constituants; il ne correspond pas à un ingrédient INCI unique.","inci":"Centella Asiatica 계열 원료의 통칭"},{"id":"BT0211","k":"h","cat":"skin","w":"쌀알 크기","rom":"ssaral keugi","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"쌀알(합성어)+크기","memofr":"Locution : 쌀알 (grain de riz) + 크기 (taille)","note":"Mesure de dosage typique des notices, comme « noisette » en français.","mean":"바르는 양을 쌀 한 알에 빗대어 아주 적게 설명하는 표현.","ex":"레티놀 크림은 쌀알 크기만 덜어 얼굴 전체에 얇게 편다.","exfr":"Je prélève une dose de crème au rétinol de la taille d'un grain de riz pour tout le visage, en couche fine.","fr":"(dose) grain de riz","frpos":"n.m.","frdef":"Mesure de quantité très petite, de la taille d'un grain de riz."},{"id":"BT0212","k":"h","cat":"skin","w":"생얼","rom":"saengeol","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"생-+얼(굴) — 구어에서는 「쌩얼」로 세게 발음함","memofr":"Composé : 생- (préfixe « cru, nature ») + 얼(굴) (visage)","note":"Familier ; prononcé avec emphase 쌩얼 à l'oral.","mean":"화장을 하지 않은 얼굴을 가리키는 구어 표현.","ex":"미네랄 쿠션도 안 바르고 생얼로 자주 나갑니다.","exfr":"Je sors souvent le visage sans maquillage, sans même un cushion minéral.","fr":"visage sans maquillage","frpos":"n.m.","frdef":"Mot familier pour le visage au naturel, sans maquillage.","par":"꾸안꾸","rel":"관련어(참고)"},{"id":"BT0214","k":"h","cat":"skin","w":"아데노신","rom":"adenosin","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"adenosine 차용","memofr":"Emprunt à l'anglais adenosine","note":"Ingrédient anti-rides reconnu par la réglementation coréenne des cosmétiques fonctionnels.","mean":"주름 개선 기능성 화장품에 널리 쓰이는 배합 성분.","ex":"이 제품에는 주름 개선을 돕는 아데노신 성분이 함유되어 있습니다.","exfr":"Ce produit contient de l'adénosine, qui aide à atténuer les rides.","fr":"adénosine","frpos":"n.f.","frdef":"Nucléoside reconnu en Corée comme actif anti-rides.","ing":"한국어: 핵산을 이루는 뉴클레오사이드. 한국 식약처 고시 주름 개선 기능성 원료.\nFrançais : L'adénosine est un nucléoside naturellement présent dans l'organisme, employé dans certains soins visant à améliorer l'apparence des rides.","inci":"Adenosine"},{"id":"BT0215","k":"h","cat":"skin","w":"아줄렌","rom":"ajullen","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"azulene 차용","memofr":"Emprunt à l'anglais azulene","note":"Donne aux produits une couleur bleue caractéristique.","mean":"카모마일 등에서 유래한 푸른빛의 피부 진정 성분.","ex":"레티날 샷에 판테놀과 아줄렌 성분이 더해져 피부를 진정시켜 줍니다.","exfr":"Le panthénol et l'azulène ajoutés à Retinal Shot apaisent la peau.","fr":"azulène","frpos":"n.m.","frdef":"Composé aromatique bleu présent notamment dans certaines huiles essentielles; à distinguer du guaiazulène.","ing":"한국어: 캐모마일 등에서 얻는 푸른색 성분(구아이아줄렌 등). 진정 목적으로 쓰이며 제품을 푸른빛으로 만듦.\nFrançais : L'azulène est une famille de composés aromatiques colorés en bleu; certains dérivés, comme le guaiazulène, sont utilisés dans les soins apaisants.","inci":"Guaiazulene / Sodium Guaiazulene Sulfonate"},{"id":"BT0217","k":"h","cat":"skin","w":"아하","rom":"aha","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두문자어)","memo":"A·H·A 음절 읽기","memofr":"Sigle : lecture syllabique coréenne de A.H.A.","note":"Même procédé que 바하 (BHA) et 파하 (PHA).","mean":"각질 관리에 쓰는 수용성 산(AHA) 성분 또는 그 제품.","ex":"아하(AHA) 성분을 처음 썼을 때는 피부가 꽤 따갑게 느껴졌습니다.","exfr":"La première fois que j'ai utilisé de l'acide alpha-hydroxylé (AHA), ma peau picotait assez fort.","fr":"acide alpha-hydroxylé (A.H.A.)","frpos":"n.m.","frdef":"Lecture coréenne de « AHA »: acides exfoliants hydrosolubles (glycolique, lactique).","ing":"한국어: AHA(알파하이드록시산)의 한국식 읽기. 글라이콜릭애씨드·락틱애씨드 등 수용성 각질 관리 산.\nFrançais : Les AHA sont des alpha-hydroxyacides, notamment les acides glycolique et lactique, utilisés pour favoriser l'exfoliation superficielle de la peau.","inci":"Glycolic Acid, Lactic Acid"},{"id":"BT0218","k":"h","cat":"skin","w":"악건성","rom":"akgeonseong","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"악-(접두사적)+건성","memofr":"Dérivé : 악- (préfixe « mauvais, extrême ») + 건성 (peau sèche)","note":"Exagération familière des avis ; pendant de 악지성.","mean":"건조함이 매우 심한 피부를 강조하는 표현.","ex":"악건성 및 문제성 피부를 위해 개발된 저자극 수분 제품입니다.","exfr":"Produit hydratant peu irritant conçu pour les peaux très sèches et à problèmes.","fr":"peau très sèche","frpos":"n.f.","frdef":"Peau extrêmement sèche, qui tiraille et desquame."},{"id":"BT0219","k":"h","cat":"skin","w":"악지성","rom":"akjiseong","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"악-+지성","memofr":"Dérivé : 악- (préfixe « mauvais, extrême ») + 지성 (peau grasse)","note":"Exagération familière ; pendant de 악건성.","mean":"피지나 기름기가 매우 많은 지성 피부를 강조하는 소비자 표현.","ex":"피지 분비가 극심한 악지성 피부 타입이 사용하기에 적합합니다.","exfr":"Convient aux peaux très grasses à forte production de sébum.","fr":"peau très grasse","frpos":"n.f.","frdef":"Peau extrêmement grasse et luisante."},{"id":"BT0222","k":"h","cat":"skin","w":"알란토인","rom":"allantoin","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"allantoin 차용","memofr":"Emprunt à l'anglais allantoin","note":"Nom INCI : Allantoin ; fréquent dans les soins pour peaux sensibles.","mean":"피부 진정과 보호를 돕는 보습·진정 배합 성분.","ex":"피부 자극 완화를 돕는 알란토인 성분이 전성분에 포함되어 있습니다.","exfr":"La liste INCI contient de l'allantoïne, qui aide à atténuer les irritations.","fr":"allantoïne","frpos":"n.f.","frdef":"Actif apaisant et protecteur.","ing":"한국어: 컴프리 뿌리에서 유래(현재는 주로 합성)한 성분. 진정·보호·각질 연화 목적.\nFrançais : L'allantoïne est un composé utilisé comme agent protecteur et apaisant dans les produits de soin; elle est aujourd'hui souvent obtenue par synthèse.","inci":"Allantoin"},{"id":"BT0224","k":"h","cat":"skin","w":"알로에베라잎추출물","rom":"alloeberaipchuchulmul","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"알로에베라+잎(고유어)+추출물","memofr":"Composé : 알로에베라 (aloe vera) + 잎 (feuille) + 추출물 (extrait)","note":"Nom d'ingrédient de la liste INCI coréenne.","mean":"알로에베라 잎에서 얻는 추출 원료를 가리키는 성분명.","ex":"알로에베라잎추출물이 들어가 민감해진 피부를 빠르게 진정시켜 줍니다.","exfr":"Grâce à l'extrait de feuille d'aloe vera, il apaise rapidement la peau sensibilisée.","fr":"extrait de feuille d'aloe vera","frpos":"n.m.","frdef":"Extrait hydratant et apaisant d'aloe vera.","ing":"한국어: 알로에 베라 잎에서 얻은 추출물. 수분·진정 목적.\nFrançais : Extrait de feuilles d'Aloe barbadensis (aloe vera), utilisé dans les formules hydratantes et apaisantes.","inci":"Aloe Barbadensis Leaf Extract"},{"id":"BT0225","k":"h","cat":"skin","w":"알부틴","rom":"albutin","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"arbutin 차용","memofr":"Emprunt à l'anglais arbutin","note":"Actif éclaircissant reconnu par la réglementation coréenne.","mean":"멜라닌 생성을 억제해 미백 기능성 제품에 쓰이는 성분.","ex":"알부틴 성분은 인체적용시험 자료를 통해 미백 효능이 검증되었습니다.","exfr":"L'efficacité éclaircissante de l'arbutine a été démontrée par des essais cliniques sur l'humain.","fr":"arbutine","frpos":"n.f.","frdef":"Actif éclaircissant reconnu en Corée, inhibant la production de mélanine.","ing":"한국어: 베어베리 등에서 얻는 하이드로퀴논 배당체. 한국 식약처 고시 미백 기능성 원료.\nFrançais : L'arbutine est un glycoside de l'hydroquinone présent dans certaines plantes, utilisé dans les soins visant à atténuer l'apparence des taches pigmentaires.","inci":"Arbutin / Alpha-Arbutin"},{"id":"BT0227","k":"h","cat":"skin","w":"애매템","rom":"aemaetem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"애매+-템","memofr":"Composé : 애매 (ambigu) + -템 (de l'angl. item)","note":"Argot des avis.","mean":"효과나 만족도가 뚜렷하지 않아 평가하기 애매한 제품.","ex":"효과가 뚜렷하지 않아 계속 써야 할지 다소 애매템입니다.","exfr":"L'effet n'étant pas net, c'est un produit mitigé : je ne sais pas si je vais continuer.","fr":"produit mitigé","frpos":"n.m.","frdef":"Produit dont on ne sait pas s'il est bon ou mauvais.","par":"인생템","rel":"관련어(참고)"},{"id":"BT0229","k":"h","cat":"skin","w":"어성초","rom":"eoseongcho","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"어+성+초","memofr":"Composé : 어 (poisson) + 성 (odeur de poisson) + 초 (herbe)","note":"Nom qui vient de l'odeur de la plante ; ingrédient apaisant prisé pour les peaux à imperfections.","mean":"제품에서 강조하는 식물 유래 성분의 통상 명칭.","ex":"어성초 추출물을 77% 함유한 수분 진정 토너입니다.","exfr":"Lotion tonique hydratante et apaisante contenant 77 % d'extrait d'houttuynia.","fr":"houttuynia (herbe à poisson)","frpos":"n.f.","frdef":"Plante (Houttuynia cordata) utilisée dans les soins apaisants anti-imperfections.","ing":"한국어: 약모밀(Houttuynia cordata) 추출물. 한국 제품에서 트러블·진정 문구와 함께 자주 쓰이는 식물 원료.\nFrançais : L'extrait de Houttuynia cordata provient d'une plante asiatique et est utilisé dans les soins destinés notamment aux peaux sujettes aux imperfections.","inci":"Houttuynia Cordata Extract"},{"id":"BT0232","k":"h","cat":"skin","w":"엄마화장품향","rom":"eommahwajangpumhyang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"엄마+화장품+향","memofr":"Composé : 엄마 (maman) + 화장품 (cosmétique) + 향 (parfum)","note":"Comparaison générationnelle et subjective ; souvent légèrement négative.","mean":"어머니가 쓰는 화장품을 떠올리게 하는 익숙한 향이라는 세대적·주관적 비유.","ex":"제품의 향을 맡아보니 어릴 적 맡던 엄마 화장품 향이 납니다.","exfr":"En le sentant, je retrouve un parfum poudré rétro, le « parfum de cosmétique de maman » de mon enfance.","fr":"parfum poudré rétro (« parfum de cosmétique de maman »)","frpos":"n.m.","frdef":"Odeur poudrée et classique qui rappelle les cosmétiques des mères."},{"id":"BT0234","k":"h","cat":"skin","w":"여드름성 피부 사용 적합","rom":"yeodeureumseong pibu sayong jeokhap","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"여드름성+피부+사용+적합","memofr":"Locution : 여드름성 (à tendance acnéique) + 피부 (peau) + 사용 (utilisation) + 적합 (convenable)","note":"Mention réglementée en Corée : elle suppose un test préalable.","mean":"여드름이 생기기 쉬운 피부에서의 사용 적합성을 내세우는 제품 설명.","ex":"여드름성 피부 사용 적합 테스트를 완료하여 트러블 피부도 안심하고 사용할 수 있습니다.","exfr":"Testé sur peau à tendance acnéique, ce produit convient également aux peaux sujettes aux imperfections.","fr":"testé sur peau à tendance acnéique","frpos":"loc.adj.","frdef":"Mention indiquant que le produit a fait l’objet d’un test sur des peaux à tendance acnéique, sans garantir l’absence de boutons."},{"id":"BT0236","k":"h","cat":"skin","w":"영양감","rom":"yeongyanggam","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"영양+-감","memofr":"Dérivé : 영양 (nutrition) + -감 (suffixe « sensation »)","note":"Utilisé pour les crèmes riches, surtout l'hiver.","mean":"질감이 풍부하고 피부를 충분히 감싸는 듯하다는 감각적 표현.","ex":"영양감이 꽉 찬 제형이라 피부에 든든하게 스며듭니다.","exfr":"Sa texture à la sensation nourrissante pénètre la peau de façon réconfortante.","fr":"sensation nourrissante","frpos":"n.f.","frdef":"Sensation d'une texture riche qui nourrit et enveloppe la peau."},{"id":"BT0238","k":"h","cat":"skin","w":"워터리 제형","rom":"woteori jehyeong","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"워터리(watery)+제형","memofr":"Locution : 워터리 (angl. watery) + 제형 (texture)","note":"Synonyme de 묽은 제형 ; registre plus marketing.","mean":"물처럼 묽게 흐르고 가볍게 느껴지는 내용물의 형태.","ex":"수분감이 가득한 묽은 워터리 제형이라 부담 없이 발립니다.","exfr":"Sa texture aqueuse, fluide et très hydratante s'étale sans lourdeur.","fr":"texture aqueuse","frpos":"n.f.","frdef":"Texture très fluide, presque comme de l'eau.","par":"제형","rel":"하위어(참고)"},{"id":"BT0239","k":"h","cat":"skin","w":"유분감","rom":"yubungam","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"유분+-감","memofr":"Dérivé : 유분 (gras) + -감 (suffixe « sensation »)","note":"Souvent à la forme négative : 유분감 없이 (« sans sensation grasse »).","mean":"기름 성분이 피부 표면에 남아 느껴지는 번들거리거나 미끈거리는 감각.","ex":"사용 후 끈적임이나 겉도는 유분감이 거의 없습니다.","exfr":"Après application, il ne laisse presque aucune sensation collante ni grasse.","fr":"sensation grasse","frpos":"n.f.","frdef":"Impression d'un film gras sur la peau.","par":"잔여감","rel":"관련어(참고)"},{"id":"BT0241","k":"h","cat":"skin","w":"응급 진정","rom":"eunggeup jinjeong","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"응급+진정","memofr":"Locution : 응급 (urgence) + 진정 (apaisement)","note":"Formule publicitaire ; voir aussi 진정 케어.","mean":"갑자기 예민해지거나 자극받은 피부를 빨리 편안하게 관리한다는 홍보 표현.","ex":"자극받은 피부를 빠르게 다독여주는 응급 진정 케어 크림입니다.","exfr":"Une crème « apaisement SOS » qui calme rapidement la peau irritée.","fr":"apaisement SOS","frpos":"n.m.","frdef":"Formule marketing pour un apaisement rapide d'une peau irritée."},{"id":"BT0242","k":"h","cat":"skin","w":"이층상 제형","rom":"icheungsang jehyeong","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"이층상+제형","memofr":"Locution : 이층상 (à deux phases) + 제형 (texture)","note":"Il faut agiter avant usage ; typique des démaquillants pour les yeux.","mean":"기름 성분 쪽과 물 성분 쪽이 두 층으로 나뉜 제품 형태.","ex":"유상과 수상이 나뉜 이층상 제형이므로 충분히 흔들어 사용하세요.","exfr":"Formule biphasée (phase huileuse et phase aqueuse séparées) : bien agiter avant emploi.","fr":"formule biphasée","frpos":"n.f.","frdef":"Produit composé d'une phase huileuse et d'une phase aqueuse séparées.","par":"제형","rel":"하위어(참고)"},{"id":"BT0243","k":"h","cat":"skin","w":"인생템","rom":"insaengtem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"인생+-템","memofr":"Composé : 인생 (vie) + -템 (de l'angl. item)","note":"Superlatif d'avis très courant ; même modèle : 인생 선크림.","mean":"매우 만족스러워 인생에서 손꼽을 만큼 꾸준히 사용하는 제품.","ex":"피부에 잘 맞아 몇 통째 꾸준히 구매하고 있는 인생템입니다.","exfr":"Il convient parfaitement à ma peau : c'est mon produit culte, j'en suis à plusieurs flacons.","fr":"produit culte (de toute une vie)","frpos":"n.m.","frdef":"Le meilleur produit qu'on ait jamais utilisé."},{"id":"BT0244","k":"h","cat":"skin","w":"인체유사 콜라겐","rom":"incheyusa kollagen","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"인체유사+콜라겐(collagen)","memofr":"Locution : 인체유사 (semblable au corps humain) + 콜라겐 (angl. collagen)","note":"Formule marketing ; à distinguer du collagène d'origine animale ou marine.","mean":"인체의 콜라겐과 비슷한 특징을 내세운 원료 홍보 표현.","ex":"인체유사 콜라겐 성분을 함유하여 탄력 있는 피부로 가꿔 줍니다.","exfr":"Contient du collagène biomimétique pour une peau plus ferme.","fr":"collagène « biomimétique »","frpos":"n.m.","frdef":"Formule marketing pour un collagène présenté comme proche du collagène humain.","ing":"한국어: 사람 콜라겐과 구조가 비슷하게 만들었다는(재조합 등) 콜라겐을 부르는 홍보 표현. 실제 원료는 제품마다 달라 전성분 확인 필요.\nFrançais : Le « collagène de type humain » désigne un ingrédient présenté comme similaire au collagène humain, parfois obtenu par biotechnologie; son identité précise dépend de la formule.","inci":"Recombinant Collagen"},{"id":"BT0245","k":"h","cat":"skin","w":"인체적용시험","rom":"inchejeogyongsiheom","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"인체+적용+시험","memofr":"Composé : 인체 (corps humain) + 적용 (application) + 시험 (essai)","note":"Mention fréquente sur les emballages coréens comme argument de confiance.","mean":"사람에게 적용하여 반응 등을 확인한 시험을 뜻함.","ex":"인체적용시험 자료를 통해 피부 자극 완화 효과를 입증했습니다.","exfr":"Son effet apaisant a été démontré par des essais cliniques sur l'humain.","fr":"essai clinique sur l'humain (test d'efficacité)","frpos":"n.m.","frdef":"Étude menée sur des participants humains pour évaluer un produit cosmétique selon un protocole défini."},{"id":"BT0246","k":"h","cat":"skin","w":"장벽 케어","rom":"jangbyeok keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"장벽+케어(care)","memofr":"Locution : 장벽 (barrière) + 케어 (angl. care)","note":"Tendance majeure du soin coréen ; produits phares à base de céramides.","mean":"피부의 수분 손실을 막고 외부 자극으로부터 보호하는 장벽을 강화하는 관리.","ex":"화장이 잘 먹고 피부 장벽 케어에 좋다는 후기를 보고 구매했습니다.","exfr":"Je l'ai acheté après avoir lu des avis disant que le maquillage accroche bien et que c'est un bon soin de la barrière cutanée.","fr":"soin de la barrière cutanée","frpos":"n.m.","frdef":"Soin visant à réparer et renforcer la barrière de la peau."},{"id":"BT0248","k":"h","cat":"skin","w":"저분자 히알루론산","rom":"jeobunja hialluronsan","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"저분자+히알루론산","memofr":"Locution : 저분자 (bas poids moléculaire) + 히알루론산 (acide hyaluronique)","note":"Argument technique repris dans les fiches produit.","mean":"분자 크기를 작게 쪼개 피부 흡수율을 높인 히알루론산 성분.","ex":"저분자 히알루론산 토너가 피부 속 깊은 곳까지 수분을 채워 줍니다.","exfr":"La lotion à l'acide hyaluronique de bas poids moléculaire hydrate la peau en profondeur.","fr":"acide hyaluronique de bas poids moléculaire","frpos":"n.m.","frdef":"Acide hyaluronique de faible masse moléculaire, utilisé notamment pour ses propriétés hydratantes.","ing":"한국어: 분자량을 작게 쪼갠 히알루론산. 일반 히알루론산보다 피부에 잘 스며든다고 홍보되는 보습 성분.\nFrançais : L'acide hyaluronique de faible poids moléculaire désigne des fractions d'acide hyaluronique plus petites, utilisées comme agents hydratants; leur pénétration dépend de leur taille et de la formule.","inci":"Hydrolyzed Hyaluronic Acid, Sodium Hyaluronate","par":"히알루론산","rel":"하위어(참고)"},{"id":"BT0250","k":"h","cat":"skin","w":"전성분","rom":"jeonseongbun","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"전-(접두사)+성분","memofr":"Dérivé : 전- (préfixe « tout, entier ») + 성분 (ingrédient)","note":"Les consommateurs cor
