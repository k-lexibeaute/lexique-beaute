"frpos":"n.m.","frdef":"Abréviation: mascara qui sépare les cils un à un (« 결 »)."},{"id":"BT0764","k":"h","cat":"eye","w":"글리터 섀도우","rom":"geulliteo syaedou","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"glitter+shadow (표준 표기: 섀도)","memofr":"Locution : 글리터 (angl. glitter) + 섀도우 (angl. shadow)","note":"Graphie courante 섀도우 ; la norme officielle écrit 섀도.","mean":"굵은 반짝이가 든 아이섀도.","ex":"글리터 섀도우를 눈 앞머리에 콕 찍어 포인트를 줬다.","exfr":"J'ai déposé une touche de fard à paupières pailleté au coin interne de l'œil pour l'accentuer.","fr":"fard à paupières pailleté","frpos":"n.m.","frdef":"Fard contenant de grosses paillettes."},{"id":"BT0765","k":"h","cat":"eye","w":"깃털컬링","rom":"gitteolkeolling","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"깃털+컬링(curling)","memofr":"Composé : 깃털 (plume) + 컬링 (angl. curling)","note":"Formule publicitaire des mascaras.","mean":"깃털처럼 가볍고 자연스럽게 속눈썹을 올려 주는 컬링 효과(마스카라 홍보 표현).","ex":"깃털컬링 마스카라라 속눈썹이 가볍게 올라간다.","exfr":"C'est un mascara à recourbement « plume » : les cils remontent légèrement.","fr":"recourbement « plume »","frpos":"n.m.","frdef":"Cils recourbés légers et aériens comme une plume.","par":"컬링","rel":"관련어(참고)"},{"id":"BT0766","k":"h","cat":"eye","w":"눈 앞머리","rom":"nun ammeori","pos":"명사","unit":"구","eo":"고유어","form":"구","memo":"눈+앞머리","memofr":"Locution : 눈 (œil) + 앞머리 (partie avant)","note":"Terme de maquillage ; ne pas confondre avec 앞머리, qui désigne aussi la « frange » (cheveux).","mean":"눈의 안쪽 끝(코 쪽) 부분.","ex":"눈 앞머리에 밝은 펄을 올리면 눈이 커 보인다.","exfr":"Une touche de nacre claire au coin interne de l'œil agrandit le regard.","fr":"coin interne de l'œil","frpos":"n.m.","frdef":"Partie interne de l'œil, près du nez."},{"id":"BT0768","k":"h","cat":"eye","w":"눈꼬리 빼기","rom":"nunkkori ppaegi","pos":"명사","unit":"구","eo":"고유어","form":"구","memo":"눈꼬리+빼기(빼다+-기)","memofr":"Locution : 눈꼬리 (coin externe de l'œil) + 빼기 (fait d'étirer)","note":"Geste clé de l'eye-liner coréen.","mean":"아이라인을 눈꼬리 바깥으로 길게 그리는 것.","ex":"눈꼬리 빼기를 길게 했더니 눈매가 훨씬 길어 보인다.","exfr":"En prenant soin d'étirer le trait au coin externe, le regard paraît bien plus allongé.","fr":"étirer le trait au coin externe","frpos":"loc.v.","frdef":"Prolonger l'eye-liner vers l'extérieur pour allonger l'œil.","par":"아이라인","rel":"관련어(참고)"},{"id":"BT0770","k":"h","cat":"eye","w":"눈매 교정","rom":"nunmae gyojeong","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"눈매+교정","memofr":"Locution : 눈매 (forme des yeux) + 교정 (correction)","note":"Terme ambigu : il désigne aussi une chirurgie esthétique.","mean":"화장(또는 시술)으로 눈의 모양을 보정함.","ex":"아이라인으로 눈매 교정을 하면 처진 눈도 또렷해 보인다.","exfr":"La correction de la forme de l'œil à l'eye-liner rend même les yeux tombants plus nets.","fr":"correction de la forme de l'œil","frpos":"n.f.","frdef":"Modifier visuellement la forme des yeux par le maquillage (ou chirurgie)."},{"id":"BT0772","k":"h","cat":"eye","w":"눈매확장","rom":"nunmaehwakjang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"눈매+확장","memofr":"Composé : 눈매 (forme des yeux) + 확장 (agrandissement)","note":"Formule publicitaire.","mean":"화장으로 눈이 실제보다 커 보이게 하는 효과.","ex":"언더라인을 살짝 그어 눈매확장 효과를 줬다.","exfr":"J'ai tracé un léger trait sous l'œil pour agrandir le regard.","fr":"agrandir le regard","frpos":"loc.v.","frdef":"Effet de maquillage qui fait paraître les yeux plus grands."},{"id":"BT0773","k":"h","cat":"eye","w":"도화밤","rom":"dohwabam","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"도화+밤(balm)","memofr":"Composé : 도화 (fleur de pêcher) + 밤 (angl. balm)","note":"Référence au maquillage 도화살, inspiré d'une notion astrologique.","mean":"복숭아꽃(도화)처럼 은은한 혈색을 눈가에 더하는 밤 타입 색조 제품.","ex":"도화밤을 눈두덩에 펴 바르니 은은하게 혈색이 돈다.","exfr":"En étalant le baume « fleur de pêcher » sur la paupière, une légère bonne mine apparaît.","fr":"baume « fleur de pêcher » (dohwa)","frpos":"n.m.","frdef":"Baume rosé pour un regard « fleur de pêcher », séduisant et rosé."},{"id":"BT0774","k":"h","cat":"eye","w":"뒷트임","rom":"dwitteuim","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"뒤+트임(트다+-ㅁ)","memofr":"Composé : 뒤 (arrière) + 트임 (ouverture)","note":"Terme ambigu : il désigne aussi une chirurgie (canthoplastie externe).","mean":"눈꼬리 쪽을 길어 보이게 하는 화장(또는 시술).","ex":"뒷트임 라인을 그리니 눈이 옆으로 길어 보인다.","exfr":"Avec un trait pour l'allongement du coin externe de l'œil, l'œil paraît plus allongé sur le côté.","fr":"allongement du coin externe de l'œil","frpos":"n.m.","frdef":"Maquillage (ou chirurgie) qui allonge visuellement le coin externe de l'œil."},{"id":"BT0775","k":"h","cat":"eye","w":"래쉬 앰플","rom":"raeswi aempeul","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"lash+ampoule","memofr":"Locution : 래쉬 (angl. lash) + 앰플 (angl. ampoule)","note":"Soin, pas un produit de maquillage.","mean":"속눈썹에 영양을 주고 튼튼하게 가꾸는 앰플형 관리 제품.","ex":"래쉬 앰플을 밤마다 바르니 속눈썹이 덜 빠진다.","exfr":"Depuis que j'applique un sérum pour cils tous les soirs, je perds moins de cils.","fr":"sérum pour cils","frpos":"n.m.","frdef":"Soin fortifiant pour les cils."},{"id":"BT0776","k":"h","cat":"eye","w":"롱래쉬","rom":"rongnaeswi","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"long+lash","memofr":"Composé : 롱 (angl. long) + 래쉬 (angl. lash)","note":"Nom de catégorie de mascara.","mean":"속눈썹이 길어 보이게 하는 효과, 또는 그런 효과의 마스카라.","ex":"롱래쉬 타입이라 속눈썹이 길어 보인다.","exfr":"C'est un mascara à effet longueur : les cils paraissent plus longs.","fr":"effet longueur (cils)","frpos":"n.m.","frdef":"Effet allongeant des cils."},{"id":"BT0778","k":"h","cat":"eye","w":"롱앤컬","rom":"rongaenkeol","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"long+and+curl","memofr":"Composé : 롱 (angl. long) + 앤 (angl. and) + 컬 (angl. curl)","note":"Nom de catégorie de mascara.","mean":"속눈썹 길이와 컬을 함께 살려 주는 마스카라 유형.","ex":"롱앤컬 마스카라라 길이와 컬을 한 번에 잡는다.","exfr":"Ce mascara allongeant et recourbant donne longueur et courbure en même temps.","fr":"allongeant et recourbant","frpos":"loc.adj.","frdef":"Mascara qui allonge et recourbe à la fois.","par":"컬링","rel":"관련어(참고)"},{"id":"BT0779","k":"h","cat":"eye","w":"마스카라 픽서","rom":"maseukara pikseo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"mascara+fixer","memofr":"Locution : 마스카라 (angl. mascara) + 픽서 (angl. fixer)","note":"Produit très coréen, pensé pour les cils raides et droits.","mean":"마스카라 위에 덧발라 컬을 고정하고 번짐을 막는 제품.","ex":"마스카라 위에 마스카라 픽서를 덧바르니 컬이 하루 종일 유지된다.","exfr":"Avec un fixateur sur le mascara, la courbure tient toute la journée.","fr":"fixateur de mascara","frpos":"n.m.","frdef":"Top coat qui fixe la courbure et empêche les bavures.","par":"결카라","rel":"관련어(참고)"},{"id":"BT0780","k":"h","cat":"eye","w":"마이크로 마스카라","rom":"maikeuro maseukara","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"micro+mascara","memofr":"Locution : 마이크로 (angl. micro) + 마스카라 (angl. mascara)","note":"Adapté aux cils courts, fréquents en Asie de l'Est.","mean":"아주 작은 브러시로 짧은 속눈썹이나 아래 속눈썹에 바르기 좋은 마스카라.","ex":"마이크로 마스카라로 아래 속눈썹까지 꼼꼼하게 바른다.","exfr":"J'applique soigneusement un mascara à brosse fine jusque sur les cils inférieurs.","fr":"mascara à brosse fine","frpos":"n.m.","frdef":"Mascara à toute petite brosse pour cils courts et cils du bas.","par":"결카라","rel":"관련어(참고)"},{"id":"BT0782","k":"h","cat":"eye","w":"멀티픽서","rom":"meoltipikseo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"multi+fixer","memofr":"Composé : 멀티 (angl. multi) + 픽서 (angl. fixer)","note":"Formule marketing.","mean":"속눈썹·눈썹·메이크업 등 여러 곳에 쓰는 고정 제품.","ex":"멀티픽서를 눈썹과 속눈썹에 함께 쓴다.","exfr":"J'utilise le même fixateur multi-usages pour les sourcils et les cils.","fr":"fixateur multi-usages","frpos":"n.m.","frdef":"Fixateur pour cils, sourcils ou maquillage."},{"id":"BT0783","k":"h","cat":"eye","w":"메탈 마스카라","rom":"metal maseukara","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"metal+mascara","memofr":"Locution : 메탈 (angl. metal) + 마스카라 (angl. mascara)","note":"S'oppose aux brosses en fibres.","mean":"금속 빗 브러시로 속눈썹을 가닥가닥 갈라 주는 마스카라.","ex":"메탈 마스카라라서 속눈썹이 뭉치지 않고 갈라진다.","exfr":"C'est un mascara à brosse métallique : les cils se séparent sans faire de paquets.","fr":"mascara à brosse métallique","frpos":"n.m.","frdef":"Mascara à peigne métallique pour des cils très séparés.","par":"결카라","rel":"관련어(참고)"},{"id":"BT0784","k":"h","cat":"eye","w":"메탈트임카라","rom":"metalteuimkara","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(절단어)","memo":"메탈+트임+(마스)카라 축약","memofr":"Troncation : 메탈 (angl. metal) + 트임 (ouverture) + (마스)카라 (mascara)","note":"Nom de produit devenu générique dans les avis.","mean":"금속 브러시로 속눈썹을 올려 눈매가 트여 보이게 하는 마스카라(제품명이 일반화).","ex":"메탈트임카라를 바르니 눈이 확 트여 보인다.","exfr":"Avec ce mascara métal « ouvre-regard », les yeux paraissent grands ouverts.","fr":"mascara métal « ouvre-regard »","frpos":"n.m.","frdef":"Mascara à brosse métallique qui « ouvre » le regard ; nom devenu générique.","par":"뒷트임","rel":"관련어(참고)"},{"id":"BT0785","k":"h","cat":"eye","w":"무쌍","rom":"mussang","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(절단어)","memo":"무+쌍꺼풀에서 「꺼풀」을 잘라 냄","memofr":"Troncation : 무 (sans) + 쌍(꺼풀) (double paupière)","note":"Mot courant ; il n'a rien de péjoratif. Voir 겉쌍 et 속쌍.","mean":"「무쌍꺼풀」의 줄임말. 쌍꺼풀이 없는 눈.","ex":"무쌍이라서 아이라인을 눈꼬리 쪽에만 길게 뺀다.","exfr":"J'ai une paupière simple, alors je n'étire l'eye-liner qu'au coin externe.","fr":"paupière simple (monolid)","frpos":"n.f.","frdef":"Abréviation de « 무쌍꺼풀 »: absence de pli palpébral.","par":"쌍꺼풀 라인","rel":"관련어(참고)"},{"id":"BT0786","k":"h","cat":"eye","w":"뭉침","rom":"mungchim","pos":"명사","unit":"단어","eo":"고유어","form":"파생어","memo":"뭉치다+-ㅁ","memofr":"Dérivé : 뭉치다 (s'agglomérer) + -ㅁ (nominalisateur)","note":"Défaut cité dans les avis sur les mascaras et le teint.","mean":"마스카라 등이 덩어리져 속눈썹이 엉기는 현상.","ex":"마스카라를 여러 번 덧발랐더니 뭉침이 생겼다.","exfr":"À force de superposer les couches de mascara, il a fait des paquets.","fr":"paquets (mascara)","frpos":"n.m.pl.","frdef":"Cils collés en grappes par le mascara."},{"id":"BT0787","k":"h","cat":"eye","w":"미세펄","rom":"misepeol","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"미세+펄(pearl)","memofr":"Composé : 미세 (fin) + 펄 (angl. pearl)","note":"En coréen, 펄 désigne toute particule nacrée ou pailletée.","mean":"입자가 아주 고운 펄.","ex":"미세펄이 들어 있어 은은하게 반짝인다.","exfr":"Il contient une nacre fine qui scintille subtilement.","fr":"nacre fine","frpos":"n.f.","frdef":"Fines particules nacrées discrètes.","par":"펄이 날리다","rel":"관련어(참고)"},{"id":"BT0789","k":"h","cat":"eye","w":"밑트임","rom":"mitteuim","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"밑+트임","memofr":"Composé : 밑 (bas) + 트임 (ouverture)","note":"Terme ambigu : maquillage ou chirurgie.","mean":"눈 아래쪽을 넓어 보이게 하는 화장(또는 시술).","ex":"밑트임 라인을 연하게 그려 눈을 동그랗게 보이게 했다.","exfr":"Pour l'agrandissement du bas de l'œil, j'ai tracé un trait léger qui arrondit le regard.","fr":"agrandissement du bas de l'œil","frpos":"n.m.","frdef":"Maquillage (ou chirurgie) qui agrandit visuellement le bas de l'œil.","par":"뒷트임","rel":"관련어(참고)"},{"id":"BT0791","k":"h","cat":"eye","w":"베이스 섀도우","rom":"beiseu syaedou","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"base+shadow (표준 표기: 섀도)","memofr":"Locution : 베이스 (angl. base) + 섀도우 (angl. shadow)","note":"Première étape des maquillages des yeux coréens.","mean":"눈두덩 전체에 먼저 바르는 밝은 섀도.","ex":"베이스 섀도우를 눈두덩 전체에 먼저 깔아 준다.","exfr":"J'étale d'abord un fard de base sur toute la paupière.","fr":"fard de base","frpos":"n.m.","frdef":"Fard clair appliqué sur toute la paupière en première couche."},{"id":"BT0794","k":"h","cat":"eye","w":"뷰러","rom":"byureo","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"상표명 Beauler 유래 보통명사화","memofr":"Nom commun issu de la marque japonaise Beauler","note":"Antonomase : comme « Frigidaire » en français.","mean":"속눈썹을 집어 올려 컬을 만드는 도구.","ex":"뷰러로 속눈썹을 올린 뒤 마스카라를 바른다.","exfr":"Je recourbe les cils avec un recourbe-cils avant d'appliquer le mascara.","fr":"recourbe-cils","frpos":"n.m.","frdef":"Nom coréen courant du recourbe-cils (emprunt passé par le japonais).","par":"컬링","rel":"관련어(참고)","faux":1},{"id":"BT0796","k":"h","cat":"eye","w":"브로우카라","rom":"beuroukara","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(절단어)","memo":"brow+(마스)카라 축약","memofr":"Troncation : 브로우 (angl. brow) + (마스)카라 (mascara)","note":"Argot de maquillage courant.","mean":"「브로우 마스카라」의 줄임말. 눈썹 결을 정리하고 색을 입히는 제품.","ex":"브로우카라로 눈썹 결을 정리하고 색을 맞췄다.","exfr":"J'ai discipliné et coloré mes sourcils avec un mascara à sourcils.","fr":"mascara à sourcils","frpos":"n.m.","frdef":"Abréviation de « 브로우 마스카라 »."},{"id":"BT0798","k":"h","cat":"eye","w":"블랙 틴팅","rom":"beullaek tinting","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"black+tinting","memofr":"Locution : 블랙 (angl. black) + 틴팅 (angl. tinting)","note":"Prestation de salon ou kit maison.","mean":"속눈썹을 오래 검게 물들여 진해 보이게 하는 제품.","ex":"블랙 틴팅 앰플이라 바를수록 속눈썹이 진해 보인다.","exfr":"C'est une ampoule de teinture noire semi-permanente : plus on l'applique, plus les cils paraissent foncés.","fr":"teinture noire semi-permanente (cils)","frpos":"n.f.","frdef":"Mascara ou teinte qui noircit les cils durablement."},{"id":"BT0799","k":"h","cat":"eye","w":"삼각존","rom":"samgakjon","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"삼각+존(zone)","memofr":"Composé : 삼각 (triangle) + 존 (angl. zone)","note":"Zone ciblée par les correcteurs et l'enlumineur.","mean":"눈꼬리와 광대 사이의 삼각형 부위.","ex":"삼각존에 밝은 컨실러를 발라 얼굴을 환하게 보이게 했다.","exfr":"J'ai appliqué un correcteur clair sur la zone triangulaire sous l'œil pour illuminer le visage.","fr":"zone triangulaire (sous l'œil)","frpos":"n.f.","frdef":"Zone triangulaire entre coin externe de l'œil et pommette où l'on pose fard ou correcteur."},{"id":"BT0800","k":"h","cat":"eye","w":"새틴","rom":"saetin","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"satin 차용","memofr":"Emprunt à l'anglais satin","note":"Voir l'échelle des finis : mat, satiné, lumineux.","mean":"매트와 글로우의 중간쯤인 은은한 윤기의 마무리.","ex":"새틴 마무리라 너무 반짝이지 않고 은은하다.","exfr":"Fini satiné : subtil, sans trop briller.","fr":"satiné","frpos":"adj.","frdef":"Fini satiné, légèrement lumineux."},{"id":"BT0801","k":"h","cat":"eye","w":"세럼카라","rom":"sereomkara","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(절단어)","memo":"serum+(마스)카라 축약","memofr":"Troncation : 세럼 (angl. serum) + (마스)카라 (mascara)","note":"Produit hybride maquillage-soin.","mean":"「세럼 마스카라」의 줄임말. 속눈썹 관리 성분이 든 마스카라.","ex":"세럼카라라서 바르는 동안 속눈썹 관리까지 된다.","exfr":"C'est un mascara-sérum : il soigne les cils pendant qu'on l'applique.","fr":"mascara-sérum","frpos":"n.m.","frdef":"Abréviation: mascara contenant un soin pour les cils.","par":"결카라","rel":"관련어(참고)"},{"id":"BT0802","k":"h","cat":"eye","w":"속눈썹 셀프펌","rom":"songnunsseop selpeupeom","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"속눈썹+self+perm","memofr":"Composé : 속눈썹 (cils) + 셀프 (angl. self) + 펌 (angl. perm)","note":"Pratique répandue en Corée ; les marques recommandent la prudence près des yeux.","mean":"키트를 사서 집에서 직접 하는 속눈썹 펌.","ex":"속눈썹 셀프펌을 해 봤는데 미용실에서 한 것만큼 컬이 오래간다.","exfr":"J'ai fait une permanente des cils maison, et la courbure tient aussi longtemps qu'en institut.","fr":"permanente des cils maison","frpos":"n.f.","frdef":"Rehaussement de cils fait soi-même avec un kit."},{"id":"BT0807","k":"h","cat":"eye","w":"속눈썹 영양제","rom":"songnunsseop yeongyangje","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"속눈썹+영양제","memofr":"Locution : 속눈썹 (cils) + 영양제 (fortifiant)","note":"Synonyme plus courant de 래쉬 앰플.","mean":"속눈썹에 영양을 주어 덜 빠지고 튼튼하게 하는 관리 제품.","ex":"속눈썹 영양제를 꾸준히 발랐더니 덜 빠진다.","exfr":"En appliquant régulièrement un sérum fortifiant pour cils, je perds moins de cils.","fr":"sérum fortifiant pour cils","frpos":"n.m.","frdef":"Soin nourrissant pour cils."},{"id":"BT0808","k":"h","cat":"eye","w":"속눈썹펌 키트","rom":"songnunsseoppeom kiteu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"속눈썹펌+키트(kit)","memofr":"Locution : 속눈썹펌 (permanente des cils) + 키트 (angl. kit)","note":"Voir 속눈썹 셀프펌.","mean":"집에서 속눈썹 펌을 할 수 있게 약제와 도구를 묶은 제품.","ex":"속눈썹펌 키트로 미용실에 가지 않고 펌을 했다.","exfr":"J'ai fait un rehaussement de cils avec un kit, sans aller en institut.","fr":"kit de rehaussement de cils","frpos":"n.m.","frdef":"Kit pour faire une permanente des cils à domicile."},{"id":"BT0809","k":"h","cat":"eye","w":"속쌍","rom":"sokssang","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(절단어)","memo":"속쌍꺼풀에서 「꺼풀」을 잘라 냄","memofr":"Troncation : 속쌍(꺼풀) (pli de paupière intérieur)","note":"Fait partie de la typologie coréenne des paupières.","mean":"「속쌍꺼풀」의 줄임말. 눈을 뜨면 잘 보이지 않는 안쪽 쌍꺼풀.","ex":"속쌍이라 아이라인을 두껍게 그리면 눈을 뜰 때 다 가려진다.","exfr":"Mon pli de paupière est caché : un eye-liner épais disparaît complètement quand j'ouvre les yeux.","fr":"pli de paupière caché (in-fold)","frpos":"n.m.","frdef":"Abréviation de « 속쌍꺼풀 »: pli palpébral discret, visible seulement à l'intérieur.","par":"쌍꺼풀 라인","rel":"관련어(참고)"},{"id":"BT0810","k":"h","cat":"eye","w":"속쌍라이너","rom":"sokssangnaineo","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"속쌍+라이너(liner)","memofr":"Composé : 속쌍 (paupière à pli caché) + 라이너 (angl. liner)","note":"Produit pensé pour la morphologie des yeux est-asiatiques.","mean":"속쌍꺼풀 눈에 맞게 얇게 그려지는 아이라이너.","ex":"속쌍라이너는 얇게 그려져서 눈을 떠도 번지지 않는다.","exfr":"Cet eye-liner pour paupière à pli caché trace un trait fin qui ne file pas, même les yeux ouverts.","fr":"eye-liner pour paupière à pli caché","frpos":"n.m.","frdef":"Eye-liner fin adapté aux paupières à pli intérieur.","par":"쌍꺼풀 라인","rel":"관련어(참고)"},{"id":"BT0811","k":"h","cat":"eye","w":"슈퍼프루프","rom":"syupeopeurupeu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"super+proof","memofr":"Composé : 슈퍼 (angl. super) + 프루프 (angl. proof)","note":"Faux anglicisme ; plus fort que « waterproof » dans la publicité.","mean":"물·땀·피지·마찰에 매우 강하다는 뜻의 제품 표시(워터프루프보다 강조).","ex":"슈퍼프루프 마스카라라 땀을 흘려도 번지지 않았다.","exfr":"C'est un mascara super-résistant : il n'a pas coulé malgré la transpiration.","fr":"super-résistant (superproof)","frpos":"adj.","frdef":"Mention d'un produit qui résiste à l'eau, au sébum et aux frottements."},{"id":"BT0814","k":"h","cat":"eye","w":"스키니컬링","rom":"seukinikeolling","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"skinny+curling","memofr":"Composé : 스키니 (angl. skinny) + 컬링 (angl. curling)","note":"Nom de catégorie de mascara.","mean":"가는 브러시로 속눈썹을 한 가닥씩 올려 주는 마스카라.","ex":"스키니컬링 마스카라라 짧은 속눈썹도 하나하나 잘 올라간다.","exfr":"Ce mascara fin recourbant relève un à un même les cils courts.","fr":"mascara fin recourbant","frpos":"n.m.","frdef":"Mascara fin qui recourbe chaque cil séparément.","par":"컬링","rel":"관련어(참고)"},{"id":"BT0817","k":"h","cat":"eye","w":"쌍꺼풀 라인","rom":"ssangkkeopul rain","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"쌍꺼풀+라인(line)","memofr":"Locution : 쌍꺼풀 (double paupière) + 라인 (angl. line)","note":"Repère essentiel du maquillage coréen des yeux.","mean":"쌍꺼풀의 접히는 선.","ex":"쌍꺼풀 라인 위까지 섀도를 올리면 눈을 떴을 때 색이 보인다.","exfr":"En montant le fard au-dessus de la ligne du pli de paupière, la couleur reste visible les yeux ouverts.","fr":"ligne du pli de paupière","frpos":"n.f.","frdef":"Ligne du pli palpébral (double paupière)."},{"id":"BT0818","k":"h","cat":"eye","w":"아이 쉐이드 프라이머","rom":"ai sweideu peuraimeo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"eye shade+primer (표준 표기: 셰이드)","memofr":"Locution : 아이 쉐이드 (angl. eye shade) + 프라이머 (angl. primer)","note":"Graphie courante 쉐이드 ; la norme officielle écrit 셰이드.","mean":"아이섀도 전에 발라 발색과 지속력을 높이는 바탕 제품.","ex":"아이 쉐이드 프라이머를 먼저 바르니 섀도 발색이 선명해졌다.","exfr":"Avec une base pour fard à paupières, la couleur du fard est plus intense.","fr":"base pour fard à paupières","frpos":"n.f.","frdef":"Base qui fixe et intensifie le fard."},{"id":"BT0819","k":"h","cat":"eye","w":"아이 프라이머 밤","rom":"ai peuraimeo bam","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"eye+primer+balm","memofr":"Locution : 아이 (angl. eye) + 프라이머 (angl. primer) + 밤 (angl. balm)","note":"Variante de texture de la base paupières.","mean":"밤 제형의 눈두덩용 바탕 제품.","ex":"아이 프라이머 밤을 바르면 섀도가 주름에 끼지 않는다.","exfr":"Avec une base paupières en baume, le fard ne se loge pas dans les plis.","fr":"base paupières en baume","frpos":"n.f.","frdef":"Base en baume pour les paupières."},{"id":"BT0820","k":"h","cat":"eye","w":"아이라인","rom":"airain","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"eye+line(한국식 축약 사용) / 원어에서 통째로 들어온 외래어라 단일어로 봄","memofr":"Emprunt à l'anglais eye line ; traité comme mot simple","note":"En coréen, désigne à la fois le trait et, par métonymie, le produit (아이라이너).","mean":"눈가에 그리는 선 또는 그 제품(아이라이너).","ex":"아이라인을 속눈썹 사이에 채우듯 그리면 자연스럽다.","exfr":"Tracer l'eye-liner comme pour remplir l'espace entre les cils donne un effet naturel.","fr":"eye-liner (trait et produit)","frpos":"n.m.","frdef":"Désigne à la fois le trait tracé et le produit (아이라이너)."},{"id":"BT0821","k":"h","cat":"eye","w":"아이라인 꼬리","rom":"airain kkori","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"아이라인+꼬리","memofr":"Locution : 아이라인 (eye-liner) + 꼬리 (queue)","note":"Voir 눈꼬리 빼기.","mean":"아이라인의 바깥쪽 끝부분.","ex":"아이라인 꼬리를 살짝 올리니 눈매가 또렷해졌다.","exfr":"En relevant légèrement la queue de l'eye-liner, le regard est plus net.","fr":"queue de l'eye-liner","frpos":"n.f.","frdef":"Extrémité externe du trait d'eye-liner.","par":"아이라인","rel":"관련어(참고)"},{"id":"BT0824","k":"h","cat":"eye","w":"앞트임","rom":"apteuim","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"앞+트임","memofr":"Composé : 앞 (avant) + 트임 (ouverture)","note":"Terme ambigu : maquillage ou chirurgie (canthoplastie interne).","mean":"눈 앞머리 쪽을 길어 보이게 하는 화장(또는 시술).","ex":"앞트임 라인을 그리면 눈 사이가 가까워 보인다.","exfr":"Un trait pour l'ouverture du coin interne de l'œil rapproche visuellement les yeux.","fr":"ouverture du coin interne de l'œil","frpos":"n.f.","frdef":"Maquillage (ou chirurgie) qui allonge visuellement le coin interne de l'œil.","par":"뒷트임","rel":"관련어(참고)"},{"id":"BT0825","k":"h","cat":"eye","w":"애교살","rom":"aegyosal","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"애교(한자어)+살(고유어)","memofr":"Composé : 애교 (charme mignon) + 살 (chair)","note":"Trait esthétique très valorisé en Corée, presque inconnu en France ; on garde souvent le mot coréen.","mean":"눈 아래 볼록한 부분을 강조하는 화장 부위","ex":"애교살을 밝게 표현하니 웃을 때 인상이 부드러워 보인다.","exfr":"En éclairant l'« aegyo sal », le visage paraît plus doux quand on sourit.","fr":"« aegyo sal » (bourrelet sous l’œil)","frpos":"n.m.","frdef":"Petit bourrelet sous l’œil, jugé charmant en Corée et mis en valeur par le maquillage ; à ne pas confondre avec les poches (cernes)."},{"id":"BT0826","k":"h","cat":"eye","w":"애교살 메이커","rom":"aegyosal meikeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"애교살+메이커(maker)","memofr":"Locution : 애교살 (« aegyo sal ») + 메이커 (angl. maker)","note":"Produit propre au marché coréen.","mean":"애교살을 그리거나 강조하는 펜슬·섀도 제품.","ex":"애교살 메이커로 눈 밑 음영을 쉽게 그렸다.","exfr":"J'ai facilement dessiné l'ombre sous l'œil avec un crayon pour « aegyo sal ».","fr":"crayon pour « aegyo sal »","frpos":"n.m.","frdef":"Produit (crayon, fard) qui dessine l'애교살.","par":"애교살","rel":"관련어(참고)"},{"id":"BT0827","k":"h","cat":"eye","w":"언더라인","rom":"eondeorain","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"under+line","memofr":"Composé : 언더 (angl. under) + 라인 (angl. line)","note":"Faux anglicisme courant.","mean":"눈 아래쪽에 그리는 라인.","ex":"언더라인은 갈색 섀도로 연하게 그린다.","exfr":"Je trace la ligne inférieure de l'œil légèrement, avec un fard marron.","fr":"ligne inférieure de l'œil","frpos":"n.f.","frdef":"Trait ou fard appliqué sous l'œil.","par":"아이라인","rel":"관련어(참고)"},{"id":"BT0828","k":"h","cat":"eye","w":"언더래쉬","rom":"eondeoraeswi","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"under+lash","memofr":"Composé : 언더 (angl. under) + 래쉬 (angl. lash)","note":"Mot surtout utilisé dans les tutoriels.","mean":"아래 속눈썹.","ex":"언더래쉬까지 마스카라를 바르니 눈이 커 보인다.","exfr":"En appliquant le mascara jusque sur les cils inférieurs, les yeux paraissent plus grands.","fr":"cils inférieurs","frpos":"n.m.pl.","frdef":"Cils du bas."},{"id":"BT0829","k":"h","cat":"eye","w":"영롱하다","rom":"yeongnonghada","pos":"형용사","unit":"단어","eo":"한자어","form":"파생어","memo":"영롱(어근)+-하다(접미사)","memofr":"Dérivé : 영롱 (racine « limpide et brillant ») + -하다 (suffixe adjectival)","note":"Mot littéraire, très employé dans les avis sur les fards nacrés.","mean":"펄이나 광이 맑고 반짝이게 빛나다.","ex":"펄이 영롱하게 빛나서 조명 아래에서 특히 예쁘다.","exfr":"La nacre scintille de reflets chatoyants, c'est particulièrement joli sous les lumières.","fr":"scintillant, chatoyant","frpos":"adj.","frdef":"Éclat clair et miroitant (fards nacrés)."},{"id":"BT0830","k":"h","cat":"eye","w":"왕펄","rom":"wangpeol","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"왕-(접두사: 매우 큰)+펄(pearl)","memofr":"Dérivé : 왕- (préfixe « très grand ») + 펄 (angl. pearl)","note":"Le préfixe 왕- (« roi ») est très productif en coréen familier.","mean":"입자가 큰 펄.","ex":"왕펄이 섞여 있어 파티 메이크업에 잘 어울린다.","exfr":"Il contient de grosses paillettes, idéal pour un maquillage de soirée.","fr":"grosse paillette","frpos":"n.f.","frdef":"Particules nacrées de grande taille.","par":"펄이 날리다","rel":"관련어(참고)"},{"id":"BT0831","k":"h","cat":"eye","w":"워셔블","rom":"wosyeobeul","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"washable 차용","memofr":"Emprunt à l'anglais washable","note":"Désigne les mascaras « tubing » qui s'enlèvent à l'eau tiède.","mean":"미온수로 지워지는 마스카라(필름형).","ex":"워셔블 마스카라라 미온수로 쉽게 지워진다.","exfr":"C'est un mascara lavable qui part facilement à l'eau tiède.","fr":"lavable à l'eau tiède (washable)","frpos":"loc.adj.","frdef":"Mascara qui s'enlève à l'eau tiède (formule « tubing »)."},{"id":"BT0832","k":"h","cat":"eye","w":"음영","rom":"eumyeong","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"음+영","memofr":"Composé : 음 (ombre, yin) + 영 (ombre, reflet)","note":"Terme courant du maquillage coréen ; il équivaut à « ombrer » ou « sculpter ».","mean":"명암을 넣어 눈의 입체감을 만드는 효과","ex":"음영을 넣으니 눈매가 깊어 보인다.","exfr":"Avec un peu d'ombrage, le regard paraît plus profond.","fr":"ombrage","frpos":"n.m.","frdef":"Ombres apportées pour donner de la profondeur aux yeux (maquillage en dégradé coréen)."},{"id":"BT0833","k":"h","cat":"eye","w":"음영 창조 라이너","rom":"eumyeong changjo raineo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"음영+창조+라이너(liner)","memofr":"Locution : 음영 (ombrage) + 창조 (création) + 라이너 (angl. liner)","note":"Formule publicitaire d'une marque, devenue descriptive.","mean":"눈 밑·눈두덩에 그림자를 그려 입체감을 주는 펜슬형 제품.","ex":"음영 창조 라이너로 눈 밑 그림자를 자연스럽게 그렸다.","exfr":"J'ai dessiné naturellement l'ombre sous l'œil avec un liner pour ombrer.","fr":"liner pour ombrer","frpos":"n.m.","frdef":"Crayon qui crée des ombres et de la profondeur.","par":"음영","rel":"관련어(참고)"},{"id":"BT0835","k":"h","cat":"eye","w":"점막 채우기","rom":"jeommak chaeugi","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"점막+채우기(채우다+-기)","memofr":"Locution : 점막 (muqueuse) + 채우기 (fait de remplir)","note":"Technique délicate ; les avis rappellent les règles d'hygiène.","mean":"속눈썹 사이 점막을 아이라이너로 메우는 것.","ex":"점막 채우기를 하니 아이라인을 그리지 않은 듯 눈매가 또렷해졌다.","exfr":"Avec le tightlining, le regard est plus net sans que l'on voie de trait.","fr":"tightlining (remplir la muqueuse)","frpos":"n.m.","frdef":"Tracer l'eye-liner sur la muqueuse, entre les cils, pour densifier le regard.","par":"아이라인","rel":"관련어(참고)"},{"id":"BT0839","k":"h","cat":"eye","w":"철벽","rom":"cheolbyeok","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"철+벽","memofr":"Composé : 철 (fer) + 벽 (mur)","note":"Mot courant (« défense de fer ») employé par image pour la tenue du maquillage.","mean":"쉽게 무너지지 않는다는 강한 지속력 비유","ex":"철벽 아이라이너라 하루 종일 번지지 않았다.","exfr":"C'est un eye-liner à la tenue béton : il n'a pas coulé de la journée.","fr":"tenue béton (« muraille de fer »)","frpos":"n.f.","frdef":"Métaphore d'une tenue à toute épreuve."},{"id":"BT0841","k":"h","cat":"eye","w":"컬 픽스","rom":"keol pikseu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"curl+fix","memofr":"Locution : 컬 (angl. curl) + 픽스 (angl. fix)","note":"Allégation des mascaras pour cils raides.","mean":"속눈썹 컬을 오래 고정하는 효과, 또는 그런 제품.","ex":"컬 픽스 마스카라라 뷰러로 올린 컬이 오래간다.","exfr":"Avec ce mascara à fixation de la courbure, l'effet du recourbe-cils dure longtemps.","fr":"fixation de la courbure","frpos":"n.f.","frdef":"Produit ou effet qui fixe la courbure des cils.","par":"컬링","rel":"관련어(참고)"},{"id":"BT0842","k":"h","cat":"eye","w":"컬링","rom":"keolling","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"curling 차용","memofr":"Emprunt à l'anglais curling","note":"Ne s'emploie que pour les cils (et les cheveux), pas comme sport.","mean":"속눈썹을 위로 휘어 보이게 하는 효과","ex":"뷰러로 컬링을 한 뒤 마스카라로 고정했다.","exfr":"Après avoir recourbé les cils au recourbe-cils, je les ai fixés au mascara.","fr":"recourbement (des cils)","frpos":"n.m.","frdef":"Effet de courbure des cils vers le haut."},{"id":"BT0843","k":"h","cat":"eye","w":"트임 라이너","rom":"teuim raineo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"트임+라이너(liner)","memofr":"Locution : 트임 (ouverture) + 라이너 (angl. liner)","note":"Formule marketing.","mean":"눈 앞머리·눈꼬리를 길어 보이게 그리는 데 쓰는 아이라이너(트임 효과).","ex":"트임 라이너로 눈꼬리를 길게 빼 줬다.","exfr":"J'ai étiré le coin externe de l'œil avec un eye-liner « ouverture du regard ».","fr":"eye-liner « ouverture du regard »","frpos":"n.m.","frdef":"Eye-liner pour allonger visuellement les coins de l'œil (effet 트임).","par":"뒷트임","rel":"관련어(참고)"},{"id":"BT0844","k":"h","cat":"eye","w":"틴팅","rom":"tinting","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"tinting 차용","memofr":"Emprunt à l'anglais tinting","note":"Prestation de salon courante en Corée.","mean":"속눈썹·눈썹·입술 등에 색을 오래 물들이는 것.","ex":"틴팅 세럼이라 바를수록 속눈썹 색이 진해진다.","exfr":"C'est un sérum de teinture semi-permanente : plus on l'applique, plus les cils foncent.","fr":"teinture semi-permanente (cils, sourcils, lèvres)","frpos":"n.f.","frdef":"Coloration qui teinte durablement."},{"id":"BT0845","k":"h","cat":"eye","w":"팬더눈","rom":"paendeonun","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"팬더(panda)+눈","memofr":"Composé : 팬더 (angl. panda) + 눈 (yeux)","note":"Expression humoristique ; elle existe aussi en français (« yeux de panda »).","mean":"마스카라·아이라인이 번져 눈 밑이 검게 되는 현상.","ex":"마스카라가 번져 오후에는 팬더눈이 되어 버렸다.","exfr":"Mon mascara a coulé et l'après-midi, j'avais des yeux de panda.","fr":"yeux de panda","frpos":"n.m.pl.","frdef":"Mascara ou eye-liner qui bave et noircit le dessous des yeux."},{"id":"BT0847","k":"h","cat":"eye","w":"펄이 날리다","rom":"peori nallida","pos":"동사","unit":"구","eo":"혼종어","form":"구","memo":"펄(pearl)이+날리다 / 명사형: 펄날림","memofr":"Locution : 펄이 (la nacre) + 날리다 (s'envoler)","note":"Nom : 펄날림 ; défaut cité dans les avis.","mean":"펄 입자가 볼 등에 떨어지다.","ex":"섀도를 바르고 나니 볼까지 펄이 날렸다.","exfr":"Après avoir mis le fard, les nacres ont fait des retombées jusque sur mes joues.","fr":"faire des retombées (nacres)","frpos":"loc.v.","frdef":"Particules nacrées qui tombent sur les joues."},{"id":"BT0849","k":"h","cat":"eye","w":"펜슬라이너","rom":"penseullaineo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"pencil+liner","memofr":"Composé : 펜슬 (angl. pencil) + 라이너 (angl. liner)","note":"S'oppose aux liners liquides et en gel.","mean":"연필 형태의 아이라이너.","ex":"펜슬라이너라 초보자도 그리기 쉽다.","exfr":"C'est un crayon eye-liner, facile à tracer même pour une débutante.","fr":"crayon eye-liner","frpos":"n.m.","frdef":"Eye-liner en crayon."},{"id":"BT0850","k":"h","cat":"eye","w":"포인트 섀도우","rom":"pointeu syaedou","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"point+shadow (표준 표기: 섀도)","memofr":"Locution : 포인트 (angl. point) + 섀도우 (angl. shadow)","note":"Voir 포인트 메이크업.","mean":"특정 부위에 강조용으로 바르는 진한 섀도.","ex":"포인트 섀도우를 눈꼬리에만 올려 깊이를 줬다.","exfr":"J'ai posé un fard d'accent seulement au coin externe pour donner de la profondeur.","fr":"fard d'accent","frpos":"n.m.","frdef":"Fard plus intense posé sur une zone précise de l'œil."},{"id":"BT0853","k":"h","cat":"eye","w":"픽싱카라","rom":"piksingkara","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(절단어)","memo":"fixing+(마스)카라 축약","memofr":"Troncation : 픽싱 (angl. fixing) + (마스)카라 (mascara)","note":"Argot de maquillage.","mean":"「픽싱 마스카라」의 줄임말. 속눈썹이나 눈썹의 결·컬을 고정하는 제품.","ex":"픽싱카라로 눈썹 결을 고정했다.","exfr":"J'ai fixé la direction des poils de sourcils avec un mascara fixateur.","fr":"mascara fixateur","frpos":"n.m.","frdef":"Abréviation de « 픽싱 마스카라 » : mascara transparent qui fixe les cils ou les sourcils.","par":"결카라","rel":"관련어(참고)"},{"id":"BT0854","k":"s","cat":"eye","w":"한올","rom":"hanol","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"한(관형사)+올","memofr":"Composé : 한 (un) + 올 (brin)","note":"Souvent redoublé : 한올한올.","mean":"속눈썹이 한 올씩 갈라져 보이는 효과.","ex":"한올 마스카라라 속눈썹이 한 가닥씩 살아난다.","exfr":"Ce mascara sublime les cils, cil par cil.","fr":"cil par cil","frpos":"loc.adv.","frdef":"Effet de cils séparés un par un.","par":"한올한올","rel":"변이형"},{"id":"BT0855","k":"h","cat":"eye","w":"한올한올","rom":"hanolhanol","pos":"부사","unit":"단어","eo":"고유어","form":"합성어","memo":"한올 반복 — 첩어(반복 합성어)","memofr":"Mot composé redoublé : 한올 (un brin) × 2","note":"Redoublement expressif.","mean":"속눈썹·눈썹을 한 가닥씩 섬세하게.","ex":"속눈썹을 한올한올 빗어 주니 뭉침 없이 정리됐다.","exfr":"En peignant les cils cil après cil, ils sont restés bien séparés, sans paquets.","fr":"cil après cil","frpos":"loc.adv.","frdef":"Application minutieuse poil par poil (cils, sourcils)."},{"id":"BT0856","k":"h","cat":"eye","w":"힛팬템","rom":"hitpaentem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"힛팬(hit pan)+-템","memofr":"Composé : 힛팬 (angl. hit pan) + -템 (de l'angl. item)","note":"Argot venu des communautés beauté anglophones.","mean":"바닥이 드러날 정도로 자주 사용한 제품을 뜻하는 뷰티 은어","ex":"이 블러셔는 바닥이 보일 만큼 쓴 힛팬템이다.","exfr":"Ce blush est un produit dont on voit le fond, tellement je l'ai utilisé.","fr":"produit dont on voit le fond (hit pan)","frpos":"n.m.","frdef":"Produit utilisé au point de voir le fond du godet, signe d'amour.","par":"인생템","rel":"관련어(참고)"},{"id":"BT0859","k":"h","cat":"lip","w":"고발색","rom":"gobalsaek","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"고-+발색","memofr":"Dérivé : 고- (préfixe « haut ») + 발색 (rendu couleur)","note":"Critère d'évaluation des rouges à lèvres et des fards.","mean":"색이 진하고 선명하게 나타남.","ex":"고발색 틴트라 한 번만 발라도 색이 진하게 나온다.","exfr":"C'est un tint à haute pigmentation : une seule couche suffit pour une couleur intense.","fr":"haute pigmentation","frpos":"n.f.","frdef":"Couleur très intense dès la première application.","par":"발색","rel":"관련어(참고)"},{"id":"BT0861","k":"h","cat":"lip","w":"그라데이션립","rom":"geuradeisyeollip","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"gradation+lip","memofr":"Composé : 그라데이션 (angl. gradation) + 립 (angl. lip)","note":"Maquillage emblématique de la Corée, rendu célèbre par les dramas.","mean":"입술 안쪽은 진하고 바깥으로 갈수록 옅게 바르는 립 메이크업.","ex":"그라데이션립을 하려고 틴트를 입술 안쪽에만 발랐다.","exfr":"Pour faire des lèvres dégradées, j'ai appliqué le tint uniquement à l'intérieur des lèvres.","fr":"lèvres dégradées (gradient lips)","frpos":"n.f.pl.","frdef":"Maquillage coréen: couleur intense au centre, estompée vers les bords."},{"id":"BT0862","k":"h","cat":"lip","w":"글로시립","rom":"geullosirip","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"glossy+lip","memofr":"Composé : 글로시 (angl. glossy) + 립 (angl. lip)","note":"Fini des lèvres ; il s'oppose à 매트립.","mean":"광택이 많이 도는 입술 표현.","ex":"글로시립을 연출하려고 틴트 위에 글로스를 덧발랐다.","exfr":"Pour des lèvres brillantes, j'ai superposé un gloss sur le tint.","fr":"lèvres brillantes","frpos":"n.f.pl.","frdef":"Fini lèvres très brillant.","par":"블러립","rel":"관련어(참고)"},{"id":"BT0863","k":"h","cat":"lip","w":"글로우틴트","rom":"geulloutinteu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"glow+tint","memofr":"Composé : 글로우 (angl. glow) + 틴트 (angl. tint)","note":"Catégorie de tint ; elle s'oppose aux tints veloutés.","mean":"윤기 있는 마무리를 강조한 틴트","ex":"글로우틴트라 입술이 촉촉하게 빛난다.","exfr":"C'est un tint lumineux : les lèvres brillent d'un éclat hydraté.","fr":"tint lumineux","frpos":"n.m.","frdef":"Tint à fini brillant.","par":"틴트","rel":"하위어(참고)"},{"id":"BT0866","k":"s","cat":"lip","w":"당김","rom":"danggim","pos":"명사","unit":"단어","eo":"고유어","form":"파생어","memo":"당기다+-ㅁ","memofr":"Dérivé : 당기다 (tirer) + -ㅁ (nominalisateur)","note":"Défaut fréquent des rouges à lèvres mats.","mean":"립 제품을 바른 뒤 입술이 건조하게 당기는 느낌.","ex":"매트 틴트를 바르고 한 시간쯤 지나니 입술에 당김이 느껴졌다.","exfr":"Environ une heure après avoir mis un tint mat, j'ai senti mes lèvres tirailler.","fr":"tiraillement (lèvres)","frpos":"n.m.","frdef":"Sensation de lèvres tendues et sèches après un tint mat.","par":"당기다","rel":"변이형"},{"id":"BT0867","k":"h","cat":"lip","w":"도톰하다","rom":"dotomhada","pos":"형용사","unit":"단어","eo":"고유어","form":"파생어","memo":"도톰(어근)+-하다 / 명사형: 도톰함","memofr":"Dérivé : 도톰 (racine « charnu ») + -하다 (suffixe adjectival)","note":"Valorisant pour les lèvres comme pour 애교살.","mean":"입술이 통통하고 볼륨 있어 보이다.","ex":"립라이너로 윤곽을 살짝 넓히니 입술이 도톰해 보였다.","exfr":"En élargissant légèrement le contour au crayon, mes lèvres paraissaient plus pulpeuses.","fr":"pulpeux (lèvres)","frpos":"adj.","frdef":"Lèvres pleines et rebondies."},{"id":"BT0869","k":"s","cat":"lip","w":"립그라데이션","rom":"ripgeuradeisyeon","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+gradation","memofr":"Composé : 립 (angl. lip) + 그라데이션 (angl. gradation)","note":"Variante de 그라데이션립.","mean":"입술 안쪽에서 바깥쪽으로 색을 옅게 만드는 표현","ex":"립그라데이션은 손가락으로 경계를 두드려 펴 주면 자연스럽다.","exfr":"Pour un dégradé de lèvres naturel, on estompe la démarcation en tapotant du doigt.","fr":"dégradé de lèvres","frpos":"n.m.","frdef":"Technique d'application en dégradé du centre vers l'extérieur.","par":"그라데이션립","rel":"변이형"},{"id":"BT0873","k":"h","cat":"lip","w":"립라인따다","rom":"rimnainttada","pos":"동사","unit":"단어","eo":"혼종어","form":"합성어","memo":"립라인(lip line)+따다","memofr":"Composé : 립라인 (angl. lip line) + 따다 (tracer)","note":"Ici 따다 a un sens technique : « suivre un contour ».","mean":"입술 윤곽선을 따라 그리다.","ex":"립라인을 따고 안쪽을 채우니 입술 모양이 또렷해졌다.","exfr":"En dessinant le contour puis en remplissant l'intérieur, la forme des lèvres est plus nette.","fr":"dessiner le contour des lèvres","frpos":"loc.v.","frdef":"Tracer le contour des lèvres au crayon ou au pinceau.","par":"오버립","rel":"관련어(참고)"},{"id":"BT0874","k":"h","cat":"lip","w":"립라커","rom":"rimnakeo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+lacquer","memofr":"Composé : 립 (angl. lip) + 라커 (angl. lacquer)","note":"Nom de catégorie inspiré du vernis.","mean":"선명한 발색과 광택을 강조하는 립 제품","ex":"립라커는 광택이 강해서 한 번만 발라도 존재감이 있다.","exfr":"La laque à lèvres est très brillante : une seule couche suffit à faire de l'effet.","fr":"laque à lèvres","frpos":"n.f.","frdef":"Rouge liquide très brillant et pigmenté."},{"id":"BT0876","k":"h","cat":"lip","w":"립무스","rom":"rimmuseu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+mousse","memofr":"Composé : 립 (angl. lip) + 무스 (fr. mousse)","note":"Le mot 무스 vient en fait du français.","mean":"무스처럼 부드러운 질감의 립 제품","ex":"립무스는 가볍게 발리고 보송하게 마무리된다.","exfr":"La mousse à lèvres s'applique légèrement et sèche en fini velouté.","fr":"mousse à lèvres","frpos":"n.f.","frdef":"Rouge à texture mousse aérienne."},{"id":"BT0878","k":"h","cat":"lip","w":"립베이스","rom":"ripbeiseu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+base","memofr":"Composé : 립 (angl. lip) + 베이스 (angl. base)","note":"Étape de préparation des lèvres.","mean":"립 메이크업 전에 바르는 바탕 제품.","ex":"틴트를 바르기 전에 립베이스를 먼저 바른다.","exfr":"J'applique une base lèvres avant le tint.","fr":"base lèvres","frpos":"n.f.","frdef":"Base appliquée avant le rouge pour lisser et fixer."},{"id":"BT0880","k":"h","cat":"lip","w":"립세럼","rom":"ripsereom","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+serum","memofr":"Composé : 립 (angl. lip) + 세럼 (angl. serum)","note":"Soin, et non produit de maquillage.","mean":"입술 전용 고농축 관리 제품.","ex":"자기 전에 립세럼을 듬뿍 바르면 아침까지 촉촉하다.","exfr":"Avec une généreuse couche de sérum lèvres avant de dormir, elles restent hydratées jusqu'au matin.","fr":"sérum lèvres","frpos":"n.m.","frdef":"Soin concentré pour les lèvres."},{"id":"BT0882","k":"h","cat":"lip","w":"립스테인","rom":"ripseutein","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+stain","memofr":"Composé : 립 (angl. lip) + 스테인 (angl. stain)","note":"Proche du tint coréen.","mean":"입술에 색을 물들이는 유형의 제품","ex":"립스테인이라 음식을 먹어도 색이 오래 남는다.","exfr":"C'est un lip stain : la couleur tient longtemps même en mangeant.","fr":"lip stain (teinture pour les lèvres)","frpos":"n.m.","frdef":"Produit qui teinte les lèvres durablement."},{"id":"BT0884","k":"h","cat":"lip","w":"립스패출러","rom":"ripseupaechulleo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+spatula","memofr":"Composé : 립 (angl. lip) + 스패출러 (angl. spatula)","note":"Accessoire hygiénique pour les pots.","mean":"립 제품을 덜거나 펴 바르는 도구","ex":"립밤은 위생을 위해 립스패출러로 덜어 쓴다.","exfr":"Par hygiène, je prélève le baume à lèvres avec une spatule.","fr":"spatule à lèvres","frpos":"n.f.","frdef":"Petite spatule pour prélever et appliquer un baume ou rouge."},{"id":"BT0885","k":"h","cat":"lip","w":"립실러","rom":"ripsilleo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+sealer","memofr":"Composé : 립 (angl. lip) + 실러 (angl. sealer)","note":"Nom de produit propre à certaines marques.","mean":"입술색을 보정하거나 입술 윤곽을 정리하는 제품","ex":"입술 색이 진해서 립실러로 먼저 톤을 눌러 준다.","exfr":"Mes lèvres sont très pigmentées, alors j'atténue d'abord leur couleur avec un lip sealer.","fr":"lip sealer (correcteur-fixateur lèvres)","frpos":"n.m.","frdef":"Produit qui neutralise la couleur des lèvres ou fixe le rouge."},{"id":"BT0886","k":"h","cat":"lip","w":"립앤치크","rom":"ribaenchikeu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+and+cheek","memofr":"Composé : 립 (angl. lip) + 앤 (angl. and) + 치크 (angl. cheek)","note":"Produit polyvalent, souvent un tint.","mean":"입술과 볼에 함께 사용하는 색조 제품","ex":"립앤치크 틴트 하나로 입술과 볼을 함께 물들였다.","exfr":"Avec un seul tint lèvres et joues, j'ai coloré à la fois les lèvres et les joues.","fr":"tint lèvres et joues","frpos":"n.m.","frdef":"Produit couleur utilisable sur les lèvres et les joues."},{"id":"BT0887","k":"h","cat":"lip","w":"립오버드로잉","rom":"ribobeodeuroing","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+overdrawing","memofr":"Composé : 립 (angl. lip) + 오버드로잉 (angl. overdrawing)","note":"Synonyme de 오버립.","mean":"원래 입술선 바깥으로 윤곽을 그리는 기법","ex":"립오버드로잉으로 입술선보다 살짝 크게 그렸다.","exfr":"En overlining, j'ai dessiné les lèvres un peu au-delà de leur contour naturel.","fr":"overlining","frpos":"n.m.","frdef":"Dessiner le contour légèrement au-delà de la lèvre naturelle.","par":"오버립","rel":"관련어(참고)"},{"id":"BT0889","k":"h","cat":"lip","w":"립잉크","rom":"ribingkeu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+ink","memofr":"Composé : 립 (angl. lip) + 잉크 (angl. ink)","note":"Nom de catégorie marketing.","mean":"잉크처럼 선명하게 발색되는 립 제품 표현","ex":"립잉크라서 묻어남이 거의 없다.","exfr":"C'est une encre à lèvres : elle ne transfère presque pas.","fr":"encre à lèvres","frpos":"n.f.","frdef":"Tint liquide très pigmenté et longue tenue."},{"id":"BT0890","k":"h","cat":"lip","w":"립컨투어링","rom":"ripkeontueoring","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+contouring","memofr":"Composé : 립 (angl. lip) + 컨투어링 (angl. contouring)","note":"Technique venue du maquillage occidental.","mean":"입술 윤곽에 음영을 넣어 형태를 보정하는 기법","ex":"립컨투어링으로 입술 윤곽에 그림자를 넣어 입체감을 줬다.","exfr":"Par un contouring des lèvres, j'ai ombré leur contour pour leur donner du relief.","fr":"contouring des lèvres","frpos":"n.m.","frdef":"Ombrer le contour des lèvres pour en redessiner la forme et le volume.","par":"오버립","rel":"관련어(참고)"},{"id":"BT0892","k":"h","cat":"lip","w":"립코트","rom":"ripkoteu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+coat","memofr":"Composé : 립 (angl. lip) + 코트 (angl. coat)","note":"Sur le modèle du top coat des vernis.","mean":"입술 화장 위에 덧씌우는 마무리 제품","ex":"립코트를 위에 바르니 틴트가 컵에 묻어나지 않았다.","exfr":"Avec un top coat lèvres par-dessus, le tint n'a pas laissé de trace sur le verre.","fr":"top coat lèvres","frpos":"n.m.","frdef":"Couche finale appliquée sur le rouge pour fixer ou faire briller."},{"id":"BT0894","k":"h","cat":"lip","w":"립타투","rom":"riptatu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+tattoo","memofr":"Composé : 립 (angl. lip) + 타투 (angl. tattoo)","note":"Formule publicitaire ; ce n'est pas un tatouage.","mean":"입술에 색이 오래 남는다는 의미의 립 제품 표현","ex":"립타투는 바르고 떼어 내면 입술에 색이 남는다.","exfr":"Le « lip tattoo » s'applique, se pèle, et laisse la couleur sur les lèvres.","fr":"« lip tattoo » (tint très longue tenue)","frpos":"n.m.","frdef":"Tint qui teinte les lèvres comme un tatouage, souvent peel-off."},{"id":"BT0895","k":"h","cat":"lip","w":"립탑퍼","rom":"riptappeo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+topper","memofr":"Composé : 립 (angl. lip) + 탑퍼 (angl. topper)","note":"Anglicisme du discours des marques.","mean":"기존 립 메이크업 위에 얹는 제품","ex":"매트 립 위에 립탑퍼를 올려 광택을 더했다.","exfr":"J'ai ajouté de la brillance avec un top coat pour lèvres sur un rouge à lèvres mat.","fr":"top coat pour lèvres (topper)","frpos":"n.m.","frdef":"Gloss ou baume posé sur un rouge pour changer son fini."},{"id":"BT0896","k":"h","cat":"lip","w":"립틴팅밤","rom":"riptintingbam","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+tinting+balm","memofr":"Composé : 립 (angl. lip) + 틴팅 (angl. tinting) + 밤 (angl. balm)","note":"Produit hybride soin et couleur.","mean":"보습과 색 표현을 겸하는 밤 타입 립 제품","ex":"립틴팅밤 하나만 발라도 혈색이 살아난다.","exfr":"Un simple baume teinté pour lèvres suffit à leur redonner bonne mine.","fr":"baume teinté pour lèvres","frpos":"n.m.","frdef":"Baume qui hydrate et colore légèrement."},{"id":"BT0899","k":"h","cat":"lip","w":"립펜슬샤프너","rom":"rippenseulsyapeuneo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+pencil+sharpener","memofr":"Composé : 립 (angl. lip) + 펜슬 (angl. pencil) + 샤프너 (angl. sharpener)","note":"Accessoire.","mean":"립펜슬 심을 깎는 도구","ex":"립펜슬샤프너로 심을 뾰족하게 깎아 윤곽을 그렸다.","exfr":"J'ai taillé la mine en pointe avec un taille-crayon à lèvres pour dessiner le contour.","fr":"taille-crayon à lèvres","frpos":"n.m.","frdef":"Taille-crayon pour crayon à lèvres."},{"id":"BT0900","k":"h","cat":"lip","w":"립프라이머","rom":"rippeuraimeo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+primer","memofr":"Composé : 립 (angl. lip) + 프라이머 (angl. primer)","note":"Synonyme de 립베이스.","mean":"입술 결을 정돈하는 프라이머.","ex":"립프라이머를 바르면 입술 주름이 덜 도드라진다.","exfr":"Avec une base lèvres, les ridules des lèvres ressortent moins.","fr":"base lèvres (primer)","frpos":"n.f.","frdef":"Base qui lisse les lèvres avant le rouge."},{"id":"BT0902","k":"h","cat":"lip","w":"립픽서","rom":"rippikseo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"lip+fixer","memofr":"Composé : 립 (angl. lip) + 픽서 (angl. fixer)","note":"Lié au port du masque (problème du transfert).","mean":"립 메이크업이 묻어나지 않게 고정하는 제품.","ex":"립픽서를 덧발라 마스크에 묻어나지 않게 했다.","exfr":"J'ai superposé un fixateur pour que les lèvres ne déteignent pas sur le masque.","fr":"fixateur pour lèvres","frpos":"n.m.","frdef":"Produit qui fixe le rouge pour éviter le transfert."},{"id":"BT0904","k":"h","cat":"lip","w":"매트립","rom":"maeteurip","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"matte+lip","memofr":"Composé : 매트 (angl. matte) + 립 (angl. lip)","note":"Fini des lèvres ; il s'oppose à 글로시립.","mean":"광택 없는 입술 표현.","ex":"매트립은 각질이 부각되기 쉬워 입술 각질 정리가 먼저다.","exfr":"Les lèvres mates font vite ressortir les peaux mortes : il faut d'abord les exfolier.","fr":"lèvres mates","frpos":"n.f.pl.","frdef":"Fini lèvres sans brillance.","par":"블러립","rel":"관련어(참고)"},{"id":"BT0905","k":"h","cat":"lip","w":"멜팅밤","rom":"meltingbam","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"melting+balm","memofr":"Composé : 멜팅 (angl. melting) + 밤 (angl. balm)","note":"Formule publicitaire.","mean":"입술에 닿으면 녹아드는 밤.","ex":"멜팅밤이라 입술에 닿자마자 부드럽게 녹는다.","exfr":"C'est un baume fondant : il fond en douceur dès qu'il touche les lèvres.","fr":"baume fondant","frpos":"n.m.","frdef":"Baume qui fond au contact des lèvres."},{"id":"BT0907","k":"h","cat":"lip","w":"물먹립","rom":"mulmeongnip","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"물먹-(「물먹다」의 어간)+립(lip)","memofr":"Composé : 물먹- (radical de 물먹다 « s'imbiber ») + 립 (angl. lip)","note":"Néologisme de maquillage récent.","mean":"「물 먹은 립」의 줄임말. 촉촉하고 물기 있어 보이는 입술.","ex":"물먹립을 연출하려고 틴트 위에 투명 글로스를 올렸다.","exfr":"Pour des lèvres « gorgées d'eau », j'ai posé un gloss transparent sur le tint.","fr":"lèvres « gorgées d'eau »","frpos":"n.f.pl.","frdef":"Lèvres à fini juteux et brillant, comme gorgées d'eau."},{"id":"BT0908","k":"h","cat":"lip","w":"뮤트톤","rom":"myuteuton","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"mute+tone","memofr":"Composé : 뮤트 (angl. mute) + 톤 (angl. tone)","note":"Terme de colorimétrie personnelle, très utilisé en Corée.","mean":"채도가 낮고 회색빛이 섞인 차분한 색조.","ex":"뮤트톤 립은 진한 화장에도 과해 보이지 않는다.","exfr":"Avec une teinte sourde, les lèvres ne font pas trop, même avec un maquillage appuyé.","fr":"teinte sourde (mute)","frpos":"n.f.","frdef":"Couleur adoucie, grisée et peu saturée.","par":"퍼스널컬러","rel":"관련어(참고)"},{"id":"BT0909","k":"s","cat":"lip","w":"밀림","rom":"millim","pos":"명사","unit":"단어","eo":"고유어","form":"파생어","memo":"밀리다+-ㅁ","memofr":"Dérivé : 밀리다 (pelucher) + -ㅁ (nominalisateur)","note":"Voir 밀리다.","mean":"립 제품을 덧바를 때 밀려 뭉치는 현상.","ex":"틴트를 두 번 덧바르니 밀림이 생겼다.","exfr":"En superposant deux couches de tint, il y a eu du peluchage.","fr":"peluchage","frpos":"n.m.","frdef":"Le rouge forme des petits rouleaux quand on superpose.","par":"밀리다","rel":"파생형"},{"id":"BT0910","k":"h","cat":"lip","w":"발색","rom":"balsaek","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"발+색","memofr":"Composé : 발 (émettre) + 색 (couleur)","note":"Critère principal des avis sur les produits de couleur.","mean":"제품 색상이 입술에 드러나는 정도","ex":"손등에 발라 본 발색과 입술 발색이 꽤 다르다.","exfr":"Le rendu couleur sur le dos de la main est assez différent de celui sur les lèvres.","fr":"rendu couleur, pigmentation","frpos":"n.m.","frdef":"Intensité et fidélité avec lesquelles la couleur apparaît sur la peau ou les lèvres."},{"id":"BT0911","k":"h","cat":"lip","w":"벨벳틴트","rom":"belbettinteu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"velvet+tint","memofr":"Composé : 벨벳 (angl. velvet) + 틴트 (angl. tint)","note":"Catégorie de tint au fini velouté.","mean":"벨벳처럼 부드러운 마무리를 강조한 틴트","ex":"벨벳틴트라 보송하면서도 건조하지 않다.","exfr":"C'est un tint velours : fini velouté sans dessécher.","fr":"tint velours","frpos":"n.m.","frdef":"Tint à fini velouté semi-mat.","par":"틴트","rel":"하위어(참고)"},{"id":"BT0912","k":"h","cat":"lip","w":"벨벳피니시","rom":"belbetpinisi","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"velvet+finish","memofr":"Composé : 벨벳 (angl. velvet) + 피니시 (angl. finish)","note":"Voir l'échelle des finis.","mean":"벨벳처럼 부드러운 반매트 마무리.","ex":"벨벳피니시라 매트하지만 입술이 편안하다.","exfr":"Fini velours : mat, mais confortable sur les lèvres.","fr":"fini velours","frpos":"n.m.","frdef":"Fini doux et velouté entre mat et satiné.","par":"세미매트","rel":"관련어(참고)"},{"id":"BT0913","k":"h","cat":"lip","w":"보송립","rom":"bosongnip","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"보송(어근)+립(lip)","memofr":"Composé : 보송 (racine « sec et doux ») + 립 (angl. lip)","note":"Variante plus douce : 뽀송립.","mean":"보송하게 마무리되는 입술 표현.","ex":"보송립을 좋아해서 파우더 타입 틴트만 쓴다.","exfr":"J'aime les lèvres veloutées mates, je n'utilise que des tints en poudre.","fr":"lèvres veloutées mates","frpos":"n.f.pl.","frdef":"Fini lèvres sec et poudré.","par":"블러립","rel":"관련어(참고)"},{"id":"BT0915","k":"h","cat":"lip","w":"블러립","rom":"beulleorip","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"blur+lip","memofr":"Composé : 블러 (angl. blur) + 립 (angl. lip)","note":"Style de maquillage coréen proche des lèvres dégradées.","mean":"경계를 흐려 몽환적으로 표현한 입술.","ex":"블러립은 입술 경계를 손가락으로 두드려 흐리게 만든다.","exfr":"Pour des lèvres floutées, on estompe le contour en tapotant du doigt.","fr":"lèvres floutées (blurred lips)","frpos":"n.f.pl.","frdef":"Contour estompé, aspect flou et diffus."},{"id":"BT0916","k":"h","cat":"lip","w":"뽀송립","rom":"pposongnip","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"뽀송(어근)+립(lip)","memofr":"Composé : 뽀송 (racine « sec et doux », forme renforcée) + 립 (angl. lip)","note":"Consonne tendue expressive : 뽀송 est plus intense que 보송.","mean":"보송립의 센말.","ex":"뽀송립으로 마무리하니 마스크에도 잘 묻지 않았다.","exfr":"Avec des lèvres poudrées, le rouge n'a presque pas déteint sur le masque.","fr":"lèvres poudrées","frpos":"n.f.pl.","frdef":"Variante de 보송립: fini mat très doux.","par":"보송하다","rel":"관련어(참고)"},{"id":"BT0917","k":"h","cat":"lip","w":"색이 빠지다","rom":"saegi ppajida","pos":"동사","unit":"구","eo":"고유어","form":"구","memo":"색이+빠지다 / 명사형: 색빠짐","memofr":"Locution : 색이 (la couleur) + 빠지다 (s'en aller)","note":"Nom : 색빠짐 ; critère de tenue des tints.","mean":"먹거나 마시면서 립 색이 지워지다.","ex":"이 틴트는 밥을 먹으면 색이 쉽게 빠진다.","exfr":"Ce tint a tendance à perdre sa couleur quand on mange.","fr":"perdre sa couleur","frpos":"loc.v.","frdef":"La couleur disparaît vite (en mangeant, en buvant).","par":"발색","rel":"관련어(참고)"},{"id":"BT0920","k":"h","cat":"lip","w":"스머징하다","rom":"seumeojinghada","pos":"동사","unit":"단어","eo":"혼종어","form":"파생어","memo":"스머징(smudging)+-하다","memofr":"Dérivé : 스머징 (angl. smudging) + -하다 (suffixe verbal)","note":"Technique d'eye-liner et de crayon.","mean":"경계를 문질러 번지듯 흐리게 하다.","ex":"틴트를 바른 뒤 손가락으로 스머징하면 경계가 자연스러워진다.","exfr":"Après le tint, estomper au doigt rend la démarcation naturelle.","fr":"estomper (au doigt)","frpos":"v.","frdef":"Flouter le contour du rouge pour un effet diffus."},{"id":"BT0921","k":"h","cat":"lip","w":"시어립","rom":"sieorip","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"sheer+lip","memofr":"Composé : 시어 (angl. sheer) + 립 (angl. lip)","note":"Fini transparent.","mean":"투명하게 비치는 가벼운 입술 색.","ex":"시어립이라 입술 본래 색이 살짝 비친다.","exfr":"Des lèvres transparentes : leur couleur naturelle transparaît légèrement.","fr":"lèvres transparentes (sheer)","frpos":"n.f.pl.","frdef":"Couleur légère et translucide.","par":"블러립","rel":"관련어(참고)"},{"id":"BT0922","k":"h","cat":"lip","w":"언더립","rom":"eondeorip","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"under+lip","memofr":"Composé : 언더 (angl. under) + 립 (angl. lip)","note":"Contraire de 오버립.","mean":"입술선 안쪽으로 작게 그리는 기법.","ex":"언더립으로 작게 그리니 단정한 인상이 된다.","exfr":"Avec un sous-lignage des lèvres qui les dessine plus petites, on obtient un air soigné.","fr":"sous-lignage des lèvres","frpos":"n.m.","frdef":"Appliquer le rouge en deçà du contour naturel.","par":"오버립","rel":"관련어(참고)"},{"id":"BT0923","k":"h","cat":"lip","w":"오버립","rom":"obeorip","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"over+lip","memofr":"Composé : 오버 (angl. over) + 립 (angl. lip)","note":"Faux anglicisme ; en anglais, on dit « overlining ».","mean":"입술선보다 살짝 크게 그려 도톰해 보이게 하는 기법.","ex":"오버립으로 입술선을 살짝 넘겨 그리니 입술이 도톰해 보인다.","exfr":"Avec des lèvres redessinées légèrement au-delà du contour, elles paraissent plus pulpeuses.","fr":"lèvres redessinées (overlining)","frpos":"n.f.pl.","frdef":"Dépasser légèrement le contour pour des lèvres plus pulpeuses."},{"id":"BT0924","k":"h","cat":"lip","w":"요플레현상","rom":"yopeullehyeonsang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"요플레(Yoplait 상표 유래)+현상","memofr":"Composé : 요플레 (de la marque Yoplait) + 현상 (phénomène)","note":"Nom de marque devenu commun en coréen pour « yaourt ».","mean":"매트 틴트가 입술 안쪽에 하얗게 뭉쳐 요구르트처럼 보이는 현상.","ex":"매트 틴트를 오래 바르고 있었더니 요플레현상이 생겼다.","exfr":"J'ai gardé un tint mat longtemps et il a fait l'« effet yaourt ».","fr":"effet « yaourt »","frpos":"n.m.","frdef":"Tint mat qui se roule en petites peaux blanchâtres à l'intérieur des lèvres, comme du yaourt.","par":"틴트","rel":"관련어(참고)"},{"id":"BT0925","k":"h","cat":"lip","w":"워터틴트","rom":"woteotinteu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"water+tint","memofr":"Composé : 워터 (angl. water) + 틴트 (angl. tint)","note":"Le premier type de tint popularisé en Corée.","mean":"물처럼 가벼운 제형을 강조한 틴트","ex":"워터틴트라 가볍게 발리고 맑게 물든다.","exfr":"C'est un tint aqueux : il s'applique légèrement et colore en transparence.","fr":"tint aqueux","frpos":"n.m.","frdef":"Tint très fluide à base d'eau.","par":"틴트","rel":"하위어(참고)"},{"id":"BT0926","k":"h","cat":"lip","w":"웜톤","rom":"womton","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"warm+tone","memofr":"Composé : 웜 (angl. warm) + 톤 (angl. tone)","note":"Base de la colorimétrie coréenne : 웜톤 / 쿨톤, puis par saisons (봄 웜, 여름 쿨…).","mean":"노란빛·황금빛 기반의 피부 톤(퍼스널컬러).","ex":"웜톤이라 코랄이나 오렌지 계열 립이 잘 받는다.","exfr":"J'ai un sous-ton chaud, les rouges à lèvres corail ou orangés me vont bien.","fr":"sous-ton chaud","frpos":"n.m.","frdef":"Carnation à sous-ton jaune ou doré (colorimétrie).","par":"퍼스널컬러","rel":"관련어(참고)"},{"id":"BT0927","k":"h","cat":"lip","w":"유리알광","rom":"yurialgwang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"유리알+광","memofr":"Composé : 유리알 (bille de verre) + 광 (éclat)","note":"Voir 유리알 피부.","mean":"유리구슬처럼 맑고 또렷한 광.","ex":"유리알광 립을 하려고 투명 글로스를 듬뿍 올렸다.","exfr":"Pour des lèvres à la brillance effet verre, j'ai posé une généreuse couche de gloss transparent.","fr":"brillance effet verre","frpos":"n.f.","frdef":"Brillance très nette et transparente.","par":"물광","rel":"관련어(참고)"},{"id":"BT0930","k":"h","cat":"lip","w":"입술 경계 풀기","rom":"ipsul gyeonggye pulgi","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"입술+경계+풀기(풀다+-기)","memofr":"Locution : 입술 (lèvres) + 경계 (frontière) + 풀기 (fait de défaire)","note":"Geste clé des lèvres dégradées.","mean":"입술에 바른 색의 경계를 자연스럽게 흐리는 동작","ex":"입술 경계 풀기를 해 주면 틴트가 훨씬 자연스러워 보인다.","exfr":"En estompant le contour des lèvres, le tint paraît bien plus naturel.","fr":"estomper le contour des lèvres","frpos":"loc.v.","frdef":"Flouter la limite du rouge pour un effet naturel.","par":"그라데이션립","rel":"관련어(참고)"},{"id":"BT0933","k":"h","cat":"lip","w":"입술산","rom":"ipsulsan","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"입술+산","memofr":"Composé : 입술 (lèvres) + 산 (montagne)","note":"Image propre au coréen (« montagne des lèvres »).","mean":"윗입술 가운데 솟은 두 봉우리.","ex":"입술산을 따라 립라이너를 그리면 입술 모양이 또렷해진다.","exfr":"En suivant l'arc de Cupidon au crayon, la forme des lèvres devient plus nette.","fr":"arc de Cupidon","frpos":"n.m.","frdef":"Les deux pointes de la lèvre supérieure.","par":"오버립","rel":"관련어(참고)"},{"id":"BT0941","k":"h","cat":"lip","w":"촉촉립","rom":"chokchongnip","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"촉촉(어근)+립(lip)","memofr":"Composé : 촉촉 (racine « humide, moelleux ») + 립 (angl. lip)","note":"S'oppose à 보송립 et 매트립.","mean":"촉촉하게 표현된 입술.","ex":"촉촉립을 연출하려고 립밤을 먼저 바르고 틴트를 올렸다.","exfr":"Pour des lèvres hydratées, j'ai d'abord mis un baume puis le tint par-dessus.","fr":"lèvres hydratées","frpos":"n.f.pl.","frdef":"Fini lèvres hydraté et confortable."},{"id":"BT0942","k":"h","cat":"lip","w":"컬러립밤","rom":"keolleoripbam","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"color+lip balm","memofr":"Composé : 컬러 (angl. color) + 립밤 (angl. lip balm)","note":"Produit hybride soin et couleur.","mean":"색이 있는 립밤.","ex":"컬러립밤 하나로 보습과 혈색을 함께 챙긴다.","exfr":"Avec un baume à lèvres coloré, j'hydrate et je donne bonne mine en un seul geste.","fr":"baume à lèvres coloré","frpos":"n.m.","frdef":"Baume teinté."},{"id":"BT0944","k":"h","cat":"lip","w":"쿨톤","rom":"kulton","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"cool+tone","memofr":"Composé : 쿨 (angl. cool) + 톤 (angl. tone)","note":"Pendant de 웜톤 ; voir 퍼스널컬러.","mean":"푸른빛·분홍빛 기반의 피부 톤(퍼스널컬러).","ex":"쿨톤이라 핑크나 라즈베리 계열이 잘 받는다.","exfr":"J'ai un sous-ton froid, les roses et framboises me vont bien.","fr":"sous-ton froid","frpos":"n.m.","frdef":"Carnation à sous-ton rosé ou bleuté (colorimétrie).","par":"퍼스널컬러","rel":"관련어(참고)"},{"id":"BT0945","k":"h","cat":"lip","w":"탕후루광","rom":"tanghurugwang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"탕후루(중국어 )+광","memofr":"Composé : 탕후루 (du chinois tanghulu, brochette de fruits caramélisés) + 광 (éclat)","note":"Néologisme lié à une mode alimentaire de 2023 en Corée.","mean":"탕후루 설탕 코팅처럼 반짝이는 광.","ex":"탕후루광 립은 투명 글로스를 두껍게 올려 연출한다.","exfr":"Pour une brillance « tanghulu », on pose une couche épaisse de gloss transparent.","fr":"brillance « tanghulu »","frpos":"n.f.","frdef":"Brillance vitrée comme l'enrobage sucré des fruits tanghulu.","par":"물광","rel":"관련어(참고)"},{"id":"BT0947","k":"h","cat":"lip","w":"톤다운","rom":"tondaun","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"tone+down","memofr":"Composé : 톤 (angl. tone) + 다운 (angl. down)","note":"Contraire de 톤업.","mean":"색을 차분하게 낮춤.","ex":"진한 립 위에 누드 립을 덧발라 톤다운했다.","exfr":"Pour un adoucissement du ton, j'ai superposé un nude sur une couleur intense.","fr":"adoucissement du ton (tone-down)","frpos":"n.m.","frdef":"Rendre une couleur plus sombre ou plus douce.","par":"뮤트톤","rel":"관련어(참고)"},{"id":"BT0948","k":"h","cat":"lip","w":"톤온톤","rom":"tononton","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"tone+on+tone","memofr":"Composé : 톤 (angl. tone) + 온 (angl. on) + 톤 (angl. tone)","note":"L'expression existe aussi en français (« ton sur ton »).","mean":"같은 계열 색을 겹쳐 쓰는 배색.","ex":"블러셔와 립을 같은 계열로 맞춰 톤온톤으로 연출했다.","exfr":"J'ai assorti blush et lèvres dans la même gamme pour un effet ton sur ton.","fr":"ton sur ton","frpos":"loc.adj.","frdef":"Association de nuances d'une même famille de couleur.","par":"뮤트톤","rel":"관련어(참고)"},{"id":"BT0949","k":"h","cat":"lip","w":"투명감","rom":"tumyeonggam","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"투명+-감","memofr":"Dérivé : 투명 (transparent) + -감 (suffixe « sensation »)","note":"Qualité valorisée dans le maquillage coréen « naturel ».","mean":"맑게 비치는 느낌.","ex":"투명감이 있는 틴트라 입술 본래 색이 은은하게 비친다.","exfr":"Ce tint a de la transparence : la couleur naturelle des lèvres transparaît subtilement.","fr":"transparence","frpos":"n.f.","frdef":"Aspect translucide et frais de la couleur."},{"id":"BT0950","k":"h","cat":"lip","w":"틴트","rom":"tinteu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"tint 차용","memofr":"Emprunt à l'anglais tint","note":"Produit emblématique du maquillage coréen ; le mot est entré tel quel dans le vocabulaire international.","mean":"입술에 색을 입히는 착색형 립 제품","ex":"물을 마셔도 지워지지 않는 틴트다.","exfr":"Un tint à lèvres qui ne part pas, même en buvant de l'eau.","fr":"tint à lèvres (lip tint)","frpos":"n.m.","frdef":"Rouge liquide qui teinte les lèvres, produit phare coréen."},{"id":"BT0951","k":"h","cat":"lip","w":"틴티드립밤","rom":"tintideuripbam","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"tinted+lip balm","memofr":"Composé : 틴티드 (angl. tinted) + 립밤 (angl. lip balm)","note":"Synonyme de 컬러립밤.","mean":"살짝 색이 있는 립밤.","ex":"틴티드립밤은 화장을 안 한 날에도 부담 없이 바른다.","exfr":"Le baume teinté se porte facilement, même les jours sans maquillage.","fr":"baume teinté","frpos":"n.m.","frdef":"Baume à lèvres légèrement coloré."},{"id":"BT0952","k":"h","cat":"lip","w":"퍼스널컬러","rom":"peoseuneolkeolleo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"personal+color","memofr":"Composé : 퍼스널 (angl. personal) + 컬러 (angl. color)","note":"Phénomène de société en Corée : de nombreux salons proposent un diagnostic payant.","mean":"개인의 피부·눈·머리색에 어울리는 색 유형을 진단하는 개념.","ex":"퍼스널컬러 진단을 받고 나서 립 고르는 기준이 달라졌다.","exfr":"Depuis mon analyse colorimétrique, je ne choisis plus mes rouges à lèvres de la même façon.","fr":"colorimétrie (analyse des couleurs)","frpos":"n.f.","frdef":"Analyse des couleurs qui flattent le teint selon des « saisons » ; très populaire en Corée."},{"id":"BT0953","k":"h","cat":"lip","w":"풀립","rom":"pullip","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"full+lip","memofr":"Composé : 풀 (angl. full) + 립 (angl. lip)","note":"S'oppose à 그라데이션립.","mean":"입술 전체를 꽉 채워 바르는 표현.","ex":"풀립으로 바르니 입술 모양이 또렷하고 단정해 보인다.","exfr":"Avec des lèvres pleinement colorées, leur forme paraît nette et soignée.","fr":"lèvres pleinement colorées","frpos":"n.f.pl.","frdef":"Couleur appliquée sur toute la lèvre, contour net.","par":"오버립","rel":"관련어(참고)"},{"id":"BT0954","k":"h","cat":"lip","w":"플럼핑글로스","rom":"peulleompinggeulloseu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"plumping+gloss","memofr":"Composé : 플럼핑 (angl. plumping) + 글로스 (angl. gloss)","note":"Les ingrédients repulpants picotent souvent légèrement.","mean":"입술이 도톰해 보이는 연출을 강조한 글로스","ex":"플럼핑글로스를 바르면 입술이 화끈거리면서 도톰해진다.","exfr":"Avec ce gloss repulpant, les lèvres chauffent un peu et paraissent plus pulpeuses.","fr":"gloss repulpant","frpos":"n.m.","frdef":"Gloss qui donne un effet lèvres plus pleines."},{"id":"BT0956","k":"h","cat":"hair","w":"두피강화","rom":"dupiganghwa","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"두피+강화","memofr":"Composé : 두피 (cuir chevelu) + 강화 (renforcement)","note":"Formule publicitaire des shampoings.","mean":"두피를 튼튼하게 한다는 홍보 표현.","ex":"두피강화 샴푸로 바꾼 뒤 머리가 덜 빠지는 것 같다.","exfr":"Depuis que je suis passée à un shampoing pour la fortification du cuir chevelu, j'ai l'impression de perdre moins de cheveux.","fr":"fortification du cuir chevelu","frpos":"n.f.","frdef":"Mention marketing d'un soin qui renforce le cuir chevelu."},{"id":"BT0957","k":"h","cat":"hair","w":"탈모 증상 완화","rom":"talmo jeungsang wanhwa","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"탈모+증상+완화","memofr":"Locution : 탈모 (chute de cheveux) + 증상 (symptôme) + 완화 (atténuation)","note":"Formulation réglementée en Corée : seuls les produits fonctionnels agréés peuvent l'employer.","mean":"탈모 증상 완화를 내세운 기능성 관련 광고 표현; 효능 보증 아님","ex":"탈모 증상 완화 기능성 샴푸로 바꾸고 석 달째 쓰고 있다.","exfr":"Je suis passée à un shampoing fonctionnel qui atténue les symptômes de la chute de cheveux ; ça fait trois mois.","fr":"atténuation des symptômes de la chute de cheveux","frpos":"n.f.","frdef":"Fonction réglementaire coréenne des shampoings dits « anti-chute ».","par":"기능성 화장품","rel":"관련어(참고)"},{"id":"BT0958","k":"h","cat":"hair","w":"딥 데미지 리페어","rom":"dip demiji ripeeo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"deep+damage+repair","memofr":"Locution : 딥 (angl. deep) + 데미지 (angl. damage) + 리페어 (angl. repair)","note":"Formule marketing entièrement anglaise.","mean":"심하게 손상된 모발을 회복시킨다는 홍보 표현.","ex":"탈색으로 상한 머리에 딥 데미지 리페어 샴푸를 쓰고 있다.","exfr":"Pour mes cheveux abîmés par la décoloration, j'utilise un shampoing de réparation des dommages profonds.","fr":"réparation des dommages profonds","frpos":"n.f.","frdef":"Formule marketing pour cheveux très abîmés.","par":"손상모","rel":"관련어(참고)"},{"id":"BT0959","k":"h","cat":"hair","w":"씨크닝","rom":"ssikeuning","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"thickening 차용","memofr":"Emprunt à l'anglais thickening","note":"Graphie 씨크닝, éloignée de la norme officielle (시크닝).","mean":"머리카락이 굵어 보이게 하는 효과.","ex":"씨크닝 샴푸를 쓰니 가는 머리카락이 조금 굵어 보인다.","exfr":"Avec un shampoing à effet épaississant, mes cheveux fins paraissent un peu plus épais.","fr":"effet épaississant","frpos":"n.m.","frdef":"Soin qui donne l'impression de cheveux plus épais."},{"id":"BT0960","k":"h","cat":"hair","w":"두피 스케일러","rom":"dupi seukeilleo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"두피+스케일러(scaler)","memofr":"Locution : 두피 (cuir chevelu) + 스케일러 (angl. scaler)","note":"Emprunt au vocabulaire dentaire ; voir 모공 스케일링.","mean":"두피의 피지·각질 등을 관리하도록 만든 제품","ex":"두피 스케일러를 일주일에 한 번 쓰니 각질이 줄었다.","exfr":"En utilisant un exfoliant du cuir chevelu une fois par semaine, j'ai moins de squames.","fr":"exfoliant du cuir chevelu","frpos":"n.m.","frdef":"Soin qui élimine sébum et squames du cuir chevelu."},{"id":"BT0961","k":"h","cat":"hair","w":"피지 케어","rom":"piji keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"피지+케어(care)","memofr":"Locution : 피지 (sébum) + 케어 (angl. care)","note":"Formule générique.","mean":"피지를 관리함.","ex":"지성 두피라 피지 케어 샴푸를 아침마다 쓴다.","exfr":"J'ai le cuir chevelu gras, alors j'utilise chaque matin un shampoing de soin anti-sébum.","fr":"soin anti-sébum","frpos":"n.m.","frdef":"Soin qui régule le sébum (cuir chevelu, peau)."},{"id":"BT0962","k":"h","cat":"hair","w":"각질 케어","rom":"gakjil keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"각질+케어(care)","memofr":"Locution : 각질 (squames) + 케어 (angl. care)","note":"Pour le cuir chevelu, 각질 renvoie surtout aux pellicules.","mean":"각질을 관리함.","ex":"두피 각질 케어를 하려고 일주일에 한 번 스케일러를 쓴다.","exfr":"Pour le soin des squames du cuir chevelu, j'utilise un exfoliant une fois par semaine.","fr":"soin des squames","frpos":"n.m.","frdef":"Élimination des peaux mortes (cuir chevelu, peau)."},{"id":"BT0963","k":"h","cat":"hair","w":"냄새 케어","rom":"naemsae keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"냄새+케어(care)","memofr":"Locution : 냄새 (odeur) + 케어 (angl. care)","note":"Préoccupation fréquente dans le marché capillaire coréen.","mean":"두피 냄새를 관리함.","ex":"여름에는 냄새 케어가 되는 쿨링 샴푸를 고른다.","exfr":"En été, je choisis un shampoing rafraîchissant qui fait aussi soin anti-odeur.","fr":"soin anti-odeur","frpos":"n.m.","frdef":"Soin contre les odeurs du cuir chevelu."},{"id":"BT0964","k":"h","cat":"hair","w":"스칼프 스케일링","rom":"seukalpeu seukeilling","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"scalp+scaling","memofr":"Locution : 스칼프 (angl. scalp) + 스케일링 (angl. scaling)","note":"Prestation courante dans les salons coréens.","mean":"두피 각질·피지를 깊이 제거하는 관리.","ex":"주말마다 스칼프 스케일링 샴푸로 두피 각질을 정리한다.","exfr":"Chaque week-end, je fais un gommage du cuir chevelu avec un shampoing exfoliant.","fr":"gommage du cuir chevelu","frpos":"n.m.","frdef":"Exfoliation profonde du cuir chevelu.","par":"두피 스케일러","rel":"관련어(참고)"},{"id":"BT0965","k":"h","cat":"hair","w":"헤어리프팅","rom":"heeoripeuting","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"hair+lifting","memofr":"Composé : 헤어 (angl. hair) + 리프팅 (angl. lifting)","note":"Faux anglicisme ; il s'agit d'un effet coiffant.","mean":"모근을 세워 볼륨을 주는 효과.","ex":"헤어리프팅 샴푸를 쓰니 정수리 볼륨이 산다.","exfr":"Avec un shampoing à effet volume aux racines, le sommet du crâne prend du volume.","fr":"effet volume aux racines","frpos":"n.m.","frdef":"Effet qui décolle les racines pour plus de volume."},{"id":"BT0966","k":"h","cat":"hair","w":"글라이콜릭 글로스","rom":"geullaikollik geulloseu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"glycolic+gloss","memofr":"Locution : 글라이콜릭 (angl. glycolic) + 글로스 (angl. gloss)","note":"Nom de produit devenu descriptif.","mean":"글라이콜릭이라는 성분·콘셉트와 윤기 표현을 결합한 제품 문구; 고유 명칭 검토","ex":"글라이콜릭 글로스 샴푸를 쓰니 머릿결에 윤기가 돈다.","exfr":"Avec un shampoing au gloss à l'acide glycolique, mes cheveux deviennent brillants.","fr":"gloss à l'acide glycolique (soin cheveux)","frpos":"n.m.","frdef":"Soin brillance capillaire à base d'acide glycolique (concept de marque)."},{"id":"BT0967","k":"h","cat":"hair","w":"바이오틴","rom":"baiotin","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"biotin 차용","memofr":"Emprunt à l'anglais biotin","note":"Ingrédient associé à la beauté des cheveux et des ongles.","mean":"비타민 B7 성분","ex":"바이오틴이 든 샴푸로 바꾸고 머리가 덜 빠진다.","exfr":"Depuis que j'utilise un shampoing à la biotine, je perds moins de cheveux.","fr":"biotine","frpos":"n.f.","frdef":"Vitamine B7 (ou H), associée à la beauté des cheveux.","ing":"한국어: 비타민 B7(비타민 H). 두피·모발 제품에서 「모발 영양」 문구와 함께 쓰임.\nFrançais : La biotine, ou vitamine B7, est une vitamine hydrosoluble utilisée dans certaines formules de soin pour la peau, les cheveux et les ongles.","inci":"Biotin"},{"id":"BT0968","k":"h","cat":"hair","w":"손상 모발 개선","rom":"sonsang mobal gaeseon","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"손상+모발+개선","memofr":"Locution : 손상 (dommage) + 모발 (cheveux) + 개선 (amélioration)","note":"Formule publicitaire.","mean":"손상된 머릿결을 개선한다는 홍보 표현.","ex":"손상 모발 개선 트리트먼트를 쓰니 끝이 덜 갈라진다.","exfr":"Avec un soin de réparation des cheveux abîmés, j'ai moins de fourches.","fr":"réparation des cheveux abîmés","frpos":"n.f.","frdef":"Mention marketing de soin pour cheveux abîmés.","par":"손상모","rel":"관련어(참고)"},{"id":"BT0969","k":"h","cat":"hair","w":"두피앰플샴푸","rom":"dupiaempeulsyampu","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"두피+앰플+샴푸","memofr":"Composé : 두피 (cuir chevelu) + 앰플 (angl. ampoule) + 샴푸 (angl. shampoo)","note":"Le terme « ampoule » est repris du soin du visage.","mean":"앰플처럼 고농축이라고 내세운 두피 샴푸.","ex":"두피앰플샴푸는 거품을 낸 뒤 두피에 잠시 두었다가 헹군다.","exfr":"Je fais mousser le shampoing-ampoule pour cuir chevelu, je le laisse poser un moment puis je rince.","fr":"shampoing-ampoule pour cuir chevelu","frpos":"n.m.","frdef":"Shampoing présenté comme aussi concentré qu'une ampoule."},{"id":"BT0971","k":"h","cat":"hair","w":"광채샴푸","rom":"gwangchaesyampu","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"광채+샴푸(shampoo)","memofr":"Composé : 광채 (éclat) + 샴푸 (angl. shampoo)","note":"Formule publicitaire.","mean":"머릿결에 윤기를 준다고 내세운 샴푸.","ex":"광채샴푸를 쓰니 푸석하던 머리에 윤기가 생겼다.","exfr":"Avec un shampoing brillance, mes cheveux ternes ont retrouvé de l'éclat.","fr":"shampoing brillance","frpos":"n.m.","frdef":"Shampoing qui promet des cheveux brillants."},{"id":"BT0973","k":"h","cat":"hair","w":"젤리 헤어팩","rom":"jelli heeopaek","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"jelly+hair pack","memofr":"Locution : 젤리 (angl. jelly) + 헤어팩 (angl. hair pack)","note":"Format de soin à la mode.","mean":"젤리 질감의 헤어팩.","ex":"젤리 헤어팩을 머리끝에 바르고 오 분 뒤에 헹궜다.","exfr":"J'ai appliqué le masque capillaire gelée sur les pointes et rincé cinq minutes plus tard.","fr":"masque capillaire gelée","frpos":"n.m.","frdef":"Masque capillaire à texture de gelée."},{"id":"BT0974","k":"h","cat":"hair","w":"노워시 트리트먼트","rom":"nowosi teuriteumeonteu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"no-wash+treatment","memofr":"Locution : 노워시 (angl. no-wash) + 트리트먼트 (angl. treatment)","note":"En coréen, 트리트먼트 désigne un soin capillaire (après-shampoing riche).","mean":"씻어내지 않고 모발에 남겨 사용하는 관리 제품","ex":"머리를 말리기 전에 노워시 트리트먼트를 끝에 바른다.","exfr":"Avant le séchage, j'applique un soin sans rinçage sur les pointes.","fr":"soin sans rinçage","frpos":"n.m.","frdef":"Soin capillaire à laisser sur les cheveux."},{"id":"BT0976","k":"h","cat":"hair","w":"단백질 흡착","rom":"danbaekjil heupchak","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"단백질+흡착","memofr":"Locution : 단백질 (protéine) + 흡착 (adsorption)","note":"Formulation de fiche produit.","mean":"단백질 성분이 모발 표면에 달라붙는다는 제품 설명상의 표현","ex":"단백질 흡착 트리트먼트를 쓰니 머릿결이 탄탄해졌다.","exfr":"Avec un soin à fixation des protéines, mes cheveux sont devenus plus résistants.","fr":"fixation des protéines","frpos":"n.f.","frdef":"Les protéines du soin se déposent sur la fibre capillaire."},{"id":"BT0977","k":"h","cat":"hair","w":"손상모","rom":"sonsangmo","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"손상+모","memofr":"Composé : 손상 (dommage) + 모 (poil, cheveu)","note":"Abréviation de 손상 모발 ; terme des fiches produit.","mean":"손상된 머리카락.","ex":"손상모라 열기구를 쓰기 전에 꼭 에센스를 바른다.","exfr":"J'ai les cheveux abîmés, alors j'applique toujours une essence avant d'utiliser un appareil chauffant.","fr":"cheveux abîmés","frpos":"n.m.pl.","frdef":"Cheveux endommagés par la chaleur ou la chimie."},{"id":"BT0979","k":"h","cat":"hair","w":"리브 인 폼","rom":"ribeu in pom","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"leave-in+foam","memofr":"Locution : 리브 인 (angl. leave-in) + 폼 (angl. foam)","note":"Calque de l'anglais.","mean":"씻어내지 않는 거품형 헤어 제품","ex":"리브 인 폼을 머리에 펴 바르고 그대로 말린다.","exfr":"J'étale une mousse sans rinçage sur mes cheveux et je les sèche directement.","fr":"mousse sans rinçage","frpos":"n.f.","frdef":"Soin capillaire en mousse à laisser poser."},{"id":"BT0980","k":"h","cat":"hair","w":"단백질 본드","rom":"danbaekjil bondeu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"단백질+본드(bond)","memofr":"Locution : 단백질 (protéine) + 본드 (angl. bond)","note":"À rapprocher des soins « bond-building ».","mean":"모발 내부 결합을 보강한다는 단백질 관리 제품.","ex":"단백질 본드 제품을 쓰니 탈색모가 덜 끊어진다.","exfr":"Avec un « bond » protéiné, mes cheveux décolorés cassent moins.","fr":"« bond » protéiné (soin réparateur)","frpos":"n.m.","frdef":"Soin qui prétend reconstruire les liaisons internes du cheveu."},{"id":"BT0981","k":"h","cat":"hair","w":"워터에센스","rom":"woteoesenseu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"water+essence","memofr":"Composé : 워터 (angl. water) + 에센스 (angl. essence)","note":"Format de soin capillaire léger.","mean":"물처럼 가벼운 헤어 에센스.","ex":"워터에센스라 머리에 뿌려도 무겁지 않다.","exfr":"C'est une essence aqueuse pour cheveux : même vaporisée, elle n'alourdit pas.","fr":"essence aqueuse pour cheveux","frpos":"n.f.","frdef":"Soin capillaire fluide comme de l'eau."},{"id":"BT0983","k":"h","cat":"hair","w":"수분단백질","rom":"subundanbaekjil","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"수분+단백질","memofr":"Composé : 수분 (hydratation) + 단백질 (protéine)","note":"Formule marketing.","mean":"모발에 수분을 준다는 단백질 성분 홍보 표현.","ex":"수분단백질 미스트를 뿌리니 머릿결이 촉촉해졌다.","exfr":"Avec une brume aux protéines hydratantes, mes cheveux sont devenus plus souples.","fr":"protéines hydratantes","frpos":"n.f.pl.","frdef":"Mention marketing de protéines apportant hydratation aux cheveux."},{"id":"BT0984","k":"h","cat":"hair","w":"펩타이드 리페어","rom":"peptaideu ripeeo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"peptide+repair","memofr":"Locution : 펩타이드 (angl. peptide) + 리페어 (angl. repair)","note":"Formule marketing.","mean":"펩타이드 성분을 활용한 손상 모발 관리 콘셉트","ex":"펩타이드 리페어 트리트먼트로 극손상모를 관리한다.","exfr":"Je soigne mes cheveux très abîmés avec un soin de réparation aux peptides.","fr":"réparation aux peptides","frpos":"n.f.","frdef":"Concept de soin capillaire réparateur à base de peptides."},{"id":"BT0985","k":"h","cat":"hair","w":"모발탄력","rom":"mobaltallyeok","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"모발+탄력","memofr":"Composé : 모발 (cheveux) + 탄력 (élasticité)","note":"Formule de fiche produit.","mean":"머리카락의 탄력.","ex":"단백질 트리트먼트를 꾸준히 했더니 모발탄력이 살아났다.","exfr":"Grâce à un soin protéiné régulier, l'élasticité des cheveux est revenue.","fr":"élasticité des cheveux","frpos":"n.f.","frdef":"Ressort et souplesse de la fibre capillaire."},{"id":"BT0986","k":"h","cat":"hair","w":"글라이신","rom":"geullaisin","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"glycine 차용","memofr":"Emprunt à l'anglais glycine","note":"Nom INCI : Glycine.","mean":"단백질을 구성하는 아미노산 중 하나","ex":"글라이신이 든 트리트먼트를 쓰니 머리가 부드러워졌다.","exfr":"Avec un soin à la glycine, mes cheveux sont devenus plus doux.","fr":"glycine","frpos":"n.f.","frdef":"Acide aminé hydratant et conditionneur.","ing":"한국어: 가장 단순한 아미노산. 보습·모발 컨디셔닝 목적으로 배합.\nFrançais : La glycine est l'acide aminé le plus simple; elle entre dans la composition de protéines et peut être utilisée comme agent de conditionnement en cosmétique.","inci":"Glycine"},{"id":"BT0988","k":"h","cat":"hair","w":"헤어 식초","rom":"heeo sikcho","pos":"명사","uni
