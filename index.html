rès le nettoyage améliore l'absorption des étapes suivantes.","fr":"booster (pré-sérum)","frpos":"n.m.","frdef":"Soin appliqué en premier pour renforcer l'efficacité des étapes suivantes."},{"id":"BT0501","k":"h","cat":"skin","w":"수분 앰플","rom":"subun aempeul","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"수분+앰플(ampoule)","memofr":"Locution : 수분 (hydratation) + 앰플 (angl. ampoule)","note":"Catégorie de produit courante en Corée.","mean":"수분 보충을 주된 목적으로 설명하는 앰플 유형.","ex":"물 같은 수분 앰플인데 속건조를 잘 채워 준다.","exfr":"C'est une ampoule hydratante aussi fluide que l'eau, mais elle comble bien la déshydratation profonde.","fr":"ampoule hydratante","frpos":"n.f.","frdef":"Ampoule (soin concentré coréen) dédiée à l'hydratation."},{"id":"BT0502","k":"h","cat":"skin","w":"스포이드형","rom":"seupoideuhyeong","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"스포이드(spuit)+-형","memofr":"Dérivé : 스포이드 (néerl. spuit, via le japonais) + -형 (suffixe « type, forme »)","note":"Emprunt indirect ; le français dit « pipette » ou « compte-gouttes ».","mean":"스포이드로 내용물을 빨아들여 조금씩 떨어뜨려 쓰는 용기 형태.","ex":"스포이드형이라 양을 조절하며 쓰기 편하다.","exfr":"Le flacon compte-gouttes permet de doser facilement.","fr":"flacon compte-gouttes","frpos":"n.m.","frdef":"Flacon muni d'une pipette (스포이드, du néerlandais « spuit »).","par":"펌프형","rel":"관련어(참고)"},{"id":"BT0503","k":"h","cat":"skin","w":"앰플","rom":"aempeul","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"ampoule 차용(한국식 의미 확장)","memofr":"Emprunt (angl. ampoule), avec élargissement de sens en coréen","note":"Faux ami partiel : en Corée, l'ampoule est un flacon de soin concentré, pas une fiole scellée.","mean":"세럼보다 유효 성분을 진하게 담은 고농축 기초 화장품 유형.","ex":"토너와 앰플을 함께 쓰는 조합을 추천한다.","exfr":"Je recommande d'associer la lotion tonique et l'ampoule.","fr":"ampoule (soin concentré)","frpos":"n.f.","frdef":"Catégorie coréenne de soin très concentré, plus dense qu'un sérum ; pas forcément en ampoule de verre.","faux":1},{"id":"BT0504","k":"h","cat":"skin","w":"에센스","rom":"esenseu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"essence 차용(한국식 제품군)","memofr":"Emprunt (angl. essence), avec un sens propre aux produits coréens","note":"Catégorie typique de la routine coréenne, entre le toner et le sérum ; elle est peu connue en France.","mean":"토너 다음에 바르는 묽고 가벼운 기초 화장품 유형.","ex":"에센스를 토너 다음에 바르면 피부가 한결 촉촉해진다.","exfr":"Appliquer une essence après la lotion tonique rend la peau nettement plus hydratée.","fr":"essence (soin coréen)","frpos":"n.f.","frdef":"Étape coréenne entre toner et sérum : soin fluide, léger et concentré ; à ne pas confondre avec l'huile essentielle.","faux":1},{"id":"BT0508","k":"h","cat":"skin","w":"듀얼 크림","rom":"dyueol keurim","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"dual+cream","memofr":"Locution : 듀얼 (angl. dual) + 크림 (angl. cream)","note":"Format en deux compartiments à mélanger ou à appliquer séparément.","mean":"서로 다른 두 제형을 조합하여 사용하는 크림.","ex":"듀얼 크림은 두 제형을 섞는 비율로 보습감을 조절할 수 있다.","exfr":"Avec une crème duo, on ajuste l'hydratation selon la proportion des deux textures mélangées.","fr":"crème duo","frpos":"n.f.","frdef":"Crème à deux textures distinctes à mélanger."},{"id":"BT0509","k":"h","cat":"skin","w":"로션","rom":"rosyeon","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"lotion 차용(의미 전이: 거짓 짝)","memofr":"Emprunt à l'anglais lotion, avec glissement de sens","note":"Faux ami : en Corée, 로션 est une émulsion fluide (lait), alors qu'en français une « lotion » est un liquide aqueux.","mean":"피부에 넓게 펴 바르는 보습 제품의 종류.","ex":"토너 다음에 로션을 바르고 크림으로 마무리한다.","exfr":"J'applique un lait hydratant après la lotion tonique et je termine par une crème.","fr":"lait hydratant / émulsion","frpos":"n.m. / n.f.","frdef":"En Corée, émulsion fluide appliquée après le toner ; faux ami avec le français « lotion » (= toner).","faux":1},{"id":"BT0510","k":"h","cat":"skin","w":"미백 크림","rom":"mibaek keurim","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"미백+크림(cream)","memofr":"Locution : 미백 (éclaircissement) + 크림 (angl. cream)","note":"En Corée, l'éclaircissement est une allégation réglementée ; en France, on dit plutôt « anti-taches » ou « éclat ».","mean":"피부가 밝고 고르게 보이도록 관리하는 용도를 내세운 크림.","ex":"미백 크림을 한 달 바르니 잡티가 조금 옅어졌다.","exfr":"Après un mois de crème éclaircissante, mes taches se sont un peu estompées.","fr":"crème éclaircissante","frpos":"n.f.","frdef":"Crème à fonction éclaircissante (catégorie fonctionnelle coréenne)."},{"id":"BT0512","k":"h","cat":"skin","w":"밀키 텍스처","rom":"milki tekseucheo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"milky+texture","memofr":"Locution : 밀키 (angl. milky) + 텍스처 (angl. texture)","note":"Synonyme marketing de 밀크 텍스처.","mean":"우유를 떠올리게 하는 부드러운 액상 로션 질감을 표현한 말.","ex":"흡수력에 집중한 밀키 텍스처라 끈적이지 않는다.","exfr":"Sa texture laiteuse, conçue pour une absorption rapide, ne colle pas.","fr":"texture laiteuse","frpos":"n.f.","frdef":"Texture fluide et blanche comme du lait."},{"id":"BT0515","k":"h","cat":"skin","w":"수분 크림","rom":"subun keurim","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"수분+크림(cream)","memofr":"Locution : 수분 (hydratation) + 크림 (angl. cream)","note":"Souvent une texture gel-crème légère ; s'oppose à 영양 크림.","mean":"수분 공급과 촉촉한 사용감을 중심으로 내세우는 크림의 종류.","ex":"가벼운 수분 크림이라 지성 피부도 여름에 쓰기 좋다.","exfr":"Cette crème hydratante est légère : même les peaux grasses peuvent l'utiliser en été.","fr":"crème hydratante (gel-crème)","frpos":"n.f.","frdef":"Crème légère centrée sur l'apport d'eau, catégorie phare coréenne."},{"id":"BT0520","k":"h","cat":"skin","w":"에멀전","rom":"emeoljeon","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"emulsion 차용","memofr":"Emprunt à l'anglais emulsion","note":"Dans la routine coréenne, synonyme plus technique de 로션.","mean":"유분과 수분을 섞은 로션 형태의 보습 제품.","ex":"토너 다음에 에멀전으로 수분과 유분을 채운다.","exfr":"Après la lotion tonique, j'apporte eau et lipides avec une émulsion.","fr":"émulsion","frpos":"n.f.","frdef":"Lait de soin, synonyme de 로션 en Corée."},{"id":"BT0521","k":"h","cat":"skin","w":"연고 제형","rom":"yeongo jehyeong","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"연고+제형","memofr":"Locution : 연고 (onguent, pommade médicale) + 제형 (texture)","note":"Image médicale : texture épaisse et occlusive.","mean":"연고를 떠올리게 하는 크림의 질감을 비유한 표현.","ex":"연고 제형이라 건조한 부위에만 소량 덧바른다.","exfr":"Sa texture pommade se prête à de petites retouches sur les zones sèches uniquement.","fr":"texture pommade","frpos":"n.f.","frdef":"Texture épaisse et occlusive comme un onguent.","par":"제형","rel":"하위어(참고)"},{"id":"BT0522","k":"h","cat":"skin","w":"영양 크림","rom":"yeongyang keurim","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"영양+크림(cream)","memofr":"Locution : 영양 (nutrition) + 크림 (angl. cream)","note":"Crème riche, souvent pour l'hiver ou les peaux matures.","mean":"보습감이나 영양감이 풍부한 크림을 떠올리게 하는 제품 유형 표현.","ex":"딱 영양 크림 느낌이라 밤에만 바른다.","exfr":"Elle a tout d'une crème nourrissante, je ne l'applique que le soir.","fr":"crème nourrissante","frpos":"n.f.","frdef":"Crème riche, dernière étape de soin."},{"id":"BT0523","k":"h","cat":"skin","w":"올인원","rom":"orinwon","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"all-in-one 차용 / 원어에서 통째로 들어온 외래어라 단일어로 봄","memofr":"Emprunt à l'anglais all-in-one ; traité comme mot simple","note":"Produit courant dans les routines masculines coréennes.","mean":"여러 피부 관리 단계를 하나로 간편하게 사용하도록 내세운 제품.","ex":"바쁜 아침에는 올인원 하나로 기초를 끝낸다.","exfr":"Les matins pressés, je fais ma routine de base avec un seul soin tout-en-un.","fr":"soin tout-en-un","frpos":"n.m.","frdef":"Produit qui remplace plusieurs étapes de soin."},{"id":"BT0524","k":"h","cat":"skin","w":"장벽 크림","rom":"jangbyeok keurim","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"장벽+크림(cream)","memofr":"Locution : 장벽 (barrière) + 크림 (angl. cream)","note":"Catégorie très en vogue ; ingrédients phares : céramides et panthénol.","mean":"피부장벽을 관리하는 용도라고 소개되는 크림.","ex":"레이저 시술 뒤에는 장벽 크림을 듬뿍 바르라고 했다.","exfr":"On m'a conseillé d'appliquer généreusement une crème barrière après le laser.","fr":"crème barrière","frpos":"n.f.","frdef":"Crème destinée à réparer et renforcer la barrière cutanée."},{"id":"BT0525","k":"h","cat":"skin","w":"재생 크림","rom":"jaesaeng keurim","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"재생+크림(cream)","memofr":"Locution : 재생 (régénération) + 크림 (angl. cream)","note":"Les fabricants évitent souvent ce terme, trop proche d'une allégation médicale.","mean":"손상되거나 예민해진 피부의 회복 관리에 쓰는 크림을 떠올리는 소비자 표현.","ex":"자극받은 날에는 재생 크림처럼 쓰기 좋다.","exfr":"Les jours où ma peau est irritée, elle s'utilise bien comme crème réparatrice.","fr":"crème réparatrice","frpos":"n.f.","frdef":"Crème pour peau abîmée ou sensibilisée (après acte, irritation)."},{"id":"BT0529","k":"h","cat":"skin","w":"진동팁","rom":"jindongtip","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"진동+팁(tip)","memofr":"Composé : 진동 (vibration) + 팁 (angl. tip)","note":"Accessoire intégré à certains soins contour des yeux.","mean":"피부에 대어 진동으로 제품 사용을 돕는 끝부분.","ex":"진동팁을 잡고 얼굴에 대면 크림이 고르게 펴진다.","exfr":"En tenant l'embout vibrant contre le visage, la crème s'étale uniformément.","fr":"embout vibrant","frpos":"n.m.","frdef":"Embout d'applicateur qui vibre pour masser en appliquant le produit."},{"id":"BT0530","k":"h","cat":"skin","w":"진정 크림","rom":"jinjeong keurim","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"진정+크림(cream)","memofr":"Locution : 진정 (apaisement) + 크림 (angl. cream)","note":"Catégorie très présente en Corée (cica, panthénol…).","mean":"피부가 예민해졌을 때 편안하게 관리하려고 쓰는 크림을 뜻함.","ex":"피부가 뒤집어졌을 때 꺼내 쓰는 진정 크림이다.","exfr":"C'est la crème apaisante que je ressors quand ma peau fait une crise.","fr":"crème apaisante","frpos":"n.f.","frdef":"Crème utilisée quand la peau est irritée ou rouge."},{"id":"BT0533","k":"h","cat":"skin","w":"튜브링거","rom":"tyubeuringgeo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"tube+wringer","memofr":"Composé : 튜브 (angl. tube) + 링거 (angl. wringer)","note":"Petit accessoire anti-gaspillage.","mean":"튜브에 남은 내용물을 밀어 짜내는 데 쓰는 도구.","ex":"튜브링거로 끝까지 짜니 크림이 꽤 남아 있었다.","exfr":"En pressant le tube jusqu'au bout avec un presse-tube, il restait encore pas mal de crème.","fr":"presse-tube","frpos":"n.m.","frdef":"Petit outil pour presser un tube jusqu'au bout."},{"id":"BT0535","k":"h","cat":"sun","w":"3중 기능성","rom":"3jung gineungseong","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"3중+기능성","memofr":"Locution : 3중 (triple) + 기능성 (fonction réglementée)","note":"Renvoie aux trois fonctions reconnues par l'autorité sanitaire coréenne (MFDS).","mean":"식약처 기준 자외선 차단, 미백, 주름 개선 3가지 기능을 모두 갖춘 제품","ex":"자외선 차단, 미백, 주름 개선 효과를 갖춘 3중 기능성 선크림입니다.","exfr":"Une crème solaire à triple fonction : protection UV, éclaircissement et anti-rides.","fr":"triple fonction (UV, éclaircissement, rides)","frpos":"n.f.","frdef":"Produit déclaré pour trois fonctions coréennes: protection UV, éclaircissement et anti-rides.","par":"기능성 화장품","rel":"관련어(참고)"},{"id":"BT0536","k":"s","cat":"sun","w":"각질 들뜸","rom":"gakjil deultteum","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"각질+들뜸(들뜨다+-ㅁ)","memofr":"Locution : 각질 (peaux mortes) + 들뜸 (soulèvement, de 들뜨다)","note":"Défaut que le maquillage met en évidence.","mean":"건조함으로 인해 피부 표면 하얀 각질층이 일어난 상태","ex":"건조한 부위에 각질 들뜸이 심할 때는 수분 선세럼을 레이어링하세요.","exfr":"Quand les peaux mortes se soulèvent sur les zones sèches, superposez un sérum solaire hydratant.","fr":"peaux mortes soulevées","frpos":"n.f.pl.","frdef":"Squames visibles qui se soulèvent sous le maquillage ou le solaire.","par":"뜨다","rel":"연어"},{"id":"BT0537","k":"h","cat":"sun","w":"겉기름","rom":"geotgireum","pos":"명사","unit":"단어","eo":"고유어","form":"파생어","memo":"겉-(접두사)+기름","memofr":"Dérivé : 겉- (préfixe « surface ») + 기름 (gras)","note":"Associé à 속건조 : peau grasse en surface, sèche en dessous.","mean":"피부 수분 부족으로 반사작용에 의해 표면에 둥둥 뜨는 피지 오일","ex":"속은 건조하지만 겉은 유분과 겉기름으로 번들거릴 때 사용하기 좋습니다.","exfr":"Idéal quand la peau est sèche en profondeur mais brille de gras en surface.","fr":"gras de surface","frpos":"n.m.","frdef":"Brillance ou film gras visible à la surface de la peau, par opposition à une sensation de peau hydratée."},{"id":"BT0538","k":"h","cat":"sun","w":"겉보속촉","rom":"geotbosokchok","pos":"명사","unit":"단어","eo":"고유어","form":"축약어(두음절어)","memo":"겉보(송)+속촉(촉) 축약","memofr":"Abréviation syllabique : 겉보(송) (sec en surface) + 속촉(촉) (humide en profondeur)","note":"Abréviation de la formule 속촉촉 겉보송.","mean":"피부 겉은 보송·매끈하고 피부 속은 수분으로 촉촉한 감각","ex":"겉은 보송하고 속은 촉촉하게 마무리되는 반전 제형입니다.","exfr":"Une texture surprenante, au fini mat en surface, hydraté en profondeur.","fr":"fini mat en surface, hydraté en profondeur","frpos":"loc.adj.","frdef":"Abréviation de « geoteun bosong, sogeun chokchok » : fini mat en surface, hydraté en profondeur.","par":"수부지","rel":"관련어(참고)"},{"id":"BT0539","k":"h","cat":"sun","w":"결 케어","rom":"gyeol keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"결(고유어)+케어(care)","memofr":"Locution : 결 (grain de peau) + 케어 (angl. care)","note":"Formule marketing courte ; voir 피부결.","mean":"피부 표면 결(Skin texture)을 단정하고 매끄럽게 다듬는 효과","ex":"거칠어진 피부 요철과 굴곡을 매끄럽게 정돈해 주는 결 케어 선크림입니다.","exfr":"Une crème solaire de soin du grain de peau, qui lisse irrégularités et reliefs.","fr":"soin du grain de peau","frpos":"n.m.","frdef":"Soin qui lisse et affine la texture de la peau."},{"id":"BT0540","k":"h","cat":"sun","w":"광노화 케어","rom":"gwangnohwa keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"광노화+케어(care)","memofr":"Locution : 광노화 (photovieillissement) + 케어 (angl. care)","note":"Terme technique repris par la publicité des solaires.","mean":"자외선 노출에 의한 피부 노화, 주름, 탄력 저하를 방지하고 예방하는 관리","ex":"자외선으로 인한 피부 손상과 광노화 케어를 동시에 돕습니다.","exfr":"Elle aide à la fois contre les dommages des UV et comme soin contre le photovieillissement.","fr":"soin contre le photovieillissement","frpos":"n.m.","frdef":"Prévention du vieillissement cutané dû aux UV."},{"id":"BT0541","k":"h","cat":"sun","w":"기름종이 선스틱","rom":"gireumjongi seonseutik","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"기름종이+선스틱(sun stick)","memofr":"Locution : 기름종이 (papier matifiant) + 선스틱 (angl. sun stick)","note":"Image publicitaire comparant le produit aux feuilles de papier matifiant.","mean":"기름종이를 사용한 것처럼 기름을 없애준다는 비유적 제품 표현","ex":"피부에 문지르는 순간 기름종이 선스틱처럼 유분기를 싹 잡아줍니다.","exfr":"Dès qu'on le passe sur la peau, il absorbe la brillance comme un stick solaire matifiant.","fr":"stick solaire matifiant","frpos":"n.m.","frdef":"Stick solaire qui absorbe le sébum comme un papier matifiant.","par":"톤업 선크림","rel":"관련어(참고)"},{"id":"BT0542","k":"h","cat":"sun","w":"논나노 무기자차","rom":"nonnano mugijacha","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"논나노(non-nano)+무기자차(축약어)","memofr":"Locution : 논나노 (angl. non-nano) + 무기자차 (solaire minéral, abrév.)","note":"Argument de sécurité ; voir 무기자차.","mean":"입자 크기가 나노 단위보다 크나 피부 속에 직접 흡수되지 않아 더욱 순하고 안전한 무기 자차","ex":"비나노 무기 자외선 차단 필터를 사용한 논나노 무기자차 성분을 적용했습니다.","exfr":"Il utilise des filtres minéraux non nano.","fr":"filtre minéral non nano","frpos":"n.m.","frdef":"Produit de protection solaire contenant des filtres UV minéraux dont les particules sont présentées comme non nanométriques.","ing":"한국어: 입자를 나노 크기 미만으로 만들지 않은 무기 자외선 차단 성분을 썼다는 표시.\nFrançais : Un écran solaire minéral dit « non nano » contient des filtres minéraux dont la forme particulaire est présentée comme non nanométrique; cette mention doit être vérifiée selon les critères réglementaires applicables.","inci":"Zinc Oxide, Titanium Dioxide","par":"무기자차","rel":"관련어(참고)"},{"id":"BT0543","k":"h","cat":"sun","w":"다공성 파우더","rom":"dagongseong paudeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"다공성+파우더(powder)","memofr":"Locution : 다공성 (poreux) + 파우더 (angl. powder)","note":"Terme technique de formulation.","mean":"미세한 구멍이 뚫려 있어 피지나 유분을 흡수하는 파우더 성분","ex":"다공성 파우더 성분이 피지를 효과적으로 잡아주어 하루 종일 보송합니다.","exfr":"La poudre poreuse capte efficacement le sébum : la peau reste mate toute la journée.","fr":"poudre poreuse","frpos":"n.f.","frdef":"Poudre à micro-pores (silice…) qui absorbe le sébum.","ing":"한국어: 미세한 구멍이 많은 파우더(실리카 등). 피지를 흡착해 보송한 마무리를 돕는 원료.\nFrançais : Une poudre poreuse, par exemple à base de silice, possède une structure favorisant l'adsorption du sébum et la réduction de la brillance.","inci":"Silica, Polymethyl Methacrylate"},{"id":"BT0544","k":"h","cat":"sun","w":"달걀귀신","rom":"dalgyalgwisin","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"달걀+귀신","memofr":"Composé : 달걀 (œuf) + 귀신 (fantôme)","note":"Image humoristique et péjorative des avis sur les solaires minéraux.","mean":"백탁이 심해 얼굴만 하얗게 뜨고 눈 코 입 경계가 이상해진 부자연스러운 모습을 비유한 표현","ex":"선크림의 백탁 현상 때문에 달걀귀신처럼 하얗게 질릴 걱정이 없습니다.","exfr":"Pas de risque de finir blanchie comme un « fantôme œuf » à cause des traces blanches de la crème solaire.","fr":"« fantôme œuf » (visage blanchi)","frpos":"n.m.","frdef":"Visage devenu très blanc à cause des traces blanches d'un solaire.","par":"다크닝","rel":"관련어(참고)"},{"id":"BT0545","k":"h","cat":"sun","w":"도자기 결","rom":"dojagi gyeol","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"도자기+결","memofr":"Locution : 도자기 (porcelaine) + 결 (grain)","note":"Variante de 도자기 피부.","mean":"도자기 표면처럼 모공이나 굴곡 없이 깨끗하고 매끄러운 상태","ex":"모공과 요철을 가려 도자기 결처럼 매끈한 피부 바탕을 완성해 줍니다.","exfr":"Il masque pores et irrégularités pour un grain de peau de porcelaine, lisse.","fr":"grain de peau de porcelaine","frpos":"n.m.","frdef":"Peau lisse, sans pores ni relief, comparée à la porcelaine.","par":"꿀피부","rel":"관련어(참고)"},{"id":"BT0547","k":"s","cat":"sun","w":"때처럼 밀리다","rom":"ttaecheoreom millida","pos":"동사","unit":"구","eo":"고유어","form":"구","memo":"때+처럼(조사)+밀리다","memofr":"Locution : 때 (crasse) + 처럼 (comme) + 밀리다 (pelucher)","note":"Comparaison crue mais très courante dans les avis.","mean":"차단제 제형이 흡수되지 못하고 밀릴 때 가루나 때 형태로 나오는 문제","ex":"선크림을 바르고 바로 화장하면 때처럼 밀려서 5분쯤 기다린다.","exfr":"Si je me maquille juste après la crème solaire, tout peluche comme des peaux mortes, alors j'attends cinq minutes.","fr":"pelucher comme des peaux mortes","frpos":"loc.v.","frdef":"Le produit forme des petits rouleaux grisâtres en frottant.","par":"밀리다","rel":"연어"},{"id":"BT0548","k":"h","cat":"sun","w":"리프 세이프","rom":"ripeu seipeu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"reef+safe","memofr":"Locution : 리프 (angl. reef) + 세이프 (angl. safe)","note":"Mention écologique ; à ne pas confondre avec 리프 (« feuille », angl. leaf).","mean":"해양 환경과 산호초 파괴 성분을 차단제에서 제외한 친환경 처방","ex":"산호초와 해양 생태계를 보호하는 리프 세이프 포뮬러를 적용했습니다.","exfr":"Sa formule est conçue pour être respectueuse des coraux.","fr":"respectueux des coraux","frpos":"loc.adj.","frdef":"Allégation indiquant qu’une formule solaire est présentée comme plus respectueuse des récifs, sans garantie universelle d’innocuité."},{"id":"BT0549","k":"h","cat":"sun","w":"매끈 마감","rom":"maekkeun magam","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"매끈(어근)+마감","memofr":"Locution : 매끈 (racine « lisse ») + 마감 (finition)","note":"Formule publicitaire.","mean":"도포 후 피부 표면이 미끄러지듯 깔끔하게 정리되는 감각","ex":"끈적임 없이 스무스하고 매끈하게 마감되어 옷깃에 묻어나지 않습니다.","exfr":"Le fini lisse, sans aucun collant, ne laisse pas de traces sur le col des vêtements.","fr":"fini lisse","frpos":"n.m.","frdef":"Fini qui laisse la peau lisse et nette.","par":"마무리감","rel":"관련어(참고)"},{"id":"BT0551","k":"h","cat":"sun","w":"무결점 피부","rom":"mugyeoljeom pibu","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"무결점+피부","memofr":"Locution : 무결점 (sans défaut) + 피부 (peau)","note":"Idéal esthétique fréquent dans la publicité.","mean":"모공, 요철, 잡티 등이 눈에 띄지 않는 깨끗한 피부 연출 상태","ex":"잡티와 모공을 깔끔하게 가려 무결점 피부 바탕을 만들어 줍니다.","exfr":"Il masque proprement taches et pores pour créer une base de peau sans défaut.","fr":"peau sans défaut","frpos":"n.f.","frdef":"Peau parfaitement unifiée, sans pores ni imperfections visibles.","par":"꿀피부","rel":"관련어(참고)"},{"id":"BT0552","k":"h","cat":"sun","w":"무기 차단 성분","rom":"mugi chadan seongbun","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"무기+차단+성분","memofr":"Locution : 무기 (inorganique) + 차단 (blocage) + 성분 (ingrédient)","note":"Terme technique ; voir 무기자차.","mean":"징크옥사이드, 티타늄디옥사이드 등 빛을 물리적으로 반사하는 성분","ex":"순한 무기 차단 성분이 피부 표면에서 자외선을 흡수·산란시켜 방어합니다.","exfr":"Des filtres minéraux doux protègent en absorbant et en diffusant les UV à la surface de la peau.","fr":"filtre minéral (physique)","frpos":"n.m.","frdef":"Filtres UV inorganiques, notamment l’oxyde de zinc et le dioxyde de titane, qui atténuent les UV principalement par absorption et aussi par diffusion.","ing":"한국어: 징크옥사이드·티타늄디옥사이드처럼 피부 위에서 자외선을 막는 광물성 자외선 차단 성분. 「무기자차」의 기준.\nFrançais : Les filtres UV minéraux sont des substances inorganiques, notamment l'oxyde de zinc et le dioxyde de titane, qui atténuent les UV par absorption et diffusion.","inci":"Zinc Oxide, Titanium Dioxide","par":"무기자차","rel":"관련어(참고)"},{"id":"BT0553","k":"h","cat":"sun","w":"무기자차","rom":"mugijacha","pos":"명사","unit":"단어","eo":"한자어","form":"축약어(두음절어)","memo":"무기+자(외선)+차(단제) 축약","memofr":"Abréviation : 무기 (inorganique) + 자(외선) (UV) + 차(단제) (filtre)","note":"Abréviation très courante ; la paire 무기자차 / 유기자차 structure le choix des solaires en Corée.","mean":"무기 자외선 차단제의 줄임말. 피부 표면에 물리적 방어막을 형성해 자외선을 반사시키는 방식","ex":"민감성 피부도 안심하고 사용할 수 있는 100% 무기자차 선크림입니다.","exfr":"C'est un solaire minéral à 100 % que même les peaux sensibles peuvent utiliser en toute confiance.","fr":"solaire minéral","frpos":"n.m.","frdef":"Abréviation coréenne désignant une protection solaire à filtres UV minéraux, tels que l’oxyde de zinc ou le dioxyde de titane.","par":"자차","rel":"하위어(참고)"},{"id":"BT0554","k":"h","cat":"sun","w":"미세먼지 차단","rom":"misemeonji chadan","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"미세먼지(미세+먼지)+차단","memofr":"Locution : 미세먼지 (particules fines) + 차단 (blocage)","note":"Préoccupation majeure en Corée à cause des épisodes de pollution saisonniers.","mean":"유해 환경 및 미세먼지가 피부 표면에 들러붙는 것을 방지하는 효과","ex":"미세먼지 흡착 방지 테스트를 완료하여 외출 시 피부를 안전하게 보호합니다.","exfr":"Testé contre l'adhésion des particules fines, il assure une protection anti-pollution lors des sorties.","fr":"protection anti-pollution (particules fines)","frpos":"n.f.","frdef":"Effet annoncé contre l'adhérence des particules fines, préoccupation majeure en Corée."},{"id":"BT0556","k":"h","cat":"sun","w":"밀착 퍼프","rom":"milchak peopeu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"밀착+퍼프(puff)","memofr":"Locution : 밀착 (adhérence) + 퍼프 (angl. puff)","note":"Accessoire des cushions et des solaires compacts.","mean":"선쿠션 내용을 흡수해 피부 밀착력을 극대화하도록 제작된 퍼프","ex":"밀착 퍼프로 팡팡 두드려 손에 묻히지 않고 빠르게 선 케어가 가능합니다.","exfr":"En tapotant avec la houppette adhérente, on protège vite sa peau du soleil sans se salir les mains.","fr":"houppette adhérente","frpos":"n.f.","frdef":"Houppette conçue pour un fini très adhérent du cushion."},{"id":"BT0557","k":"h","cat":"sun","w":"밀착 피팅","rom":"milchak piting","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"밀착+피팅(fitting)","memofr":"Locution : 밀착 (adhérence) + 피팅 (angl. fitting)","note":"Image empruntée à l'habillement.","mean":"피부 곡선 및 틈새에 얇고 완벽하게 착 달라붙는 작용","ex":"들뜸 없이 착 감기는 우수한 밀착 피팅 텍스처를 선사합니다.","exfr":"Une texture qui épouse parfaitement la peau, sans se soulever, pour un fini seconde peau.","fr":"fini seconde peau","frpos":"n.m.","frdef":"Produit qui épouse parfaitement les reliefs de la peau.","par":"밀착력","rel":"관련어(참고)"},{"id":"BT0558","k":"h","cat":"sun","w":"밀크 텍스처","rom":"milkeu tekseucheo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"milk+texture","memofr":"Locution : 밀크 (angl. milk) + 텍스처 (angl. texture)","note":"Synonyme de 밀키 텍스처.","mean":"우유처럼 찰랑거리고 부드럽게 펼쳐지는 질감","ex":"부드러운 밀크 텍스처로 피부에 얇고 매끈하게 펴 발라집니다.","exfr":"Sa texture lait, douce, s'étale en couche fine et lisse.","fr":"texture lait","frpos":"n.f.","frdef":"Texture fluide et laiteuse."},{"id":"BT0561","k":"s","cat":"sun","w":"백탁 현상","rom":"baektak hyeonsang","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"백탁+현상 (선케어 문맥의 다의 항목)","memofr":"Locution : 백탁 (blanchiment trouble) + 현상 (phénomène)","note":"Défaut principal reproché aux solaires minéraux ; voir aussi 달걀귀신.","mean":"선크림을 바른 뒤 피부 표면이 하얗게 들뜨거나 얼룩지는 현상","ex":"무기자차를 발랐더니 얼굴이 하얗게 뜨는 백탁 현상이 생겼다.","exfr":"Après une crème solaire minérale, mon visage est devenu tout blanc, avec des traces blanches.","fr":"traces blanches (crème solaire)","frpos":"n.f.pl.","frdef":"Voile ou traces blanchâtres que laisse sur la peau une crème solaire, surtout à filtres minéraux.","par":"백탁 현상","rel":"다의 항목(뜻 2)"},{"id":"BT0563","k":"h","cat":"sun","w":"비건 인증","rom":"bigeon injeung","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"비건(vegan)+인증","memofr":"Locution : 비건 (angl. vegan) + 인증 (certification)","note":"Mention en forte croissance sur le marché coréen.","mean":"동물성 원료를 사용하지 않고 동물실험을 하지 않았음을 증명하는 인증","ex":"한국비건정식인증원에서 비건 인증을 완료한 순한 선스틱입니다.","exfr":"Un stick solaire doux, certifié vegan par l'organisme coréen de certification vegan.","fr":"certification vegan","frpos":"n.f.","frdef":"Certification attestant, selon son référentiel, l’absence d’ingrédients d’origine animale; les exigences relatives aux tests varient."},{"id":"BT0565","k":"h","cat":"sun","w":"선 파우더","rom":"seon paudeo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"sun+powder","memofr":"Locution : 선 (angl. sun) + 파우더 (angl. powder)","note":"Sert surtout à réappliquer le solaire par-dessus le maquillage.","mean":"파우더 형태로 유분을 흡수하며 차단력을 주는 제품","ex":"번들거리는 피지를 잡으면서 자외선을 차단해 주는 파우더 팩트입니다.","exfr":"Une poudre solaire qui capte le sébum brillant tout en protégeant des UV.","fr":"poudre solaire","frpos":"n.f.","frdef":"Poudre libre avec filtres UV, pour retoucher la protection.","par":"톤업 선크림","rel":"관련어(참고)"},{"id":"BT0566","k":"h","cat":"sun","w":"선 파우더 팩트","rom":"seon paudeo paekteu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"sun+powder+pact","memofr":"Locution : 선 (angl. sun) + 파우더 (angl. powder) + 팩트 (de l'angl. compact)","note":"팩트 est une troncation coréenne de « compact ».","mean":"파우더를 가공하여 고체 용기에 담아 퍼프로 바르는 차단 도구","ex":"피부에 톡톡 두드려 유분을 잡고 자외선 차단력까지 챙길 수 있습니다.","exfr":"Cette poudre solaire compacte, tapotée sur la peau, matifie et protège du soleil en même temps.","fr":"poudre solaire compacte","frpos":"n.f.","frdef":"Poudre solaire 80","k":"h","cat":"sun","w":"선크림 뭉침","rom":"seonkeurim mungchim","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"선크림+뭉침(뭉치다+-ㅁ)","memofr":"Locution : 선크림 (crème solaire) + 뭉침 (agglomération)","note":"Souvent dû à une mauvaise compatibilité avec la crème appliquée avant.","mean":"제품 제형이 고르게 펴지지 않고 한곳에 덩어리져 남아있는 문제","ex":"피부 결을 따라 얇게 바르지 않으면 선크림 뭉침 현상이 생길 수 있습니다.","exfr":"Si l'on ne l'applique pas en couche fine dans le sens du grain de peau, on risque un solaire qui fait des paquets.","fr":"solaire qui fait des paquets","frpos":"n.m.","frdef":"Solaire qui s'accumule par endroits au lieu de s'étaler.","par":"뭉침","rel":"관련어(참고)"},{"id":"BT0581","k":"h","cat":"sun","w":"선패치","rom":"seonpaechi","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"sun+patch","memofr":"Composé : 선 (angl. sun) + 패치 (angl. patch)","note":"Accessoire popularisé par les golfeuses coréennes.","mean":"야외 활동 시 자외선에 취약한 얼굴 피부 부위에 직접 붙이는 패치 형태의 차단 도구","ex":"야외 활동 시 자극받기 쉬운 광대 부위에 붙이는 쿨링 선패치입니다.","exfr":"Un patch solaire rafraîchissant à coller sur les pommettes, zone exposée lors des activités en plein air.","fr":"patch solaire","frpos":"n.m.","frdef":"Patch anti-UV collé sur le visage lors d'activités en plein air (golf…).","par":"트러블 패치","rel":"관련어(참고)"},{"id":"BT0582","k":"h","cat":"sun","w":"선플루이드","rom":"seonpeulluideu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"sun+fluid","memofr":"Composé : 선 (angl. sun) + 플루이드 (angl. fluid)","note":"Format proche des fluides solaires français.","mean":"묽은 유액 형태의 부드러운 자외선 차단제","ex":"밀크 타입의 묽은 제형으로 가볍게 퍼지는 톤업 선플루이드입니다.","exfr":"Un fluide solaire tone-up à la texture laiteuse fluide, qui s'étale légèrement.","fr":"fluide solaire","frpos":"n.m.","frdef":"Solaire très fluide et léger.","par":"톤업 선크림","rel":"관련어(참고)"},{"id":"BT0583","k":"h","cat":"sun","w":"수분 선크림","rom":"subun seonkeurim","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"수분+선크림(sun cream)","memofr":"Locution : 수분 (hydratation) + 선크림 (crème solaire)","note":"Catégorie apprécié t":"sun","w":"수분막","rom":"subunmak","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"수분+막","memofr":"Composé : 수분 (eau) + 막 (film, membrane)","note":"Proche de 보습막.","mean":"수분이 날아가 건조해지는 것을 가로막는 촉촉한 보호 레이어","ex":"피부 겉면에 촘촘한 수분막을 형성하여 수분 증발을 차단합니다.","exfr":"Il forme un film d'eau protecteur dense à la surface de la peau et bloque l'évaporation.","fr":"film d'eau protecteur","frpos":"n.m.","frdef":"Couche hydratante qui empêche la peau de se dessécher."},{"id":"BT0588","k":"h","cat":"sun","w":"스무딩","rom":"seumuding","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"smoothing 차용","memofr":"Emprunt à l'anglais smoothing","note":"Allégation des primers et des solaires.","mean":"뻑뻑함 없이 피부 표면을 부드럽게 미끄러지듯 펴 발라지는 촉감","ex":"피부에 부드럽게 미끄러지듯 매끈하게 결을 정돈해 주는 스무딩 제형입니다.","exfr":"Une texture à effet lissant qui glisse sur la peau et en affine le grain.","fr":"effet lissant","frpos":"n.m.","frdef":"Glisse et lissage de la surface de la peau."},{"id":"BT0590","k":"h","cat":"sun","w":"스킨케어 밀착","rom":"seukinkeeo milchak","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"스킨케어+밀착","memofr":"Locution : 스킨케어 (angl. skincare) + 밀착 (adhérence)","note":"Formule publicitaire des solaires « comme un soin ».","mean":"스킨케어 제품을 잘 바른 것처럼 들뜸 없이 고르게 안착되는 기능","ex":"이 선크림은 스킨케어 밀착이 좋아서 화장이 밀리지 않는다.","exfr":"Cette crème solaire offre une adhérence « comme un soin » : le maquillage ne bouloche pas.","fr":"adhérence « comme un soin »","frpos":"n.f.","frdef":"Le solaire s'applique et adhère comme un soin, sans se décoller.","par":"밀착력","rel":"관련어(참고)"},{"id":"BT0591","k":"h","cat":"sun","w":"스킨케어링","rom":"seukinkeeoring","pos":"명사","unit":"단어","eo":"외래어","form":"파생어","memo":"skincare+-ing(한국식 조어)","memofr":"Dérivé : 스킨케어 (angl. skincare) + -ing (suffixe anglais), formation coréenne","note":"Faux anglicisme coréen.","mean":"자외선 차단 기능과 스킨케어의 보습·영양 효능이 합쳐진 특성","ex":"자외선 차단과 동시에 수분 진정과 장벽 케어를 돕는 스킨케어링 선크림입니다.","exfr":"Une crème solaire « effet soin » qui protège des UV tout en hydratant, apaisant et soignant la barrière cutanée.","fr":"effet soin (solaire)","frpos":"n.m.","frdef":"Solaire qui apporte aussi les bénéfices d'un soin hydratant."},{"id":"BT0593","k":"h","cat":"sun","w":"스틱 바","rom":"seutik ba","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"stick+bar","memofr":"Locution : 스틱 (angl. stick) + 바 (angl. bar)","note":"Pléonasme marketing.","mean":"문지르기 편리하도록 특정 모양(곡선, 물방울)으로 굳힌 스틱 형태","ex":"얼굴 굴곡에 완벽하게 밀착되도록 곡선형으로 설계된 스틱 바 제품입니다.","exfr":"Un stick au format barre, incurvé pour épouser parfaitement les reliefs du visage.","fr":"stick (format barre)","frpos":"n.m.","frdef":"Format de stick solide modelé pour faciliter l'application."},{"id":"BT0594","k":"h","cat":"sun","w":"슬림 밀착","rom":"seullim milchak","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"슬림(slim)+밀착","memofr":"Locution : 슬림 (angl. slim) + 밀착 (adhérence)","note":"Formule publicitaire.","mean":"피부에 가볍고 매우 얇게 밀착되어 부담이 없는 상태","ex":"두껍지 않게 얇고 슬림 밀착되어 자연스러운 톤업을 완성합니다.","exfr":"Grâce à son adhérence ultra-fine, sans épaisseur, il offre un effet illuminateur naturel.","fr":"adhérence ultra-fine","frpos":"n.f.","frdef":"Produit qui adhère en couche très fine et légère.","par":"밀착력","rel":"관련어(참고)"},{"id":"BT0595","k":"h","cat":"sun","w":"시카 선크림","rom":"sika seonkeurim","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"cica+sun cream","memofr":"Locution : 시카 (cica, centella) + 선크림 (crème solaire)","note":"Combinaison apaisement et protection, typique du marché coréen.","mean":"시카(병풀) 성분이 포함되어 진정 케어를 돕는 자외선 차단제","ex":"민감해진 붉은 피부를 진정시키고 보정해 주는 진정 시카 선크림입니다.","exfr":"Une crème solaire cica apaisante qui calme et corrige les rougeurs de la peau sensibilisée.","fr":"crème solaire cica","frpos":"n.f.","frdef":"Solaire contenant de la centella pour apaiser.","par":"톤업 선크림","rel":"관련어(참고)"},{"id":"BT0599","k":"h","cat":"sun","w":"안심 자차","rom":"ansim jacha","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"안심+자차(축약어)","memofr":"Locution : 안심 (rassurant) + 자차 (solaire, abrév.)","note":"Formule publicitaire pour les peaux sensibles et les enfants.","mean":"민감 피부나 트러블 피부도 자극 우려 없이 안심하고 바르는 차단제","ex":"여드름성 피부 사용 적합 테스트를 거쳐 민감성 피부도 안심하고 쓸 수 있습니다.","exfr":"Testé sur peau à tendance acnéique, c'est un solaire « rassurant » que même les peaux sensibles peuvent utiliser.","fr":"solaire « rassurant » (doux)","frpos":"n.m.","frdef":"Expression promotionnelle désignant une protection solaire présentée comme douce ou adaptée aux peaux sensibles.","par":"자차","rel":"하위어(참고)"},{"id":"BT0600","k":"h","cat":"sun","w":"안티에이징 선","rom":"antieijing seon","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"anti-aging+sun","memofr":"Locution : 안티에이징 (angl. anti-aging) + 선 (angl. sun)","note":"Allégation combinée fréquente.","mean":"자외선 방어와 동시에 피부 탄력 및 주름 관리를 해주는 복합 기능","ex":"자외선 차단은 물론 주름 개선 효과까지 겸비한 안티에이징 선크림입니다.","exfr":"Une crème solaire anti-âge qui protège des UV et atténue aussi les rides.","fr":"solaire anti-âge","frpos":"n.m.","frdef":"Solaire qui associe protection UV et soin anti-âge.","par":"톤업 선크림","rel":"관련어(참고)"},{"id":"BT0601","k":"h","cat":"sun","w":"에어리","rom":"eeori","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"airy 차용","memofr":"Emprunt à l'anglais airy","note":"Adjectif de texture des avis.","mean":"공기처럼 무게감이 거의 느껴지지 않는 극상의 가벼운 사용감","ex":"공기처럼 가볍고 끈적임 없이 착 밀착되는 에어리 텍스처입니다.","exfr":"Une texture aérienne, légère comme l'air, qui adhère sans coller.","fr":"aérien (texture)","frpos":"adj.","frdef":"Texture si légère qu'on ne la sent presque pas."},{"id":"BT0602","k":"h","cat":"sun","w":"열자극 케어","rom":"yeoljageuk keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"열자극+케어(care)","memofr":"Locution : 열자극 (agression par la chaleur) + 케어 (angl. care)","note":"Notion propre au marketing coréen (« vieillissement par la chaleur »).","mean":"직사광선 열기로 인한 피부 자극과 열감을 진정 완화시키는 기능","ex":"자외선과 직사광선으로 인한 피부 열자극 케어 임상을 완료했습니다.","exfr":"Testée cliniquement comme soin contre l'échauffement cutané causé par les UV et le soleil direct.","fr":"soin contre l'échauffement cutané","frpos":"n.m.","frdef":"Apaiser la chaleur et l'irritation dues au soleil."},{"id":"BT0603","k":"h","cat":"sun","w":"오일 컨트롤","rom":"oil keonteurol","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"oil+control","memofr":"Locution : 오일 (angl. oil) + 컨트롤 (angl. control)","note":"Allégation des produits pour peaux grasses.","mean":"피부 유분 분비 및 번들거림을 억제하고 잡아주는 제어 기능","ex":"피지 흡착 파우더를 함유하여 하루 종일 우수한 오일 컨트롤 성능을 보여줍니다.","exfr":"Grâce à une poudre absorbant le sébum, il assure un excellent contrôle du sébum toute la journée.","fr":"contrôle du sébum","frpos":"n.m.","frdef":"Régulation de la brillance et de la production de sébum."},{"id":"BT0604","k":"h","cat":"sun","w":"오일 컷","rom":"oil keot","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"oil+cut","memofr":"Locution : 오일 (angl. oil) + 컷 (angl. cut)","note":"Faux anglicisme ; il s'agit d'une formule marketing.","mean":"피부 표면에 겉도는 피지나 오일감을 제거하는 효과","ex":"피부의 번들거리는 유분을 싹 지워주는 오일 컷 선스틱입니다.","exfr":"Un stick solaire anti-brillance qui efface tout le gras luisant de la peau.","fr":"anti-brillance","frpos":"adj.","frdef":"Formule marketing: élimination du gras en surface."},{"id":"BT0605","k":"h","cat":"sun","w":"유기 차단 성분","rom":"yugi chadan seongbun","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"유기+차단+성분","memofr":"Locution : 유기 (organique) + 차단 (blocage) + 성분 (ingrédient)","note":"Ici, « organique » est un terme de chimie : rien à voir avec le « bio ».","mean":"자외선을 화학적으로 흡수하여 열 형태로 방출시키는 차단 성분","ex":"유기 차단 성분이 자외선을 스무스하게 흡수하여 흡수한 자외선 에너지를 주로 열로 방출합니다.","exfr":"Les filtres chimiques absorbent les UV en douceur et libèrent principalement cette énergie sous forme de chaleur.","fr":"filtre chimique (organique)","frpos":"n.m.","frdef":"Filtres UV organiques qui absorbent le rayonnement ultraviolet et dissipent l’énergie absorbée.","ing":"한국어: 자외선을 흡수해 열 등으로 바꾸는 화학적 자외선 차단 성분. 「유기자차」의 기준.\nFrançais : Les filtres UV organiques sont des molécules carbonées qui absorbent certaines longueurs d'onde ultraviolettes et dissipent l'énergie absorbée.","inci":"Ethylhexyl Methoxycinnamate, Octocrylene","par":"유기자차","rel":"관련어(참고)"},{"id":"BT0606","k":"h","cat":"sun","w":"유기자차","rom":"yugijacha","pos":"명사","unit":"단어","eo":"한자어","form":"축약어(두음절어)","memo":"유기+자(외선)+차(단제) 축약","memofr":"Abréviation : 유기 (organique) + 자(외선) (UV) + 차(단제) (filtre)","note":"Pendant de 무기자차 ; plus confortable, mais parfois accusé de piquer les yeux.","mean":"유기 자외선 차단제의 줄임말. 자외선을 피부에 흡수한 뒤 열로 방출시키는 화학적 차단 방식","ex":"백탁 현상 없이 촉촉하게 흡수되는 수분 베이스 유기자차 선크림입니다.","exfr":"Une crème solaire à filtres chimiques, base aqueuse, qui pénètre sans laisser de traces blanches.","fr":"solaire à filtres chimiques","frpos":"n.m.","frdef":"Abréviation coréenne désignant un solaire contenant des filtres UV organiques qui absorbent les UV.","par":"자차","rel":"하위어(참고)"},{"id":"BT0607","k":"s","cat":"sun","w":"유분 겉돎","rom":"yubun geotdom","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"유분+겉돌음(겉돌다+-음)","memofr":"Locution : 유분 (gras) + 겉돎 (fait de rester en surface)","note":"Défaut fréquent des solaires riches.","mean":"선크림 유분 성분이 흡수되지 못하고 표면에 기름막으로 떠 있는 상태","ex":"피부에 바른 후 유분 겉돌음이 없어 바로 메이크업을 하기 좋습니다.","exfr":"Il ne laisse pas de film gras en surface : on peut se maquiller tout de suite.","fr":"film gras en surface","frpos":"n.m.","frdef":"Les huiles du solaire restent en surface au lieu d'être absorbées.","par":"겉돌다","rel":"연어"},{"id":"BT0609","k":"h","cat":"sun","w":"이지워시","rom":"ijiwosi","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"easy+wash","memofr":"Composé : 이지 (angl. easy) + 워시 (angl. wash)","note":"Allégation de démaquillage facile.","mean":"강한 오일 클렌징 없이 가벼운 세안만으로 깨끗이 씻기는 특성","ex":"1차 세안만으로도 잔여물 없이 말끔하게 지워지는 이지워시 처방 제품입니다.","exfr":"Une formule rinçable à l'eau qui s'élimine sans résidu dès le premier nettoyage.","fr":"rinçable à l'eau","frpos":"loc.adj.","frdef":"Solaire qui s'élimine avec un nettoyant doux, sans double nettoyage."},{"id":"BT0610","k":"h","cat":"sun","w":"인생 선크림","rom":"insaeng seonkeurim","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"인생+선크림","memofr":"Locution : 인생 (vie) + 선크림 (crème solaire)","note":"Superlatif d'avis ; même modèle : 인생템.","mean":"살면서 써본 자외선 차단제 중 가장 만족스러워 굳혀 쓰는 제품을 뜻함","ex":"눈시림이 없고 끈적이지 않아 제 인생 선크림으로 정착했습니다.","exfr":"Il ne pique pas les yeux et ne colle pas : c'est devenu le meilleur solaire de ma vie.","fr":"meilleur solaire de sa vie","frpos":"n.m.","frdef":"Le solaire préféré, qu'on rachète toujours.","par":"인생템","rel":"관련어(참고)"},{"id":"BT0613","k":"h","cat":"sun","w":"자외선 차단막","rom":"jaoeseon chadanmak","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"자외선+차단막","memofr":"Locution : 자외선 (ultraviolet) + 차단막 (écran)","note":"Image publicitaire.","mean":"자외선이 피부 표면으로 침투하지 못하도록 막는 외부 보호 레이어","ex":"피부 표면에 촘촘한 자외선 차단막을 형성하여 UV를 방어합니다.","exfr":"Il forme un bouclier anti-UV dense à la surface de la peau.","fr":"bouclier anti-UV","frpos":"n.m.","frdef":"Protection apportée par un produit solaire qui réduit la quantité de rayonnement UV atteignant la peau."},{"id":"BT0615","k":"h","cat":"sun","w":"자차","rom":"jacha","pos":"명사","unit":"단어","eo":"한자어","form":"축약어(두음절어)","memo":"자(외선)+차(단제) 축약","memofr":"Abréviation syllabique : 자(외선) (UV) + 차(단제) (filtre)","note":"Mot du quotidien ; base de 무기자차, 유기자차 et 혼합자차.","mean":"자외선 차단제의 축약어","ex":"데일리로 부담 없이 바르기 좋은 촉촉한 데일리 자차 추천 제품입니다.","exfr":"Un solaire hydratant que je recommande pour une application quotidienne sans contrainte.","fr":"solaire (abrév.)","frpos":"n.m.","frdef":"Abréviation familière de « jaoeseon chadanje » (protection solaire)."},{"id":"BT0618","k":"h","cat":"sun","w":"진정 시카","rom":"jinjeong sika","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"진정+시카(cica)","memofr":"Locution : 진정 (apaisement) + 시카 (cica)","note":"Formule publicitaire.","mean":"병풀 추출물 등 피부 자극 진정에 도움을 주는 성분 조합","ex":"자극받은 피부를 편안하게 다독여주는 진정 시카 성분이 들어 있습니다.","exfr":"Il contient de l'extrait de cica pour un apaisement cica des peaux irritées.","fr":"apaisement cica","frpos":"n.m.","frdef":"Association d'actifs apaisants à base de centella.","par":"시카","rel":"관련어(참고)"},{"id":"BT0619","k":"h","cat":"sun","w":"진정 케어","rom":"jinjeong keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"진정+케어(care)","memofr":"Locution : 진정 (apaisement) + 케어 (angl. care)","note":"Formule générique des fiches produit.","mean":"햇빛으로 화끈거리거나 자극받은 피부를 평온하게 가라앉히는 효과","ex":"자극받은 민감 피부를 부드럽게 다독여주는 진정 케어 선크림입니다.","exfr":"Une crème solaire au soin apaisant, qui calme en douceur les peaux sensibles irritées.","fr":"soin apaisant","frpos":"n.m.","frdef":"Soin destiné à calmer une peau irritée ou échauffée."},{"id":"BT0621","k":"h","cat":"sun","w":"착붙","rom":"chakbut","pos":"명사","unit":"단어","eo":"고유어","form":"축약어(두음절어)","memo":"착(부사)+붙(다) 축약","memofr":"Abréviation syllabique : 착 (adverbe « parfaitement ») + 붙(다) (coller)","note":"Argot très courant ; il s'utilise aussi hors du domaine de la beauté.","mean":"'착 붙는다'의 축약어로 피부 표면에 들뜸 없이 밀착된 상태","ex":"베이스 메이크업이 들뜸 없이 피부에 완벽하게 착붙하도록 돕습니다.","exfr":"Grâce à lui, on obtient un maquillage de base qui colle parfaitement à la peau, sans se soulever.","fr":"« qui colle parfaitement »","frpos":"loc.adj.","frdef":"Abréviation de « chak butda » (coller parfaitement) : adhère parfaitement à la peau ; par extension, qui va à merveille."},{"id":"BT0625","k":"h","cat":"sun","w":"쿨링감","rom":"kullinggam","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"쿨링(cooling)+-감","memofr":"Dérivé : 쿨링 (angl. cooling) + -감 (suffixe « sensation »)","note":"Mot d'avis ; voir 쿨링.","mean":"피부에 도포하는 즉시 시원함을 느끼게 하고 피부 열을 내리는 감각","ex":"달아오른 피부 온도를 빠르게 낮춰주는 즉각적인 쿨링감을 선사합니다.","exfr":"Il procure une sensation de fraîcheur immédiate qui fait vite baisser la température de la peau échauffée.","fr":"sensation de fraîcheur","frpos":"n.f.","frdef":"Fraîcheur ressentie immédiatement à l'application.","par":"쿨링","rel":"관련어(참고)"},{"id":"BT0626","k":"h","cat":"sun","w":"톤업 선크림","rom":"toneop seonkeurim","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"tone-up+sun cream","memofr":"Locution : 톤업 (tone-up) + 선크림 (crème solaire)","note":"Très populaire en Corée ; laisse souvent un léger voile blanc.","mean":"자외선 차단과 함께 피부를 밝게 보이도록 표현하는 선크림 유형.","ex":"파운데이션 대신 가볍게 톤업 선크림을 바르면 자연스러운 연출이 가능합니다.","exfr":"En remplaçant le fond de teint par une crème solaire tone-up, on obtient un rendu naturel.","fr":"crème solaire tone-up","frpos":"n.f.","frdef":"Solaire teinté qui éclaircit instantanément le teint, alternative au fond de teint."},{"id":"BT0627","k":"h","cat":"sun","w":"투명 윤기","rom":"tumyeong yungi","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"투명+윤기","memofr":"Locution : 투명 (transparent) + 윤기 (lustre)","note":"Formule publicitaire.","mean":"인위적 하얀 백탁 대신 피부 맑음을 살리며 빛나는 촉촉함","ex":"텁텁한 백탁이 아닌 맑고 투명한 윤기를 연출해 줍니다.","exfr":"Il donne un éclat clair et translucide, sans voile blanc pâteux.","fr":"éclat translucide","frpos":"n.m.","frdef":"Lumière naturelle et transparente, sans voile blanc.","par":"속광","rel":"관련어(참고)"},{"id":"BT0628","k":"h","cat":"sun","w":"투명 픽싱","rom":"tumyeong piksing","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"투명+픽싱(fixing)","memofr":"Locution : 투명 (transparent) + 픽싱 (angl. fixing)","note":"Allégation des poudres et des fixateurs.","mean":"제형 본연의 색상 없이 피부에 투명하게 발려 고정되는 효과","ex":"백탁이나 겉색 없이 피부에 깔끔하게 투명 픽싱되는 데일리 자차입니다.","exfr":"Un solaire du quotidien à fixation invisible, sans traces blanches ni couleur en surface.","fr":"fixation invisible","frpos":"n.f.","frdef":"Produit incolore qui fixe sans laisser de couleur."},{"id":"BT0629","k":"h","cat":"sun","w":"파데 프리","rom":"pade peuri","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"파데(파운데이션 축약)+프리(free)","memofr":"Locution : 파데 (abrév. de fond de teint) + 프리 (angl. free)","note":"Tendance du maquillage minimal.","mean":"파운데이션 없이 톤업 선크림만으로 피부 바탕 정돈을 끝내는 방식","ex":"파운데이션 없이 이거 하나로 파데 프리 메이크업을 완벽하게 완성합니다.","exfr":"Ce seul produit suffit pour un maquillage sans fond de teint.","fr":"sans fond de teint","frpos":"loc.adj.","frdef":"Remplacer le fond de teint par un solaire tone-up ou une base légère.","par":"파데","rel":"관련어(참고)"},{"id":"BT0630","k":"h","cat":"sun","w":"파우더리 마감","rom":"paudeori magam","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"파우더리(powdery)+마감","memofr":"Locution : 파우더리 (angl. powdery) + 마감 (finition)","note":"Décrit un fini, non un produit en poudre.","mean":"바른 후 파우더를 바른 것처럼 매끈하고 건조하게 정돈되는 느낌","ex":"유분감 없이 파우더리 마감되어 피부가 하루 종일 매끈보송합니다.","exfr":"Fini poudré sans aucun gras : la peau reste lisse et veloutée toute la journée.","fr":"fini poudré","frpos":"n.m.","frdef":"Fini sec et velouté comme après une poudre.","par":"보송하다","rel":"관련어(참고)"},{"id":"BT0632","k":"h","cat":"sun","w":"퍼핑하다","rom":"peopinghada","pos":"동사","unit":"단어","eo":"혼종어","form":"파생어","memo":"퍼핑(puffing)+-하다","memofr":"Dérivé : 퍼핑 (angl. puffing) + -하다 (suffixe verbal)","note":"Faux anglicisme ; on tapote, on ne frotte pas.","mean":"선쿠션 퍼프에 내용을 묻혀 피부 표면에 가볍게 찍어 바르다.","ex":"외출 전 선쿠션 퍼핑 몇 번으로 손쉽게 자외선 차단막을 완성합니다.","exfr":"Il suffit d'appliquer à la houppette quelques touches de cushion solaire avant de sortir pour former un écran anti-UV.","fr":"appliquer à la houppette","frpos":"loc.v.","frdef":"Déposer le produit par petites pressions de houppette."},{"id":"BT0634","k":"h","cat":"sun","w":"피부 릴랙싱","rom":"pibu rillaeksing","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"피부+릴랙싱(relaxing)","memofr":"Locution : 피부 (peau) + 릴랙싱 (angl. relaxing)","note":"Formule publicitaire.","mean":"햇빛으로 자극받은 피부 스트레스를 완화하고 편안하게 만드는 효과","ex":"자외선으로 피로해진 피부에 시원한 수분감과 피부 릴랙싱을 전달합니다.","exfr":"Il apporte fraîcheur hydratante et détente à la peau fatiguée par les UV.","fr":"détente de la peau","frpos":"n.f.","frdef":"Formule marketing: apaiser une peau stressée par le soleil."},{"id":"BT0635","k":"h","cat":"sun","w":"피부 열감","rom":"pibu yeolgam","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"피부+열감","memofr":"Locution : 피부 (peau) + 열감 (sensation de chaleur)","note":"Préoccupation récurrente du marketing coréen.","mean":"자외선이나 햇빛 노출로 인해 피부 온도가 높아져 뜨거워진 상태","ex":"외부 자외선으로 인해 오른 피부 열감을 즉각적으로 완화시켜 줍니다.","exfr":"Il atténue immédiatement l'échauffement cutané dû aux UV.","fr":"échauffement cutané","frpos":"n.m.","frdef":"Sensation de chaleur de la peau après exposition au soleil."},{"id":"BT0636","k":"h","cat":"sun","w":"피부 자극 테스트","rom":"pibu jageuk teseuteu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"피부+자극+테스트(test)","memofr":"Locution : 피부 (peau) + 자극 (irritation) + 테스트 (angl. test)","note":"Mention fréquente sur les emballages.","mean":"피부 반응도를 측정하여 자극이 현저히 적음을 검증한 임상 시험","ex":"민감성 피부 대상 피부 자극 테스트를 완료하여 자극 없이 순하게 사용할 수 있습니다.","exfr":"Il est présenté comme conçu pour limiter l'irritation, un test d'irritation cutanée ayant été réalisé sur peaux sensibles.","fr":"test d'irritation cutanée","frpos":"n.m.","frdef":"Test évaluant les réactions cutanées ou le potentiel irritant d’un produit selon un protocole défini."},{"id":"BT0637","k":"h","cat":"sun","w":"피부 정돈","rom":"pibu jeongdon","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"피부+정돈","memofr":"Locution : 피부 (peau) + 정돈 (mise en ordre)","note":"Formule générique des toners.","mean":"피부 표면의 결점, 굴곡, 불균일한 톤을 단정하게 정돈하는 작용","ex":"피부결과 톤을 깔끔하게 정돈해 주는 선베이스입니다.","exfr":"Une base solaire pour l'unification de la peau, du grain comme du teint.","fr":"unification de la peau","frpos":"n.f.","frdef":"Rendre la texture et le teint plus réguliers."},{"id":"BT0638","k":"h","cat":"sun","w":"피지 흡착","rom":"piji heupchak","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"피지+흡착","memofr":"Locution : 피지 (sébum) + 흡착 (adsorption)","note":"Terme technique repris par la publicité.","mean":"파우더 성분이 표면 피지와 유분을 빨아들여 마무리를 깔끔하게 만드는 효과","ex":"다공성 파우더 성분이 피지 흡착을 도와 번들거리는 유분을 잡아줍니다.","exfr":"La poudre poreuse aide à absorber le sébum et à matifier la brillance.","fr":"absorption du sébum","frpos":"n.f.","frdef":"Les poudres captent le sébum de surface."},{"id":"BT0640","k":"h","cat":"sun","w":"혼합자차","rom":"honhapjacha","pos":"명사","unit":"단어","eo":"한자어","form":"축약어(두음절어)","memo":"혼합+자차(축약어)","memofr":"Abréviation : 혼합 (mélange) + 자차 (solaire, abrév.)","note":"Troisième terme de la série 무기자차 / 유기자차.","mean":"무기자차와 유기자차 성분을 적절히 혼합하여 장점만을 결합한 자외선 차단제","ex":"무기자차의 순함과 유기자차의 발림성을 결합한 스마트 혼합자차 제품입니다.","exfr":"Un solaire malin à filtres mixtes, qui allie la douceur du minéral à l'étalement du chimique.","fr":"solaire à filtres mixtes","frpos":"n.m.","frdef":"Solaire combinant filtres minéraux et chimiques.","par":"자차","rel":"하위어(참고)"},{"id":"BT0646","k":"h","cat":"base","w":"각질부각","rom":"gakjilbugak","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"각질+부각","memofr":"Composé : 각질 (peaux mortes) + 부각 (mise en relief)","note":"Défaut redouté sur les peaux sèches.","mean":"베이스 메이크업이 각질을 가리지 못하고 오히려 도드라지게 보이게 하는 현상.","ex":"매트한 제형의 립스틱을 발랐더니 들뜬 각질부각이 심하게 느껴졌습니다.","exfr":"Avec un rouge à lèvres mat, j'ai eu des peaux mortes accentuées, très visibles.","fr":"peaux mortes accentuées","frpos":"n.f.pl.","frdef":"Le maquillage souligne les squames au lieu de les masquer.","par":"뜨다","rel":"관련어(참고)"},{"id":"BT0649","k":"h","cat":"base","w":"겉광","rom":"geotgwang","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"겉-(접두사)+광","memofr":"Dérivé : 겉- (préfixe « surface ») + 광 (éclat)","note":"S'oppose à 속광 ; nuance plutôt négative.","mean":"피부 표면에만 도는 광, 특히 유분에 의한 번들거림(↔속광).","ex":"속건조는 잡히지 않고 피부 겉에만 기름진 겉광이 도는 제형입니다.","exfr":"Une texture qui ne règle pas la déshydratation profonde et ne laisse qu'une brillance grasse en surface.","fr":"brillance de surface","frpos":"n.f.","frdef":"Brillance superficielle (souvent grasse), opposée à l'éclat interne (sokgwang).","par":"속광","rel":"관련어(참고)"},{"id":"BT0650","k":"h","cat":"base","w":"결커버","rom":"gyeolkeobeo","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"결(고유어)+커버(cover)","memofr":"Composé : 결 (grain) + 커버 (angl. cover)","note":"Formule marketing des primers.","mean":"요철·모공 등 피부결의 고르지 않은 부분을 가려 매끈하게 보이게 함.","ex":"모공과 잔주름 등 도드라진 피부 결커버에 탁월한 프리미엄 베이스입니다.","exfr":"Une base haut de gamme qui excelle à camoufler le grain de peau marqué (pores, ridules).","fr":"camouflage du grain de peau","frpos":"n.m.","frdef":"Effet qui lisse et masque les irrégularités de texture.","par":"커버력","rel":"하위어(참고)"},{"id":"BT0653","k":"h","cat":"base","w":"글로우","rom":"geullou","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"glow 차용","memofr":"Emprunt à l'anglais glow","note":"Mot très courant dans la publicité ; synonyme anglais de 광.","mean":"피부가 안에서부터 빛나는 듯한 촉촉한 광, 또는 그런 마무리.","ex":"피부에 매끈하고 은은한 글로우 광채를 표현해 주는 쿠션입니다.","exfr":"Un cushion qui donne à la peau un fini lumineux, lisse et subtil.","fr":"fini lumineux","frpos":"n.m.","frdef":"Fini éclatant et lumineux du teint.","par":"세미매트","rel":"관련어(참고)"},{"id":"BT0654","k":"h","cat":"base","w":"기미커버","rom":"gimikeobeo","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"기미(고유어)+커버(cover)","memofr":"Composé : 기미 (mélasma) + 커버 (angl. cover)","note":"Critère important des avis pour les peaux matures.","mean":"기미 등 색소 얼룩을 가리는 정도·기능.","ex":"짙게 자리 잡은 기미커버를 위해 핑크빛 컨실러를 덧발라 연출했습니다.","exfr":"Pour camoufler un mélasma bien installé, j'ai superposé un correcteur rosé.","fr":"camouflage du mélasma","frpos":"n.m.","frdef":"Capacité à couvrir les taches pigmentaires.","par":"커버력","rel":"하위어(참고)"},{"id":"BT0657","k":"h","cat":"base","w":"내추럴커버","rom":"naechureolkeobeo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"natural+cover","memofr":"Composé : 내추럴 (angl. natural) + 커버 (angl. cover)","note":"Échelle de couvrance coréenne : 내추럴 < 미디엄 < 풀커버.","mean":"피부가 비칠 정도로 가볍게 가리는 커버력.","ex":"화장한 티 없이 자연스럽고 얇은 내추럴커버 스타일의 톤업 크림입니다.","exfr":"Une crème tone-up à la couvrance naturelle et légère, qui ne fait pas « maquillé ».","fr":"couvrance naturelle","frpos":"n.f.","frdef":"Couvrance légère qui laisse voir la peau.","par":"커버력","rel":"하위어(참고)"},{"id":"BT0658","k":"h","cat":"base","w":"노란기","rom":"norangi","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"노랗다(노란, 고유어)+기(한자어)","memofr":"Composé : 노랗다 (jaune) + 기 (« trace, teinte »)","note":"Les avis signalent souvent si un fond de teint « tire sur le jaune ».","mean":"피부나 제품 색에 도는 노란빛.","ex":"피부의 노란기를 자연스럽게 보정하여 화사한 피부 톤으로 가꿔 줍니다.","exfr":"Il corrige le sous-ton jaune propre aux peaux asiatiques pour un teint plus lumineux.","fr":"sous-ton jaune","frpos":"n.m.","frdef":"Nuance jaune d'un teint ou d'un produit."},{"id":"BT0659","k":"h","cat":"base","w":"다크서클커버","rom":"dakeuseokeulkeobeo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"dark circle+cover","memofr":"Composé : 다크서클 (angl. dark circle) + 커버 (angl. cover)","note":"Allégation des correcteurs.","mean":"다크서클을 가리는 기능.","ex":"피곤해 보이는 눈 밑 다크서클커버를 위해 살구빛 피치 컨실러를 사용합니다.","exfr":"Pour le camouflage des cernes qui donnent l'air fatigué, j'utilise un correcteur pêche abricot.","fr":"camouflage des cernes","frpos":"n.m.","frdef":"Capacité d'un correcteur à masquer les cernes.","par":"커버력","rel":"하위어(참고)"},{"id":"BT0660","k":"h","cat":"base","w":"도자기 피부","rom":"dojagi pibu","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"도자기+피부","memofr":"Locution : 도자기 (porcelaine) + 피부 (peau)","note":"Idéal esthétique ; il se rapproche de « teint de porcelaine » en français.","mean":"모공·요철 없이 매끈하고 고른 피부.","ex":"요철 없이 깐달걀처럼 매끈하고 결점 없는 도자기 피부를 완성해 줍니다.","exfr":"Il crée une peau de porcelaine sans défaut, lisse comme un œuf écalé, sans relief.","fr":"peau de porcelaine","frpos":"n.f.","frdef":"Peau d’apparence lisse et uniforme, comparée à la surface de la porcelaine.","par":"꿀피부","rel":"관련어(참고)"},{"id":"BT0665","k":"h","cat":"base","w":"레이어드 핏","rom":"reieodeu pit","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"layered+fit","memofr":"Locution : 레이어드 (angl. layered) + 핏 (angl. fit)","note":"Image empruntée à la mode.","mean":"여러 번 덧발라도 두꺼워지지 않고 얇게 겹쳐지는 발림.","ex":"여러 번 덧발라도 답답함 없이 얇게 얹어지는 레이어드 핏 제형입니다.","exfr":"Une texture au fini superposable, qui reste fine et légère même en plusieurs couches.","fr":"fini superposable","frpos":"n.m.","frdef":"Formule marketing: produit qui se superpose sans paquets.","par":"피부표현","rel":"관련어(참고)"},{"id":"BT0670","k":"h","cat":"base","w":"매트 쿠션","rom":"maeteu kusyeon","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"matte+cushion","memofr":"Locution : 매트 (angl. matte) + 쿠션 (angl. cushion)","note":"Opposé à 세럼 쿠션 ou au cushion « glow ».","mean":"유분을 잡아 번들거림 없이 보송하게 마무리되는 쿠션.","ex":"유분을 잡아주어 보송하고 깔끔한 피부로 마감되는 매트 쿠션입니다.","exfr":"Un cushion mat qui capte le sébum pour un fini net et velouté.","fr":"cushion mat","frpos":"n.m.","frdef":"Cushion à fini mat."},{"id":"BT0671","k":"h","cat":"base","w":"매트피니시","rom":"maeteupinisi","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"matte+finish","memofr":"Composé : 매트 (angl. matte) + 피니시 (angl. finish)","note":"Synonyme anglicisé de 보송한 마무리.","mean":"광택 없이 보송하게 마무리되는 표현.","ex":"유분기를 싹 잡아주어 보송보송하고 매끄러운 매트피니시로 마감됩니다.","exfr":"Il absorbe toute la brillance et laisse un fini mat, velouté et lisse.","fr":"fini mat","frpos":"n.m.","frdef":"Fini sans brillance.","par":"세미매트","rel":"관련어(참고)"},{"id":"BT0672","k":"h","cat":"base","w":"멀티 컬러 파우더","rom":"meolti keolleo paudeo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"multi+color+powder","memofr":"Locution : 멀티 (angl. multi) + 컬러 (angl. color) + 파우더 (angl. powder)","note":"Format de poudre correctrice ou illuminatrice.","mean":"여러 색을 포함하는 파우더.","ex":"여러 색상이 섞여 피부 톤을 균일하고 맑게 보정해 주는 파우더입니다.","exfr":"Une poudre multicolore dont les teintes se mélangent pour unifier et éclaircir le teint.","fr":"poudre multicolore","frpos":"n.f.","frdef":"Poudre composée de plusieurs teintes à mélanger."},{"id":"BT0673","k":"h","cat":"base","w":"메이크업베이스","rom":"meikeueopbeiseu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"make-up+base(한국식 조어) / 원어에서 통째로 들어온 외래어라 단일어로 봄","memofr":"Emprunt à l'anglais make-up base, formé en coréen ; traité comme mot simple","note":"Produit coloré correcteur, typique des années 2000 en Corée.","mean":"파운데이션 전에 피부 톤을 보정하는 색 있는 베이스 제품.","ex":"파운데이션을 바르기 전 피부 결을 정돈해 주는 메이크업베이스를 바릅니다.","exfr":"J'applique une base de maquillage qui lisse le grain de peau avant le fond de teint.","fr":"base de maquillage (correctrice)","frpos":"n.f.","frdef":"En Corée, base teintée qui corrige la couleur du teint avant le fond de teint."},{"id":"BT0677","k":"h","cat":"base","w":"모공부각","rom":"mogongbugak","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"모공+부각","memofr":"Composé : 모공 (pores) + 부각 (mise en relief)","note":"Défaut redouté, cité dans les avis.","mean":"화장 후 모공이 더 눈에 띄는 현상.","ex":"프라이머를 사용하지 않으면 시간이 지날수록 나비존 모공부각이 심해질 수 있습니다.","exfr":"Sans primer, on risque des pores accentués sur la zone papillon au fil de la journée.","fr":"pores accentués","frpos":"n.m.pl.","frdef":"Le maquillage rend les pores plus visibles."},{"id":"BT0678","k":"h","cat":"base","w":"모공프라이머","rom":"mogongpeuraimeo","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"모공+프라이머(primer)","memofr":"Composé : 모공 (pores) + 프라이머 (angl. primer)","note":"Catégorie très vendue en Corée.","mean":"모공을 메워 매끈하게 보이게 하는 프라이머.","ex":"넓어진 모공 부위에 모공프라이머를 얇게 메워주면 매끈한 피부 바탕이 연출됩니다.","exfr":"Une fine couche de base lissante pour pores sur les pores dilatés crée une base de peau lisse.","fr":"base lissante pour pores","frpos":"n.f.","frdef":"Base qui comble visuellement les pores avant le maquillage."},{"id":"BT0679","k":"h","cat":"base","w":"물광 피부","rom":"mulgwang pibu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"물광+피부","memofr":"Locution : 물광 (éclat mouillé) + 피부 (peau)","note":"Idéal du teint coréen ; voir 물광.","mean":"물기를 머금은 듯 촉촉하게 빛나는 피부 표현.","ex":"수분감이 넘치는 쿠션을 사용하여 촉촉하게 빛나는 물광 피부를 연출했습니다.","exfr":"Avec un cushion très hydratant, j'ai obtenu une peau effet mouillé ultra-lumineuse.","fr":"peau effet mouillé ultra-lumineuse","frpos":"n.f.","frdef":"Teint très lumineux et humide, emblème du maquillage coréen (glass skin).","par":"물광","rel":"관련어(참고)"},{"id":"BT0680","k":"h","cat":"base","w":"물먹퍼프","rom":"mulmeokpeopeu","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"물먹-(「물먹다」의 어간)+퍼프(puff)","memofr":"Composé : 물먹- (radical de 물먹다 « s'imbiber ») + 퍼프 (angl. puff)","note":"Astuce de maquillage courante pour un teint plus fin.","mean":"「물 먹은 퍼프」의 줄임말. 물에 적셔 쓰는 퍼프·스펀지.","ex":"물먹퍼프를 사용하여 쿠션을 두드려 주면 한층 더 수분감 있게 밀착됩니다.","exfr":"En tapotant le cushion avec une houppette humidifiée, il adhère en apportant encore plus d'hydratation.","fr":"houppette humidifiée","frpos":"n.f.","frdef":"Abréviation de « mul meogeun peopeu » (houppette imbibée d'eau) : éponge ou houppette humidifiée pour un fini plus fin."},{"id":"BT0681","k":"s","cat":"base","w":"뭉치다","rom":"mungchida","pos":"동사","unit":"단어","eo":"고유어","form":"단일어","memo":"뷰티 문맥: 제품이 덩어리지다","memofr":"Mot simple : 뭉치다 (s'agglomérer), sens spécialisé en maquillage","note":"Verbe courant ; nom : 뭉침.","mean":"제품이 고르게 펴지지 않고 덩어리지다.","ex":"파운데이션을 너무 많이 바르면 콧볼에서 뭉친다.","exfr":"Avec trop de fond de teint, il a tendance à faire des paquets sur les ailes du nez.","fr":"faire des paquets","frpos":"loc.v.","frdef":"Le produit s'agglomère au lieu de s'étaler.","par":"뭉침","rel":"파생형"},{"id":"BT0682","k":"h","cat":"base","w":"미디엄커버","rom":"midieomkeobeo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"medium+cover","memofr":"Composé : 미디엄 (angl. medium) + 커버 (angl. cover)","note":"Voir l'échelle 내추럴 / 미디엄 / 풀커버.","mean":"중간 정도의 커버력.","ex":"답답함 없이 피부 톤을 자연스럽게 잡아주는 미디엄커버 정도의 농도입니다.","exfr":"Une couvrance moyenne qui unifie naturellement le teint sans effet masque.","fr":"couvrance moyenne","frpos":"n.f.","frdef":"Niveau de couvrance intermédiaire.","par":"커버력","rel":"하위어(참고)"},{"id":"BT0684","k":"h","cat":"base","w":"번들광","rom":"beondeulgwang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"번들(어근)+광","memofr":"Composé : 번들 (racine « luisant ») + 광 (éclat)","note":"Nuance négative, à l'opposé de 윤광.","mean":"피지 때문에 생기는 기름진 광.","ex":"유분 조절이 되지 않아 과도하게 겉도는 번들광을 지워 줍니다.","exfr":"Il efface la brillance grasse excessive due à un sébum mal régulé.","fr":"brillance grasse","frpos":"n.f.","frdef":"Brillance due au sébum, jugée négative (opposée à l'éclat sain)."},{"id":"BT0686","k":"s","cat":"base","w":"보송보송","rom":"bosongbosong","pos":"부사","unit":"단어","eo":"고유어","form":"합성어","memo":"보송(어근) 반복 — 첩어(반복 합성어)","memofr":"Mot composé redoublé : 보송 (racine « sec et doux ») × 2","note":"Redoublement expressif typique du coréen.","mean":"끈적임 없이 보드랍고 산뜻한 모양.","ex":"파우더를 얇게 올리니 피부가 하루 종일 보송보송했다.","exfr":"Après une fine couche de poudre, ma peau est restée veloutée toute la journée.","fr":"velouté, sec au toucher","frpos":"adj.","frdef":"Fini doux, sec et non collant.","par":"보송하다","rel":"변이형"},{"id":"BT0688","k":"h","cat":"base","w":"블러","rom":"beulleo","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"blur 차용","memofr":"Emprunt à l'anglais blur","note":"Mot à la mode ; donne 블러틴트, 블러프라이머, etc.","mean":"피부 표면을 흐릿하고 매끈하게 보이도록 연출하는 것.","ex":"모공과 피부 요철을 매끈하게 메워주는 블러 효과의 파우더 팩트입니다.","exfr":"Une poudre compacte à effet flouteur qui estompe pores et irrégularités.","fr":"effet flouteur","frpos":"n.m.","frdef":"Effet qui estompe pores et imperfections.","par":"피부표현","rel":"관련어(참고)"},{"id":"BT0690","k":"h","cat":"base","w":"블러프라이머","rom":"beulleopeuraimeo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"blur+primer","memofr":"Composé : 블러 (angl. blur) + 프라이머 (angl. primer)","note":"Catégorie de produit courante.","mean":"모공·결점을 흐릿하게 보이게 하는 프라이머.","ex":"피부 굴곡을 포토샵한 듯 블러 처리해 주는 블러프라이머 제품입니다.","exfr":"Une base floutante qui estompe les reliefs de la peau comme une retouche Photoshop.","fr":"base floutante","frpos":"n.f.","frdef":"Base de maquillage à effet flouteur."},{"id":"BT0692","k":"h","cat":"base","w":"블렌딩하다","rom":"beullendinghada","pos":"동사","unit":"단어","eo":"혼종어","form":"파생어","memo":"블렌딩(blending)+-하다","memofr":"Dérivé : 블렌딩 (angl. blending) + -하다 (suffixe verbal)","note":"Vocabulaire technique de maquillage, devenu courant.","mean":"경계를 문질러 자연스럽게 섞다.","ex":"경계선이 남지 않도록 경계 부위를 스펀지로 자연스럽게 블렌딩하니 예쁜 톤이 나옵니다.","exfr":"En estompant les bords à l'éponge pour ne laisser aucune démarcation, on obtient un joli teint.","fr":"estomper","frpos":"v.","frdef":"Fondre les contours d'un produit pour une transition naturelle."},{"id":"BT0695","k":"h","cat":"base","w":"빌더블커버","rom":"bildeobeulkeobeo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"buildable+cover","memofr":"Composé : 빌더블 (angl. buildable) + 커버 (angl. cover)","note":"Anglicisme du discours des marques.","mean":"덧바를수록 커버력이 올라가는 성질.","ex":"필요한 만큼 덧발라 커버력을 자유롭게 조절할 수 있는 빌더블커버 제형입니다.","exfr":"Une texture à couvrance modulable : on superpose autant qu'il faut.","fr":"couvrance modulable","frpos":"n.f.","frdef":"Couvrance qu'on peut augmenter en superposant les couches.","par":"커버력","rel":"하위어(참고)"},{"id":"BT0697","k":"h","cat":"base","w":"새틴광","rom":"saetingwang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"새틴(satin)+광","memofr":"Composé : 새틴 (angl. satin) + 광 (éclat)","note":"Échelle des finis : mat < satiné < lumineux.","mean":"매트와 광 사이의 은은한 새틴 같은 광.","ex":"매트함과 글로우함의 중간 단계로 고급스러운 새틴광 결을 완성합니다.","exfr":"Entre mat et glow, il donne un fini satiné élégant.","fr":"fini satiné","frpos":"n.m.","frdef":"Brillance douce entre mat et lumineux.","par":"속광","rel":"관련어(참고)"},{"id":"BT0698","k":"h","cat":"base","w":"세럼 쿠션","rom":"sereom kusyeon","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"serum+cushion","memofr":"Locution : 세럼 (angl. serum) + 쿠션 (angl. cushion)","note":"Opposé à 매트 쿠션.","mean":"세럼 성분을 넣어 촉촉하고 윤기 있게 발리는 쿠션.","ex":"세럼 성분을 담아 피부에 촉촉한 수분감과 영양을 공급하는 쿠션입니다.","exfr":"Un cushion sérum qui hydrate et nourrit la peau.","fr":"cushion sérum","frpos":"n.m.","frdef":"Cushion à texture de sérum, plus soin et plus lumineux."},{"id":"BT0699","k":"h","cat":"base","w":"세미글로우","rom":"semigeullou","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"semi+glow","memofr":"Composé : 세미 (angl. semi) + 글로우 (angl. glow)","note":"Fini intermédiaire très demandé en Corée.","mean":"은은하게 빛나는 마무리.","ex":"너무 번들거리지 않으면서 은은한 윤기를 주는 세미글로우 피니시 쿠션입니다.","exfr":"Un cushion au fini semi-lumineux : un éclat subtil sans effet luisant.","fr":"fini semi-lumineux","frpos":"n.m.","frdef":"Fini légèrement lumineux.","par":"세미매트","rel":"관련어(참고)"},{"id":"BT0700","k":"h","cat":"base","w":"세미매트","rom":"semimaeteu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"semi+matte","memofr":"Composé : 세미 (angl. semi) + 매트 (angl. matte)","note":"Voir l'échelle des finis.","mean":"광이 적지만 완전히 매트하지 않은 마무리.","ex":"속은 촉촉하고 겉은 부드럽게 마감되는 세미매트 텍스처라 데일리로 좋습니다.","exfr":"Hydratée dedans, douce en surface : sa texture semi-mate est parfaite au quotidien.","fr":"semi-mat","frpos":"adj.","frdef":"Fini peu brillant mais pas totalement mat."},{"id":"BT0703","k":"h","cat":"base","w":"소프트매트","rom":"sopeuteumaeteu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"soft+matte","memofr":"Composé : 소프트 (angl. soft) + 매트 (angl. matte)","note":"Mot fréquent pour les rouges à lèvres et les teints.","mean":"건조하지 않고 부드러운 매트 마무리.","ex":"피부에 부드럽게 미끄러지듯 발리는 소프트매트 타입의 립스틱입니다.","exfr":"Un rouge à lèvres mat doux qui glisse en douceur sur les lèvres.","fr":"mat doux","frpos":"n.m.","frdef":"Fini mat velouté, non desséchant.","par":"세미매트","rel":"관련어(참고)"},{"id":"BT0704","k":"h","cat":"base","w":"수분프라이머","rom":"subunpeuraimeo","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"수분+프라이머(primer)","memofr":"Composé : 수분 (hydratation) + 프라이머 (angl. primer)","note":"Catégorie appréciée des peaux sèches.","mean":"보습감을 더한 프라이머.","ex":"건조한 피부에 들뜸 없이 메이크업이 밀착되도록 수분프라이머를 먼저 발라줍니다.","exfr":"Sur peau sèche, j'applique d'abord une base hydratante pour que le maquillage adhère sans se soulever.","fr":"base hydratante","frpos":"n.f.","frdef":"Base de maquillage hydratante."},{"id":"BT0707","k":"h","cat":"base","w":"슬림커버","rom":"seullimkeobeo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"slim+cover","memofr":"Composé : 슬림 (angl. slim) + 커버 (angl. cover)","note":"Formule publicitaire.","mean":"두껍지 않게 얇게 가려 주는 커버.","ex":"두껍지 않고 얇게 슬림커버되어 내추럴한 피부 표현이 가능합니다.","exfr":"Une couvrance fine, sans épaisseur, pour un rendu de peau naturel.","fr":"couvrance fine","frpos":"n.f.","frdef":"Couvrance obtenue en couche très fine.","par":"커버력","rel":"하위어(참고)"},{"id":"BT0708","k":"h","cat":"base","w":"실리콘퍼프","rom":"sillikonpeopeu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"silicone+puff","memofr":"Composé : 실리콘 (angl. silicone) + 퍼프 (angl. puff)","note":"Accessoire à la mode ; il se nettoie facilement.","mean":"제품을 흡수하지 않는 실리콘 재질 퍼프.","ex":"내용물을 흡수하지 않아 위생적으로 사용하기 좋은 실리콘퍼프입니다.","exfr":"Une houppette en silicone hygiénique, qui n'absorbe pas le produit.","fr":"houppette en silicone","frpos":"n.f.","frdef":"Applicateur en silicone qui n'absorbe pas le produit."},{"id":"BT0709","k":"h","cat":"base","w":"심리스","rom":"simniseu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"seamless 차용","memofr":"Emprunt à l'anglais seamless","note":"Vocabulaire publicitaire.","mean":"경계나 들뜸 없이 피부와 하나처럼 이어지는 마무리.","ex":"경계선 없이 피부에 착 감기는 심리스 웨어 커버 기술이 적용되었습니다.","exfr":"Une technologie de couvrance à effet seconde peau, qui épouse la peau sans aucune démarcation.","fr":"effet seconde peau","frpos":"n.m.","frdef":"Fini sans démarcation, invisible.","par":"피부표현","rel":"관련어(참고)"},{"id":"BT0716","k":"h","cat":"base","w":"요철부각","rom":"yocheolbugak","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"요철+부각","memofr":"Composé : 요철 (creux et bosses) + 부각 (mise en relief)","note":"Défaut redouté, cité dans les avis.","mean":"화장 후 피부 요철이 더 도드라지는 현상.","ex":"피부 모공이나 피부 요철부각 없이 매끈하게 커버되는 제형입니다.","exfr":"Une texture qui couvre en lissant, sans pores ni reliefs accentués.","fr":"reliefs accentués","frpos":"n.m.pl.","frdef":"Le maquillage souligne les irrégularités de texture."},{"id":"BT0717","k":"h","cat":"base","w":"유리알 피부","rom":"yurial pibu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"유리알(유리+알)+피부","memofr":"Locution : 유리알 (bille de verre) + 피부 (peau)","note":"Équivalent coréen de « glass skin ».","mean":"유리구슬처럼 맑고 매끈하며 광이 나는 피부.","ex":"투명하고 매끈하게 반짝이는 유리알 피부 표현을 연출해 줍니다.","exfr":"Il donne un effet « glass skin », une peau translucide, lisse et lumineuse.","fr":"effet « glass skin » (peau lisse et lumineuse)","frpos":"n.m.","frdef":"Peau lisse, transparente et très lumineuse.","par":"물광","rel":"관련어(참고)"},{"id":"BT0718","k":"h","cat":"base","w":"윤광","rom":"yungwang","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"윤+광","memofr":"Composé : 윤 (lustre) + 광 (éclat)","note":"Éclat plus sobre que 물광 ; souvent recherché par les peaux matures.","mean":"기름지지 않고 은은하게 도는 윤기. 물광보다 차분한 광.","ex":"피부 본연의 결을 살려 은은하고 고급스러운 윤광을 연출합니다.","exfr":"Il met en valeur le grain naturel de la peau pour un éclat lustré, subtil et raffiné.","fr":"éclat lustré","frpos":"n.m.","frdef":"Brillance satinée et saine de la peau.","par":"속광","rel":"관련어(참고)"},{"id":"BT0719","k":"h","cat":"base","w":"은구슬광","rom":"eunguseulgwang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"은구슬(은+구슬)+광","memofr":"Composé : 은구슬 (perle d'argent) + 광 (éclat)","note":"Expression publicitaire poétique, propre à certaines marques.","mean":"은구슬을 굴린 듯 맑고 고운 광을 이르는 홍보 표현.","ex":"은구슬이 구르듯 차오르는 맑고 은은한 은구슬광을 완성해 줍니다.","exfr":"Il crée un éclat nacré argenté, clair et subtil, comme des perles d'argent qui roulent.","fr":"éclat nacré argenté","frpos":"n.m.","frdef":"Fini lumineux nacré, comme une perle argentée.","par":"속광","rel":"관련어(참고)"},{"id":"BT0720","k":"h","cat":"base","w":"자연광","rom":"jayeongwang","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"자연+광","memofr":"Composé : 자연 (nature) + 광 (éclat)","note":"Formule générique ; elle s'oppose aux éclats « artificiels ».","mean":"인위적이지 않은 자연스러운 피부 광.","ex":"인위적인 광채가 아닌 피부 본연에서 올라오는 듯한 자연광을 완성합니다.","exfr":"Pas un éclat artificiel : un éclat naturel qui semble venir de la peau elle-même.","fr":"éclat naturel","frpos":"n.m.","frdef":"Lumière de peau naturelle, non artificielle.","par":"속광","rel":"관련어(참고)"},{"id":"BT0721","k":"h","cat":"base","w":"잡티커버","rom":"japtikeobeo","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"잡티+커버(cover)","memofr":"Composé : 잡티 (petites taches) + 커버 (angl. cover)","note":"Critère central des avis sur les fonds de teint et les correcteurs.","mean":"잡티를 가리는 기능.","ex":"짙은 트러블 자국과 잡티커버에 탁월한 고화질 컨실러입니다.","exfr":"Un correcteur haute définition qui excelle dans le camouflage des imperfections et des marques foncées.","fr":"camouflage des imperfections","frpos":"n.m.","frdef":"Capacité à masquer les petites taches.","par":"커버력","rel":"하위어(참고)"},{"id":"BT0725","k":"h","cat":"base","w":"철벽커버","rom":"cheolbyeokkeobeo","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"철벽+커버(cover)","memofr":"Composé : 철벽 (muraille de fer) + 커버 (angl. cover)","note":"Image guerrière ; voir aussi 철벽 (tenue).","mean":"잡티와 붉은기를 빈틈없이 가려 주는 강한 커버를 성벽에 빗댄 말.","ex":"잡티와 붉은기를 강력하게 가려주는 철벽커버 쿠션입니다.","exfr":"Un cushion à couvrance extrême qui camoufle efficacement taches et rougeurs.","fr":"couvrance extrême","frpos":"n.f.","frdef":"Couvrance très haute et sans faille.","par":"커버력","rel":"하위어(참고)"},{"id":"BT0728","k":"h","cat":"base","w":"커버력","rom":"keobeoryeok","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"커버(cover)+-력","memofr":"Dérivé : 커버 (angl. cover) + -력 (suffixe « force, capacité »)","note":"Critère principal des avis sur les produits de teint.","mean":"잡티 등을 가리는 힘.","ex":"단 한 번의 터치로 붉은기와 잡티를 말끔하게 가려주는 커버력이 뛰어납니다.","exfr":"Son pouvoir couvrant est remarquable : une seule touche efface rougeurs et imperfections.","fr":"pouvoir couvrant","frpos":"n.m.","frdef":"Capacité à masquer les imperfections."},{"id":"BT0732","k":"h","cat":"base","w":"쿠션","rom":"kusyeon","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"cushion 차용(한국식 제품명)","memofr":"Emprunt à l'anglais cushion, devenu nom de produit coréen","note":"Format inventé en Corée (2008), aujourd'hui repris par des marques du monde entier, y compris françaises.","mean":"파운데이션을 스펀지에 적셔 팩트에 담은 한국식 베이스 제품. 퍼프로 두드려 바름.","ex":"피부에 가볍게 밀착되어 하루 종일 화사함을 유지해 주는 쿠션 제품입니다.","exfr":"Un cushion qui adhère légèrement à la peau et garde le teint lumineux toute la journée.","fr":"cushion (fond de teint compact)","frpos":"n.m.","frdef":"Fond de teint liquide imbibé dans une éponge en boîtier, invention coréenne ; ne pas traduire par « coussin ».","faux":1},{"id":"BT0733","k":"h","cat":"base","w":"쿠션퍼프","rom":"kusyeonpeopeu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"cushion+puff","memofr":"Composé : 쿠션 (angl. cushion) + 퍼프 (angl. puff)","note":"Accessoire souvent remplacé ou lavé ; vendu aussi en recharge.","mean":"쿠션 팩트에 딸린 퍼프.","ex":"도톰하고 쫀쫀한 쿠션퍼프를 사용해 피부에 밀착력을 높여 줍니다.","exfr":"Une houppette de cushion épaisse et dense améliore l'adhérence sur la peau.","fr":"houppette de cushion","frpos":"n.f.","frdef":"Houppette fournie avec le cushion."},{"id":"BT0736","k":"h","cat":"base","w":"톤보정","rom":"tonbojeong","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"톤(tone)+보정","memofr":"Composé : 톤 (angl. tone) + 보정 (correction)","note":"Allégation des bases colorées et des crèmes tone-up.","mean":"피부색을 고르고 밝게 보정함.","ex":"얼룩덜룩한 피부 톤을 균일하고 깔끔하게 톤을 보정해 주는 유기자차 톤업 제품입니다.","exfr":"Un produit tone-up à filtres chimiques qui assure une correction du teint irrégulier.","fr":"correction du teint","frpos":"n.f.","frdef":"Unifier et corriger la couleur du teint.","par":"톤업","rel":"관련어(참고)"},{"id":"BT0738","k":"h","cat":"base","w":"톤차이","rom":"tonchai","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"톤(tone)+차이","memofr":"Composé : 톤 (angl. tone) + 차이 (différence)","note":"Souci fréquent dans les avis sur les fonds de teint.","mean":"얼굴과 목, 제품과 피부 사이의 색 차이.","ex":"목과 얼굴 피부 사이의 톤차이가 나지 않도록 자연스러운 컬러를 선택하세요.","exfr":"Choisissez une couleur naturelle pour éviter un écart de teinte entre le cou et le visage.","fr":"écart de teinte","frpos":"n.m.","frdef":"Différence de couleur entre visage et cou, ou entre teinte et peau.","par":"호수","rel":"관련어(참고)"},{"id":"BT0739","k":"h","cat":"base","w":"트러블성","rom":"teureobeulseong","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"트러블(trouble)+-성","memofr":"Dérivé : 트러블 (angl. trouble) + -성 (suffixe « qualité, tendance »)","note":"Formé sur le faux ami 트러블 (« boutons »).","mean":"뾰루지 등 트러블이 잘 생기는 피부 성질.","ex":"예민하고 붉어지기 쉬운 트러블성 피부 타입에 순하게 작동합니다.","exfr":"Il agit en douceur sur les peaux sensibles, sujettes aux rougeurs et aux imperfections.","fr":"sujet aux imperfections","frpos":"loc.adj.","frdef":"Se dit d'une peau qui fait facilement des boutons.","par":"트러블","rel":"관련어(참고)"},{"id":"BT0740","k":"h","cat":"base","w":"파데","rom":"pade","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(절단어)","memo":"파(운)데(이션) 축약","memofr":"Troncation : 파(운)데(이션) (angl. foundation)","note":"Abréviation familière très courante.","mean":"파운데이션의 줄임말.","ex":"가벼운 파데 프리 메이크업 대신 밀착력 높은 파데 쿠션을 선택했습니다.","exfr":"Plutôt qu'un maquillage léger sans fond de teint, j'ai choisi un cushion de fond de teint très adhérent.","fr":"fond de teint","frpos":"n.m.","frdef":"Abréviation familière de « paundeisyeon » (fond de teint)."},{"id":"BT0742","k":"h","cat":"base","w":"파우더리","rom":"paudeori","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"powdery 차용","memofr":"Emprunt à l'anglais powdery","note":"S'applique aussi bien à un fini qu'à un parfum.","mean":"가루처럼 보송한 마무리·향.","ex":"사용 후 유분감 없이 부드럽고 파우더리한 촉감으로 마감됩니다.","exfr":"Après application, il laisse un toucher doux et poudré, sans gras.","fr":"poudré","frpos":"adj.","frdef":"Fini ou parfum doux et poudré.","par":"보송하다","rel":"관련어(참고)"},{"id":"BT0748","k":"h","cat":"base","w":"풀커버","rom":"pulkeobeo","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"full+cover","memofr":"Composé : 풀 (angl. full) + 커버 (angl. cover)","note":"Degré le plus élevé de l'échelle de couvrance.","mean":"최대한 가리는 높은 커버력.","ex":"피부 결점을 완벽하게 가려주어 완성도 높은 피부를 만드는 풀커버 파운데이션입니다.","exfr":"Un fond de teint à couvrance totale qui cache parfaitement les défauts pour un teint impeccable.","fr":"couvrance totale","frpos":"n.f.","frdef":"Couvrance maximale.","par":"커버력","rel":"하위어(참고)"},{"id":"BT0753","k":"h","cat":"base","w":"피부표현","rom":"pibupyohyeon","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"피부+표현","memofr":"Composé : 피부 (peau) + 표현 (expression, rendu)","note":"Notion clé des tutoriels coréens : on parle de « rendre » un teint.","mean":"베이스 메이크업으로 연출한 피부의 모습.","ex":"답답해 보이지 않으면서 매끈하고 고급스러운 피부표현을 연출해 줍니다.","exfr":"Il offre un rendu du teint lisse et raffiné, sans effet étouffant.","fr":"rendu du teint","frpos":"n.m.","frdef":"Résultat visuel du maquillage du teint (mat, lumineux, naturel…)."},{"id":"BT0754","k":"h","cat":"base","w":"피지로 번들거리다","rom":"pijiro beondeulgeorida","pos":"동사","unit":"구","eo":"혼종어","form":"구","memo":"피지로+번들거리다 / 명사형: 피지번들거림","memofr":"Locution : 피지로 (à cause du sébum) + 번들거리다 (luire)","note":"Nom dérivé : 피지번들거림.","mean":"피지 때문에 얼굴이 기름지게 빛나다.","ex":"오후가 되면 이마와 코가 피지로 번들거린다.","exfr":"L'après-midi, mon front et mon nez brillent de sébum.","fr":"briller (à cause du sébum)","frpos":"v.","frdef":"Brillance grasse du visage."},{"id":"BT0756","k":"h","cat":"base","w":"픽싱","rom":"piksing","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"fixing 차용","memofr":"Emprunt à l'anglais fixing","note":"S'emploie pour le maquillage comme pour la coiffure.","mean":"화장이나 머리 모양이 흐트러지지 않게 고정하는 것.","ex":"바르는 순간 빠르게 밀착되어 화장이 쉽게 무너지지 않도록 픽싱해 줍니다.","exfr":"Il adhère rapidement dès l'application et assure la fixation du maquillage pour qu'il ne se dégrade pas.","fr":"fixation","frpos":"n.f.","frdef":"Tenue du maquillage obtenue par un fixateur."},{"id":"BT0758","k":"h","cat":"base","w":"홍조커버","rom":"hongjokeobeo","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"홍조+커버(cover)","memofr":"Composé : 홍조 (rougeur du visage) + 커버 (angl. cover)","note":"Allégation des bases vertes et des correcteurs.","mean":"붉은기를 가리는 기능.","ex":"볼 부위의 민감한 붉은 톤과 홍조 커버력이 뛰어난 그린 컬러 베이스입니다.","exfr":"Une base verte efficace pour le camouflage des rougeurs des joues et des tons rouges sensibles.","fr":"camouflage des rougeurs","frpos":"n.m.","frdef":"Capacité à masquer les rougeurs.","par":"커버력","rel":"하위어(참고)"},{"id":"BT0760","k":"h","cat":"eye","w":"가닥 속눈썹","rom":"gadak songnunsseop","pos":"명사","unit":"구","eo":"고유어","form":"구","memo":"가닥+속눈썹","memofr":"Locution : 가닥 (mèche, brin) + 속눈썹 (cils)","note":"S'oppose aux cils en bande complète.","mean":"몇 가닥씩 붙이는 부분 인조 속눈썹.","ex":"가닥 속눈썹을 눈꼬리 쪽에만 붙여 자연스럽게 연출했다.","exfr":"J'ai posé des faux cils en mèches seulement au coin externe pour un effet naturel.","fr":"faux cils en mèches","frpos":"n.m.pl.","frdef":"Faux cils individuels ou en petites touffes."},{"id":"BT0761","k":"h","cat":"eye","w":"가루가 날리다","rom":"garuga nallida","pos":"동사","unit":"구","eo":"고유어","form":"구","memo":"가루가+날리다 / 명사형: 가루날림","memofr":"Locution : 가루가 (la poudre) + 날리다 (s'envoler)","note":"Défaut fréquent des fards en poudre ; nom : 가루날림.","mean":"섀도 가루가 눈 밑 등에 떨어지다.","ex":"섀도를 브러시로 털지 않고 발랐더니 가루가 심하게 날렸다.","exfr":"J'ai appliqué le fard sans tapoter le pinceau, et la poudre a fait des retombées en quantité.","fr":"faire des retombées (poudre)","frpos":"loc.v.","frdef":"Particules de fard qui tombent sous les yeux.","par":"펄이 날리다","rel":"관련어(참고)"},{"id":"BT0762","k":"h","cat":"eye","w":"겉쌍","rom":"geotssang","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(절단어)","memo":"겉쌍꺼풀에서 「꺼풀」을 잘라 냄","memofr":"Troncation : 겉쌍(꺼풀) (pli de paupière extérieur)","note":"Fait partie de la typologie coréenne des paupières : 겉쌍 / 속쌍 / 무쌍.","mean":"「겉쌍꺼풀」의 줄임말. 겉으로 드러나는 쌍꺼풀.","ex":"겉쌍이라 아이라인을 두껍게 그려도 눈을 뜨면 잘 보인다.","exfr":"Mon pli de paupière est bien visible : même un trait d'eye-liner épais se voit quand j'ouvre les yeux.","fr":"pli de paupière visible","frpos":"n.m.","frdef":"Abréviation de « 겉쌍꺼풀 »: double paupière nettement visible.","par":"쌍꺼풀 라인","rel":"관련어(참고)"},{"id":"BT0763","k":"h","cat":"eye","w":"결카라","rom":"gyeolkara","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(절단어)","memo":"결+(마스)카라 축약","memofr":"Troncation : 결 (grain, séparation) + (마스)카라 (angl. mascara)","note":"Argot de maquillage récent.","mean":"「결 마스카라」의 줄임말. 속눈썹을 한 올씩 갈라 결이 살아 보이게 하는 마스카라.","ex":"결카라를 쓰니 속눈썹이 한 올씩 갈라져 보인다.","exfr":"Avec ce mascara séparateur, les cils paraissent séparés un à un.","fr":"mascara séparateur",
