pos":"loc.n.","frdef":"Faire rouler la mousse sur le visage sans frotter la peau."},{"id":"BT0367","w":"거품망","k":"h","rom":"geopummang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"거품(고유어)+망(網)","cat":"clean","mean":"클렌징 폼을 비벼 풍성하고 조밀한 거품을 일으키는 세안 보조 망.","ex":"거품망에 폼을 조금 짜서 문지르면 거품이 한가득 올라온다.","fr":"filet moussant","frpos":"n.m.","frdef":"Petit filet pour faire mousser un nettoyant en mousse dense."},{"id":"BT0369","w":"깐달걀 오일","k":"h","rom":"kkandalgyal oil","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"깐달걀+오일(oil)","cat":"clean","mean":"세안 후 피부 표면이 삶은 달걀 껍데기를 깐 것처럼 끈적임이나 각질 없이 매끈해짐.","ex":"이 오일로 세안하고 나면 피부가 깐달걀처럼 매끈해서 깐달걀 오일이라 부른다.","fr":"huile « peau d'œuf écalé »","frpos":"loc.n.","frdef":"Formule marketing d'une huile démaquillante promettant une peau lisse comme un œuf écalé."},{"id":"BT0370","w":"노워시","k":"h","rom":"nowosi","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"no+wash(한국식 조어)","cat":"clean","mean":"클렌징 후 물로 다시 헹구지 않고 마무리해도 되는 방식.","ex":"노워시 타입 클렌징 워터라 캠핑 갈 때 챙겨 간다.","fr":"sans rinçage","frpos":"loc.adj.","frdef":"Se dit d'un nettoyant ou soin qui ne nécessite pas de rinçage."},{"id":"BT0371","w":"노폐물 흡착","k":"h","rom":"nopyemul heupchak","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"노폐물(老廢物)+흡착(吸着)","cat":"clean","mean":"클렌저 성분이 노폐물을 자석처럼 끌어당겨 붙여내는 작용.","ex":"클레이 성분이 모공 속 노폐물 흡착을 돕는다.","fr":"captation des impuretés","frpos":"loc.n.","frdef":"Action d'un nettoyant qui attire et retient les impuretés."},{"id":"BT0373","w":"눈 안개 현상","k":"h","rom":"nun angae hyeonsang","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"눈+안개+현상(現象)","cat":"clean","mean":"클렌징 오일이 눈에 들어 일시적으로 시야가 안개 낀 듯 하얗게 보이는 현상.","ex":"클렌징 오일이 눈에 들어가 한동안 눈 안개 현상이 있었다.","fr":"vision floue (huile dans l'œil)","frpos":"loc.n.","frdef":"Voile blanc temporaire quand une huile démaquillante entre dans l'œil."},{"id":"BT0378","w":"떡솝","k":"h","rom":"tteoksop","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"떡(고유어)+솝(soap)","cat":"clean","mean":"쫀득한 떡과 같은 찰기와 질감을 가진 수제 클렌징 팩 비누 제형.","ex":"아렌시아 떡솝 프레시 클렌저.","fr":"savon « tteok » (texture pâte de riz)","frpos":"loc.n.","frdef":"Savon-masque à texture élastique comparée au gâteau de riz coréen (tteok)."},{"id":"BT0381","w":"말끔 모공","k":"h","rom":"malkkeum mogong","pos":"명사","unit":"구","eo":"고유어","form":"구(句)","memo":"말끔(어근)+모공(毛孔)","cat":"clean","mean":"모공 내부의 노폐물과 피지가 깨끗이 세정되어 정돈된 모공 상태.","ex":"효소 세안을 한 날은 코가 말끔 모공이 되어 기분이 좋다.","fr":"pores nets","frpos":"loc.n.","frdef":"Formule marketing: pores désencombrés et propres."},{"id":"BT0382","w":"맷돌밤","k":"h","rom":"maetdolbam","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"맷돌(고유어)+밤(balm)","cat":"clean","mean":"돌려서 갈아 쓰는 용기 방식이 한국 전통 맷돌을 갈아내는 모습과 유사함을 비유한 표현.","ex":"맷돌밤은 뚜껑을 돌리면 밤이 갈려 나와 손을 넣지 않아도 된다.","fr":"baume à moudre","frpos":"loc.n.","frdef":"Baume démaquillant dans un pot à tourner, comparé à une meule coréenne (맷돌).","par":"밤 투 폼","rel":"관련어(참고)"},{"id":"BT0383","w":"모공 브러쉬","k":"h","rom":"mogong beureoswi","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"모공(毛孔)+브러쉬(brush)","cat":"clean","mean":"미세모가 박혀 있어 손으로 닿지 않는 모공 내부를 정밀하게 세정하는 브러쉬.","ex":"모공 브러쉬로 코 옆을 살살 굴리며 씻는다.","fr":"brosse pour les pores","frpos":"loc.n.","frdef":"Petite brosse à poils fins pour nettoyer les pores."},{"id":"BT0385","w":"모공 스케일링","k":"h","rom":"mogong seukeilling","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"모공+스케일링(scaling)","cat":"clean","mean":"치과 스케일링처럼 모공 속 묵은 노폐물과 피지를 정교하고 깊숙이 정돈해주는 세안.","ex":"주말마다 클레이 팩으로 모공 스케일링을 한다.","fr":"« détartrage » des pores","frpos":"loc.n.","frdef":"Nettoyage profond des pores, comparé au détartrage dentaire.","par":"피지 연화","rel":"관련어(참고)"},{"id":"BT0386","w":"모공 청소","k":"h","rom":"mogong cheongso","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"모공(毛孔)+청소(淸掃)","cat":"clean","mean":"모공 속에 박혀있는 피지, 화이트헤드, 노폐물을 깨끗이 쓸어내는 작용.","ex":"클렌징 오일로 오래 롤링하면 모공 청소가 되는 느낌이다.","fr":"nettoyage des pores","frpos":"loc.n.","frdef":"Élimination du sébum et des impuretés incrustés dans les pores.","par":"피지 연화","rel":"관련어(참고)"},{"id":"BT0388","w":"무자극 세안","k":"h","rom":"mujageuk sean","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"무자극(無刺戟)+세안(洗顔)","cat":"clean","mean":"자극감이나 민감 반응이 일어나지 않도록 순하게 진행하는 세안.","ex":"피부가 얇아서 거품만 굴리는 무자극 세안을 한다.","fr":"nettoyage sans irritation","frpos":"loc.n.","frdef":"Nettoyage très doux qui ne provoque pas de réaction."},{"id":"BT0390","w":"물광","k":"h","rom":"mulgwang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"물(고유어)+광(光)","cat":"clean","mean":"마치 물을 머금은 듯 촉촉하게 빛나는 윤기 나는 피부 상태.","ex":"수분 앰플을 겹쳐 바르고 쿠션을 올리면 물광이 난다.","fr":"éclat « peau mouillée » (glass skin)","frpos":"loc.n.","frdef":"Peau très lumineuse et humide, comme recouverte d'eau."},{"id":"BT0392","w":"미세 거품","k":"h","rom":"mise geopum","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"미세(微細)+거품","cat":"clean","mean":"입자가 매우 작고 촘촘하여 피부 자극을 줄여주는 거품.","ex":"미세 거품이라 얼굴에 올리면 크림처럼 쫀쫀하다.","fr":"micro-mousse","frpos":"n.f.","frdef":"Mousse aux bulles très fines et serrées."},{"id":"BT0393","w":"미셀라 입자","k":"h","rom":"misella ipja","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"미셀라(micellar)+입자(粒子)","cat":"clean","mean":"친유성 부분이 노폐물을 흡착하고 친수성 부분이 물로 끌어당겨 제거하는 세정 입자.","ex":"클렌징 워터 속 미셀라 입자가 화장을 끌어당겨 지운다.","fr":"micelles","frpos":"n.f.pl.","frdef":"Agrégats de tensioactifs qui piègent les impuretés (principe de l'eau micellaire).","ing":"한국어: 계면활성제가 물속에서 만드는 미세한 공 모양 집합체(미셀). 클렌징 워터가 메이크업·피지를 붙잡아 지우는 원리.\nFrançais : Une micelle est un agrégat de molécules tensioactives formé dans un liquide; elle aide à disperser les corps gras lors du nettoyage. Ce n'est pas un ingrédient INCI unique.","inci":"Micelles — 제형 원리"},{"id":"BT0396","w":"밀착 롤링","k":"h","rom":"milchak rolling","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"밀착(密着)+롤링(rolling)","cat":"clean","mean":"피부 표면에 밀착시켜 구석구석 손가락을 굴려 세정하는 동작.","ex":"코 옆은 오일로 밀착 롤링을 해야 블랙헤드가 빠진다.","fr":"massage circulaire appuyé","frpos":"loc.n.","frdef":"Faire rouler les doigts en épousant les reliefs du visage pour nettoyer."},{"id":"BT0397","w":"밀착 세안","k":"h","rom":"milchak sean","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"밀착(密着)+세안(洗顔)","cat":"clean","mean":"클렌저가 피부 굴곡 및 모공 틈새에 빈틈없이 달라붙어 씻어내는 동작.","ex":"거품이 쫀쫀해서 굴곡진 콧볼까지 밀착 세안이 된다.","fr":"nettoyage au plus près de la peau","frpos":"loc.n.","frdef":"Nettoyant qui épouse les reliefs et pénètre les pores."},{"id":"BT0398","w":"반전 클렌징","k":"h","rom":"banjeon keullenjing","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"반전(反轉)+클렌징(cleansing)","cat":"clean","mean":"오일 제형이 피지를 녹인 후 물을 만나면 거품으로 변해 지우는 세정 방식.","ex":"오일이 물을 만나면 거품으로 바뀌는 반전 클렌징 제품이다.","fr":"nettoyant à transformation","frpos":"loc.n.","frdef":"Nettoyant qui change de texture (huile en mousse) au contact de l'eau.","par":"유화 과정","rel":"관련어(참고)"},{"id":"BT0399","w":"밤 세안","k":"h","rom":"bam sean","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"밤(balm)+세안(洗顔)","cat":"clean","mean":"클렌징 밤 제형을 사용하여 메이크업을 지우는 세안.","ex":"진한 화장을 한 날은 밤 세안으로 먼저 녹여 낸다.","fr":"démaquillage au baume","frpos":"loc.n.","frdef":"Nettoyage effectué avec un baume démaquillant.","par":"이중 세안","rel":"관련어(참고)"},{"id":"BT0400","w":"밤 투 폼","k":"h","rom":"bam tu pom","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"balm to foam 차용","cat":"clean","mean":"밤(Balm) 제형으로 시작하여 물이 닿으면 거품(Foam) 형태로 변하는 클렌저 제형.","ex":"아리얼 더 퍼펙트 오일 밤 투 폼 100g.","fr":"balm-to-foam (baume qui devient mousse)","frpos":"loc.n.","frdef":"Nettoyant baume qui se transforme en mousse avec de l'eau."},{"id":"BT0401","w":"백탁 현상","k":"h","rom":"baektak hyeonsang","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"백탁(白濁)+현상(現象)","cat":"clean","mean":"오일 유화 시 표면이 하얗게 바뀌는 시각적 반응.","ex":"물을 묻혀 문지르자 오일이 하얗게 변하는 백탁 현상이 나타났다.","fr":"émulsification blanchâtre","frpos":"n.f.pl.","frdef":"Voile blanc laissé par un solaire minéral ou l'émulsion d'une huile."},{"id":"BT0402","w":"버블 롤링","k":"h","rom":"beobeul rolling","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"bubble+rolling","cat":"clean","mean":"거품을 피부 위에서 굴리며 세정하는 동작.","ex":"손을 대지 않고 버블 롤링으로만 세안한다.","fr":"massage à la mousse","frpos":"loc.n.","frdef":"Faire rouler la mousse sur la peau pour nettoyer."},{"id":"BT0403","w":"버블 폼","k":"h","rom":"beobeul pom","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"bubble+foam","cat":"clean","mean":"별도로 거품을 내지 않아도 펌프 용기에서 거품 형태로 나오는 클렌저.","ex":"버블 폼이라 펌프를 누르면 바로 거품이 나와 아침에 편하다.","fr":"mousse prête à l'emploi","frpos":"loc.n.","frdef":"Nettoyant qui sort directement en mousse d'un flacon-pompe."},{"id":"BT0410","w":"생크림 거품","k":"h","rom":"saengkeurim geopum","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"생크림(生+cream)+거품","cat":"clean","mean":"밀도가 높고 부드러운 풍성한 형태의 거품 질감 비유.","ex":"거품망으로 삼십 초만 문지르면 생크림 거품이 만들어진다.","fr":"mousse « crème fouettée »","frpos":"loc.n.","frdef":"Mousse dense et onctueuse comparée à la crème chantilly."},{"id":"BT0411","w":"세안 마찰감","k":"h","rom":"sean machalgam","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"세안(洗顔)+마찰감(摩擦感)","cat":"clean","mean":"세안 시 손가락이 피부에 직접 문질러지며 느끼는 뻑뻑한 마찰.","ex":"거품이 적으면 세안 마찰감이 커져서 피부가 따갑다.","fr":"friction au nettoyage","frpos":"loc.n.","frdef":"Frottement ressenti quand les doigts touchent directement la peau."},{"id":"BT0412","w":"세정력","k":"h","rom":"sejeongnyeok","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"세정(洗淨)+-력(力)","cat":"clean","mean":"메이크업이나 노폐물을 씻어내는 성능 및 능력.","ex":"세정력이 좋아서 워터프루프 마스카라도 한 번에 지워진다.","fr":"pouvoir nettoyant","frpos":"loc.n.","frdef":"Capacité à éliminer maquillage et impuretés."},{"id":"BT0413","w":"셔벗 밤","k":"h","rom":"syeobeot bam","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"sherbet+balm","cat":"clean","mean":"사각거리는 셔벗 질감으로 체온에 닿으면 오일로 부드럽게 녹는 밤 제형.","ex":"식물나라 제주 탄산수 딥 모공 클렌징 셔벗 밤.","fr":"baume sorbet","frpos":"loc.n.","frdef":"Baume démaquillant à texture de sorbet qui fond en huile.","par":"밤 투 폼","rel":"관련어(참고)"},{"id":"BT0414","w":"속당김","k":"h","rom":"sokdanggim","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"속+당김(당기다+-ㅁ)","cat":"clean","mean":"세안 후 피부 깊은 층이 건조하여 당기는 듯한 감촉.","ex":"세안하고 나면 속당김이 심해서 바로 토너를 바른다.","fr":"tiraillement profond","frpos":"loc.n.","frdef":"Sensation de peau qui tire en profondeur après le nettoyage.","par":"당기다","rel":"관련어(참고)"},{"id":"BT0415","w":"손가락 러빙","k":"h","rom":"songarak reobing","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"손가락+러빙(rubbing)","cat":"clean","mean":"손가락으로 피부 표면을 부드럽게 문지르는 세안 동작.","ex":"손가락 러빙은 약지에 힘을 빼고 원을 그리며 한다.","fr":"frottement du bout des doigts","frpos":"loc.n.","frdef":"Massage léger du bout des doigts lors du nettoyage."},{"id":"BT0416","w":"수분 보습막","k":"h","rom":"subun boseummak","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"수분(水分)+보습막(保濕膜)","cat":"clean","mean":"수분이 공기 중으로 빠져나가지 못하도록 세안 후 피부를 감싸는 얇은 층.","ex":"세안 뒤에도 수분 보습막이 남아 얼굴이 당기지 않는다.","fr":"film hydratant","frpos":"loc.n.","frdef":"Fine couche qui limite la perte d'eau après le nettoyage."},{"id":"BT0417","w":"수분 장벽 보호","k":"h","rom":"subun jangbyeok boho","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"수분+장벽+보호(保護)","cat":"clean","mean":"세안 시 피부 표피 각질층의 수분 손실을 막아주는 효과.","ex":"약산성 클렌저라 수분 장벽 보호에 신경 쓴 제품이다.","fr":"protection de la barrière hydrique","frpos":"loc.n.","frdef":"Préserver l'eau de la couche cornée pendant le nettoyage."},{"id":"BT0418","w":"수분 진정","k":"h","rom":"subun jinjeong","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"수분(水分)+진정(鎭靜)","cat":"clean","mean":"수분을 공급하여 세안 시 마찰감으로 민감해진 피부를 가라앉힘.","ex":"햇볕을 쬔 날은 알로에 젤로 수분 진정을 해 준다.","fr":"apaisement hydratant","frpos":"loc.n.","frdef":"Apaiser la peau en lui apportant de l'eau."},{"id":"BT0419","w":"수분 충전","k":"h","rom":"subun chungjeon","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"수분(水分)+충전(充塡)","cat":"clean","mean":"피부 층 깊숙이 물기나 수분 입자를 보충해주는 세안 효과.","ex":"자기 전에 시트 마스크로 수분 충전을 한다.","fr":"recharge en hydratation","frpos":"loc.n.","frdef":"Apport important d'eau à la peau."},{"id":"BT0420","w":"스크럽 폼","k":"h","rom":"seukeureop pom","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"scrub+foam","cat":"clean","mean":"세안 폼 속에 물리적 알갱이가 포함되어 세정과 각질 제거를 동시에 하는 제형.","ex":"스크럽 폼은 알갱이가 있어 일주일에 한 번만 쓴다.","fr":"mousse exfoliante","frpos":"loc.n.","frdef":"Nettoyant moussant contenant des grains exfoliants."},{"id":"BT0422","w":"슬러딩","k":"h","rom":"seulleoding","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"slugging 차용","cat":"clean","mean":"밤 제형을 얼굴 전체에 덮어 밀폐막을 형성해 세정 및 보습하는 방식.","ex":"건조한 밤에는 크림 위에 밤을 덮는 슬러딩을 한다.","fr":"slugging","frpos":"n.m.","frdef":"Tendance consistant à couvrir le visage d'un baume occlusif (type vaseline) pour la nuit."},{"id":"BT0424","w":"약알칼리성","k":"h","rom":"yagalkalliseong","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"약-(弱)+알칼리(alkali)+-성(性)","cat":"clean","mean":"pH 산도가 높고 세정력이 강해 지성 피부 유분을 깨끗이 제거하는 성질.","ex":"약알칼리성 비누라 뽀득하게 씻기지만 조금 당긴다.","fr":"légèrement alcalin","frpos":"loc.adj.","frdef":"pH légèrement basique, typique des savons et nettoyants décapants."},{"id":"BT0425","w":"엠보 패드","k":"h","rom":"embo paedeu","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"embo(ssing)+pad","cat":"clean","mean":"올록볼록한 표면 처리가 되어 노폐물 세정을 돕는 패드.","ex":"엠보 패드의 올록볼록한 면으로 코 옆을 닦는다.","fr":"coton gaufré","frpos":"loc.n.","frdef":"Disque à surface en relief qui aide à éliminer les impuretés.","par":"토너 패드","rel":"하위어(참고)"},{"id":"BT0426","w":"오일 겉돎","k":"s","rom":"oil geotdom","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"오일(oil)+겉돎(겉돌다+-ㅁ)","cat":"clean","mean":"클렌징 오일이 노폐물을 녹이지 못하고 피부 표면에서 따로 노는 현상.","ex":"물을 섞지 않고 문지르면 오일 겉돎이 생겨 잘 지워지지 않는다.","fr":"huile qui ne s'émulsionne pas","frpos":"loc.n.","frdef":"Huile démaquillante qui reste en surface sans dissoudre le maquillage.","par":"겉돌다","rel":"연어"},{"id":"BT0427","w":"오일 세안","k":"h","rom":"oil sean","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"오일(oil)+세안(洗顔)","cat":"clean","mean":"클렌징 오일을 주요 세안제로 사용하는 세안 방식.","ex":"선크림을 바른 날은 오일 세안을 빼먹지 않는다.","fr":"nettoyage à l'huile","frpos":"loc.n.","frdef":"Nettoyage dont le produit principal est une huile.","par":"이중 세안","rel":"관련어(참고)"},{"id":"BT0428","w":"올인원 클렌저","k":"h","rom":"orinwon keullenjeo","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"all-in-one+cleanser","cat":"clean","mean":"여러 단계의 클렌저 역할을 제품 하나로 완결해주는 세안용 화장품.","ex":"올인원 클렌저 하나로 화장과 세안을 한 번에 끝낸다.","fr":"nettoyant tout-en-un","frpos":"loc.n.","frdef":"Nettoyant qui remplace plusieurs étapes de démaquillage."},{"id":"BT0429","w":"워터프루프 클렌징","k":"h","rom":"woteopeurupeu keullenjing","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"waterproof+cleansing","cat":"clean","mean":"물에 잘 지워지지 않는 방수 메이크업 제품을 녹여 지우는 기능.","ex":"워터프루프 클렌징이 되는지 손등에 마스카라를 발라 시험해 봤다.","fr":"démaquillage waterproof","frpos":"loc.n.","frdef":"Capacité à éliminer le maquillage résistant à l'eau."},{"id":"BT0430","w":"원스텝 세안","k":"h","rom":"wonseutep sean","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"원스텝(one-step)+세안(洗顔)","cat":"clean","mean":"이중 세안 없이 한 번의 세안 과정만으로 립앤아이 포함 메이크업을 끝내는 세안.","ex":"야근한 날은 클렌징 워터로 원스텝 세안만 하고 잔다.","fr":"nettoyage en une étape","frpos":"loc.n.","frdef":"Démaquillage et nettoyage en une seule fois, sans double nettoyage.","par":"이중 세안","rel":"관련어(참고)"},{"id":"BT0432","w":"유화 과정","k":"h","rom":"yuhwa gwajeong","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"유화(乳化)+과정(過程)","cat":"clean","mean":"클렌징 오일이 물과 만나 하얗게 변하며 오염 물질을 떼어내는 핵심 단계.","ex":"유화 과정을 충분히 거쳐야 오일이 깨끗하게 씻겨 나간다.","fr":"émulsification","frpos":"n.f.","frdef":"Moment où l'huile démaquillante devient laiteuse au contact de l'eau."},{"id":"BT0433","w":"이중 세안","k":"h","rom":"ijung sean","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"이중(二重)+세안(洗顔)","cat":"clean","mean":"1차 세안제와 2차 세안제를 연속으로 사용하여 완성하는 두 번 세안법.","ex":"화장을 한 날에는 오일과 폼으로 이중 세안을 한다.","fr":"double nettoyage","frpos":"n.m.","frdef":"Méthode coréenne: huile ou baume, puis nettoyant moussant."},{"id":"BT0437","w":"지우개 패드","k":"h","rom":"jiugae paedeu","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"지우개+패드(pad)","cat":"clean","mean":"피부 표면의 각질이나 클렌징 노폐물을 지우개로 지우듯 깨끗이 닦아내는 패드.","ex":"매끈 피부결 지우개 패드.","fr":"disque « gomme »","frpos":"loc.n.","frdef":"Disque exfoliant qui « efface » les impuretés comme une gomme.","par":"토너 패드","rel":"하위어(참고)"},{"id":"BT0438","w":"짜밤","k":"h","rom":"jjabam","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"짜(다)+밤(balm) 축약","cat":"clean","mean":"스파출러 없이 튜브 용기에서 단번에 짜서 쓰는 클렌징밤의 줄임말.","ex":"짜밤은 튜브에서 짜서 쓰니 스패출러가 필요 없다.","fr":"baume à presser","frpos":"loc.n.","frdef":"Abréviation de « 짜서 쓰는 밤 »: baume démaquillant en tube.","par":"밤 투 폼","rel":"관련어(참고)"},{"id":"BT0440","w":"착붙 거품","k":"h","rom":"chakbut geopum","pos":"명사","unit":"구","eo":"고유어","form":"구(句)","memo":"착붙(착 붙다 축약)+거품","cat":"clean","mean":"피부 표면에 밀착력이 높아 흐르지 않고 착 붙어있는 조밀한 거품.","ex":"착붙 거품이라 얼굴에 올려 두어도 흘러내리지 않는다.","fr":"mousse qui adhère","frpos":"loc.n.","frdef":"Mousse dense qui colle à la peau sans couler.","par":"착붙","rel":"관련어(참고)"},{"id":"BT0441","w":"착색","k":"h","rom":"chaksaek","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"착(着)+색(色) (클렌징 문맥의 다의 항목)","cat":"clean","mean":"① 색소 물질이 피부 표면이나 틈새에 들어붙어 씻기지 않고 색이 남음.\n② 틴트 색이 입술에 물들어 남는 것.","ex":"틴트를 지워도 입술에 착색이 남아 생기 있어 보인다.","fr":"coloration résiduelle ; tenue de la teinte (stain)","frpos":"n.f.","frdef":"1. Pigment qui reste sur la peau ou les lèvres après le nettoyage. 2. Couleur du tint qui reste imprégnée dans les lèvres."},{"id":"BT0442","w":"착색 제거","k":"h","rom":"chaksaek jegeo","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"착색(着色)+제거(除去)","cat":"clean","mean":"입술이나 눈가에 물든 강한 색소 자국을 물들기 전 원래 상태로 씻어냄.","ex":"립 리무버로 문질러 착색 제거를 했다.","fr":"élimination des pigments tenaces","frpos":"loc.n.","frdef":"Enlever les pigments de teinte incrustés (lèvres, yeux)."},{"id":"BT0443","w":"착색 틴트","k":"h","rom":"chaksaek tinteu","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"착색(着色)+틴트(tint)","cat":"clean","mean":"입술 각질 층에 색소가 강하게 물들어 지우기 어려운 립 화장품.","ex":"마스크에 묻지 않게 하려고 착색 틴트를 바른다.","fr":"teinte à forte pigmentation (tint)","frpos":"loc.n.","frdef":"Encre à lèvres qui teinte durablement et se démaquille difficilement.","par":"틴트","rel":"하위어(참고)"},{"id":"BT0455","w":"클렌징 패드","k":"h","rom":"keullenjing paedeu","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"cleansing+pad","cat":"clean","mean":"클렌징 워터나 오일이 적셔져 있어 세안 시 간편하게 닦아내는 패드.","ex":"피곤한 날에는 클렌징 패드 한 장으로 화장을 닦아 낸다.","fr":"disque nettoyant imbibé","frpos":"loc.n.","frdef":"Disque pré-imbibé de lotion ou d'huile démaquillante.","par":"토너 패드","rel":"하위어(참고)"},{"id":"BT0456","w":"클렌징 팩","k":"h","rom":"keullenjing paek","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"cleansing+pack","cat":"clean","mean":"팩으로 영양 공급 후 물을 묻혀 세안제로 전환해 씻어내는 제품.","ex":"클렌징 팩을 오 분 올려 두었다가 물을 묻혀 씻어 냈다.","fr":"masque nettoyant","frpos":"loc.n.","frdef":"Masque qui se transforme en nettoyant au contact de l'eau.","par":"마스크 팩","rel":"하위어(참고)"},{"id":"BT0458","w":"토닝 세안","k":"h","rom":"toning sean","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"토닝(toning)+세안(洗顔)","cat":"clean","mean":"세정 작업과 함께 피부 결을 맑고 고르게 바로잡아주는 세안.","ex":"비타민 폼으로 토닝 세안을 하면 얼굴이 한결 맑아 보인다.","fr":"nettoyage unifiant","frpos":"loc.n.","frdef":"Nettoyage qui promet aussi d'unifier le teint."},{"id":"BT0459","w":"패드 닦아내기","k":"h","rom":"paedeu dakkanaegi","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"패드(pad)+닦아내기(닦아내다+-기)","cat":"clean","mean":"패드를 이용해 피부 표면의 노폐물을 문질러 지우는 동작.","ex":"아침에는 물세안 대신 패드 닦아내기로 끝낸다.","fr":"essuyage au disque","frpos":"loc.n.","frdef":"Essuyer la peau avec un disque imbibé.","par":"닦토","rel":"관련어(참고)"},{"id":"BT0460","w":"포인트 메이크업","k":"h","rom":"pointeu meikeueop","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"point+make-up(한국식 조어)","cat":"clean","mean":"립, 아이 등 특정 부위에 강한 색조와 방수성이 들어가는 메이크업 세정 대상.","ex":"포인트 메이크업은 전용 리무버로 먼저 지운다.","fr":"maquillage des yeux et des lèvres","frpos":"loc.n.","frdef":"Maquillage localisé (yeux, lèvres) souvent waterproof, à démaquiller à part.","faux":1},{"id":"BT0463","w":"피부 결 정돈","k":"h","rom":"pibu gyeol jeongdon","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"피부+결+정돈(整頓)","cat":"clean","mean":"피부 표면의 미세한 방향과 각질 상태를 일정하고 매끈하게 정돈함.","ex":"세안 후 토너로 피부 결 정돈을 하고 에센스를 바른다.","fr":"lissage du grain de peau","frpos":"loc.n.","frdef":"Rendre la surface de la peau plus lisse et régulière."},{"id":"BT0464","w":"피지 딥 세정","k":"h","rom":"piji dip sejeong","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"피지(皮脂)+딥(deep)+세정(洗淨)","cat":"clean","mean":"모공 내부의 피지를 깊이 있게 씻어내는 세안 동작.","ex":"클레이 폼으로 일주일에 한 번 피지 딥 세정을 한다.","fr":"nettoyage profond du sébum","frpos":"loc.n.","frdef":"Nettoyage qui élimine le sébum en profondeur dans les pores."},{"id":"BT0465","w":"피지 멜팅","k":"h","rom":"piji melting","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"피지(皮脂)+멜팅(melting)","cat":"clean","mean":"굳은 피지를 오일 성분으로 부드럽게 녹여내는 효능.","ex":"따뜻한 오일로 문지르면 피지 멜팅이 되어 블랙헤드가 줄어든다.","fr":"dissolution du sébum","frpos":"loc.n.","frdef":"Faire fondre le sébum durci avec une huile.","par":"피지 연화","rel":"관련어(참고)"},{"id":"BT0466","w":"피지 뭉침","k":"h","rom":"piji mungchim","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"피지(皮脂)+뭉침(뭉치다+-ㅁ)","cat":"clean","mean":"피지가 배출되지 못하고 한자리에 덩어리져 굳어있는 현상.","ex":"코 옆에 피지 뭉침이 하얗게 올라와 있었다.","fr":"amas de sébum","frpos":"loc.n.","frdef":"Sébum accumulé et durci dans les pores.","par":"뭉침","rel":"관련어(참고)"},{"id":"BT0471","w":"피지 연화","k":"h","rom":"piji yeonhwa","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"피지(皮脂)+연화(軟化)","cat":"clean","mean":"딱딱하게 굳은 모공 속 피지를 억지로 뽑지 않고 부드럽게 불려 녹여내는 과정.","ex":"스팀 타월로 피지 연화를 한 뒤에 코 팩을 붙였다.","fr":"ramollissement du sébum","frpos":"loc.n.","frdef":"Assouplir le sébum durci sans l'extraire de force."},{"id":"BT0472","w":"피지 자갈밭","k":"h","rom":"piji jagalbat","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"피지+자갈밭(자갈+밭)","cat":"clean","mean":"모공 속에 피지가 오돌토돌 울퉁불퉁 뭉쳐 있는 세안 전 피부 상태 비유.","ex":"세안 전에 코를 만져 보면 피지 자갈밭처럼 오돌토돌하다.","fr":"« champ de cailloux » de sébum","frpos":"loc.n.","frdef":"Métaphore pour une peau couverte de sébum durci et granuleux.","par":"피지 연화","rel":"관련어(참고)"},{"id":"BT0476","w":"효소 세안","k":"h","rom":"hyoso sean","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"효소(酵素)+세안(洗顔)","cat":"clean","mean":"효소 성분을 활용하여 화학적/생물학적으로 각질을 녹이는 세안 방식.","ex":"효소 세안은 자극이 적어 민감한 피부도 할 수 있다.","fr":"nettoyage enzymatique","frpos":"loc.n.","frdef":"Nettoyage utilisant des enzymes pour dissoudre les peaux mortes."},{"id":"BT0477","w":"효소 파우더","k":"h","rom":"hyoso paudeo","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"효소(酵素)+파우더(powder)","cat":"clean","mean":"단백질 분해 효소가 들어있어 가루에 물을 묻혀 거품을 내어 각질을 분해하는 클렌저.","ex":"효소 파우더에 물을 섞어 거품을 낸 뒤 코 위주로 문지른다.","fr":"poudre nettoyante enzymatique","frpos":"loc.n.","frdef":"Poudre qui mousse avec l'eau et exfolie grâce aux enzymes."},{"id":"BT0478","w":"T존","k":"h","rom":"Tjon","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"T(알파벳)+존(zone)","cat":"clean","mean":"이마와 코 줄기를 잇는 T자 모양의 유분 분비가 많은 세안 집중 부위.","ex":"T존에만 기름종이를 눌러 유분을 걷어 낸다.","fr":"zone T","frpos":"n.f.","frdef":"Front et nez, zone la plus grasse du visage."},{"id":"BT0479","w":"U존","k":"h","rom":"Ujon","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"U(알파벳)+존(zone)","cat":"clean","mean":"양 볼과 턱 선을 잇는 U자 모양의 건조해지기 쉬운 피부 영역.","ex":"U존은 건조해서 크림을 한 번 더 덧바른다.","fr":"zone U","frpos":"n.f.","frdef":"Joues et contour de la mâchoire, zone souvent plus sèche."},{"id":"BT0480","w":"7스킨법","k":"h","rom":"7seukinbeop","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"7(숫자)+스킨(skin=토너)+-법(法)","cat":"skin","mean":"토너를 시간차를 두고 여러 번 반복해서 바르는 방법 이름.","ex":"토너를 손바닥에 덜어 여러 번 레이어링하는 7스킨법에 적합한 토너입니다.","fr":"méthode des 7 toners","frpos":"loc.n.","frdef":"Méthode coréenne: appliquer le toner sept fois de suite pour hydrater.","par":"닦토","rel":"관련어(참고)"},{"id":"BT0481","w":"닦토","k":"h","rom":"dakto","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"닦(다)+토(너) 축약","cat":"skin","mean":"토너를 묻힌 화장솜으로 피부를 닦는 사용법을 뜻한다.","ex":"확실히 닦토나 토너팩으로 쓰면 자극받은 피부가 빠르게 진정됩니다.","fr":"toner à essuyer","frpos":"loc.n.","frdef":"Abréviation de « 닦는 토너 »: toner appliqué avec un coton pour essuyer la peau."},{"id":"BT0482","w":"멀티 토너","k":"h","rom":"meolti toneo","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"multi+toner","cat":"skin","mean":"닦토·반복 흡수·스킨팩·미스트 등 여러 방식으로 쓰는 토너.","ex":"스킨팩, 닦토 등 다양하게 활용 가능한 멀티 토너입니다.","fr":"toner multi-usages","frpos":"loc.n.","frdef":"Toner utilisable en lotion, masque, brume, etc."},{"id":"BT0483","w":"물토너","k":"h","rom":"multoneo","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"물(고유어)+토너(toner)","cat":"skin","mean":"물처럼 묽게 흐르는 제형의 토너를 가리킨다.","ex":"제형은 가벼운 물토너 형태이지만 보습력이 매우 뛰어납니다.","fr":"toner aqueux","frpos":"loc.n.","frdef":"Toner très liquide, comme de l'eau."},{"id":"BT0485","w":"미스트 펌프","k":"h","rom":"miseuteu peompeu","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"mist+pump","cat":"skin","mean":"토너를 안개처럼 분사하여 쓰는 데 사용하는 펌프 도구.","ex":"미스트 펌프 용기가 결합되어 간편하게 분사하여 사용할 수 있습니다.","fr":"pompe vaporisatrice","frpos":"loc.n.","frdef":"Embout qui transforme un toner en brume.","par":"펌프형","rel":"관련어(참고)"},{"id":"BT0487","w":"세미 겔 패드","k":"h","rom":"semi gel paedeu","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"semi+gel+pad","cat":"skin","mean":"토너를 적셔 피부에 얹어 팩처럼 사용하는 패드 도구를 가리키는 제품 안내 표현.","ex":"토너를 듬뿍 적신 세미 겔 패드로 피부를 부드럽게 닦아냅니다.","fr":"disque semi-gel","frpos":"loc.n.","frdef":"Disque à texture gélifiée qu'on imbibe de toner et pose sur la peau.","par":"토너 패드","rel":"하위어(참고)"},{"id":"BT0488","w":"에센스 토너","k":"h","rom":"esenseu toneo","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"essence+toner","cat":"skin","mean":"에센스라는 명칭을 결합해 관리감을 강조하는 토너의 상품명 표현.","ex":"포도당 하이드로 성분이 들어간 진한 에센스 토너입니다.","fr":"toner-essence","frpos":"loc.n.","frdef":"Toner enrichi, à mi-chemin entre toner et essence."},{"id":"BT0490","w":"캡슐 토너","k":"h","rom":"kaepsyul toneo","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"capsule+toner","cat":"skin","mean":"내용물의 캡슐을 특징으로 내세우는 토너의 상품명 표현.","ex":"시카 캡슐이 함유되어 피부를 빠르게 다독여주는 캡슐 토너입니다.","fr":"toner à capsules","frpos":"loc.n.","frdef":"Toner contenant des microcapsules d'actifs."},{"id":"BT0491","w":"크림 토너","k":"h","rom":"keurim toneo","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"cream+toner","cat":"skin","mean":"크림의 보습 특성을 강조하는 토너 유형.","ex":"크림의 보습력을 그대로 담은 크림 토너 제품입니다.","fr":"toner crème","frpos":"loc.n.","frdef":"Toner laiteux enrichi en agents hydratants."},{"id":"BT0492","w":"토너","k":"h","rom":"toneo","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"toner 차용","cat":"skin","mean":"세안 뒤 피부에 바르는 기초 화장품을 가리킨다.","ex":"어성초와 히알루론산 성분이 결합된 수분 진정 토너입니다.","fr":"lotion tonique / tonique","frpos":"n.f. / n.m.","frdef":"Première lotion liquide après le nettoyage ; en Corée aussi appelée « 스킨 ».","faux":1},{"id":"BT0493","w":"토너 팩","k":"h","rom":"toneo paek","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"toner+pack","cat":"skin","mean":"토너를 적신 솜 등을 피부에 올려 팩처럼 사용하는 방법.","ex":"화장솜에 적셔 토너 팩으로 활용하면 피로해진 피부가 금세 진정됩니다.","fr":"masque au toner","frpos":"loc.n.","frdef":"Cotons imbibés de toner posés sur le visage quelques minutes.","par":"닦토","rel":"관련어(참고)"},{"id":"BT0495","w":"흡토","k":"h","rom":"heupto","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"흡(수)+토(너) 축약","cat":"skin","mean":"닦아내기보다 피부에 토너를 발라 흡수시키는 사용법.","ex":"피부에 찹찹 두드려 흡수시키는 흡토 전용 제품으로 좋습니다.","fr":"toner à faire pénétrer","frpos":"loc.n.","frdef":"Abréviation de « 흡수시키는 토너 »: toner tapoté pour être absorbé (opposé à 닦토).","par":"닦토","rel":"관련어(참고)"},{"id":"BT0497","w":"물세럼","k":"h","rom":"mulsereom","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"물+세럼(serum)","cat":"skin","mean":"물처럼 가벼운 액상 세럼을 가리키는 소비자 표현.","ex":"물세럼을 바르고 그 위에 크림을 덧발라 마무리한다.","fr":"sérum aqueux","frpos":"loc.n.","frdef":"Sérum très fluide, presque comme de l'eau."},{"id":"BT0499","w":"부스터","k":"h","rom":"buseuteo","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"booster 차용","cat":"skin","mean":"특정 피부 고민의 집중 관리를 강조하며 부르는 기초 제품 유형.","ex":"세안 직후 부스터를 먼저 바르면 다음 단계가 잘 흡수된다.","fr":"booster (pré-sérum)","frpos":"n.m.","frde ,"frdef":"Soin qui lisse et affine la texture de la peau."},{"id":"BT0540","w":"광노화 케어","k":"h","rom":"gwangnohwa keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"광노화(光老化)+케어(care)","cat":"sun","mean":"자외선 노출에 의한 피부 노화, 주름, 탄력 저하를 방지하고 예방하는 관리","ex":"자외선으로 인한 피부 손상과 광노화 케어를 동시에 돕습니다.","fr":"soin contre le photovieillissement","frpos":"n.m.","frdef":"Prévention du vieillissement cutané dû aux UV."},{"id":"BT0541","w":"기름종이 선스틱","k":"h","rom":"gireumjongi seonseutik","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"기름종이+선스틱(sun stick)","cat":"sun","mean":"기름종이를 사용한 것처럼 기름을 없애준다는 비유적 제품 표현","ex":"피부에 문지르는 순간 기름종이 선스틱처럼 유분기를 싹 잡아줍니다.","fr":"stick solaire matifiant","frpos":"loc.n.","frdef":"Stick solaire qui absorbe le sébum comme un papier matifiant.","par":"톤업 선크림","rel":"관련어(참고)"},{"id":"BT0542","w":"논나노 무기자차","k":"h","rom":"nonnano mugijacha","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"논나노(non-nano)+무기자차(축약어)","cat":"sun","mean":"입자 크기가 나노 단위보다 크나 피부 속에 직접 흡수되지 않아 더욱 순하고 안전한 무기 자차","ex":"비나노 무기 자외선 차단 필터를 사용한 논나노 무기자차 성분을 적용했습니다.","fr":"filtre minéral non nano","frpos":"loc.n.","frdef":"Produit de protection solaire contenant des filtres UV minéraux dont les particules sont présentées comme non nanométriques.","ing":"한국어: 입자를 나노 크기 미만으로 만들지 않은 무기 자외선 차단 성분을 썼다는 표시.\nFrançais : Un écran solaire minéral dit « non nano » contient des filtres minéraux dont la forme particulaire est présentée comme non nanométrique; cette mention doit être vérifiée selon les critères réglementaires applicables.","inci":"Zinc Oxide / Titanium Dioxide (non-nano)","par":"무기자차","rel":"관련어(참고)"},{"id":"BT0543","w":"다공성 파우더","k":"h","rom":"dagongseong paudeo","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"다공성(多孔性)+파우더(powder)","cat":"sun","mean":"미세한 구멍이 뚫려 있어 피지나 유분을 흡수하는 파우더 성분","ex":"다공성 파우더 성분이 피지를 효과적으로 잡아주어 하루 종일 보송합니다.","fr":"poudre poreuse","frpos":"loc.n.","frdef":"Poudre à micro-pores (silice…) qui absorbe le sébum.","ing":"한국어: 미세한 구멍이 많은 파우더(실리카 def":"Soin concentré pour les cuticules.","par":"큐티클 케어","rel":"관련어(참고)"},{"id":"BT1044","w":"매니큐어","k":"h","rom":"maenikyueo","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"manicure 차용(의미 전이: 거짓 짝)","cat":"nail","mean":"손톱에 바르는 색 액체(네일 폴리시). 한국어에서만 손 관리가 아니라 제품을 가리킴.","ex":"quick-dry 처방으로 60초 만에 빠르게 마르는 시럽 매니큐어입니다.","fr":"vernis à ongles","frpos":"n.m.","frdef":"En coréen, désigne le vernis à ongles (le produit), et non le soin des mains comme en français.","faux":1},{"id":"BT1048","w":"필오프 베이스","k":"h","rom":"piropeu beiseu","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"peel-off+base","cat":"nail","mean":"젤이나 폴리시 밑에 발라 두면 리무버 없이 한 번에 떼어 낼 수 있는 베이스.","ex":"리무버 없이 쏙 떼어낼 수 있도록 돕는 필오프 베이스 코트입니다.","fr":"base peel-off","frpos":"loc.n.","frdef":"Base qui permet de retirer le vernis en le pelant.","par":"매니큐어","rel":"관련어(참고)"},{"id":"BT1050","w":"수성 네일","k":"h","rom":"suseong neil","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"수성(水性)+네일(nail)","cat":"nail","mean":"물이 주성분이라 냄새가 적고 리무버 없이 벗겨 내는 네일 폴리시.","ex":"자극적인 냄새 없이 순하게 사용하는 안심 수성 네일입니다.","fr":"vernis à l'eau","frpos":"loc.n.","frdef":"Vernis à base d'eau, peu odorant.","par":"매니큐어","rel":"관련어(참고)"},{"id":"BT1051","w":"노 리무버","k":"h","rom":"no rimubeo","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"노(no)+리무버(remover)","cat":"nail","mean":"리무버를 쓰지 않고 떼어 내거나 벗길 수 있다는 표시.","ex":"아세톤 리무버 없이 간편하게 떼어내어 제거할 수 있는 노리무버 제품입니다.","fr":"sans dissolvant","frpos":"loc.adj.","frdef":"Vernis qui s'enlève sans dissolvant.","par":"매니큐어","rel":"관련어(참고)"},{"id":"BT1061","w":"까시레기","k":"h","rom":"kkasiregi","pos":"명사","unit":"단어","eo":"고유어","form":"단일어","memo":"「거스러미」의 방언·구어형(단일어)","cat":"nail","mean":"손톱 옆에 일어난 살 껍질. 「거스러미」의 방언·구어형.","ex":"손가락 주변에 까시레기가 자주 올라올 때 케어 오일을 발라줍니다.","fr":"petites peaux (envies)","frpos":"n.f.pl.","frdef":"Mot dialectal/familier pour les petites peaux arrachées autour des ongles (표준어: 거스러미).","par":"큐티클 케어","rel":"관련어(참고)"},{"id":"BT1068","w":"모피질","k":"h","rom":"mopijil","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"모(毛)+피질(皮質)","cat":"hair","mean":"머리카락의 가운데 층. 단백질 섬유가 모여 있어 모발의 굵기와 탄력을 결정함.","ex":"탈색을 여러 번 하면 모피질까지 손상되어 머리카락이 끊어진다.","fr":"cortex","frpos":"n.m.","frdef":"Partie centrale du cheveu, riche en kératine."},{"id":"BT1069","w":"모수질","k":"h","rom":"mosujil","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"모(毛)+수질(髓質)","cat":"hair","mean":"머리카락 한가운데의 심 부분.","ex":"굵은 머리카락일수록 가운데에 모수질이 뚜렷하다.","fr":"moelle du cheveu","frpos":"n.f.","frdef":"Canal central du cheveu (médulla)."},{"id":"BT1070","w":"모발 다공성","k":"h","rom":"mobal dagongseong","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"모발(毛髮)+다공성(多孔性)","cat":"hair","mean":"머리카락이 수분과 성분을 흡수하고 내보내는 정도. 손상될수록 높아짐.","ex":"모발 다공성이 높으면 염색이 빨리 들지만 빨리 빠지기도 한다.","fr":"porosité capillaire","frpos":"n.f.","frdef":"Capacité du cheveu abîmé à absorber et perdre l'eau."},{"id":"BT1072","w":"모발 인장강도","k":"h","rom":"mobal injanggangdo","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"모발+인장강도(引張強度)","cat":"hair","mean":"머리카락이 당기는 힘을 끊어지지 않고 견디는 정도.","ex":"펌을 자주 하면 모발 인장강도가 약해져 쉽게 끊어진다.","fr":"résistance à la traction du cheveu","frpos":"loc.n.","frdef":"Force que supporte un cheveu avant de casser."},{"id":"BT1073","w":"모발 수분도","k":"h","rom":"mobal subundo","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"모발+수분도(水分度)","cat":"hair","mean":"머리카락이 머금고 있는 수분의 정도.","ex":"겨울에는 모발 수분도가 떨어져 정전기가 잘 생긴다.","fr":"taux d'hydratation du cheveu","frpos":"loc.n.","frdef":"Quantité d'eau contenue dans la fibre."},{"id":"BT1074","w":"모발 유수분 밸런스","k":"h","rom":"mobal yusubun baelleonseu","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"모발+유수분+밸런스(balance)","cat":"hair","mean":"머리카락의 수분과 유분이 알맞게 균형을 이룬 상태.","ex":"오일과 미스트를 함께 써서 모발 유수분 밸런스를 맞춘다.","fr":"équilibre eau-lipides du cheveu","frpos":"loc.n.","frdef":"Équilibre entre hydratation et lipides de la fibre capillaire."},{"id":"BT1075","w":"모발 지질층","k":"h","rom":"mobal jijilcheung","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"모발+지질층(脂質層)","cat":"hair","mean":"머리카락 표면을 덮어 윤기와 매끄러움을 주는 기름막.","ex":"잦은 샴푸로 모발 지질층이 벗겨지면 머릿결이 거칠어진다.","fr":"couche lipidique du cheveu","frpos":"loc.n.","frdef":"Film lipidique protecteur à la surface du cheveu."},{"id":"BT1076","w":"모발 단백질 결합","k":"h","rom":"mobal danbaekjil gyeolhap","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"모발+단백질+결합(結合)","cat":"hair","mean":"머리카락 속 단백질 사슬을 서로 이어 주는 결합.","ex":"열과 약제는 모발 단백질 결합을 끊어 손상을 일으킨다.","fr":"liaisons protéiques du cheveu","frpos":"loc.n.","frdef":"Liaisons qui structurent la kératine du cheveu."},{"id":"BT1077","w":"시스틴 결합","k":"h","rom":"siseutin gyeolhap","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"시스틴(cystine)+결합(結合)","cat":"hair","mean":"머리카락 단백질의 시스틴 사이에 생기는 결합. 모발의 형태를 잡아 줌.","ex":"펌은 시스틴 결합을 끊었다가 다시 이어 컬을 만든다.","fr":"pont disulfure entre résidus de cystine","frpos":"loc.n.","frdef":"Liaison entre deux cystéines, clé de la forme du cheveu."},{"id":"BT1078","w":"이황화 결합","k":"h","rom":"ihwanghwa gyeolhap","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"이황화(二黃化)+결합(結合)","cat":"hair","mean":"황 원자 둘이 이어진 결합. 머리카락의 강도와 모양을 유지함.","ex":"본드 케어 제품은 끊어진 이황화 결합을 다시 이어 준다고 광고한다.","fr":"pont disulfure","frpos":"n.m.","frdef":"Liaison soufrée modifiée par les permanentes et lissages."},{"id":"BT1080","w":"가수분해 케라틴","k":"h","rom":"gasubunhae keratin","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"가수분해(加水分解)+케라틴(keratin)","cat":"hair","mean":"흡수되기 쉽게 잘게 쪼갠 케라틴 단백질. 손상 모발 보수 성분.","ex":"가수분해 케라틴이 든 트리트먼트로 손상모를 관리한다.","fr":"kératine hydrolysée","frpos":"loc.n.","frdef":"Kératine fragmentée qui se fixe sur le cheveu abîmé.","ing":"한국어: 모발 단백질인 케라틴을 작게 분해한 것. 손상 모발에 흡착해 보강·코팅하는 성분.\nFrançais : La kératine hydrolysée est une kératine fragmentée par hydrolyse en peptides de plus petite taille, utilisée comme agent de conditionnement capillaire.","inci":"Hydrolyzed Keratin"},{"id":"BT1081","w":"아미노산 복합체","k":"h","rom":"aminosan bokhapche","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"아미노산(amino+酸)+복합체(複合體)","cat":"hair","mean":"여러 아미노산을 섞은 모발·피부 보습과 보수 성분.","ex":"아미노산 복합체가 들어 있어 머릿결이 한결 부드러워졌다.","fr":"complexe d'acides aminés","frpos":"loc.n.","frdef":"Mélange d'acides aminés hydratants.","ing":"한국어: 여러 아미노산을 섞은 원료를 이르는 말. 보습·모발 컨디셔닝 목적.\nFrançais : Un complexe d'acides aminés est un mélange de plusieurs acides aminés employé comme agent de conditionnement et d'hydratation; sa composition dépend du produit.","inci":"Amino Acids / Arginine, Serine 등(제품별)"},{"id":"BT1082","w":"살리실산","k":"s","rom":"sallisilsan","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"살리실(salicyl-)+산(酸)","cat":"hair","mean":"두피 각질을 녹여 내는 성분. 「살리실릭애씨드」와 같은 성분의 한자어 이름.","ex":"살리실산 샴푸로 두피 각질과 비듬을 관리한다.","fr":"acide salicylique","frpos":"n.m.","frdef":"Nom courant de 살리실릭애씨드 (même molécule), BHA exfoliant.","ing":"한국어: 살리실릭애씨드와 같은 물질의 일반·약학 명칭. 두피·여드름 관리 제품에서는 이 이름으로도 표기됨.\nFrançais : L'acide salicylique est un acide aromatique utilisé dans certains produits pour son action exfoliante et dans les soins des peaux à imperfections.","inci":"Salicylic Acid","par":"살리실릭애씨드","rel":"동의어"},{"id":"BT1083","w":"징크피리치온","k":"h","rom":"jingkeupirichion","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"zinc pyrithione 차용","cat":"hair","mean":"비듬과 가려움 완화에 쓰는 항균 성분.","ex":"징크피리치온이 든 샴푸는 비듬이 심할 때만 쓴다.","fr":"pyrithione de zinc","frpos":"n.f.","frdef":"Antipelliculaire autorisé en Corée mais interdit dans les cosmétiques de l'UE depuis 2022.","ing":"한국어: 항진균 비듬 관리 성분. 한국에서는 비듬·가려움 완화 의약외품 샴푸 성분이지만, EU에서는 2022년부터 화장품 사용이 금지됨 — 프랑스 독자에게 주의 필요.\nFrançais : La pyrithione de zinc est un composé du zinc à activité antifongique et antimicrobienne; son utilisation cosmétique est soumise à des restrictions réglementaires selon le marché.","inci":"Zinc Pyrithione"},{"id":"BT1084","w":"피록톤올아민","k":"h","rom":"piroktonoramin","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"piroctone olamine 차용","cat":"hair","mean":"비듬 원인균을 억제하는 샴푸 성분.","ex":"피록톤올아민 성분의 비듬 샴푸를 일주일에 두 번 쓴다.","fr":"piroctone olamine","frpos":"n.f.","frdef":"Actif antipelliculaire autorisé dans l'UE.","ing":"한국어: 항진균 비듬 관리 성분(옥토피록스). EU에서도 화장품 사용이 허용된 비듬 성분.\nFrançais : La piroctone olamine est le sel d'éthanolamine de la piroctone, utilisé notamment dans certains produits antipelliculaires pour son activité antifongique.","inci":"Piroctone Olamine"},{"id":"BT1085","w":"덱스판테놀","k":"h","rom":"dekseupantenol","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"dexpanthenol 차용","cat":"hair","mean":"판테놀(비타민 B5 유도체). 두피와 모발 보습·진정 성분.","ex":"덱스판테놀이 든 두피 토닉을 가르마에 뿌린다.","fr":"dexpanthénol","frpos":"n.m.","frdef":"Forme active (D) du panthénol.","ing":"한국어: 판테놀 중 생물학적으로 활성인 D형(D-판테놀). 의약품·의약외품에서 쓰이는 명칭.\nFrançais : Le dexpanthénol est l'isomère D du panthénol, une provitamine B5 utilisée pour ses propriétés humectantes et conditionnantes.","inci":"Panthenol (D-Panthenol / Dexpanthenol)","par":"판테놀","rel":"관련어(참고)"},{"id":"BT1088","w":"두피 마이크로바이옴","k":"h","rom":"dupi maikeurobaiom","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"두피+마이크로바이옴(microbiome)","cat":"hair","mean":"두피에 사는 미생물의 균형 상태.","ex":"두피 마이크로바이옴이 무너지면 비듬과 가려움이 심해진다.","fr":"microbiome du cuir chevelu","frpos":"loc.n.","frdef":"Micro-organismes vivant sur le cuir chevelu."},{"id":"BT1090","w":"두피 민감도","k":"h","rom":"dupi mingamdo","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"두피+민감도(敏感度)","cat":"hair","mean":"두피가 자극에 반응하는 정도.","ex":"염색 뒤에는 두피 민감도가 높아져 순한 샴푸를 쓴다.","fr":"sensibilité du cuir chevelu","frpos":"loc.n.","frdef":"Réactivité du cuir chevelu."},{"id":"BT1091","w":"두피 각질 탈락","k":"h","rom":"dupi gakjil tallak","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"두피+각질+탈락(脫落)","cat":"hair","mean":"두피 각질이 비늘처럼 떨어져 나오는 현상.","ex":"환절기에는 두피 각질 탈락이 심해 어깨에 하얗게 떨어진다.","fr":"desquamation du cuir chevelu","frpos":"loc.n.","frdef":"Chute de squames du cuir chevelu."},{"id":"BT1103","w":"큐티클 들뜸","k":"s","rom":"kyutikeul deultteum","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"큐티클(cuticle)+들뜸","cat":"hair","mean":"머리카락 겉의 비늘층(큐티클)이 벌어져 일어난 상태.","ex":"탈색한 머리는 큐티클 들뜸이 심해 빗질할 때 걸린다.","fr":"écailles soulevées","frpos":"loc.n.","frdef":"Cuticules ouvertes rendant le cheveu terne et poreux.","par":"뜨다","rel":"연어"},{"id":"BT1104","w":"모발 엉킴","k":"h","rom":"mobal eongkim","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"모발+엉킴(엉키다+-ㅁ)","cat":"hair","mean":"머리카락이 서로 얽혀 빗질이 되지 않는 상태.","ex":"머리가 길어서 감고 나면 모발 엉킴이 심하다.","fr":"nœuds","frpos":"n.m.pl.","frdef":"Cheveux emmêlés."},{"id":"BT1106","w":"습기 부스스함","k":"h","rom":"seupgi buseuseuham","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"습기(濕氣)+부스스함","cat":"hair","mean":"습한 날 머리카락이 수분을 먹고 부풀어 푸석하게 뜨는 상태.","ex":"장마철에는 습기 부스스함 때문에 에센스를 꼭 바른다.","fr":"frisottis dus à l'humidité","frpos":"loc.n.","frdef":"Cheveux qui gonflent par temps humide."},{"id":"BT1107","w":"잔머리 픽싱","k":"h","rom":"janmeori piksing","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"잔머리+픽싱(fixing)","cat":"hair","mean":"이마나 목덜미의 짧은 잔머리를 붙여 고정하는 것.","ex":"묶은 머리에 스틱을 발라 잔머리 픽싱을 했다.","fr":"fixation des petits cheveux","frpos":"loc.n.","frdef":"Discipliner les petits cheveux rebelles (baby hair)."},{"id":"BT1108","w":"뿌리 볼륨","k":"h","rom":"ppuri bollyum","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"뿌리+볼륨(volume)","cat":"hair","mean":"머리 뿌리 쪽이 살아 풍성해 보이는 것.","ex":"정수리가 납작해 보여서 뿌리 볼륨 스프레이를 뿌렸다.","fr":"volume aux racines","frpos":"loc.n.","frdef":"Volume obtenu en décollant les racines."},{"id":"BT1109","w":"젤 네일","k":"h","rom":"jel neil","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"gel+nail","cat":"nail","mean":"UV·LED 램프로 굳히는 젤 매니큐어.","ex":"일반 매니큐어보다 광택과 지속력이 우수한 젤 네일 아트입니다.","fr":"vernis gel (semi-permanent)","frpos":"loc.n.","frdef":"Vernis durci sous lampe UV/LED."},{"id":"BT1110","w":"젤 폴리시","k":"h","rom":"jel pollisi","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"gel+polish","cat":"nail","mean":"젤 네일용 컬러 제품.","ex":"젤 램프에 구워 간편하고 매끈하게 마감되는 젤 폴리시 제품입니다.","fr":"vernis gel","frpos":"loc.n.","frdef":"Produit de vernis semi-permanent e mask)","frpos":"loc.n.","frdef":"Masque qui mousse sur la peau avant rinçage."},{"id":"BT1783","w":"클레이 팩","k":"h","rom":"keullei paek","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"clay+pack","cat":"mask","mean":"점토 성분으로 피지를 흡착하는 워시오프팩.","ex":"클레이 팩은 완전히 마르기 전에 씻어 낸다.","fr":"masque à l'argile","frpos":"loc.n.","frdef":"Masque à rincer à base d'argile absorbante."},{"id":"BT1784","w":"스킨 팩","k":"h","rom":"seukin paek","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"skin+pack","cat":"mask","mean":"토너를 적신 화장솜이나 패드를 얼굴에 올려 두는 관리법.","ex":"아침에는 세안 대신 스킨 팩을 오 분 한다.","fr":"masque express au toner","frpos":"loc.n.","frdef":"Cotons imbibés de toner posés quelques minutes sur le visage."},{"id":"BT1785","w":"패드","k":"h","rom":"paedeu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"pad","cat":"mask","mean":"토너나 에센스를 적셔 통에 담아 파는 둥근 솜. 닦아 내거나 얼굴에 올려 둠.","ex":"세안 후 패드로 피부결을 닦아 낸다.","fr":"disque imbibé (pad)","frpos":"loc.n.","frdef":"Disque de coton pré-imbibé de toner, vendu en pot.","faux":1},{"id":"BT1788","w":"여드름 패치","k":"s","rom":"yeodeureum paechi","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"여드름+패치","cat":"mask","mean":"트러블 부위에 붙여 진물을 흡수하고 손이 닿지 않게 하는 작은 스티커.","ex":"여드름 패치를 붙이고 자면 아침에 가라앉아 있다.","fr":"patch anti-boutons","frpos":"loc.n.","frdef":"Petit pansement posé sur un bouton pour l'absorber et le protéger.","par":"트러블 패치","rel":"동의어"},{"id":"BT1789","w":"니들 패치","k":"h","rom":"nideul paechi","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"needle+patch","cat":"mask","mean":"유효 성분을 굳혀 만든 미세한 바늘이 달린 패치. 붙이면 바늘이 녹아 스며듦.","ex":"니들 패치는 붙일 때 살짝 따끔하다.","fr":"patch à micro-aiguilles","frpos":"loc.n.","frdef":"Patch garni de micro-aiguilles solubles d'actifs."},{"id":"BT1792","w":"스킨","k":"s","rom":"seukin","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"skin; 영어 skin과 뜻이 다름. =토너, 화장수","cat":"skin","mean":"세안 뒤 처음 바르는 물 같은 기초 화장품. 「토너」「화장수」와 같은 말.","ex":"세안하고 스킨부터 바른다.","fr":"toner (lotion tonique)","frpos":"n.m.","frdef":"En coréen, premier soin liquide après le nettoyage ; ne signifie pas « peau ».","par":"토너","rel":"동의어"},{"id":"BT1793","w":"화장수","k":"s","rom":"hwajangsu","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"化粧+水","cat":"skin","mean":"세안 뒤 피부결을 정돈하려고 바르는 물 같은 화장품. 「스킨」「토너」의 한자어.","ex":"화장수를 손바닥에 덜어 얼굴에 두드려 바른다.","fr":"lotion tonique","frpos":"loc.n.","frdef":"Terme sino-coréen pour le toner.","par":"토너","rel":"동의어"},{"id":"BT1794","w":"스킨로션","k":"h","rom":"seukillosyeon","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"skin+lotion","cat":"skin","mean":"스킨(토너)과 로션(유액)을 묶어 이르는 말. 기초 화장의 기본 두 단계.","ex":"아빠는 스킨로션만 바른다.","fr":"toner et émulsion (duo de base)","frpos":"loc.n.","frdef":"Désigne le duo toner + lait, base de la routine coréenne."},{"id":"BT1795","w":"유액","k":"s","rom":"yuaek","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"乳+液","cat":"skin","mean":"물과 기름이 섞인 묽은 보습 화장품. 「로션」「에멀전」의 한자어.","ex":"스킨 다음에 유액을 발라 수분을 잡아 준다.","fr":"émulsion (lait de soin)","frpos":"n.f.","frdef":"Terme sino-coréen pour le lait hydratant.","par":"로션","rel":"동의어"},{"id":"BT1799","w":"퍼스트 에센스","k":"h","rom":"peoseuteu esenseu","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"first+essence","cat":"skin","mean":"세안 직후 가장 먼저 바르는 물 같은 에센스. 다음 단계 흡수를 돕는다고 내세움.","ex":"세안 후 퍼스트 에센스를 손으로 눌러 흡수시킨다.","fr":"première essence","frpos":"loc.n.","frdef":"Essence liquide appliquée juste après le nettoyage pour préparer la peau."},{"id":"BT1800","w":"미스트","k":"h","rom":"miseuteu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"mist","cat":"skin","mean":"안개처럼 뿌려 수분을 공급하는 화장품.","ex":"사무실이 건조해서 미스트를 수시로 뿌린다.","fr":"brume","frpos":"n.f.","frdef":"Soin hydratant en vaporisateur."},{"id":"BT1803","w":"멀티밤","k":"h","rom":"meoltibam","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"multi+balm","cat":"skin","mean":"스틱 형태의 고체 보습제. 눈가·입가·목 등 여러 부위에 덧바름.","ex":"건조한 눈가에 멀티밤을 수시로 바른다.","fr":"baume multi-usages en stick","frpos":"loc.n.","frdef":"Baume solide en stick à appliquer sur toute enne, popularisée en Corée."},{"id":"BT2011","w":"똑단발","k":"h","rom":"ttokdanbal","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"똑+단발(短髮)","cat":"hair","mean":"층 없이 일자로 반듯하게 자른 단발.","ex":"똑단발로 자르고 끝만 C컬로 말았다.","fr":"carré droit","frpos":"loc.n.","frdef":"Carré coupé net, sans dégradé."},{"id":"BT2012","w":"떡진 머리","k":"h","rom":"tteokjin meori","pos":"명사","unit":"구","eo":"고유어","form":"구(句)","memo":"떡+지-+-ㄴ+머리","cat":"hair","mean":"기름이 끼어 머리카락이 뭉치고 납작하게 붙은 상태.","ex":"떡진 머리를 드라이 샴푸로 살렸다.","fr":"cheveux gras et collés","frpos":"loc.n.","frdef":"Cheveux graissés qui collent en mèches."},{"id":"BT2013","w":"개털","k":"h","rom":"gaeteol","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"개+털","cat":"hair","mean":"손상되어 푸석하고 뻗치는 머리카락을 낮춰 이르는 말.","ex":"탈색을 여러 번 했더니 개털이 됐다.","fr":"cheveux paille","frpos":"loc.n.","frdef":"Argot : cheveux abîmés, secs et rêches."},{"id":"BT2019","w":"달팽이 크림","k":"h","rom":"dalpaengi keurim","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"달팽이+크림","cat":"skin","mean":"달팽이 점액 여과물을 넣은 크림. 한국 화장품의 대표 수출품으로 알려짐.","ex":"어머니가 달팽이 크림을 선물로 사 오셨다.","fr":"crème à la bave d'escargot","frpos":"loc.n.","frdef":"Crème à la mucine d'escargot, produit emblématique de la K-beauty.","par":"달팽이 점액 여과물","rel":"관련어(참고)"},{"id":"BT2020","w":"앵두 입술","k":"h","rom":"aengdu ipsul","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"앵두+입술","cat":"lip","mean":"앵두처럼 작고 붉으며 도톰한 입술. 한국에서 예쁜 입술을 이르는 전통적 비유.","ex":"틴트를 입술 안쪽에만 발라 앵두 입술을 만들었다.","fr":"lèvres « cerise »","frpos":"loc.n.","frdef":"Lèvres petites, rouges et pulpeuses comme une cerise ; image traditionnelle coréenne de la beauté."},{"id":"BT2022","w":"뽀샤시하다","k":"h","rom":"pposyasihada","pos":"형용사","unit":"단어","eo":"혼종어","form":"파생어","memo":"뽀샤시(일본어 ぼかし에서 온 말로 봄)+-하다 / 신조어(표준국어대사전 미등재)","cat":"gen","mean":"피부가 뽀얗고 화사하게 빛나 보이다. 사진의 부드럽게 빛 번진 효과에도 씀.","ex":"톤업크림을 바르니 얼굴이 뽀샤시하다.","fr":"lumineux et laiteux (teint)","frpos":"loc.adj.","frdef":"Se dit d'un teint clair, doux et lumineux, ou d'une photo à l'effet flou lumineux."},{"id":"BT2023","w":"동안","k":"h","rom":"dongan","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"童顔","cat":"gen","mean":"실제 나이보다 어려 보이는 얼굴.","ex":"동안 비결은 꾸준한 선크림이라고 한다.","fr":"visage juvénile (air plus jeune que son âge)","frpos":"loc.n.","frdef":"Visage qui paraît plus jeune que l'âge réel ; idéal très valorisé en Corée."},{"id":"BT2026","w":"오이 팩","k":"h","rom":"oi paek","pos":"명사","unit":"구","eo":"고유어","form":"구(句)","memo":"오이+팩","cat":"skin","mean":"얇게 썬 오이를 얼굴에 붙이는 한국의 전통적인 집 팩.","ex":"어릴 때 엄마가 여름마다 오이 팩을 해 주셨다.","fr":"masque au concombre maison","frpos":"loc.n.","frdef":"Rondelles de concombre posées sur le visage, remède maison classique en Corée."},{"id":"BT2029","w":"쌀뜨물 세안","k":"h","rom":"ssaltteumul sean","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"쌀뜨물+세안(洗顔)","cat":"clean","mean":"쌀 씻은 물로 얼굴을 씻는 한국의 전통 미용법. 피부를 맑게 한다고 전해짐.","ex":"할머니는 평생 쌀뜨물 세안을 하셨다.","fr":"nettoyage à l'eau de riz","frpos":"loc.n.","frdef":"Méthode traditionnelle coréenne : se laver le visage avec l'eau de rinçage du riz."},{"id":"BT2030","w":"MLBB","k":"h","rom":"MLBB","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두문자어)","memo":"My Lips But Better","cat":"lip","mean":"「My Lips But Better」의 약자. 원래 입술색보다 조금 더 예쁜 자연스러운 립 색.","ex":"MLBB 립이라 데일리로 쓰기 좋다.","fr":"MLBB (« mes lèvres en mieux »)","frpos":"n.m.","frdef":"Teinte proche de la couleur naturelle des lèvres, en un peu plus belle."},{"id":"BT2032","w":"쌍꺼풀 액","k":"h","rom":"ssangkkeopul aek","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"쌍꺼풀+액(液)","cat":"eye","mean":"눈꺼풀에 발라 접어 붙여 쌍꺼풀을 만드는 액체 접착제.","ex":"쌍꺼풀 액을 바르고 푸셔로 라인을 눌렀다.","fr":"colle à paupières (double paupière)","frpos":"loc.n.","frdef":"Colle liquide servant à créer un pli de paupière artificiel."},{"id":"BT2033","w":"서클렌즈","k":"h","rom":"seokeullenjeu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"circle+lens","cat":"eye","mean":"검은 테두리로 눈동자가 커 보이게 하는 컬러 콘택트렌즈.","ex":"서클렌즈를 끼니 눈이 또렷해 보인다.","fr":"lentilles « circle » (agrandissant l'iris)","frpos":"loc.n.","frdef":"Lentilles de couleur à bord foncé qui agrandissent l'iris.","faux":1},{"id":"BT2034","w":"-템","k":"a","unit":"조어 요소","memo":"유형: 명사 뒤","cat":"gen","mean":"「아이템(item)」을 줄인 말. 명사 뒤에 붙어 「그런 성격의 제품」을 뜻함. 표준국어대사전 미등재.","ex":"예: 정착템, 공병템, 구원템, 데일리템, 무난템, 애매템, 인생템, 처박템, 힛팬템, 근본템, 기초템, 재구매템","fr":"Élément tiré de « item » : accolé à un nom, il signifie « produit qui… »","frdef":"Élément tiré de « item » : accolé à un nom, il signifie « produit qui… » (인생템 = produit culte)."},{"id":"BT2035","w":"-러","k":"a","unit":"조어 요소","memo":"유형: 명사 뒤","cat":"gen","mean":"영어 -er에서 온 말. 피부 유형 뒤에 붙어 「그런 피부를 가진 사람」을 뜻함(건성러, 지성러, 민감러). 표준국어대사전 미등재.","ex":"예: 건성러, 지성러, 민감러","fr":"Élément tiré du suffixe anglais -er : « personne qui a tel type de peau »","frdef":"Élément tiré du suffixe anglais -er : « personne qui a tel type de peau » (건성러 = personne à peau sèche)."},{"id":"BT2036","w":"-상(相)","k":"a","unit":"조어 요소","memo":"유형: 명사 뒤","cat":"gen","mean":"얼굴 인상의 유형을 동물이나 사물에 빗대어 이르는 말. 「상(相)」은 명사.","ex":"예: 강아지상, 고양이상, 과즙상, 두부상, 미묘상, 첫사랑상, 여우상, 토끼상, 사슴상, 공룡상","fr":"Élément « visage de type… » : on compare le visage à un animal ou à un objet","frdef":"Élément « visage de type… » : on compare le visage à un animal ou à un objet (강아지상 = visage de chiot)."},{"id":"BT2037","w":"-감(感)","k":"a","unit":"조어 요소","memo":"유형: 접미사","cat":"gen","mean":"「느낌」을 뜻하는 접미사. 사용감을 나타내는 말을 만듦.","ex":"예: 수분감, 자극감, 잔여감, 마무리감, 보습감, 볼륨감, 영양감, 유분감, 피부 입체감, 거품 쿠션감, 세안 마찰감, 매끈 마감","fr":"Suffixe « sensation de… »","frdef":"Suffixe « sensation de… » (보습감 = sensation d'hydratation)."},{"id":"BT2038","w":"-력(力)","k":"a","unit":"조어 요소","memo":"유형: 접미사","cat":"gen","mean":"「능력, 힘」을 뜻하는 접미사. 제품 성능을 나타내는 말을 만듦.","ex":"예: 밀착력, 메이크업 지속력, 보습 지속력, 보습력, 피부 기초 체력, 화장 밀착력, 세정력, 커버력, 흡수력, 지속력","fr":"Suffixe « capacité, pouvoir »","frdef":"Suffixe « capacité, pouvoir » (커버력 = pouvoir couvrant)."},{"id":"BT2039","w":"-광(光)","k":"a","unit":"조어 요소","memo":"유형: 명사 뒤","cat":"gen","mean":"「빛, 윤기」를 뜻하 function parseCSV(t){const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q=true; else if(c===','){row.push(f);f=''} else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''} else if(c!=='\r') f+=c; }

}

   '<h2>À propos</h2><p class="lead">Version provisoire, à valider par le groupe.</p><h3>À quoi sert ce lexique</h3><p>Il s\'adresse aux francophones qui lisent des fiches produits et des avis de cosmétiques coréens. Les mots qu\'un dictionnaire général suffit à traduire n\'y figurent pas. On y trouve les expressions propres à la Corée, le vocabulaire du secteur, les néologismes et les noms d\'ingrédients.</p><h3>Lire une entrée</h3><ul><li>Sous le mot-vedette, la romanisation en italique.</li><li>Les étiquettes indiquent la catégorie grammaticale, l\'unité (locution, phrase), l\'origine du mot et son mode de formation, selon le Dictionnaire standard de la langue coréenne.</li><li>« Faux ami » signale un mot proche du français ou de l\'anglais dont le sens diffère en coréen.</li><li>Les éléments absents du dictionnaire (-템, -러, etc.) sont réunis dans « Éléments de formation ».</li></ul><h3>Méthode</h3><p>'+M.total+' candidats ont été relevés dans les listes de produits et les avis d\'Olive Young et dans des glossaires de marques. Le groupe en a écarté '+M.excluded+' au cours de trois réunions : mots transparents en français, simples juxtapositions, noms de produits et slogans.</p><h3>Usage de l\'IA</h3><p>Une IA générative (Claude) a aidé à relever les termes et à rédiger une première version des équivalents, des définitions, des exemples et du classement grammatical. Le choix des entrées et les critères grammaticaux ont été décidés par le groupe, qui a relu le contenu. La romanisation est générée automatiquement.</p><h3>Limites</h3><p>Le sens des néologismes évolue vite. Certains équivalents français sont des paraphrases et non des termes en usage.</p>';
