<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한불 뷰티 용어집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a dictionary desk — index column on the left, one entry card on the right; stacks to one column on phones. */
:root{
  --paper:#f4f6f5; --card:#ffffff; --ink:#17302b; --muted:#5d716c; --line:#d5dedb;
  --accent:#b3263d; --accent-soft:#f6e3e6; --tint:#e3eeeb; --warn:#8a5a00; --warn-soft:#fbefd2;
  --display:"Gowun Batang","Noto Serif KR",Georgia,serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --paper:#101917; --card:#17231f; --ink:#e6efec; --muted:#9db0ab; --line:#2b3b37;
    --accent:#f08a9b; --accent-soft:#3a1d24; --tint:#1e302b; --warn:#f1c56b; --warn-soft:#3a2f14;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#101917; --card:#17231f; --ink:#e6efec; --muted:#9db0ab; --line:#2b3b37;
  --accent:#f08a9b; --accent-soft:#3a1d24; --tint:#1e302b; --warn:#f1c56b; --warn-soft:#3a2f14;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{border-bottom:1px solid var(--line);background:var(--card)}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:18px 0 6px}
.brand h1{font-family:var(--display);font-size:1.7rem;margin:0;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:.95rem}
.brand .lang{margin-left:auto;display:flex;gap:4px}
.lang button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 10px;cursor:pointer;font-size:.85rem}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
nav.tabs{display:flex;flex-wrap:wrap;gap:2px 18px;padding:6px 0 0}
nav.tabs a{padding:8px 0;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;font-weight:500}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
main{padding:20px 0 60px}
.desk{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:20px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px}
.tools{padding:12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
#q{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.row{display:flex;flex-wrap:wrap;gap:6px}
select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);max-width:100%;flex:1 1 140px;min-width:0}
.cho{display:flex;flex-wrap:wrap;gap:4px}
.cho button{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:transparent;cursor:pointer;font-family:var(--display)}
.cho button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.count{font-size:.85rem;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line)}
#list{list-style:none;margin:0;padding:0;max-height:68vh;overflow:auto}
#list li button{display:flex;flex-direction:column;gap:0;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:9px 12px;cursor:pointer}
#list li button:hover{background:var(--tint)}
#list li button[aria-current="true"]{background:var(--tint);box-shadow:inset 3px 0 0 var(--accent)}
#list .kw{font-family:var(--display);font-weight:700;font-size:1.05rem}
#list .fw{color:var(--muted);font-size:.86rem;overflow-wrap:anywhere}
#list .sub .kw{font-weight:400;padding-left:12px}
#more{margin:10px 12px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer}
.entry{padding:22px 24px}
.entry .back{display:none}
.hw{font-family:var(--display);font-size:2.3rem;font-weight:700;margin:0;line-height:1.2;overflow-wrap:anywhere}
.rom{color:var(--muted);font-style:italic;margin:2px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.chip{font-size:.8rem;padding:2px 9px;border-radius:999px;background:var(--tint)}
.chip.cat{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chip.faux{background:var(--warn-soft);color:var(--warn)}
.fr{font-size:1.3rem;font-weight:600;margin:0;overflow-wrap:anywhere}
.fr small{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:6px}
.def{margin:6px 0 18px;max-width:65ch}
dl.more{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;margin:0;border-top:1px solid var(--line);padding-top:16px}
dl.more dt{color:var(--muted);font-size:.85rem;padding-top:2px}
dl.more dd{margin:0;max-width:65ch;overflow-wrap:anywhere;white-space:pre-line}
.ex{font-family:var(--display);font-size:1.05rem}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;cursor:pointer}
.links button:hover{border-color:var(--accent);color:var(--accent)}
.note{font-size:.82rem;color:var(--muted);margin-top:16px}
.page{max-width:820px}
.page h2{font-family:var(--display);font-size:1.6rem;margin:0 0 6px;text-wrap:balance}
.page h3{font-family:var(--display);font-size:1.15rem;margin:26px 0 6px}
.page p,.page li{max-width:65ch}
.lead{color:var(--muted);margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.acard{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.acard h3{margin:0;font-size:1.4rem}
.acard .t{font-size:.8rem;color:var(--muted)}
.acard p{margin:0;font-size:.93rem}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:0 0 8px}
.stat div{padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
.bars{display:grid;grid-template-columns:max-content 1fr max-content;gap:6px 10px;align-items:center;font-size:.92rem}
.bars i{display:block;height:14px;border-radius:3px;background:var(--accent);min-width:2px}
.bars .n{font-variant-numeric:tabular-nums;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.82rem}
td.k{font-family:var(--display);font-weight:700;white-space:nowrap}
td.k button{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:var(--accent)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;padding:16px 0 30px}
[hidden]{display:none!important}
@media (max-width:820px){
  .desk{grid-template-columns:1fr}
  .desk.reading #listPanel{display:none}
  .desk:not(.reading) #entryPanel{display:none}
  .entry{padding:16px}
  .entry .back{display:inline-block;margin-bottom:10px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 12px;cursor:pointer}
  .hw{font-size:1.9rem}
  #list{max-height:none}
  dl.more{grid-template-columns:1fr;gap:2px 0}
  dl.more dd{margin-bottom:10px}
}
@media (prefers-reduced-motion:no-preference){#list li button{transition:background .12s}}
</style>
</head>

  <div class="brand">
    <h1>한불 뷰티 용어집</h1>

:"h","rom":"tteuda","pos":"동사","unit":"단어","eo":"고유어","form":"단일어","memo":"다의어 '뜨다'의 뷰티 특수 의미","cat":"gen","mean":"제형이 피부 표면에 붙지 못하고 각질이나 모공 틈새로 하얗게 일어나는 상태","ex":"건조한 날에도 각질 사이로 선크림이 뜨지 않았다.","fr":"ne pas adhérer, « flotter »","frpos":"loc.v.","frdef":"Se dit du maquillage ou d'un soin qui se décolle de la peau et laisse voir les peaux mortes."},{"id":"BT0017","w":"레이어링하다","k":"h","rom":"reieoringhada","pos":"동사","unit":"단어","eo":"혼종어","form":"파생어","memo":"레이어링(layering)+-하다(동사 파생 접미사)","cat":"gen","mean":"얇게 여러 번 겹쳐 바르는 사용법.","ex":"토너를 여러 번 레이어링해서 속건조를 채운다.","fr":"superposer (les soins)","frpos":"v.","frdef":"Appliquer plusieurs couches fines de produits les unes sur les autres."},{"id":"BT0018","w":"롤링하다","k":"h","rom":"rollinghada","pos":"동사","unit":"단어","eo":"혼종어","form":"파생어","memo":"롤링(rolling)+-하다","cat":"gen","mean":"손가락을 둥글게 움직이며 제품을 펴 바르는 동작.","ex":"얼굴 안쪽에서 바깥쪽으로 롤링하며 흡수시킨다.","fr":"masser en mouvements circulaires","frpos":"loc.v.","frdef":"Faire rouler les doigts en petits cercles pour étaler ou faire pénétrer un produit."},{"id":"BT0020","w":"모공 커버","k":"h","rom":"mogong keobeo","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"모공(毛孔, 한자어)+커버(cover)","cat":"gen","mean":"피부 모공 구멍이나 굴곡을 채워 시각적으로 매끈하게 가려주는 효과","ex":"모공 커버가 잘 되는 프라이머라 파운데이션이 매끈하게 올라간다.","fr":"camouflage des pores","frpos":"loc.n.","frdef":"Effet d'un produit qui comble et floute visuellement les pores dilatés.","par":"커버력","rel":"하위어(참고)"},{"id":"BT0021","w":"모공 타이트닝","k":"h","rom":"mogong taiteuning","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"모공(한자어)+타이트닝(tightening)","cat":"gen","mean":"넓어지거나 늘어진 모공 부위를 일시적으로 조여주는 기능","ex":"늘어진 모공에 모공 타이트닝 세럼을 꾸준히 바르고 있다.","fr":"resserrement des pores","frpos":"loc.n.","frdef":"Effet annoncé de resserrer temporairement les pores relâchés."},{"id":"BT0024","w":"무너지다","k":"h","rom":"muneojida","pos":"동사","unit":"단어","eo":"고유어","form":"단일어","memo":"활용: 무너져, 무너졌다 / 명사형: 무너짐","cat":"gen","mean":"시간이 지나며 피지·유분 때문에 베이스 화장이 지워지거나 흐트러지다.","ex":"점심때가 지나자 코 옆부터 화장이 무너지기 시작했다.","fr":"se dégrader (maquillage)","frpos":"v.","frdef":"Se dit du maquillage ou d'un solaire qui se défait et s'estompe par plaques sous l'effet du sébum."},{"id":"BT0025","w":"묻어나다","k":"h","rom":"mudeonada","pos":"동사","unit":"단어","eo":"고유어","form":"파생어","memo":"활용: 묻어나, 묻어났다 / 명사형: 묻어남","cat":"gen","mean":"바른 제품이 손이나 마스크처럼 닿는 면에 옮겨 묻다.","ex":"이 틴트는 마스크에 거의 묻어나지 않는다.","fr":"transférer (laisser des traces)","frpos":"v.","frdef":"Fait qu'un produit se dépose sur les mains, un masque, une tasse, etc."},{"id":"BT0026","w":"밀리다","k":"h","rom":"millida","pos":"동사","unit":"단어","eo":"고유어","form":"파생어","memo":"활용: 밀려, 밀렸다 / 명사형: 밀림","cat":"gen","mean":"덧바른 제품이 흡수되지 않고 때처럼 뭉쳐 일어나다.","ex":"톤업 선크림 위에 쿠션을 발라도 밀리지 않는다.","fr":"boulocher","frpos":"v.","frdef":"Se dit d'un produit qui forme des petites peluches ou se décolle quand on applique une autre couche."},{"id":"BT0027","w":"밀착력","k":"h","rom":"milchangnyeok","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"밀착(密着)+-력(力, 한자 접미사)","cat":"gen","mean":"차단제 제형이 피부 표면에 들뜸 없이 얇게 감겨 붙어있는 힘","ex":"밀착력이 좋아서 오후가 돼도 화장이 밀리지 않았다.","fr":"adhérence","frpos":"n.f.","frdef":"Capacité d'un produit à adhérer à la peau de manière fine et uniforme."},{"id":"BT0028","w":"발림성","k":"h","rom":"ballimseong","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"바르다(발리-, 피동)+-ㅁ+-성(性, 한자 접미사)","cat":"gen","mean":"제품을 피부에 펴 바를 때 잘 퍼지는 정도에 대한 평가.","ex":"끈적임 없이 발림성이 좋고 보습도 오래간다.","fr":"étalement, glisse","frpos":"n.m.","frdef":"Facilité avec laquelle un produit s'étale sur la peau."},{"id":"BT0030","w":"보송하다","k":"h","rom":"bosonghada","pos":"형용사","unit":"단어","eo":"고유어","form":"파생어","memo":"보송(어근)+-하다","cat":"gen","mean":"피부 표면이 축축하거나 끈적이지 않고 산뜻하게 마른 듯한 감각.","ex":"겉은 보송하고 속은 촉촉한 마무리가 마음에 든다.","fr":"sec et velouté (au toucher)","frpos":"loc.adj.","frdef":"Fini sec, non collant et doux au toucher, sans brillance."},{"id":"BT0032","w":"붉은기","k":"h","rom":"bulgeungi","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"붉다(고유어)+기(氣, 한자어)","cat":"gen","mean":"세안 자극에 의해 혈관이 확장되어 겉으로 붉게 홍조가 띠는 상태.","ex":"세안할 때 마찰 자극으로 생긴 붉은기를 가라앉혀 준다.","fr":"rougeurs","frpos":"n.f.pl.","frdef":"Teinte rouge de la peau due à une irritation ou à des vaisseaux dilatés."},{"id":"BT0033","w":"블러링","k":"h","rom":"beulleoring","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"영어 blurring 차용","cat":"gen","mean":"피부 결점을 포커스 아웃한 것처럼 흐릿하고 매끈하게 만드는 연출","ex":"포토샵으로 보정한 듯 모공과 요철을 지워 주는 블러링 효과가 있다.","fr":"effet flouteur (blurring)","frpos":"n.m.","frdef":"Effet optique qui estompe les imperfections comme un flou photographique.","par":"피부표현","rel":"관련어(참고)"},{"id":"BT0036","w":"속건조","k":"h","rom":"sokgeonjo","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"속(고유어)+건조(乾燥, 한자어)","cat":"gen","mean":"겉의 유분감과 별개로 피부 안쪽이 건조하다고 느끼는 상태.","ex":"이 크림은 속건조를 잡아 주지 못하는 것 같아 아쉽다.","fr":"déshydratation profonde","frpos":"loc.n.","frdef":"Sensation de peau déshydratée en profondeur alors que la surface paraît grasse ou normale.","par":"수부지","rel":"관련어(참고)"},{"id":"BT0037","w":"속광","k":"h","rom":"sokgwang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"속(고유어)+광(光, 한자어)","cat":"gen","mean":"피부 속에서 은은하게 배어나오는 듯해 보이는 윤기를 뜻한다.","ex":"톤업 선크림을 바르니 은은하게 속광이 생긴다.","fr":"éclat de l'intérieur","frpos":"loc.n.","frdef":"Lumière douce qui semble venir de l'intérieur de la peau, sans brillance grasse."},{"id":"BT0038","w":"수부지","k":"h","rom":"subuji","pos":"명사","unit":"단어","eo":"한자어","form":"축약어(두음절어)","memo":"수(분) 부(족형) 지(성)의 첫 음절 축약","cat":"gen","mean":"수분 부족형 지성 피부를 뜻한다.","ex":"수부지에게는 여름에 쓰기에 살짝 무거운 느낌이 있다.","fr":"peau grasse déshydratée","frpos":"loc.n.","frdef":"Abréviation de « 수분 부족형 지성 »: peau qui produit du sébum mais manque d'eau."},{"id":"BT0039","w":"수분감","k":"h","rom":"subungam","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"수분(水分)+-감(感, 한자 접미사)","cat":"gen","mean":"피부가 물기를 머금는 듯 느껴지는 정도.","ex":"수분감이 좋아서 건성 피부나 겨울철에 쓰기 좋다.","fr":"sensation d'hydratation","frpos":"loc.n.","frdef":"Sensation de fraîcheur aqueuse et d'hydratation que procure un produit."},{"id":"BT0042","w":"약산성","k":"h","rom":"yaksanseong","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"약-(弱, 한자 접두사)+산성(酸性)","cat":"gen","mean":"강하지 않은 산성 범위의 성질을 뜻하는 제형 설명.","ex":"pH4 약산성 크림이라 민감한 피부에도 순하게 쓸 수 있다.","fr":"pH légèrement acide","frpos":"loc.n.","frdef":"Caractère faiblement acide (pH proche de celui de la peau) d'un produit."},{"id":"BT0047","w":"유분 폭발","k":"h","rom":"yubun pokbal","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"유분(油分)+폭발(爆發)","cat":"gen","mean":"고온다습한 날씨로 피지나 유분이 극도로 많이 분비되는 상태","ex":"여름철 유분 폭발 피부에도 보송하게 유지된다.","fr":"explosion de sébum","frpos":"loc.n.","frdef":"Production de sébum très importante (chaleur, humidité) rendant la peau très luisante."},{"id":"BT0048","w":"유분기","k":"h","rom":"yubungi","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"유분(油分)+-기(氣, 한자 접미사)","cat":"gen","mean":"피부 표면에 과도하게 분비되는 기름 성분 및 번들거림","ex":"번들거리는 유분기를 싹 잡아 주는 매트 선스틱이다.","fr":"traces de gras, brillance","frpos":"loc.n.","frdef":"Présence de sébum ou de corps gras visible sur la peau."},{"id":"BT0049","w":"유수분 밸런스","k":"h","rom":"yusubun baelleonseu","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"유수분(油水分)+밸런스(balance)","cat":"gen","mean":"피부 유분과 수분의 균형 상태를 뜻한다.","ex":"요즘 유수분 밸런스가 안 맞는지 겉은 번들거리고 속은 당긴다.","fr":"équilibre eau-sébum","frpos":"loc.n.","frdef":"Équilibre entre l'hydratation (eau) et les lipides (sébum) de la peau."},{"id":"BT0050","w":"자극감","k":"h","rom":"jageukgam","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"자극(刺戟)+-감(感)","cat":"gen","mean":"제품 사용 시 피부가 불편하게 자극받는 느낌.","ex":"레티놀 세럼을 처음 바르는 날에는 자극감이 꽤 있었다.","fr":"sensation d'irritation","frpos":"loc.n.","frdef":"Sensation d'inconfort, de picotement ou de brûlure après l'application."},{"id":"BT0051","w":"잔여감","k":"h","rom":"janyeogam","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"잔여(殘餘)+-감(感)","cat":"gen","mean":"사용한 제품이 피부 표면에 남아 있다고 느껴지는 감각. 후기에서는 없다고 함.","ex":"끈적이거나 겉도는 잔여감 없이 깔끔하게 흡수된다.","fr":"sensation de résidu","frpos":"loc.n.","frdef":"Impression qu'un film de produit reste sur la peau après application ou rinçage."},{"id":"BT0053","w":"잡티","k":"h","rom":"japti","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"잡-(雜, 한자 접두사)+티(고유어)","cat":"gen","mean":"피부에 작게 보이는 얼룩이나 색 자국 등을 넓게 가리킨다.","ex":"잠을 못 잤더니 기미와 잡티가 더 도드라져 보인다.","fr":"imperfections pigmentaires (taches, marques)","frpos":"n.f.pl.","frdef":"Terme générique coréen pour les petites taches, marques et irrégularités de teint."},{"id":"BT0055","w":"정착템","k":"h","rom":"jeongchaktem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"정착(定着, 한자어)+-템(item 축약, 접미사처럼 쓰임)","cat":"gen","mean":"여러 제품을 비교하거나 바꿔 본 뒤 꾸준히 선택해 쓰는 제품.","ex":"스무 통 넘게 쓴 진짜 정착템이다.","fr":"produit fétiche adopté","frpos":"loc.n.","frdef":"Produit qu'on finit par adopter durablement après en avoir essayé beaucoup.","par":"인생템","rel":"관련어(참고)"},{"id":"BT0059","w":"톤업","k":"h","rom":"toneop","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"tone+up(영어 결합 차용, 한국식 조어) / 원어에서 통째로 들어온 외래어라 단일어로 봄","cat":"gen","mean":"피부색이 더 밝아 보이는 변화. 원문은 뚜렷한 변화가 없다고 말한다.","ex":"피부 톤업이 확 되는 건 아니지만 자연스럽게 밝아진다.","fr":"effet éclaircissant du teint (tone-up)","frpos":"n.m.","frdef":"Éclaircissement immédiat et visuel du teint par un produit teinté ou nacré."},{"id":"BT0061","w":"피부 요철","k":"h","rom":"pibu yocheol","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"피부(皮膚)+요철(凹凸)","cat":"gen","mean":"피부 표면에 높낮이나 작은 돌기가 있어 고르지 않게 보이는 상태.","ex":"꾸준히 바르니 피부 요철이 조금 매끄러워졌다.","fr":"irrégularités de texture","frpos":"n.f.pl.","frdef":"Reliefs de la peau (pores, cicatrices) rendant la surface inégale."},{"id":"BT0063","w":"피부결","k":"h","rom":"pibugyeol","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"피부(皮膚, 한자어)+결(고유어)","cat":"gen","mean":"피부 표면의 고르기와 질감을 뜻한다.","ex":"피부결 개선을 기대하고 샀는데 한 달 쓰니 확실히 매끄러워졌다.","fr":"grain de peau","frpos":"n.m.","frdef":"Texture et régularité de la surface de la peau."},{"id":"BT0065","w":"화잘먹","k":"h","rom":"hwajalmeok","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"화(장이) 잘 먹(다)의 음절 축약","cat":"gen","mean":"기초 사용 뒤 화장이 피부에 잘 밀착되고 곱게 표현된다는 뜻의 홍보 표현.","ex":"화잘먹 피부를 만들려고 전날 밤 수분팩을 붙였다.","fr":"« le maquillage accroche bien »","frpos":"loc.n.","frdef":"Abréviation de « 화장이 잘 먹다 »: peau ou produit qui permet un maquillage bien fondu et durable."},{"id":"BT0074","w":"겉돌다","k":"h","rom":"geotdolda","pos":"동사","unit":"단어","eo":"고유어","form":"파생어","memo":"겉-(접두사)+돌다","cat":"skin","mean":"제품이 스며들지 않고 피부 표면에 남아 도는 느낌을 뜻한다.","ex":"크림을 너무 많이 발랐는지 흡수되지 않고 피부 위에서 겉돈다.","fr":"ne pas pénétrer, rester en surface","frpos":"loc.v.","frdef":"Se dit d'un produit qui ne s'absorbe pas et glisse à la surface de la peau."},{"id":"BT0075","w":"겉보습","k":"h","rom":"geotboseup","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"겉-(접두사)+보습(保濕)","cat":"skin","mean":"피부 표면에서 느껴지거나 나타나는 보습을 강조한 광고 표현.","ex":"이 크림은 겉보습은 좋은데 속건조까지 잡아 주지는 못한다.","fr":"hydratation de surface","frpos":"loc.n.","frdef":"Hydratation ressentie seulement en surface (opposée à 속보습).","par":"수부지","rel":"관련어(참고)"},{"id":"BT0078","w":"고민 부위","k":"h","rom":"gomin buwi","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"고민(苦悶)+부위(部位)","cat":"skin","mean":"탄력 저하나 주름 등 사용자가 관리하고 싶은 문제가 있는 피부 부분.","ex":"탄력 세럼을 고민 부위인 팔자주름에 한 번 더 덧발랐다.","fr":"zone à problème","frpos":"loc.n.","frdef":"Partie du visage qu'on souhaite traiter (rides, pores, taches…)."},{"id":"BT0082","w":"공병템","k":"h","rom":"gongbyeongtem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"공병(空甁)+-템(item 축약)","cat":"skin","mean":"끝까지 사용해 용기를 비웠거나 반복해서 비우는 제품을 뜻한다.","ex":"스킨케어 중에 공병템임.","fr":"produit que l'on rachète après l'avoir terminé","frpos":"loc.n.","frdef":"Produit utilisé jusqu'à la dernière goutte, signe qu'on l'a aimé.","par":"인생템","rel":"관련어(참고)"},{"id":"BT0083","w":"괄사","k":"h","rom":"gwalsa","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"괄(刮)+사(痧), 중국어 guasha의 한자음","cat":"skin","mean":"피부를 문지르며 마사지하는 데 쓰는 도구.","ex":"미니 문어괄사는 앰플바르고.","fr":"gua sha","frpos":"n.m.","frdef":"Outil en pierre ou en métal utilisé pour masser et drainer le visage."},{"id":"BT0084","w":"구원템","k":"h","rom":"guwontem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"구원(救援)+-템(item 축약)","cat":"skin","mean":"피부 상태가 나빠졌을 때 도움이 된다고 느끼는 제품을 구원자에 비유함.","ex":"환절기에 피부가 뒤집어졌을 때 이 크림이 구원템이었다.","fr":"produit sauveur","frpos":"loc.n.","frdef":"Produit qui « sauve » la peau en période de crise (irritation, sécheresse).","par":"인생템","rel":"관련어(참고)"},{"id":"BT0086","w":"국소 부위 사전 테스트","k":"h","rom":"gukso buwi sajeon teseuteu","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"국소 부위(局所部位)+사전(事前)+테스트(test)","cat":"skin","mean":"제품을 본격적으로 바르기 전에 피부의 작은 부위에 먼저 사용해 반응을 확인하는 절차.","ex":"국소 부위 사전 테스트를 시행한 후 본 제품을 사용할 것.","fr":"test de tolérance localisé","frpos":"loc.n.","frdef":"Essai du produit sur une petite zone de peau avant utilisation complète."},{"id":"BT0088","w":"글루타티온","k":"h","rom":"geullutation","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"영어 glutathione 차용","cat":"skin","mean":"전성분에서 함량과 함께 표시한 배합 성분명.","ex":"글루타티온(100 ppm).","fr":"glutathion","frpos":"n.m.","frdef":"Tripeptide antioxydant mis en avant pour un teint plus lumineux.","ing":"한국어: 글루탐산·시스테인·글라이신 세 아미노산으로 된 트리펩타이드. 항산화 성분으로, 한국 제품에서는 주로 「맑은 피부톤」 문구와 함께 쓰임.\nFrançais : Le glutathion est un tripeptide composé de glutamate, de cystéine et de glycine. Il est utilisé en cosmétique pour ses propriétés antioxydantes.","inci":"Glutathione"},{"id":"BT0089","w":"글리세린","k":"h","rom":"geulliserin","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"glycerin 차용","cat":"skin","mean":"전성분 목록에 표시된 화장품 배합 성분명.","ex":"글리세린이 들어 있어 바른 뒤에도 촉촉함이 오래 남는다.","fr":"glycérine","frpos":"n.f.","frdef":"Humectant classique qui retient l'eau dans la couche cornée.","ing":"한국어: 대표적인 보습제(휴멕턴트). 물을 끌어당겨 각질층 수분을 유지하는 다가 알코올.\nFrançais : La glycérine est un alcool polyhydrique humectant qui attire l'eau et aide à maintenir l'hydratation de la couche cornée.","inci":"Glycerin"},{"id":"BT0090","w":"기능성 화장품","k":"h","rom":"gineungseong hwajangpum","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"기능성(機能性)+화장품(化粧品)","cat":"skin","mean":"기능성에 관한 심사 또는 보고를 거친 제품이라고 표시하는 안내 문구의 화장품 분류.","ex":"기능성 화장품 심사(또는 보고)를 필함.","fr":"cosmétique fonctionnel (catégorie réglementaire coréenne)","frpos":"loc.n.","frdef":"Cosmétique dont l'efficacité (éclaircissement, anti-rides, UV…) est évaluée ou déclarée auprès du MFDS."},{"id":"BT0093","w":"기초유목민","k":"h","rom":"gichoyumongmin","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"기초(基礎)+유목민(遊牧民)","cat":"skin","mean":"마음에 드는 기초 제품을 정하지 못해 여러 제품을 바꾸어 쓰는 사람.","ex":"맞는 크림을 못 찾아서 삼 년째 기초유목민으로 지내고 있다.","fr":"« nomade » des soins de base","frpos":"loc.n.","frdef":"Personne qui change sans cesse de produits de soin faute d'en trouver un qui lui convient."},{"id":"BT0094","w":"깐달걀","k":"h","rom":"kkandalgyal","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"까다(관형형 깐)+달걀 통사적 합성","cat":"skin","mean":"껍질을 깐 삶은 달걀처럼 매끈해 보이는 피부를 비유하는 광고 표현.","ex":"메디큐브 깐달걀 모공결 세럼.","fr":"peau « œuf écalé »","frpos":"loc.n.","frdef":"Métaphore d'une peau lisse et nette comme un œuf dur écalé.","par":"꿀피부","rel":"관련어(참고)"},{"id":"BT0095","w":"꾸덕하다","k":"h","rom":"kkudeokhada","pos":"형용사","unit":"단어","eo":"고유어","form":"파생어","memo":"꾸덕(어근)+-하다 / 신조어(표준국어대사전 미등재)","cat":"skin","mean":"내용물이 되거나 밀도 있게 달라붙는 듯한 사용감. 작성자는 그런 느낌이 적은 것을 선호함.","ex":"이 크림은 꾸덕해서 겨울밤에 듬뿍 올려 두기 좋다.","fr":"texture dense et onctueuse","frpos":"loc.adj.","frdef":"Se dit d'une texture épaisse, compacte et collante (crème, baume)."},{"id":"BT0096","w":"꿀 제형","k":"h","rom":"kkul jehyeong","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"꿀(고유어)+제형(劑形)","cat":"skin","mean":"꿀처럼 점성이 있어 보이는 내용물의 질감을 비유한 표현.","ex":"꿀 제형이라 스포이드에서 천천히 늘어지며 떨어진다.","fr":"texture miel","frpos":"loc.n.","frdef":"Texture visqueuse et filante, comparée au miel.","par":"제형","rel":"하위어(참고)"},{"id":"BT0097","w":"꿀피부","k":"h","rom":"kkulpibu","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"꿀(고유어)+피부(皮膚)","cat":"skin","mean":"매끈하고 윤기가 좋아 보이는 피부를 꿀에 빗대어 높게 평가하는 말.","ex":"파리도 미끄러질 꿀피부.","fr":"peau « de miel »","frpos":"loc.n.","frdef":"Peau lisse, lumineuse et éclatante, comparée au miel."},{"id":"BT0098","w":"나이아신아마이드","k":"h","rom":"naiasinamaideu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"niacinamide 차용","cat":"skin","mean":"화장품에 배합하는 비타민 B3 계열 성분명. 상품명에서는 함유 농도를 강조함.","ex":"더마팩토리 나이아신아마이드 20% 세럼 30ml.","fr":"niacinamide","frpos":"n.m.","frdef":"Forme de vitamine B3, actif éclaircissant reconnu en Corée, utilisé aussi pour le sébum et la barrière.","ing":"한국어: 비타민 B3의 한 형태. 한국에서는 식약처 고시 미백 기능성 원료이며, 피지·장벽 관리 제품에도 널리 쓰임.\nFrançais : La niacinamide est une forme de vitamine B3 utilisée dans les soins pour améliorer l'apparence des taches pigmentaires et soutenir la barrière cutanée.","inci":"Niacinamide"},{"id":"BT0101","w":"노니추출물","k":"h","rom":"nonichuchulmul","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"노니(noni)+추출물(抽出物)","cat":"skin","mean":"노니에서 얻은 추출 원료를 가리키며 이 설명에서는 제품에 넣은 성분으로 소개함.","ex":"노니추출물을 담은 토너.","fr":"extrait de noni","frpos":"loc.n.","frdef":"Extrait du fruit de noni (Morinda citrifolia), utilisé comme antioxydant.","ing":"한국어: 남태평양 원산 노니(모린다 시트리폴리아) 열매에서 얻은 추출물. 항산화·컨디셔닝 목적으로 배합.\nFrançais : Extrait du fruit de Morinda citrifolia (noni), utilisé comme ingrédient de soin pour ses composés antioxydants et ses propriétés conditionnantes.","inci":"Morinda Citrifolia Fruit Extract"},{"id":"BT0102","w":"녹차추출물","k":"h","rom":"nokchachuchulmul","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"녹차(綠茶)+추출물(抽出物)","cat":"skin","mean":"녹차에서 얻는 추출 원료를 가리키는 배합 성분명.","ex":"녹차추출물이 들어간 토너라 피지가 많은 여름에 쓰기 좋다.","fr":"extrait de thé vert","frpos":"loc.n.","frdef":"Extrait de feuilles de thé, riche en polyphénols antioxydants.","ing":"한국어: 차나무 잎 추출물. 카테킨 등 폴리페놀이 들어 있어 항산화·진정·피지 관리 문구에 쓰임.\nFrançais : Extrait de feuilles de thé vert (Camellia sinensis), riche en polyphénols, notamment en catéchines, employé dans les soins antioxydants.","inci":"Camellia Sinensis Leaf Extract"},{"id":"BT0108","w":"당기다","k":"h","rom":"danggida","pos":"동사","unit":"단어","eo":"고유어","form":"단일어","memo":"다의어 '당기다'의 피부 감각 의미","cat":"skin","mean":"세안 뒤 피부가 건조해 팽팽하게 조이는 느낌을 말한다.","ex":"세안하고 아무것도 바르지 않으면 볼이 심하게 당긴다.","fr":"tirailler","frpos":"v.","frdef":"Sensation de peau tendue et sèche, surtout après le nettoyage."},{"id":"BT0111","w":"데일리템","k":"h","rom":"deillitem","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"데일리(daily)+-템(item 축약)","cat":"skin","mean":"매일 사용하기 좋다고 표현한 제품.","ex":"순하고 가벼워서 아침저녁으로 쓰는 데일리템이 되었다.","fr":"produit du quotidien","frpos":"loc.n.","frdef":"Produit qu'on utilise tous les jours.","par":"인생템","rel":"관련어(참고)"},{"id":"BT0113","w":"되직한 제형","k":"h","rom":"doejikhan jehyeong","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"되직하다(관형형)+제형(劑形)","cat":"skin","mean":"액체가 진하고 잘 흐르지 않는 상태를 말하며, 원문에서는 부정한다.","ex":"되직한 제형이라 손바닥에서 녹인 뒤 눌러 바른다.","fr":"texture épaisse","frpos":"loc.n.","frdef":"Texture consistante qui ne coule pas.","par":"제형","rel":"하위어(참고)"},{"id":"BT0116","w":"레티날","k":"h","rom":"retinal","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"retinal 차용","cat":"skin","mean":"이 상품에서 강조하는 비타민 A 계열 성분의 이름.","ex":"레티날 샷 타이트닝 부스터.","fr":"rétinal","frpos":"n.m.","frdef":"Dérivé de la vitamine A plus proche de l'acide rétinoïque que le rétinol.","ing":"한국어: 레티날데하이드. 비타민 A 유도체로, 레티놀보다 한 단계 더 레티노산에 가까운 형태라 더 강한 레티노이드로 소개됨.\nFrançais : Le rétinal, ou rétinaldéhyde, est un dérivé de la vitamine A qui peut être transformé en acide rétinoïque dans la peau.","inci":"Retinal","par":"레티놀","rel":"관련어(참고)"},{"id":"BT0117","w":"레티놀","k":"h","rom":"retinol","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"retinol 차용","cat":"skin","mean":"이 상품에서 강조하는 비타민 A 계열 성분의 이름.","ex":"이니스프리 레티놀 시카 모공 흔적 앰플.","fr":"rétinol","frpos":"n.m.","frdef":"Vitamine A, actif anti-rides officiellement reconnu en Corée.","ing":"한국어: 비타민 A. 한국에서는 식약처 고시 주름 개선 기능성 원료. 초기 사용 시 건조·자극(이른바 레티놀 반응)이 생길 수 있음.\nFrançais : Le rétinol est une forme de vitamine A utilisée dans les soins anti-âge. Il peut provoquer sécheresse et irritation, surtout au début de son utilisation.","inci":"Retinol"},{"id":"BT0119","w":"리포좀","k":"h","rom":"ripojom","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"liposome 차용","cat":"skin","mean":"후기에서 성분을 담은 구조를 가리키는 말로 사용함.","ex":"리포좀에 성분을 담아 피부 깊숙이 전달한다고 광고한다.","fr":"liposome","frpos":"n.m.","frdef":"Vésicule lipidique servant à encapsuler et transporter des actifs.","ing":"한국어: 인지질 이중막으로 된 미세한 주머니(소포). 성분 자체가 아니라 유효 성분을 감싸 전달하는 제형 기술.\nFrançais : Un liposome est une vésicule microscopique formée d'une ou plusieurs bicouches lipidiques, utilisée pour encapsuler certains ingrédients; ce n'est pas un actif unique.","inci":"Liposome(s) — 제형 기술명"},{"id":"BT0121","w":"마데카소사이드","k":"h","rom":"madekasosaideu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"madecassoside 차용","cat":"skin","mean":"전성분 목록에서 함량과 함께 표시한 배합 성분명.","ex":"마데카소사이드(20ppm).","fr":"madécassoside","frpos":"n.m.","frdef":"Molécule apaisante extraite de la centella asiatica, emblème des soins « cica ».","ing":"한국어: 병풀(센텔라 아시아티카)에서 얻는 트리테르펜 배당체. 한국 「시카」 제품의 대표 진정 성분.\nFrançais : Le madécassoside est un glycoside triterpénique présent dans la Centella asiatica, employé dans les soins apaisants.","inci":"Madecassoside","par":"시카","rel":"관련어(참고)"},{"id":"BT0123","w":"마무리감","k":"h","rom":"mamurigam","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"마무리(고유어)+-감(感)","cat":"skin","mean":"제품을 바르고 흡수시킨 뒤 피부에 남는 최종적인 사용 느낌.","ex":"끈적임 없이 보송한 마무리감이라 바로 화장을 해도 된다.","fr":"fini (sensation finale)","frpos":"n.m.","frdef":"Sensation laissée sur la peau une fois le produit absorbé."},{"id":"BT0124","w":"마스크 팩","k":"h","rom":"maseukeu paek","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"mask+pack(한국식 외래어 결합)","cat":"skin","mean":"얼굴에 붙여 사용하는 팩 제품을 가리킨다.","ex":"여행 갈 때는 하루에 한 장씩 쓸 마스크 팩을 챙긴다.","fr":"masque","frpos":"n.m.","frdef":"Terme coréen courant pour les masques visage, surtout les masques en tissu."},{"id":"BT0127","w":"메이크업 지속력","k":"h","rom":"meikeueop jisongnyeok","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"메이크업(make-up)+지속력(持續力)","cat":"skin","mean":"화장이 피부에 표현된 상태로 얼마나 오래 유지되는지를 가리키는 광고 표현.","ex":"프라이머를 먼저 바르면 메이크업 지속력이 확실히 좋아진다.","fr":"tenue du maquillage","frpos":"loc.n.","frdef":"Capacité d'un produit à faire durer le maquillage."},{"id":"BT0131","w":"모공 축소","k":"h","rom":"mogong chukso","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"모공(毛孔)+축소(縮小)","cat":"skin","mean":"눈에 띄는 모공이 작아 보이도록 하는 관리 효과를 가리킴.","ex":"모공 축소 효과를 기대하고 차가운 패드를 코 옆에 올려 두었다.","fr":"réduction des pores","frpos":"loc.n.","frdef":"Effet visant à rendre les pores moins visibles."},{"id":"BT0132","w":"모공 탄력","k":"h","rom":"mogong tallyeok","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"모공(毛孔)+탄력(彈力)","cat":"skin","mean":"모공 주변 피부의 탄탄함을 관리한다는 홍보 표현.","ex":"나이가 들수록 볼 쪽 모공 탄력이 떨어지는 것이 느껴진다.","fr":"fermeté des pores","frpos":"loc.n.","frdef":"Formule marketing: raffermir la peau autour des pores pour qu'ils paraissent moins relâchés."},{"id":"BT0133","w":"모공부자","k":"h","rom":"mogongbuja","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"모공(毛孔)+부자(富者)","cat":"skin","mean":"모공이 많거나 도드라져 보인다고 자신을 묘사하는 표현.","ex":"수부지/모공부자/피지/트러블/민감성/21호.","fr":"peau aux pores très visibles","frpos":"loc.n.","frdef":"Expression humoristique pour une personne aux pores très visibles."},{"id":"BT0134","w":"모공이 늘어지다","k":"h","rom":"mogongi neureojida","pos":"동사","unit":"구","eo":"혼종어","form":"구(句)","memo":"모공이+늘어지다(늘다+-어+지다)","cat":"skin","mean":"모공이 길어지거나 처져 보인다고 느끼는 상태.","ex":"볼 모공이 세로로 늘어져서 탄력 관리를 시작했다.","fr":"pores qui s'affaissent","frpos":"loc.v.","frdef":"Pores qui deviennent ovales et plus visibles avec la perte de fermeté."},{"id":"BT0140","w":"무난템","k":"h","rom":"munantem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"무난(無難)+-템(item 축약)","cat":"skin","mean":"두드러진 장점보다는 일상적으로 큰 부담 없이 쓰는 제품이라는 평가.","ex":"그냥 데일리로 쓰는 무난템입니다.","fr":"produit sans surprise","frpos":"loc.n.","frdef":"Produit correct, sans défaut ni qualité marquante.","par":"인생템","rel":"관련어(참고)"},{"id":"BT0146","w":"묽은 제형","k":"h","rom":"mulgeun jehyeong","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"묽다(관형형)+제형(劑形)","cat":"skin","mean":"액체가 진하지 않고 쉽게 흐르는 성질. 이 원문은 예상과 실제를 비교한다.","ex":"묽은 제형이라 화장솜에 적셔 닦아 내기 편하다.","fr":"texture fluide","frpos":"loc.n.","frdef":"Texture liquide et légère qui coule facilement.","par":"제형","rel":"하위어(참고)"},{"id":"BT0149","w":"미백","k":"h","rom":"mibaek","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"미(美)+백(白)","cat":"skin","mean":"피부색이나 잡티를 더 밝고 균일하게 관리하는 효과를 기대하는 표현.","ex":"미백에 좋은 성분이 여러가지 들어 있어서.","fr":"éclaircissement (blanchiment) du teint","frpos":"n.m.","frdef":"Catégorie fonctionnelle coréenne: atténuer les taches et unifier le teint (pas « blanchir » la peau).","par":"기능성 화장품","rel":"관련어(참고)","faux":1},{"id":"BT0152","w":"바쿠치올","k":"h","rom":"bakuchiol","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"bakuchiol 차용","cat":"skin","mean":"전성분 목록에서 배합 원료로 표시한 성분명.","ex":"레티놀이 자극적이어서 바쿠치올 세럼으로 바꿨다.","fr":"bakuchiol","frpos":"n.m.","frdef":"Actif d'origine végétale présenté comme alternative douce au rétinol.","ing":"한국어: 보골지(Psoralea corylifolia) 씨앗에서 얻는 성분. 「식물성 레티놀 대체 성분」으로 홍보됨.\nFrançais : Le bakuchiol est un composé d'origine végétale notamment extrait de Psoralea corylifolia, commercialisé comme alternative cosmétique au rétinol, sans être un rétinoïde.","inci":"Bakuchiol","par":"레티놀","rel":"관련어(참고)"},{"id":"BT0153","w":"바하","k":"h","rom":"baha","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두문자어)","memo":"B·H·A의 한국식 음절 읽기(두문자어)","cat":"skin","mean":"각질 관리 성분군 BHA를 한글로 부르는 표현. 상품명에서는 아하·파하와 함께 나열함.","ex":"바하 토너로 일주일에 두 번 블랙헤드를 관리한다.","fr":"acide bêta-hydroxylé (B.H.A.)","frpos":"n.m.","frdef":"Lecture coréenne de « BHA », surtout l'acide salicylique, exfoliant liposoluble.","ing":"한국어: BHA(베타하이드록시산)의 한국식 읽기. 주로 살리실산을 가리키며, 지용성이라 모공 속 피지·각질 관리에 쓰임.\nFrançais : Le BHA désigne les bêta-hydroxyacides; en cosmétique, ce terme renvoie surtout à l'acide salicylique, utilisé pour exfolier la peau.","inci":"BHA — 대표: Salicylic Acid","par":"아하","rel":"관련어(참고)"},{"id":"BT0154","w":"배양액","k":"h","rom":"baeyangaek","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"배양(培養)+액(液)","cat":"skin","mean":"미생물이나 세포 등을 길러 얻는 액체를 가리키며, 이 문맥에서는 제품에 들어 있는 원료를 설명함.","ex":"본 제품은 배양액을 다량 함유하고 있어.","fr":"milieu de culture (filtrat)","frpos":"loc.n.","frdef":"Liquide issu de la culture de cellules ou de micro-organismes, utilisé comme ingrédient.","ing":"한국어: 미생물·식물 세포·줄기세포 등을 배양한 뒤 얻은 액체를 넓게 이르는 말. 실제 원료는 제품마다 다르므로 전성분 확인 필요.\nFrançais : Un milieu de culture est un liquide utilisé pour cultiver des cellules ou des micro-organismes. La composition exacte de l'ingrédient cosmétique dépend de son origine et de son procédé de fabrication.","inci":"… Culture Conditioned Media / … Ferment Filtrate 등(제품별)"},{"id":"BT0155","w":"베타인","k":"h","rom":"betain","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"betaine 차용","cat":"skin","mean":"전성분 목록에서 배합 원료로 표시한 성분명.","ex":"베타인이 들어 있어 세안 후에도 피부가 덜 당긴다.","fr":"bétaïne","frpos":"n.f.","frdef":"Dérivé d'acide aminé hydratant et apaisant.","ing":"한국어: 사탕무 등에서 얻는 아미노산 유도체(트라이메틸글라이신). 보습·자극 완화 목적으로 배합.\nFrançais : La bétaïne, ou triméthylglycine, est un composé naturellement présent notamment dans la betterave, utilisé comme humectant et agent de conditionnement.","inci":"Betaine"},{"id":"BT0157","w":"변성알코올","k":"h","rom":"byeonseongalkool","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"변성(變性)+알코올(alcohol)","cat":"skin","mean":"전성분 목록에 표시된 가공 알코올 원료 명칭.","ex":"변성알코올이 앞쪽에 적혀 있으면 민감한 날에는 피한다.","fr":"alcool dénaturé","frpos":"loc.n.","frdef":"Éthanol rendu impropre à la consommation; solvant pouvant dessécher.","ing":"한국어: 마시지 못하게 변성제를 넣은 에탄올. 용매·산뜻한 사용감·빠른 건조에 쓰이며, 민감 피부에서는 건조·자극 요인으로 꼽힘.\nFrançais : L'alcool dénaturé est de l'éthanol auquel on a ajouté des substances le rendant impropre à la consommation. Il sert notamment de solvant et peut être desséchant.","inci":"Alcohol Denat."},{"id":"BT0158","w":"병풀추출물","k":"h","rom":"byeongpulchuchulmul","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"병풀(고유어)+추출물(抽出物)","cat":"skin","mean":"병풀에서 얻는 추출 원료를 뜻하며 광고에서 배합 성분으로 내세움.","ex":"병풀추출물로 속부터 바뀌는.","fr":"extrait de centella asiatica","frpos":"loc.n.","frdef":"Extrait de la plante centella, base des soins apaisants « cica ».","ing":"한국어: 병풀(센텔라 아시아티카) 추출물. 마데카소사이드·아시아티코사이드 등을 포함하며 한국 「시카」 진정 제품의 핵심 원료.\nFrançais : Extrait de Centella asiatica, plante utilisée dans les soins cosmétiques apaisants; sa composition varie selon l'extraction.","inci":"Centella Asiatica Extract","par":"시카","rel":"관련어(참고)"},{"id":"BT0160","w":"보습 잠금","k":"h","rom":"boseup jamgeum","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"보습(保濕)+잠금(잠그다+-ㅁ)","cat":"skin","mean":"피부 수분이 쉽게 빠져나가지 않도록 유지한다는 비유적 광고 표현.","ex":"마지막에 크림을 덧발라 보습 잠금을 해 준다.","fr":"verrouillage de l'hydratation","frpos":"loc.n.","frdef":"Formule publicitaire: empêcher l'eau de s'évaporer de la peau."},{"id":"BT0161","w":"보습 지속력","k":"h","rom":"boseup jisongnyeok","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"보습(保濕)+지속력(持續力)","cat":"skin","mean":"바른 뒤 보습 상태가 얼마나 오래 이어지는지를 뜻하는 광고 표현.","ex":"보습 지속력이 좋아서 저녁까지 얼굴이 당기지 않았다.","fr":"durée de l'hydratation","frpos":"loc.n.","frdef":"Durée pendant laquelle l'effet hydratant persiste."},{"id":"BT0162","w":"보습감","k":"h","rom":"boseupgam","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"보습(保濕)+-감(感)","cat":"skin","mean":"피부가 건조해지지 않도록 감싸 주는 듯한 느낌.","ex":"가볍게 발리는데도 보습감이 오래 남는 로션이다.","fr":"sensation d'hydratation","frpos":"loc.n.","frdef":"Sensation de peau enveloppée et non desséchée."},{"id":"BT0163","w":"보습력","k":"h","rom":"boseumnyeok","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"보습(保濕)+-력(力)","cat":"skin","mean":"피부가 건조해지지 않게 유지해 주는 정도에 대한 평가.","ex":"끈적임이 거의 없는데 보습력은 약한 편이에요.","fr":"pouvoir hydratant","frpos":"loc.n.","frdef":"Capacité d'un produit à maintenir la peau hydratée."},{"id":"BT0164","w":"보습막","k":"h","rom":"boseummak","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"보습(保濕)+막(膜)","cat":"skin","mean":"수분이 쉽게 사라지지 않게 피부 표면을 감싸는 층 같은 느낌을 비유함.","ex":"피부에 보습막을 씌워주는 듯한.","fr":"film hydratant","frpos":"loc.n.","frdef":"Fine couche protectrice qui retient l'humidité à la surface."},{"id":"BT0166","w":"볼륨감","k":"h","rom":"bollyumgam","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"볼륨(volume)+-감(感)","cat":"skin","mean":"① 얼굴 피부가 도톰하고 차 있어 보이는 인상.\n② 속눈썹이 풍성해 보이는 정도.","ex":"쿠션을 얇게 두드려 바르니 광과 함께 피부에 볼륨감이 살아났다.","fr":"volume, aspect repulpé ; volume (cils)","frpos":"loc.n.","frdef":"1. Aspect rebondi et plein du visage ou des lèvres. 2. Effet épaississant sur les cils."},{"id":"BT0167","w":"볼륨광채","k":"h","rom":"bollyumgwangchae","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"볼륨(volume)+광채(光彩)","cat":"skin","mean":"피부가 도톰하게 차오르면서 빛나 보이는 모습을 내세운 홍보 표현.","ex":"앰플을 두 번 겹쳐 바르니 볼에 볼륨광채가 올라왔다.","fr":"éclat repulpé","frpos":"loc.n.","frdef":"Formule marketing: peau à la fois repulpée et lumineuse."},{"id":"BT0169","w":"부스팅하다","k":"h","rom":"buseutinghada","pos":"동사","unit":"단어","eo":"혼종어","form":"파생어","memo":"부스팅(boosting)+-하다","cat":"skin","mean":"제품을 함께 활용하여 관리 효과를 높인다는 뜻으로 사용한 홍보 표현.","ex":"세안 직후에 발라 다음 단계의 흡수를 부스팅한다.","fr":"booster (l'effet)","frpos":"v.","frdef":"Renforcer l'efficacité d'un soin, souvent par une étape préalable."},{"id":"BT0178","w":"사바사","k":"h","rom":"sabasa","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"사(람) 바(이) 사(람) 축약","cat":"skin","mean":"사람에 따라 제품 반응과 평가가 다를 수 있다는 뜻.","ex":"향은 사바사라서 직접 맡아 보고 사는 것이 좋다.","fr":"ça dépend des personnes","frpos":"loc.n.","frdef":"Abréviation de « 사람 바이 사람 » (personne par personne): l'effet varie selon chacun."},{"id":"BT0180","w":"산유국","k":"h","rom":"sanyuguk","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"산유(産油)+국(國)","cat":"skin","mean":"피지가 많이 나오는 피부를 석유를 생산하는 나라에 빗댄 말.","ex":"여름만 되면 이마가 산유국이 되어 기름종이를 달고 산다.","fr":"« pays producteur de pétrole »","frpos":"loc.n.","frdef":"Métaphore humoristique pour une peau très grasse.","par":"악지성","rel":"관련어(참고)"},{"id":"BT0182","w":"살리실릭애씨드","k":"h","rom":"sallisilligaessideu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"salicylic acid 차용(한국 전성분 표기)","cat":"skin","mean":"전성분 목록에 표시된 화장품 배합 성분명.","ex":"살리실릭애씨드가 들어간 클렌저로 코 주변을 꼼꼼히 씻는다.","fr":"acide salicylique","frpos":"n.m.","frdef":"Nom INCI coréen de l'acide salicylique, exfoliant BHA.","ing":"한국어: 살리실산의 화장품 성분명 표기(한국 전성분식). 지용성 각질 관리 산(BHA). 「살리실산」과 같은 물질.\nFrançais : L'acide salicylique est un acide aromatique utilisé notamment comme exfoliant dans les soins pour les peaux à imperfections.","inci":"Salicylic Acid"},{"id":"BT0189","w":"성분이 착하다","k":"h","rom":"seongbuni chakhada","pos":"형용사","unit":"구","eo":"혼종어","form":"구(句)","memo":"성분이+착하다(의인화)","cat":"skin","mean":"배합 성분이 피부에 부담이 적고 좋다고 느끼는 평가를 사람의 성품에 비유함.","ex":"성분이 착해서 아이와 같이 써도 걱정이 없다.","fr":"formule « clean » (ingrédients doux)","frpos":"loc.adj.","frdef":"Se dit d'un produit dont la composition est jugée douce et sans ingrédients controversés."},{"id":"BT0190","w":"세라마이드","k":"h","rom":"seramaideu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"ceramide 차용","cat":"skin","mean":"제품에서 강조하는 지질 성분 이름.","ex":"토니모리 세라마이드 모찌 토너.","fr":"céramide","frpos":"n.m.","frdef":"Lipide de la couche cornée qui renforce la barrière cutanée.","ing":"한국어: 각질층 세포 사이 지질의 주성분인 스핑고지질. 피부 장벽 강화·보습 성분.\nFrançais : Les céramides sont des lipides de la couche cornée qui contribuent à la fonction barrière de la peau et à la limitation de la perte en eau.","inci":"Ceramide NP / AP / EOP 등"},{"id":"BT0192","w":"속보습","k":"h","rom":"sokboseup","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"속(고유어)+보습(保濕)","cat":"skin","mean":"겉만 촉촉한 느낌을 넘어 피부 안쪽 건조함까지 보완한다는 홍보 표현.","ex":"겉은 번들거려도 속이 당겨서 속보습에 좋은 앰플을 찾았다.","fr":"hydratation en profondeur","frpos":"loc.n.","frdef":"Hydratation qui agit sur la sécheresse interne, au-delà de la surface.","par":"수부지","rel":"관련어(참고)"},{"id":"BT0193","w":"속촉촉 겉보송","k":"h","rom":"sokchokchok geotbosong","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"속+촉촉(어근), 겉+보송(어근)의 대구형 조어","cat":"skin","mean":"피부 속은 촉촉하게 느껴지면서 표면은 축축하거나 끈적이지 않는 마무리를 함께 묘사함.","ex":"보송한 속촉촉 겉보송의 정석이랄까요.","fr":"hydraté dedans, sec dehors","frpos":"loc.n.","frdef":"Fini idéal coréen: peau hydratée en profondeur mais mate et non collante en surface.","par":"수부지","rel":"관련어(참고)"},{"id":"BT0195","w":"수분 케어","k":"h","rom":"subun keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"수분(水分)+케어(care)","cat":"skin","mean":"피부에 수분을 보충하고 건조함을 관리하는 것.","ex":"수분 케어를 중심으로 스킨케어를 하고 싶은 분들에게.","fr":"soin hydratant","frpos":"loc.n.","frdef":"Ensemble des gestes visant à réhydrater la peau."},{"id":"BT0196","w":"수분 폭탄","k":"h","rom":"subun poktan","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"수분(水分)+폭탄(爆彈)","cat":"skin","mean":"수분을 많이 공급하는 듯한 인상을 폭탄에 빗대어 강조한 홍보 표현.","ex":"바르자마자 물방울이 맺히는 수분 폭탄 크림이다.","fr":"« bombe d'hydratation »","frpos":"loc.n.","frdef":"Formule marketing pour un produit très hydratant."},{"id":"BT0197","w":"수분광","k":"h","rom":"subungwang","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"수분(水分)+광(光)","cat":"skin","mean":"피부가 수분을 머금은 듯 촉촉하게 빛나 보이는 마무리를 표현함.","ex":"쿠션을 얇게 두드렸더니 은은한 수분광이 돌았다.","fr":"éclat hydraté (dewy)","frpos":"loc.n.","frdef":"Fini lumineux et humide, comme une peau gorgée d'eau.","par":"물광","rel":"관련어(참고)"},{"id":"BT0200","w":"스쿠알란","k":"h","rom":"seukuallan","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"squalane 차용","cat":"skin","mean":"전성분 목록에 기재된 화장품 배합 성분명.","ex":"스쿠알란 오일을 한 방울 섞어 바르면 덜 건조하다.","fr":"squalane","frpos":"n.m.","frdef":"Huile émolliente légère et stable (forme hydrogénée du squalène).","ing":"한국어: 스쿠알렌에 수소를 첨가해 안정화한 오일. 가볍고 산화가 덜한 유연·보습 성분(올리브·사탕수수 유래 등).\nFrançais : Le squalane est un hydrocarbure saturé obtenu par hydrogénation du squalène; il est utilisé comme émollient stable dans les soins.","inci":"Squalane"},{"id":"BT0204","w":"스킵 케어","k":"h","rom":"seukip keeo","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"skip+care(한국식 조어)","cat":"skin","mean":"여러 피부 관리 단계를 간소화하여 사용하는 방식.","ex":"피부가 예민해져서 토너와 크림만 바르는 스킵 케어를 하고 있다.","fr":"skip-care (routine simplifiée)","frpos":"loc.n.","frdef":"Tendance coréenne consistant à réduire le nombre d'étapes de soin."},{"id":"BT0206","w":"스피큘","k":"h","rom":"seupikyul","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"spicule 차용","cat":"skin","mean":"내용물에 들어 있으며 뭉쳐 보일 수 있다고 제조사가 안내하는 입자성 성분을 가리킴.","ex":"내용물 특성상 스피큘이 뭉쳐보이는 부분이 있을 수 있으나.","fr":"spicules","frpos":"n.m.pl.","frdef":"Micro-aiguilles de silice d'éponge marine qui picotent et favorisent la pénétration.","ing":"한국어: 민물 해면에서 얻는 미세한 바늘 모양 실리카 조각. 피부에 따끔한 자극을 주며 흡수를 돕는다고 홍보되는 성분·기술.\nFrançais : Les spicules cosmétiques sont de fines structures en forme d'aiguilles, souvent issues d'éponges, incorporées à certains soins exfoliants; elles peuvent provoquer des picotements.","inci":"Hydrolyzed Sponge 등(제품마다 표기 다름)"},{"id":"BT0209","w":"시카","k":"h","rom":"sika","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(절단어)","memo":"cicatrice/Centella asiatica에서 온 축약 차용","cat":"skin","mean":"병풀 계열 성분을 내세운 진정 관리 문맥의 화장품 표현.","ex":"마스크 때문에 붉어진 턱에 시카 크림을 발랐다.","fr":"cica (centella)","frpos":"n.f.","frdef":"Terme coréen désignant la centella asiatica et la gamme de soins apaisants qui en contient.","ing":"한국어: 병풀(Centella asiatica)을 가리키는 한국 화장품 업계 통칭. 병풀 추출물·마데카소사이드 등을 넣은 진정 제품군 전체를 부르는 말로도 쓰임.\nFrançais : « Cica » est un terme commercial désignant généralement des soins à base de Centella asiatica ou de ses constituants; il ne correspond pas à un ingrédient INCI unique.","inci":"Centella Asiatica 계열 원료의 통칭"},{"id":"BT0211","w":"쌀알 크기","k":"h","rom":"ssaral keugi","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"쌀알(합성어)+크기","cat":"skin","mean":"바르는 양을 쌀 한 알에 빗대어 아주 적게 설명하는 표현.","ex":"레티놀 크림은 쌀알 크기만 덜어 얼굴 전체에 얇게 편다.","fr":"(dose) grain de riz","frpos":"loc.n.","frdef":"Mesure de quantité très petite, de la taille d'un grain de riz."},{"id":"BT0212","w":"생얼","k":"h","rom":"saengeol","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"생(生)-+얼(굴) — 구어에서는 「쌩얼」로 세게 발음함","cat":"skin","mean":"화장을 하지 않은 얼굴을 가리키는 구어 표현.","ex":"미네랄 쿠션도 안 바르고 생얼로 자주 나갑니다.","fr":"visage sans maquillage","frpos":"loc.n.","frdef":"Mot familier pour le visage au naturel, sans maquillage.","par":"꾸안꾸","rel":"관련어(참고)"},{"id":"BT0214","w":"아데노신","k":"h","rom":"adenosin","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"adenosine 차용","cat":"skin","mean":"전성분 목록에 기재된 화장품 배합 성분명.","ex":"이 제품에는 주름 개선을 돕는 아데노신 성분이 함유되어 있습니다.","fr":"adénosine","frpos":"n.f.","frdef":"Nucléoside reconnu en Corée comme actif anti-rides.","ing":"한국어: 핵산을 이루는 뉴클레오사이드. 한국 식약처 고시 주름 개선 기능성 원료.\nFrançais : L'adénosine est un nucléoside naturellement présent dans l'organisme, employé dans certains soins visant à améliorer l'apparence des rides.","inci":"Adenosine"},{"id":"BT0215","w":"아줄렌","k":"h","rom":"ajullen","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"azulene 차용","cat":"skin","mean":"상품설명에서 배합 특징으로 내세우는 성분 명칭.","ex":"레티날 샷에 판테놀과 아줄렌 성분이 더해져 피부를 진정시켜 줍니다.","fr":"azulène","frpos":"n.m.","frdef":"Composé aromatique bleu présent notamment dans certaines huiles essentielles; à distinguer du guaiazulène.","ing":"한국어: 캐모마일 등에서 얻는 푸른색 성분(구아이아줄렌 등). 진정 목적으로 쓰이며 제품을 푸른빛으로 만듦.\nFrançais : L'azulène est une famille de composés aromatiques colorés en bleu; certains dérivés, comme le guaiazulène, sont utilisés dans les soins apaisants.","inci":"Guaiazulene / Sodium Guaiazulene Sulfonate"},{"id":"BT0217","w":"아하","k":"h","rom":"aha","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두문자어)","memo":"A·H·A 음절 읽기","cat":"skin","mean":"후기에서 각질 관리에 쓰는 AHA 성분 또는 그 제품을 지칭한다.","ex":"아하(AHA) 성분을 처음 썼을 때는 피부가 꽤 따갑게 느껴졌습니다.","fr":"acide alpha-hydroxylé (A.H.A.)","frpos":"n.m.","frdef":"Lecture coréenne de « AHA »: acides exfoliants hydrosolubles (glycolique, lactique).","ing":"한국어: AHA(알파하이드록시산)의 한국식 읽기. 글라이콜릭애씨드·락틱애씨드 등 수용성 각질 관리 산.\nFrançais : Les AHA sont des alpha-hydroxyacides, notamment les acides glycolique et lactique, utilisés pour favoriser l'exfoliation superficielle de la peau.","inci":"AHA — Glycolic Acid, Lactic Acid 등"},{"id":"BT0218","w":"악건성","k":"h","rom":"akgeonseong","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"악-(惡, 접두사적)+건성(乾性)","cat":"skin","mean":"건조함이 매우 심한 피부를 강조하는 표현.","ex":"악건성 및 문제성 피부를 위해 개발된 저자극 수분 제품입니다.","fr":"peau très sèche","frpos":"loc.n.","frdef":"Peau extrêmement sèche, qui tiraille et desquame."},{"id":"BT0219","w":"악지성","k":"h","rom":"akjiseong","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"악-(惡)+지성(脂性)","cat":"skin","mean":"피지나 기름기가 매우 많은 지성 피부를 강조하는 소비자 표현.","ex":"피지 분비가 극심한 악지성 피부 타입이 사용하기에 적합합니다.","fr":"peau très grasse","frpos":"loc.n.","frdef":"Peau extrêmement grasse et luisante."},{"id":"BT0222","w":"알란토인","k":"h","rom":"allantoin","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"allantoin 차용","cat":"skin","mean":"전성분 목록에서 배합 원료로 표시한 성분명.","ex":"피부 자극 완화를 돕는 알란토인 성분이 전성분에 포함되어 있습니다.","fr":"allantoïne","frpos":"n.f.","frdef":"Actif apaisant et protecteur.","ing":"한국어: 컴프리 뿌리에서 유래(현재는 주로 합성)한 성분. 진정·보호·각질 연화 목적.\nFrançais : L'allantoïne est un composé utilisé comme agent protecteur et apaisant dans les produits de soin; elle est aujourd'hui souvent obtenue par synthèse.","inci":"Allantoin"},{"id":"BT0224","w":"알로에베라잎추출물","k":"h","rom":"alloeberaipchuchulmul","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"알로에베라+잎(고유어)+추출물(抽出物)","cat":"skin","mean":"알로에베라 잎에서 얻는 추출 원료를 가리키는 성분명.","ex":"알로에베라잎추출물이 들어가 민감해진 피부를 빠르게 진정시켜 줍니다.","fr":"extrait de feuille d'aloe vera","frpos":"loc.n.","frdef":"Extrait hydratant et apaisant d'aloe vera.","ing":"한국어: 알로에 베라 잎에서 얻은 추출물. 수분·진정 목적.\nFrançais : Extrait de feuilles d'Aloe barbadensis (aloe vera), utilisé dans les formules hydratantes et apaisantes.","inci":"Aloe Barbadensis Leaf Extract"},{"id":"BT0225","w":"알부틴","k":"h","rom":"albutin","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"arbutin 차용","cat":"skin","mean":"주의사항에서 시험자료와 관련하여 언급한 배합 성분명.","ex":"알부틴 성분은 인체적용시험 자료를 통해 미백 효능이 검증되었습니다.","fr":"arbutine","frpos":"n.f.","frdef":"Actif éclaircissant reconnu en Corée, inhibant la production de mélanine.","ing":"한국어: 베어베리 등에서 얻는 하이드로퀴논 배당체. 한국 식약처 고시 미백 기능성 원료.\nFrançais : L'arbutine est un glycoside de l'hydroquinone présent dans certaines plantes, utilisé dans les soins visant à atténuer l'apparence des taches pigmentaires.","inci":"Arbutin / Alpha-Arbutin"},{"id":"BT0227","w":"애매템","k":"h","rom":"aemaetem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"애매(曖昧)+-템","cat":"skin","mean":"효과나 만족도가 뚜렷하지 않아 평가하기 애매한 제품이라는 소비자의 표현.","ex":"효과가 뚜렷하지 않아 계속 써야 할지 다소 애매템입니다.","fr":"produit mitigé","frpos":"loc.n.","frdef":"Produit dont on ne sait pas s'il est bon ou mauvais.","par":"인생템","rel":"관련어(참고)"},{"id":"BT0229","w":"어성초","k":"h","rom":"eoseongcho","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"어(魚)+성(腥)+초(草)","cat":"skin","mean":"제품에서 강조하는 식물 유래 성분의 통상 명칭.","ex":"어성초 추출물을 77% 함유한 수분 진정 토너입니다.","fr":"houttuynia (herbe à poisson)","frpos":"n.f.","frdef":"Plante (Houttuynia cordata) utilisée dans les soins apaisants anti-imperfections.","ing":"한국어: 약모밀(Houttuynia cordata) 추출물. 한국 제품에서 트러블·진정 문구와 함께 자주 쓰이는 식물 원료.\nFrançais : L'extrait de Houttuynia cordata provient d'une plante asiatique et est utilisé dans les soins destinés notamment aux peaux sujettes aux imperfections.","inci":"Houttuynia Cordata Extract"},{"id":"BT0232","w":"엄마화장품향","k":"h","rom":"eommahwajangpumhyang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"엄마+화장품(化粧品)+향(香)","cat":"skin","mean":"어머니가 쓰는 화장품을 떠올리게 하는 익숙한 향이라는 세대적·주관적 비유.","ex":"제품의 향을 맡아보니 어릴 적 맡던 엄마 화장품 향이 납니다.","fr":"« parfum de cosmétique de maman »","frpos":"loc.n.","frdef":"Odeur poudrée et classique qui rappelle les cosmétiques des mères."},{"id":"BT0234","w":"여드름성 피부 사용 적합","k":"h","rom":"yeodeureumseong pibu sayong jeokhap","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"여드름성+피부+사용+적합(適合)","cat":"skin","mean":"여드름이 생기기 쉬운 피부에서의 사용 적합성을 내세우는 제품 설명.","ex":"여드름성 피부 사용 적합 테스트를 완료하여 트러블 피부도 사용 적합성 테스트를 완료했다고 안내합니다..","fr":"testé sur peau à tendance acnéique","frpos":"loc.adj.","frdef":"Mention indiquant que le produit a fait l’objet d’un test sur des peaux à tendance acnéique, sans garantir l’absence de boutons."},{"id":"BT0236","w":"영양감","k":"h","rom":"yeongyanggam","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"영양(營養)+-감(感)","cat":"skin","mean":"질감이 풍부하고 피부를 충분히 감싸는 듯하다는 감각적 표현.","ex":"영양감이 꽉 찬 제형이라 피부에 든든하게 스며듭니다.","fr":"sensation nourrissante","frpos":"loc.n.","frdef":"Sensation d'une texture riche qui nourrit et enveloppe la peau."},{"id":"BT0238","w":"워터리 제형","k":"h","rom":"woteori jehyeong","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"워터리(watery)+제형(劑形)","cat":"skin","mean":"물처럼 묽게 흐르고 가볍게 느껴지는 내용물의 형태.","ex":"수분감이 가득한 묽은 워터리 제형이라 부담 없이 발립니다.","fr":"texture aqueuse","frpos":"loc.n.","frdef":"Texture très fluide, presque comme de l'eau.","par":"제형","rel":"하위어(참고)"},{"id":"BT0239","w":"유분감","k":"h","rom":"yubungam","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"유분(油分)+-감(感)","cat":"skin","mean":"기름 성분이 피부에 남아 있는 듯한 느낌을 뜻하며 원문에서는 없다고 평가한다.","ex":"사용 후 끈적임이나 겉도는 유분감이 거의 없습니다.","fr":"sensation grasse","frpos":"loc.n.","frdef":"Impression d'un film gras sur la peau.","par":"잔여감","rel":"관련어(참고)"},{"id":"BT0241","w":"응급 진정","k":"h","rom":"eunggeup jinjeong","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"응급(應急)+진정(鎭靜)","cat":"skin","mean":"갑자기 예민해지거나 자극받은 피부를 빨리 편안하게 관리한다는 홍보 표현.","ex":"자극받은 피부를 빠르게 다독여주는 응급 진정 케어 크림입니다.","fr":"apaisement SOS","frpos":"loc.n.","frdef":"Formule marketing pour un apaisement rapide d'une peau irritée."},{"id":"BT0242","w":"이층상 제형","k":"h","rom":"icheungsang jehyeong","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"이층상(二層相)+제형(劑形)","cat":"skin","mean":"기름 성분 쪽과 물 성분 쪽이 두 층으로 나뉜 제품 형태.","ex":"유상과 수상이 나뉜 이층상 제형이므로 충분히 흔들어 사용하세요.","fr":"formule biphasée","frpos":"loc.n.","frdef":"Produit composé d'une phase huileuse et d'une phase aqueuse séparées.","par":"제형","rel":"하위어(참고)"},{"id":"BT0243","w":"인생템","k":"h","rom":"insaengtem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"인생(人生)+-템","cat":"skin","mean":"작성자가 매우 만족하며 계속 사용하는 제품이라는 평가.","ex":"피부에 잘 맞아 몇 통째 꾸준히 구매하고 있는 인생템입니다.","fr":"produit culte (de toute une vie)","frpos":"loc.n.","frdef":"Le meilleur produit qu'on ait jamais utilisé."},{"id":"BT0244","w":"인체유사 콜라겐","k":"h","rom":"incheyusa kollagen","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"인체유사(人體類似)+콜라겐(collagen)","cat":"skin","mean":"인체의 콜라겐과 비슷한 특징을 내세운 원료 홍보 표현.","ex":"인체유사 콜라겐 성분을 함유하여 탄력 있는 피부로 가꿔 줍니다.","fr":"collagène « biomimétique »","frpos":"loc.n.","frdef":"Formule marketing pour un collagène présenté comme proche du collagène humain.","ing":"한국어: 사람 콜라겐과 구조가 비슷하게 만들었다는(재조합 등) 콜라겐을 부르는 홍보 표현. 실제 원료는 제품마다 달라 전성분 확인 필요.\nFrançais : Le « collagène de type humain » désigne un ingrédient présenté comme similaire au collagène humain, parfois obtenu par biotechnologie; son identité précise dépend de la formule.","inci":"제품별 표기(예: Recombinant Collagen 계열)"},{"id":"BT0245","w":"인체적용시험","k":"h","rom":"inchejeogyongsiheom","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"인체(人體)+적용(適用)+시험(試驗)","cat":"skin","mean":"사람에게 적용하여 반응 등을 확인한 시험을 뜻함.","ex":"인체적용시험 자료를 통해 피부 자극 완화 효과를 입증했습니다.","fr":"essai clinique sur l'humain (test d'efficacité)","frpos":"loc.n.","frdef":"Étude menée sur des participants humains pour évaluer un produit cosmétique selon un protocole défini."},{"id":"BT0246","w":"장벽 케어","k":"h","rom":"jangbyeok keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"장벽(障壁)+케어(care)","cat":"skin","mean":"피부 보호 기능을 관리한다는 제품 설명을 작성자가 받아들인 표현.","ex":"화장이 잘 먹고 피부 장벽 케어에 좋다는 후기를 보고 구매했습니다.","fr":"soin de la barrière cutanée","frpos":"loc.n.","frdef":"Soin visant à réparer et renforcer la barrière de la peau."},{"id":"BT0248","w":"저분자 히알루론산","k":"h","rom":"jeobunja hialluronsan","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"저분자(低分子)+히알루론산","cat":"skin","mean":"분자 크기가 작은 히알루론산 성분을 강조하는 상품명 표현.","ex":"저분자 히알루론산 토너가 피부 속 깊은 곳까지 수분을 채워 줍니다.","fr":"acide hyaluronique de bas poids moléculaire","frpos":"loc.n.","frdef":"Acide hyaluronique de faible masse moléculaire, utilisé notamment pour ses propriétés hydratantes.","ing":"한국어: 분자량을 작게 쪼갠 히알루론산. 일반 히알루론산보다 피부에 잘 스며든다고 홍보되는 보습 성분.\nFrançais : L'acide hyaluronique de faible poids moléculaire désigne des fractions d'acide hyaluronique plus petites, utilisées comme agents hydratants; leur pénétration dépend de leur taille et de la formule.","inci":"Hydrolyzed Hyaluronic Acid / Sodium Hyaluronate(저분자)","par":"히알루론산","rel":"하위어(참고)"},{"id":"BT0250","w":"전성분","k":"h","rom":"jeonseongbun","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"전-(全, 접두사)+성분(成分)","cat":"skin","mean":"제품에 들어간 모든 성분을 적은 목록을 뜻한다.","ex":"제품 사용 전 전성분 목록을 반드시 확인한 후 사용해 주세요.","fr":"liste INCI / liste d'ingrédients","frpos":"n.f.","frdef":"Liste obligatoire de tous les ingrédients d'un cosmétique."},{"id":"BT0253","w":"제형","k":"h","rom":"jehyeong","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"제(劑)+형(形)","cat":"skin","mean":"제품의 묽기나 질감 등 물리적인 형태를 뜻한다.","ex":"물처럼 흐르는 묽은 제형이라 피부에 부드럽게 흡수됩니다.","fr":"texture, forme galénique","frpos":"n.f.","frdef":"Forme physique d'un produit (crème, gel, fluide…)."},{"id":"BT0255","w":"좁쌀 여드름","k":"h","rom":"jopssal yeodeureum","pos":"명사","unit":"구","eo":"고유어","form":"구(句)","memo":"좁쌀+여드름(고유어)","cat":"skin","mean":"좁쌀처럼 작게 오돌토돌 올라오는 여드름을 가리키는 일상 표현.","ex":"좁쌀 여드름을 케어하는 데 도움을 받아 5~6통 정도 꾸준히 사용했습니다.","fr":"micro-kystes (petits boutons fermés)","frpos":"loc.n.","frdef":"Petites bosses ou imperfections cutanées évoquant des grains de millet, souvent des comédons fermés."},{"id":"BT0257","w":"주름 개선","k":"h","rom":"jureum gaeseon","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"주름(고유어)+개선(改善)","cat":"skin","mean":"주름이 덜 두드러지게 되는 변화를 뜻하며, 작성자는 아직 판단하기 어렵다고 함.","ex":"제품을 꾸준히 써봐야 주름 개선 효과를 명확히 체감할 수 있을 것 같습니다.","fr":"atténuation des rides (fonction anti-rides)","frpos":"loc.n.","frdef":"Catégorie fonctionnelle coréenne: réduction de l'apparence des rides.","par":"기능성 화장품","rel":"관련어(참고)"},{"id":"BT0258","w":"지복합성","k":"h","rom":"jibokhapseong","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"지(脂)+복합성(複合性)","cat":"skin","mean":"지성 성향과 부위별 복합적인 특성을 함께 가진 피부를 지칭한다.","ex":"지복합성 피부 타입을 가진 분들에게 베스트로 추천하는 기초 제품입니다.","fr":"peau mixte à grasse","frpos":"loc.n.","frdef":"Peau mixte avec dominante grasse.","par":"악지성","rel":"관련어(참고)"},{"id":"BT0260","w":"집중 케어","k":"h","rom":"jipjung keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"집중(集中)+케어(care)","cat":"skin","mean":"피부가 건조하고 푸석할 때 관리에 더 신경을 쓰는 것을 뜻함.","ex":"피부를 쫀쫀하게 집중 케어하고 싶을 때 사용하기 좋습니다.","fr":"soin intensif","frpos":"loc.n.","frdef":"Soin renforcé lors d'une période où la peau en a besoin."},{"id":"BT0265","w":"처박템","k":"h","rom":"cheobaktem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"처박다(어간)+-템","cat":"skin","mean":"사용에 실망해 더 쓰지 않고 방치한 제품을 뜻하는 비격식 표현.","ex":"사용 후 트러블이 나는 바람에 결국 처박템이 되었습니다.","fr":"produit abandonné au fond du tiroir","frpos":"loc.n.","frdef":"Produit décevant qu'on n'utilise plus.","par":"인생템","rel":"관련어(참고)"},{"id":"BT0268","w":"코트","k":"h","rom":"koteu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"coat 차용, 의존명사적 단위로 쓰임","cat":"skin","mean":"제품을 피부 위에 바르는 한 겹 또는 한 차례를 세는 영어 표현.","ex":"유분이 과잉일 때는 1코트, 수분이 부족할 때는 2코트로 조절해 바르세요.","fr":"couche","frpos":"n.f.","frdef":"Couche de produit appliquée (une couche, deux couches)."},{"id":"BT0271","w":"콧물 제형","k":"h","rom":"konmul jehyeong","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"콧물(합성어)+제형(劑形)","cat":"skin","mean":"콧물을 떠올리게 하는 점성 있고 흐르는 질감을 비유한 소비자 표현.","ex":"기존의 콧물 제형 토너보다 끈적임이 적고 보습력이 좋습니다.","fr":"texture filante (« morve »)","frpos":"loc.n.","frdef":"Texture visqueuse et filante, comparée familièrement à de la morve.","par":"제형","rel":"하위어(참고)"},{"id":"BT0272","w":"쿨링","k":"h","rom":"kulling","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"cooling 차용","cat":"skin","mean":"사용 뒤 피부가 시원해진다고 느끼는 효과.","ex":"피부에 바르는 즉시 쿨링 효과가 느껴져 피부 온도를 낮춰 줍니다.","fr":"effet rafraîchissant","frpos":"n.m.","frdef":"Sensation de fraîcheur après l'application."},{"id":"BT0273","w":"크리미 텍스처","k":"h","rom":"keurimi tekseucheo","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"creamy+texture","cat":"skin","mean":"크림처럼 부드럽고 매끄럽게 퍼지는 질감을 표현함.","ex":"부드러운 크리미 텍스처가 피부를 부드럽게 감싸 줍니다.","fr":"texture crémeuse","frpos":"loc.n.","frdef":"Texture douce et onctueuse comme une crème."},{"id":"BT0274","w":"타이트닝","k":"h","rom":"taiteuning","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"tightening 차용","cat":"skin","mean":"피부나 모공이 조여져 탄탄하게 느껴지는 효과를 표현함.","ex":"모공 타이트닝과 함께 피부 결 정돈을 돕는 에센스입니다.","fr":"effet raffermissant (tightening)","frpos":"n.m.","frdef":"Effet de resserrement et de fermeté de la peau ou des pores."},{"id":"BT0278","w":"토닝 케어","k":"h","rom":"toning keeo","pos":"명사","unit":"구","eo":"외래어","form":"구(句)","memo":"toning+care(한국식 조어)","cat":"skin","mean":"피부톤이나 잡티를 고르게 관리한다는 광고 표현.","ex":"칙칙한 피부 톤을 화사하게 가꿔주는 강력한 토닝 케어 제품입니다.","fr":"soin unifiant (toning)","frpos":"loc.n.","frdef":"Soin visant à unifier le teint et estomper les taches."},{"id":"BT0279","w":"토출구","k":"h","rom":"tochulgu","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"토출(吐出)+구(口)","cat":"skin","mean":"용기에서 내용물이 나오는 입구 부분.","ex":"뾰족한 토출구에 씌워진 캡을 열어 적당량을 조절해 사용하세요.","fr":"orifice de distribution","frpos":"loc.n.","frdef":"Ouverture par laquelle sort le produit du flacon ou du tube."},{"id":"BT0280","w":"토코페롤","k":"h","rom":"tokoperol","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"tocopherol 차용","cat":"skin","mean":"전성분 목록에 표시된 화장품 배합 성분명.","ex":"항산화 작용을 돕는 토코페롤 성분이 피부 건강을 지켜 줍니다.","fr":"tocophérol","frpos":"n.m.","frdef":"Vitamine E, antioxydant.","ing":"한국어: 비타민 E. 항산화 성분으로, 오일 성분의 산화를 막는 용도로도 배합.\nFrançais : Le tocophérol est une forme de vitamine E utilisée comme antioxydant pour protéger certains constituants de la formule contre l'oxydation.","inci":"Tocopherol"},{"id":"BT0282","w":"튜브형","k":"h","rom":"tyubeuhyeong","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"튜브(tube)+-형(型)","cat":"skin","mean":"내용물이 든 유연한 용기를 눌러 짜서 사용하는 포장 형태.","ex":"튜브형 양식으로 제작되어 원하는 양만큼 위생적으로 짜서 쓰기 편합니다.","fr":"en tube","frpos":"loc.adj.","frdef":"Conditionnement en tube souple à presser.","par":"펌프형","rel":"관련어(참고)"},{"id":"BT0283","w":"트라넥삼산","k":"h","rom":"teuraneksamsan","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"트라넥삼(tranexam-)+산(酸)","cat":"skin","mean":"상품명에서 배합 성분으로 내세우는 원료 명칭.","ex":"트라넥삼산 성분이 함유되어 기미와 잡티 케어에 도움을 줍니다.","fr":"acide tranexamique","frpos":"n.m.","frdef":"Actif utilisé contre les taches et le mélasma.","ing":"한국어: 아미노산 유도체(TXA). 원래 지혈제 성분이며, 화장품에서는 잡티·기미 관리 문구와 함께 쓰임.\nFrançais : L'acide tranexamique est un dérivé synthétique d'acide aminé, employé dans certains soins visant à atténuer l'apparence des taches pigmentaires.","inci":"Tranexamic Acid"},{"id":"BT0284","w":"트러블","k":"h","rom":"teureobeul","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"trouble 차용(의미 전이: 피부 문제)","cat":"skin","mean":"뾰루지나 여드름 등 피부에 생기는 문제를 넓게 지칭한다.","ex":"복합성 및 트러블 피부 타입에도 자극 없이 편안하게 작동합니다.","fr":"imperfections, boutons","frpos":"n.f.pl.","frdef":"Terme coréen générique pour boutons, rougeurs et réactions de la peau.","faux":1},{"id":"BT0286","w":"특허 성분","k":"h","rom":"teukheo seongbun","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"특허(特許)+성분(成分)","cat":"skin","mean":"특허와 관련된 원료라고 판매자가 소개하는 성분.","ex":"동아제약 특허 성분이 들어가 피부 장벽을 튼튼하게 강화해 줍니다.","fr":"ingrédient breveté","frpos":"loc.n.","frdef":"Ingrédient présenté comme protégé par un brevet."},{"id":"BT0287","w":"티트리잎오일","k":"h","rom":"titeuriipoil","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"티트리+잎(고유어)+오일(oil)","cat":"skin","mean":"티트리 잎에서 얻는 오일을 가리키는 배합 성분명.","ex":"티트리잎오일 성분이 들어있어 예민해진 피부를 빠르게 진정시킵니다.","fr":"huile de feuille d'arbre à thé","frpos":"loc.n.","frdef":"Huile essentielle purifiante de tea tree.","ing":"한국어: 티트리(멜라루카) 잎에서 얻은 에센셜 오일. 트러블 관리 제품에 쓰이며 원액은 자극이 될 수 있음.\nFrançais : L'huile essentielle de feuilles de Melaleuca alternifolia (arbre à thé) est utilisée dans les soins pour peaux à imperfections; elle peut être irritante.","inci":"Melaleuca Alternifolia (Tea Tree) Leaf Oil"},{"id":"BT0288","w":"파하","k":"h","rom":"paha","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두문자어)","memo":"P·H·A 음절 읽기","cat":"skin","mean":"각질 관리 성분군 PHA를 한글로 부르는 표현. 상품명에서는 아하·바하와 함께 나열함.","ex":"아하, 바하, 파하 성분이 불필요한 각질을 순하게 정돈해 줍니다.","fr":"PHA (acide polyhydroxylé)","frpos":"n.m.","frdef":"Lecture coréenne de « PHA »: acides exfoliants doux (gluconolactone…).","ing":"한국어: PHA(폴리하이드록시산)의 한국식 읽기. 글루코노락톤·락토바이오닉애씨드 등 분자가 커서 AHA보다 순한 각질 관리 산으로 소개됨.\nFrançais : Les PHA sont des polyhydroxyacides, notamment la gluconolactone et l'acide lactobionique, employés pour une exfoliation généralement douce.","inci":"PHA — Gluconolactone, Lactobionic Acid 등","par":"아하","rel":"관련어(참고)"},{"id":"BT0289","w":"판테놀","k":"h","rom":"pantenol","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"panthenol 차용","cat":"skin","mean":"전성분 목록에 기재된 화장품 배합 성분명.","ex":"판테놀 성분이 피부 수분 장벽을 견고하게 지켜 줍니다.","fr":"panthénol","frpos":"n.m.","frdef":"Provitamine B5 hydratante et apaisante.","ing":"한국어: 프로비타민 B5. 피부·모발에서 판토텐산으로 바뀌며 보습·진정 목적으로 배합.\nFrançais : Le panthénol est une provitamine B5 utilisée comme humectant et agent de soin pour la peau et les cheveux.","inci":"Panthenol"},{"id":"BT0290","w":"판토텐산","k":"h","rom":"pantotensan","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"판토텐(pantothen-)+산(酸)","cat":"skin","mean":"비타민 B5를 가리키는 성분명. 이 상품명에서는 배합 성분을 내세움.","ex":"판토텐산 액티브 성분이 유수분 밸런스를 조절해 줍니다.","fr":"acide pantothénique","frpos":"n.m.","frdef":"Vitamine B5.","ing":"한국어: 비타민 B5. 화장품에는 주로 판테놀이나 칼슘판토테네이트 형태로 들어감.\nFrançais : L'acide pantothénique est la vitamine B5; dans les cosmétiques, on utilise aussi ses dérivés, comme le panthénol et le pantothénate de calcium.","inci":"Calcium Pantothenate 등","par":"판테놀","rel":"관련어(참고)"},{"id":"BT0292","w":"펌프형","k":"h","rom":"peompeuhyeong","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"펌프(pump)+-형(型)","cat":"skin","mean":"눌러서 내용물을 덜어내는 펌프가 달린 용기 형태.","ex":"펌프형 용기라 필요한 만큼 위생적으로 눌러 쓰기 좋습니다.","fr":"flacon-pompe","frpos":"n.m.","frdef":"Conditionnement muni d'une pompe ; en Corée, la « pompe » sert aussi d'unité de dose (반 펌프, 한 펌프)."},{"id":"BT0293","w":"펌핑하다","k":"h","rom":"peompinghada","pos":"동사","unit":"단어","eo":"혼종어","form":"파생어","memo":"펌핑(pumping)+-하다","cat":"skin","mean":"용기의 펌프를 눌러 내용물을 꺼내는 동작.","ex":"내용물을 1~2회 적당량 펌핑하여 얼굴 전체에 발라줍니다.","fr":"actionner la pompe","frpos":"loc.v.","frdef":"Appuyer sur la pompe pour obtenir une dose de produit.","par":"펌프형","rel":"관련어(참고)"},{"id":"BT0294","w":"펩타이드","k":"h","rom":"peptaideu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"peptide 차용","cat":"skin","mean":"상품명에서 여섯 종류의 펩타이드 성분을 내세우는 표현.","ex":"6종 펩타이드 성분이 피부 탄력 강화에 도움을 줍니다.","fr":"peptide","frpos":"n.m.","frdef":"Courte chaîne d'acides aminés, actif anti-âge.","ing":"한국어: 아미노산 몇 개가 이어진 짧은 사슬. 화장품에서는 팔미토일펜타펩타이드 등 탄력·주름 관리 문구의 성분군을 가리킴.\nFrançais : Les peptides sont de courtes chaînes d'acides aminés; différentes séquences sont utilisées dans les soins, notamment pour l'apparence de la fermeté cutanée.","inci":"… Peptide(-n) (예: Palmitoyl Pentapeptide-4)"},{"id":"BT0295","w":"포뮬러","k":"h","rom":"pomyulleo","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"formula 차용","cat":"skin","mean":"화장품에 쓰인 성분 조합이나 처방을 가리키는 홍보 표현.","ex":"이온 히알루론산을 함유한 포뮬러가 깊은 수분감을 전달합니다.","fr":"formule","frpos":"n.f.","frdef":"Composition d'un produit (terme marketing)."},{"id":"BT0299","w":"플럼핑","k":"h","rom":"peulleomping","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"plumping 차용","cat":"skin","mean":"피부가 차올라 도톰하고 탄력 있어 보이는 인상을 내세우는 표현.","ex":"피부 속부터 탄력이 차오르는 플럼핑 효과를 선사합니다.","fr":"effet repulpant","frpos":"n.m.","frdef":"Effet qui rend la peau ou les lèvres plus pleines."},{"id":"BT0300","w":"피부 기초 체력","k":"h","rom":"pibu gicho cheryeok","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"피부+기초(基礎)+체력(體力)","cat":"skin","mean":"피부의 전반적인 상태와 관리 기반을 신체의 체력에 빗대어 표현함.","ex":"피부 기초 체력을 끌어올려 건강한 피부 상태로 가꿔 줍니다.","fr":"« condition physique » de la peau","frpos":"loc.n.","frdef":"Métaphore: résistance et santé de base de la peau."},{"id":"BT0302","w":"피부 민감도","k":"h","rom":"pibu mingamdo","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"피부(皮膚)+민감도(敏感度)","cat":"skin","mean":"피부가 자극에 얼마나 쉽게 반응하는지 나타내는 정도.","ex":"피부 민감도를 낮춰주는 순한 성분으로 구성되어 있습니다.","fr":"sensibilité cutanée","frpos":"n.f.","frdef":"Degré de réactivité de la peau aux agressions."},{"id":"BT0303","w":"피부 생기","k":"h","rom":"pibu saenggi","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"피부+생기(生氣)","cat":"skin","mean":"피부가 지쳐 보이지 않고 건강하고 활기 있어 보이는 인상을 뜻한다.","ex":"피부에 자연스러운 생기와 광채를 더하고 싶은 분들께 추천합니다.","fr":"vitalité du teint","frpos":"loc.n.","frdef":"Aspect frais, reposé et vivant de la peau."},{"id":"BT0305","w":"피부 입체감","k":"h","rom":"pibu ipchegam","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"피부+입체감(立體感)","cat":"skin","mean":"얼굴의 굴곡과 윤곽이 입체적으로 보이는 인상을 표현한 광고 문구.","ex":"시간이 지나면서 둔해지는 피부 입체감을 또렷하게 살려 줍니다.","fr":"relief du visage","frpos":"loc.n.","frdef":"Effet de volume et de contours du visage."},{"id":"BT0306","w":"피부 저자극 테스트","k":"h","rom":"pibu jeojageuk teseuteu","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"피부+저자극(低刺戟)+테스트(test)","cat":"skin","mean":"피부에 주는 자극이 적은지 시험했다는 판매자의 안내.","ex":"피부 저자극 테스트를 완료하여 민감성 피부를 고려해 테스트했다고 안내합니다. 사용할 수 있습니다.","fr":"test de tolérance cutanée","frpos":"loc.n.","frdef":"Test vérifiant le faible potentiel irritant d'un produit."},{"id":"BT0307","w":"피부 적응","k":"h","rom":"pibu jeogeung","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"피부+적응(適應)","cat":"skin","mean":"새로운 활성 성분을 쓰며 피부 반응과 사용 빈도를 살피는 과정을 뜻한다.","ex":"레티놀 제품은 사용법과 피부 적응 과정을 숙지한 뒤 사용하는 것이 좋습니다.","fr":"adaptation de la peau (rétinisation)","frpos":"loc.n.","frdef":"Période où la peau s'habitue à un actif fort comme le rétinol.","par":"레티놀","rel":"관련어(참고)"},{"id":"BT0311","w":"피부가 뒤집어지다","k":"h","rom":"pibuga dwijibeojida","pos":"동사","unit":"구","eo":"혼종어","form":"구(句)","memo":"피부가+뒤집어지다(비유)","cat":"skin","mean":"트러블·붉어짐 등 피부 상태가 갑자기 크게 나빠짐을 비유하는 말.","ex":"사용 후 피부가 뒤집어졌다는 평이 있어 다소 걱정하며 사용했습니다.","fr":"la peau « se retourne » (crise cutanée)","frpos":"loc.v.","frdef":"Dégradation brutale de la peau: boutons, rougeurs, irritations."},{"id":"BT0317","w":"피부결을 정돈하다","k":"h","rom":"pibugyeoreul jeongdonhada","pos":"동사","unit":"구","eo":"혼종어","form":"구(句)","memo":"피부결을+정돈(整頓)하다","cat":"skin","mean":"피부 표면을 고르게 정리한다는 뜻으로 쓰였다.","ex":"화장솜에 토너를 묻혀 안쪽에서 바깥쪽으로 피부결을 정돈해 줍니다.","fr":"affiner le grain de peau","frpos":"loc.v.","frdef":"Lisser et uniformiser la surface de la peau."},{"id":"BT0321","w":"피부자극도","k":"h","rom":"pibujageukdo","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"피부(皮膚)+자극도(刺戟度)","cat":"skin","mean":"피부에 주는 자극을 정도나 수치로 표현하는 시험 관련 용어.","ex":"피부 자극도 0.00 판정을 받아 안심하고 사용할 수 있는 제품입니다.","fr":"indice d'irritation cutanée","frpos":"loc.n.","frdef":"Mesure du potentiel irritant d'un produit lors d'un test."},{"id":"BT0322","w":"피부장벽","k":"h","rom":"pibujangbyeok","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"피부(皮膚)+장벽(障壁)","cat":"skin","mean":"피부를 보호하고 수분을 유지하는 바깥쪽 방어 기능을 지칭한다.","ex":"잦은 시술이나 외부 자극으로 손상된 피부 장벽을 회복시켜 줍니다.","fr":"barrière cutanée","frpos":"n.f.","frdef":"Fonction protectrice de la couche cornée qui retient l'eau."},{"id":"BT0323","w":"피부장벽 회복 기능성","k":"h","rom":"pibujangbyeok hoebok gineungseong","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"피부장벽+회복(回復)+기능성(機能性)","cat":"skin","mean":"피부장벽 회복을 기능성으로 내세운 상품설명 문구.","ex":"식약처로부터 피부 장벽 회복 기능성 심사를 마친 기초 크림입니다.","fr":"allégation « réparation de la barrière »","frpos":"loc.n.","frdef":"Fonction déclarée de restauration de la barrière cutanée (catégorie coréenne).","par":"기능성 화장품","rel":"관련어(참고)"},{"id":"BT0326","w":"피지 분비량","k":"h","rom":"piji bunbiryang","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"피지(皮脂)+분비량(分泌量)","cat":"skin","mean":"피부에서 나오는 피지의 양을 뜻함. 작성자는 사용 중 줄었다고 느낌.","ex":"꾸준히 사용하니 피지 분비량 자체가 줄어들어 번들거림이 개선되었습니다.","fr":"quantité de sébum sécrétée","frpos":"loc.n.","frdef":"Volume de sébum produit par la peau."},{"id":"BT0335","w":"호호바씨오일","k":"h","rom":"hohobassioil","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"호호바+씨(고유어)+오일","cat":"skin","mean":"호호바 씨에서 얻는 오일을 가리키는 배합 성분명.","ex":"호호바씨오일이 피부에 보습막을 형성하여 수분 손실을 막아 줍니다.","fr":"huile de graines de jojoba","frpos":"loc.n.","frdef":"Cire liquide proche du sébum, émolliente.","ing":"한국어: 호호바 씨앗에서 얻은 액상 왁스. 피지와 비슷한 조성으로 소개되는 유연 성분.\nFrançais : L'huile de graines de jojoba est principalement constituée d'esters cireux liquides et utilisée comme émollient dans les produits de soin.","inci":"Simmondsia Chinensis (Jojoba) Seed Oil"},{"id":"BT0339","w":"화장 밀착력","k":"h","rom":"hwajang milchangnyeok","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"화장(化粧)+밀착력(密着力)","cat":"skin","mean":"화장이 피부에 잘 붙어 유지되는 정도를 뜻하며, 작성자는 좋아졌다고 느낌.","ex":"며칠 사용해 보니 베이스 화장 밀착력이 확실히 좋아졌습니다.","fr":"adhérence du maquillage","frpos":"loc.n.","frdef":"Capacité du maquillage à tenir fermement sur la peau.","par":"밀착력","rel":"관련어(참고)"},{"id":"BT0341","w":"화장이 뭉치다","k":"s","rom":"hwajangi mungchida","pos":"동사","unit":"구","eo":"혼종어","form":"구(句)","memo":"화장이+뭉치다","cat":"skin","mean":"메이크업이 피부에 고르게 퍼지지 않고 작은 덩어리처럼 모여 보이는 상태.","ex":"건조한 날에는 볼 쪽에 화장이 뭉쳐서 지저분해 보였다.","fr":"maquillage qui fait des paquets","frpos":"loc.v.","frdef":"Maquillage qui s'accumule par endroits au lieu de s'étaler.","par":"뭉침","rel":"연어"},{"id":"BT0342","w":"화장품 냉장고","k":"h","rom":"hwajangpum naengjanggo","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"화장품(化粧品)+냉장고(冷藏庫)","cat":"skin","mean":"화장품을 차갑게 보관하는 데 쓰는 냉장고.","ex":"화장품 냉장고에 보관하여 시원하게 사용하면 진정 효과가 극대화됩니다.","fr":"réfrigérateur à cosmétiques","frpos":"loc.n.","frdef":"Petit réfrigérateur dédié à la conservation des cosmétiques."},{"id":"BT0343","w":"효모발효여과물","k":"h","rom":"hyomobalhyoyeogwamul","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"효모(酵母)+발효(醱酵)+여과물(濾過物)","cat":"skin","mean":"효모 발효 과정에서 얻은 것을 여과한 화장품 원료 명칭.","ex":"효모발효여과물 성분이 피부에 풍부한 영양을 공급합니다.","fr":"filtrat de ferment de levure","frpos":"loc.n.","frdef":"Ingrédient obtenu par fermentation puis filtration de levures (ex. galactomyces).","ing":"한국어: 효모를 발효시킨 뒤 거른 액. 갈락토미세스·사카로마이세스 발효여과물 등이 대표적이며 「발효 에센스」의 주원료.\nFrançais : Un filtrat de fermentation de levure est le liquide obtenu après fermentation puis filtration d'une culture de levures; ses constituants varient selon la souche et le procédé.","inci":"Galactomyces / Saccharomyces Ferment Filtrate"},{"id":"BT0346","w":"흔적 케어","k":"h","rom":"heunjeok keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"흔적(痕跡)+케어(care)","cat":"skin","mean":"피부에 남은 자국이나 색 변화 등을 관리한다는 표현.","ex":"트러블 후 남은 자국과 흔적 케어에 집중된 기초 제품입니다.","fr":"soin des marques","frpos":"loc.n.","frdef":"Soin visant à estomper les marques post-boutons."},{"id":"BT0350","w":"히알루론산","k":"h","rom":"hialluronsan","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"히알루론(hyaluron-)+산(酸)","cat":"skin","mean":"상품명에서 배합 성분으로 내세우는 원료 명칭.","ex":"100% 히알루론산 수분 크림이 피부에 강한 보습막을 씌워 줍니다.","fr":"acide hyaluronique","frpos":"n.m.","frdef":"Polysaccharide humectant très répandu.","ing":"한국어: 수분을 많이 붙잡는 다당류. 대표 보습 성분이며 화장품에는 주로 소듐하이알루로네이트 형태로 들어감.\nFrançais : L'acide hyaluronique est un polysaccharide capable de retenir l'eau, utilisé comme humectant; ses sels, dont le hyaluronate de sodium, sont fréquents en cosmétique.","inci":"Hyaluronic Acid / Sodium Hyaluronate"},{"id":"BT0351","w":"EGF","k":"h","rom":"EGF","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두문자어)","memo":"Epidermal Growth Factor 두문자어","cat":"skin","mean":"상단 상세 이미지에서 제품에 들어 있다고 내세운 성분명 약자.","ex":"EGF 성분이 든 앰플을 시술 받은 주에 집중해서 발랐다.","fr":"EGF (facteur de croissance épidermique)","frpos":"n.m.","frdef":"Protéine recombinante imitant le facteur de croissance épidermique.","ing":"한국어: 상피세포 성장인자(Epidermal Growth Factor)를 본뜬 재조합 단백질. 재생·탄력 문구와 함께 쓰임.\nFrançais : L'EGF (facteur de croissance épidermique) est une protéine de signalisation; certaines formules cosmétiques contiennent des versions produites par biotechnologie.","inci":"sh-Oligopeptide-1 (rh-Oligopeptide-1)"},{"id":"BT0352","w":"EWG 그린등급","k":"h","rom":"EWG geurindeunggeup","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"EWG(두문자어)+그린(green)+등급(等級)","cat":"skin","mean":"판매자가 성분 등급을 그린등급이라고 제시하며 성분 선택의 장점으로 내세운 표시.","ex":"전 성분이 EWG 그린등급이라는 문구를 보고 골랐다.","fr":"« note verte » EWG","frpos":"loc.n.","frdef":"Mention marketing coréenne indiquant que les ingrédients sont classés « vert » par l'ONG américaine EWG."},{"id":"BT0353","w":"LHA","k":"h","rom":"LHA","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두문자어)","memo":"Lipo-Hydroxy Acid 두문자어","cat":"skin","mean":"각질 관리에 사용하는 성분으로 광고에서 내세운 약자.","ex":"LHA 4세대 저자극 필링 성분.","fr":"LHA (acide lipohydroxylé)","frpos":"n.m.","frdef":"Dérivé de l'acide salicylique, exfoliant progressif.","ing":"한국어: 리포하이드록시산. 살리실산 유도체(카프릴로일살리실릭애씨드)로, 천천히 작용하는 각질 관리 성분.\nFrançais : Le LHA, ou acide lipohydroxy, désigne généralement l'acide capryloyl salicylique, dérivé lipophile de l'acide salicylique utilisé pour l'exfoliation.","inci":"Capryloyl Salicylic Acid","par":"아하","rel":"관련어(참고)"},{"id":"BT0354","w":"PDRN","k":"h","rom":"PDRN","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두문자어)","memo":"polydeoxyribonucleotide 두문자어","cat":"skin","mean":"이 후기에서 스킨케어 성분 이름으로 언급한 표현.","ex":"PDRN과 펩타이드 성분을 활용한 스킨케어 제품.","fr":"PDRN (polydésoxyribonucléotide)","frpos":"n.m.","frdef":"Fragments d'ADN (souvent de saumon), devenus ingrédient phare après les injections « saumon ».","ing":"한국어: 폴리데옥시리보뉴클레오타이드. 연어 등에서 얻은 DNA 조각으로, 피부과 시술(연어 주사)에서 알려진 뒤 화장품 원료로 확산됨.\nFrançais : Le PDRN est un mélange de fragments de poly(désoxyribonucléotides), souvent issus d'ADN de poisson; il est utilisé comme ingrédient dans certains soins.","inci":"Sodium DNA"},{"id":"BT0356","w":"1차 세안","k":"h","rom":"1cha sean","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"1차(一次)+세안(洗顔)","cat":"clean","mean":"색조 메이크업이나 자외선 차단제를 녹여 제거하기 위해 클렌징 오일/밤/워터 등을 사용하는 첫 단계.","ex":"1차 세안은 클렌징 오일로 선크림과 화장을 녹여 낸다.","fr":"premier nettoyage (à l'huile)","frpos":"loc.n.","frdef":"Première étape du double nettoyage: dissoudre maquillage et solaire avec huile ou baume.","par":"이중 세안","rel":"하위어(참고)"},{"id":"BT0357","w":"2차 세안","k":"h","rom":"2cha sean","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"2차(二次)+세안(洗顔)","cat":"clean","mean":"1차 세안 후 잔여 오일과 수용성 노폐물을 씻어내기 위해 클렌징 폼이나 비누를 사용하는 두 번째 단계.","ex":"오일로 지운 뒤 2차 세안은 약산성 폼으로 가볍게 한다.","fr":"second nettoyage (à la mousse)","frpos":"loc.n.","frdef":"Seconde étape du double nettoyage avec un nettoyant moussant.","par":"이중 세안","rel":"하위어(참고)"},{"id":"BT0359","w":"각질 불리기","k":"h","rom":"gakjil bulligi","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"각질(角質)+불리다(불다+-리-)+-기(명사형)","cat":"clean","mean":"수분과 온기를 더해 피부 표면의 각질을 물러지게 부풀리는 행위.","ex":"따뜻한 수건을 올려 각질 불리기를 한 다음에 필링을 한다.","fr":"ramollir les peaux mortes","frpos":"loc.n.","frdef":"Gonfler les squames avec de l'eau tiède avant de les éliminer."},{"id":"BT0360","w":"각질 수화","k":"h","rom":"gakjil suhwa","pos":"명사","unit":"구","eo":"한자어","form":"구(句)","memo":"각질(角質)+수화(水和)","cat":"clean","mean":"수분을 침투시켜 딱딱해진 각질 층을 촉촉하고 부드럽게 만드는 작용.","ex":"토너를 듬뿍 적신 솜을 올려 두면 각질 수화에 도움이 된다.","fr":"hydratation de la couche cornée","frpos":"loc.n.","frdef":"Apport d'eau qui assouplit la couche cornée."},{"id":"BT0365","w":"거품 쿠션감","k":"h","rom":"geopum kusyeongam","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"거품+쿠션감(cushion+감(感))","cat":"clean","mean":"거품이 탄력 있게 받쳐주어 마찰을 줄여주는 쿠션 효과.","ex":"거품 쿠션감이 좋아서 손이 피부에 거의 닿지 않는다.","fr":"effet coussin de la mousse","frpos":"loc.n.","frdef":"Mousse dense qui amortit le contact entre les mains et la peau."},{"id":"BT0366","w":"거품 핸들링","k":"h","rom":"geopum haendeulling","pos":"명사","unit":"구","eo":"혼종어","form":"구(句)","memo":"거품+핸들링(handling)","cat":"clean","mean":"손바닥의 거품을 이용해 피부 마찰 없이 부드럽게 문지르는 세안 동작.","ex":"거품 핸들링만으로 씻어야 볼이 붉어지지 않는다.","fr":"manipulation de la mousse","fr
