éens consultent beaucoup les listes d'ingrédients sur des applications dédiées.","mean":"제품에 들어간 모든 성분을 적은 목록.","ex":"제품 사용 전 전성분 목록을 반드시 확인한 후 사용해 주세요.","exfr":"Vérifiez impérativement la liste d'ingrédients (liste INCI) avant d'utiliser le produit.","fr":"liste INCI / liste d'ingrédients","frpos":"n.f.","frdef":"Liste obligatoire de tous les ingrédients d'un cosmétique."},{"id":"BT0253","k":"h","cat":"skin","w":"제형","rom":"jehyeong","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"제+형","memofr":"Composé : 제 (préparation) + 형 (forme)","note":"Terme technique devenu courant dans les avis ; donne 꿀 제형, 콧물 제형, etc.","mean":"제품의 묽기나 질감 등 물리적인 형태.","ex":"물처럼 흐르는 묽은 제형이라 피부에 부드럽게 흡수됩니다.","exfr":"Sa texture fluide, qui coule comme de l'eau, pénètre la peau en douceur.","fr":"texture, forme galénique","frpos":"n.f.","frdef":"Forme physique d'un produit (crème, gel, fluide…)."},{"id":"BT0255","k":"h","cat":"skin","w":"좁쌀 여드름","rom":"jopssal yeodeureum","pos":"명사","unit":"구","eo":"고유어","form":"구","memo":"좁쌀+여드름(고유어)","memofr":"Locution : 좁쌀 (grain de millet) + 여드름 (acné)","note":"Expression quotidienne ; les dermatologues parlent de comédons fermés.","mean":"좁쌀처럼 작게 오돌토돌 올라오는 여드름을 가리키는 일상 표현.","ex":"좁쌀 여드름을 케어하는 데 도움을 받아 5~6통 정도 꾸준히 사용했습니다.","exfr":"Il m'a aidée à traiter mes micro-kystes ; j'en ai utilisé cinq ou six flacons.","fr":"micro-kystes (petits boutons fermés)","frpos":"n.m.pl.","frdef":"Petites bosses ou imperfections cutanées évoquant des grains de millet, souvent des comédons fermés."},{"id":"BT0257","k":"h","cat":"skin","w":"주름 개선","rom":"jureum gaeseon","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"주름(고유어)+개선","memofr":"Locution : 주름 (rides) + 개선 (amélioration)","note":"Allégation réglementée des cosmétiques fonctionnels coréens.","mean":"주름이 완화되어 덜 두드러지게 만드는 기능 또는 그 효과.","ex":"제품을 꾸준히 써봐야 주름 개선 효과를 명확히 체감할 수 있을 것 같습니다.","exfr":"Il faut sans doute l'utiliser régulièrement pour ressentir nettement l'atténuation des rides.","fr":"atténuation des rides (fonction anti-rides)","frpos":"n.f.","frdef":"Catégorie fonctionnelle coréenne: réduction de l'apparence des rides.","par":"기능성 화장품","rel":"관련어(참고)"},{"id":"BT0258","k":"h","cat":"skin","w":"지복합성","rom":"jibokhapseong","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"지+복합성","memofr":"Composé : 지 (gras) + 복합성 (mixte)","note":"Type de peau distingué finement par les marques coréennes.","mean":"지성 성향과 부위별 복합적인 특성을 함께 가진 피부.","ex":"지복합성 피부 타입을 가진 분들에게 베스트로 추천하는 기초 제품입니다.","exfr":"Le soin de base que je recommande avant tout aux peaux mixtes à grasses.","fr":"peau mixte à grasse","frpos":"n.f.","frdef":"Peau mixte avec dominante grasse.","par":"악지성","rel":"관련어(참고)"},{"id":"BT0260","k":"h","cat":"skin","w":"집중 케어","rom":"jipjung keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"집중+케어(care)","memofr":"Locution : 집중 (concentration) + 케어 (angl. care)","note":"Formule marketing générique.","mean":"피부가 건조하고 푸석할 때 관리에 더 신경을 쓰는 것을 뜻함.","ex":"피부를 쫀쫀하게 집중 케어하고 싶을 때 사용하기 좋습니다.","exfr":"Idéal quand on veut un soin intensif pour une peau plus ferme et rebondie.","fr":"soin intensif","frpos":"n.m.","frdef":"Soin renforcé lors d'une période où la peau en a besoin."},{"id":"BT0265","k":"h","cat":"skin","w":"처박템","rom":"cheobaktem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"처박다(어간)+-템","memofr":"Composé : 처박다 (fourrer dans un coin) + -템 (de l'angl. item)","note":"Argot des avis, au ton humoristique et négatif.","mean":"사용에 실망해 더 쓰지 않고 방치한 제품을 뜻하는 비격식 표현.","ex":"사용 후 트러블이 나는 바람에 결국 처박템이 되었습니다.","exfr":"Il m'a donné des boutons : c'est devenu un produit abandonné au fond du tiroir.","fr":"produit abandonné au fond du tiroir","frpos":"n.m.","frdef":"Produit décevant qu'on n'utilise plus.","par":"인생템","rel":"관련어(참고)"},{"id":"BT0268","k":"h","cat":"skin","w":"코트","rom":"koteu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"coat 차용, 의존명사적 단위로 쓰임","memofr":"Emprunt à l'anglais coat, employé comme unité","note":"S'emploie avec un nombre : 1코트, 2코트 (« une couche, deux couches »), surtout pour le vernis.","mean":"제품을 피부 위에 바르는 한 겹 또는 한 차례를 세는 영어 표현.","ex":"유분이 과잉일 때는 1코트, 수분이 부족할 때는 2코트로 조절해 바르세요.","exfr":"Une couche quand la peau est trop grasse, deux couches quand elle manque d'eau.","fr":"couche","frpos":"n.f.","frdef":"Couche de produit appliquée (une couche, deux couches)."},{"id":"BT0271","k":"h","cat":"skin","w":"콧물 제형","rom":"konmul jehyeong","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"콧물(합성어)+제형","memofr":"Locution : 콧물 (morve) + 제형 (texture)","note":"Comparaison familière, voire crue ; on la trouve surtout dans les avis.","mean":"콧물을 떠올리게 하는 점성 있고 흐르는 질감을 비유한 소비자 표현.","ex":"기존의 콧물 제형 토너보다 끈적임이 적고 보습력이 좋습니다.","exfr":"Il colle moins et hydrate mieux que les lotions à texture filante classiques.","fr":"texture filante","frpos":"n.f.","frdef":"Texture visqueuse et filante, comparée familièrement à de la morve.","par":"제형","rel":"하위어(참고)"},{"id":"BT0272","k":"h","cat":"skin","w":"쿨링","rom":"kulling","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"cooling 차용","memofr":"Emprunt à l'anglais cooling","note":"Fréquent pour les solaires, gels et soins du cuir chevelu en été.","mean":"사용 뒤 피부가 시원해진다고 느끼는 효과.","ex":"피부에 바르는 즉시 쿨링 효과가 느껴져 피부 온도를 낮춰 줍니다.","exfr":"Dès l'application, on ressent un effet rafraîchissant qui fait baisser la température de la peau.","fr":"effet rafraîchissant","frpos":"n.m.","frdef":"Sensation de fraîcheur après l'application."},{"id":"BT0273","k":"h","cat":"skin","w":"크리미 텍스처","rom":"keurimi tekseucheo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"creamy+texture","memofr":"Locution : 크리미 (angl. creamy) + 텍스처 (angl. texture)","note":"Calque de l'anglais ; en coréen courant, on dit aussi 크림 제형.","mean":"크림처럼 부드럽고 매끄럽게 퍼지는 질감을 표현함.","ex":"부드러운 크리미 텍스처가 피부를 부드럽게 감싸 줍니다.","exfr":"Sa texture crémeuse et douce enveloppe délicatement la peau.","fr":"texture crémeuse","frpos":"n.f.","frdef":"Texture douce et onctueuse comme une crème."},{"id":"BT0274","k":"h","cat":"skin","w":"타이트닝","rom":"taiteuning","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"tightening 차용","memofr":"Emprunt à l'anglais tightening","note":"Formule marketing ; l'effet est le plus souvent temporaire.","mean":"피부나 모공이 조여져 탄탄하게 느껴지는 효과를 표현함.","ex":"모공 타이트닝과 함께 피부 결 정돈을 돕는 에센스입니다.","exfr":"Une essence à effet raffermissant sur les pores, qui lisse aussi le grain de peau.","fr":"effet raffermissant","frpos":"n.m.","frdef":"Effet de resserrement et de fermeté de la peau ou des pores."},{"id":"BT0278","k":"h","cat":"skin","w":"토닝 케어","rom":"toning keeo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"toning+care(한국식 조어)","memofr":"Locution : 토닝 (angl. toning) + 케어 (angl. care), formation coréenne","note":"En Corée, « toning » évoque l'uniformité du teint, et non l'astringence comme en anglais.","mean":"피부톤이나 잡티를 고르게 관리한다는 광고 표현.","ex":"칙칙한 피부 톤을 화사하게 가꿔주는 강력한 토닝 케어 제품입니다.","exfr":"Un soin unifiant puissant qui illumine le teint terne.","fr":"soin unifiant","frpos":"n.m.","frdef":"Soin visant à unifier le teint et estomper les taches."},{"id":"BT0279","k":"h","cat":"skin","w":"토출구","rom":"tochulgu","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"토출+구","memofr":"Composé : 토출 (expulsion) + 구 (ouverture)","note":"Terme technique d'emballage, présent dans les fiches produit et les avis (« embout bouché »).","mean":"용기에서 내용물이 나오는 입구 부분.","ex":"뾰족한 토출구에 씌워진 캡을 열어 적당량을 조절해 사용하세요.","exfr":"Ouvrez le capuchon de l'orifice de distribution pointu pour doser la quantité souhaitée.","fr":"orifice de distribution","frpos":"n.m.","frdef":"Ouverture par laquelle sort le produit du flacon ou du tube."},{"id":"BT0280","k":"h","cat":"skin","w":"토코페롤","rom":"tokoperol","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"tocopherol 차용","memofr":"Emprunt à l'anglais tocopherol","note":"Nom INCI : Tocopherol (vitamine E) ; sert aussi d'antioxydant de la formule.","mean":"비타민 E의 일종으로 항산화 작용을 돕는 화장품 배합 성분.","ex":"항산화 작용을 돕는 토코페롤 성분이 피부 건강을 지켜 줍니다.","exfr":"Le tocophérol, antioxydant, préserve la santé de la peau.","fr":"tocophérol","frpos":"n.m.","frdef":"Vitamine E, antioxydant.","ing":"한국어: 비타민 E. 항산화 성분으로, 오일 성분의 산화를 막는 용도로도 배합.\nFrançais : Le tocophérol est une forme de vitamine E utilisée comme antioxydant pour protéger certains constituants de la formule contre l'oxydation.","inci":"Tocopherol"},{"id":"BT0282","k":"h","cat":"skin","w":"튜브형","rom":"tyubeuhyeong","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"튜브(tube)+-형","memofr":"Dérivé : 튜브 (angl. tube) + -형 (suffixe « type, forme »)","note":"Le suffixe -형 sert à nommer les formats d'emballage : 펌프형, 스포이드형…","mean":"내용물이 든 유연한 용기를 눌러 짜서 사용하는 포장 형태.","ex":"튜브형 양식으로 제작되어 원하는 양만큼 위생적으로 짜서 쓰기 편합니다.","exfr":"Conditionné en tube, il se presse facilement et de façon hygiénique, à la quantité voulue.","fr":"en tube","frpos":"loc.adj.","frdef":"Conditionnement en tube souple à presser.","par":"펌프형","rel":"관련어(참고)"},{"id":"BT0283","k":"h","cat":"skin","w":"트라넥삼산","rom":"teuraneksamsan","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"트라넥삼(tranexam-)+산","memofr":"Composé : 트라넥삼 (angl. tranexam-) + 산 (acide)","note":"Actif éclaircissant très prisé en Asie contre les taches pigmentaires.","mean":"기미와 색소 침착 완화에 도움을 주는 미백 기능성 원료.","ex":"트라넥삼산 성분이 함유되어 기미와 잡티 케어에 도움을 줍니다.","exfr":"Contient de l'acide tranexamique, qui aide à traiter le mélasma et les taches.","fr":"acide tranexamique","frpos":"n.m.","frdef":"Actif utilisé contre les taches et le mélasma.","ing":"한국어: 아미노산 유도체(TXA). 원래 지혈제 성분이며, 화장품에서는 잡티·기미 관리 문구와 함께 쓰임.\nFrançais : L'acide tranexamique est un dérivé synthétique d'acide aminé, employé dans certains soins visant à atténuer l'apparence des taches pigmentaires.","inci":"Tranexamic Acid"},{"id":"BT0284","k":"h","cat":"skin","w":"트러블","rom":"teureobeul","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"trouble 차용(의미 전이: 피부 문제)","memofr":"Emprunt à l'anglais trouble, avec glissement de sens","note":"Faux ami : en coréen, il désigne les boutons et les problèmes de peau, non un « trouble » au sens général.","mean":"뾰루지나 여드름 등 피부에 생기는 문제를 넓게 지칭한다.","ex":"복합성 및 트러블 피부 타입에도 자극 없이 편안하게 작동합니다.","exfr":"Il agit en douceur, sans irritation, même sur les peaux mixtes et à imperfections.","fr":"imperfections, boutons","frpos":"n.f.pl. / n.m.pl.","frdef":"Terme coréen générique pour boutons, rougeurs et réactions de la peau.","faux":1},{"id":"BT0286","k":"h","cat":"skin","w":"특허 성분","rom":"teukheo seongbun","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"특허+성분","memofr":"Locution : 특허 (brevet) + 성분 (ingrédient)","note":"Argument de vente fréquent ; le brevet porte souvent sur un procédé, non sur l'efficacité.","mean":"특허를 등록·출원한 독자 기술로 개발한 화장품 원료.","ex":"동아제약 특허 성분이 들어가 피부 장벽을 튼튼하게 강화해 줍니다.","exfr":"Un ingrédient breveté par Dong-A Pharm renforce la barrière cutanée.","fr":"ingrédient breveté","frpos":"n.m.","frdef":"Ingrédient présenté comme protégé par un brevet."},{"id":"BT0287","k":"h","cat":"skin","w":"티트리잎오일","rom":"titeuriipoil","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"티트리+잎(고유어)+오일(oil)","memofr":"Composé : 티트리 (angl. tea tree) + 잎 (feuille) + 오일 (angl. oil)","note":"Nom INCI : Melaleuca Alternifolia Leaf Oil ; actif classique des peaux à imperfections.","mean":"티트리 잎에서 얻는 오일을 가리키는 배합 성분명.","ex":"티트리잎오일 성분이 들어있어 예민해진 피부를 빠르게 진정시킵니다.","exfr":"L'huile de feuille d'arbre à thé apaise rapidement la peau sensibilisée.","fr":"huile de feuille d'arbre à thé","frpos":"n.f.","frdef":"Huile essentielle purifiante de tea tree.","ing":"한국어: 티트리(멜라루카) 잎에서 얻은 에센셜 오일. 트러블 관리 제품에 쓰이며 원액은 자극이 될 수 있음.\nFrançais : L'huile essentielle de feuilles de Melaleuca alternifolia (arbre à thé) est utilisée dans les soins pour peaux à imperfections; elle peut être irritante.","inci":"Melaleuca Alternifolia (Tea Tree) Leaf Oil"},{"id":"BT0288","k":"h","cat":"skin","w":"파하","rom":"paha","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두문자어)","memo":"P·H·A 음절 읽기","memofr":"Sigle : lecture syllabique coréenne de P.H.A.","note":"Même procédé que 아하 (AHA) et 바하 (BHA).","mean":"입자가 커서 자극이 적은 차세대 각질 관리 성분군(PHA).","ex":"아하, 바하, 파하 성분이 불필요한 각질을 순하게 정돈해 줍니다.","exfr":"Les AHA, BHA et PHA éliminent en douceur les peaux mortes superflues.","fr":"PHA (acide polyhydroxylé)","frpos":"n.m.","frdef":"Lecture coréenne de « PHA »: acides exfoliants doux (gluconolactone…).","ing":"한국어: PHA(폴리하이드록시산)의 한국식 읽기. 글루코노락톤·락토바이오닉애씨드 등 분자가 커서 AHA보다 순한 각질 관리 산으로 소개됨.\nFrançais : Les PHA sont des polyhydroxyacides, notamment la gluconolactone et l'acide lactobionique, employés pour une exfoliation généralement douce.","inci":"Gluconolactone, Lactobionic Acid","par":"아하","rel":"관련어(참고)"},{"id":"BT0289","k":"h","cat":"skin","w":"판테놀","rom":"pantenol","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"panthenol 차용","memofr":"Emprunt à l'anglais panthenol","note":"Nom INCI : Panthenol ; très présent dans les crèmes apaisantes.","mean":"프로비타민 B5로 불리며 보습과 피부 장벽 강화를 돕는 성분.","ex":"판테놀 성분이 피부 수분 장벽을 견고하게 지켜 줍니다.","exfr":"Le panthénol protège solidement la barrière hydrique de la peau.","fr":"panthénol","frpos":"n.m.","frdef":"Provitamine B5 hydratante et apaisante.","ing":"한국어: 프로비타민 B5. 피부·모발에서 판토텐산으로 바뀌며 보습·진정 목적으로 배합.\nFrançais : Le panthénol est une provitamine B5 utilisée comme humectant et agent de soin pour la peau et les cheveux.","inci":"Panthenol"},{"id":"BT0290","k":"h","cat":"skin","w":"판토텐산","rom":"pantotensan","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"판토텐(pantothen-)+산","memofr":"Composé : 판토텐 (angl. pantothen-) + 산 (acide)","note":"Nom chimique de la vitamine B5 ; à rapprocher de 판테놀.","mean":"비타민 B5에 해당하는 수용성 비타민 성분.","ex":"판토텐산 액티브 성분이 유수분 밸런스를 조절해 줍니다.","exfr":"L'acide pantothénique, actif de la formule, régule l'équilibre eau-sébum.","fr":"acide pantothénique","frpos":"n.m.","frdef":"Vitamine B5.","ing":"한국어: 비타민 B5. 화장품에는 주로 판테놀이나 칼슘판토테네이트 형태로 들어감.\nFrançais : L'acide pantothénique est la vitamine B5; dans les cosmétiques, on utilise aussi ses dérivés, comme le panthénol et le pantothénate de calcium.","inci":"Calcium Pantothenate, Pantothenic Acid","par":"판테놀","rel":"관련어(참고)"},{"id":"BT0292","k":"h","cat":"skin","w":"펌프형","rom":"peompeuhyeong","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"펌프(pump)+-형","memofr":"Dérivé : 펌프 (angl. pump) + -형 (suffixe « type, forme »)","note":"Format jugé plus hygiénique que le pot dans les avis.","mean":"눌러서 내용물을 덜어내는 펌프가 달린 용기 형태.","ex":"펌프형 용기라 필요한 만큼 위생적으로 눌러 쓰기 좋습니다.","exfr":"Le flacon-pompe permet de doser la quantité nécessaire de façon hygiénique.","fr":"flacon-pompe","frpos":"n.m.","frdef":"Conditionnement muni d'une pompe ; en Corée, la « pompe » sert aussi d'unité de dose (une demi-pression, une pression)."},{"id":"BT0293","k":"h","cat":"skin","w":"펌핑하다","rom":"peompinghada","pos":"동사","unit":"단어","eo":"혼종어","form":"파생어","memo":"펌핑(pumping)+-하다","memofr":"Dérivé : 펌핑 (angl. pumping) + -하다 (suffixe verbal)","note":"Sert d'unité de dosage : 1~2번 펌핑 (« une ou deux pressions »).","mean":"용기의 펌프를 눌러 내용물을 꺼내다.","ex":"내용물을 1~2회 적당량 펌핑하여 얼굴 전체에 발라줍니다.","exfr":"Actionnez la pompe une ou deux fois et appliquez sur tout le visage.","fr":"actionner la pompe","frpos":"loc.v.","frdef":"Appuyer sur la pompe pour obtenir une dose de produit.","par":"펌프형","rel":"관련어(참고)"},{"id":"BT0294","k":"h","cat":"skin","w":"펩타이드","rom":"peptaideu","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"peptide 차용","memofr":"Emprunt à l'anglais peptide","note":"Actif anti-âge très mis en avant ; voir aussi 카퍼 펩타이드.","mean":"아미노산이 결합된 단백질 조각으로 피부 탄력·주름 개선을 돕는 성분.","ex":"6종 펩타이드 성분이 피부 탄력 강화에 도움을 줍니다.","exfr":"Six peptides aident à renforcer la fermeté de la peau.","fr":"peptide","frpos":"n.m.","frdef":"Courte chaîne d'acides aminés, actif anti-âge.","ing":"한국어: 아미노산 몇 개가 이어진 짧은 사슬. 화장품에서는 팔미토일펜타펩타이드 등 탄력·주름 관리 문구의 성분군을 가리킴.\nFrançais : Les peptides sont de courtes chaînes d'acides aminés; différentes séquences sont utilisées dans les soins, notamment pour l'apparence de la fermeté cutanée.","inci":"Palmitoyl Pentapeptide-4, Acetyl Hexapeptide-8"},{"id":"BT0295","k":"h","cat":"skin","w":"포뮬러","rom":"pomyulleo","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"formula 차용","memofr":"Emprunt à l'anglais formula","note":"Mot de registre publicitaire ; en coréen courant, on dit plutôt 성분 ou 처방.","mean":"화장품에 쓰인 성분 조합이나 처방을 가리키는 홍보 표현.","ex":"이온 히알루론산을 함유한 포뮬러가 깊은 수분감을 전달합니다.","exfr":"Sa formule à l'acide hyaluronique ionisé apporte une hydratation en profondeur.","fr":"formule","frpos":"n.f.","frdef":"Composition d'un produit (terme marketing)."},{"id":"BT0299","k":"h","cat":"skin","w":"플럼핑","rom":"peulleomping","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"plumping 차용","memofr":"Emprunt à l'anglais plumping","note":"Fréquent pour les gloss et les sérums « repulpants ».","mean":"피부가 차올라 도톰하고 탄력 있어 보이는 인상을 내세우는 표현.","ex":"피부 속부터 탄력이 차오르는 플럼핑 효과를 선사합니다.","exfr":"Il offre un effet repulpant : la peau regagne en fermeté de l'intérieur.","fr":"effet repulpant","frpos":"n.m.","frdef":"Effet qui rend la peau ou les lèvres plus pleines."},{"id":"BT0300","k":"h","cat":"skin","w":"피부 기초 체력","rom":"pibu gicho cheryeok","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"피부+기초+체력","memofr":"Locution : 피부 (peau) + 기초 (base) + 체력 (endurance physique)","note":"Métaphore sportive propre au discours coréen sur le soin.","mean":"피부의 전반적인 상태와 관리 기반을 신체의 체력에 빗대어 표현함.","ex":"피부 기초 체력을 끌어올려 건강한 피부 상태로 가꿔 줍니다.","exfr":"Il renforce la « condition physique » de la peau pour la maintenir en bonne santé.","fr":"« condition physique » de la peau","frpos":"n.f.","frdef":"Métaphore: résistance et santé de base de la peau."},{"id":"BT0302","k":"h","cat":"skin","w":"피부 민감도","rom":"pibu mingamdo","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"피부+민감도","memofr":"Locution : 피부 (peau) + 민감도 (degré de sensibilité)","note":"Terme plutôt technique, utilisé dans les tests et les questionnaires de peau.","mean":"피부가 자극에 얼마나 쉽게 반응하는지 나타내는 정도.","ex":"피부 민감도를 낮춰주는 순한 성분으로 구성되어 있습니다.","exfr":"Sa formule est composée d'ingrédients doux qui réduisent la sensibilité cutanée.","fr":"sensibilité cutanée","frpos":"n.f.","frdef":"Degré de réactivité de la peau aux agressions."},{"id":"BT0303","k":"h","cat":"skin","w":"피부 생기","rom":"pibu saenggi","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"피부+생기","memofr":"Locution : 피부 (peau) + 생기 (vitalité)","note":"S'emploie surtout dans les tournures « 생기 있는 피부 » ou « 생기를 되찾다 ».","mean":"피부가 지쳐 보이지 않고 건강하고 활기 있어 보이는 인상을 뜻한다.","ex":"피부에 자연스러운 생기와 광채를 더하고 싶은 분들께 추천합니다.","exfr":"Recommandé à celles et ceux qui veulent apporter vitalité naturelle et éclat au teint.","fr":"vitalité du teint","frpos":"n.f.","frdef":"Aspect frais, reposé et vivant de la peau."},{"id":"BT0305","k":"h","cat":"skin","w":"피부 입체감","rom":"pibu ipchegam","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"피부+입체감","memofr":"Locution : 피부 (peau) + 입체감 (relief, effet 3D)","note":"Lié au maquillage contouring et aux enlumineurs.","mean":"얼굴의 굴곡과 윤곽이 입체적으로 보이는 인상을 표현한 광고 문구.","ex":"시간이 지나면서 둔해지는 피부 입체감을 또렷하게 살려 줍니다.","exfr":"Il redessine nettement le relief du visage, qui s'estompe avec le temps.","fr":"relief du visage","frpos":"n.m.","frdef":"Effet de volume et de contours du visage."},{"id":"BT0306","k":"h","cat":"skin","w":"피부 저자극 테스트","rom":"pibu jeojageuk teseuteu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"피부+저자극+테스트(test)","memofr":"Locution : 피부 (peau) + 저자극 (faible irritation) + 테스트 (angl. test)","note":"Mention d'emballage courante ; elle ne garantit pas l'absence de réaction.","mean":"피부에 자극을 유발하는 정도가 낮음을 확인하는 임상 시험.","ex":"피부 저자극 테스트를 완료하여 민감성 피부도 안심하고 사용할 수 있습니다.","exfr":"Il indique avoir passé un test de tolérance cutanée tenant compte des peaux sensibles ; il peut donc être utilisé par celles-ci.","fr":"test de tolérance cutanée","frpos":"n.m.","frdef":"Test vérifiant le faible potentiel irritant d'un produit."},{"id":"BT0307","k":"h","cat":"skin","w":"피부 적응","rom":"pibu jeogeung","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"피부+적응","memofr":"Locution : 피부 (peau) + 적응 (adaptation)","note":"Surtout employé à propos du rétinol et des acides.","mean":"새로운 활성 성분을 쓰며 피부 반응과 사용 빈도를 살피는 과정을 뜻한다.","ex":"레티놀 제품은 사용법과 피부 적응 과정을 숙지한 뒤 사용하는 것이 좋습니다.","exfr":"Pour les produits au rétinol, mieux vaut connaître le mode d'emploi et la phase d'adaptation de la peau avant de commencer.","fr":"adaptation de la peau (rétinisation)","frpos":"n.f.","frdef":"Période où la peau s'habitue à un actif fort comme le rétinol.","par":"레티놀","rel":"관련어(참고)"},{"id":"BT0311","k":"h","cat":"skin","w":"피부가 뒤집어지다","rom":"pibuga dwijibeojida","pos":"동사","unit":"구","eo":"혼종어","form":"구","memo":"피부가+뒤집어지다(비유)","memofr":"Locution : 피부가 (la peau) + 뒤집어지다 (se retourner)","note":"Expression imagée très fréquente dans les avis négatifs.","mean":"트러블·붉어짐 등 피부 상태가 갑자기 크게 나빠지다.","ex":"사용 후 피부가 뒤집어졌다는 평이 있어 다소 걱정하며 사용했습니다.","exfr":"Certains avis disaient que leur peau « se retourne » après usage, alors je l'ai utilisé avec un peu d'appréhension.","fr":"la peau « se retourne » (crise cutanée)","frpos":"expr.","frdef":"Dégradation brutale de la peau: boutons, rougeurs, irritations."},{"id":"BT0317","k":"h","cat":"skin","w":"피부결을 정돈하다","rom":"pibugyeoreul jeongdonhada","pos":"동사","unit":"구","eo":"혼종어","form":"구","memo":"피부결을+정돈하다","memofr":"Locution verbale : 피부결을 (le grain de peau) + 정돈하다 (mettre en ordre)","note":"Formule typique des toners et des exfoliants doux.","mean":"거칠어진 피부 표면을 매끄럽고 고르게 정리하다.","ex":"화장솜에 토너를 묻혀 안쪽에서 바깥쪽으로 피부결을 정돈해 줍니다.","exfr":"Imbibez un coton de lotion tonique et affinez le grain de peau de l'intérieur vers l'extérieur.","fr":"affiner le grain de peau","frpos":"loc.v.","frdef":"Lisser et uniformiser la surface de la peau."},{"id":"BT0321","k":"h","cat":"skin","w":"피부자극도","rom":"pibujageukdo","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"피부+자극도","memofr":"Composé : 피부 (peau) + 자극도 (degré d'irritation)","note":"Terme d'essai clinique ; souvent accompagné d'un indice chiffré.","mean":"피부에 주는 자극을 정도나 수치로 표현하는 시험 관련 용어.","ex":"피부 자극도 0.00 판정을 받아 안심하고 사용할 수 있는 제품입니다.","exfr":"Avec un indice d'irritation cutanée de 0,00, c'est un produit qu'on peut utiliser en toute confiance.","fr":"indice d'irritation cutanée","frpos":"n.m.","frdef":"Mesure du potentiel irritant d'un produit lors d'un test."},{"id":"BT0322","k":"h","cat":"skin","w":"피부장벽","rom":"pibujangbyeok","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"피부+장벽","memofr":"Composé : 피부 (peau) + 장벽 (barrière)","note":"Notion centrale du marketing coréen actuel ; abrégée en 장벽.","mean":"피부를 보호하고 수분을 유지하는 바깥쪽 방어 기능을 지칭한다.","ex":"잦은 시술이나 외부 자극으로 손상된 피부 장벽을 회복시켜 줍니다.","exfr":"Il répare la barrière cutanée abîmée par des actes esthétiques fréquents ou des agressions extérieures.","fr":"barrière cutanée","frpos":"n.f.","frdef":"Fonction protectrice de la couche cornée qui retient l'eau."},{"id":"BT0323","k":"h","cat":"skin","w":"피부장벽 회복 기능성","rom":"pibujangbyeok hoebok gineungseong","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"피부장벽+회복+기능성","memofr":"Locution : 피부장벽 (barrière cutanée) + 회복 (rétablissement) + 기능성 (fonction réglementée)","note":"Allégation officielle des cosmétiques fonctionnels coréens.","mean":"손상된 피부 장벽의 회복을 돕는 기능성 화장품 효능.","ex":"식약처로부터 피부 장벽 회복 기능성 심사를 마친 기초 크림입니다.","exfr":"Une crème de base dont l'allégation « réparation de la barrière cutanée » a été évaluée par le ministère coréen de la Sécurité alimentaire et pharmaceutique.","fr":"allégation « réparation de la barrière »","frpos":"n.f.","frdef":"Fonction déclarée de restauration de la barrière cutanée (catégorie coréenne).","par":"기능성 화장품","rel":"관련어(참고)"},{"id":"BT0326","k":"h","cat":"skin","w":"피지 분비량","rom":"piji bunbiryang","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"피지+분비량","memofr":"Locution : 피지 (sébum) + 분비량 (quantité sécrétée)","note":"Terme de mesure, utilisé dans les tests en laboratoire.","mean":"피부 피지선에서 분비되는 피지의 양.","ex":"꾸준히 사용하니 피지 분비량 자체가 줄어들어 번들거림이 개선되었습니다.","exfr":"À l'usage, la quantité de sébum sécrétée a elle-même diminué et la brillance s'est atténuée.","fr":"quantité de sébum sécrétée","frpos":"n.f.","frdef":"Volume de sébum produit par la peau."},{"id":"BT0335","k":"h","cat":"skin","w":"호호바씨오일","rom":"hohobassioil","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"호호바+씨(고유어)+오일","memofr":"Composé : 호호바 (jojoba) + 씨 (graine) + 오일 (angl. oil)","note":"Nom INCI : Simmondsia Chinensis Seed Oil.","mean":"호호바 씨에서 얻는 오일을 가리키는 배합 성분명.","ex":"호호바씨오일이 피부에 보습막을 형성하여 수분 손실을 막아 줍니다.","exfr":"L'huile de graines de jojoba forme un film hydratant qui limite la perte en eau.","fr":"huile de graines de jojoba","frpos":"n.f.","frdef":"Cire liquide proche du sébum, émolliente.","ing":"한국어: 호호바 씨앗에서 얻은 액상 왁스. 피지와 비슷한 조성으로 소개되는 유연 성분.\nFrançais : L'huile de graines de jojoba est principalement constituée d'esters cireux liquides et utilisée comme émollient dans les produits de soin.","inci":"Simmondsia Chinensis (Jojoba) Seed Oil"},{"id":"BT0339","k":"h","cat":"skin","w":"화장 밀착력","rom":"hwajang milchangnyeok","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"화장+밀착력","memofr":"Locution : 화장 (maquillage) + 밀착력 (adhérence)","note":"Notion proche de 화잘먹 ; argument des primers.","mean":"화장품이 들뜨지 않고 피부에 잘 밀착되어 유지되는 정도.","ex":"며칠 사용해 보니 베이스 화장 밀착력이 확실히 좋아졌습니다.","exfr":"Après quelques jours d'utilisation, l'adhérence du maquillage de base s'est nettement améliorée.","fr":"adhérence du maquillage","frpos":"n.f.","frdef":"Capacité du maquillage à tenir fermement sur la peau.","par":"밀착력","rel":"관련어(참고)"},{"id":"BT0341","k":"s","cat":"skin","w":"화장이 뭉치다","rom":"hwajangi mungchida","pos":"동사","unit":"구","eo":"혼종어","form":"구","memo":"화장이+뭉치다","memofr":"Locution : 화장이 (le maquillage) + 뭉치다 (s'agglomérer)","note":"Défaut fréquent sur les zones sèches ou mal préparées.","mean":"메이크업이 피부에 고르게 퍼지지 않고 작은 덩어리처럼 모여 보이는 상태.","ex":"건조한 날에는 볼 쪽에 화장이 뭉쳐서 지저분해 보였다.","exfr":"Les jours secs, le maquillage fait des paquets sur mes joues et ce n'est pas net.","fr":"le maquillage fait des paquets","frpos":"expr.","frdef":"Maquillage qui s'accumule par endroits au lieu de s'étaler.","par":"뭉침","rel":"연어"},{"id":"BT0342","k":"h","cat":"skin","w":"화장품 냉장고","rom":"hwajangpum naengjanggo","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"화장품+냉장고","memofr":"Locution : 화장품 (cosmétique) + 냉장고 (réfrigérateur)","note":"Petit appareil très populaire en Corée ; peu répandu en France.","mean":"화장품을 차갑게 보관하는 데 쓰는 냉장고.","ex":"화장품 냉장고에 보관하여 시원하게 사용하면 진정 효과가 극대화됩니다.","exfr":"Conservé dans un réfrigérateur à cosmétiques et appliqué bien frais, il apaise encore mieux.","fr":"réfrigérateur à cosmétiques","frpos":"n.m.","frdef":"Petit réfrigérateur dédié à la conservation des cosmétiques."},{"id":"BT0343","k":"h","cat":"skin","w":"효모발효여과물","rom":"hyomobalhyoyeogwamul","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"효모+발효+여과물","memofr":"Composé : 효모 (levure) + 발효 (fermentation) + 여과물 (filtrat)","note":"Ingrédient vedette des essences coréennes ; nom INCI : Saccharomyces Ferment Filtrate.","mean":"효모 발효 과정에서 얻은 것을 여과한 화장품 원료 명칭.","ex":"효모발효여과물 성분이 피부에 풍부한 영양을 공급합니다.","exfr":"Le filtrat de ferment de levure nourrit richement la peau.","fr":"filtrat de ferment de levure","frpos":"n.m.","frdef":"Ingrédient obtenu par fermentation puis filtration de levures (ex. galactomyces).","ing":"한국어: 효모를 발효시킨 뒤 거른 액. 갈락토미세스·사카로마이세스 발효여과물 등이 대표적이며 「발효 에센스」의 주원료.\nFrançais : Un filtrat de fermentation de levure est le liquide obtenu après fermentation puis filtration d'une culture de levures; ses constituants varient selon la souche et le procédé.","inci":"Galactomyces / Saccharomyces Ferment Filtrate"},{"id":"BT0346","k":"h","cat":"skin","w":"흔적 케어","rom":"heunjeok keeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"흔적+케어(care)","memofr":"Locution : 흔적 (trace) + 케어 (angl. care)","note":"Euphémisme publicitaire pour les marques post-acné.","mean":"피부에 남은 자국이나 색 변화 등을 관리한다는 표현.","ex":"트러블 후 남은 자국과 흔적 케어에 집중된 기초 제품입니다.","exfr":"Un soin de base centré sur les marques laissées par les boutons.","fr":"soin des marques","frpos":"n.m.","frdef":"Soin visant à estomper les marques post-boutons."},{"id":"BT0350","k":"h","cat":"skin","w":"히알루론산","rom":"hialluronsan","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"히알루론(hyaluron-)+산","memofr":"Composé : 히알루론 (angl. hyaluron-) + 산 (acide)","note":"Actif hydratant le plus connu ; voir aussi 저분자 히알루론산.","mean":"자기 무게의 수백 배에 달하는 수분을 끌어당기는 대표 보습 성분.","ex":"100% 히알루론산 수분 크림이 피부에 강한 보습막을 씌워 줍니다.","exfr":"La crème hydratante 100 % acide hyaluronique pose un film hydratant résistant sur la peau.","fr":"acide hyaluronique","frpos":"n.m.","frdef":"Polysaccharide humectant très répandu.","ing":"한국어: 수분을 많이 붙잡는 다당류. 대표 보습 성분이며 화장품에는 주로 소듐하이알루로네이트 형태로 들어감.\nFrançais : L'acide hyaluronique est un polysaccharide capable de retenir l'eau, utilisé comme humectant; ses sels, dont le hyaluronate de sodium, sont fréquents en cosmétique.","inci":"Hyaluronic Acid / Sodium Hyaluronate"},{"id":"BT0351","k":"h","cat":"skin","w":"EGF","rom":"EGF","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두문자어)","memo":"Epidermal Growth Factor 두문자어","memofr":"Sigle de l'anglais Epidermal Growth Factor","note":"Se prononce lettre par lettre ; présent dans les produits « régénérants ».","mean":"피부 재생을 돕는다고 알려진 상피세포 성장인자(EGF)를 가리키는 약자.","ex":"EGF 성분이 든 앰플을 시술 받은 주에 집중해서 발랐다.","exfr":"La semaine de mon soin esthétique, j'ai appliqué assidûment une ampoule à l'EGF.","fr":"EGF (facteur de croissance épidermique)","frpos":"n.m.","frdef":"Protéine recombinante imitant le facteur de croissance épidermique.","ing":"한국어: 상피세포 성장인자(Epidermal Growth Factor)를 본뜬 재조합 단백질. 재생·탄력 문구와 함께 쓰임.\nFrançais : L'EGF (facteur de croissance épidermique) est une protéine de signalisation; certaines formules cosmétiques contiennent des versions produites par biotechnologie.","inci":"sh-Oligopeptide-1 (rh-Oligopeptide-1)"},{"id":"BT0352","k":"h","cat":"skin","w":"EWG 그린등급","rom":"EWG geurindeunggeup","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"EWG(두문자어)+그린(green)+등급","memofr":"Locution : EWG (sigle anglais) + 그린 (angl. green) + 등급 (classement)","note":"Note attribuée par l'ONG américaine EWG ; très consultée en Corée, presque inconnue en France.","mean":"판매자가 성분 등급을 그린등급이라고 제시하며 성분 선택의 장점으로 내세운 표시.","ex":"전 성분이 EWG 그린등급이라는 문구를 보고 골랐다.","exfr":"Je l'ai choisi en lisant que tous ses ingrédients avaient la « note verte » EWG.","fr":"« note verte » EWG","frpos":"n.f.","frdef":"Mention marketing coréenne indiquant que les ingrédients sont classés « vert » par l'ONG américaine EWG."},{"id":"BT0353","k":"h","cat":"skin","w":"LHA","rom":"LHA","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두문자어)","memo":"Lipo-Hydroxy Acid 두문자어","memofr":"Sigle de l'anglais Lipo-Hydroxy Acid","note":"Actif surtout associé à une marque française de dermocosmétique.","mean":"BHA보다 순하게 각질을 정리하는 성분(지질 하이드록시산)의 약자.","ex":"LHA가 든 토너로 각질을 순하게 정리한다.","exfr":"J'élimine les peaux mortes en douceur avec une lotion tonique au LHA.","fr":"LHA (acide lipohydroxylé)","frpos":"n.m.","frdef":"Dérivé de l'acide salicylique, exfoliant progressif.","ing":"한국어: 리포하이드록시산. 살리실산 유도체(카프릴로일살리실릭애씨드)로, 천천히 작용하는 각질 관리 성분.\nFrançais : Le LHA, ou acide lipohydroxy, désigne généralement l'acide capryloyl salicylique, dérivé lipophile de l'acide salicylique utilisé pour l'exfoliation.","inci":"Capryloyl Salicylic Acid","par":"아하","rel":"관련어(참고)"},{"id":"BT0354","k":"h","cat":"skin","w":"PDRN","rom":"PDRN","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두문자어)","memo":"polydeoxyribonucleotide 두문자어","memofr":"Sigle de l'anglais polydeoxyribonucleotide","note":"Ingrédient à la mode (« ADN de saumon ») dans les soins et les actes esthétiques coréens.","mean":"연어 등에서 얻은 DNA 조각 성분으로, 피부 재생 관리에 쓰임.","ex":"PDRN이 든 앰플을 바르니 피부가 한결 탄탄해 보인다.","exfr":"Avec une ampoule au PDRN, ma peau paraît nettement plus ferme.","fr":"PDRN (polydésoxyribonucléotide)","frpos":"n.m.","frdef":"Fragments d'ADN (souvent de saumon), devenus ingrédient phare après les injections « saumon ».","ing":"한국어: 폴리데옥시리보뉴클레오타이드. 연어 등에서 얻은 DNA 조각으로, 피부과 시술(연어 주사)에서 알려진 뒤 화장품 원료로 확산됨.\nFrançais : Le PDRN est un mélange de fragments de poly(désoxyribonucléotides), souvent issus d'ADN de poisson; il est utilisé comme ingrédient dans certains soins.","inci":"Sodium DNA"},{"id":"BT0356","k":"h","cat":"clean","w":"1차 세안","rom":"1cha sean","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"1차+세안","memofr":"Locution : 1차 (première étape) + 세안 (nettoyage du visage)","note":"Première étape du double nettoyage coréen (voir 이중 세안).","mean":"색조 메이크업이나 자외선 차단제를 녹여 제거하기 위해 클렌징 오일/밤/워터 등을 사용하는 첫 단계.","ex":"1차 세안은 클렌징 오일로 선크림과 화장을 녹여 낸다.","exfr":"Pour le premier nettoyage, je fais fondre crème solaire et maquillage avec une huile démaquillante.","fr":"premier nettoyage (à l'huile)","frpos":"n.m.","frdef":"Première étape du double nettoyage: dissoudre maquillage et solaire avec huile ou baume.","par":"이중 세안","rel":"하위어(참고)"},{"id":"BT0357","k":"h","cat":"clean","w":"2차 세안","rom":"2cha sean","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"2차+세안","memofr":"Locution : 2차 (deuxième étape) + 세안 (nettoyage du visage)","note":"Seconde étape du double nettoyage ; on utilise un nettoyant moussant.","mean":"1차 세안 후 잔여 오일과 수용성 노폐물을 씻어내기 위해 클렌징 폼이나 비누를 사용하는 두 번째 단계.","ex":"오일로 지운 뒤 2차 세안은 약산성 폼으로 가볍게 한다.","exfr":"Après l'huile, je fais le second nettoyage en douceur avec une mousse au pH légèrement acide.","fr":"second nettoyage (à la mousse)","frpos":"n.m.","frdef":"Seconde étape du double nettoyage avec un nettoyant moussant.","par":"이중 세안","rel":"하위어(참고)"},{"id":"BT0359","k":"h","cat":"clean","w":"각질 불리기","rom":"gakjil bulligi","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"각질+불리다(불다+-리-)+-기(명사형)","memofr":"Locution : 각질 (peaux mortes) + 불리기 (faire gonfler, de 불리다)","note":"Geste fréquent avant une exfoliation ou au hammam coréen.","mean":"수분과 온기를 더해 피부 표면의 각질을 물러지게 부풀리는 행위.","ex":"따뜻한 수건을 올려 각질 불리기를 한 다음에 필링을 한다.","exfr":"Je ramollis d'abord les peaux mortes avec une serviette chaude, puis je fais le gommage.","fr":"ramollir les peaux mortes","frpos":"loc.v.","frdef":"Gonfler les squames avec de l'eau tiède avant de les éliminer."},{"id":"BT0360","k":"h","cat":"clean","w":"각질 수화","rom":"gakjil suhwa","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"각질+수화","memofr":"Locution : 각질 (couche cornée) + 수화 (hydratation)","note":"Terme technique de cosmétologie.","mean":"수분을 침투시켜 딱딱해진 각질 층을 촉촉하고 부드럽게 만드는 작용.","ex":"토너를 듬뿍 적신 솜을 올려 두면 각질 수화에 도움이 된다.","exfr":"Poser un coton bien imbibé de lotion tonique aide à hydrater la couche cornée.","fr":"hydratation de la couche cornée","frpos":"n.f.","frdef":"Apport d'eau qui assouplit la couche cornée."},{"id":"BT0365","k":"h","cat":"clean","w":"거품 쿠션감","rom":"geopum kusyeongam","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"거품+쿠션감(cushion+감)","memofr":"Locution : 거품 (mousse) + 쿠션감 (effet coussin, angl. cushion)","note":"Image publicitaire pour une mousse dense.","mean":"거품이 탄력 있게 받쳐주어 마찰을 줄여주는 쿠션 효과.","ex":"거품 쿠션감이 좋아서 손이 피부에 거의 닿지 않는다.","exfr":"L'effet coussin de la mousse est tel que les mains touchent à peine la peau.","fr":"effet coussin de la mousse","frpos":"n.m.","frdef":"Mousse dense qui amortit le contact entre les mains et la peau."},{"id":"BT0366","k":"h","cat":"clean","w":"거품 핸들링","rom":"geopum haendeulling","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"거품+핸들링(handling)","memofr":"Locution : 거품 (mousse) + 핸들링 (angl. handling)","note":"Anglicisme du discours des marques.","mean":"손바닥의 거품을 이용해 피부 마찰 없이 부드럽게 문지르는 세안 동작.","ex":"거품 핸들링만으로 씻어야 볼이 붉어지지 않는다.","exfr":"Il faut se laver en ne manipulant que la mousse pour éviter que les joues rougissent.","fr":"manipulation de la mousse","frpos":"n.f.","frdef":"Faire rouler la mousse sur le visage sans frotter la peau."},{"id":"BT0367","k":"h","cat":"clean","w":"거품망","rom":"geopummang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"거품(고유어)+망","memofr":"Composé : 거품 (mousse) + 망 (filet)","note":"Petit accessoire vendu avec les nettoyants coréens et japonais.","mean":"클렌징 폼을 비벼 풍성하고 조밀한 거품을 일으키는 세안 보조 망.","ex":"거품망에 폼을 조금 짜서 문지르면 거품이 한가득 올라온다.","exfr":"Avec un peu de nettoyant sur le filet moussant, on obtient une mousse abondante.","fr":"filet moussant","frpos":"n.m.","frdef":"Petit filet pour faire mousser un nettoyant en mousse dense."},{"id":"BT0369","k":"h","cat":"clean","w":"깐달걀 오일","rom":"kkandalgyal oil","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"깐달걀+오일(oil)","memofr":"Locution : 깐달걀 (œuf écalé) + 오일 (angl. oil)","note":"Formule publicitaire ; elle reprend l'image de 깐달걀 피부.","mean":"세안 후 피부 표면이 삶은 달걀 껍데기를 깐 것처럼 끈적임이나 각질 없이 매끈해짐.","ex":"이 오일로 세안하고 나면 피부가 깐달걀처럼 매끈해서 깐달걀 오일이라 부른다.","exfr":"Après le nettoyage avec cette huile, ma peau est lisse comme un œuf écalé : je l'appelle mon huile « œuf écalé ».","fr":"huile « peau d'œuf écalé »","frpos":"n.f.","frdef":"Formule marketing d'une huile démaquillante promettant une peau lisse comme un œuf écalé."},{"id":"BT0370","k":"h","cat":"clean","w":"노워시","rom":"nowosi","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"no+wash(한국식 조어)","memofr":"Composé : 노 (angl. no) + 워시 (angl. wash), formation coréenne","note":"S'applique aux nettoyants et aux soins capillaires.","mean":"클렌징 후 물로 다시 헹구지 않고 마무리해도 되는 방식.","ex":"노워시 타입 클렌징 워터라 캠핑 갈 때 챙겨 간다.","exfr":"C'est une eau nettoyante sans rinçage, je l'emporte quand je pars camper.","fr":"sans rinçage","frpos":"loc.adj.","frdef":"Se dit d'un nettoyant ou soin qui ne nécessite pas de rinçage."},{"id":"BT0371","k":"h","cat":"clean","w":"노폐물 흡착","rom":"nopyemul heupchak","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"노폐물+흡착","memofr":"Locution : 노폐물 (impuretés) + 흡착 (adsorption)","note":"Terme technique repris par la publicité (argiles, charbon).","mean":"클렌저 성분이 노폐물을 자석처럼 끌어당겨 붙여내는 작용.","ex":"클레이 성분이 모공 속 노폐물 흡착을 돕는다.","exfr":"L'argile aide à la captation des impuretés logées dans les pores.","fr":"captation des impuretés","frpos":"n.f.","frdef":"Action d'un nettoyant qui attire et retient les impuretés."},{"id":"BT0373","k":"h","cat":"clean","w":"눈 안개 현상","rom":"nun angae hyeonsang","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"눈+안개+현상","memofr":"Locution : 눈 (œil) + 안개 (brouillard) + 현상 (phénomène)","note":"Inconvénient fréquent des huiles démaquillantes cité dans les avis.","mean":"클렌징 오일이 눈에 들어 일시적으로 시야가 안개 낀 듯 하얗게 보이는 현상.","ex":"클렌징 오일이 눈에 들어가 한동안 눈 안개 현상이 있었다.","exfr":"De l'huile démaquillante m'est entrée dans l'œil et j'ai eu une vision floue un moment.","fr":"vision floue (huile dans l'œil)","frpos":"n.f.","frdef":"Voile blanc temporaire quand une huile démaquillante entre dans l'œil."},{"id":"BT0378","k":"h","cat":"clean","w":"떡솝","rom":"tteoksop","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"떡(고유어)+솝(soap)","memofr":"Composé : 떡 (gâteau de riz) + 솝 (angl. soap)","note":"Image culinaire propre au coréen.","mean":"쫀득한 떡과 같은 찰기와 질감을 가진 수제 클렌징 팩 비누 제형.","ex":"떡솝은 쫀득한 질감이라 거품을 내면 촘촘하게 일어난다.","exfr":"Le savon « tteok » a une texture élastique et donne une mousse très serrée.","fr":"savon « tteok » (texture pâte de riz)","frpos":"n.m.","frdef":"Savon-masque à texture élastique comparée au gâteau de riz coréen (tteok)."},{"id":"BT0381","k":"h","cat":"clean","w":"말끔 모공","rom":"malkkeum mogong","pos":"명사","unit":"구","eo":"고유어","form":"구","memo":"말끔(어근)+모공","memofr":"Locution : 말끔 (racine « net, propre ») + 모공 (pores)","note":"Formule publicitaire.","mean":"모공 내부의 노폐물과 피지가 깨끗이 세정되어 정돈된 모공 상태.","ex":"효소 세안을 한 날은 코가 말끔 모공이 되어 기분이 좋다.","exfr":"Les jours où je fais un nettoyage enzymatique, mon nez a des pores nets et ça me met de bonne humeur.","fr":"pores nets","frpos":"n.m.pl.","frdef":"Formule marketing: pores désencombrés et propres."},{"id":"BT0382","k":"h","cat":"clean","w":"맷돌밤","rom":"maetdolbam","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"맷돌(고유어)+밤(balm)","memofr":"Composé : 맷돌 (moulin à pierre) + 밤 (angl. balm)","note":"Référence culturelle au moulin traditionnel coréen.","mean":"돌려서 갈아 쓰는 용기 방식이 한국 전통 맷돌을 갈아내는 모습과 유사함을 비유한 표현.","ex":"맷돌밤은 뚜껑을 돌리면 밤이 갈려 나와 손을 넣지 않아도 된다.","exfr":"Avec ce baume à moudre, il suffit de tourner le couvercle pour que le baume sorte râpé, sans y mettre les doigts.","fr":"baume à moudre","frpos":"n.m.","frdef":"Baume démaquillant dans un pot à tourner, comparé à une meule coréenne (맷돌).","par":"밤 투 폼","rel":"관련어(참고)"},{"id":"BT0383","k":"h","cat":"clean","w":"모공 브러쉬","rom":"mogong beureoswi","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"모공+브러쉬(brush)","memofr":"Locution : 모공 (pores) + 브러쉬 (angl. brush)","note":"Graphie courante 브러쉬 ; la norme officielle écrit 브러시.","mean":"미세모가 박혀 있어 손으로 닿지 않는 모공 내부를 정밀하게 세정하는 브러쉬.","ex":"모공 브러쉬로 코 옆을 살살 굴리며 씻는다.","exfr":"Je nettoie le contour du nez en faisant rouler doucement la brosse pour les pores.","fr":"brosse pour les pores","frpos":"n.f.","frdef":"Petite brosse à poils fins pour nettoyer les pores."},{"id":"BT0385","k":"h","cat":"clean","w":"모공 스케일링","rom":"mogong seukeilling","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"모공+스케일링(scaling)","memofr":"Locution : 모공 (pores) + 스케일링 (angl. scaling)","note":"Emprunt au vocabulaire dentaire (détartrage).","mean":"치과 스케일링처럼 모공 속 묵은 노폐물과 피지를 정교하고 깊숙이 정돈해주는 세안.","ex":"주말마다 클레이 팩으로 모공 스케일링을 한다.","exfr":"Chaque week-end, je fais un « détartrage » des pores avec un masque à l'argile.","fr":"« détartrage » des pores","frpos":"n.m.","frdef":"Nettoyage profond des pores, comparé au détartrage dentaire.","par":"피지 연화","rel":"관련어(참고)"},{"id":"BT0386","k":"h","cat":"clean","w":"모공 청소","rom":"mogong cheongso","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"모공+청소","memofr":"Locution : 모공 (pores) + 청소 (nettoyage)","note":"Expression courante ; plus familière que « nettoyage en profondeur ».","mean":"모공 속에 박혀있는 피지, 화이트헤드, 노폐물을 깨끗이 쓸어내는 작용.","ex":"클렌징 오일로 오래 롤링하면 모공 청소가 되는 느낌이다.","exfr":"Masser longuement avec l'huile démaquillante donne l'impression de nettoyer les pores.","fr":"nettoyage des pores","frpos":"n.m.","frdef":"Élimination du sébum et des impuretés incrustés dans les pores.","par":"피지 연화","rel":"관련어(참고)"},{"id":"BT0388","k":"h","cat":"clean","w":"무자극 세안","rom":"mujageuk sean","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"무자극+세안","memofr":"Locution : 무자극 (sans irritation) + 세안 (nettoyage du visage)","note":"Formule publicitaire pour les peaux sensibles.","mean":"자극감이나 민감 반응이 일어나지 않도록 순하게 진행하는 세안.","ex":"피부가 얇아서 거품만 굴리는 무자극 세안을 한다.","exfr":"Ma peau est fine, alors je fais un nettoyage sans irritation en ne faisant rouler que la mousse.","fr":"nettoyage sans irritation","frpos":"n.m.","frdef":"Nettoyage très doux qui ne provoque pas de réaction."},{"id":"BT0390","k":"h","cat":"clean","w":"물광","rom":"mulgwang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"물(고유어)+광","memofr":"Composé : 물 (eau) + 광 (éclat)","note":"Idéal du teint coréen ; proche de « glass skin » en anglais.","mean":"마치 물을 머금은 듯 촉촉하게 빛나는 윤기 나는 피부 상태.","ex":"수분 앰플을 겹쳐 바르고 쿠션을 올리면 물광이 난다.","exfr":"En superposant une ampoule hydratante et un cushion, on obtient un éclat « peau mouillée ».","fr":"éclat « peau mouillée » (glass skin)","frpos":"n.m.","frdef":"Peau très lumineuse et humide, comme recouverte d'eau."},{"id":"BT0392","k":"h","cat":"clean","w":"미세 거품","rom":"mise geopum","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"미세+거품","memofr":"Locution : 미세 (fin, micro) + 거품 (mousse)","note":"Argument de douceur des nettoyants.","mean":"입자가 매우 작고 촘촘하여 피부 자극을 줄여주는 거품.","ex":"미세 거품이라 얼굴에 올리면 크림처럼 쫀쫀하다.","exfr":"C'est une micro-mousse : posée sur le visage, elle est dense comme une crème.","fr":"micro-mousse","frpos":"n.f.","frdef":"Mousse aux bulles très fines et serrées."},{"id":"BT0393","k":"h","cat":"clean","w":"미셀라 입자","rom":"misella ipja","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"미셀라(micellar)+입자","memofr":"Locution : 미셀라 (angl. micellar) + 입자 (particule)","note":"Terme technique associé aux eaux micellaires, nées en France.","mean":"친유성 부분이 노폐물을 흡착하고 친수성 부분이 물로 끌어당겨 제거하는 세정 입자.","ex":"클렌징 워터 속 미셀라 입자가 화장을 끌어당겨 지운다.","exfr":"Les micelles de l'eau nettoyante attirent le maquillage pour l'éliminer.","fr":"micelles","frpos":"n.f.pl.","frdef":"Agrégats de tensioactifs qui piègent les impuretés (principe de l'eau micellaire).","ing":"한국어: 계면활성제가 물속에서 만드는 미세한 공 모양 집합체(미셀). 클렌징 워터가 메이크업·피지를 붙잡아 지우는 원리.\nFrançais : Une micelle est un agrégat de molécules tensioactives formé dans un liquide; elle aide à disperser les corps gras lors du nettoyage. Ce n'est pas un ingrédient INCI unique.","inci":"Micelles — 제형 원리"},{"id":"BT0396","k":"h","cat":"clean","w":"밀착 롤링","rom":"milchak rolling","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"밀착+롤링(rolling)","memofr":"Locution : 밀착 (adhérence) + 롤링 (angl. rolling)","note":"Geste recommandé dans les notices de nettoyants.","mean":"피부 표면에 밀착시켜 구석구석 손가락을 굴려 세정하는 동작.","ex":"코 옆은 오일로 밀착 롤링을 해야 블랙헤드가 빠진다.","exfr":"Autour du nez, il faut faire un massage circulaire appuyé à l'huile pour déloger les points noirs.","fr":"massage circulaire appuyé","frpos":"n.m.","frdef":"Faire rouler les doigts en épousant les reliefs du visage pour nettoyer."},{"id":"BT0397","k":"h","cat":"clean","w":"밀착 세안","rom":"milchak sean","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"밀착+세안","memofr":"Locution : 밀착 (adhérence) + 세안 (nettoyage du visage)","note":"Formule publicitaire.","mean":"클렌저가 피부 굴곡 및 모공 틈새에 빈틈없이 달라붙어 씻어내는 동작.","ex":"거품이 쫀쫀해서 굴곡진 콧볼까지 밀착 세안이 된다.","exfr":"La mousse est si dense qu'elle nettoie au plus près de la peau, jusque dans les creux des ailes du nez.","fr":"nettoyage au plus près de la peau","frpos":"n.m.","frdef":"Nettoyant qui épouse les reliefs et pénètre les pores."},{"id":"BT0398","k":"h","cat":"clean","w":"반전 클렌징","rom":"banjeon keullenjing","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"반전+클렌징(cleansing)","memofr":"Locution : 반전 (retournement) + 클렌징 (angl. cleansing)","note":"L'idée de « retournement » souligne le changement de texture.","mean":"오일 제형이 피지를 녹인 후 물을 만나면 거품으로 변해 지우는 세정 방식.","ex":"오일이 물을 만나면 거품으로 바뀌는 반전 클렌징 제품이다.","exfr":"Un nettoyant à transformation : l'huile se change en mousse au contact de l'eau.","fr":"nettoyant à transformation","frpos":"n.m.","frdef":"Nettoyant qui change de texture (huile en mousse) au contact de l'eau.","par":"유화 과정","rel":"관련어(참고)"},{"id":"BT0399","k":"h","cat":"clean","w":"밤 세안","rom":"bam sean","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"밤(balm)+세안","memofr":"Locution : 밤 (angl. balm) + 세안 (nettoyage du visage)","note":"Attention : 밤 se lit aussi « nuit » ou « châtaigne » en coréen.","mean":"클렌징 밤 제형을 사용하여 메이크업을 지우는 세안.","ex":"진한 화장을 한 날은 밤 세안으로 먼저 녹여 낸다.","exfr":"Les jours de maquillage chargé, je le fais d'abord fondre avec un baume démaquillant.","fr":"démaquillage au baume","frpos":"n.m.","frdef":"Nettoyage effectué avec un baume démaquillant.","par":"이중 세안","rel":"관련어(참고)"},{"id":"BT0400","k":"h","cat":"clean","w":"밤 투 폼","rom":"bam tu pom","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"balm to foam 차용","memofr":"Emprunt à l'anglais balm to foam","note":"Format de nettoyant hybride très populaire en Corée.","mean":"밤(Balm) 제형으로 시작하여 물이 닿으면 거품(Foam) 형태로 변하는 클렌저 제형.","ex":"밤 투 폼 클렌저라 물을 묻히면 밤이 거품으로 바뀐다.","exfr":"C'est un nettoyant balm-to-foam : au contact de l'eau, le baume se transforme en mousse.","fr":"balm-to-foam (baume qui devient mousse)","frpos":"n.m.","frdef":"Nettoyant baume qui se transforme en mousse avec de l'eau."},{"id":"BT0401","k":"h","cat":"clean","w":"백탁 현상","rom":"baektak hyeonsang","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"백탁+현상","memofr":"Locution : 백탁 (blanchiment trouble) + 현상 (phénomène)","note":"Mot polysémique : il désigne aussi les traces blanches des solaires (voir l'entrée de soin solaire).","mean":"오일 유화 시 표면이 하얗게 바뀌는 시각적 반응.","ex":"물을 묻혀 문지르자 오일이 하얗게 변하는 백탁 현상이 나타났다.","exfr":"En frottant avec un peu d'eau, l'huile a blanchi en émulsionnant.","fr":"émulsification blanchâtre","frpos":"n.f.","frdef":"Voile blanc laissé par un solaire minéral ou l'émulsion d'une huile."},{"id":"BT0402","k":"h","cat":"clean","w":"버블 롤링","rom":"beobeul rolling","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"bubble+rolling","memofr":"Locution : 버블 (angl. bubble) + 롤링 (angl. rolling)","note":"Anglicisme du discours des marques.","mean":"거품을 피부 위에서 굴리며 세정하는 동작.","ex":"손을 대지 않고 버블 롤링으로만 세안한다.","exfr":"Je me lave le visage uniquement par massage à la mousse, sans toucher la peau.","fr":"massage à la mousse","frpos":"n.m.","frdef":"Faire rouler la mousse sur la peau pour nettoyer."},{"id":"BT0403","k":"h","cat":"clean","w":"버블 폼","rom":"beobeul pom","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"bubble+foam","memofr":"Locution : 버블 (angl. bubble) + 폼 (angl. foam)","note":"Désigne souvent un flacon distributeur de mousse.","mean":"별도로 거품을 내지 않아도 펌프 용기에서 거품 형태로 나오는 클렌저.","ex":"버블 폼이라 펌프를 누르면 바로 거품이 나와 아침에 편하다.","exfr":"C'est une mousse prête à l'emploi : on appuie sur la pompe et elle sort directement, pratique le matin.","fr":"mousse prête à l'emploi","frpos":"n.f.","frdef":"Nettoyant qui sort directement en mousse d'un flacon-pompe."},{"id":"BT0410","k":"h","cat":"clean","w":"생크림 거품","rom":"saengkeurim geopum","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"생크림(생+cream)+거품","memofr":"Locution : 생크림 (crème fraîche, de 생 « cru » + angl. cream) + 거품 (mousse)","note":"Image gourmande fréquente dans la publicité.","mean":"밀도가 높고 부드러운 풍성한 형태의 거품 질감 비유.","ex":"거품망으로 삼십 초만 문지르면 생크림 거품이 만들어진다.","exfr":"Trente secondes de frottement dans le filet moussant suffisent pour obtenir une mousse « crème fouettée ».","fr":"mousse « crème fouettée »","frpos":"n.f.","frdef":"Mousse dense et onctueuse comparée à la crème chantilly."},{"id":"BT0411","k":"h","cat":"clean","w":"세안 마찰감","rom":"sean machalgam","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"세안+마찰감","memofr":"Locution : 세안 (nettoyage du visage) + 마찰감 (sensation de frottement)","note":"Souvent présenté comme à éviter.","mean":"세안 시 손가락이 피부에 직접 문질러지며 느끼는 뻑뻑한 마찰.","ex":"거품이 적으면 세안 마찰감이 커져서 피부가 따갑다.","exfr":"Avec peu de mousse, la friction au nettoyage augmente et la peau picote.","fr":"friction au nettoyage","frpos":"n.f.","frdef":"Frottement ressenti quand les doigts touchent directement la peau."},{"id":"BT0412","k":"h","cat":"clean","w":"세정력","rom":"sejeongnyeok","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"세정+-력","memofr":"Dérivé : 세정 (lavage) + -력 (suffixe « force, capacité »)","note":"Critère principal des avis sur les nettoyants.","mean":"메이크업이나 노폐물을 씻어내는 성능 및 능력.","ex":"세정력이 좋아서 워터프루프 마스카라도 한 번에 지워진다.","exfr":"Son pouvoir nettoyant est tel qu'il retire même le mascara waterproof en une fois.","fr":"pouvoir nettoyant","frpos":"n.m.","frdef":"Capacité à éliminer maquillage et impuretés."},{"id":"BT0413","k":"h","cat":"clean","w":"셔벗 밤","rom":"syeobeot bam","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"sherbet+balm","memofr":"Locution : 셔벗 (angl. sherbet) + 밤 (angl. balm)","note":"Image de dessert glacé ; voir aussi 셔벗 제형.","mean":"사각거리는 셔벗 질감으로 체온에 닿으면 오일로 부드럽게 녹는 밤 제형.","ex":"셔벗 밤은 피부에 닿자마자 오일처럼 녹는다.","exfr":"Le baume sorbet fond comme une huile dès qu'il touche la peau.","fr":"baume sorbet","frpos":"n.m.","frdef":"Baume démaquillant à texture de sorbet qui fond en huile.","par":"밤 투 폼","rel":"관련어(참고)"},{"id":"BT0414","k":"h","cat":"clean","w":"속당김","rom":"sokdanggim","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"속+당김(당기다+-ㅁ)","memofr":"Composé : 속 (intérieur) + 당김 (tiraillement, de 당기다)","note":"Lié à la notion de 속건조 (déshydratation profonde).","mean":"세안 후 피부 깊은 층이 건조하여 당기는 듯한 감촉.","ex":"세안하고 나면 속당김이 심해서 바로 토너를 바른다.","exfr":"Après le nettoyage, j'ai un tel tiraillement en profondeur que j'applique tout de suite une lotion tonique.","fr":"tiraillement profond","frpos":"n.m.","frdef":"Sensation de peau qui tire en profondeur après le nettoyage.","par":"당기다","rel":"관련어(참고)"},{"id":"BT0415","k":"h","cat":"clean","w":"손가락 러빙","rom":"songarak reobing","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"손가락+러빙(rubbing)","memofr":"Locution : 손가락 (doigt) + 러빙 (angl. rubbing)","note":"Anglicisme des notices.","mean":"손가락으로 피부 표면을 부드럽게 문지르는 세안 동작.","ex":"손가락 러빙은 약지에 힘을 빼고 원을 그리며 한다.","exfr":"Pour frotter du bout des doigts, je relâche l'annulaire et je dessine des cercles.","fr":"frottement du bout des doigts","frpos":"n.m.","frdef":"Massage léger du bout des doigts lors du nettoyage."},{"id":"BT0416","k":"h","cat":"clean","w":"수분 보습막","rom":"subun boseummak","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"수분+보습막","memofr":"Locution : 수분 (eau) + 보습막 (film hydratant)","note":"Pléonasme publicitaire fréquent.","mean":"수분이 공기 중으로 빠져나가지 못하도록 세안 후 피부를 감싸는 얇은 층.","ex":"세안 뒤에도 수분 보습막이 남아 얼굴이 당기지 않는다.","exfr":"Même après le nettoyage, un film hydratant subsiste et le visage ne tiraille pas.","fr":"film hydratant","frpos":"n.m.","frdef":"Fine couche qui limite la perte d'eau après le nettoyage."},{"id":"BT0417","k":"h","cat":"clean","w":"수분 장벽 보호","rom":"subun jangbyeok boho","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"수분+장벽+보호","memofr":"Locution : 수분 (eau) + 장벽 (barrière) + 보호 (protection)","note":"Formule marketing pour les nettoyants doux.","mean":"세안 시 피부 표피 각질층의 수분 손실을 막아주는 효과.","ex":"약산성 클렌저라 수분 장벽 보호에 신경 쓴 제품이다.","exfr":"C'est un nettoyant au pH légèrement acide, conçu pour protéger la barrière hydrique.","fr":"protection de la barrière hydrique","frpos":"n.f.","frdef":"Préserver l'eau de la couche cornée pendant le nettoyage."},{"id":"BT0418","k":"h","cat":"clean","w":"수분 진정","rom":"subun jinjeong","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"수분+진정","memofr":"Locution : 수분 (hydratation) + 진정 (apaisement)","note":"Formule générique des fiches produit.","mean":"수분을 공급하여 세안 시 마찰감으로 민감해진 피부를 가라앉힘.","ex":"햇볕을 쬔 날은 알로에 젤로 수분 진정을 해 준다.","exfr":"Les jours d'exposition au soleil, j'apaise et hydrate ma peau avec un gel d'aloe.","fr":"apaisement hydratant","frpos":"n.m.","frdef":"Apaiser la peau en lui apportant de l'eau."},{"id":"BT0419","k":"h","cat":"clean","w":"수분 충전","rom":"subun chungjeon","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"수분+충전","memofr":"Locution : 수분 (hydratation) + 충전 (recharge)","note":"Métaphore de la batterie, courante dans la publicité.","mean":"피부 층 깊숙이 물기나 수분 입자를 보충해주는 세안 효과.","ex":"자기 전에 시트 마스크로 수분 충전을 한다.","exfr":"Avant de dormir, je fais une recharge en hydratation avec un masque en tissu.","fr":"recharge en hydratation","frpos":"n.f.","frdef":"Apport important d'eau à la peau."},{"id":"BT0420","k":"h","cat":"clean","w":"스크럽 폼","rom":"seukeureop pom","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"scrub+foam","memofr":"Locution : 스크럽 (angl. scrub) + 폼 (angl. foam)","note":"Exfoliant mécanique ; souvent déconseillé aux peaux sensibles.","mean":"세안 폼 속에 물리적 알갱이가 포함되어 세정과 각질 제거를 동시에 하는 제형.","ex":"스크럽 폼은 알갱이가 있어 일주일에 한 번만 쓴다.","exfr":"La mousse exfoliante contient des grains, je ne l'utilise qu'une fois par semaine.","fr":"mousse exfoliante","frpos":"n.f.","frdef":"Nettoyant moussant contenant des grains exfoliants."},{"id":"BT0422","k":"h","cat":"clean","w":"슬러딩","rom":"seulleoding","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"slugging 차용","memofr":"Emprunt à l'anglais slugging","note":"Tendance venue des réseaux sociaux anglophones (le nom vient de la limace).","mean":"밤 제형을 얼굴 전체에 덮어 밀폐막을 형성해 세정 및 보습하는 방식.","ex":"건조한 밤에는 크림 위에 밤을 덮는 슬러딩을 한다.","exfr":"Les nuits sèches, je fais du slugging en recouvrant ma crème d'un baume.","fr":"slugging","frpos":"n.m.","frdef":"Tendance consistant à couvrir le visage d'un baume occlusif (type vaseline) pour la nuit."},{"id":"BT0424","k":"h","cat":"clean","w":"약알칼리성","rom":"yagalkalliseong","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"약-+알칼리(alkali)+-성","memofr":"Dérivé : 약- (préfixe « faible ») + 알칼리 (angl. alkali) + -성 (suffixe « qualité »)","note":"S'oppose à 약산성 ; souvent critiqué dans les avis pour son effet desséchant.","mean":"pH 산도가 높고 세정력이 강해 지성 피부 유분을 깨끗이 제거하는 성질.","ex":"약알칼리성 비누라 뽀득하게 씻기지만 조금 당긴다.","exfr":"C'est un savon légèrement alcalin : il nettoie à fond mais tiraille un peu.","fr":"légèrement alcalin","frpos":"loc.adj.","frdef":"pH légèrement basique, typique des savons et nettoyants décapants."},{"id":"BT0425","k":"h","cat":"clean","w":"엠보 패드","rom":"embo paedeu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"embo(ssing)+pad","memofr":"Locution : 엠보 (de l'angl. embossing, tronqué) + 패드 (angl. pad)","note":"Troncation typiquement coréenne.","mean":"올록볼록한 표면 처리가 되어 노폐물 세정을 돕는 패드.","ex":"엠보 패드의 올록볼록한 면으로 코 옆을 닦는다.","exfr":"J'essuie le contour du nez avec la face en relief du coton gaufré.","fr":"coton gaufré","frpos":"n.m.","frdef":"Disque à surface en relief qui aide à éliminer les impuretés.","par":"토너 패드","rel":"하위어(참고)"},{"id":"BT0426","k":"s","cat":"clean","w":"오일 겉돎","rom":"oil geotdom","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"오일(oil)+겉돎(겉돌다+-ㅁ)","memofr":"Locution : 오일 (angl. oil) + 겉돎 (fait de rester en surface)","note":"Défaut d'émulsification cité dans les avis.","mean":"클렌징 오일이 노폐물을 녹이지 못하고 피부 표면에서 따로 노는 현상.","ex":"물을 섞지 않고 문지르면 오일 겉돎이 생겨 잘 지워지지 않는다.","exfr":"Si on frotte sans ajouter d'eau, on a une huile qui ne s'émulsionne pas et qui s'élimine mal.","fr":"huile qui ne s'émulsionne pas","frpos":"n.f.","frdef":"Huile démaquillante qui reste en surface sans dissoudre le maquillage.","par":"겉돌다","rel":"연어"},{"id":"BT0427","k":"h","cat":"clean","w":"오일 세안","rom":"oil sean","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"오일(oil)+세안","memofr":"Locution : 오일 (angl. oil) + 세안 (nettoyage du visage)","note":"Forme courante de la première étape du double nettoyage.","mean":"클렌징 오일을 주요 세안제로 사용하는 세안 방식.","ex":"선크림을 바른 날은 오일 세안을 빼먹지 않는다.","exfr":"Les jours où je mets de la crème solaire, je ne saute jamais le nettoyage à l'huile.","fr":"nettoyage à l'huile","frpos":"n.m.","frdef":"Nettoyage dont le produit principal est une huile.","par":"이중 세안","rel":"관련어(참고)"},{"id":"BT0428","k":"h","cat":"clean","w":"올인원 클렌저","rom":"orinwon keullenjeo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"all-in-one+cleanser","memofr":"Locution : 올인원 (angl. all-in-one) + 클렌저 (angl. cleanser)","note":"Format qui s'oppose à l'idéal du double nettoyage.","mean":"여러 단계의 클렌저 역할을 제품 하나로 완결해주는 세안용 화장품.","ex":"올인원 클렌저 하나로 화장과 세안을 한 번에 끝낸다.","exfr":"Avec un seul nettoyant tout-en-un, je retire le maquillage et me lave le visage en une fois.","fr":"nettoyant tout-en-un","frpos":"n.m.","frdef":"Nettoyant qui remplace plusieurs étapes de démaquillage."},{"id":"BT0429","k":"h","cat":"clean","w":"워터프루프 클렌징","rom":"woteopeurupeu keullenjing","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"waterproof+cleansing","memofr":"Locution : 워터프루프 (angl. waterproof) + 클렌징 (angl. cleansing)","note":"Allégation des huiles et des démaquillants biphasés.","mean":"물에 잘 지워지지 않는 방수 메이크업 제품을 녹여 지우는 기능.","ex":"워터프루프 클렌징이 되는지 손등에 마스카라를 발라 시험해 봤다.","exfr":"Pour voir s'il démaquille le waterproof, j'ai testé avec du mascara sur le dos de la main.","fr":"démaquillage waterproof","frpos":"n.m.","frdef":"Capacité à éliminer le maquillage résistant à l'eau."},{"id":"BT0430","k":"h","cat":"clean","w":"원스텝 세안","rom":"wonseutep sean","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"원스텝(one-step)+세안","memofr":"Locution : 원스텝 (angl. one-step) + 세안 (nettoyage du visage)","note":"Opposé à 이중 세안.","mean":"이중 세안 없이 한 번의 세안 과정만으로 립앤아이 포함 메이크업을 끝내는 세안.","ex":"야근한 날은 클렌징 워터로 원스텝 세안만 하고 잔다.","exfr":"Les soirs où je rentre tard du travail, je fais juste un nettoyage en une étape à l'eau micellaire avant de dormir.","fr":"nettoyage en une étape","frpos":"n.m.","frdef":"Démaquillage et nettoyage en une seule fois, sans double nettoyage.","par":"이중 세안","rel":"관련어(참고)"},{"id":"BT0432","k":"h","cat":"clean","w":"유화 과정","rom":"yuhwa gwajeong","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"유화+과정","memofr":"Locution : 유화 (émulsification) + 과정 (processus)","note":"Étape clé des huiles démaquillantes : on ajoute un peu d'eau et on masse avant de rincer.","mean":"클렌징 오일이 물과 만나 하얗게 변하며 오염 물질을 떼어내는 핵심 단계.","ex":"유화 과정을 충분히 거쳐야 오일이 깨끗하게 씻겨 나간다.","exfr":"L'huile ne se rince proprement que si l'on prend le temps de bien mener l'émulsification.","fr":"émulsification","frpos":"n.f.","frdef":"Moment où l'huile démaquillante devient laiteuse au contact de l'eau."},{"id":"BT0433","k":"h","cat":"clean","w":"이중 세안","rom":"ijung sean","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"이중+세안","memofr":"Locution : 이중 (double) + 세안 (nettoyage du visage)","note":"Méthode emblématique de la routine coréenne, adoptée en France sous le nom de « double cleansing ».","mean":"1차 세안제와 2차 세안제를 연속으로 사용하여 완성하는 두 번 세안법.","ex":"화장을 한 날에는 오일과 폼으로 이중 세안을 한다.","exfr":"Les jours où je suis maquillée, je fais un double nettoyage : huile puis mousse.","fr":"double nettoyage","frpos":"n.m.","frdef":"Méthode coréenne: huile ou baume, puis nettoyant moussant."},{"id":"BT0437","k":"h","cat":"clean","w":"지우개 패드","rom":"jiugae paedeu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"지우개+패드(pad)","memofr":"Locution : 지우개 (gomme) + 패드 (angl. pad)","note":"Image familière ; souvent un nom de produit.","mean":"피부 표면의 각질이나 클렌징 노폐물을 지우개로 지우듯 깨끗이 닦아내는 패드.","ex":"지우개 패드로 코 주변을 닦으니 피부결이 매끈해졌다.","exfr":"En essuyant le contour du nez avec un disque « gomme », mon grain de peau est devenu lisse.","fr":"disque « gomme »","frpos":"n.m.","frdef":"Disque exfoliant qui « efface » les impuretés comme une gomme.","par":"토너 패드","rel":"하위어(참고)"},{"id":"BT0438","k":"h","cat":"clean","w":"짜밤","rom":"jjabam","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"짜(다)+밤(balm) 축약","memofr":"Abréviation syllabique : 짜(다) (presser) + 밤 (angl. balm)","note":"Argot des avis ; il s'oppose aux baumes en pot.","mean":"스파출러 없이 튜브 용기에서 단번에 짜서 쓰는 클렌징밤의 줄임말.","ex":"짜밤은 튜브에서 짜서 쓰니 스패출러가 필요 없다.","exfr":"Ce baume se presse directement du tube, pas besoin de spatule.","fr":"baume à presser","frpos":"n.m.","frdef":"Abréviation de « 짜서 쓰는 밤 »: baume démaquillant en tube.","par":"밤 투 폼","rel":"관련어(참고)"},{"id":"BT0440","k":"h","cat":"clean","w":"착붙 거품","rom":"chakbut geopum","pos":"명사","unit":"구","eo":"고유어","form":"구","memo":"착붙(착 붙다 축약)+거품","memofr":"Locution : 착붙 (abrév. de 착 붙다 « coller parfaitement ») + 거품 (mousse)","note":"Argot récent ; voir aussi l'entrée 착붙.","mean":"피부 표면에 밀착력이 높아 흐르지 않고 착 붙어있는 조밀한 거품.","ex":"착붙 거품이라 얼굴에 올려 두어도 흘러내리지 않는다.","exfr":"C'est une mousse qui adhère : posée sur le visage, elle ne coule pas.","fr":"mousse qui adhère","frpos":"n.f.","frdef":"Mousse dense qui colle à la peau sans couler.","par":"착붙","rel":"관련어(참고)"},{"id":"BT0441","k":"h","cat":"clean","w":"착색","rom":"chaksaek","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"착+색 (클렌징 문맥의 다의 항목)","memofr":"Composé : 착 (s'attacher) + 색 (couleur)","note":"Mot polysémique : il désigne une tache résiduelle (nettoyage) ou la tenue d'une teinte (lèvres).","mean":"① 색소 물질이 피부 표면이나 틈새에 들어붙어 씻기지 않고 색이 남음.\n② 틴트 색이 입술에 물들어 남는 것.","ex":"틴트를 지워도 입술에 착색이 남아 생기 있어 보인다.","exfr":"Même après avoir retiré le tint, une coloration résiduelle reste sur les lèvres et leur donne bonne mine.","fr":"coloration résiduelle ; tenue de la teinte (stain)","frpos":"n.f.","frdef":"1. Pigment qui reste sur la peau ou les lèvres après le nettoyage. 2. Couleur du tint qui reste imprégnée dans les lèvres."},{"id":"BT0442","k":"h","cat":"clean","w":"착색 제거","rom":"chaksaek jegeo","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"착색+제거","memofr":"Locution : 착색 (pigmentation résiduelle) + 제거 (élimination)","note":"Allégation des démaquillants pour les teintes à forte tenue.","mean":"입술이나 눈가에 물든 강한 색소 자국을 물들기 전 원래 상태로 씻어냄.","ex":"립 리무버로 문질러 착색 제거를 했다.","exfr":"J'ai procédé à l'élimination des pigments tenaces en frottant avec un démaquillant pour les lèvres.","fr":"élimination des pigments tenaces","frpos":"n.f.","frdef":"Enlever les pigments de teinte incrustés (lèvres, yeux)."},{"id":"BT0443","k":"h","cat":"clean","w":"착색 틴트","rom":"chaksaek tinteu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"착색+틴트(tint)","memofr":"Locution : 착색 (pigmentation) + 틴트 (angl. tint)","note":"Qualité recherchée (tenue) mais difficile à démaquiller.","mean":"입술 각질 층에 색소가 강하게 물들어 지우기 어려운 립 화장품.","ex":"마스크에 묻지 않게 하려고 착색 틴트를 바른다.","exfr":"Pour ne pas tacher mon masque, je mets une teinte à forte pigmentation.","fr":"teinte à forte pigmentation (tint)","frpos":"n.f.","frdef":"Encre à lèvres qui teinte durablement et se démaquille difficilement.","par":"틴트","rel":"하위어(참고)"},{"id":"BT0455","k":"h","cat":"clean","w":"클렌징 패드","rom":"keullenjing paedeu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"cleansing+pad","memofr":"Locution : 클렌징 (angl. cleansing) + 패드 (angl. pad)","note":"Format pratique, très répandu en Corée ; on le vend en pot.","mean":"클렌징 워터나 오일이 적셔져 있어 세안 시 간편하게 닦아내는 패드.","ex":"피곤한 날에는 클렌징 패드 한 장으로 화장을 닦아 낸다.","exfr":"Les soirs de fatigue, je retire mon maquillage avec un seul disque nettoyant imbibé.","fr":"disque nettoyant imbibé","frpos":"n.m.","frdef":"Disque pré-imbibé de lotion ou d'huile démaquillante.","par":"토너 패드","rel":"하위어(참고)"},{"id":"BT0456","k":"h","cat":"clean","w":"클렌징 팩","rom":"keullenjing paek","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"cleansing+pack","memofr":"Locution : 클렌징 (angl. cleansing) + 팩 (angl. pack)","note":"En coréen, 팩 désigne tout type de masque.","mean":"팩으로 영양 공급 후 물을 묻혀 세안제로 전환해 씻어내는 제품.","ex":"클렌징 팩을 오 분 올려 두었다가 물을 묻혀 씻어 냈다.","exfr":"J'ai laissé poser le masque nettoyant cinq minutes, puis je l'ai rincé à l'eau.","fr":"masque nettoyant","frpos":"n.m.","frdef":"Masque qui se transforme en nettoyant au contact de l'eau.","par":"마스크 팩","rel":"하위어(참고)"},{"id":"BT0458","k":"h","cat":"clean","w":"토닝 세안","rom":"toning sean","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"토닝(toning)+세안","memofr":"Locution : 토닝 (angl. toning) + 세안 (nettoyage du visage)","note":"Formule marketing ; voir 토닝 케어.","mean":"세정 작업과 함께 피부 결을 맑고 고르게 바로잡아주는 세안.","ex":"비타민 폼으로 토닝 세안을 하면 얼굴이 한결 맑아 보인다.","exfr":"Un nettoyage unifiant avec une mousse à la vitamine rend le teint nettement plus clair.","fr":"nettoyage unifiant","frpos":"n.m.","frdef":"Nettoyage qui promet aussi d'unifier le teint."},{"id":"BT0459","k":"h","cat":"clean","w":"패드 닦아내기","rom":"paedeu dakkanaegi","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"패드(pad)+닦아내기(닦아내다+-기)","memofr":"Locution : 패드 (angl. pad) + 닦아내기 (fait d'essuyer)","note":"Geste de base des toners en disques.","mean":"패드를 이용해 피부 표면의 노폐물을 문질러 지우는 동작.","ex":"아침에는 물세안 대신 패드 닦아내기로 끝낸다.","exfr":"Le matin, au lieu de me rincer à l'eau, je me contente d'un essuyage au disque.","fr":"essuyage au disque","frpos":"n.m.","frdef":"Essuyer la peau avec un disque imbibé.","par":"닦토","rel":"관련어(참고)"},{"id":"BT0460","k":"h","cat":"clean","w":"포인트 메이크업","rom":"pointeu meikeueop","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"point+make-up(한국식 조어)","memofr":"Locution : 포인트 (angl. point) + 메이크업 (angl. make-up), formation coréenne","note":"Faux anglicisme : en anglais, on dirait « eye and lip make-up ».","mean":"립, 아이 등 특정 부위에 강한 색조와 방수성이 들어가는 메이크업 세정 대상.","ex":"포인트 메이크업은 전용 리무버로 먼저 지운다.","exfr":"Je retire d'abord le maquillage des yeux et des lèvres avec un démaquillant dédié.","fr":"maquillage des yeux et des lèvres","frpos":"n.m.","frdef":"Maquillage localisé (yeux, lèvres) souvent waterproof, à démaquiller à part.","faux":1},{"id":"BT0463","k":"h","cat":"clean","w":"피부 결 정돈","rom":"pibu gyeol jeongdon","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"피부+결+정돈","memofr":"Locution : 피부 (peau) + 결 (grain) + 정돈 (mise en ordre)","note":"Variante nominale de 피부결을 정돈하다.","mean":"피부 표면의 미세한 방향과 각질 상태를 일정하고 매끈하게 정돈함.","ex":"세안 후 토너로 피부 결 정돈을 하고 에센스를 바른다.","exfr":"Après le nettoyage, je fais un lissage du grain de peau avec une lotion tonique, puis j'applique l'essence.","fr":"lissage du grain de peau","frpos":"n.m.","frdef":"Rendre la surface de la peau plus lisse et régulière."},{"id":"BT0464","k":"h","cat":"clean","w":"피지 딥 세정","rom":"piji dip sejeong","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"피지+딥(deep)+세정","memofr":"Locution : 피지 (sébum) + 딥 (angl. deep) + 세정 (lavage)","note":"Formule publicitaire mêlant coréen et anglais.","mean":"모공 내부의 피지를 깊이 있게 씻어내는 세안 동작.","ex":"클레이 폼으로 일주일에 한 번 피지 딥 세정을 한다.","exfr":"Une fois par semaine, je fais un nettoyage profond du sébum avec une mousse à l'argile.","fr":"nettoyage profond du sébum","frpos":"n.m.","frdef":"Nettoyage qui élimine le sébum en profondeur dans les pores."},{"id":"BT0465","k":"h","cat":"clean","w":"피지 멜팅","rom":"piji melting","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"피지+멜팅(melting)","memofr":"Locution : 피지 (sébum) + 멜팅 (angl. melting)","note":"Voir aussi 블랙헤드 멜팅.","mean":"굳은 피지를 오일 성분으로 부드럽게 녹여내는 효능.","ex":"따뜻한 오일로 문지르면 피지 멜팅이 되어 블랙헤드가 줄어든다.","exfr":"En massant avec une huile tiède, le sébum se dissout et les points noirs diminuent.","fr":"dissolution du sébum","frpos":"n.f.","frdef":"Faire fondre le sébum durci avec une huile.","par":"피지 연화","rel":"관련어(참고)"},{"id":"BT0466","k":"h","cat":"clean","w":"피지 뭉침","rom":"piji mungchim","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"피지+뭉침(뭉치다+-ㅁ)","memofr":"Locution : 피지 (sébum) + 뭉침 (agglomération, de 뭉치다)","note":"Terme d'avis ; il désigne aussi les petits filaments sébacés.","mean":"피지가 배출되지 못하고 한자리에 덩어리져 굳어있는 현상.","ex":"코 옆에 피지 뭉침이 하얗게 올라와 있었다.","exfr":"Des amas de sébum blanchâtres étaient remontés autour du nez.","fr":"amas de sébum","frpos":"n.m.","frdef":"Sébum accumulé et durci dans les pores.","par":"뭉침","rel":"관련어(참고)"},{"id":"BT0471","k":"h","cat":"clean","w":"피지 연화","rom":"piji yeonhwa","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"피지+연화","memofr":"Locution : 피지 (sébum) + 연화 (ramollissement)","note":"Terme technique ; argument des huiles et des masques.","mean":"딱딱하게 굳은 모공 속 피지를 억지로 뽑지 않고 부드럽게 불려 녹여내는 과정.","ex":"스팀 타월로 피지 연화를 한 뒤에 코 팩을 붙였다.","exfr":"J'ai ramolli le sébum avec une serviette chaude avant de poser un patch pour le nez.","fr":"ramollissement du sébum","frpos":"n.m.","frdef":"Assouplir le sébum durci sans l'extraire de force."},{"id":"BT0472","k":"h","cat":"clean","w":"피지 자갈밭","rom":"piji jagalbat","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"피지+자갈밭(자갈+밭)","memofr":"Locution : 피지 (sébum) + 자갈밭 (champ de cailloux)","note":"Métaphore familière et imagée des avis.","mean":"모공 속에 피지가 오돌토돌 울퉁불퉁 뭉쳐 있는 세안 전 피부 상태 비유.","ex":"세안 전에 코를 만져 보면 피지 자갈밭처럼 오돌토돌하다.","exfr":"Avant le nettoyage, quand je touche mon nez, c'est granuleux comme un « champ de cailloux » de sébum.","fr":"« champ de cailloux » de sébum","frpos":"n.m.","frdef":"Métaphore pour une peau couverte de sébum durci et granuleux.","par":"피지 연화","rel":"관련어(참고)"},{"id":"BT0476","k":"h","cat":"clean","w":"효소 세안","rom":"hyoso sean","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"효소+세안","memofr":"Locution : 효소 (enzyme) + 세안 (nettoyage du visage)","note":"Méthode d'exfoliation douce, d'origine japonaise.","mean":"효소 성분을 활용하여 화학적/생물학적으로 각질을 녹이는 세안 방식.","ex":"효소 세안은 자극이 적어 민감한 피부도 할 수 있다.","exfr":"Le nettoyage enzymatique est peu irritant, même les peaux sensibles peuvent le faire.","fr":"nettoyage enzymatique","frpos":"n.m.","frdef":"Nettoyage utilisant des enzymes pour dissoudre les peaux mortes."},{"id":"BT0477","k":"h","cat":"clean","w":"효소 파우더","rom":"hyoso paudeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"효소+파우더(powder)","memofr":"Locution : 효소 (enzyme) + 파우더 (angl. powder)","note":"Format en poudre à activer avec de l'eau.","mean":"단백질 분해 효소가 들어있어 가루에 물을 묻혀 거품을 내어 각질을 분해하는 클렌저.","ex":"효소 파우더에 물을 섞어 거품을 낸 뒤 코 위주로 문지른다.","exfr":"Je fais mousser la poudre nettoyante enzymatique avec un peu d'eau, puis je frotte surtout sur le nez.","fr":"poudre nettoyante enzymatique","frpos":"n.f.","frdef":"Poudre qui mousse avec l'eau et exfolie grâce aux enzymes."},{"id":"BT0478","k":"h","cat":"clean","w":"T존","rom":"Tjon","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"T(알파벳)+존(zone)","memofr":"Composé : T (lettre latine) + 존 (angl. zone)","note":"Terme international, identique en français.","mean":"이마와 코 줄기를 잇는 T자 모양의 유분 분비가 많은 세안 집중 부위.","ex":"T존에만 기름종이를 눌러 유분을 걷어 낸다.","exfr":"Je ne tamponne du papier matifiant que sur la zone T pour retirer le gras.","fr":"zone T","frpos":"n.f.","frdef":"Front et nez, zone la plus grasse du visage."},{"id":"BT0479","k":"h","cat":"clean","w":"U존","rom":"Ujon","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"U(알파벳)+존(zone)","memofr":"Composé : U (lettre latine) + 존 (angl. zone)","note":"Moins courant en français que « zone T ».","mean":"양 볼과 턱 선을 잇는 U자 모양의 건조해지기 쉬운 피부 영역.","ex":"U존은 건조해서 크림을 한 번 더 덧바른다.","exfr":"La zone U est sèche, alors j'y remets une couche de crème.","fr":"zone U","frpos":"n.f.","frdef":"Joues et contour de la mâchoire, zone souvent plus sèche."},{"id":"BT0480","k":"h","cat":"skin","w":"7스킨법","rom":"7seukinbeop","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"7(숫자)+스킨(skin=토너)+-법","memofr":"Composé : 7 (chiffre) + 스킨 (« toner » en coréen) + -법 (suffixe « méthode »)","note":"Tendance coréenne des années 2010 ; ici, 스킨 signifie « toner » (faux ami).","mean":"토너를 시간차를 두고 여러 번 반복해서 바르는 방법 이름.","ex":"토너를 손바닥에 덜어 여러 번 레이어링하는 7스킨법에 적합한 토너입니다.","exfr":"Une lotion tonique adaptée à la méthode des 7 toners, qui consiste à en superposer plusieurs couches versées dans la paume.","fr":"méthode des 7 toners","frpos":"n.f.","frdef":"Méthode coréenne: appliquer le toner sept fois de suite pour hydrater.","par":"닦토","rel":"관련어(참고)"},{"id":"BT0481","k":"h","cat":"skin","w":"닦토","rom":"dakto","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"닦(다)+토(너) 축약","memofr":"Abréviation syllabique : 닦(다) (essuyer) + 토(너) (angl. toner)","note":"Argot des avis ; pendant de 흡토.","mean":"토너를 묻힌 화장솜으로 피부를 닦는 사용법을 뜻한다.","ex":"확실히 닦토나 토너팩으로 쓰면 자극받은 피부가 빠르게 진정됩니다.","exfr":"Utilisé en toner à essuyer ou en masque au toner, il apaise rapidement la peau irritée.","fr":"toner à essuyer","frpos":"n.m.","frdef":"Abréviation de « dakneun toner » (toner à essuyer) : toner appliqué avec un coton pour essuyer la peau."},{"id":"BT0482","k":"h","cat":"skin","w":"멀티 토너","rom":"meolti toneo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"multi+toner","memofr":"Locution : 멀티 (angl. multi) + 토너 (angl. toner)","note":"Formule marketing.","mean":"닦토·반복 흡수·스킨팩·미스트 등 여러 방식으로 쓰는 토너.","ex":"스킨팩, 닦토 등 다양하게 활용 가능한 멀티 토너입니다.","exfr":"Un toner multi-usages : masque au toner, toner à essuyer, etc.","fr":"toner multi-usages","frpos":"n.m.","frdef":"Toner utilisable en lotion, masque, brume, etc."},{"id":"BT0483","k":"h","cat":"skin","w":"물토너","rom":"multoneo","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"물(고유어)+토너(toner)","memofr":"Composé : 물 (eau) + 토너 (angl. toner)","note":"Expression d'avis ; elle s'oppose à 에센스 토너.","mean":"물처럼 묽게 흐르는 제형의 토너를 가리킨다.","ex":"제형은 가벼운 물토너 형태이지만 보습력이 매우 뛰어납니다.","exfr":"Sa texture est celle d'un toner aqueux léger, mais son pouvoir hydratant est remarquable.","fr":"toner aqueux","frpos":"n.m.","frdef":"Toner très liquide, comme de l'eau."},{"id":"BT0485","k":"h","cat":"skin","w":"미스트 펌프","rom":"miseuteu peompeu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"mist+pump","memofr":"Locution : 미스트 (angl. mist) + 펌프 (angl. pump)","note":"Accessoire vendu séparément pour transformer un toner en brume.","mean":"토너를 안개처럼 분사하여 쓰는 데 사용하는 펌프 도구.","ex":"미스트 펌프 용기가 결합되어 간편하게 분사하여 사용할 수 있습니다.","exfr":"Muni d'une pompe vaporisatrice, il s'applique facilement en brume.","fr":"pompe vaporisatrice","frpos":"n.f.","frdef":"Embout qui transforme un toner en brume.","par":"펌프형","rel":"관련어(참고)"},{"id":"BT0487","k":"h","cat":"skin","w":"세미 겔 패드","rom":"semi gel paedeu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"semi+gel+pad","memofr":"Locution : 세미 (angl. semi) + 겔 (angl. gel) + 패드 (angl. pad)","note":"Format récent des marques coréennes.","mean":"토너를 적셔 피부에 얹어 팩처럼 사용하는 반투명 겔 재질의 패드.","ex":"토너를 듬뿍 적신 세미 겔 패드로 피부를 부드럽게 닦아냅니다.","exfr":"On essuie la peau en douceur avec un disque semi-gel généreusement imbibé de lotion.","fr":"disque semi-gel","frpos":"n.m.","frdef":"Disque à texture gélifiée qu'on imbibe de toner et pose sur la peau.","par":"토너 패드","rel":"하위어(참고)"},{"id":"BT0488","k":"h","cat":"skin","w":"에센스 토너","rom":"esenseu toneo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"essence+toner","memofr":"Locution : 에센스 (angl. essence) + 토너 (angl. toner)","note":"Catégorie hybride propre au marché coréen.","mean":"일반 물토너보다 점도와 보습·영양감을 높인 에센스 제형의 토너.","ex":"포도당 하이드로 성분이 들어간 진한 에센스 토너입니다.","exfr":"Un toner-essence concentré, enrichi en glucose hydratant.","fr":"toner-essence","frpos":"n.m.","frdef":"Toner enrichi, à mi-chemin entre toner et essence."},{"id":"BT0490","k":"h","cat":"skin","w":"캡슐 토너","rom":"kaepsyul toneo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"capsule+toner","memofr":"Locution : 캡슐 (angl. capsule) + 토너 (angl. toner)","note":"Format de niche.","mean":"유효 성분을 담은 미세 캡슐이 들어 있어 바를 때 터지며 흡수되는 토너.","ex":"시카 캡슐이 함유되어 피부를 빠르게 다독여주는 캡슐 토너입니다.","exfr":"Un toner à capsules de cica qui calme rapidement la peau.","fr":"toner à capsules","frpos":"n.m.","frdef":"Toner contenant des microcapsules d'actifs."},{"id":"BT0491","k":"h","cat":"skin","w":"크림 토너","rom":"keurim toneo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"cream+toner","memofr":"Locution : 크림 (angl. cream) + 토너 (angl. toner)","note":"Catégorie hybride propre au marché coréen.","mean":"크림의 보습 특성을 강조하는 토너 유형.","ex":"크림의 보습력을 그대로 담은 크림 토너 제품입니다.","exfr":"Un toner crème qui offre tout le pouvoir hydratant d'une crème.","fr":"toner crème","frpos":"n.m.","frdef":"Toner laiteux enrichi en agents hydratants."},{"id":"BT0492","k":"h","cat":"skin","w":"토너","rom":"toneo","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"toner 차용","memofr":"Emprunt à l'anglais toner","note":"En Corée, on l'appelle aussi 스킨 (faux ami) ; « tonique » ou « lotion tonique » en français.","mean":"세안 뒤 피부에 바르는 기초 화장품을 가리킨다.","ex":"어성초와 히알루론산 성분이 결합된 수분 진정 토너입니다.","exfr":"Une lotion tonique hydratante et apaisante associant houttuynia et acide hyaluronique.","fr":"lotion tonique / tonique","frpos":"n.f. / n.m.","frdef":"Première lotion liquide après le nettoyage ; en Corée aussi appelée « skin » (seukin).","faux":1},{"id":"BT0493","k":"h","cat":"skin","w":"토너 팩","rom":"toneo paek","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"toner+pack","memofr":"Locution : 토너 (angl. toner) + 팩 (angl. pack)","note":"Méthode maison, sans produit dédié ; on applique des cotons imbibés quelques minutes.","mean":"토너를 적신 솜 등을 피부에 올려 팩처럼 사용하는 방법.","ex":"화장솜에 적셔 토너 팩으로 활용하면 피로해진 피부가 금세 진정됩니다.","exfr":"Imbibé sur des cotons et utilisé en masque au toner, il apaise vite la peau fatiguée.","fr":"masque au toner","frpos":"n.m.","frdef":"Cotons imbibés de toner posés sur le visage quelques minutes.","par":"닦토","rel":"관련어(참고)"},{"id":"BT0495","k":"h","cat":"skin","w":"흡토","rom":"heupto","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"흡(수)+토(너) 축약","memofr":"Abréviation syllabique : 흡(수) (absorption) + 토(너) (angl. toner)","note":"Argot des avis ; pendant de 닦토.","mean":"닦아내기보다 피부에 토너를 발라 흡수시키는 사용법.","ex":"피부에 찹찹 두드려 흡수시키는 흡토 전용 제품으로 좋습니다.","exfr":"Idéal comme toner à faire pénétrer en tapotant la peau.","fr":"toner à faire pénétrer","frpos":"n.m.","frdef":"Abréviation de « heupsu-sikineun toner » (toner à faire pénétrer) : toner tapoté pour être absorbé (opposé au toner à essuyer).","par":"닦토","rel":"관련어(참고)"},{"id":"BT0497","k":"h","cat":"skin","w":"물세럼","rom":"mulsereom","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"물+세럼(serum)","memofr":"Composé : 물 (eau) + 세럼 (angl. serum)","note":"Expression d'avis, pas un nom de catégorie officiel.","mean":"물처럼 가벼운 액상 세럼을 가리키는 소비자 표현.","ex":"물세럼을 바르고 그 위에 크림을 덧발라 마무리한다.","exfr":"J'applique un sérum aqueux, puis je termine avec une couche de crème.","fr":"sérum aqueux","frpos":"n.m.","frdef":"Sérum très fluide, presque comme de l'eau."},{"id":"BT0499","k":"h","cat":"skin","w":"부스터","rom":"buseuteo","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"booster 차용","memofr":"Emprunt à l'anglais booster","note":"Étape propre à la routine coréenne, avant le toner ou le sérum.","mean":"세안 직후 가장 먼저 발라 다음 단계의 흡수를 돕는다고 내세우는 기초 제품 유형.","ex":"세안 직후 부스터를 먼저 바르면 다음 단계가 잘 흡수된다.","exfr":"Appliquer un booster juste ap
