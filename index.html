r cuir chevelu.","fr":"essence apaisante pour cuir chevelu","frpos":"n.f.","frdef":"Soin qui calme un cuir chevelu irrité.","par":"두피 스케일러","rel":"관련어(참고)"},{"id":"BT1003","k":"h","cat":"hair","w":"헤어라인앰플","rom":"heeorainaempeul","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"hairline+ampoule","memofr":"Composé : 헤어라인 (angl. hairline) + 앰플 (angl. ampoule)","note":"Produit ciblant les tempes et le front.","mean":"이마 헤어라인에 바르는 앰플.","ex":"헤어라인앰플을 이마 라인에 매일 바르고 있다.","exfr":"J'applique chaque jour une ampoule pour la ligne frontale le long du front.","fr":"ampoule pour la ligne frontale","frpos":"n.f.","frdef":"Soin concentré pour densifier la lisière des cheveux."},{"id":"BT1004","k":"h","cat":"hair","w":"하이드라코트","rom":"haideurakoteu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"hydra+coat(상품명 유래)","memofr":"Composé : 하이드라 (angl. hydra) + 코트 (angl. coat), d'après un nom de produit","note":"Nom commercial devenu descriptif.","mean":"모발에 보습막을 씌운다는 제품명 표현.","ex":"하이드라코트 마스크를 하고 나니 머리에 윤기가 돈다.","exfr":"Après un masque « hydra-coat », mes cheveux sont brillants.","fr":"« hydra-coat » (gainage hydratant)","frpos":"n.m.","frdef":"Nom de soin capillaire formant un film hydratant."},{"id":"BT1005","k":"h","cat":"hair","w":"글로우 헤어 마스크","rom":"geullou heeo maseukeu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"glow+hair mask","memofr":"Locution : 글로우 (angl. glow) + 헤어 마스크 (angl. hair mask)","note":"Formule publicitaire.","mean":"윤기를 준다는 헤어 마스크.","ex":"글로우 헤어 마스크를 오 분 두었다가 헹군다.","exfr":"Je laisse poser le masque capillaire brillance cinq minutes, puis je rince.","fr":"masque capillaire brillance","frpos":"n.m.","frdef":"Masque qui rend les cheveux lumineux."},{"id":"BT1007","k":"h","cat":"nail","w":"시럽 네일","rom":"sireop neil","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"syrup+nail","memofr":"Locution : 시럽 (angl. syrup) + 네일 (angl. nail)","note":"Tendance de manucure coréenne.","mean":"시럽처럼 맑고 투명하게 비치는 색을 얇게 올린 네일.","ex":"맑고 투명하게 시럽처럼 발리는 시럽 네일 컬러입니다.","exfr":"Un vernis « sirop » qui s'applique clair et translucide, comme un sirop.","fr":"vernis « sirop »","frpos":"n.m.","frdef":"Vernis translucide coloré, aspect sirop brillant.","par":"매니큐어","rel":"관련어(참고)"},{"id":"BT1008","k":"h","cat":"nail","w":"네일 강화제","rom":"neil ganghwaje","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"네일(nail)+강화제","memofr":"Locution : 네일 (angl. nail) + 강화제 (agent renforçant)","note":"Produit de soin des ongles.","mean":"얇고 잘 부러지는 손톱에 발라 단단하게 해 주는 제품.","ex":"약해진 손톱을 탄탄하고 건강하게 가꿔주는 네일 강화제입니다.","exfr":"Un durcisseur d'ongles qui rend les ongles fragilisés solides et sains.","fr":"durcisseur d'ongles","frpos":"n.m.","frdef":"Soin qui renforce les ongles fragiles."},{"id":"BT1010","k":"h","cat":"nail","w":"글레이즈드 네일","rom":"geulleijeudeu neil","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"glazed+nail","memofr":"Locution : 글레이즈드 (angl. glazed) + 네일 (angl. nail)","note":"Tendance popularisée en 2022 (« glazed donut nails »).","mean":"도넛 글레이즈처럼 은은한 진주광이 도는 네일.","ex":"글레이즈드 도넛처럼 오묘하고 영롱한 광채를 띠는 네일입니다.","exfr":"Des ongles glacés, aux reflets nacrés et subtils comme un donut glacé.","fr":"ongles glacés (effet nacré)","frpos":"n.m.pl.","frdef":"Tendance d'ongles nacrés comme un donut glacé."},{"id":"BT1011","k":"h","cat":"nail","w":"네일 팁","rom":"neil tip","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"nail+tip","memofr":"Locution : 네일 (angl. nail) + 팁 (angl. tip)","note":"En français, on dit « capsule ».","mean":"손톱 위에 붙여 길이나 모양을 만드는 인조 손톱.","ex":"손쉽게 붙여서 완성할 수 있는 핑거수트 프리미엄 네일 팁입니다.","exfr":"Capsules premium Fingersuit, à coller facilement pour un résultat immédiat.","fr":"capsule (faux ongle)","frpos":"n.f.","frdef":"Faux ongle collé sur l'ongle naturel."},{"id":"BT1012","k":"h","cat":"nail","w":"젤 팁","rom":"jel tip","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"gel+tip","memofr":"Locution : 젤 (angl. gel) + 팁 (angl. tip)","note":"Technique d'extension rapide.","mean":"젤로 만든 부드러운 인조 손톱 팁. 붙인 뒤 램프로 굳힘.","ex":"진짜 젤을 구워 만든 듯 젤 팁 형태로 밀착력이 뛰어납니다.","exfr":"Des capsules en gel à forte adhérence, comme du vrai gel catalysé.","fr":"capsule en gel","frpos":"n.f.","frdef":"Faux ongle en gel.","par":"네일 팁","rel":"관련어(참고)"},{"id":"BT1015","k":"h","cat":"nail","w":"페디","rom":"pedi","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(절단어)","memo":"페디(큐어) 축약","memofr":"Troncation : 페디(큐어) (angl. pedicure)","note":"Graphie variable : 페디 ou 패디.","mean":"「페디큐어」의 줄임말. 발톱에 하는 네일. 「패디」로도 적음.","ex":"여름철 발톱을 깔끔하고 예쁘게 연출해 주는 페디 제품입니다.","exfr":"Un produit pour une pédicure nette et jolie en été.","fr":"pédicure (vernis des pieds)","frpos":"n.f.","frdef":"Abréviation de « pedikyueo » (pédicure) : vernis ou soin des ongles des pieds."},{"id":"BT1018","k":"h","cat":"nail","w":"큐티클 케어","rom":"kyutikeul keeo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"cuticle+care","memofr":"Locution : 큐티클 (angl. cuticle) + 케어 (angl. care)","note":"Étape de base de la manucure.","mean":"손톱 뿌리 쪽 얇은 살(큐티클)을 불려 정리하고 보습하는 관리.","ex":"건조하고 지저분해진 손톱 큐티클 케어를 돕는 오일 제품입니다.","exfr":"Une huile de soin des cuticules sèches et abîmées.","fr":"soin des cuticules","frpos":"n.m.","frdef":"Soin des petites peaux autour de l'ongle."},{"id":"BT1020","k":"h","cat":"nail","w":"네일 앰플","rom":"neil aempeul","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"nail+ampoule","memofr":"Locution : 네일 (angl. nail) + 앰플 (angl. ampoule)","note":"Le terme « ampoule » est repris du soin du visage.","mean":"손톱과 큐티클에 바르는 고농축 영양 제품.","ex":"손톱 주변과 표면에 풍부한 수분과 영양을 주는 네일 앰플입니다.","exfr":"Une ampoule pour ongles qui hydrate et nourrit l'ongle et son contour.","fr":"ampoule pour ongles","frpos":"n.f.","frdef":"Soin concentré pour les ongles."},{"id":"BT1025","k":"h","cat":"nail","w":"네일 오일펜","rom":"neil oilpen","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"nail+oil+pen","memofr":"Locution : 네일 (angl. nail) + 오일 (angl. oil) + 펜 (angl. pen)","note":"Format nomade.","mean":"펜처럼 돌려 짜서 큐티클에 바르는 휴대용 오일.","ex":"펜 타입으로 제작되어 언제 어디서나 간편하게 바르는 네일 오일펜입니다.","exfr":"Un stylo huile pour ongles, à appliquer facilement partout.","fr":"stylo huile pour ongles","frpos":"n.m.","frdef":"Stylo applicateur d'huile pour cuticules."},{"id":"BT1029","k":"h","cat":"nail","w":"네일 영양제","rom":"neil yeongyangje","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"네일+영양제","memofr":"Locution : 네일 (angl. nail) + 영양제 (fortifiant)","note":"Synonyme courant de 네일 강화제.","mean":"손톱에 영양을 주어 갈라짐·부러짐을 줄이는 제품.","ex":"손톱 부러짐과 겹갈라짐을 방지해 주는 전용 네일 영양제입니다.","exfr":"Un fortifiant pour ongles qui prévient la casse et le dédoublement.","fr":"fortifiant pour ongles","frpos":"n.m.","frdef":"Base ou soin qui nourrit et durcit les ongles."},{"id":"BT1034","k":"h","cat":"nail","w":"큐티클 세럼","rom":"kyutikeul sereom","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"cuticle+serum","memofr":"Locution : 큐티클 (angl. cuticle) + 세럼 (angl. serum)","note":"Produit de soin des ongles.","mean":"큐티클을 촉촉하고 부드럽게 하는 세럼.","ex":"지저분하게 올라오는 큐티클을 부드럽게 재워주는 큐티클 세럼입니다.","exfr":"Un sérum qui adoucit et discipline les cuticules qui se soulèvent.","fr":"sérum cuticules","frpos":"n.m.","frdef":"Soin concentré pour les cuticules.","par":"큐티클 케어","rel":"관련어(참고)"},{"id":"BT1044","k":"h","cat":"nail","w":"매니큐어","rom":"maenikyueo","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"manicure 차용(의미 전이: 거짓 짝)","memofr":"Emprunt à l'anglais manicure, avec glissement de sens","note":"Faux ami : en coréen, 매니큐어 désigne le vernis, alors que la « manucure » française est le soin.","mean":"손톱에 바르는 색 액체(네일 폴리시). 한국어에서만 손 관리가 아니라 제품을 가리킴.","ex":"quick-dry 처방으로 60초 만에 빠르게 마르는 시럽 매니큐어입니다.","exfr":"Un vernis à ongles « sirop » à séchage rapide, sec en 60 secondes.","fr":"vernis à ongles","frpos":"n.m.","frdef":"En coréen, désigne le vernis à ongles (le produit), et non le soin des mains comme en français.","faux":1},{"id":"BT1048","k":"h","cat":"nail","w":"필오프 베이스","rom":"piropeu beiseu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"peel-off+base","memofr":"Locution : 필오프 (angl. peel-off) + 베이스 (angl. base)","note":"Évite le dissolvant ; on décolle le vernis d'un seul tenant.","mean":"젤이나 폴리시 밑에 발라 두면 리무버 없이 한 번에 떼어 낼 수 있는 베이스.","ex":"리무버 없이 쏙 떼어낼 수 있도록 돕는 필오프 베이스 코트입니다.","exfr":"Une base pelable qui permet de retirer le vernis sans dissolvant.","fr":"base pelable","frpos":"n.f.","frdef":"Base qui permet de retirer le vernis en le pelant.","par":"매니큐어","rel":"관련어(참고)"},{"id":"BT1050","k":"h","cat":"nail","w":"수성 네일","rom":"suseong neil","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"수성+네일(nail)","memofr":"Locution : 수성 (à base d'eau) + 네일 (angl. nail)","note":"Souvent présenté comme adapté aux enfants et aux femmes enceintes.","mean":"물이 주성분이라 냄새가 적고 리무버 없이 벗겨 내는 네일 폴리시.","ex":"자극적인 냄새 없이 순하게 사용하는 안심 수성 네일입니다.","exfr":"Un vernis à l'eau doux, sans odeur agressive.","fr":"vernis à l'eau","frpos":"n.m.","frdef":"Vernis à base d'eau, peu odorant.","par":"매니큐어","rel":"관련어(참고)"},{"id":"BT1051","k":"h","cat":"nail","w":"노 리무버","rom":"no rimubeo","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"노(no)+리무버(remover)","memofr":"Locution : 노 (angl. no) + 리무버 (angl. remover)","note":"Mention d'emballage.","mean":"리무버를 쓰지 않고 떼어 내거나 벗길 수 있다는 표시.","ex":"아세톤 리무버 없이 간편하게 떼어내어 제거할 수 있는 노리무버 제품입니다.","exfr":"Un vernis qui se retire facilement par pelage, sans dissolvant à l'acétone.","fr":"sans dissolvant","frpos":"loc.adj.","frdef":"Vernis qui s'enlève sans dissolvant.","par":"매니큐어","rel":"관련어(참고)"},{"id":"BT1061","k":"h","cat":"nail","w":"까시레기","rom":"kkasiregi","pos":"명사","unit":"단어","eo":"고유어","form":"단일어","memo":"「거스러미」의 방언·구어형(단일어)","memofr":"Mot simple, forme dialectale ou orale de 거스러미","note":"Registre familier ; la forme standard est 거스러미.","mean":"손톱 옆에 일어난 살 껍질. 「거스러미」의 방언·구어형.","ex":"손가락 주변에 까시레기가 자주 올라올 때 케어 오일을 발라줍니다.","exfr":"Quand des petites peaux apparaissent souvent autour des doigts, j'applique une huile de soin.","fr":"petites peaux (envies)","frpos":"n.f.pl.","frdef":"Mot dialectal et familier désignant les petites peaux autour des ongles (terme standard : geoseureomi).","par":"큐티클 케어","rel":"관련어(참고)"},{"id":"BT1068","k":"h","cat":"hair","w":"모피질","rom":"mopijil","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"모+피질","memofr":"Composé : 모 (poil, cheveu) + 피질 (cortex)","note":"Terme de trichologie.","mean":"머리카락의 가운데 층. 단백질 섬유가 모여 있어 모발의 굵기와 탄력을 결정함.","ex":"탈색을 여러 번 하면 모피질까지 손상되어 머리카락이 끊어진다.","exfr":"Après plusieurs décolorations, même le cortex est abîmé et les cheveux cassent.","fr":"cortex","frpos":"n.m.","frdef":"Partie centrale du cheveu, riche en kératine."},{"id":"BT1069","k":"h","cat":"hair","w":"모수질","rom":"mosujil","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"모+수질","memofr":"Composé : 모 (poil, cheveu) + 수질 (moelle)","note":"Terme de trichologie.","mean":"머리카락 한가운데의 심 부분.","ex":"굵은 머리카락일수록 가운데에 모수질이 뚜렷하다.","exfr":"Plus le cheveu est épais, plus la moelle est visible en son centre.","fr":"moelle du cheveu","frpos":"n.f.","frdef":"Canal central du cheveu (médulla)."},{"id":"BT1070","k":"h","cat":"hair","w":"모발 다공성","rom":"mobal dagongseong","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"모발+다공성","memofr":"Locution : 모발 (cheveux) + 다공성 (porosité)","note":"Notion technique reprise dans les conseils de soin.","mean":"머리카락이 수분과 성분을 흡수하고 내보내는 정도. 손상될수록 높아짐.","ex":"모발 다공성이 높으면 염색이 빨리 들지만 빨리 빠지기도 한다.","exfr":"Avec une forte porosité capillaire, la couleur prend vite mais part vite aussi.","fr":"porosité capillaire","frpos":"n.f.","frdef":"Capacité du cheveu abîmé à absorber et perdre l'eau."},{"id":"BT1072","k":"h","cat":"hair","w":"모발 인장강도","rom":"mobal injanggangdo","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"모발+인장강도","memofr":"Locution : 모발 (cheveux) + 인장강도 (résistance à la traction)","note":"Terme de laboratoire.","mean":"머리카락이 당기는 힘을 끊어지지 않고 견디는 정도.","ex":"펌을 자주 하면 모발 인장강도가 약해져 쉽게 끊어진다.","exfr":"Les permanentes fréquentes affaiblissent la résistance à la traction du cheveu, qui casse facilement.","fr":"résistance à la traction du cheveu","frpos":"n.f.","frdef":"Force que supporte un cheveu avant de casser."},{"id":"BT1073","k":"h","cat":"hair","w":"모발 수분도","rom":"mobal subundo","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"모발+수분도","memofr":"Locution : 모발 (cheveux) + 수분도 (taux d'humidité)","note":"Terme de mesure.","mean":"머리카락이 머금고 있는 수분의 정도.","ex":"겨울에는 모발 수분도가 떨어져 정전기가 잘 생긴다.","exfr":"En hiver, le taux d'hydratation du cheveu baisse et l'électricité statique apparaît facilement.","fr":"taux d'hydratation du cheveu","frpos":"n.m.","frdef":"Quantité d'eau contenue dans la fibre."},{"id":"BT1074","k":"h","cat":"hair","w":"모발 유수분 밸런스","rom":"mobal yusubun baelleonseu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"모발+유수분+밸런스(balance)","memofr":"Locution : 모발 (cheveux) + 유수분 (eau et lipides) + 밸런스 (angl. balance)","note":"Transposition au cheveu d'une notion du soin de la peau.","mean":"머리카락의 수분과 유분이 알맞게 균형을 이룬 상태.","ex":"오일과 미스트를 함께 써서 모발 유수분 밸런스를 맞춘다.","exfr":"J'utilise à la fois une huile et une brume pour régler l'équilibre eau-lipides du cheveu.","fr":"équilibre eau-lipides du cheveu","frpos":"n.m.","frdef":"Équilibre entre hydratation et lipides de la fibre capillaire."},{"id":"BT1075","k":"h","cat":"hair","w":"모발 지질층","rom":"mobal jijilcheung","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"모발+지질층","memofr":"Locution : 모발 (cheveux) + 지질층 (couche lipidique)","note":"Terme technique.","mean":"머리카락 표면을 덮어 윤기와 매끄러움을 주는 기름막.","ex":"잦은 샴푸로 모발 지질층이 벗겨지면 머릿결이 거칠어진다.","exfr":"Quand des shampoings fréquents décapent la couche lipidique du cheveu, il devient rêche.","fr":"couche lipidique du cheveu","frpos":"n.f.","frdef":"Film lipidique protecteur à la surface du cheveu."},{"id":"BT1076","k":"h","cat":"hair","w":"모발 단백질 결합","rom":"mobal danbaekjil gyeolhap","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"모발+단백질+결합","memofr":"Locution : 모발 (cheveux) + 단백질 (protéine) + 결합 (liaison)","note":"Terme technique.","mean":"머리카락 속 단백질 사슬을 서로 이어 주는 결합.","ex":"열과 약제는 모발 단백질 결합을 끊어 손상을 일으킨다.","exfr":"La chaleur et les produits chimiques rompent les liaisons protéiques du cheveu et l'abîment.","fr":"liaisons protéiques du cheveu","frpos":"n.f.pl.","frdef":"Liaisons qui structurent la kératine du cheveu."},{"id":"BT1077","k":"h","cat":"hair","w":"시스틴 결합","rom":"siseutin gyeolhap","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"시스틴(cystine)+결합","memofr":"Locution : 시스틴 (angl. cystine) + 결합 (liaison)","note":"Terme de chimie capillaire.","mean":"머리카락 단백질의 시스틴 사이에 생기는 결합. 모발의 형태를 잡아 줌.","ex":"펌은 시스틴 결합을 끊었다가 다시 이어 컬을 만든다.","exfr":"La permanente rompt le pont disulfure entre résidus de cystine, puis le reforme pour créer la boucle.","fr":"pont disulfure entre résidus de cystine","frpos":"n.m.","frdef":"Liaison entre deux cystéines, clé de la forme du cheveu."},{"id":"BT1078","k":"h","cat":"hair","w":"이황화 결합","rom":"ihwanghwa gyeolhap","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"이황화+결합","memofr":"Locution : 이황화 (disulfure) + 결합 (liaison)","note":"Ce sont ces liaisons qui sont rompues lors d'une permanente.","mean":"황 원자 둘이 이어진 결합. 머리카락의 강도와 모양을 유지함.","ex":"본드 케어 제품은 끊어진 이황화 결합을 다시 이어 준다고 광고한다.","exfr":"Les soins « bond » prétendent reconstituer les ponts disulfure rompus.","fr":"pont disulfure","frpos":"n.m.","frdef":"Liaison soufrée modifiée par les permanentes et lissages."},{"id":"BT1080","k":"h","cat":"hair","w":"가수분해 케라틴","rom":"gasubunhae keratin","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"가수분해+케라틴(keratin)","memofr":"Locution : 가수분해 (hydrolyse) + 케라틴 (angl. keratin)","note":"Nom INCI : Hydrolyzed Keratin.","mean":"흡수되기 쉽게 잘게 쪼갠 케라틴 단백질. 손상 모발 보수 성분.","ex":"가수분해 케라틴이 든 트리트먼트로 손상모를 관리한다.","exfr":"J'entretiens mes cheveux abîmés avec un soin à la kératine hydrolysée.","fr":"kératine hydrolysée","frpos":"n.f.","frdef":"Kératine fragmentée qui se fixe sur le cheveu abîmé.","ing":"한국어: 모발 단백질인 케라틴을 작게 분해한 것. 손상 모발에 흡착해 보강·코팅하는 성분.\nFrançais : La kératine hydrolysée est une kératine fragmentée par hydrolyse en peptides de plus petite taille, utilisée comme agent de conditionnement capillaire.","inci":"Hydrolyzed Keratin"},{"id":"BT1081","k":"h","cat":"hair","w":"아미노산 복합체","rom":"aminosan bokhapche","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"아미노산(amino+산)+복합체","memofr":"Locution : 아미노산 (acide aminé) + 복합체 (complexe)","note":"Terme d'ingrédient.","mean":"여러 아미노산을 섞은 모발·피부 보습과 보수 성분.","ex":"아미노산 복합체가 들어 있어 머릿결이 한결 부드러워졌다.","exfr":"Grâce au complexe d'acides aminés, mes cheveux sont nettement plus doux.","fr":"complexe d'acides aminés","frpos":"n.m.","frdef":"Mélange d'acides aminés hydratants.","ing":"한국어: 여러 아미노산을 섞은 원료를 이르는 말. 보습·모발 컨디셔닝 목적.\nFrançais : Un complexe d'acides aminés est un mélange de plusieurs acides aminés employé comme agent de conditionnement et d'hydratation; sa composition dépend du produit.","inci":"Amino Acids / Arginine, Serine 등(제품별)"},{"id":"BT1082","k":"s","cat":"hair","w":"살리실산","rom":"sallisilsan","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"살리실(salicyl-)+산","memofr":"Composé : 살리실 (angl. salicyl-) + 산 (acide)","note":"Nom chimique coréen ; 살리실릭애씨드 est la graphie de l'étiquetage.","mean":"두피 각질을 녹여 내는 성분. 「살리실릭애씨드」와 같은 성분의 한자어 이름.","ex":"살리실산 샴푸로 두피 각질과 비듬을 관리한다.","exfr":"Je traite les squames et les pellicules avec un shampoing à l'acide salicylique.","fr":"acide salicylique","frpos":"n.m.","frdef":"Nom courant de 살리실릭애씨드 (même molécule), BHA exfoliant.","ing":"한국어: 살리실릭애씨드와 같은 물질의 일반·약학 명칭. 두피·여드름 관리 제품에서는 이 이름으로도 표기됨.\nFrançais : L'acide salicylique est un acide aromatique utilisé dans certains produits pour son action exfoliante et dans les soins des peaux à imperfections.","inci":"Salicylic Acid","par":"살리실릭애씨드","rel":"동의어"},{"id":"BT1083","k":"h","cat":"hair","w":"징크피리치온","rom":"jingkeupirichion","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"zinc pyrithione 차용","memofr":"Emprunt à l'anglais zinc pyrithione","note":"Actif antipelliculaire classique.","mean":"비듬과 가려움 완화에 쓰는 항균 성분.","ex":"징크피리치온이 든 샴푸는 비듬이 심할 때만 쓴다.","exfr":"Je n'utilise un shampoing à la pyrithione de zinc que quand les pellicules sont importantes.","fr":"pyrithione de zinc","frpos":"n.f.","frdef":"Antipelliculaire autorisé en Corée mais interdit dans les cosmétiques de l'UE depuis 2022.","ing":"한국어: 항진균 비듬 관리 성분. 한국에서는 비듬·가려움 완화 의약외품 샴푸 성분이지만, EU에서는 2022년부터 화장품 사용이 금지됨 — 프랑스 독자에게 주의 필요.\nFrançais : La pyrithione de zinc est un composé du zinc à activité antifongique et antimicrobienne; son utilisation cosmétique est soumise à des restrictions réglementaires selon le marché.","inci":"Zinc Pyrithione"},{"id":"BT1084","k":"h","cat":"hair","w":"피록톤올아민","rom":"piroktonoramin","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"piroctone olamine 차용","memofr":"Emprunt à l'anglais piroctone olamine","note":"Actif antipelliculaire ; nom INCI identique.","mean":"비듬 원인균을 억제하는 샴푸 성분.","ex":"피록톤올아민 성분의 비듬 샴푸를 일주일에 두 번 쓴다.","exfr":"J'utilise deux fois par semaine un shampoing antipelliculaire à la piroctone olamine.","fr":"piroctone olamine","frpos":"n.f.","frdef":"Actif antipelliculaire autorisé dans l'UE.","ing":"한국어: 항진균 비듬 관리 성분(옥토피록스). EU에서도 화장품 사용이 허용된 비듬 성분.\nFrançais : La piroctone olamine est le sel d'éthanolamine de la piroctone, utilisé notamment dans certains produits antipelliculaires pour son activité antifongique.","inci":"Piroctone Olamine"},{"id":"BT1085","k":"h","cat":"hair","w":"덱스판테놀","rom":"dekseupantenol","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"dexpanthenol 차용","memofr":"Emprunt à l'anglais dexpanthenol","note":"Forme active du panthénol.","mean":"판테놀(비타민 B5 유도체). 두피와 모발 보습·진정 성분.","ex":"덱스판테놀이 든 두피 토닉을 가르마에 뿌린다.","exfr":"Je vaporise sur la raie un tonique pour cuir chevelu au dexpanthénol.","fr":"dexpanthénol","frpos":"n.m.","frdef":"Forme active (D) du panthénol.","ing":"한국어: 판테놀 중 생물학적으로 활성인 D형(D-판테놀). 의약품·의약외품에서 쓰이는 명칭.\nFrançais : Le dexpanthénol est l'isomère D du panthénol, une provitamine B5 utilisée pour ses propriétés humectantes et conditionnantes.","inci":"Panthenol (D-Panthenol / Dexpanthenol)","par":"판테놀","rel":"관련어(참고)"},{"id":"BT1088","k":"h","cat":"hair","w":"두피 마이크로바이옴","rom":"dupi maikeurobaiom","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"두피+마이크로바이옴(microbiome)","memofr":"Locution : 두피 (cuir chevelu) + 마이크로바이옴 (angl. microbiome)","note":"Tendance scientifique reprise par le marketing.","mean":"두피에 사는 미생물의 균형 상태.","ex":"두피 마이크로바이옴이 무너지면 비듬과 가려움이 심해진다.","exfr":"Quand le microbiome du cuir chevelu est déséquilibré, pellicules et démangeaisons s'aggravent.","fr":"microbiome du cuir chevelu","frpos":"n.m.","frdef":"Micro-organismes vivant sur le cuir chevelu."},{"id":"BT1090","k":"h","cat":"hair","w":"두피 민감도","rom":"dupi mingamdo","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"두피+민감도","memofr":"Locution : 두피 (cuir chevelu) + 민감도 (degré de sensibilité)","note":"Terme de diagnostic capillaire.","mean":"두피가 자극에 반응하는 정도.","ex":"염색 뒤에는 두피 민감도가 높아져 순한 샴푸를 쓴다.","exfr":"Après une coloration, la sensibilité du cuir chevelu augmente, alors j'utilise un shampoing doux.","fr":"sensibilité du cuir chevelu","frpos":"n.f.","frdef":"Réactivité du cuir chevelu."},{"id":"BT1091","k":"h","cat":"hair","w":"두피 각질 탈락","rom":"dupi gakjil tallak","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"두피+각질+탈락","memofr":"Locution : 두피 (cuir chevelu) + 각질 (squames) + 탈락 (chute)","note":"Terme technique pour désigner les pellicules.","mean":"두피 각질이 비늘처럼 떨어져 나오는 현상.","ex":"환절기에는 두피 각질 탈락이 심해 어깨에 하얗게 떨어진다.","exfr":"À l'entre-saison, la desquamation du cuir chevelu est forte et les squames tombent en blanc sur les épaules.","fr":"desquamation du cuir chevelu","frpos":"n.f.","frdef":"Chute de squames du cuir chevelu."},{"id":"BT1103","k":"s","cat":"hair","w":"큐티클 들뜸","rom":"kyutikeul deultteum","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"큐티클(cuticle)+들뜸","memofr":"Locution : 큐티클 (angl. cuticle) + 들뜸 (soulèvement)","note":"Ici, il s'agit de la cuticule du cheveu, pas de celle de l'ongle.","mean":"머리카락 겉의 비늘층(큐티클)이 벌어져 일어난 상태.","ex":"탈색한 머리는 큐티클 들뜸이 심해 빗질할 때 걸린다.","exfr":"Sur les cheveux décolorés, les écailles sont très soulevées et accrochent au brossage.","fr":"écailles soulevées","frpos":"n.f.pl.","frdef":"Cuticules ouvertes rendant le cheveu terne et poreux.","par":"뜨다","rel":"연어"},{"id":"BT1104","k":"h","cat":"hair","w":"모발 엉킴","rom":"mobal eongkim","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"모발+엉킴(엉키다+-ㅁ)","memofr":"Locution : 모발 (cheveux) + 엉킴 (enchevêtrement)","note":"Terme de fiche produit.","mean":"머리카락이 서로 얽혀 빗질이 되지 않는 상태.","ex":"머리가 길어서 감고 나면 모발 엉킴이 심하다.","exfr":"J'ai les cheveux longs : après le shampoing, ils font beaucoup de nœuds.","fr":"nœuds","frpos":"n.m.pl.","frdef":"Cheveux emmêlés."},{"id":"BT1106","k":"h","cat":"hair","w":"습기 부스스함","rom":"seupgi buseuseuham","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"습기+부스스함","memofr":"Locution : 습기 (humidité) + 부스스함 (aspect ébouriffé)","note":"Problème récurrent pendant la saison des pluies (장마).","mean":"습한 날 머리카락이 수분을 먹고 부풀어 푸석하게 뜨는 상태.","ex":"장마철에는 습기 부스스함 때문에 에센스를 꼭 바른다.","exfr":"À la saison des pluies, j'applique toujours une essence à cause des frisottis dus à l'humidité.","fr":"frisottis dus à l'humidité","frpos":"n.m.pl.","frdef":"Cheveux qui gonflent par temps humide."},{"id":"BT1107","k":"h","cat":"hair","w":"잔머리 픽싱","rom":"janmeori piksing","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"잔머리+픽싱(fixing)","memofr":"Locution : 잔머리 (petits cheveux) + 픽싱 (angl. fixing)","note":"Produit typique : stick fixateur.","mean":"이마나 목덜미의 짧은 잔머리를 붙여 고정하는 것.","ex":"묶은 머리에 스틱을 발라 잔머리 픽싱을 했다.","exfr":"J'ai assuré la fixation des petits cheveux de ma coiffure attachée avec un stick.","fr":"fixation des petits cheveux","frpos":"n.f.","frdef":"Discipliner les petits cheveux rebelles (baby hair)."},{"id":"BT1108","k":"h","cat":"hair","w":"뿌리 볼륨","rom":"ppuri bollyum","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"뿌리+볼륨(volume)","memofr":"Locution : 뿌리 (racine) + 볼륨 (angl. volume)","note":"Formule de coiffage.","mean":"머리 뿌리 쪽이 살아 풍성해 보이는 것.","ex":"정수리가 납작해 보여서 뿌리 볼륨 스프레이를 뿌렸다.","exfr":"Le sommet de ma tête paraissait plat, alors j'ai vaporisé un spray volume aux racines.","fr":"volume aux racines","frpos":"n.m.","frdef":"Volume obtenu en décollant les racines."},{"id":"BT1109","k":"h","cat":"nail","w":"젤 네일","rom":"jel neil","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"gel+nail","memofr":"Locution : 젤 (angl. gel) + 네일 (angl. nail)","note":"Technique la plus courante dans les salons coréens.","mean":"UV·LED 램프로 굳히는 젤 매니큐어.","ex":"일반 매니큐어보다 광택과 지속력이 우수한 젤 네일 아트입니다.","exfr":"Un nail art en vernis gel, plus brillant et plus tenace qu'un vernis classique.","fr":"vernis gel (semi-permanent)","frpos":"n.m.","frdef":"Vernis durci sous lampe UV/LED."},{"id":"BT1110","k":"h","cat":"nail","w":"젤 폴리시","rom":"jel pollisi","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"gel+polish","memofr":"Locution : 젤 (angl. gel) + 폴리시 (angl. polish)","note":"Terme professionnel.","mean":"젤 네일용 컬러 제품.","ex":"젤 램프에 구워 간편하고 매끈하게 마감되는 젤 폴리시 제품입니다.","exfr":"Un vernis semi-permanent qui se catalyse sous lampe pour un fini lisse et net.","fr":"vernis semi-permanent","frpos":"n.m.","frdef":"Produit de vernis semi-permanent.","par":"젤 네일","rel":"관련어(참고)"},{"id":"BT1111","k":"h","cat":"nail","w":"자석 네일","rom":"jaseok neil","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"자석+네일(nail)","memofr":"Locution : 자석 (aimant) + 네일 (angl. nail)","note":"En français, on parle aussi d'« œil de chat ».","mean":"자석으로 무늬를 만드는 금속 입자 젤 네일.","ex":"자석을 가져다 대면 오묘한 광채 패턴이 생기는 자석 네일 디자인입니다.","exfr":"Un design de vernis magnétique : en approchant un aimant, un motif chatoyant apparaît.","fr":"vernis magnétique (œil de chat)","frpos":"n.m.","frdef":"Vernis à particules métalliques modelées par un aimant."},{"id":"BT1112","k":"h","cat":"nail","w":"오로라 네일","rom":"orora neil","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"aurora+nail","memofr":"Locution : 오로라 (aurore) + 네일 (angl. nail)","note":"Tendance de décoration.","mean":"오로라처럼 여러 빛깔로 반사되는 네일.","ex":"보는 각도에 따라 영롱하게 빛나는 오로라 네일 스타일입니다.","exfr":"Des ongles aurore qui scintillent différemment selon l'angle.","fr":"ongles aurore","frpos":"n.m.pl.","frdef":"Effet irisé multicolore."},{"id":"BT1114","k":"h","cat":"nail","w":"미러 네일","rom":"mireo neil","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"mirror+nail","memofr":"Locution : 미러 (angl. mirror) + 네일 (angl. nail)","note":"Proche de 크롬 네일.","mean":"거울처럼 반사되는 금속성 네일.","ex":"거울처럼 반사되는 파우더를 얹어 연출하는 미러 네일 아트입니다.","exfr":"Un nail art « ongles miroir » réalisé avec une poudre réfléchissante comme un miroir.","fr":"ongles miroir","frpos":"n.m.pl.","frdef":"Effet métallique réfléchissant."},{"id":"BT1115","k":"h","cat":"nail","w":"크롬 네일","rom":"keurom neil","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"chrome+nail","memofr":"Locution : 크롬 (angl. chrome) + 네일 (angl. nail)","note":"Proche de 미러 네일.","mean":"크롬 파우더로 금속 광택을 낸 네일.","ex":"메탈릭한 느낌을 주는 유니크한 스타일의 크롬 네일 팁입니다.","exfr":"Des capsules pour ongles chromés, au style unique et métallique.","fr":"ongles chromés","frpos":"n.m.pl.","frdef":"Poudre chromée pour un fini métallique."},{"id":"BT1116","k":"h","cat":"nail","w":"물광 네일","rom":"mulgwang neil","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"물광+네일(nail)","memofr":"Locution : 물광 (éclat mouillé) + 네일 (angl. nail)","note":"Le mot 물광 vient du soin du visage.","mean":"물에 젖은 듯 광이 나는 네일.","ex":"투명하고 촉촉해 보이는 광채를 띠는 물광 네일 디자인입니다.","exfr":"Un design d'ongles « effet mouillé », transparents et brillants.","fr":"ongles « effet mouillé »","frpos":"n.m.pl.","frdef":"Ongles très brillants comme mouillés.","par":"물광","rel":"관련어(참고)"},{"id":"BT1117","k":"h","cat":"nail","w":"자개 네일","rom":"jagae neil","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"자개(고유어)+네일(nail)","memofr":"Locution : 자개 (nacre) + 네일 (angl. nail)","note":"Clin d'œil à la marqueterie de nacre traditionnelle coréenne (나전칠기).","mean":"자개 조각으로 장식한 네일.","ex":"천연 자개를 얹은 듯 영롱한 빛을 내는 프리미엄 자개 네일 스타일입니다.","exfr":"Un style d'ongles nacrés premium, aux reflets chatoyants comme une incrustation de nacre naturelle.","fr":"ongles nacrés","frpos": :"h","cat":"nail","w":"젤 베이스","rom":"jel beiseu","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"gel+base","memofr":"Locution : 젤 (angl. gel) + 베이스 (angl. base)","note":"Première couche de la pose.","mean":"젤 네일의 첫 단계 바탕 젤.","ex":"컬러를 올리기 전 손톱 표면을 보호해 주는 젤 베이스 코트입니다.","exfr":"Une base gel qui protège la surface de l'ongle avant la couleur.","fr":"base gel","frpos":"n.f.","frdef":"Première couche du vernis gel.","par":"젤 네일","rel":"관련어(참고)"},{"id":"BT1143","k":"h","cat":"nail","w":"탑 젤","rom":"tap jel","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"top+gel","memofr":"Locution : 탑 (angl. top) + 젤 (angl. gel)","note":"Dernière couche de la pose.","mean":"젤 네일의 마무리 코팅 젤.","ex":"광택을 오래 보존하고 스크래치를 방지해 주는 전용 탑 젤입니다.","exfr":"Un top gel qui préserve longtemps la brillance et évite les rayures.","fr":"top gel","frpos":"n.m.","frdef":"Couche de finition du vernis gel.","par":"젤 네일","rel":"관련어(참고)"},{"id":"BT1144","k":"h","cat":"nail","w":"미경화 젤","rom":"migyeonghwa jel","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"미경화+젤(gel)","memofr":"Locution : 미경화 (non durci) + 젤 (angl. gel)","note":"Couche collante à retirer avec un dégraissant.","mean":"램프 경화 후 표면에 남는 끈적한 젤 층.","ex":"경화 후 표면에 남아있는 미경화 젤을 전용 클렌저로 깨끗이 닦아줍니다.","exfr":"Après catalyse, on essuie soigneusement le gel non polymérisé en surface avec un dégraissant dédié.","fr":"gel non polymérisé","frpos":"n.m.","frdef":"Couche résiduelle collante présente à la surface de certains gels après polymérisation sous lampe.","par":"젤 네일","rel":"관련어(참고)"},{"id":"BT1145","k":"h","cat":"nail","w":"젤 경화","rom":"jel gyeonghwa","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"젤(gel)+경화","memofr":"Locution : 젤 (angl. gel) + 경화 (durcissement)","note":"Terme technique.","mean":"램프로 젤을 굳히는 것.","ex":"LED 램프에 넣어 30초 동안 젤 경화를 진행하면 단단하게 굳습니다.","exfr":"Sous lampe LED, le gel polymérise en 30 secondes (respecter le temps recommandé).","fr":"polymérisation du gel","frpos":"n.f.","frdef":"Durcissement du gel sous lampe.","par":"젤 네일","rel":"관련어(참고)"},{"id":"BT1147","k":"h","cat":"nail","w":"팁 제거","rom":"tip jegeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"팁(tip)+제거","memofr":"Locution : 팁 (angl. tip) + 제거 (retrait)","note":"Prestation de salon.","mean":"인조 손톱 팁을 떼어내는 것.","ex":"전용 리무버를 사용해 우드 스틱으로 부드럽게 팁 제거를 진행합니다.","exfr":"On procède au retrait des capsules en douceur, avec un bâtonnet en bois et un dissolvant dédié.","fr":"retrait des capsules","frpos":"n.m.","frdef":"Enlever les faux ongles.","par":"네일 팁","rel":"관련어(참고)"},{"id":"BT1502","k":"h","cat":"gen","w":"N통째","rom":"Ntongjjae","pos":"명사","unit":"단어","eo":"혼종어","form":"파생어","memo":"N(수)+통+-째(차례 접미사)","memofr":"Dérivé : N (nombre) + 통 (contenant) + -째 (suffixe ordinal)","note":"Argot des avis pour prouver sa fidélité à un produit (« j'en suis à mon énième pot »).","mean":"같은 제품을 여러 통 비움","ex":"이 클렌징 오일은 벌써 N통째 쓰고 있는 재구매템이다.","exfr":"Cette huile démaquillante, j'en suis déjà à mon énième flacon : je la rachète sans cesse.","fr":"énième flacon","frpos":"n.m.","frdef":"Fait d'en être à son Nième flacon d'un même produit (fidélité).","par":"인생템","rel":"관련어(참고)"},{"id":"BT1481","k":"h","cat":"gen","w":"갈웜","rom":"garwom","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"(가)을→갈+웜(톤) 축약","memofr":"Abréviation syllabique : 갈 (de 가을, automne) + 웜 (de 웜톤, ton chaud)","note":"Argot de colorimétrie ; série : 봄웜, 여쿨, 갈웜, 겨쿨.","mean":"가을웜톤","ex":"갈웜이라 차가운 핑크보다 브라운 계열 립이 잘 어울린다.","exfr":"Je suis automne chaud : les rouges à lèvres bruns me vont mieux que les roses froids.","fr":"automne chaud (colorimétrie)","frpos":"n.m.","frdef":"Abréviation familière de 가을웜톤 (« automne chaud ») : en colorimétrie, personne au sous-ton chaud à qui vont les couleurs chaudes, profondes et douces.","par":"퍼스널컬러","rel":"관련어(참고)"},{"id":"BT1532","k":"h","cat":"gen","w":"갓성비","rom":"gatseongbi","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(혼성어)","memo":"갓(God)+가성비의 혼성","memofr":"Mot-valise : 갓 (angl. God) + 가성비 (rapport qualité-prix)","note":"Argot internet ; le préfixe 갓- (« divin ») est très productif.","mean":"가성비가 매우 뛰어남(갓+가성비)","ex":"정가의 절반 가격에 기획세트까지 주니 진짜 갓성비다.","exfr":"À moitié prix avec un coffret en plus, c'est un rapport qualité-prix imbattable.","fr":"rapport qualité-prix imbattable","frpos":"n.m.","frdef":"Rapport qualité-prix exceptionnel (de l’anglais « God » + 가성비, rapport qualité-prix).","par":"가성비","rel":"관련어(참고)"},{"id":"BT1445","k":"h","cat":"gen","w":"겨쿨","rom":"gyeokul","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"겨(울)+쿨(톤) 축약","memofr":"Abréviation syllabique : 겨(울) (hiver) + 쿨(톤) (ton froid)","note":"Voir la série des saisons en colorimétrie.","mean":"겨울쿨톤","ex":"19호 정도의 밝은 겨쿨인데 이 쿠션 색이 잘 맞았다.","exfr":"Je suis un hiver froid assez clair, teinte 19, et la couleur de ce cushion m'allait bien.","fr":"hiver froid (colorimétrie)","frpos":"n.m.","frdef":"Abréviation familière de 겨울쿨톤 (« hiver froid ») : personne au sous-ton froid à qui vont les couleurs intenses et contrastées.","par":"퍼스널컬러","rel":"관련어(참고)"},{"id":"BT1587","k":"h","cat":"gen","w":"곰손","rom":"gomson","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"곰+손","memofr":"Composé : 곰 (ours) + 손 (main)","note":"Familier et autodérisoire ; contraire : 금손 (« mains en or »).","mean":"화장·손재주가 서툰 사람(↔금손)","ex":"곰손도 쉽게 그릴 수 있을 만큼 펜슬이 부드럽다.","exfr":"Le crayon est si doux que même ceux qui ont deux mains gauches peuvent tracer facilement.","fr":"avoir deux mains gauches (fam.)","frpos":"loc.v.","frdef":"Se dit d’une personne maladroite en maquillage (contraire de 금손, « mains d’or »)."},{"id":"BT1609","k":"h","cat":"gen","w":"극지성","rom":"geukjiseong","pos":"명사","unit":"단어","eo":"한자어","form":"파생어","memo":"극-+지성","memofr":"Dérivé : 극- (préfixe « extrême ») + 지성 (peau grasse)","note":"Synonyme de 악지성.","mean":"피지 분비가 매우 많은 지성","ex":"남자친구가 극지성이라 노세범 선크림을 따로 사 줬다.","exfr":"Mon copain a la peau extrêmement grasse, alors je lui ai acheté une crème solaire matifiante.","fr":"peau extrêmement grasse","frpos":"n.f.","frdef":"Peau qui produit énormément de sébum.","par":"악지성","rel":"관련어(참고)"},{"id":"BT1455","k":"h","cat":"gen","w":"근본템","rom":"geunbontem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"근본+-템","memofr":"Composé : 근본 (fondement) + -템 (de l'angl. item)","note":"Argot des avis ; 근본 signifie ici « authentique, classique ».","mean":"그 분야의 기본·대표 제품","ex":"쿠션 근본템이라 처음 써 봤는데 왜 유명한지 알겠다.","exfr":"Ce cushion est un produit de base incontournable : en l'essayant pour la première fois, j'ai compris pourquoi il est si célèbre.","fr":"produit de base incontournable","frpos":"n.m.","frdef":"Produit de référence d'une catégorie.","par":"인생템","rel":"관련어(참고)"},{"id":"BT1494","k":"h","cat":"gen","w":"기초 단계","rom":"gicho dangye","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"기초+단계","memofr":"Locution : 기초 (base) + 단계 (étape)","note":"En Corée, 기초 désigne les soins de la peau, par opposition au maquillage (색조).","mean":"색조 전 스킨·로션 등 기본 관리 단계","ex":"선크림 하나로 톤업까지 되니 기초 단계를 줄일 수 있다.","exfr":"Comme une seule crème solaire suffit aussi pour le tone-up, on peut réduire les étapes de soin de base.","fr":"étapes de soin de base","frpos":"n.f.pl.","frdef":"Étapes de soin avant le maquillage (toner, essence, crème…)."},{"id":"BT1556","k":"h","cat":"gen","w":"기초템","rom":"gichotem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"기초+-템","memofr":"Composé : 기초 (soins de base) + -템 (de l'angl. item)","note":"Argot des avis.","mean":"기초 스킨케어 아이템","ex":"매일 쓰는 기초템이라 대용량 이벤트 때 쟁여 둔다.","exfr":"C'est un produit de soin de base que j'utilise tous les jours, alors j'en fais des réserves pendant les promos grand format.","fr":"produit de soin de base","frpos":"n.m.","frdef":"Produit de la routine de soin (non maquillage).","par":"인생템","rel":"관련어(참고)"},{"id":"BT1607","k":"h","cat":"gen","w":"꿀조합","rom":"kkuljohap","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"꿀(접두사적: 매우 좋은)+조합","memofr":"Composé : 꿀 (« super », sens figuré) + 조합 (combinaison)","note":"En argot, 꿀- signifie « excellent » (꿀팁, 꿀템).","mean":"함께 쓰면 효과·궁합이 좋은 제품 조합","ex":"토너와 앰플을 같이 쓰는 꿀조합을 공유한다.","exfr":"Je partage ma combinaison gagnante : lotion tonique et ampoule ensemble.","fr":"combinaison gagnante","frpos":"n.f.","frdef":"Association de produits qui fonctionne particulièrement bien.","par":"잘 받다","rel":"관련어(참고)"},{"id":"BT1570","k":"h","cat":"gen","w":"내돈내산","rom":"naedonnaesan","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"내 돈(으로) 내(가) 산 축약","memofr":"Abréviation syllabique : 내 돈 (mon argent) + 내 (moi-même) + 산 (acheté)","note":"Mention de transparence dans les avis, qui garantit l'absence de partenariat.","mean":"내 돈으로 내가 산(광고 아닌) 구매","ex":"광고가 아니라 내돈내산으로 산 제품이다.","exfr":"Ce n'est pas une publicité : je l'ai acheté avec mon propre argent.","fr":"acheté avec mon propre argent","frpos":"loc.adj.","frdef":"Mention d'un avis non sponsorisé (« mon argent, mon achat »)."},{"id":"BT1538","k":"h","cat":"gen","w":"라이트톤","rom":"raiteuton","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"light+tone","memofr":"Composé : 라이트 (angl. light) + 톤 (angl. tone)","note":"Terme de colorimétrie personnelle.","mean":"밝은 명도 계열 퍼스널컬러","ex":"이 팔레트는 라이트톤에게 특히 추천할 만하다.","exfr":"Je recommande particulièrement cette palette aux tons clairs.","fr":"tons clairs (colorimétrie)","frpos":"n.m.pl.","frdef":"Profil auquel conviennent les couleurs claires et lumineuses.","par":"퍼스널컬러","rel":"관련어(참고)"},{"id":"BT1605","k":"h","cat":"gen","w":"스피큘 화장품","rom":"seupikyul hwajangpum","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"스피큘(spicule)+화장품; VT 「리들샷」 유행으로 널리 알려짐","memofr":"Locution : 스피큘 (angl. spicule) + 화장품 (cosmétique)","note":"Désignation générique choisie pour éviter un nom de marque ; voir 스피큘.","mean":"바늘 모양의 미세한 입자(스피큘)를 넣어 바를 때 따끔한 자극을 주며 흡수를 돕는다고 내세우는 화장품.","ex":"스피큘 화장품은 처음 바르면 따끔해서 순한 단계부터 쓴다.","exfr":"Un soin à spicules picote à la première application, alors je commence par la version la plus douce.","fr":"soin à spicules","frpos":"n.m.","frdef":"Soin (sérum, ampoule, crème) contenant des spicules, minuscules aiguilles naturelles qui picotent et favorisent la pénétration des actifs ; popularisé en Corée par le « Reedle Shot ».","par":"스피큘","rel":"관련어(참고)"},{"id":"BT1462","k":"h","cat":"gen","w":"립따","rom":"riptta","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(혼성어)","memo":"립(lip)+(번)따 — 「번따」를 본뜬 혼성어; 「립따를 당하다」로 씀","memofr":"Mot-valise : 립 (angl. lip) + (번)따 (de 번따, « demander le numéro de téléphone »)","note":"Argot récent et humoristique ; s’emploie dans la tournure 립따를 당하다 (« se faire demander sa teinte »).","mean":"모르는 사람에게서 지금 바른 립 제품이 무엇인지 질문을 받음(「번따」에서 유추한 말)","ex":"새로 산 틴트를 바르고 나간 날 처음 보는 사람에게 립따를 당했다.","exfr":"Le jour où je suis sortie avec mon nouveau tint, je me suis fait demander la référence de mon rouge à lèvres par une inconnue.","fr":"se faire demander la référence de son rouge à lèvres (fam.)","frpos":"loc.v.","frdef":"Argot : se faire aborder par un inconnu qui demande quel produit pour les lèvres on porte (formé sur 번따, « se faire demander son numéro »)."},{"id":"BT1482","k":"h","cat":"gen","w":"멀멀하다","rom":"meolmeolhada","pos":"형용사","unit":"단어","eo":"고유어","form":"파생어","memo":"멀멀(어근)+-하다 (신어) / 신조어(표준국어대사전 미등재)","memofr":"Dérivé : 멀멀 (racine expressive) + -하다 (suffixe adjectival)","note":"Néologisme absent du dictionnaire de référence ; propre au vocabulaire de la colorimétrie.","mean":"채도가 낮고 탁하게 부드러운 색","ex":"멀멀한 색감을 기대했는데 생각보다 진하게 발색됐다.","exfr":"Je m'attendais à une couleur adoucie et grisée, mais elle est plus intense que prévu.","fr":"adouci et grisé (couleur)","frpos":"loc.adj.","frdef":"Se dit d'une couleur peu saturée, douce et légèrement terne.","par":"뮤트톤","rel":"관련어(참고)"},{"id":"BT1480","k":"h","cat":"gen","w":"봄라","rom":"bomna","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"봄+라(이트) 축약","memofr":"Abréviation syllabique : 봄 (printemps) + 라(이트) (angl. light)","note":"Série de la colorimétrie saisonnière ; voir 봄웜.","mean":"봄 라이트(봄웜톤 라이트)","ex":"봄라를 위한 신상 컬러가 나와서 바로 구매했다.","exfr":"Une nouvelle couleur est sortie pour les printemps clairs, je l'ai achetée aussitôt.","fr":"printemps clair (colorimétrie)","frpos":"n.m.","frdef":"Abréviation familière de 봄웜라이트 : sous-type « printemps clair » (sous-ton chaud, couleurs claires et lumineuses).","par":"퍼스널컬러","rel":"관련어(참고)"},{"id":"BT1442","k":"h","cat":"gen","w":"봄웜","rom":"bomwom","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"봄+웜톤(warm tone)","memofr":"Abréviation : 봄 (printemps) + 웜(톤) (ton chaud, angl. warm tone)","note":"Les types saisonniers sont très utilisés en Corée pour choisir son maquillage.","mean":"「봄웜톤」의 줄임말. 노란 기가 도는 따뜻한 피부에 밝고 선명한 색이 어울리는 퍼스널컬러 유형.","ex":"봄웜이라 코랄 계열 립을 바르면 얼굴이 환해 보인다.","exfr":"Je suis printemps chaud : les rouges à lèvres corail illuminent mon visage.","fr":"printemps chaud (colorimétrie)","frpos":"n.m.","frdef":"Abréviation familière de 봄웜톤 (« printemps chaud ») : personne au sous-ton chaud à qui vont les couleurs claires, vives et lumineuses.","par":"퍼스널컬러","rel":"관련어(참고)"},{"id":"BT1463","k":"h","cat":"gen","w":"상페","rom":"sangpe","pos":"명사","unit":"단어","eo":"한자어","form":"축약어(두음절어)","memo":"상(세)+페(이지) 축약","memofr":"Abréviation syllabique : 상(세) (détail) + 페(이지) (angl. page)","note":"Argot du commerce en ligne.","mean":"상세페이지(상품 상세 설명 페이지)","ex":"상페 설명처럼 뉴트럴한 로즈핑크 색이다.","exfr":"Comme le dit la description de la page produit, c'est un rose neutre.","fr":"page produit (abrév.)","frpos":"n.f.","frdef":"Abréviation de « 상세페이지 », la page détaillée d'un produit en ligne."},{"id":"BT1547","k":"h","cat":"gen","w":"색조","rom":"saekjo","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"색+조","memofr":"Composé : 색 (couleur) + 조 (ton)","note":"S'oppose à 기초 (soins) : 색조 désigne tout le maquillage coloré.","mean":"색을 표현하는 메이크업 제품군","ex":"기초부터 색조, 각종 도구까지 다 들어가는 큰 파우치다.","exfr":"Une grande trousse qui contient tout : soins de base, maquillage couleur et accessoires.","fr":"maquillage couleur","frpos":"n.m.","frdef":"Catégorie coréenne: produits de maquillage colorés, opposés aux soins (기초)."},{"id":"BT1526","k":"h","cat":"gen","w":"여쿨","rom":"yeokul","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"여(름)+쿨(톤) 축약","memofr":"Abréviation syllabique : 여(름) (été) + 쿨(톤) (ton froid)","note":"Série de la colorimétrie saisonnière.","mean":"여름쿨톤","ex":"여쿨과 겨쿨 모두 무난하게 쓸 수 있는 팔레트다.","exfr":"Une palette que les étés froids comme les hivers froids peuvent utiliser sans problème.","fr":"été froid (colorimétrie)","frpos":"n.m.","frdef":"Abréviation familière de 여름쿨톤 (« été froid ») : personne au sous-ton froid à qui vont les couleurs douces et pastel.","par":"퍼스널컬러","rel":"관련어(참고)"},{"id":"BT1527","k":"h","cat":"gen","w":"여쿨라","rom":"yeokulla","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"여(름)+쿨+라(이트) 축약","memofr":"Abréviation syllabique : 여(름) (été) + 쿨 (angl. cool) + 라(이트) (angl. light)","note":"Sous-type de 여쿨 ; montre la finesse de la classification coréenne.","mean":"여름쿨톤 라이트","ex":"여쿨라는 이 20구 팔레트의 매력을 다 살리기 어렵다.","exfr":"Un été clair aura du mal à profiter de tout le potentiel de cette palette de 20 couleurs.","fr":"été clair (colorimétrie)","frpos":"n.m.","frdef":"Abréviation familière de 여름쿨라이트 : sous-type « été clair » (sous-ton froid, couleurs pastel claires).","par":"퍼스널컬러","rel":"관련어(참고)"},{"id":"BT1563","k":"h","cat":"gen","w":"온고잉","rom":"ongoing","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"ongoing 차용","memofr":"Emprunt à l'anglais ongoing","note":"Jargon du commerce ; il s'oppose aux éditions limitées (한정판).","mean":"한정이 아니라 상시 판매하는 구성","ex":"리필이 온고잉으로 나와서 본품을 다시 살 필요가 없다.","exfr":"La recharge est un produit permanent, inutile de racheter le produit principal.","fr":"produit permanent (ongoing)","frpos":"n.m.","frdef":"Produit ou coffret vendu en continu, non limité."},{"id":"BT1479","k":"h","cat":"gen","w":"웜쿨을 타다","rom":"womkureul tada","pos":"동사","unit":"구","eo":"혼종어","form":"구","memo":"웜쿨+을+타다(관용)","memofr":"Locution : 웜쿨 (chaud-froid) + 을 (particule) + 타다 (« être sensible à »)","note":"Ici, 타다 a le sens de « réagir à » (comme dans 추위를 타다).","mean":"웜톤·쿨톤에 따라 어울림이 갈리다","ex":"이 핑크는 웜쿨을 크게 타지 않아서 누구에게나 잘 어울린다.","exfr":"Ce rose dépend peu du sous-ton, il va à tout le monde.","fr":"dépendre du sous-ton","frpos":"loc.v.","frdef":"Se dit d'une couleur qui ne va qu'aux tons chauds ou froids.","par":"퍼스널컬러","rel":"관련어(참고)"},{"id":"BT1558","k":"h","cat":"gen","w":"잘 받다","rom":"jal batda","pos":"동사","unit":"구","eo":"고유어","form":"구","memo":"잘(부사)+받다(관용)","memofr":"Locution : 잘 (bien) + 받다 (recevoir)","note":"Expression courante ; souvent à la forme négative : 안 받는다 (« ne me convient pas »).","mean":"제품이 피부에 맞아 부작용이 없다","ex":"예민한 피부인데도 이 토너는 잘 받는다.","exfr":"Ma peau est sensible, mais elle tolère bien cette lotion tonique.","fr":"bien tolérer","frpos":"loc.v.","frdef":"Se dit d'un produit que la peau tolère bien, ou d'une couleur qui va bien."},{"id":"BT1501","k":"h","cat":"gen","w":"재구매템","rom":"jaegumaetem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"재구매+-템","memofr":"Composé : 재구매 (rachat) + -템 (de l'angl. item)","note":"Gage de qualité dans les avis.","mean":"여러 번 다시 사는 제품","ex":"벌써 N통째 쓰는 재구매템이다.","exfr":"C'est un produit que je rachète : j'en suis déjà à mon énième flacon.","fr":"produit racheté","frpos":"n.m.","frdef":"Produit qu'on rachète régulièrement.","par":"인생템","rel":"관련어(참고)"},{"id":"BT1524","k":"h","cat":"gen","w":"찐후기","rom":"jjinhugi","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"찐(진짜 축약)+후기","memofr":"Composé : 찐 (« vrai », de 진짜) + 후기 (avis)","note":"Argot internet ; il s'oppose aux avis sponsorisés.","mean":"진짜(광고 아닌) 후기","ex":"광고 없이 쓴 찐후기라서 더 믿음이 간다.","exfr":"C'est un vrai avis, sans publicité, donc plus digne de confiance.","fr":"vrai avis","frpos":"n.m.","frdef":"Avis authentique, non sponsorisé.","par":"내돈내산","rel":"관련어(참고)"},{"id":"BT1454","k":"h","cat":"gen","w":"최애템","rom":"choeaetem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"최애+-템","memofr":"Composé : 최애 (le plus aimé) + -템 (de l'angl. item)","note":"최애 vient du vocabulaire des fans de K-pop.","mean":"가장 좋아하는 아이템","ex":"이 쿠션은 내 최애템이라 파우치에 늘 들어 있다.","exfr":"Ce cushion est mon produit chouchou, il est toujours dans ma trousse.","fr":"produit chouchou, coup de cœur","frpos":"n.m.","frdef":"Le produit préféré entre tous.","par":"인생템","rel":"관련어(참고)"},{"id":"BT1613","k":"h","cat":"gen","w":"추천템","rom":"chucheontem","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"추천+-템","memofr":"Composé : 추천 (recommandation) + -템 (de l'angl. item)","note":"Mot très fréquent dans les titres de vidéos.","mean":"추천받은(추천하는) 아이템","ex":"SNS에서 추천템으로 보고 구매했다.","exfr":"C'est un produit recommandé que j'ai acheté après l'avoir vu sur les réseaux sociaux.","fr":"produit recommandé","frpos":"n.m.","frdef":"Produit qu'on recommande.","par":"인생템","rel":"관련어(참고)"},{"id":"BT1541","k":"h","cat":"gen","w":"코덕","rom":"kodeok","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(절단어)","memo":"코(스메틱)+덕(후) 축약","memofr":"Troncation : 코(스메틱) (angl. cosmetic) + 덕(후) (fan, otaku)","note":"덕후 vient du japonais otaku ; voir aussi 립덕.","mean":"코스메틱 덕후(화장품 마니아)","ex":"코덕이라면 한 번쯤 소장할 만한 팔레트다.","exfr":"Une palette que toute beauty addict devrait avoir au moins une fois.","fr":"beauty addict, accro aux cosmétiques","frpos":"n.m. / n.f.","frdef":"Abréviation de « 코스메틱 덕후 »: passionné(e) de cosmétiques."},{"id":"BT1530","k":"h","cat":"gen","w":"탁기","rom":"takgi","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"탁+기","memofr":"Composé : 탁 (trouble, terne) + 기 (« trace, teinte »)","note":"Terme de colorimétrie ; souvent jugé négatif pour certains types de peau.","mean":"색에 섞인 회색빛·탁한 기운","ex":"쿨 탁기가 도는 계열이라 손이 잘 가지 않는다.","exfr":"Cette gamme a une nuance grisée froide, je la prends rarement.","fr":"nuance grisée","frpos":"n.f.","frdef":"Part de gris qui rend une couleur moins vive.","par":"뮤트톤","rel":"관련어(참고)"},{"id":"BT1528","k":"h","cat":"gen","w":"핑잘봄","rom":"pingjalbom","pos":"명사","unit":"단어","eo":"혼종어","form":"축약어(두음절어)","memo":"핑(크가) 잘 (받는) 봄(웜톤) 축약","memofr":"Abréviation syllabique : 핑(크가) (le rose) + 잘 (bien) + 봄(웜톤) (printemps chaud)","note":"Sous-type très fin, typique des forums de colorimétrie.","mean":"핑크 계열이 잘 어울리는 봄웜 유형.","ex":"핑잘봄부터 여쿨까지 쓸 수 있는 핑크 팔레트다.","exfr":"Une palette rose qui convient aussi bien au printemps chaud à qui le rose va bien qu'à l'été froid.","fr":"printemps chaud à qui le rose va bien (colorimétrie)","frpos":"n.m.","frdef":"Abréviation de « 핑크가 잘 받는 봄웜 » : en colorimétrie, personne au sous-ton chaud de type printemps à qui les teintes rosées vont bien.","par":"퍼스널컬러","rel":"하위어(참고)"},{"id":"BT1602","k":"h","cat":"skin","w":"트러블이 익다","rom":"teureobeuri ikda","pos":"동사","unit":"구","eo":"혼종어","form":"구","memo":"트러블이+익다(비유)","memofr":"Locution : 트러블이 (le bouton) + 익다 (mûrir)","note":"Métaphore du fruit ; registre familier.","mean":"뾰루지가 곪아 고름이 차다.","ex":"패치 안에서 트러블이 알맞게 익어 흉터 없이 깔끔하게 진정되었습니다.","exfr":"Sous le patch, le bouton « mûrit » comme il faut et s'est apaisé proprement, sans cicatrice.","fr":"le bouton « mûrit »","frpos":"expr.","frdef":"Le bouton se remplit de pus.","par":"트러블","rel":"관련어(참고)"},{"id":"BT1592","k":"h","cat":"skin","w":"트러블 패치","rom":"teureobeul paechi","pos":"명사","unit":"구","eo":"외래어","form":"구","memo":"trouble+patch","memofr":"Locution : 트러블 (angl. trouble, « bouton ») + 패치 (angl. patch)","note":"Produit très populaire en Corée, porté même en journée.","mean":"여드름·뾰루지 부위용 패치","ex":"갑자기 올라온 트러블 부위에 붙여 보호해 주는 트러블 패치입니다.","exfr":"Un patch anti-imperfections qui protège le bouton apparu soudainement.","fr":"patch anti-imperfections","frpos":"n.m.","frdef":"Patch hydrocolloïde posé sur un bouton."},{"id":"BT1603","k":"h","cat":"skin","w":"팟타입","rom":"pattaip","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"pot+type","memofr":"Composé : 팟 (angl. pot) + 타입 (angl. type)","note":"Jargon de fiche produit.","mean":"작은 단지(팟) 용기 형태","ex":"팟타입 용기에 담겨 있어 브러시나 손가락으로 양 조절이 용이합니다.","exfr":"Le format en pot permet de doser facilement au pinceau ou au doigt.","fr":"format en pot","frpos":"n.m.","frdef":"Produit conditionné en petit pot.","par":"펌프형","rel":"관련어(참고)"},{"id":"BT1500","k":"h","cat":"clean","w":"클오","rom":"keuro","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두음절어)","memo":"클(렌징)+오(일) 축약","memofr":"Abréviation syllabique : 클(렌징) (angl. cleansing) + 오(일) (angl. oil)","note":"Argot des avis.","mean":"클렌징 오일","ex":"이 클오는 세정력이 좋아 짙은 화장도 한 번에 지워진다.","exfr":"Cette huile démaquillante nettoie si bien qu'elle enlève même un maquillage chargé en une fois.","fr":"huile démaquillante (abrév.)","frpos":"n.f.","frdef":"Abréviation de « 클렌징 오일 »."},{"id":"BT1493","k":"h","cat":"sun","w":"생얼 메이크업","rom":"saengeol meikeueop","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"생얼(생+얼굴)+메이크업","memofr":"Locution : 생얼 (visage nu) + 메이크업 (angl. make-up)","note":"Oxymore ; proche du « no make-up make-up ».","mean":"맨얼굴처럼 보이는 가벼운 화장","ex":"가볍게 피부 톤만 정리하여 완벽한 생얼 메이크업을 완성합니다.","exfr":"En unifiant juste légèrement le teint, on obtient un parfait maquillage « peau nue ».","fr":"maquillage « peau nue »","frpos":"n.m.","frdef":"Maquillage si léger qu'on semble ne pas en porter.","par":"꾸안꾸","rel":"관련어(참고)"},{"id":"BT1484","k":"h","cat":"sun","w":"요철 커버","rom":"yocheol keobeo","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"요철+커버(cover)","memofr":"Locution : 요철 (creux et bosses) + 커버 (angl. cover)","note":"Allégation des primers.","mean":"모공·흉터 등 울퉁불퉁한 피부결을 가림","ex":"도드라지는 피부 모공과 요철 커버에 탁월한 도움을 줍니다.","exfr":"Il aide efficacement au camouflage des irrégularités et des pores visibles.","fr":"camouflage des irrégularités","frpos":"n.m.","frdef":"Masquer pores et cicatrices en relief.","par":"커버력","rel":"하위어(참고)"},{"id":"BT1443","k":"s","cat":"base","w":"무너짐","rom":"muneojim","pos":"명사","unit":"단어","eo":"고유어","form":"파생어","memo":"무너지다+-ㅁ","memofr":"Dérivé : 무너지다 (s'effondrer) + -ㅁ (nominalisateur)","note":"Voir 무너지다 et 무너짐이 예쁘다.","mean":"시간이 지나며 베이스 메이크업이 지워지거나 흐트러짐","ex":"다크닝이 없어서 시간이 지나도 유분과 섞인 무너짐이 매우 예쁩니다.","exfr":"Sans oxydation, la dégradation du maquillage reste très jolie avec le temps, même mêlée au sébum.","fr":"dégradation du maquillage","frpos":"n.f.","frdef":"Le maquillage s'efface ou se défait au fil des heures.","par":"무너지다","rel":"파생형"},{"id":"BT1444","k":"h","cat":"base","w":"무너짐이 예쁘다","rom":"muneojimi yeppeuda","pos":"형용사","unit":"구","eo":"고유어","form":"구","memo":"무너짐이+예쁘다","memofr":"Locution : 무너짐이 (la dégradation) + 예쁘다 (être joli)","note":"Expression d'avis typiquement coréenne : un teint qui « s'effondre bien » reste propre.","mean":"화장이 지속 시간이 다해 지워져도 지저분하지 않게 남아 있다.","ex":"지속력이 좋을 뿐 아니라 시간이 지나 유분이 올라와도 무너짐이 예쁩니다.","exfr":"Non seulement il tient bien, mais même quand le sébum remonte, c'est un maquillage qui « s'efface joliment ».","fr":"maquillage qui « s'efface joliment »","frpos":"n.m.","frdef":"Même en fin de tenue, le maquillage s'estompe sans paraître sale ni inégal.","par":"무너짐","rel":"관련어(참고)"},{"id":"BT1449","k":"h","cat":"base","w":"수정 화장","rom":"sujeong hwajang","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"수정+화장","memofr":"Locution : 수정 (correction) + 화장 (maquillage)","note":"Les cushions et les sun cushions servent souvent à la retouche.","mean":"외출 중 무너진 화장을 고치는 것","ex":"뭉침 없이 얇게 얹어져 오후에 수정 화장용으로 사용하기에 좋습니다.","exfr":"Il se pose en couche fine sans faire de paquets : idéal pour une retouche du maquillage l'après-midi.","fr":"retouche du maquillage","frpos":"n.f.","frdef":"Retoucher son maquillage pendant la journée.","par":"무너짐","rel":"관련어(참고)"},{"id":"BT1456","k":"h","cat":"base","w":"쿠션 맛집","rom":"kusyeon matjip","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"쿠션(cushion)+맛집(맛+집)","memofr":"Locution : 쿠션 (angl. cushion) + 맛집 (bonne adresse culinaire)","note":"Métaphore gastronomique très productive : 맛집 signifie « spécialiste reconnu ».","mean":"특정 브랜드가 그 제품군을 잘 만든다는 평","ex":"피부 표현이 너무 예쁘게 되어 역시 믿고 쓰는 쿠션 맛집입니다.","exfr":"Le rendu du teint est si beau : c'est bien une marque spécialiste du cushion, une valeur sûre.","fr":"marque spécialiste du cushion","frpos":"n.f.","frdef":"Marque réputée pour l'excellence de ses cushions (de « matjip », bonne adresse)."},{"id":"BT1448","k":"h","cat":"base","w":"한 톤 업","rom":"han ton eop","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"한(관형사)+톤업(tone-up)","memofr":"Locution : 한 (un) + 톤 업 (angl. tone up)","note":"Conseil courant pour éviter un teint terne.","mean":"평소보다 한 단계 밝은 색을 고름","ex":"피부 톤보다 한 톤 업해서 선택하시면 화사하게 연출할 수 있습니다.","exfr":"En choisissant une teinte plus claire que votre peau, vous obtiendrez un teint lumineux.","fr":"une teinte plus claire","frpos":"n.f.","frdef":"Choisir une teinte un cran plus claire que sa carnation.","par":"톤업","rel":"관련어(참고)"},{"id":"BT1446","k":"h","cat":"base","w":"호수","rom":"hosu","pos":"명사","unit":"단어","eo":"한자어","form":"합성어","memo":"호+수; 쿠션·파운데이션 색 번호(19호·21호·23호 등)","memofr":"Composé : 호 (numéro) + 수 (nombre)","note":"Système coréen de numérotation des teintes (13, 21, 23…) : plus le nombre est petit, plus la teinte est claire.","mean":"파운데이션·쿠션 밝기 단계를 나타내는 번호","ex":"자신의 피부에 맞는 호수를 선택하여 자연스럽게 연출하세요.","exfr":"Choisissez le numéro de teinte adapté à votre peau pour un résultat naturel.","fr":"numéro de teinte (19, 21, 23…)","frpos":"n.m.","frdef":"Système coréen de numérotation des teintes de fond de teint, du plus clair au plus foncé."},{"id":"BT1535","k":"h","cat":"eye","w":"X구 팔레트","rom":"Xgu palleteu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"X+구+팔레트(palette)","memofr":"Locution : X (nombre) + 구 (compartiment) + 팔레트 (angl. palette)","note":"X est remplacé par un nombre : 9구, 12구.","mean":"칸 수(구)로 표시한 팔레트","ex":"20구짜리 대왕 팔레트라 들고 다니기는 무겁다.","exfr":"C'est une immense palette de 20 couleurs, lourde à transporter.","fr":"palette de X couleurs","frpos":"n.f.","frdef":"Palette désignée par son nombre de godets (« 구 »)."},{"id":"BT1585","k":"h","cat":"eye","w":"눈썹 가이드","rom":"nunsseop gaideu","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"눈썹+가이드(guide)","memofr":"Locution : 눈썹 (sourcils) + 가이드 (angl. guide)","note":"Désigne aussi des pochoirs à sourcils.","mean":"눈썹 모양의 기준선"
