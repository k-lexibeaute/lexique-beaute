어.","mean":"턱선이 V자처럼 갸름하게 떨어지는 얼굴선.","ex":"괄사로 매일 브이라인 마사지를 한다.","exfr":"Je masse chaque jour mon visage au gua sha pour l'affiner en V.","fr":"visage en V (ovale affiné)","frpos":"n.m.","frdef":"Mâchoire fine et pointue, idéal de beauté coréen."},{"id":"BT1992","k":"h","cat":"gen","w":"여우상","rom":"yeousang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"여우+상","memofr":"Composé : 여우 (renard) + 상 (type de visage)","note":"Voir 강아지상.","mean":"눈꼬리가 올라가고 갸름한 얼굴로 여우를 닮은 인상.","ex":"여우상이라 아이라인을 길게 뺀다.","exfr":"J'ai un visage de renard, alors j'étire longuement l'eye-liner.","fr":"visage de renard","frpos":"n.m.","frdef":"Type de visage aux yeux étirés vers le haut.","par":"-상","rel":"관련어(참고)"},{"id":"BT1993","k":"h","cat":"gen","w":"토끼상","rom":"tokkisang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"토끼+상","memofr":"Composé : 토끼 (lapin) + 상 (type de visage)","note":"Voir 강아지상.","mean":"동그란 눈과 앞니가 도드라져 토끼를 닮은 귀여운 인상.","ex":"토끼상에는 핑크 블러셔가 잘 어울린다.","exfr":"Un blush rose va bien à un visage de lapin.","fr":"visage de lapin","frpos":"n.m.","frdef":"Type de visage mignon aux grands yeux ronds.","par":"-상","rel":"관련어(참고)"},{"id":"BT1994","k":"h","cat":"gen","w":"사슴상","rom":"saseumsang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"사슴+상","memofr":"Composé : 사슴 (cerf, biche) + 상 (type de visage)","note":"Voir 강아지상.","mean":"크고 맑은 눈과 가는 목선으로 사슴을 닮은 순한 인상.","ex":"사슴상이라 눈매를 크게 그리는 메이크업이 어울린다.","exfr":"J'ai un visage de biche, un maquillage qui agrandit les yeux me va bien.","fr":"visage de biche","frpos":"n.m.","frdef":"Type de visage doux aux grands yeux limpides.","par":"-상","rel":"관련어(참고)"},{"id":"BT1995","k":"h","cat":"gen","w":"공룡상","rom":"gongnyongsang","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"공룡+상","memofr":"Composé : 공룡 (dinosaure) + 상 (type de visage)","note":"Voir 강아지상.","mean":"이목구비가 크고 시원해 공룡을 닮았다고 하는 인상.","ex":"공룡상은 진한 음영 메이크업이 잘 어울린다.","exfr":"Un visage de dinosaure se prête bien à un maquillage aux ombres marquées.","fr":"visage de dinosaure","frpos":"n.m.","frdef":"Type de visage aux traits marqués et généreux.","par":"-상","rel":"관련어(참고)"},{"id":"BT1998","k":"h","cat":"gen","w":"관리받다","rom":"gwallibatda","pos":"동사","unit":"단어","eo":"혼종어","form":"합성어","memo":"관리+받-+-다","memofr":"Composé : 관리 (soin) + 받다 (recevoir)","note":"S'emploie aussi pour les soins réguliers en institut.","mean":"피부과나 관리실에서 전문 피부 관리를 받다.","ex":"한 달에 두 번 피부과에서 관리받는다.","exfr":"Je me fais faire des soins chez le dermatologue deux fois par mois.","fr":"se faire faire des soins (en institut)","frpos":"loc.v.","frdef":"Recevoir des soins professionnels en clinique ou en institut."},{"id":"BT1999","k":"h","cat":"hair","w":"두피 스케일링","rom":"dupi seukeilling","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"두피+스케일링","memofr":"Locution : 두피 (cuir chevelu) + 스케일링 (angl. scaling)","note":"Voir 스칼프 스케일링.","mean":"두피의 각질과 노폐물을 제거하는 관리.","ex":"미용실에서 두피 스케일링을 받았다.","exfr":"Je me suis fait faire une exfoliation du cuir chevelu au salon de coiffure.","fr":"exfoliation du cuir chevelu","frpos":"n.f.","frdef":"Nettoyage profond du cuir chevelu."},{"id":"BT2001","k":"h","cat":"hair","w":"매직","rom":"maejik","pos":"명사","unit":"단어","eo":"외래어","form":"단일어","memo":"magic (straight)","memofr":"Emprunt à l'anglais magic (straight)","note":"Faux anglicisme ; prestation de coiffure très courante en Corée.","mean":"약제와 열로 곱슬머리를 곧게 펴는 시술. 「매직 스트레이트」의 줄임말.","ex":"곱슬이라 석 달마다 매직을 한다.","exfr":"J'ai les cheveux frisés, alors je fais un lissage permanent tous les trois mois.","fr":"lissage permanent (« magic »)","frpos":"n.m.","frdef":"Lissage chimique coréen ; abréviation de « magic straight ».","faux":1},{"id":"BT2002","k":"h","cat":"hair","w":"볼륨매직","rom":"bollyummaejik","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"volume+magic","memofr":"Composé : 볼륨 (angl. volume) + 매직 (lissage « magic »)","note":"Prestation de coiffure coréenne.","mean":"머리를 곧게 펴면서 끝을 안으로 둥글게 말아 볼륨을 주는 매직.","ex":"볼륨매직을 해서 끝이 자연스럽게 말린다.","exfr":"Avec un lissage permanent avec volume, les pointes se recourbent naturellement.","fr":"lissage permanent avec volume","frpos":"n.m.","frdef":"Lissage qui garde du volume et recourbe les pointes.","par":"매직","rel":"관련어(참고)"},{"id":"BT2008","k":"h","cat":"hair","w":"시스루뱅","rom":"siseurubaeng","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"see-through+bang","memofr":"Composé : 시스루 (angl. see-through) + 뱅 (angl. bang)","note":"Frange emblématique de la coiffure coréenne.","mean":"이마가 비쳐 보이게 숱을 적게 낸 앞머리.","ex":"시스루뱅으로 자르니 얼굴이 작아 보인다.","exfr":"Avec une frange effilée, mon visage paraît plus petit.","fr":"frange effilée (« see-through bangs »)","frpos":"n.f.","frdef":"Frange très légère laissant voir le front."},{"id":"BT2009","k":"h","cat":"hair","w":"애교머리","rom":"aegyomeori","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"애교+머리","memofr":"Composé : 애교 (charme mignon) + 머리 (cheveux)","note":"Voir 애교살.","mean":"얼굴 옆에 가늘게 내려 얼굴선을 가리는 잔머리.","ex":"애교머리를 내리면 광대가 덜 도드라진다.","exfr":"Quand je laisse tomber les mèches qui encadrent le visage, mes pommettes ressortent moins.","fr":"mèches qui encadrent le visage","frpos":"n.f.pl.","frdef":"Fines mèches laissées sur les côtés du visage."},{"id":"BT2010","k":"h","cat":"hair","w":"허쉬컷","rom":"heoswikeot","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"hush+cut","memofr":"Composé : 허쉬 (angl. hush) + 컷 (angl. cut)","note":"Coupe tendance en Corée.","mean":"층을 많이 내 가볍고 부스스하게 흐르는 한국식 레이어드 컷.","ex":"허쉬컷은 드라이만 해도 볼륨이 산다.","exfr":"La coupe « hush » prend du volume avec un simple séchage.","fr":"coupe « hush » (dégradé coréen)","frpos":"n.f.","frdef":"Coupe très dégradée et aérienne, popularisée en Corée."},{"id":"BT2011","k":"h","cat":"hair","w":"똑단발","rom":"ttokdanbal","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"똑+단발","memofr":"Composé : 똑 (net, précis) + 단발 (cheveux courts)","note":"Coupe classique coréenne.","mean":"층 없이 일자로 반듯하게 자른 단발.","ex":"똑단발로 자르고 끝만 C컬로 말았다.","exfr":"Je me suis fait couper un carré droit, seules les pointes recourbées en C.","fr":"carré droit","frpos":"n.m.","frdef":"Carré coupé net, sans dégradé."},{"id":"BT2012","k":"h","cat":"hair","w":"떡진 머리","rom":"tteokjin meori","pos":"명사","unit":"구","eo":"고유어","form":"구","memo":"떡+지-+-ㄴ+머리","memofr":"Locution : 떡진 (collé comme du gâteau de riz) + 머리 (cheveux)","note":"Familier.","mean":"기름이 끼어 머리카락이 뭉치고 납작하게 붙은 상태.","ex":"떡진 머리를 드라이 샴푸로 살렸다.","exfr":"J'ai rattrapé mes cheveux gras et collés avec un shampoing sec.","fr":"cheveux gras et collés","frpos":"n.m.pl.","frdef":"Cheveux graissés qui collent en mèches."},{"id":"BT2013","k":"h","cat":"hair","w":"개털","rom":"gaeteol","pos":"명사","unit":"단어","eo":"고유어","form":"합성어","memo":"개+털","memofr":"Composé : 개 (chien) + 털 (poil)","note":"Familier, péjoratif.","mean":"손상되어 푸석하고 뻗치는 머리카락을 낮춰 이르는 말.","ex":"탈색을 여러 번 했더니 개털이 됐다.","exfr":"Après plusieurs décolorations, j'ai des cheveux paille.","fr":"cheveux paille","frpos":"n.m.pl.","frdef":"Argot : cheveux abîmés, secs et rêches."},{"id":"BT2019","k":"h","cat":"skin","w":"달팽이 크림","rom":"dalpaengi keurim","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"달팽이+크림","memofr":"Locution : 달팽이 (escargot) + 크림 (angl. cream)","note":"Produit emblématique de la K-beauty en France.","mean":"달팽이 점액 여과물을 넣은 크림. 한국 화장품의 대표 수출품으로 알려짐.","ex":"어머니가 달팽이 크림을 선물로 사 오셨다.","exfr":"Ma mère m'a offert une crème à la bave d'escargot.","fr":"crème à la bave d'escargot","frpos":"n.f.","frdef":"Crème à la mucine d'escargot, produit emblématique de la K-beauty.","par":"달팽이 점액 여과물","rel":"관련어(참고)"},{"id":"BT2022","k":"h","cat":"gen","w":"뽀샤시하다","rom":"pposyasihada","pos":"형용사","unit":"단어","eo":"혼종어","form":"파생어","memo":"뽀샤시(일본어 ぼかし에서 온 말로 봄)+-하다 / 신조어(표준국어대사전 미등재)","memofr":"Dérivé : 뽀샤시 (peut-être du japonais bokashi, « flou ») + -하다 (suffixe adjectival)","note":"Néologisme ; il s'emploie aussi pour les filtres photo.","mean":"피부가 뽀얗고 화사하게 빛나 보이다. 사진의 부드럽게 빛 번진 효과에도 씀.","ex":"톤업크림을 바르니 얼굴이 뽀샤시하다.","exfr":"Avec la crème tone-up, mon teint est lumineux et laiteux.","fr":"lumineux et laiteux (teint)","frpos":"loc.adj.","frdef":"Se dit d'un teint clair, doux et lumineux, ou d'une photo à l'effet flou lumineux."},{"id":"BT2029","k":"h","cat":"clean","w":"쌀뜨물 세안","rom":"ssaltteumul sean","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"쌀뜨물+세안","memofr":"Locution : 쌀뜨물 (eau de rinçage du riz) + 세안 (nettoyage du visage)","note":"Méthode traditionnelle remise au goût du jour.","mean":"쌀 씻은 물로 얼굴을 씻는 한국의 전통 미용법. 피부를 맑게 한다고 전해짐.","ex":"할머니는 평생 쌀뜨물 세안을 하셨다.","exfr":"Ma grand-mère a fait le nettoyage à l'eau de riz toute sa vie.","fr":"nettoyage à l'eau de riz","frpos":"n.m.","frdef":"Méthode traditionnelle coréenne : se laver le visage avec l'eau de rinçage du riz."},{"id":"BT2030","k":"h","cat":"lip","w":"MLBB","rom":"MLBB","pos":"명사","unit":"단어","eo":"외래어","form":"축약어(두문자어)","memo":"My Lips But Better","memofr":"Sigle de l'anglais My Lips But Better","note":"Sigle venu des communautés anglophones.","mean":"「My Lips But Better」의 약자. 원래 입술색보다 조금 더 예쁜 자연스러운 립 색.","ex":"MLBB 립이라 데일리로 쓰기 좋다.","exfr":"C'est un rouge à lèvres MLBB, parfait pour tous les jours.","fr":"MLBB (« mes lèvres en mieux »)","frpos":"n.m.","frdef":"Teinte proche de la couleur naturelle des lèvres, en un peu plus belle."},{"id":"BT2032","k":"h","cat":"eye","w":"쌍꺼풀 액","rom":"ssangkkeopul aek","pos":"명사","unit":"구","eo":"혼종어","form":"구","memo":"쌍꺼풀+액","memofr":"Locution : 쌍꺼풀 (double paupière) + 액 (liquide)","note":"Voir 쌍꺼풀 테이프.","mean":"눈꺼풀에 발라 접어 붙여 쌍꺼풀을 만드는 액체 접착제.","ex":"쌍꺼풀 액을 바르고 푸셔로 라인을 눌렀다.","exfr":"J'ai appliqué la colle à paupières et marqué le pli avec un poussoir.","fr":"colle à paupières (double paupière)","frpos":"n.f.","frdef":"Colle liquide servant à créer un pli de paupière artificiel."},{"id":"BT2033","k":"h","cat":"eye","w":"서클렌즈","rom":"seokeullenjeu","pos":"명사","unit":"단어","eo":"외래어","form":"합성어","memo":"circle+lens","memofr":"Composé : 서클 (angl. circle) + 렌즈 (angl. lens)","note":"Produit très courant en Asie de l'Est ; en France, ce sont des lentilles soumises à prescription.","mean":"검은 테두리로 눈동자가 커 보이게 하는 컬러 콘택트렌즈.","ex":"서클렌즈를 끼니 눈이 또렷해 보인다.","exfr":"Avec des lentilles « circle », mon regard paraît plus net.","fr":"lentilles « circle » (agrandissant l'iris)","frpos":"n.f.pl.","frdef":"Lentilles de couleur à bord foncé qui agrandissent l'iris.","faux":1},{"id":"BT2034","k":"a","cat":"gen","w":"-템","memo":"유형: 명사 뒤","memofr":"Élément placé après un nom ; abréviation de 아이템 (angl. item)","note":"Élément très productif dans l'argot des avis : 인생템, 꿀템, 재구매템…","mean":"「아이템(item)」을 줄인 말. 명사 뒤에 붙어 「그런 성격의 제품」을 뜻함. 표준국어대사전 미등재.","ex":"예: 정착템, 공병템, 구원템, 데일리템, 무난템, 애매템, 인생템, 처박템, 힛팬템, 근본템, 기초템, 재구매템","exfr":"Exemples : 정착템, 공병템, 구원템, 데일리템, 무난템, 애매템, 인생템, 처박템, 힛팬템, 근본템, 기초템, 재구매템","fr":"Élément tiré de « item » : accolé à un nom, il signifie « produit qui… »","frdef":"Élément tiré de « item » : accolé à un nom, il signifie « produit qui… » (인생템 = produit culte)."},{"id":"BT2035","k":"a","cat":"gen","w":"-러","memo":"유형: 명사 뒤","memofr":"Élément placé après un nom ; du suffixe anglais -er","note":"Exemples : 건성러 (personne à peau sèche), 지성러, 민감러.","mean":"영어 -er에서 온 말. 피부 유형 뒤에 붙어 「그런 피부를 가진 사람」을 뜻함(건성러, 지성러, 민감러). 표준국어대사전 미등재.","ex":"예: 건성러, 지성러, 민감러","exfr":"Exemples : 건성러, 지성러, 민감러","fr":"Élément tiré du suffixe anglais -er : « personne qui a tel type de peau »","frdef":"Élément tiré du suffixe anglais -er : « personne qui a tel type de peau » (건성러 = personne à peau sèche)."},{"id":"BT2036","k":"a","cat":"gen","w":"-상","memo":"유형: 명사 뒤","memofr":"Élément placé après un nom (« visage, physionomie »)","note":"Exemples : 강아지상, 고양이상, 여우상.","mean":"얼굴 인상의 유형을 동물이나 사물에 빗대어 이르는 말. 「상」은 명사.","ex":"예: 강아지상, 고양이상, 과즙상, 두부상, 미묘상, 첫사랑상, 여우상, 토끼상, 사슴상, 공룡상","exfr":"Exemples : 강아지상, 고양이상, 과즙상, 두부상, 미묘상, 첫사랑상, 여우상, 토끼상, 사슴상, 공룡상","fr":"Élément « visage de type… » : on compare le visage à un animal ou à un objet","frdef":"Élément « visage de type… » : on compare le visage à un animal ou à un objet (강아지상 = visage de chiot)."},{"id":"BT2037","k":"a","cat":"gen","w":"-감","memo":"유형: 접미사","memofr":"Suffixe (« sensation »)","note":"Exemples : 사용감, 보습감, 자극감.","mean":"「느낌」을 뜻하는 접미사. 사용감을 나타내는 말을 만듦.","ex":"예: 수분감, 자극감, 잔여감, 마무리감, 보습감, 볼륨감, 영양감, 유분감, 피부 입체감, 거품 쿠션감, 세안 마찰감, 매끈 마감","exfr":"Exemples : 수분감, 자극감, 잔여감, 마무리감, 보습감, 볼륨감, 영양감, 유분감, 피부 입체감, 거품 쿠션감, 세안 마찰감, 매끈 마감","fr":"Suffixe « sensation de… »","frdef":"Suffixe « sensation de… » (보습감 = sensation d'hydratation)."},{"id":"BT2038","k":"a","cat":"gen","w":"-력","memo":"유형: 접미사","memofr":"Suffixe (« capacité, force »)","note":"Exemples : 커버력, 지속력, 밀착력.","mean":"「능력, 힘」을 뜻하는 접미사. 제품 성능을 나타내는 말을 만듦.","ex":"예: 밀착력, 메이크업 지속력, 보습 지속력, 보습력, 피부 기초 체력, 화장 밀착력, 세정력, 커버력, 흡수력, 지속력","exfr":"Exemples : 밀착력, 메이크업 지속력, 보습 지속력, 보습력, 피부 기초 체력, 화장 밀착력, 세정력, 커버력, 흡수력, 지속력","fr":"Suffixe « capacité, pouvoir »","frdef":"Suffixe « capacité, pouvoir » (커버력 = pouvoir couvrant)."},{"id":"BT2039","k":"a","cat":"gen","w":"-광","memo":"유형: 명사 뒤","memofr":"Élément placé après un nom (« éclat »)","note":"Exemples : 물광, 속광, 윤광, 꿀광.","mean":"「빛, 윤기」를 뜻하는 말. 피부 광의 종류를 나타냄.","ex":"예: 속광, 수분광, 물광, 겉광, 번들광, 새틴광, 윤광, 은구슬광, 자연광, 유리알광, 탕후루광, 물빛광","exfr":"Exemples : 속광, 수분광, 물광, 겉광, 번들광, 새틴광, 윤광, 은구슬광, 자연광, 유리알광, 탕후루광, 물빛광","fr":"Élément « éclat » : désigne les types de brillance de la peau","frdef":"Élément « éclat » : désigne les types de brillance de la peau (물광 = éclat mouillé)."},{"id":"BT2040","k":"a","cat":"gen","w":"극-","memo":"유형: 접두사","memofr":"Préfixe (« extrême »)","note":"Exemples : 극지성, 극건성.","mean":"「아주 심한」을 뜻하는 접두사.","ex":"예: 극지성, 극민감성","exfr":"Exemples : 극지성, 극민감성","fr":"Préfixe « extrême- »","frdef":"Préfixe « extrême- » (극지성 = peau extrêmement grasse)."},{"id":"BT2041","k":"a","cat":"gen","w":"겉-","memo":"유형: 접두사","memofr":"Préfixe (« de surface »)","note":"Exemples : 겉보습, 겉광, 겉기름.","mean":"「겉으로 드러난」을 뜻하는 접두사.","ex":"예: 겉돌다, 겉보습, 겉기름, 겉광","exfr":"Exemples : 겉돌다, 겉보습, 겉기름, 겉광","fr":"Préfixe « en surface »","frdef":"Préfixe « en surface » (겉기름 = gras de surface)."},{"id":"BT2042","k":"a","cat":"gen","w":"속","memo":"유형: 명사 앞","memofr":"Élément placé devant un nom (« intérieur, profondeur »)","note":"Exemples : 속광, 속건조, 속보습.","mean":"「안쪽」을 뜻하는 명사. 앞에 붙어 「피부 속」의 상태를 나타냄.","ex":"예: 속건조, 속광, 속보습, 속당김, 속수분, 속탄력","exfr":"Exemples : 속건조, 속광, 속보습, 속당김, 속수분, 속탄력","fr":"Élément « en profondeur »","frdef":"Élément « en profondeur » (속건조 = déshydratation profonde)."},{"id":"BT2043","k":"a","cat":"gen","w":"꿀","memo":"유형: 명사 앞","memofr":"Élément placé devant un nom ; emploi figuré de 꿀 (miel)","note":"Exemples : 꿀템, 꿀조합, 꿀피부.","mean":"명사 「꿀」의 비유적 쓰임. 앞에 붙어 「아주 좋은」을 뜻함.","ex":"예: 꿀피부, 꿀조합, 꿀광, 꿀템","exfr":"Exemples : 꿀피부, 꿀조합, 꿀광, 꿀템","fr":"Élément « super, top », par métaphore du miel","frdef":"Élément « super, top », par métaphore du miel (꿀템 = super produit)."},{"id":"BT2044","k":"a","cat":"gen","w":"-드름","memo":"유형: 절단 요소","memofr":"Élément tronqué de 여드름 (acné)","note":"Exemples : 등드름, 가드름, 턱드름.","mean":"「여드름」의 뒷부분. 부위 이름 뒤에 붙어 「그 부위에 난 여드름」을 뜻함.","ex":"예: 가드름, 등드름, 턱드름, 엉드름","exfr":"Exemples : 가드름, 등드름, 턱드름, 엉드름","fr":"Élément tiré de 여드름","frdef":"Élément tiré de 여드름 (bouton) : « boutons situés sur… » (등드름 = boutons du dos)."},{"id":"BT0072","k":"h","cat":"skin","w":"개봉 후 사용기간","rom":"gaebong hu sayonggigan","pos":"명사","unit":"구","eo":"한자어","form":"구","memo":"개봉+후+사용기간","memofr":"Locution : 개봉 (ouverture) + 후 (après) + 사용기간 (durée d'utilisation)","note":"Équivalent du symbole PAO (pot ouvert) des emballages européens.","mean":"제품을 개봉한 뒤 사용할 수 있다고 안내하는 기간.","ex":"이 크림은 개봉 후 사용기간이 12개월이라 뚜껑에 개봉 날짜를 적어 두었다","exfr":"Cette crème a une période après ouverture de 12 mois, alors j'ai noté la date d'ouverture sur le couvercle.","fr":"période après ouverture (P.A.O.)","frpos":"n.f.","frdef":"Durée d'utilisation conseillée après ouverture du produit."},{"id":"BT1505","k":"h","cat":"skin","w":"물세안","rom":"mulsean","pos":"명사","unit":"단어","eo":"혼종어","form":"합성어","memo":"물+세안","memofr":"Composé : 물 (eau) + 세안 (nettoyage du visage)","note":"Méthode minimaliste, souvent conseillée le matin.","mean":"세안제 없이 물로만 씻음","ex":"피부가 예민한 날에는 아침에 클렌저 없이 물세안만 한다.","exfr":"Les jours où ma peau est sensible, je me contente le matin d'un nettoyage à l'eau seule, sans nettoyant.","fr":"nettoyage à l'eau seule","frpos":"n.m.","frdef":"Se rincer le visage uniquement à l'eau, sans nettoyant."}]}</script>
<script>
(function(){
const EMB=JSON.parse(document.getElementById('data').textContent);
const KIND={'표제어':'h','하위 항목':'s','조어 요소':'a'};
const CATK={'스킨케어':'skin','클렌징':'clean','마스크팩·패드':'mask','선케어':'sun','베이스 메이크업':'base','아이 메이크업':'eye','립 메이크업':'lip','헤어':'hair','네일':'nail','바디·향수':'body','도구·기기·시술':'tool','공통·은어':'gen'};
const COL={'항목ID':'id','단어':'w','로마자':'rom','품사':'pos','단위':'unit','어종':'eo','단어 형성':'form','단어 구성':'memo','단어 구성(프랑스어)':'memofr','주목할 점(프랑스어)':'note','뜻':'mean','예문':'ex','예문 번역':'exfr','프랑스어 대응어':'fr','프랑스어 품사·성':'frpos','프랑스어 뜻풀이':'frdef','성분 설명':'ing','INCI':'inci','상위 표제어':'par','관계':'rel'};
function parseCSV(t){const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q=true; else if(c===','){row.push(f);f=''} else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''} else if(c!=='\r') f+=c; }
  if(f!==''||row.length){row.push(f);rows.push(row)} return rows;}
function fromSheet(t){const rows=parseCSV(t); if(rows.length<50) throw new Error('rows'); const H=rows[0].map(x=>x.trim()); const ix=n=>H.indexOf(n);
  ['항목ID','단어','구분','수록','프랑스어 대응어'].forEach(n=>{ if(ix(n)<0) throw new Error('col '+n) });
  const e=[]; let ex=0, seen={};
  rows.slice(1).forEach(r=>{const g=n=>((ix(n)>=0?r[ix(n)]:'')||'').trim(); if(!g('단어')) return;
    if(g('수록')!=='포함'){ if(g('수록')==='제외') ex++; return }
    let id=g('항목ID')||('X'+e.length); if(seen[id]) id=id+'x'+e.length; seen[id]=1;
    const o={id:id,k:KIND[g('구분')]||'h',cat:CATK[g('분야')]||'gen'}; Object.keys(COL).forEach(n=>{ if(n!=='항목ID'){const v=g(n); if(v) o[COL[n]]=v} });
    if(!o.fr) o.fr=''; if(!o.frdef) o.frdef=''; if(/^[oO○]$/.test(g('거짓 짝'))&&o.k==='h') o.faux=1; e.push(o); });
  if(e.length<50) throw new Error('few');
  const m=Object.assign({},EMB.meta); m.excluded=EMB.meta.excluded+ex; m.head=e.filter(x=>x.k==='h').length; m.sub=e.filter(x=>x.k==='s').length; m.aff=e.filter(x=>x.k==='a').length;
  return {e:e,meta:m,live:true};}
function load(){
  if(!/^https?:$/.test(location.protocol)) return Promise.reject(0);
  return fetch('sheet-url.txt',{cache:'no-store'}).then(r=>{ if(!r.ok) throw 0; return r.text() }).then(u=>{u=u.trim().split(/\s+/)[0]; if(!/^https:\/\/docs\.google\.com\/spreadsheets\//.test(u)) throw 0;
    return fetch(u+(u.indexOf('?')>=0?'&':'?')+'t='+Date.now(),{cache:'no-store'}) }).then(r=>{ if(!r.ok) throw 0; return r.text() }).then(fromSheet);
}
let done=false; const go=D=>{ if(done) return; done=true; boot(D) };
const timer=setTimeout(()=>go(EMB),6000);
load().then(D=>{clearTimeout(timer);go(D)}).catch(()=>{clearTimeout(timer);go(EMB)});
function boot(D){
const E=D.e, M=D.meta;

E.forEach(e=>{byId[e.id]=e; if(!byW[e.w]||e.k!=='s') byW[e.w]=e;});

const CH=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

const cho=s=>[...s].map(c=>{const o=c.charCodeAt(0)-0xAC00;return o>=0&&o<11172?CH[Math.floor(o/588)]:c}).join('');
const fold=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[\s\-·«»"'’()]/g,'');
E.forEach(e=>{e._c=cho(e.w.replace(/^[-\s]+/,''));e._i=BASE[e._c[0]]||e._c[0];e._s=[fold(e.w),fold(e._c),fold(e.fr),fold(e.rom),fold(e.frdef)];});
const coll=new Intl.Collator('ko');
const T={
 fr:{tagline:'Les mots de la beauté coréenne, expliqués en français',n1:'Lexique',n2:'Éléments de formation',n3:'Faux amis',n4:'Chiffres',n5:'À propos',
  q:'Mot coréen, romanisation ou mot français',allcat:'Tous les domaines',allform:'Toutes les formations',
  count:n=>n+(n>1?' entrées':' entrée'),more:'Afficher la suite',none:'Aucune entrée ne correspond. Essayez un autre mot ou retirez un filtre.',
  back:'← Liste',mean:'Sens (coréen)',note:'Remarque',defl:'Définition',frl:'Équivalent français',ex:'Exemple',gram:'Formation',ing:'Ingrédient',inci:'Nom INCI',sub:'Sous cette entrée',see:'Voir aussi',exs:'Mots formés',
  faux:'Faux ami',unit:{'단어':'mot','구':'locution','문장':'phrase'},
  pos:{'명사':'nom','동사':'verbe','형용사':'adjectif','부사':'adverbe','어근':'radical'},
  eo:{'고유어':'mot coréen natif','한자어':'mot sino-coréen','외래어':'emprunt','혼종어':'mot hybride'},
  form:{'단일어':'mot simple','합성어':'mot composé','파생어':'mot dérivé','축약어(두음절어)':'abréviation syllabique','축약어(절단어)':'troncation','축약어(혼성어)':'mot-valise','축약어(두문자어)':'sigle','구':'locution'},
  rel:{'동의어':'synonyme','준말':'abréviation','원말':'forme longue','변이형':'variante','파생형':'dérivé','연어':'collocation','다의 항목(뜻 2)':'autre sens','하위어(참고)':'hyponyme','관련어(참고)':'mot lié'},
  cat:{skin:'Soins du visage',clean:'Nettoyage',mask:'Masques et pads',sun:'Solaires',base:'Teint',eye:'Yeux',lip:'Lèvres',hair:'Cheveux',nail:'Ongles',body:'Corps et parfum',tool:'Outils, appareils, actes esthétiques',gen:'Général et argot'},
  foot:'Projet de groupe du cours « Français et technologies numériques », 2026. '+(D.live?'Données lues en direct dans Google Sheets.':'Version de travail du '+M.date+'.'),
  auto:'Romanisation générée automatiquement, à vérifier.'},
 ko:{tagline:'프랑스어로 풀어 쓴 한국 뷰티의 말들',n1:'사전',n2:'조어 요소',n3:'헷갈리기 쉬운 말',n4:'통계',n5:'소개',
  q:'한국어 단어, 초성(ㅎㅈㅁ), 프랑스어, 로마자로 검색',allcat:'모든 분야',allform:'모든 단어 형성',
  count:n=>n+'개 항목',more:'더 보기',none:'맞는 항목이 없습니다. 다른 말로 찾거나 필터를 지워 보세요.',
  back:'← 목록',mean:'뜻',note:'주목할 점',defl:'프랑스어 뜻풀이',frl:'프랑스어 대응어',ex:'예문',gram:'단어 구성',ing:'성분 설명',inci:'국제 성분명(INCI)',sub:'하위 항목',see:'참고',exs:'만들어진 말',
  faux:'헷갈리기 쉬운 말',unit:{'단어':'단어','구':'구','문장':'문장'},pos:{},eo:{},form:{},rel:{},
  cat:{skin:'스킨케어',clean:'클렌징',mask:'마스크팩·패드',sun:'선케어',base:'베이스 메이크업',eye:'아이 메이크업',lip:'립 메이크업',hair:'헤어',nail:'네일',body:'바디·향수',tool:'도구·기기·시술',gen:'공통·은어'},
  foot:'「프랑스어와 디지털기술」 수업 조별 과제, 2026. '+(D.live?'구글 시트에서 실시간으로 읽은 내용입니다.':'작업본 '+M.date+'.'),
  auto:'로마자 표기는 자동 변환이라 검수가 필요합니다.'}
};
let L='fr'; try{L=localStorage.getItem('lex-lang')||'fr'}catch(e){}
const t=k=>T[L][k], tr=(g,v)=>(T[L][g]&&T[L][g][v])||v;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fes=s=>esc(String(s==null?'':s).replace(/«\s*/g,'«\u00a0').replace(/\s*»/g,'\u00a0»').replace(/(\S)\s*([:;?!])(\s|$)/g,(m,a,p,z)=>(/[0-9a-z]$/i.test(a)&&p===':'&&z===''?m:a+'\u202f'+p+z)).replace(/\s+([:;?!])/g,'\u202f$1'));

const st={q:'',cat:'',form:'',cho:'',n:120,cur:null};
const CATS=['skin','clean','mask','sun','base','eye','lip','hair','nail','body','tool','gen'];
const FORMS=['단일어','합성어','파생어','축약어(두음절어)','축약어(절단어)','축약어(혼성어)','축약어(두문자어)','구'];

function filtered(){
  const q=fold(st.q), ko=/[\u3131-\u318e\uac00-\ud7a3]/.test(st.q);
  let r=E.filter(e=>e.k!=='a'&&(!st.cat||e.cat===st.cat)&&(!st.form||e.form===st.form)&&(!st.cho||e._i===st.cho)&&(!q||(ko?[e._s[0],e._s[1]]:e._s.slice(2)).some(x=>x&&x.includes(q))));
  if(q){const sc=ko?(e=>e._s[0]===q?0:e._s[0].startsWith(q)?1:e._s[1].startsWith(q)?2:3):(e=>(e._s[2]||'').startsWith(q)?0:(e._s[3]||'').startsWith(q)?1:(e._s[2]||'').includes(q)?2:3);
    r.sort((a,b)=>sc(a)-sc(b)||coll.compare(a.w,b.w));}
  else r.sort((a,b)=>coll.compare(a.w,b.w));
  return r;
}
function renderList(){
  const r=filtered(); $('count').textContent=t('count')(r.length);
  $('list').innerHTML=r.length?r.slice(0,st.n).map(e=>'<li'+(e.k==='s'?' class="sub"':'')+'><button type="button" data-id="'+e.id+'"'+(st.cur===e.id?' aria-current="true"':'')+'><span class="kw">'+esc(e.w)+(e.rom&&e.k!=='a'?'<span class="rm" lang="ko-Latn">'+esc(e.rom)+'</span>':'')+'</span><span class="fw">'+fes(e.fr)+'</span></button></li>').join(''):'<li style="padding:14px 12px;color:var(--muted)">'+t('none')+((st.cat||st.form||st.cho)?' <button type="button" id="resetf" style="margin-top:8px;border:1px solid var(--line);border-radius:999px;background:var(--lime);color:#151515;padding:4px 12px;cursor:pointer">'+(L==='ko'?'필터 모두 지우기':'Retirer les filtres')+'</button>':'')+'</li>';
  $('more').hidden=r.length<=st.n; $('more').textContent=t('more')+' ('+(r.length-st.n)+')';
  return r;
}
function linkBtns(a){return '<div class="links">'+a.map(e=>'<button type="button" data-id="'+e.id+'">'+esc(e.w)+(e.rel?' <small>· '+esc(tr('rel',e.rel))+'</small>':'')+'</button>').join('')+'</div>'}
function renderEntry(e){
  const p=$('entryPanel'); if(!e){p.innerHTML='';return}
  const chips=[];
  if(e.faux) chips.push('<span class="chip faux">'+t('faux')+'</span>');
  if(e.pos) chips.push('<span class="chip">'+esc(tr('pos',e.pos))+'</span>');
  if(e.unit&&e.unit!=='단어'&&e.k!=='a') chips.push('<span class="chip">'+esc(tr('unit',e.unit))+'</span>');
  if(e.eo) chips.push('<span class="chip">'+esc(tr('eo',e.eo))+'</span>');
  if(e.form&&e.form!=='구') chips.push('<span class="chip">'+esc(tr('form',e.form))+'</span>');
  if(e.k==='a') chips.push('<span class="chip">'+t('n2')+'</span>'); else chips.push('<span class="chip cat">'+esc(T[L].cat[e.cat])+'</span>');
  let h='<button type="button" class="back" id="back">'+t('back')+'</button><h2 class="hw" lang="ko">'+esc(e.w)+'</h2>'+(e.rom?'<p class="rom">'+esc(e.rom)+'</p>':'<p class="rom"></p>')+'<div class="chips">'+chips.join('')+'</div>';
  if(e.fr||e.frdef) h+='<div class="frbox"><p class="lbl">'+t('frl')+'</p><p class="fr" lang="fr">'+fes(e.fr)+(e.frpos?'<small>'+esc(e.frpos)+'</small>':'')+'</p>'+(e.frdef?'<p class="lbl" style="margin-top:12px">'+t('defl')+'</p><p class="def" lang="fr" style="margin-top:2px">'+fes(e.frdef)+'</p>':'')+'</div>';
  h+='<dl class="more">';
  if(e.note) h+='<dt>'+t('note')+'</dt><dd lang="fr">'+fes(e.note)+'</dd>';
  if(e.ex) h+='<dt>'+(e.k==='a'?t('exs'):t('ex'))+'</dt><dd><div class="ex" lang="ko">'+esc(e.k==='a'?e.ex.replace(/^예:\s*/,''):e.ex)+'</div>'+(e.exfr&&e.k!=='a'?'<div class="exfr" lang="fr">'+fes(e.exfr)+'</div>':'')+'</dd>';
  if(L==='ko'){ if(e.memo) h+='<dt>'+t('gram')+'</dt><dd lang="ko">'+esc(e.memo)+'</dd>'; }
  else if(e.memofr||e.memo) h+='<dt>'+t('gram')+'</dt><dd lang="'+(e.memofr?'fr':'ko')+'">'+fes(e.memofr||e.memo)+'</dd>';
  if(e.ing){const ip=e.ing.split(/\s*Français\s*:\s*/), iv=L==='ko'?ip[0].replace(/^한국어\s*:\s*/,''):(ip[1]||ip[0]); h+='<dt>'+t('ing')+'</dt><dd lang="'+(L==='ko'?'ko':'fr')+'">'+(L==='ko'?esc(iv):fes(iv))+'</dd>';}
  if(e.inci) h+='<dt>'+t('inci')+'</dt><dd>'+esc(e.inci)+'</dd>';
  const ks=(kids[e.w]||[]).filter(x=>x.id!==e.id), subs=ks.filter(x=>x.k==='s'), rel=ks.filter(x=>x.k!=='s');
  if(subs.length) h+='<dt>'+t('sub')+'</dt><dd>'+linkBtns(subs)+'</dd>';
  const see=rel.slice(); if(e.par&&byW[e.par]&&byW[e.par].id!==e.id) see.unshift(Object.assign({},byW[e.par],{rel:e.rel}));
  if(see.length) h+='<dt>'+t('see')+'</dt><dd>'+linkBtns(see)+'</dd>';
  h+='</dl>';
  p.innerHTML=h;
}
function show(id,push){
  const e=byId[id]; if(!e) return;
  st.cur=id; renderEntry(e); $('desk').classList.add('reading');
  document.querySelectorAll('#list button[aria-current]').forEach(b=>b.removeAttribute('aria-current'));
  const b=document.querySelector('#list button[data-id="'+id+'"]'); if(b) b.setAttribute('aria-current','true');
  if(push!==false){ try{history.replaceState(null,'','#e-'+id)}catch(x){location.hash='e-'+id} }
  if(window.matchMedia('(max-width:820px)').matches) window.scrollTo(0,0);
}
function bars(pairs){const mx=Math.max.apply(null,pairs.map(p=>p[1]));return '<div class="bars">'+pairs.map(p=>'<span>'+esc(p[0])+'</span><i style="width:'+(p[1]/mx*100).toFixed(1)+'%"></i><span class="n">'+p[1]+'</span>').join('')+'</div>'}
function tally(key,order,grp){const c={};E.filter(e=>e.k!=='a'&&e[key]).forEach(e=>c[e[key]]=(c[e[key]]||0)+1);return (order||Object.keys(c)).filter(k=>c[k]).map(k=>[grp?tr(grp,k):k,c[k]])}
function renderPages(){

  $('v-elements').innerHTML='<h2>'+(ko?'조어 요소':'Éléments de formation')+'</h2><p class="lead">'+(ko?'한국 뷰티 신조어에 되풀이해 쓰이는 접사와 요소입니다. 이 요소를 알면 처음 보는 말도 뜻을 짐작할 수 있습니다.':'Affixes et éléments qui reviennent dans les néologismes coréens de la beauté. Les connaître permet de deviner le sens d\'un mot jamais vu.')+'</p><div class="cards">'+aff.map(e=>'<div class="panel acard"><h3 class="hw" style="font-size:1.5rem" lang="ko">'+esc(e.w)+'</h3><span class="t">'+(ko?esc((e.memo||'').replace('유형: ','')):fes(e.memofr||''))+'</span><p lang="fr">'+fes(e.frdef)+'</p>'+''+'<p class="ex" lang="ko">'+esc((e.ex||'').replace(/^예:\s*/,''))+'</p></div>').join('')+'</div>';
  const fx=E.filter(e=>e.faux).sort((a,b)=>coll.compare(a.w,b.w));
  $('v-faux-amis').innerHTML='<h2>'+(ko?'헷갈리기 쉬운 말':'Faux amis')+'</h2><p class="lead">'+(ko?'프랑스어·영어 단어와 모양은 비슷하거나 뜻을 짐작하기 쉽지만, 한국 뷰티에서는 다른 뜻으로 쓰이는 말입니다. 프랑스어로 옮길 때 특히 주의해야 합니다.':'Mots qui ressemblent au français ou à l\'anglais mais dont le sens a changé en coréen.')+'</p><div class="tbl"><table><thead><tr><th>'+(ko?'한국어':'Coréen')+'</th><th>'+(ko?'프랑스어 대응어':'Équivalent français')+'</th><th>'+(ko?'설명':'Explication')+'</th></tr></thead><tbody>'+fx.map(e=>'<tr><td class="k"><button type="button" data-id="'+e.id+'" lang="ko">'+esc(e.w)+'</button></td><td lang="fr">'+fes(e.fr)+'</td><td lang="fr">'+fes(e.frdef)+'</td></tr>').join('')+'</tbody></table></div>';
  $('v-chiffres').innerHTML='<h2>'+(ko?'통계':'Le lexique en chiffres')+'</h2><div class="stat"><div class="panel"><b>'+M.head.toLocaleString(L)+'</b><span>'+(ko?'표제어':'entrées principales')+'</span></div><div class="panel"><b>'+M.sub+'</b><span>'+(ko?'하위 항목':'sous-entrées')+'</span></div><div class="panel"><b>'+M.aff+'</b><span>'+(ko?'조어 요소':'éléments de formation')+'</span></div><div class="panel"><b>'+M.excluded.toLocaleString(L)+'</b><span>'+(ko?'검토 후 제외':'termes écartés après examen')+'</span></div></div>'
   +'<h3>'+(ko?'분야':'Domaines')+'</h3>'+bars(tally('cat',CATS).map(p=>[T[L].cat[p[0]],p[1]]))
   +'<h3>'+(ko?'어종':'Origine des mots')+'</h3>'+bars(tally('eo',['외래어','혼종어','한자어','고유어'],'eo'))

   +'<h3>'+(ko?'품사':'Catégories grammaticales')+'</h3>'+bars(tally('pos',['명사','동사','형용사','부사'],'pos'));
  const ABOUT={ko:"<h2>소개</h2>\n<p class=\"lead\">한국 화장품의 상세페이지와 후기를 읽는 프랑스어 사용자를 위해 만든 한국어–프랑스어 뷰티 용어 사전입니다. 연세대학교 「프랑스어와 디지털기술」 수업의 조별 과제로, 세 명이 2026년 11월에 함께 만들었습니다.</p>\n<h3>왜 이 사전이 필요한가</h3>\n<p>한국 뷰티 제품은 프랑스에서도 많이 팔리지만, 제품 설명과 후기에는 일반 사전으로 풀리지 않는 말이 가득합니다. 「화잘먹」처럼 줄여 만든 말, 「수부지」처럼 피부 상태를 묶어 부르는 말, 「물광」「속광」처럼 광의 종류를 세세하게 나누는 말, 「스킨」「매직」처럼 영어에서 왔지만 뜻이 바뀐 말이 그렇습니다. 이 사전은 그런 말만 골라, 프랑스어 사용자가 실제 문장을 이해할 수 있도록 대응어와 뜻풀이, 예문을 붙였습니다.</p>\n<h3>무엇을 싣고 무엇을 뺐나</h3>\n<ul>\n<li><b>실은 말</b>: 한국 특유의 표현과 신조어, 업계 용어, 성분 이름, 프랑스어·영어와 모양은 비슷하지만 뜻이 다른 말.</li>\n<li><b>뺀 말</b>: 「크림」처럼 프랑스어로 그대로 통하는 말, 단어를 단순히 이어 붙인 표현, 제품명과 광고 문구.</li>\n<li>후보 {total}개를 모은 뒤 세 차례 조 회의에서 {excluded}개를 제외했고, 표제어 {head}개를 실었습니다.</li>\n</ul>\n<h3>항목 읽는 법</h3>\n<ul>\n<li><b>표제어와 로마자</b>: 표제어 아래 기울인 글자는 국립국어원 「국어의 로마자 표기법」(2000)에 따른 표기입니다.</li>\n<li><b>꼬리표</b>: 품사, 단위(구·문장), 어종(고유어·한자어·외래어·혼종어), 단어 형성(단일어·합성어·파생어·축약어)을 차례로 보여 줍니다. 분류는 「표준국어대사전」을 기준으로 했고, 사전에 없는 「-템」「-러」 같은 요소가 붙은 말은 합성어로 보았습니다.</li>\n<li><b>프랑스어 대응어</b>: 프랑스에서 실제로 쓰는 표현이 있으면 그 말을, 없으면 뜻을 옮긴 표현을 적었습니다.</li><li><b>프랑스어 품사·성</b>: 프랑스어 사전 방식을 따라, 여러 단어로 된 명사구도 중심 명사의 성·수로 표시했습니다(예: <i>crème hydratante</i> n.f., <i>faux cils</i> n.m.pl.). 동사구는 loc.v., 형용사구는 loc.adj., 부사구는 loc.adv., 문장 형태의 관용 표현은 expr.로 적었습니다. 뜻을 풀어 옮긴 대응어도 명사로 쓰일 때의 성을 표시했습니다.</li>\n<li><b>예문</b>: 조원이 쓰거나 다듬은 한국어 예문과 그 프랑스어 번역입니다. 번역에는 해당 대응어가 반드시 들어가도록 했습니다. 수집한 후기 원문은 저작권을 고려해 그대로 싣지 않았습니다.</li>\n<li><b>하위 항목·참고</b>: 준말, 변이형, 연어처럼 함께 알아 두면 좋은 말을 표제어 아래에 묶었습니다.</li>\n</ul>\n<h3>만든 과정</h3>\n<ol>\n<li>올리브영 상품 목록과 후기, 브랜드 용어 자료에서 후보를 모았습니다.</li>\n<li>세 명이 분야를 나누어 맡고, 뺄 말은 빨간색, 애매한 말은 노란색으로 표시하며 검토했습니다.</li>\n<li>조 회의에서 표시된 말을 하나씩 보며 유지·제외·보류를 결정했고, 모자란 만큼 한국 특유의 표현을 더 모았습니다.</li>\n<li>품사와 단어 형성 표기 기준을 정해 전체에 맞췄습니다.</li>\n<li>구글 시트를 원본으로 삼아 웹사이트와 연결하고, 세 명이 시트를 함께 고치며 사이트에 바로 반영했습니다.</li>\n</ol>\n<h3>AI 활용과 사용한 프롬프트</h3>\n<p>수집 보조, 대응어·뜻풀이·예문의 초안, 문법 분류 초안, 웹사이트 제작에 생성형 AI(Anthropic의 Claude)를 썼습니다. 무엇을 싣고 뺄지와 문법 기준은 조원이 회의에서 정했고, AI가 만든 내용은 조원이 검토했습니다. 주요 프롬프트는 다음과 같습니다(보고서용으로 문장을 다듬음).</p>\n<ol class=\"prompts\">\n<li><b>독자와 선별 기준</b>이 용어집의 독자는 한국어 뷰티 용어를 찾아보는 프랑스어 사용자다. 「크림」처럼 누구나 아는 일반 명사는 빼고, 「화잘먹」처럼 그대로 옮기기 어려운 한국 특유의 용어는 넣는 기준으로 목록을 정리해 달라.</li>\n<li><b>보충 수집</b>지금 목록과 겹치지 않게 보충 수집을 하라. 「깐달걀 피부」처럼 특이하거나 한국에서만 쓰는 느낌의 용어를 우선한다.</li>\n<li><b>분담</b>1,000개가 넘는 용어를 세 명이 공정하게 나누어 검토할 수 있도록 분담표를 만들어 달라.</li>\n<li><b>담당 파트 검토</b>맡은 부분의 용어를 검토해 뺄 용어는 빨간색, 애매한 용어는 노란색으로 표시하고, 한국어 예문을 ~다체로 써 달라. 프랑스어 대응어는 프랑스에서 실제로 쓰는 표현이 있는지 확인하고, 성분 용어는 어떤 성분인지 프랑스어로 풀어 써 달라.</li>\n<li><b>회의용 정리</b>조가 결정한 유지·제외를 반영하고, 회의에서 함께 내려 보며 결정할 수 있도록 검토 목록을 150줄 안쪽으로 줄여 달라.</li>\n<li><b>문법 표기</b>품사를 명사·형용사로만 끝내지 않고 합성어·파생어·외래어·혼종어, 접두사·접미사 여부까지 표준국어대사전을 기준으로 정리하고, 판단이 애매한 항목은 조가 결정할 수 있게 따로 모아 달라.</li>\n<li><b>웹사이트</b>정리한 용어집을 외부인도 볼 수 있는 웹사이트로 만들고, 조원들이 구글 시트에서 고치면 사이트에 반영되도록 연결해 달라.</li>\n<li><b>예문 번역</b>모든 한국어 예문을 프랑스어로 번역하되, 번역문에는 그 항목의 프랑스어 대응어가 반드시 들어가게 해 달라.</li>\n</ol>\n<h3>한계</h3>\n<p>신조어는 뜻과 쓰임이 빠르게 바뀝니다. 프랑스어 대응어 가운데 일부는 현지에서 굳어진 말이 아니라 뜻을 풀어 쓴 표현입니다. 시술 관련 항목은 용어 설명일 뿐 의료 정보가 아닙니다. 고칠 점을 알려 주시면 반영하겠습니다.</p>",fr:"<h2>À propos</h2>\n<p class=\"lead\">Un lexique coréen-français de la beauté, pensé pour les francophones qui lisent des fiches produits et des avis de cosmétiques coréens. Il a été réalisé en novembre 2026 par un groupe de trois étudiants dans le cadre du cours « Français et technologies numériques » de l’université Yonsei.</p>\n<h3>Pourquoi ce lexique</h3>\n<p>Les cosmétiques coréens se vendent largement en France, mais leurs descriptions et leurs avis regorgent de mots qu’aucun dictionnaire général n’explique : abréviations comme 화잘먹, termes qui désignent un état de peau précis comme 수부지, nuances d’éclat comme 물광 ou 속광, emprunts à l’anglais dont le sens a changé comme 스킨 ou 매직. Ce lexique ne retient que ces mots et leur associe un équivalent, une définition et un exemple traduit.</p>\n<h3>Ce qui a été retenu, ce qui a été écarté</h3>\n<ul>\n<li><b>Retenus</b> : expressions propres à la Corée, néologismes, vocabulaire du secteur, noms d’ingrédients, faux amis.</li>\n<li><b>Écartés</b> : mots transparents en français (크림, « crème »), simples juxtapositions, noms de produits et slogans.</li>\n<li>Sur {total} candidats, {excluded} ont été écartés en trois réunions ; le lexique compte {head} entrées principales.</li>\n</ul>\n<h3>Lire une entrée</h3>\n<ul>\n<li><b>Mot-vedette et romanisation</b> : la romanisation suit le système officiel coréen (« romanisation révisée », 2000).</li>\n<li><b>Étiquettes</b> : catégorie grammaticale, unité (locution, phrase), origine du mot (coréen natif, sino-coréen, emprunt, hybride) et mode de formation (simple, composé, dérivé, abréviation), selon le Dictionnaire standard de la langue coréenne. Les mots formés avec des éléments absents du dictionnaire (-템, -러…) sont traités comme des composés.</li>\n<li><b>Équivalent français</b> : le terme en usage en France quand il existe, sinon une traduction du sens.</li><li><b>Catégorie et genre</b> : comme dans les dictionnaires français, les groupes nominaux portent le genre et le nombre de leur nom principal (<i>crème hydratante</i> n.f., <i>faux cils</i> n.m.pl.) ; loc.v., loc.adj. et loc.adv. désignent les locutions verbales, adjectivales et adverbiales, expr. les expressions de forme phrastique. Les équivalents qui paraphrasent le sens suivent la même règle.</li>\n<li><b>Exemples</b> : phrases rédigées ou revues par le groupe, avec leur traduction ; chaque traduction contient l’équivalent français de l’entrée. Les avis collectés ne sont pas reproduits tels quels, par respect du droit d’auteur.</li>\n<li><b>Sous-entrées et renvois</b> : abréviations, variantes et collocations sont regroupées sous leur mot-vedette.</li>\n</ul>\n<h3>Méthode</h3>\n<ol>\n<li>Relevé des candidats dans les listes de produits et les avis d’Olive Young et dans des glossaires de marques.</li>\n<li>Répartition par domaine entre les trois membres ; marquage en rouge (à écarter) et en jaune (à discuter).</li>\n<li>Décision collective en réunion (garder, écarter, reporter), puis collecte complémentaire d’expressions propres à la Corée.</li>\n<li>Harmonisation des étiquettes grammaticales.</li>\n<li>Mise en ligne : le site lit directement une feuille Google Sheets que le groupe corrige à plusieurs.</li>\n</ol>\n<h3>Usage de l’IA et consignes utilisées</h3>\n<p>Une IA générative (Claude, d’Anthropic) a servi à la collecte, aux premières versions des équivalents, définitions, exemples et étiquettes grammaticales, et à la réalisation du site. Le choix des entrées et les critères grammaticaux ont été décidés par le groupe, qui a relu tout le contenu produit. Principales consignes (reformulées) :</p>\n<ol class=\"prompts\">\n<li><b>Public et critères</b>Le lecteur est un francophone qui cherche un terme coréen de la beauté. Écarter les noms communs que tout le monde connaît (« crème ») et garder les termes propres à la Corée, difficiles à traduire tels quels (화잘먹).</li>\n<li><b>Collecte complémentaire</b>Compléter la liste sans doublons, en privilégiant les expressions insolites ou typiquement coréennes, comme « peau d’œuf écalé ».</li>\n<li><b>Répartition</b>Répartir équitablement plus de 1 000 termes entre trois personnes.</li>\n<li><b>Relecture</b>Marquer en rouge les termes à écarter et en jaune les cas douteux, rédiger des exemples coréens au style écrit, vérifier que l’équivalent français est bien en usage et expliquer chaque ingrédient en français.</li>\n<li><b>Préparation des réunions</b>Appliquer les décisions du groupe et réduire la liste à examiner à moins de 150 lignes.</li>\n<li><b>Grammaire</b>Classer chaque mot selon le Dictionnaire standard (composé, dérivé, emprunt, hybride, préfixe, suffixe) et isoler les cas douteux pour décision collective.</li>\n<li><b>Site web</b>Faire du lexique un site public, relié à une feuille Google Sheets que le groupe peut modifier.</li>\n<li><b>Traduction des exemples</b>Traduire chaque exemple en français en y faisant figurer l’équivalent français de l’entrée.</li>\n</ol>\n<h3>Limites</h3>\n<p>Le sens des néologismes évolue vite. Certains équivalents sont des paraphrases plutôt que des termes établis. Les entrées sur les actes esthétiques décrivent des mots, non des traitements médicaux.</p>"};

const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ', JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const VC={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};
const JC={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
const JS={}; Object.keys(JC).forEach(k=>{JS[JC[k]]=[k[0],k[1]]});
const isV=x=>JUNG.includes(x);
function hcompose(seq){let out='',c=null,v=null,j=null;
  const fl=()=>{if(c&&v)out+=String.fromCharCode(0xAC00+(CHO.indexOf(c)*21+JUNG.indexOf(v))*28+JONG.indexOf(j||''));else out+=(c||'')+(v||'');c=v=j=null;};
  for(const x of seq){
    if(isV(x)){
      if(c&&!v){v=x}
      else if(v&&!j){const m=VC[v+x];if(m)v=m;else{fl();v=x}}
      else if(c&&v&&j){let nc;const s=JS[j];if(s){j=s[0];nc=s[1]}else{nc=j;j=null}fl();c=nc;v=x}
      else{fl();v=x}
    }else{
      if(!c&&!v){c=x}
      else if(!v||!c){fl();c=x}
      else if(!j){if(JONG.includes(x)&&x!=='ㄸ'&&x!=='ㅃ'&&x!=='ㅉ')j=x;else{fl();c=x}}
      else{const m=JC[j+x];if(m)j=m;else{fl();c=x}}
    }}
  fl();return out;}

$('kbd').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;const k=b.dataset.k,q=$('q');
  if(q.value!==kbase+hcompose(kseq)){kbase=q.value;kseq=[];}
  if(k==='shift'){kshift=!kshift;drawKbd();return}
  if(k==='close'){toggleKbd(false);return}
  if(k==='clear'){kbase='';kseq=[];kset('');return}
  if(k==='space'){kbase=kbase+hcompose(kseq)+' ';kseq=[];kset(kbase);return}
  if(k==='back'){if(kseq.length)kseq.pop();else kbase=kbase.slice(0,-1);kset(kbase+hcompose(kseq));return}
  kseq.push(k);if(kshift){kshift=false;drawKbd()}kset(kbase+hcompose(kseq));});
function toggleKbd(on){$('kbd').hidden=!on;$('kbbtn').setAttribute('aria-pressed',on);if(on){kbase=$('q').value;kseq=[];drawKbd()}}
$('kbbtn').addEventListener('click',()=>toggleKbd($('kbd').hidden));
$('acc').innerHTML='<span>'+'Accents</span>'+['é','è','ê','à','â','ç','î','ï','ô','û','ù','œ'].map(c=>'<button type="button" data-a="'+c+'">'+c+'</button>').join('');
$('acc').addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;const q=$('q'),s=q.selectionStart??q.value.length,en=q.selectionEnd??s;q.value=q.value.slice(0,s)+b.dataset.a+q.value.slice(en);q.focus();q.setSelectionRange(s+1,s+1);st.q=q.value;st.n=120;renderList()});
$('cho').innerHTML=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'].map(c=>'<button type="button" aria-pressed="false" data-c="'+c+'">'+c+'</button>').join('');
$('q').addEventListener('input',e=>{st.q=e.target.value;st.n=120;renderList()});
$('list').addEventListener('click',e=>{if(!e.target.closest('#resetf'))return;st.cat=st.form=st.cho='';$('fcat').value='';$('fform').value='';document.querySelectorAll('#cho button').forEach(x=>x.setAttribute('aria-pressed','false'));st.n=120;renderList();});
$('fcat').addEventListener('change',e=>{st.cat=e.target.value;st.n=120;renderList()});
$('fform').addEventListener('change',e=>{st.form=e.target.value;st.n=120;renderList()});
$('cho').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.cho=st.cho===b.dataset.c?'':b.dataset.c;st.n=120;
  document.querySelectorAll('#cho button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===st.cho));renderList()});
const goFirst=()=>{const r=filtered();if(r.length)show(r[0].id)};
$('go').addEventListener('click',goFirst);
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();goFirst()}});
$('more').addEventListener('click',()=>{st.n+=200;renderList()});
document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-id]');
  if(b){ const en=byId[b.dataset.id]; if(en&&en.k==='a'){setView('elements');return}
    if($('v-lexique').hidden) setView('lexique');
    show(b.dataset.id); return; }
  if(e.target.id==='back'){ $('desk').classList.remove('reading'); try{history.replaceState(null,'','#lexique')}catch(x){} }
});
const applyTheme=d=>{document.documentElement.dataset.theme=d?'dark':'light';$('theme').textContent=d?'☀':'☾';$('theme').setAttribute('aria-pressed',d)};
let DK=false; try{DK=localStorage.getItem('lex-theme')==='dark'}catch(e){} applyTheme(DK);
$('theme').addEventListener('click',()=>{DK=!DK;applyTheme(DK);try{localStorage.setItem('lex-theme',DK?'dark':'light')}catch(e){}});
$('lfr').addEventListener('click',()=>{L='fr';try{localStorage.setItem('lex-lang',L)}catch(e){}applyLang()});
$('lko').addEventListener('click',()=>{L='ko';try{localStorage.setItem('lex-lang',L)}catch(e){}applyLang()});
document.querySelector('nav.tabs').addEventListener('click',e=>{const a=e.target.closest('a[data-v]');if(!a)return;e.preventDefault();
  if(a.dataset.v==='lexique')$('desk').classList.remove('reading');setView(a.dataset.v);try{history.replaceState(null,'','#'+a.dataset.v)}catch(x){}window.scrollTo(0,0)});
window.addEventListener('hashchange',route);
const first=renderList()[0]; st.cur=(byW['화잘먹']||first).id;
applyLang(); route();
if(!location.hash||location.hash==='#lexique') $('desk').classList.remove('reading');
}
})();
